// ---------- perguntas de escolha múltipla ----------
// Banco: as perguntas escritas (perguntas.js) mais as geradas a partir da ficha
// (conceitos, citações e datas). A primeira opção de cada pergunta é a certa;
// baralham-se ao mostrar. O progresso vive em hc:quiz = { id: {n, ok, last, t} }.
const qHash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const anoDe = k => { const mm = String(k).match(/(1[89]\d\d|20\d\d)/); return mm ? +mm[1] : null; };
const fonteCurta = q => strip(q.fonte).split(/,| in |—/)[0].trim();
let BANCO = null;
function banco(){
  if (BANCO) return BANCO;
  const out = (window.HC_PERGUNTAS || []).map(x => ({ id: "e" + qHash(x.q), p: x.p, t: x.t, q: x.q, o: x.o, e: x.e || "", g: "escrita" }));
  const todosConc = DATA.capitulos.flatMap(c => c.conceitos);
  const todasFontes = [...new Set(DATA.capitulos.flatMap(c => c.citacoes.map(fonteCurta)).filter(Boolean))];
  DATA.capitulos.forEach(c => {
    c.conceitos.forEach((k, i) => {
      const outros = c.conceitos.filter(x => x !== k);
      const pool = outros.length >= 3 ? outros : outros.concat(todosConc.filter(x => !c.conceitos.includes(x)));
      const d = shuffle(pool).slice(0, 3);
      if (d.length < 3) return;
      out.push({ id: `c${c.n}-${i}`, p: c.n, t: "conceito", g: "conceitos", q: `O que é «${strip(k.k)}»?`, o: [k.v, ...d.map(x => x.v)], e: `Conceito-chave da ficha do Ponto ${c.n}.` });
      out.push({ id: `k${c.n}-${i}`, p: c.n, t: "conceito", g: "conceitos", q: `Que conceito corresponde a esta definição?<blockquote>${k.v}</blockquote>`, o: [k.k, ...d.map(x => x.k)], e: `Conceito-chave da ficha do Ponto ${c.n}.` });
    });
    c.citacoes.forEach((q, i) => {
      const a = fonteCurta(q); if (!a) return;
      const mesmo = [...new Set(c.citacoes.map(fonteCurta).filter(n => n && n !== a))];
      const d = shuffle(mesmo).slice(0, 3);
      if (d.length < 3) d.push(...shuffle(todasFontes.filter(n => n !== a && !d.includes(n))).slice(0, 3 - d.length));
      if (d.length < 3) return;
      out.push({ id: `q${c.n}-${i}`, p: c.n, t: "autor", g: "citacoes", q: `Quem é o autor, ou qual é a fonte, deste excerto?` + q.paras.map(p => `<blockquote${q.tipo === "documento" ? ' class="doc"' : ''}>${p}</blockquote>`).join(""), o: [a, ...d], e: `${q.fonte} · Ponto ${c.n}${q.seccao ? " · secção «" + q.seccao.replace(/^\d+\.\s*/, "") + "»" : ""}` });
    });
    c.cron.forEach((ev, i) => {
      if (!anoDe(ev.k)) return;
      const outras = shuffle(c.cron.filter(o => o.k !== ev.k && anoDe(o.k))).slice(0, 3);
      if (outras.length < 3) return;
      out.push({ id: `d${c.n}-${i}`, p: c.n, t: "data", g: "datas", q: `Quando? <em>${ev.v.replace(/\b(1[89]\d\d|20\d\d)\b/g, "____")}</em>`, o: [ev.k, ...outras.map(o => o.k)], e: `${ev.k}: ${ev.v}` });
    });
  });
  BANCO = out; return out;
}
const GRUPOS = [["escrita", "Perguntas escritas sobre a matéria"], ["conceitos", "Conceitos da ficha (geradas)"], ["citacoes", "Citações → autor (geradas)"], ["datas", "Datas da cronologia (geradas)"]];
const TIPOS = { facto: "facto", data: "data", conceito: "conceito", autor: "autor e fonte", mecanismo: "mecanismo" };
// Dias de estudo que restam, contando com o de hoje: 4 dias e umas horas são 5 sessões possíveis.
const diasParaTeste = () => { const d = (new Date(DATA.teste.data) - new Date()) / 864e5; return d <= 0 ? 0 : Math.floor(d) + 1; };
function quizCfg(){ const d = { pontos: [...allSel()], n: 20, modo: "pendentes", grupos: ["escrita", "conceitos", "citacoes", "datas"] }; return Object.assign(d, store.get("quiz_cfg", {})); }
function quizPool(cfg, prog){
  return banco().filter(x => x.p <= SCOPE && cfg.pontos.includes(x.p) && cfg.grupos.includes(x.g)).map(x => ({ ...x, r: prog[x.id] }));
}
function escolherRonda(pool, cfg){
  const feita = x => x.r && x.r.n > 0, errada = x => x.r && x.r.n > 0 && !x.r.last;
  let lista;
  if (cfg.modo === "erradas") lista = shuffle(pool.filter(errada));
  else if (cfg.modo === "todas") lista = shuffle(pool);
  else { // pendentes: nunca feitas, depois erradas, depois as certas há mais tempo
    const nunca = shuffle(pool.filter(x => !feita(x))), err = shuffle(pool.filter(errada));
    const certas = pool.filter(x => feita(x) && x.r.last).sort((a, b) => a.r.t - b.r.t);
    lista = nunca.concat(err, certas);
  }
  return cfg.n === "todas" ? lista : lista.slice(0, +cfg.n);
}
function perguntas(m, ronda){
  const cfg = quizCfg(); cfg.pontos = cfg.pontos.filter(n => n <= SCOPE); if (!cfg.pontos.length) cfg.pontos = [...allSel()];
  const prog = store.get("quiz", {});
  if (ronda) { jogarRonda(m, ronda); return; }
  const pool = quizPool(cfg, prog);
  const feitas = pool.filter(x => x.r && x.r.n > 0), sabidas = feitas.filter(x => x.r.last), erradas = feitas.filter(x => !x.r.last);
  const porFazer = pool.length - feitas.length, dias = diasParaTeste();
  const top = el("div", { class: "card" });
  top.innerHTML = `<h2 style="margin-top:0">Perguntas de escolha múltipla</h2>
    <p class="muted">Uma pergunta de cada vez, correção imediata e explicação. As perguntas que nunca fez aparecem primeiro; as que errou voltam antes das que acertou. Teclas <kbd>1</kbd> a <kbd>4</kbd> para responder, <kbd>Enter</kbd> para avançar.</p>
    <div class="kpi"><div><b>${pool.length}</b><span>no âmbito escolhido</span></div><div><b>${feitas.length}</b><span>já feitas</span></div><div><b>${sabidas.length}</b><span>certas na última vez</span></div><div><b>${erradas.length}</b><span>erradas na última vez</span></div><div><b>${porFazer}</b><span>por fazer</span></div></div>
    <div class="barra"><i style="width:${pool.length ? Math.round(100 * sabidas.length / pool.length) : 0}%"></i></div>
    <div class="plano">${dias > 0 ? `Até ao teste há <strong>${dias} dia${dias === 1 ? "" : "s"} de estudo</strong>, contando com hoje. Para passar por todas as ${porFazer + erradas.length} pendentes (por fazer + erradas): <strong>${Math.ceil((porFazer + erradas.length) / dias)} por dia</strong>${erradas.length ? `, e convém repetir as ${erradas.length} erradas no fim.` : "."} Se for demasiado, desligue as geradas e fique com as escritas.` : `O teste já passou. Ficam ${porFazer} por fazer e ${erradas.length} erradas para rever.`}</div>`;
  const ctl = el("div");
  const nSel = el("select"); [10, 20, 30, 50, "todas"].forEach(v => nSel.appendChild(el("option", { value: v }, v === "todas" ? "todas as que couberem" : v + " perguntas"))); nSel.value = cfg.n;
  const modo = el("select"); [["pendentes", "Por fazer primeiro, depois as erradas"], ["erradas", "Só as que errei da última vez"], ["todas", "Todas, baralhadas"]].forEach(([v, t]) => modo.appendChild(el("option", { value: v }, t))); modo.value = cfg.modo;
  const l1 = el("div", { class: "linha" }); l1.append("Ronda: ", nSel, " Quais: ", modo); ctl.appendChild(l1);
  const tipos = el("div", { class: "tipos linha" }); tipos.append(el("span", { class: "muted" }, "Incluir: "));
  GRUPOS.forEach(([g, t]) => { const lab = el("label"); const ch = el("input", { type: "checkbox" }); ch.checked = cfg.grupos.includes(g); ch.onchange = () => { cfg.grupos = GRUPOS.map(x => x[0]).filter(x => x === g ? ch.checked : cfg.grupos.includes(x)); store.set("quiz_cfg", cfg); render("perguntas"); }; lab.append(ch, " " + t + ` (${banco().filter(x => x.g === g && x.p <= SCOPE && cfg.pontos.includes(x.p)).length})`); tipos.appendChild(lab); });
  ctl.appendChild(tipos);
  ctl.appendChild(el("div", { class: "muted" }, "Pontos:"));
  const sel = new Set(cfg.pontos);
  ctl.appendChild(pontosChips(sel, () => { cfg.pontos = [...sel]; store.set("quiz_cfg", cfg); render("perguntas"); }));
  const go = el("button", { class: "b" }, "Começar"), goErr = el("button", { class: "b sec" }, `Repetir as erradas (${erradas.length})`);
  goErr.disabled = !erradas.length;
  const l2 = el("div", { class: "linha" }); l2.append(go, goErr); ctl.appendChild(l2);
  top.appendChild(ctl); m.appendChild(top);
  const iniciar = (c) => { const r = escolherRonda(quizPool(c, store.get("quiz", {})), c); if (!r.length) { alert("Não há perguntas com estes filtros."); return; } jogarRonda(m, { lista: r, i: 0, certas: 0, erradas: [], cfg: c }); };
  go.onclick = () => { cfg.n = nSel.value === "todas" ? "todas" : +nSel.value; cfg.modo = modo.value; store.set("quiz_cfg", cfg); iniciar(cfg); };
  goErr.onclick = () => { const c = { ...cfg, modo: "erradas", n: "todas" }; iniciar(c); };
  // progresso por ponto
  const tab = el("div", { class: "card" }); tab.innerHTML = `<h2 style="margin-top:0">Progresso por ponto</h2><p class="muted">Clique num ponto para fazer uma ronda só desse ponto, com as perguntas por fazer primeiro.</p>`;
  const t = el("table"); t.innerHTML = `<tr><th>Ponto</th><th>Capítulo</th><th class="num">Perguntas</th><th class="num">Feitas</th><th class="num">Certas</th><th class="num">Erradas</th><th>Sabido</th></tr>`;
  caps().forEach(c => {
    const pc = banco().filter(x => x.p === c.n && cfg.grupos.includes(x.g)).map(x => ({ ...x, r: prog[x.id] }));
    const f = pc.filter(x => x.r && x.r.n > 0), s = f.filter(x => x.r.last), e = f.filter(x => !x.r.last);
    const tr = el("tr", { class: "sel-row" }); tr.title = "Fazer uma ronda do Ponto " + c.n;
    tr.innerHTML = `<td class="k">${c.n}</td><td>${c.titulo}</td><td class="num">${pc.length}</td><td class="num">${f.length}</td><td class="num ok-txt">${s.length}</td><td class="num ${e.length ? "mau-txt" : ""}">${e.length}</td><td><div class="mini"><i style="width:${pc.length ? Math.round(100 * s.length / pc.length) : 0}%"></i></div></td>`;
    tr.onclick = () => iniciar({ ...cfg, pontos: [c.n], modo: "pendentes" });
    t.appendChild(tr);
  });
  tab.appendChild(el("div", { class: "rolo" })).appendChild(t);
  const reset = el("button", { class: "b sec pq" }, "Apagar o progresso das perguntas"); reset.onclick = () => { if (confirm("Apagar todo o progresso das perguntas de escolha múltipla?")) { store.set("quiz", {}); render("perguntas"); } };
  tab.appendChild(el("div", { class: "linha" })).appendChild(reset);
  m.appendChild(tab);
}
function jogarRonda(m, R){
  m.innerHTML = ""; window.scrollTo(0, 0);
  if (R.i >= R.lista.length) { resultadoRonda(m, R); return; }
  const x = R.lista[R.i], c = cap(x.p);
  const card = el("div", { class: "card" });
  card.innerHTML = `<div class="qtop"><span><span class="rotulo" style="display:inline">Ponto ${x.p} · ${TIPOS[x.t] || x.t} · ${GRUPOS.find(g => g[0] === x.g)[1].replace(/ \(geradas\)/, "")}</span></span><span>${R.i + 1} / ${R.lista.length} · certas ${R.certas}</span></div><div class="barra"><i style="width:${Math.round(100 * R.i / R.lista.length)}%"></i></div><div class="pergunta">${x.q}</div>`;
  const ordem = shuffle(x.o.map((o, i) => ({ o, ok: i === 0 })));
  const botoes = ordem.map((op, i) => { const b = el("button", { class: "opt" }); b.innerHTML = `<kbd>${i + 1}</kbd>${op.o}`; card.appendChild(b); return b; });
  let respondido = false;
  const responder = (i) => {
    if (respondido) return; respondido = true;
    const op = ordem[i];
    botoes.forEach((b, j) => { b.disabled = true; if (ordem[j].ok) b.classList.add("ok"); else if (j === i) b.classList.add("mau"); });
    const prog = store.get("quiz", {}); const r = prog[x.id] || { n: 0, ok: 0 };
    r.n++; if (op.ok) r.ok++; r.last = op.ok ? 1 : 0; r.t = Date.now(); prog[x.id] = r; store.set("quiz", prog);
    if (op.ok) R.certas++; else R.erradas.push(x);
    const ex = el("blockquote", { class: "exp" + (op.ok ? "" : " mau") }); ex.innerHTML = `<strong>${op.ok ? "Certo." : "Errado."}</strong> ${x.e}${c ? `<footer>${titulo(c)}</footer>` : ""}`; card.appendChild(ex);
    const nx = el("button", { class: "b" }, R.i + 1 < R.lista.length ? "Próxima (Enter)" : "Ver resultado (Enter)"); nx.onclick = avancar;
    const sair = el("button", { class: "b sec pq" }, "Terminar ronda"); sair.onclick = () => { R.lista = R.lista.slice(0, R.i + 1); avancar(); };
    const ln = el("div", { class: "linha" }); ln.append(nx, sair); card.appendChild(ln); nx.focus();
  };
  const avancar = () => { document.onkeydown = null; R.i++; jogarRonda(m, R); };
  botoes.forEach((b, i) => b.onclick = () => responder(i));
  document.onkeydown = (ev) => { if (ev.target && /input|select|textarea/i.test(ev.target.tagName)) return; if (!respondido && /^[1-4]$/.test(ev.key) && +ev.key <= botoes.length) { responder(+ev.key - 1); ev.preventDefault(); } else if (respondido && (ev.key === "Enter" || ev.key === " ")) { avancar(); ev.preventDefault(); } };
  m.appendChild(card);
  const rodape = el("p", { class: "muted" }); rodape.innerHTML = `<button class="b sec pq" id="qabandon">Abandonar</button>`; m.appendChild(rodape);
  $("#qabandon").onclick = () => { document.onkeydown = null; render("perguntas"); };
}
function resultadoRonda(m, R){
  document.onkeydown = null;
  const n = R.lista.length, pct = n ? Math.round(100 * R.certas / n) : 0;
  const d = el("div", { class: "card" });
  d.innerHTML = `<h2 style="margin-top:0">Resultado da ronda</h2><div class="kpi"><div><b>${R.certas} / ${n}</b><span>certas</span></div><div><b>${pct}%</b><span>acerto</span></div><div><b>${R.erradas.length}</b><span>para rever</span></div></div>
    <p class="muted">${pct >= 90 ? "Domina esta matéria. Passe a outro ponto ou aumente a ronda." : pct >= 70 ? "Bom. Repita já as erradas: é agora que ficam." : "Volte a estas perguntas hoje e amanhã; a repetição espaçada é o que fixa."}</p>`;
  const ln = el("div", { class: "linha" });
  if (R.erradas.length) { const b = el("button", { class: "b" }, "Repetir as erradas desta ronda"); b.onclick = () => jogarRonda(m, { lista: shuffle(R.erradas), i: 0, certas: 0, erradas: [], cfg: R.cfg }); ln.appendChild(b); }
  const b2 = el("button", { class: "b sec" }, "Nova ronda com os mesmos filtros"); b2.onclick = () => { const r = escolherRonda(quizPool(R.cfg, store.get("quiz", {})), R.cfg); if (!r.length) { render("perguntas"); return; } jogarRonda(m, { lista: r, i: 0, certas: 0, erradas: [], cfg: R.cfg }); }; ln.appendChild(b2);
  const b3 = el("button", { class: "b sec" }, "Voltar ao painel"); b3.onclick = () => render("perguntas"); ln.appendChild(b3);
  d.appendChild(ln); m.appendChild(d);
  if (R.erradas.length) {
    const e = el("div", { class: "card" }); e.innerHTML = `<h2 style="margin-top:0">O que errou</h2>`;
    R.erradas.forEach(x => { const c = cap(x.p); e.appendChild(el("div", { class: "caixa" }, `<span class="rotulo">Ponto ${x.p}${c ? " · " + c.titulo : ""}</span><div>${x.q}</div><p style="margin:6px 0 0"><strong class="ok-txt">Resposta:</strong> ${x.o[0]}</p>${x.e ? `<p class="muted" style="margin:4px 0 0">${x.e}</p>` : ""}`)); });
    m.appendChild(e);
  }
  // por ponto, nesta ronda
  const porP = {}; R.lista.forEach(x => { porP[x.p] = porP[x.p] || { n: 0, ok: 0 }; porP[x.p].n++; }); R.lista.forEach(x => { if (!R.erradas.includes(x)) porP[x.p].ok++; });
  const ks = Object.keys(porP).map(Number).sort((a, b) => a - b);
  if (ks.length > 1) { const t = el("div", { class: "card" }); t.innerHTML = `<h2 style="margin-top:0">Por ponto, nesta ronda</h2>`; const tb = el("table"); tb.innerHTML = `<tr><th>Ponto</th><th>Capítulo</th><th class="num">Certas</th></tr>` + ks.map(p => `<tr><td class="k">${p}</td><td>${cap(p) ? cap(p).titulo : ""}</td><td class="num">${porP[p].ok} / ${porP[p].n}</td></tr>`).join(""); t.appendChild(tb); m.appendChild(t); }
}

  h.forEach((e,i)=>{ const tr=el("tr"); const nota = e.notas? e.notas.reduce((a,b)=>a+b,0):"—"; tr.innerHTML=`<td class="k">${new Date(e.quando).toLocaleString("pt-PT",{dateStyle:"short",timeStyle:"short"})}</td><td>Ponto ${e.ponto} · ${e.enunciado.slice(0,110)}${e.enunciado.length>110?"…":""}</td><td>${e.palavras||""}</td><td>${e.cobertura?e.cobertura.autores+"%":""}</td><td>${e.cobertura?e.cobertura.conceitos+"%":""}</td><td>${e.cobertura?e.cobertura.anos+"%":""}</td><td>${nota}/20</td><td></td>`;
    const b=el("button",{class:"b sec pq"},"Ver"); b.onclick=()=>{ const v=el("div",{class:"card"}); v.innerHTML=`<p style="font-weight:bold">${e.enunciado}</p>`+(e.excerto?`<blockquote>${e.excerto.paras.join(" ")}<footer>${e.excerto.fonte}</footer></blockquote>`:"")+`<div style="white-space:pre-wrap;font-size:.95rem">${e.texto.replace(/</g,"&lt;")}</div>`; const del=el("button",{class:"b sec pq"},"Apagar este ensaio"); del.onclick=()=>{ if(confirm("Apagar?")){ h.splice(i,1); store.set("ensaios",h); render("historico"); } }; v.appendChild(el("div",{class:"linha"})).appendChild(del); d.after(v); v.scrollIntoView(); };
    tr.lastElementChild.appendChild(b); t.appendChild(tr); });
  d.appendChild(t);
  const exp=el("button",{class:"b sec pq"},"Exportar tudo (JSON)"); exp.onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(h,null,1)],{type:"application/json"})); a.download="ensaios-hc.json"; a.click(); };
  d.appendChild(el("div",{class:"linha"})).appendChild(exp); m.appendChild(d);
}
