 da monarquia hachemita no Iraque."}, {"k": "1960", "v": "Fundação da OPEP."}, {"k": "jun 1967", "v": "Derrota árabe na Guerra dos Seis Dias. Colapso da credibilidade do nasserismo."}, {"k": "out 1973", "v": "<strong>Choque petrolífero.<\/strong> Embargo árabe; o preço sobe de cerca de 3 para mais de 11 dólares. Estagflação no Ocidente."}, {"k": "16 jan 1979", "v": "O xá deixa o Irão."}, {"k": "1 fev 1979", "v": "<strong>Regresso de Khomeini a Teerão.<\/strong> Proclamação da República Islâmica."}, {"k": "4 nov 1979", "v": "Tomada da embaixada americana. 444 dias de cativeiro."}, {"k": "19 nov 1979", "v": "Tomada da Grande Mesquita de Meca. Três semanas para a retomar."}, {"k": "24-25 dez 1979", "v": "<strong>Invasão soviética do Afeganistão.<\/strong> Início do apoio americano aos mujahidin."}, {"k": "1980 - 1988", "v": "<strong>Guerra Irão-Iraque.<\/strong> Vagas humanas, armas químicas, Halabja em 1988. Nenhuma fronteira alterada."}, {"k": "1989", "v": "Retirada soviética do Afeganistão."}], "conceitos": [{"k": "Vocabulário islâmico", "v": "<em>Al-Qur'an<\/em>, «a recitação», 114 suras; <em>Dar-al-Islam<\/em>, «a Casa do Islão»; <em>Imam<\/em>, líder espiritual; <em>Islam<\/em>, «submissão» (como forma mais profunda de amor, diz o professor); <em>Jihad<\/em>, «luta, esforço», autorreforma ou guerra libertadora, política quando imposta ao outro; <em>Shariah<\/em>, lei sagrada saída do Corão; <em>Sunnah<\/em>, costumes e exemplos de Maomé."}, {"k": "Árabe e muçulmano", "v": "Árabe é uma unidade linguística e cultural, muçulmano é uma religião. Há árabes cristãos (coptas, maronitas) e a maioria dos muçulmanos não é árabe (Indonésia, Paquistão, Bangladesh, Irão, Turquia)."}, {"k": "Secularização e laicismo", "v": "Secularização é a separação entre Estado e religião; laicismo é o combate à religião. O Islão clássico não separa lei divina e lei civil, e por isso vive a primeira como se fosse a segunda."}, {"k": "Islamistas políticos e militantes", "v": "Distinção de Best: os políticos trabalham dentro do sistema e concorrem a eleições; os militantes consideram-no «corrupto, ímpio e irrecuperável» e defendem a força como <em>jihad<\/em>."}, {"k": "Califado", "v": "Instituição que representava a sucessão do Profeta nas suas funções políticas e sociais. Abolido em 1924. O vazio deixado está na origem do islamismo político do século XX."}, {"k": "Nacionalismo árabe", "v": "Projeto de unidade dos povos árabes, artificialmente divididos por fronteiras desenhadas por europeus. Encarnado em Nasser e no partido Baath. Entra em crise definitiva com a derrota de 1967."}, {"k": "Petróleo por segurança", "v": "Pacto estabelecido entre Washington e a casa de Saud: acesso garantido ao petróleo em troca de proteção militar e de não interferência na natureza do regime."}, {"k": "OPEP", "v": "Organização dos Países Exportadores de Petróleo, criada em 1960. Em 1973 demonstra que o controlo da oferta é uma arma política de primeira ordem."}, {"k": "Estagflação", "v": "Combinação de estagnação económica com inflação alta, surgida depois de 1973. Não estava prevista na teoria keynesiana e pôs fim aos Trinta Gloriosos."}, {"k": "Sunitas e xiitas", "v": "Divisão nascida da disputa sobre a sucessão do Profeta no século VII. Os xiitas são cerca de 15% dos muçulmanos, mas maioritários no Irão, Iraque, Barém e Azerbaijão."}, {"k": "Wahabismo", "v": "Corrente rigorista do Islão sunita, doutrina oficial da Arábia Saudita. Difundida mundialmente a partir de 1979 com o dinheiro do petróleo, em resposta à crise de legitimidade da monarquia."}, {"k": "Mujahidin", "v": "Combatentes da resistência afegã contra a ocupação soviética, armados pelos Estados Unidos através do Paquistão e financiados pelo Golfo. Das suas redes sairia a Al-Qaeda."}, {"k": "Islão e islamismo", "v": "Distinção essencial. O primeiro é uma religião com 1400 anos e cerca de 1,2 mil milhões de fiéis. O segundo é uma família de ideologias políticas do século XX que propõe o Islão como sistema de governo."}], "frases": ["«No século XXI, o Islão é o grande outro do nosso mundo. Choque de civilização <em>versus<\/em> possibilidade de diálogo.»", "«Fundamentalismo e terrorismo islâmico são coisas diferentes. Todas as religiões são fundamentalistas a partir do momento em que se vive fundamentalmente numa ideologia.»", "«Teologicamente, não há nada de fundamentalmente incompatível entre o cristão, o islâmico e o judeu. O problema é o que vem de arrasto: a política.»", "«A grande diferença: a lei divina e a lei civil não são separadas.» Secularização (separação) <em>versus<\/em> laicismo (combate à religião).", "«O grande azar cósmico do Oriente é Jerusalém»: é onde foram edificadas as três fés.", "«O Médio Oriente é uma designação ocidental, hoje o grande problema geográfico do mundo. E, coincidentemente, tem muito petróleo: a sua maldição.»", "«Porque haveria um povo com quatro mil anos de ser administrado por outros?»", "Sunitas: líder escolhido pelos crentes, rezam de mãos no peito. Xiitas: líder dinástico, rezam com os braços ao longo do corpo."], "fontes": ["<strong>Armstrong<\/strong>: «a política constitui um sacramento»; o mundo islâmico «reduzido pelas potências europeias, rápida e permanentemente, a um bloco dependente» e «o primeiro a ser sujeito ao processo de colonização».", "<strong>Best<\/strong>: a lista dos agravos islamistas e a diferença entre militantes e políticos: os militantes defendem a força «como justo e santo, como <em>jihad<\/em>».", "<strong>Hourani<\/strong>: sobre Suez como o raro episódio em que a estrutura do poder mundial ficou revelada; sobre a «linguagem do Islão» como a única que restava; sobre a fragilidade dos regimes como explicação da força dos islamistas.", "<strong>Khomeini<\/strong>: o discurso de chegada de fevereiro de 1979; «enfrentem o soldado com uma flor».", "<strong>Andropov<\/strong>, março de 1979: «só podemos sustentar aquele regime com baionetas soviéticas, e isso é absolutamente inadmissível».", "<strong>Westad<\/strong>: a descrição da operação encoberta de 1953 e das manifestações encenadas.", "<strong>Young e Kent<\/strong>: o sacrifício de um movimento secular unificador por um benefício estratégico incerto.", "<strong>Reynolds<\/strong>: o choque económico de 1973 como maior do que o militar; a crise dos reféns como criadora da imagem ocidental do fundamentalismo.", "<strong>Kissinger<\/strong>: 1973 como «um dos acontecimentos decisivos da história deste século».", "<strong>Zwier e Weltig<\/strong>: oito anos de guerra que não mudaram fronteira nenhuma."], "perguntas": [{"q": "Que distinções é preciso fazer antes de falar de «Islão» na política internacional?", "guia": "Quatro, e todas da aula. Islão e islamismo: uma religião de 1400 anos e uma família de ideologias do século XX. Árabe e muçulmano: uma língua e uma religião, com os quatro casos do slide. Sunitas e xiitas: a sucessão de 632, a regra do líder escolhido ou dinástico, as proporções de 80 e 20 por cento e a geografia. Fundamentalismo e terrorismo, com a distinção de Best entre islamistas políticos e militantes. Fechar com Armstrong sobre a política como sacramento e com a frase do professor sobre a lei divina e a lei civil."}, {"q": "Que consequências teve a abolição do califado em 1924?", "guia": "Descrever o ato e o programa de Atatürk: tribunais, código civil, vestuário, calendário, alfabeto. Explicar o vazio criado: pela primeira vez em treze séculos, o mundo muçulmano ficou sem centro simbólico. Apresentar as três respostas rivais que nasceram desse vazio, o nacionalismo secular, a monarquia religiosa e o islamismo político, e notar que a Irmandade Muçulmana é fundada quatro anos depois. Usar Best e Hourani."}, {"q": "Explique o golpe de 1953 no Irão e as suas consequências a longo prazo.", "guia": "Contexto: a Anglo-Iranian, Abadan e a desigualdade dos contratos. Ação: nacionalização em 1951, boicote britânico, operação conjunta da CIA e do MI6, manifestações encenadas e agentes pagos, fuga e regresso do xá com o diretor da CIA. Consequências: vinte e seis anos de autocracia; e, sobretudo, a tese de Young e Kent sobre a eliminação da alternativa secular, que ajuda a explicar por que razão a revolução de 1979 foi religiosa e não laica."}, {"q": "Porque foi 1973 um ano de viragem na economia mundial?", "guia": "Descrever a decisão do Koweit, o embargo e a subida de preços com números. Descrever os efeitos concretos no Ocidente: filas, racionamento, domingos sem automóvel, semana de três dias em Inglaterra. Explicar as três consequências estruturais: a revelação da dependência energética, o aparecimento da estagflação e o fim dos Trinta Gloriosos, e o afluxo de capital aos produtores, com o que isso permitiu financiar a partir de 1979."}, {"q": "Porque é 1979 considerado um ano decisivo no Médio Oriente?", "guia": "Apresentar os três acontecimentos e articulá-los. Revolução iraniana: primeiro Estado islâmico moderno e nova imagem ocidental do Islão através da crise dos reféns. Meca: crise de legitimidade da monarquia saudita e consequente campanha mundial de propaganda religiosa. Afeganistão: o Vietname soviético, a advertência ignorada de Andropov e a criação das redes de combatentes que dariam origem à Al-Qaeda. Concluir que os três juntos deslocam o eixo da política regional do nacionalismo para a religião."}, {"q": "Como explicar o regresso da religião à política no mundo muçulmano?", "guia": "Partir da premissa ocidental de que a modernização traria secularização e mostrar que no Médio Oriente sucedeu o inverso. Explicar pela sequência de falhanços das ideologias importadas: nacionalismo secular derrotado em 1967, monarquias sem legitimidade, socialismo transformado em burocracia autoritária. Usar Hourani sobre a linguagem do Islão como a única não comprometida, e a sua advertência de que a força dos islamistas vem sobretudo da fragilidade dos regimes. Referir Qutb e a jahiliyya. Terminar distinguindo Islão de islamismo."}], "biblio": ["Karen ARMSTRONG, <em>O Islamismo<\/em>, cap. 5 («Os protagonistas islâmicos»).", "Antony BEST <em>et al.<\/em>, cap. 19 («The rise of political Islam»), que o professor designa como a bibliografia importante deste ponto.", "Albert HOURANI, <em>História dos Povos Árabes<\/em>, caps. 19 («O clímax do poder europeu, 1914-1939»), 21 («O fim dos Impérios, 1939-1962») e 24 («O clímax do Arabismo: 1950s e 1960s»).", "Odd Arne WESTAD, <em>A Guerra Fria<\/em>, caps. 10 e 18.", "David REYNOLDS, <em>One World Divisible<\/em>, caps. sobre o Médio Oriente e 1979.", "Lawrence ZWIER e Mathew WELTIG, <em>The Persian Gulf and Iraqi Wars<\/em>.", "Victor SEBESTYEN, <em>Revolução 1989<\/em> (para o Afeganistão soviético).", "Antony BEST <em>et al.<\/em> e John W. YOUNG e John KENT, caps. sobre o Médio Oriente."], "lecionado": "Lecionado na aula de 8 de outubro de 2026.", "autores": [{"nome": "Karen Armstrong", "apelido": "Armstrong", "tipos": ["ficha", "historiador"], "n": 2}, {"nome": "Ruhollah Khomeini", "apelido": "Khomeini", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Iuri Andropov", "apelido": "Andropov", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Lawrence Zwier e Mathew Weltig", "apelido": "Weltig", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Antony Best", "apelido": "Best", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Hourani", "apelido": "Hourani", "tipos": ["ficha"], "n": 0}, {"nome": "Westad", "apelido": "Westad", "tipos": ["ficha"], "n": 0}, {"nome": "Young", "apelido": "Young", "tipos": ["ficha"], "n": 0}, {"nome": "Kent", "apelido": "Kent", "tipos": ["ficha"], "n": 0}, {"nome": "Reynolds", "apelido": "Reynolds", "tipos": ["ficha"], "n": 0}, {"nome": "Kissinger", "apelido": "Kissinger", "tipos": ["ficha"], "n": 0}, {"nome": "Zwier", "apelido": "Zwier", "tipos": ["ficha"], "n": 0}], "anos": ["1916", "1922", "1924", "1928", "1945", "1941", "1951", "1953", "1952", "1956", "1958", "1960", "1967", "1973", "1979", "1980", "1988", "1989"]}, {"n": 8, "titulo": "Terra prometida, terra disputada", "subtitulo": "O Sionismo e os conflitos israelo-palestinianos", "datas": "1896 — 2023", "epigrafe": {"texto": "«Em Basileia fundei o Estado judaico. Se o dissesse hoje em voz alta, seria recebido com uma gargalhada universal. Daqui a cinco anos, talvez, e certamente daqui a cinquenta, toda a gente o reconhecerá.»", "autor": "Theodor Herzl, diário, setembro de 1897"}, "seccoes": ["Nota prévia sobre este capítulo", "1. Um jornalista em Paris", "2. Uma carta de sessenta e sete palavras", "3. Depois", "4. 1948", "5. Seis dias", "6. Da guerra à mesa", "7. As pedras e o aperto de mão", "8. O que veio depois", "9. A questão prévia"], "citacoes": [{"tipo": "historiador", "paras": ["«As origens e as causas do conflito israelo-árabe têm sido objeto de muito debate. Alguns defendem que a religião está no seu âmago, vendo a disputa pela Palestina como uma extensão das guerras religiosas por Jerusalém dos séculos anteriores. Outros afirmam que foi o resultado do colonialismo ocidental, que negou aos árabes a autodeterminação ao mesmo tempo que favorecia o sionismo enquanto movimento colonialista essencialmente europeu. Outros ainda sustentam que foi o comportamento intransigente e irracional, se não fanático, dos árabes, dos sionistas ou de ambos, que provocou a violência intercomunitária. Há alguma validade em todos estes argumentos.»"], "fonte": "Antony Best <em>et al.<\/em>, <em>International History of the Twentieth Century and Beyond<\/em>", "seccao": "Nota prévia sobre este capítulo"}, {"tipo": "documento", "paras": ["«O Governo de Sua Majestade vê com bons olhos o estabelecimento na Palestina de um lar nacional para o povo judeu, e envidará os seus melhores esforços para facilitar a realização desse objetivo, entendendo-se claramente que nada será feito que possa prejudicar os direitos civis e religiosos das comunidades não judaicas existentes na Palestina, ou os direitos e o estatuto político de que gozam os judeus em qualquer outro país.»"], "fonte": "Declaração Balfour, 2 de novembro de 1917 (versão modernizada tal como consta em Scott-Baumann)", "seccao": "2. Uma carta de sessenta e sete palavras"}, {"tipo": "historiador", "paras": ["«Não foi o Holocausto, mas a Guerra da Independência, que começou três anos depois de o Holocausto ter terminado, que permitiu que o Estado judaico viesse a existir.»"], "fonte": "Martin Gilbert, <em>História de Israel<\/em>, Introdução", "seccao": "3. Depois"}, {"tipo": "documento", "paras": ["«A Terra de Israel foi o berço do povo judeu. Exilado da Palestina, o povo judeu manteve-se-lhe fiel em todos os países da sua dispersão, nunca deixando de rezar e de esperar pelo seu regresso e pela restauração da sua liberdade nacional. […] Assim, em virtude do direito natural e histórico do povo judeu e da resolução da Assembleia Geral das Nações Unidas, proclamamos o estabelecimento do Estado Judeu na Palestina, que se chamará Israel. […] No meio da agressão desenfreada, apelamos aos habitantes árabes do Estado de Israel para que regressem aos caminhos da paz e desempenhem o seu papel no desenvolvimento do Estado, com cidadania plena e igualitária. Oferecemos paz e amizade a todos os estados e povos vizinhos, e convidamo-los a cooperar com a nação judaica independente para o bem comum de todos.»"], "fonte": "Declaração de Independência de Israel, 14 de maio de 1948", "seccao": "4. 1948"}, {"tipo": "historiador", "paras": ["«Apesar das alegações de muitos historiadores, não há registo de qualquer prova de líderes árabes a apelarem ao seu povo, por altifalante ou por rádio, para que fugisse rapidamente das suas casas.»"], "fonte": "Michael Scott-Baumann, <em>A Mais Breve História de Israel e da Palestina<\/em>", "seccao": "4. 1948"}, {"tipo": "historiador", "paras": ["«A maioria dos historiadores concorda hoje que não houve um plano específico e detalhado nem uma ordem explícita para a expulsão sistemática dos palestinianos, mesmo que alguns comandantes locais tenham interpretado o Plano D dessa maneira.»"], "fonte": "Michael Scott-Baumann", "seccao": "4. 1948"}, {"tipo": "historiador", "paras": ["«Para o pensamento sionista, a criação de Israel não deveria ser vista como um ato hostil em relação ao Islão. Os judeus acreditavam que aquela Terra Santa era sua desde os tempos bíblicos e que a sua recuperação era a reparação de uma injustiça cometida muito antes de o Islão existir. No entanto, a Palestina não era um país vazio; os seus habitantes nativos foram afastados [com a criação de Israel] e os muçulmanos de todo o mundo sentiram isso como uma injúria e um insulto.»"], "fonte": "Norman Davies, «The Islamic Strand in European History», <em>in<\/em> <em>Europe, East & West<\/em>", "seccao": "4. 1948"}, {"tipo": "historiador", "paras": ["«Desde os seus primórdios, o Estado de Israel foi sempre olhado pelos Árabes como o desenvolvimento de um cancro implantado no interior do seu corpo pelo Ocidente – e essa visão não mudou substancialmente até aos dias de hoje […] O facto de um Estado militar e economicamente poderoso de cerca de quatro milhões de Judeus ter crescido no coração do mundo Islâmico, rodeado por 120 milhões de Árabes, foi sempre uma fonte de suprema humilhação para a grande nação Árabe.»"], "fonte": "Peter Mansfield, <em>A History of the Middle East<\/em>", "seccao": "4. 1948"}, {"tipo": "historiador", "paras": ["«A vitória da pequena democracia judaica sobre as legiões do despotismo árabe, armado pela União Soviética, convenceu os Estados Unidos de que Israel era um amigo especial com que os americanos podiam contar naquela região extremamente perigosa, e um aliado na luta contra a Rússia comunista, o radicalismo de Nasser e o fundamentalismo Islâmico.»"], "fonte": "Simon Sebag Montefiore, <em>Jerusalém. A Biografia<\/em>", "seccao": "5. Seis dias"}, {"tipo": "fonte", "paras": ["«Tanto a direita como o Partido Trabalhista maioritário pensaram em 1967 como a conclusão de 1948. Aquilo que não tínhamos sido suficientemente fortes para fazer então, éramos agora suficientemente fortes para fazer.»"], "fonte": "Amos Oz", "seccao": "5. Seis dias"}, {"tipo": "historiador", "paras": ["«A história da Palestina judaica terminou efetivamente em 137 d.C. Até meados do século XX não tinha havido maioria judaica na Palestina desde então, há mais de mil e oitocentos anos. É inconcebível que em qualquer outra esfera da existência humana se tentasse fazer recuar o relógio quase dois milénios.»"], "fonte": "Dawoud El-Alami, <em>in<\/em> Cohn-Sherbok e El-Alami, <em>The Palestine-Israeli Conflict<\/em>", "seccao": "9. A questão prévia"}], "prof": [], "hoje": [], "cron": [{"k": "1894-95", "v": "Caso Dreyfus. Herzl conclui que a assimilação falhou."}, {"k": "fev 1896", "v": "Publicação de <em>O Estado Judaico<\/em> e fundação da Organização Sionista Mundial."}, {"k": "29 ago 1897", "v": "<strong>Primeiro Congresso Sionista<\/strong>, em Basileia."}, {"k": "1915-16", "v": "Correspondência Hussein-McMahon e acordo secreto Sykes-Picot."}, {"k": "2 nov 1917", "v": "<strong>Declaração Balfour.<\/strong> «Lar nacional» e «comunidades não judaicas existentes»."}, {"k": "1922", "v": "Mandato britânico. Os judeus são 11% da população."}, {"k": "1936-1939", "v": "<strong>Grande Revolta Árabe.<\/strong> Relatório Peel em 1937 propõe a primeira partilha."}, {"k": "mai 1939", "v": "<strong>Livro Branco:<\/strong> limitação drástica da imigração judaica, no ano em que a Europa se tornou mortal para os judeus."}, {"k": "29 nov 1947", "v": "<strong>Resolução 181<\/strong> da Assembleia Geral: partilha aprovada por 33 votos contra 13, com 10 abstenções."}, {"k": "9 abr 1948", "v": "Deir Yassin. Número de mortos em disputa entre as fontes."}, {"k": "14 mai 1948", "v": "<strong>Declaração de independência de Israel<\/strong>, lida por Ben-Gurion em Telavive."}, {"k": "1948-49", "v": "Guerra. Israel fica com 78% do território. Entre 700 e 800 mil refugiados palestinianos. <strong>Nakba.<\/strong>"}, {"k": "dez 1948 / 1950", "v": "Resolução 194 (direito ao regresso), nunca aplicada. Lei do Retorno e criação da UNRWA."}, {"k": "out-nov 1956", "v": "Campanha do Sinai, no quadro da crise do Suez."}, {"k": "1964", "v": "Fundação da OLP."}, {"k": "5-10 jun 1967", "v": "<strong>Guerra dos Seis Dias.<\/strong> Ocupação da Cisjordânia, Jerusalém Oriental, Gaza, Sinai e Golã."}, {"k": "ago / nov 1967", "v": "Os «três nãos» de Cartum e a <strong>Resolução 242<\/strong>: territórios por paz."}, {"k": "set 1970", "v": "Setembro Negro na Jordânia."}, {"k": "6 out 1973", "v": "<strong>Guerra do Yom Kippur.<\/strong> Surpresa egípcia e síria."}, {"k": "nov 1977", "v": "Sadat discursa no Knesset."}, {"k": "set 1978 / mar 1979", "v": "<strong>Camp David<\/strong> e tratado de paz entre Israel e o Egito. Devolução do Sinai."}, {"k": "jun / set 1982", "v": "Invasão do Líbano e massacre de Sabra e Chatila. Comissão Kahan."}, {"k": "8 dez 1987", "v": "<strong>Primeira Intifada.<\/strong> Fundação do Hamas."}, {"k": "13 set 1993", "v": "<strong>Acordos de Oslo.<\/strong> Aperto de mão entre Rabin e Arafat."}, {"k": "4 nov 1995", "v": "<strong>Assassínio de Rabin<\/strong> por um extremista judeu israelita."}, {"k": "jul / set 2000", "v": "Fracasso de Camp David II e início da <strong>Segunda Intifada<\/strong>."}, {"k": "2002-2004", "v": "Construção da barreira de separação."}, {"k": "2005 / 2006-2007", "v": "Retirada de Gaza. Vitória eleitoral do Hamas e tomada de Gaza."}, {"k": "7 out 2023", "v": "Ataque do Hamas e guerra subsequente em Gaza. Fora do alcance da bibliografia da cadeira."}], "conceitos": [{"k": "Sionismo", "v": "Movimento político nascido no fim do século XIX que defende a autodeterminação nacional judaica num Estado próprio. Herzl era laico e assimilado: a origem do projeto é política, não religiosa."}, {"k": "Aliyah", "v": "Literalmente «subida». Designa as vagas de imigração judaica para a Palestina, contadas a partir de 1882."}, {"k": "Declaração Balfour", "v": "Carta de 2 de novembro de 1917. Promete um «lar nacional», expressão deliberadamente ambígua, e refere a maioria árabe apenas como «comunidades não judaicas existentes», protegendo-lhe os direitos civis e religiosos e não os políticos."}, {"k": "Resolução 181", "v": "Plano de partilha de 29 de novembro de 1947: dois Estados e Jerusalém internacionalizada. Aceite pelos judeus, recusada pelos árabes."}, {"k": "Nakba", "v": "«Catástrofe». Designação palestiniana dos acontecimentos de 1947-49: a saída de 700 a 800 mil pessoas e a destruição de cerca de 500 aldeias."}, {"k": "Resolução 242", "v": "Aprovada a 22 de novembro de 1967. Fórmula «territórios por paz», com a ambiguidade célebre entre «territórios» e «os territórios»."}, {"k": "Intifada", "v": "«Sacudidela». Revolta popular nos territórios ocupados: a primeira em 1987-93, essencialmente de pedras; a segunda a partir de 2000, muito mais armada."}, {"k": "Acordos de Oslo", "v": "Declaração de Princípios de 1993. Criam autonomia limitada e reconhecimento mútuo, adiando para depois Jerusalém, refugiados, colonatos e fronteiras."}, {"k": "Novos historiadores", "v": "Historiadores israelitas que, a partir dos anos oitenta e com base em arquivos desclassificados, reviram a narrativa clássica de 1948: Benny Morris, Avi Shlaim e Ilan Pappé."}], "frases": [], "fontes": ["<strong>Best<\/strong>: religião, colonialismo ocidental ou fanatismo como causas do conflito, e «alguma validade em todos estes argumentos».", "<strong>Herzl<\/strong>: «Em Basileia fundei o Estado judaico.»", "<strong>Declaração Balfour<\/strong>, na versão de Scott-Baumann, com atenção às expressões «lar nacional» e «comunidades não judaicas existentes».", "<strong>Declaração de Independência de Israel<\/strong>: «em virtude do direito natural e histórico do povo judeu e da resolução da Assembleia Geral das Nações Unidas»; «oferecemos paz e amizade a todos os estados e povos vizinhos».", "<strong>Norman Davies<\/strong>: a criação de Israel como «reparação de uma injustiça cometida muito antes de o Islão existir» e, ao mesmo tempo, «uma injúria e um insulto» para os muçulmanos.", "<strong>Mansfield<\/strong>: Israel visto pelos árabes como «um cancro implantado no interior do seu corpo pelo Ocidente»; «uma fonte de suprema humilhação».", "<strong>Montefiore<\/strong>: 1967 convenceu os Estados Unidos de que Israel era «um amigo especial».", "<strong>Gilbert<\/strong>: «não foi o Holocausto, mas a Guerra da Independência, que permitiu que o Estado judaico viesse a existir».", "<strong>Scott-Baumann<\/strong>: a inexistência de registo de apelos árabes à fuga; e a síntese sobre a ausência de ordem explícita de expulsão.", "<strong>Morris<\/strong>: o consenso em torno da «transferência» e a mentalidade que criou.", "<strong>Shlaim<\/strong>: «em resumo, ganhou o lado mais forte».", "<strong>Amos Oz<\/strong>: 1967 como «a conclusão de 1948».", "<strong>El-Alami<\/strong>: a objeção temporal dos mil e oitocentos anos, e a concessão sobre colonos em número moderado."], "perguntas": [{"q": "Explique as origens do sionismo político.", "guia": "Partir de Herzl e do caso Dreyfus, sublinhando que era laico e assimilado e que a conclusão foi política. Referir <em>O Estado Judaico<\/em>, o Congresso de Basileia e a entrada do diário. Mostrar as proporções demográficas da época e o episódio do plano do Uganda, que prova que a ligação territorial não era negociável. Concluir com o contexto europeu dos pogroms e do antissemitismo."}, {"q": "Que compromissos assumiu a Grã-Bretanha na Palestina e por que razão eram incompatíveis?", "guia": "Expor os três: Hussein-McMahon aos árabes, Sykes-Picot aos franceses e Balfour aos sionistas. Analisar a linguagem da Declaração Balfour, com a ambiguidade de «lar nacional» e a designação negativa da maioria árabe. Mostrar como a incompatibilidade se traduziu no terreno: crescimento da imigração, motins, revolta de 1936-39, Peel e o Livro Branco de 1939. Sublinhar a ironia trágica de 1939."}, {"q": "Como se explica o êxodo palestiniano de 1948?", "guia": "Esta pergunta exige as duas narrativas. Expor a interpretação sionista clássica da fuga voluntária e dos apelos dos líderes árabes. Expor a revisionista, identificando Morris, Shlaim e Pappé e explicando que a revisão nasce da abertura de arquivos israelitas. Referir o ponto factual de Scott-Baumann sobre a ausência de registo desses apelos, e a sua síntese sobre a inexistência de ordem explícita. Concluir com a observação de que a proibição do regresso foi porventura mais decisiva do que a saída."}, {"q": "Qual foi o significado da Guerra dos Seis Dias?", "guia": "Causas imediatas, incluindo o fecho dos estreitos de Tiran, e a hesitação documentada de Rabin e Eshkol. Desenrolar militar e resultado territorial. Consequências: início da ocupação, ainda em curso; os três nãos de Cartum; a Resolução 242 e a sua ambiguidade. Apresentar o debate entre guerra preventiva e guerra planeada, com o argumento documental de Pappé sobre os planos de 1963-64, e usar Amos Oz para mostrar o efeito interno em Israel."}, {"q": "Por que razão fracassou o processo de Oslo?", "guia": "Explicar o que Oslo era e o que não era: autonomia limitada e reconhecimento mútuo, com adiamento das questões difíceis. Mostrar que foi essa arquitetura que o condenou. Referir os extremismos internos de ambos os lados, com Hebron em 1994 e o assassínio de Rabin em 1995, sublinhando que em cada lado houve quem matasse os seus para impedir o acordo. Expor as três leituras sobre Camp David em 2000 e terminar com a Segunda Intifada e a barreira."}], "biblio": ["Antony BEST <em>et al.<\/em>, caps. 5 («The origins of the Arab-Israeli conflict, 1900-1948») e 18 («The Arab-Israeli conflict, 1949-2007»).", "Dan COHN-SHERBOK e Dawoud EL-ALAMI, <em>The Palestine-Israeli Conflict<\/em> (obra construída em duas vozes).", "Simon Sebag MONTEFIORE, <em>Jerusalém. A Biografia<\/em>, IX parte («O Sionismo»).", "René RÉMOND, <em>Introdução à História do Nosso Tempo<\/em>, 4.ª parte, cap. 14 («O Islão e o Mundo Árabe»).", "Stewart ROSS, <em>The Israeli-Palestinian Conflict<\/em>.", "Complementares, usados neste capítulo pela regra das duas narrativas: Martin GILBERT, <em>História de Israel<\/em> (perspetiva sionista); Ilan PAPPÉ, <em>Israel vs Palestina<\/em> (perspetiva palestiniana); Michael SCOTT-BAUMANN, <em>A Mais Breve História de Israel e da Palestina<\/em> (síntese); Albert HOURANI, para o enquadramento regional."], "lecionado": "Lecionado a partir da aula de 13 de outubro de 2026.", "autores": [{"nome": "Antony Best", "apelido": "Best", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Declaração Balfour", "apelido": "Balfour", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Martin Gilbert", "apelido": "Gilbert", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Michael Scott-Baumann", "apelido": "Scott-Baumann", "tipos": ["ficha", "historiador"], "n": 2}, {"nome": "Norman Davies", "apelido": "Davies", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Peter Mansfield", "apelido": "Mansfield", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Simon Sebag Montefiore", "apelido": "Montefiore", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Dawoud El-Alami", "apelido": "El-Alami", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Herzl", "apelido": "Herzl", "tipos": ["ficha"], "n": 0}, {"nome": "Morris", "apelido": "Morris", "tipos": ["ficha"], "n": 0}, {"nome": "Shlaim", "apelido": "Shlaim", "tipos": ["ficha"], "n": 0}, {"nome": "Amos Oz", "apelido": "Oz", "tipos": ["ficha"], "n": 0}], "anos": ["1894", "1896", "1897", "1915", "1917", "1922", "1936", "1939", "1947", "1948", "1950", "1956", "1964", "1967", "1970", "1973", "1977", "1978", "1979", "1982", "1987", "1993", "1995", "2000", "2002", "2004", "2005", "2006", "2007", "2023"]}, {"n": 9, "titulo": "Os Trinta Gloriosos", "subtitulo": "A construção do mercado comum europeu no tempo dos «Trinta Gloriosos» anos: o sucesso da CEE e a geoestratégia dos alargamentos", "datas": "1946 — 1986", "epigrafe": {"texto": "«A Europa não se fará de uma só vez, nem numa construção de conjunto: far-se-á por realizações concretas, criando primeiro uma solidariedade de facto.»", "autor": "Declaração Schuman, 9 de maio de 1950"}, "seccoes": ["1. A vingança de Adenauer", "2. Três discursos e uma ideia técnica", "3. Nove de maio", "4. O fracasso que ensinou o método", "5. Roma", "6. Os Trinta Gloriosos", "7. O homem que disse não duas vezes", "8. Os alargamentos", "9. Quem fez a Europa, e para quê?"], "citacoes": [{"tipo": "documento", "paras": ["«O primeiro passo na recriação da família europeia tem de ser uma parceria entre a França e a Alemanha. Só por esta via pode a França recuperar a liderança moral da Europa. Não pode haver renascimento da Europa sem uma França espiritualmente grande e uma Alemanha espiritualmente grande.»"], "fonte": "Winston Churchill, Universidade de Zurique, 19 de setembro de 1946", "seccao": "2. Três discursos e uma ideia técnica"}, {"tipo": "historiador", "paras": ["«Poucos anos depois da inauguração da Política Agrícola Comum, o milho e a carne de vaca europeus vendiam-se a duzentos por cento dos preços mundiais, e a manteiga europeia a quatrocentos por cento. Em 1970, a PAC empregava quatro em cada cinco administradores do Mercado Comum, e a agricultura custava setenta por cento do orçamento, uma situação bizarra para alguns dos Estados mais industrializados do mundo.»"], "fonte": "Tony Judt, <em>Pós-Guerra<\/em>, cap. 9", "seccao": "5. Roma"}], "prof": [], "hoje": [{"rotulo": "De 1945 a ontem à tarde", "texto": "A prosperidade francesa daqueles anos foi construída, em parte, por mãos portuguesas, espanholas, italianas, jugoslavas e magrebinas. Quando Portugal aderiu à Comunidade em 1986, já lá vivia uma comunidade portuguesa de quase um milhão de pessoas. E quando, no capítulo 11, se discutir a imigração polaca para Inglaterra depois de 2004, convém lembrar que o modelo já existia: chama-se-lhe emigração quando somos nós a partir, e imigração quando são os outros a chegar.", "seccao": "6. Os Trinta Gloriosos"}], "cron": [{"k": "19 set 1946", "v": "Discurso de Churchill em Zurique: «uns Estados Unidos da Europa», mas sem a Grã-Bretanha."}, {"k": "mai 1948", "v": "Congresso da Haia, presidido por Churchill. Fundação do Movimento Europeu."}, {"k": "1948 / 1949", "v": "Criação da OECE e do Conselho da Europa."}, {"k": "9 mai 1950", "v": "<strong>Declaração Schuman<\/strong>, no Salão do Relógio. Hoje é o Dia da Europa."}, {"k": "18 abr 1951", "v": "Tratado de Paris: <strong>CECA<\/strong>. Os seis signatários eram todos democratas-cristãos."}, {"k": "30 ago 1954", "v": "A Assembleia Nacional francesa rejeita a <strong>Comunidade Europeia de Defesa<\/strong>, proposta por França."}, {"k": "jun 1955", "v": "Conferência de Messina. A Grã-Bretanha envia um funcionário subalterno, sem mandato."}, {"k": "25 mar 1957", "v": "<strong>Tratados de Roma:<\/strong> CEE e Euratom. Preâmbulo: «união cada vez mais estreita»."}, {"k": "1960", "v": "Criação da EFTA, alternativa britânica. Portugal é membro fundador."}, {"k": "14 jan 1963", "v": "<strong>Primeiro veto de de Gaulle<\/strong> à adesão britânica, anunciado em Paris. Repetido em 1967."}, {"k": "30 jun 1965 – jan 1966", "v": "<strong>Crise da cadeira vazia<\/strong> e compromisso do Luxemburgo."}, {"k": "1 jan 1973", "v": "Primeiro alargamento: Reino Unido, Irlanda e Dinamarca. A Noruega recusa em referendo."}, {"k": "1973", "v": "Choque petrolífero. Fim dos Trinta Gloriosos."}, {"k": "1981", "v": "Adesão da Grécia."}, {"k": "1986", "v": "<strong>Adesão de Portugal e de Espanha.<\/strong> Assinatura do <strong>Ato Único Europeu<\/strong>."}], "conceitos": [{"k": "Funcionalismo", "v": "Método de Monnet: integrar setor a setor, começando por domínios técnicos, na expectativa de que cada integração torne a seguinte necessária. Construir «por ziguezague»."}, {"k": "Solidariedade de facto", "v": "Expressão central da Declaração Schuman. A Europa faz-se por realizações concretas, não por proclamações de conjunto."}, {"k": "Supranacionalidade", "v": "Transferência de poderes de decisão dos Estados para instituições comuns, cujas decisões os vinculam. Presente desde a Alta Autoridade da CECA."}, {"k": "Trinta Gloriosos", "v": "Expressão de Jean Fourastié para o período de crescimento excecional entre cerca de 1950 e 1973. Motores: recuperação, transferência de mão de obra da agricultura e consumo de massas."}, {"k": "Cadeira vazia", "v": "Boicote francês ao Conselho de Ministros entre junho de 1965 e janeiro de 1966, contra a passagem à maioria qualificada. Termina no compromisso do Luxemburgo."}, {"k": "Geoestratégia dos alargamentos", "v": "Lógica pela qual a adesão serve de âncora democrática. Aplicada à Grécia, a Portugal e a Espanha nos anos oitenta, e à Europa de Leste nos anos 2000."}, {"k": "Ato Único Europeu", "v": "Assinado em 1986. Fixa o mercado interno para 1992 e alarga a votação por maioria qualificada, pondo fim à era do veto informal."}], "frases": [], "fontes": ["<strong>Declaração Schuman<\/strong>: «a Europa não se fará de uma só vez [...] criando primeiro uma solidariedade de facto»; e o objetivo de tornar a guerra «não apenas impensável, mas materialmente impossível».", "<strong>Churchill<\/strong>, em Zurique: «temos de construir uma espécie de Estados Unidos da Europa»; e a parceria entre a França e a Alemanha como primeiro passo.", "<strong>Adenauer<\/strong>: «esta é a nossa abertura»; e, a Mollet depois do Suez, «a Europa será a vossa vingança».", "<strong>Mendès-France<\/strong>: «na CED havia integração a mais e Inglaterra a menos».", "<strong>Judt<\/strong>: os três fundadores vinham das margens dos seus países e conversavam em alemão; e a advertência para não exagerar a importância do Tratado de Roma.", "<strong>Patel<\/strong>: Churchill propunha uma Europa «para os outros»; e as sondagens francesas favoráveis à adesão britânica que de Gaulle ignorou.", "<strong>Ash<\/strong>: o Conselho da Europa como irmão mais velho de casaco de tweed.", "<strong>Macmillan<\/strong>, no diário, no dia do veto: «é o fim de tudo aquilo por que trabalhei»."], "perguntas": [{"q": "Explique a origem e o método da construção europeia.", "guia": "Partir do contexto: ruína, medo soviético, problema alemão por resolver e impotência revelada em Suez. Distinguir a via dos congressos, que produziu o Conselho da Europa, da via de Monnet, que produziu a CECA. Explicar o funcionalismo e citar a Declaração Schuman. Mostrar por que razão carvão e aço: material de guerra e de reconstrução. Concluir com o fracasso da CED em 1954 como prova de que o método tinha de ser gradual."}, {"q": "Porque vetou de Gaulle duas vezes a adesão britânica?", "guia": "Razões declaradas: insularidade, ligação atlântica, receio de um cavalo de Troia americano. Razões reais: liderança francesa na Comunidade, ilustrada pela imagem dos dois galos. Descrever a encenação de 14 de janeiro de 1963 e a dupla afronta apontada por Patel. Referir a reação de Macmillan e a ironia de as sondagens francesas serem favoráveis à adesão. Terminar em 1973, depois da saída de de Gaulle."}, {"q": "O que foram os Trinta Gloriosos e por que acabaram?", "guia": "Definir o período e o autor da expressão. Explicar os três motores: recuperação com apoio americano, transferência de mão de obra do campo para a indústria e consumo de massas. Descrever a transformação material da vida quotidiana e o Estado social como consenso político. Explicar o fim em 1973, com o choque petrolífero e a estagflação, ligando ao Ponto 7. Incluir a dimensão portuguesa da emigração."}, {"q": "Qual foi a lógica dos alargamentos da Comunidade?", "guia": "Distinguir o primeiro alargamento, de 1973, de natureza sobretudo económica e política clássica, dos alargamentos a sul, de 1981 e 1986, de natureza explicitamente geoestratégica. Explicar o mecanismo da âncora democrática: aderir torna o regresso ao autoritarismo demasiado caro. Avaliar o êxito e projetar a mesma lógica para o alargamento a leste nos anos 2000."}, {"q": "A integração europeia foi um projeto idealista ou uma convergência de interesses nacionais?", "guia": "Expor a narrativa fundadora dos visionários e a leitura revisionista de Milward e Patel, segundo a qual os Estados integraram para se salvar e não para se dissolver. Discutir se a CEE causou ou apenas acompanhou a prosperidade, usando os argumentos incómodos: o crescimento é anterior à CECA, os países de fora cresceram igualmente, e a estimativa de cerca de meio ponto percentual anual. Terminar na tensão nunca resolvida entre federalistas e intergovernamentalistas."}], "biblio": ["Kiran Klaus PATEL, <em>História Concisa da União Europeia<\/em> (referência central e revisionista).", "Tony JUDT, <em>Pós-Guerra<\/em>, caps. 5, 8, 9 e os capítulos sobre prosperidade e sociedade de consumo.", "Ian KERSHAW, <em>Continente Dividido<\/em>, caps. 2 a 5.", "Timothy Garton ASH, <em>Pátrias<\/em>.", "Kevin WILSON e Jan VAN DER DUSSEN (eds.), <em>The History of the Idea of Europe<\/em>.", "Bernard WASSERSTEIN, <em>Barbarism and Civilization<\/em>, caps. sobre a integração."], "lecionado": "Previsto para a aula de 27 de outubro de 2026.", "autores": [{"nome": "Winston Churchill", "apelido": "Churchill", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Tony Judt", "apelido": "Judt", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Declaração Schuman", "apelido": "Schuman", "tipos": ["ficha"], "n": 0}, {"nome": "Adenauer", "apelido": "Adenauer", "tipos": ["ficha"], "n": 0}, {"nome": "Mendès-France", "apelido": "Mendès-France", "tipos": ["ficha"], "n": 0}, {"nome": "Patel", "apelido": "Patel", "tipos": ["ficha"], "n": 0}, {"nome": "Ash", "apelido": "Ash", "tipos": ["ficha"], "n": 0}, {"nome": "Macmillan", "apelido": "Macmillan", "tipos": ["ficha"], "n": 0}], "anos": ["1946", "1948", "1949", "1950", "1951", "1954", "1955", "1957", "1960", "1963", "1965", "1966", "1973", "1981", "1986"]}, {"n": 10, "titulo": "O ano em que o muro caiu", "subtitulo": "O fim da Guerra Fria: a reunificação da Alemanha, o colapso do comunismo soviético e o panorama do Leste Europeu", "datas": "1978 — 1991", "epigrafe": {"texto": "«Não podemos continuar a viver assim.»", "autor": "Mikhail Gorbachev à mulher, Raissa, na noite anterior à sua nomeação, março de 1985"}, "seccoes": ["1. Um telefonema em Moscovo", "2. Nove dias em junho", "3. Uma operadora de grua e umas velas de cemitério", "4. A lei marcial", "5. «Não podemos continuar a viver assim»", "6. Chernobyl", "7. A doutrina Sinatra", "8. 1989", "9. A Alemanha e o fim", "10. Porque caiu?"], "citacoes": [{"tipo": "fonte", "paras": ["«Como é que isto pôde acontecer? Como é que vocês puderam permitir a eleição de um cidadão de um país socialista para Papa?»"], "fonte": "Iuri Andropov, 16 de outubro de 1978", "seccao": "1. Um telefonema em Moscovo"}, {"tipo": "documento", "paras": ["«Não tenhais medo.»"], "fonte": "João Paulo II, Cracóvia, junho de 1979", "seccao": "2. Nove dias em junho"}, {"tipo": "historiador", "paras": ["«Durante os nove dias da visita do Papa, foi como se o Estado comunista tivesse deixado de existir. Havia apenas a sociedade polaca.»"], "fonte": "Timothy Garton Ash, <em>Pátrias<\/em>", "seccao": "2. Nove dias em junho"}, {"tipo": "fonte", "paras": ["«Pois esse outro devia recusar-se a fazê-lo, e depois o outro, e o outro a seguir. Não podem despedir toda a gente, pois não?»"], "fonte": "Anna Walentynowycz, Gdansk, agosto de 1980", "seccao": "3. Uma operadora de grua e umas velas de cemitério"}, {"tipo": "fonte", "paras": ["«Lembra-se de mim? Trabalhei aqui dez anos e ainda me sinto um operário do Estaleiro Lenine. Tenho a confiança dos trabalhadores daqui, embora já lá vão quatro anos desde que perdi o emprego.»"], "fonte": "Lech Wałęsa, Estaleiro Lenine, Gdansk, 14 de agosto de 1980", "seccao": "3. Uma operadora de grua e umas velas de cemitério"}, {"tipo": "fonte", "paras": ["«Este é o m Leste, 7 de outubro de 1989", "seccao": "8. 1989"}, {"tipo": "historiador", "paras": ["«O impotente governo da Alemanha de Leste abriu o Muro de Berlim por engano. Não era suposto acontecer, pelo menos não naquele dia e não daquela maneira.»"], "fonte": "Victor Sebestyen, <em>Revolução 1989<\/em>", "seccao": "8. 1989"}, {"tipo": "fonte", "paras": ["«Tudo o que eu pensava agora era em evitar derramamento de sangue. Tínhamos pistolas. Eu dera instruções para não as usar, mas e se um dos homens perdesse a cabeça? Mesmo um tiro para o ar, não consigo imaginar a reação que teria provocado. Disse aos meus superiores que não conseguia aguentar mais o posto.»"], "fonte": "Harald Jäger, comandante do posto de Bornholmer Strasse, 9 de novembro de 1989", "seccao": "8. 1989"}, {"tipo": "fonte", "paras": ["«Os ideais por que lutei durante muitos anos e pelos quais fui preso começam a ganhar vida como expressão da vontade do povo.»"], "fonte": "Václav Havel, Praga, novembro de 1989", "seccao": "8. 1989"}, {"tipo": "historiador", "paras": ["«Nicolae Ceausescu perdeu o poder no momento em que a sua cara foi vista na televisão romena, confusa, depois petrificada e por fim fraca, enquanto a multidão o apupava num comício em Bucareste. Quatro dias depois estava morto.»"], "fonte": "Victor Sebestyen, <em>Revolução 1989<\/em>", "seccao": "8. 1989"}, {"tipo": "documento", "paras": ["«Povo, o vosso governo regressou a vós.»"], "fonte": "Václav Havel, Praga, 1 de janeiro de 1990", "seccao": "10. Porque caiu?"}], "prof": [], "hoje": [], "cron": [{"k": "16 out 1978", "v": "Eleição de João Paulo II. Reação de Andropov: «Wojtyła é uma ameaça à segurança soviética.»"}, {"k": "2-10 jun 1979", "v": "<strong>Visita do Papa à Polónia.<\/strong> Um terço da população vê-o pessoalmente. «Não tenhais medo.»"}, {"k": "9 / 14 ago 1980", "v": "Despedimento de Anna Walentynowycz e início da greve no Estaleiro Lenine. Nasce o <strong>Solidariedade<\/strong>."}, {"k": "13 dez 1981", "v": "<strong>Lei marcial<\/strong> na Polónia, decretada por Jaruzelski."}, {"k": "1982-1985", "v": "Morte de Brejnev, Andropov e Chernenko."}, {"k": "11 mar 1985", "v": "<strong>Gorbachev<\/strong> torna-se secretário-geral, aos 54 anos. Glasnost e perestroika."}, {"k": "26 abr 1986", "v": "<strong>Chernobyl.<\/strong> Primeiro grande teste à glasnost, falhado."}, {"k": "out 1986", "v": "Cimeira de <strong>Reiquiavique<\/strong> entre Reagan e Gorbachev."}, {"k": "dez 1987", "v": "Tratado INF: eliminação de uma categoria inteira de armas nucleares."}, {"k": "dez 1988", "v": "Discurso de Gorbachev na ONU: liberdade de escolha como princípio universal. Fim da <strong>Doutrina Brejnev<\/strong>."}, {"k": "fev-jun 1989", "v": "Mesa redonda polaca e eleições de 4 de junho, ganhas pelo Solidariedade. No mesmo dia, Tiananmen."}, {"k": "mai-ago 1989", "v": "A Hungria abre a fronteira com a Áustria. Piquenique pan-europeu de Sopron."}, {"k": "9 out 1989", "v": "<strong>Leipzig:<\/strong> setenta mil pessoas com velas. As tropas recuam sem disparar."}, {"k": "9 nov 1989", "v": "<strong>Queda do Muro de Berlim<\/strong>, por engano, após a conferência de imprensa de Schabowski."}, {"k": "17-29 nov 1989", "v": "<strong>Revolução de Veludo<\/strong> na Checoslováquia. Havel eleito presidente a 29 de dezembro."}, {"k": "21-25 dez 1989", "v": "Queda e execução dos <strong>Ceausescu<\/strong> na Roménia. A única revolução sangrenta de 1989."}, {"k": "3 out 1990", "v": "<strong>Reunificação da Alemanha.<\/strong>"}, {"k": "19-21 ago 1991", "v": "Golpe falhado em Moscovo. Ieltsine em cima do tanque."}, {"k": "25 dez 1991", "v": "<strong>Dissolução da União Soviética.<\/strong> A bandeira vermelha é arriada do Kremlin."}], "conceitos": [{"k": "Glasnost", "v": "Transparência. Abertura controlada da informação e do debate público, destinada a corrigir o sistema e não a substituí-lo."}, {"k": "Perestroika", "v": "Reestruturação. Reforma económica e administrativa do socialismo soviético."}, {"k": "Solidariedade", "v": "Primeiro sindicato livre do bloco soviético, nascido em Gdansk em agosto de 1980. Chegou a dez milhões de membros num país de trinta e seis milhões. O nome vem da greve de solidariedade com outras fábricas."}, {"k": "Doutrina Sinatra", "v": "Designação irónica da política de Gorbachev de deixar cada país do bloco seguir o seu caminho. Revoga na prática a Doutrina Brejnev de 1968 e retira aos regimes do leste a sua única garantia de sobrevivência."}, {"k": "Revolução de Veludo", "v": "Queda pacífica do regime checoslovaco em novembro e dezembro de 1989. Expressão criada pela tradutora de Havel, Rita Klimová."}], "frases": [], "fontes": ["<strong>Andropov<\/strong>: «Wojtyła representa uma ameaça à segurança soviética»; e a diretiva polaca, «o Papa é nosso inimigo».", "<strong>João Paulo II<\/strong>: «Não tenhais medo.»", "<strong>Ash<\/strong>: «durante os nove dias da visita do Papa, foi como se o Estado comunista tivesse deixado de existir; havia apenas a sociedade polaca»; e o crucifixo por cima da mesa do comité de greve.", "<strong>Anna Walentynowycz<\/strong>: «não podem despedir toda a gente, pois não?»", "<strong>Wałęsa<\/strong>, ao ser preso: «este é o momento em que vocês perdem».", "<strong>Gorbachev<\/strong> a Raissa: «não podemos continuar a viver assim».", "<strong>Gromyko<\/strong>: «tem um sorriso simpático, mas tem dentes de ferro».", "<strong>Sebestyen<\/strong>: «o impotente governo da Alemanha de Leste abriu o Muro de Berlim por engano»; e a análise do momento em que Ceausescu perdeu o poder, na televisão.", "<strong>Havel<\/strong>: «Povo, o vosso governo regressou a vós.»"], "perguntas": [{"q": "Que papel teve a Polónia no colapso do comunismo europeu?", "guia": "Encadear três momentos. A visita papal de 1979 e o seu efeito de censo social, com a frase de Ash. O nascimento do Solidariedade em agosto de 1980, a partir do despedimento de uma operadora de grua, e a sua dimensão de dez milhões de membros. A lei marcial de 1981, com a correção de Sebestyen sobre a ameaça soviética que Jaruzelski invocou e que não existia. Concluir com a mesa redonda e as eleições de 4 de junho de 1989 como primeiro dominó."}, {"q": "Que mudanças introduziu Gorbachev e por que razão falharam no seu propósito?", "guia": "Explicar que era comunista convicto e queria salvar o socialismo. Definir glasnost e perestroika. Mostrar, com Chernobyl, o primeiro teste falhado e o seu efeito de longo prazo sobre a confiança. Explicar a revolução externa: Reiquiavique, o Tratado INF e o discurso da ONU de 1988. Concluir com a tese central: retirada a garantia da intervenção militar soviética, os regimes satélites ficaram sem fundações."}, {"q": "Como e por que caiu o Muro de Berlim?", "guia": "Causas: abertura da fronteira húngara em 1989, que esvaziou a função do muro; êxodo de alemães de leste; e a noite de Leipzig, a 9 de outubro, em que as tropas recuaram sem disparar. Mecanismo: a conferência de imprensa de Schabowski, o decreto lido em diagonal, a resposta sobre a entrada em vigor imediata e a cadeia de decisões locais nos postos fronteiriços. Usar a formulação de Sebestyen sobre o engano e sublinhar que a decisão essencial fora tomada um mês antes, em Leipzig."}, {"q": "Compare as revoluções de 1989 na Checoslováquia e na Roménia.", "guia": "Checoslováquia: oposição organizada com credibilidade moral, repressão inicial a 17 de novembro, teatro como quartel-general, onze dias até à queda, e Havel eleito pela mesma assembleia que o prendera. Roménia: regime personalizado e isolado, sem oposição organizada, colapso desencadeado pelo comício de 21 de dezembro transmitido em direto, e desfecho violento com julgamento sumário e execução. Concluir com a observação de Sebestyen sobre o poder da televisão."}, {"q": "Porque caiu o comunismo soviético?", "guia": "Articular as quatro teses: pressão externa e Reagan, esgotamento económico interno, sociedades civis organizadas e a decisão de Gorbachev de não usar a força. Avaliar cada
