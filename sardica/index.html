", "1988", "1989", "1990", "1991"]}, {"n": 11, "titulo": "Encruzilhadas", "subtitulo": "Encruzilhadas europeias: de Maastricht ao Brexit e do consenso democrático à ameaça populista", "datas": "1991 — 2022", "epigrafe": {"texto": "«Aqui a Europa de Maastricht, ali a Europa de Sarajevo.»", "autor": "Timothy Garton Ash, Pátrias"}, "seccoes": ["1. O queijo estragado", "2. Duas Europas na mesma década", "3. A moeda", "4. O alargamento e o que ninguém calculou", "5. As duas rejeições", "6. 2015", "7. A noite de 23 de junho", "8. O populismo, e o que a palavra esconde", "9. O brinde relutante"], "citacoes": [{"tipo": "historiador", "paras": ["«Srebrenica foi o pior assassínio em massa na Europa desde a Segunda Guerra Mundial: um crime de guerra da escala de Oradour, de Lídice ou de Katyn, executado à vista de observadores internacionais.»"], "fonte": "Tony Judt, <em>Pós-Guerra<\/em>, cap. 21", "seccao": "2. Duas Europas na mesma década"}, {"tipo": "historiador", "paras": ["«Todo o resto da Europa, todo o Ocidente em alargamento, permitiu este regresso ao inferno que durou dez anos. É uma mancha terrível naquele que foi, de resto, um dos períodos mais esperançosos da história europeia.»"], "fonte": "Timothy Garton Ash, <em>Pátrias<\/em>", "seccao": "2. Duas Europas na mesma década"}, {"tipo": "fonte", "paras": ["«Havia só um vazio à frente dele. O vazio do futuro que nos tiraram.»"], "fonte": "Theodoros Giannos, Atenas, verão de 2015", "seccao": "3. A moeda"}, {"tipo": "historiador", "paras": ["«Ainda menos previsível, e de facto impensável apenas umas escassas décadas antes, foi a emergência da Europa, na alvorada do século XXI, como paradigma das virtudes internacionais: uma comunidade de valores e um sistema de relações entre Estados apontado por europeus e não europeus como exemplo a imitar por todos.»"], "fonte": "Tony Judt, <em>Pós-Guerra<\/em>, cap. 24", "seccao": "3. A moeda"}, {"tipo": "fonte", "paras": ["«Para mim, como alemão, é completamente inaceitável que a fronteira oriental da Alemanha possa ser permanentemente a fronteira oriental da União Europeia.»"], "fonte": "Helmut Kohl, Oxford, 11 de novembro de 1992", "seccao": "4. O alargamento e o que ninguém calculou"}, {"tipo": "fonte", "paras": ["«Wir schaffen das.» Nós damos conta disto."], "fonte": "Angela Merkel, setembro de 2015", "seccao": "6. 2015"}, {"tipo": "historiador", "paras": ["«Taco de basebol, de facto. Mas também foi crucial para o êxito do Leave que o taco fosse empunhado, por assim dizer, por cavalheiros jogadores de críquete. Sofisticados, cultos, de fala escorreita, apelavam a um eleitorado de classe média que não teria alinhado com Nigel Farage e os rufias do Brexit. Isto era populismo com sotaque de Oxford.»"], "fonte": "Timothy Garton Ash, <em>Pátrias<\/em>", "seccao": "7. A noite de 23 de junho"}, {"tipo": "fonte", "paras": ["«L'Europe!»"], "fonte": "Monsieur M., Ver-sur-Mer, Normandia, 2022, <em>in<\/em> Timothy Garton Ash, <em>Pátrias<\/em>", "seccao": "9. O brinde relutante"}], "prof": [], "hoje": [], "cron": [{"k": "9-10 dez 1991", "v": "Cimeira de Maastricht."}, {"k": "7 fev 1992", "v": "<strong>Tratado da União Europeia<\/strong>, assinado por doze Estados. Em vigor em novembro de 1993."}, {"k": "16 set 1992", "v": "<strong>Quarta-feira negra:<\/strong> a libra sai do mecanismo cambial europeu. A lira sairá também."}, {"k": "1991-1999", "v": "Guerras da Jugoslávia."}, {"k": "11 jul 1995", "v": "<strong>Srebrenica.<\/strong> Cerca de oito mil mortos, à vista de observadores internacionais."}, {"k": "1999 / 1 jan 2002", "v": "Euro escritural e, depois, notas e moedas em circulação."}, {"k": "1 mai 2004", "v": "<strong>Alargamento<\/strong> de quinze para vinte e cinco membros. O Reino Unido não impõe período transitório."}, {"k": "mai-jun 2005", "v": "<strong>Rejeição do Tratado Constitucional<\/strong> em referendo em França (55-45) e nos Países Baixos (61-39)."}, {"k": "2007 / 2009", "v": "Assinatura e entrada em vigor do Tratado de Lisboa. Adesão da Roménia e da Bulgária."}, {"k": "2008", "v": "Crise financeira mundial. Segue-se a crise das dívidas soberanas."}, {"k": "2010", "v": "Vitória do Fidesz na Hungria com dois terços dos lugares e 53% dos votos. Primeiro resgate grego em maio."}, {"k": "2011", "v": "Programa de assistência financeira a Portugal."}, {"k": "5 jul 2015", "v": "<strong>Referendo grego:<\/strong> 61% rejeitam o pacote. Cinco dias depois, o governo propõe um pacote idêntico."}, {"k": "2015", "v": "<strong>Crise dos refugiados.<\/strong> Merkel: «Wir schaffen das.» A Hungria ergue uma vedação na fronteira sérvia."}, {"k": "23 jun 2016", "v": "<strong>Referendo do Brexit:<\/strong> 51,9% pela saída, com 72,2% de participação."}, {"k": "2020", "v": "Saída efetiva do Reino Unido. Pandemia: dívida comum e fundo de recuperação de 750 mil milhões."}, {"k": "2022", "v": "Invasão da Ucrânia. Unidade europeia inesperada em sanções e acolhimento."}], "conceitos": [{"k": "Tratado de Maastricht", "v": "Cria a União Europeia, a cidadania europeia e o calendário da moeda única, acrescentando os pilares da política externa e da justiça. A pressa explica-se pela reunificação alemã e pela vontade francesa de amarrar a Alemanha."}, {"k": "Desvalorização interna", "v": "Numa união monetária, um país que perde competitividade já não pode desvalorizar a moeda e tem de reduzir salários e despesa. É o mecanismo que tornou a austeridade inevitável no sul da Europa depois de 2010."}, {"k": "Défice democrático", "v": "Crítica segundo a qual as decisões europeias são tomadas longe do escrutínio eleitoral. Alimentada pelos referendos contornados em 2005 e pelo referendo grego de 2015."}, {"k": "Geoestratégia do alargamento a leste", "v": "Aplicação à Europa Central da lógica usada com Portugal, Espanha e Grécia: a adesão como âncora democrática. A formulação de Kohl é a mais clara."}, {"k": "Populismo", "v": "Estrutura argumentativa que opõe um povo homogéneo e virtuoso a uma elite corrupta, reclamando-se representante exclusivo do primeiro. Daí a impaciência com tribunais, imprensa e órgãos independentes."}, {"k": "Democracia iliberal", "v": "Expressão do próprio Orbán. Mantêm-se eleições e suprimem-se os limites ao poder de quem as vence."}], "frases": [], "fontes": ["<strong>Ash<\/strong>: «aqui a Europa de Maastricht, ali a Europa de Sarajevo»; «tocámos viola em Maastricht enquanto Sarajevo começava a arder»; «populismo com sotaque de Oxford»; e o comentário sobre o marco, «haviam de se lembrar de que não tinham sido consultados».", "<strong>Judt<\/strong>: Srebrenica como o pior assassínio em massa na Europa desde 1945.", "<strong>Kohl<\/strong>, em Oxford: a fronteira oriental da Alemanha não pode ser a fronteira oriental da União.", "<strong>Merkel<\/strong>: «se o euro falhar, a Europa falha»; «Wir schaffen das».", "<strong>Kershaw<\/strong>: «fora das grandes cidades, a Inglaterra era um país de Brexit»; e a explicação histórica da resposta alemã de 2015.", "<strong>Cummings<\/strong>: o «taco de basebol marcado Turquia, Serviço Nacional de Saúde, trezentos e cinquenta milhões».", "<strong>Baylis<\/strong>: a explicação de por que razão o referendo grego não produziu efeito."], "perguntas": [{"q": "Que mudanças introduziu o Tratado de Maastricht e em que contexto?", "guia": "Enunciar as inovações: União Europeia, cidadania europeia, moeda única e os dois novos pilares. Explicar o contexto da reunificação alemã e o objetivo francês de amarrar a Alemanha, com o marco como preço. Referir o problema de legitimidade, com a ausência de referendo na Alemanha e as sondagens contrárias, e a resposta de Kohl. Concluir com Kershaw: aquilo fora a parte fácil."}, {"q": "Porque é que a crise do euro pôs em causa o projeto europeu?", "guia": "Explicar tecnicamente o que uma união monetária retira a um Estado, sobretudo a desvalorização, e o que lhe falta na zona euro, ou seja, orçamento comum e mobilidade. Referir o aviso de 1992. Descrever o fim de semana de maio de 2010 e a doutrina de Merkel. Quantificar o custo social na Grécia. Terminar com o referendo de julho de 2015 e a explicação de Baylis, mostrando como daí nasce a acusação de défice democrático."}, {"q": "Que consequências teve o alargamento de 2004?", "guia": "Apresentar primeiro o êxito estratégico, com a citação de Kohl e a continuidade com a lógica ibérica dos anos oitenta. Depois, o erro de cálculo britânico: previsão de quinze mil por ano contra mais de dois milhões numa década. Explicar o efeito político: a perceção de que ninguém fora consultado e de que os números oficiais não eram fiáveis, e a sua tradução no referendo de 2016."}, {"q": "Como explicar o Brexit?", "guia": "Causas longas: a guerra civil conservadora sobre Maastricht, segundo Ash, e a tradição britânica de ver a Europa como mercado e não como projeto político. Causas médias: alargamento sem período transitório e austeridade pós-2008. Campanha: o autocarro dos trezentos e cinquenta milhões contra a contribuição líquida real de cento e oitenta e cinco, e a confissão de Cummings sobre o taco de basebol. Sociologia: a Inglaterra fora das grandes cidades, e a observação de Ash sobre o populismo com sotaque de Oxford."}, {"q": "Como caracterizar a ameaça populista à democracia europeia?", "guia": "Definir populismo pela estrutura e não pelo programa económico. Usar o caso húngaro como exemplo documentado: dois terços dos lugares com 53% dos votos, nova constituição, captura sucessiva dos contrapesos e a engenharia do voto dos húngaros do estrangeiro. Explicar a expressão democracia iliberal. Discutir as causas, económicas e culturais, e acrescentar a crise de credibilidade das elites, exemplificada pelos referendos de 2005 e de 2015."}], "biblio": ["Timothy Garton ASH, <em>Pátrias<\/em> (a fonte mais rica e mais recente, escrita na primeira pessoa).", "Ian KERSHAW, <em>Continente Dividido<\/em>, caps. 10 a 12 e epílogo.", "Kiran Klaus PATEL, <em>História Concisa da União Europeia<\/em>, epílogo.", "Tony JUDT, <em>Pós-Guerra<\/em>, cap. 21 e epílogo.", "Michael BURLEIGH, <em>Uma História do Presente<\/em>, cap. 8.", "John BAYLIS <em>et al.<\/em>, <em>The Globalization of World Politics<\/em>, caps. sobre integração e crise."], "lecionado": "Previsto para as aulas de 5 e 10 de novembro de 2026.", "autores": [{"nome": "Tony Judt", "apelido": "Judt", "tipos": ["ficha", "historiador"], "n": 2}, {"nome": "Timothy Garton Ash", "apelido": "Ash", "tipos": ["ficha", "historiador"], "n": 2}, {"nome": "Theodoros Giannos", "apelido": "Giannos", "tipos": ["fonte"], "n": 1}, {"nome": "Helmut Kohl", "apelido": "Kohl", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Angela Merkel", "apelido": "Merkel", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Kershaw", "apelido": "Kershaw", "tipos": ["ficha"], "n": 0}, {"nome": "Cummings", "apelido": "Cummings", "tipos": ["ficha"], "n": 0}, {"nome": "Baylis", "apelido": "Baylis", "tipos": ["ficha"], "n": 0}], "anos": ["1991", "1992", "1999", "1995", "2002", "2004", "2005", "2007", "2009", "2008", "2010", "2011", "2015", "2016", "2020", "2022"]}, {"n": 12, "titulo": "A América e o deserto", "subtitulo": "Os Estados Unidos da América e o Médio Oriente: a guerra do Golfo, o Afeganistão e a segunda intervenção no Iraque", "datas": "1990 — 2021", "epigrafe": {"texto": "«Somos um império agora e, quando agimos, criamos a nossa própria realidade. E, enquanto vocês estudam essa realidade, nós agimos outra vez, criando outras realidades novas, que também poderão estudar. Nós somos os atores da história.»", "autor": "Assessor da administração Bush a um jornalista, in Michael Burleigh"}, "seccoes": ["1. Um dia", "2. O problema da distância", "3. A primeira guerra por computador", "4. Doze anos de sanções", "5. Onze de setembro", "6. O Afeganistão barato", "7. As armas que não existiam", "8. As duas ordens", "9. O surge e a saída", "10. O balanço"], "citacoes": [{"tipo": "fonte", "paras": ["«Quando soube da invasão, peguei num exemplar do Sagrado Alcorão, com a grossura de um braço, e comecei a andar de um lado para o outro no apartamento a murmurar uma oração de que já não me lembro. As linhas telefónicas foram cortadas dois ou três dias depois.»"], "fonte": "Kemal Bosnak, Koweit, agosto de 1990", "seccao": "1. Um dia"}, {"tipo": "documento", "paras": ["«O que está em jogo é mais do que um pequeno país. É uma grande ideia. Uma nova ordem mundial em que nações diversas se unem numa causa comum para realizar as aspirações universais da humanidade.»"], "fonte": "George H. W. Bush, janeiro de 1991", "seccao": "1. Um dia"}, {"tipo": "fonte", "paras": ["«Bush disse-nos para nos revoltarmos contra Saddam. Revoltámo-nos contra Saddam. Mas onde está Bush? Onde é que ele está?»"], "fonte": "Iraquiano xiita, 1991, registado pelo general Bernard E. Trainor", "seccao": "3. A primeira guerra por computador"}, {"tipo": "fonte", "paras": ["«Eu sei, eu sei, mas veja se o Saddam esteve envolvido. Procure. Quero saber de qualquer farrapo.»"], "fonte": "George W. Bush a Richard Clarke, setembro de 2001, <em>in<\/em> Michael Burleigh", "seccao": "5. Onze de setembro"}, {"tipo": "historiador", "paras": ["«Quase de certeza não foi o caso, como depois se afirmou muitas vezes, que Bush e Blair tivessem mentido abertamente ao argumentar a favor da guerra. Mas ambos enganaram os seus povos.»"], "fonte": "Ian Kershaw, <em>Continente Dividido<\/em>, cap. 11", "seccao": "7. As armas que não existiam"}], "prof": [], "hoje": [], "cron": [{"k": "2 ago 1990", "v": "<strong>Invasão do Koweit<\/strong> pelo Iraque. Em 24 horas, o país está ocupado."}, {"k": "ago 1990", "v": "O rei Fahd autoriza tropas americanas na Arábia Saudita. <strong>Recusa da oferta de Bin Laden.<\/strong>"}, {"k": "17 jan 1991", "v": "Início da <strong>Tempestade do Deserto.<\/strong> Estreia dos mísseis de cruzeiro."}, {"k": "24-28 fev 1991", "v": "Ofensiva terrestre, cem horas. Autoestrada da Morte. Cessar-fogo."}, {"k": "3 mar 1991", "v": "Safwan: helicópteros autorizados. Esmagamento das revoltas xiita e curda."}, {"k": "1991-2003", "v": "<strong>Sanções<\/strong> e zonas de exclusão aérea. Um terço das crianças iraquianas desnutridas, segundo a ONU. Drenagem dos pântanos do sul."}, {"k": "1998", "v": "Atentados às embaixadas americanas em Nairobi e Dar es Salam."}, {"k": "11 set 2001", "v": "<strong>Atentados nos Estados Unidos.<\/strong> Cerca de três mil mortos. A NATO invoca o artigo 5.º."}, {"k": "out-dez 2001", "v": "<strong>Guerra do Afeganistão.<\/strong> Cinco semanas, doze mortos americanos. Bin Laden escapa."}, {"k": "nov 2002 – mar 2003", "v": "Regresso dos inspetores. Powell no Conselho de Segurança. Dossiers britânicos dos 45 minutos."}, {"k": "20 mar 2003", "v": "<strong>Invasão do Iraque.<\/strong> Bagdade cai em três semanas."}, {"k": "abr-mai 2003", "v": "Pilhagem generalizada. <strong>Ordens n.º 1 e n.º 2:<\/strong> desbaathificação e dissolução do exército."}, {"k": "abr 2004", "v": "<strong>Abu Ghraib.<\/strong>"}, {"k": "2004-2006", "v": "Guerra civil sectária. Pico de 3709 civis mortos em outubro de 2006."}, {"k": "jan 2007", "v": "<strong>Surge<\/strong> de quase trinta mil homens e doutrina de contra-subversão. Despertar sunita no Anbar."}, {"k": "2011", "v": "Morte de Bin Laden no Paquistão. <strong>Retirada americana do Iraque.<\/strong>"}, {"k": "ago 2021", "v": "<strong>Retirada do Afeganistão<\/strong> e regresso dos talibãs ao poder."}], "conceitos": [{"k": "Inimigo próximo e inimigo longínquo", "v": "Distinção jihadista entre os regimes árabes e os Estados Unidos. A recusa saudita da oferta de Bin Laden em 1990 inverteu a prioridade a favor do segundo."}, {"k": "Dano colateral", "v": "Expressão criada para designar a morte acidental de civis. Faz parte de um vocabulário de guerra desenhado para a televisão, tal como «ataque cirúrgico»."}, {"k": "Guerra preventiva", "v": "Doutrina adotada depois de 2001: perante Estados hostis, armas de destruição maciça e terrorismo, não se espera pelo primeiro golpe. Base declarada da invasão de 2003."}, {"k": "Desbaathificação", "v": "Ordem n.º 1 de maio de 2003, por analogia com a desnazificação de 1945. Expulsou da administração os membros do partido único, isto é, quase todos os quadros qualificados."}, {"k": "Surge", "v": "Reforço de tropas de 2007, acompanhado de uma doutrina de contra-subversão centrada na proteção da população. Reduziu a violência, com resultados que os críticos comparavam ao Vietname."}], "frases": [], "fontes": ["<strong>Hourani<\/strong>: a oferta de Bin Laden e a sua recusa; a inversão de prioridade para o inimigo longínquo; o efeito da dissolução do exército na deriva sectária.", "<strong>Zwier e Weltig<\/strong>: a definição de «dano colateral» e de «ataque cirúrgico»; os vídeos dos acertos divulgados e os dos falhanços não; o testemunho xiita sobre Bush.", "<strong>Burleigh<\/strong>: a guerra do Golfo como jogo de vídeo que causou mais danos em seis semanas do que oito anos de guerra Irão-Iraque; a ficção oficial de 2011; «somos um império agora».", "<strong>Reynolds<\/strong>: menos de dez por cento da tonelagem era de bombas de precisão.", "<strong>Kershaw<\/strong>: Bush e Blair não mentiram abertamente, mas enganaram os seus povos.", "<strong>Young e Kent<\/strong>: meio milhão de desempregados com acesso a armas num país com cinquenta por cento de desemprego; a ausência de ligação entre a Al-Qaeda e Saddam.", "<strong>Ash<\/strong>: Abu Ghraib como golpe autoinfligido na credibilidade americana."], "perguntas": [{"q": "Que consequências de longo prazo teve a guerra do Golfo de 1991?", "guia": "Enumerar quatro. A instalação permanente de tropas americanas na Arábia Saudita, com a indignação que gerou. A recusa da oferta de Bin Laden e a consequente inversão de prioridade para o inimigo longínquo, com Hourani. O regime de sanções de doze anos e os seus efeitos humanitários, que se tornaram argumento de propaganda. E a sobrevivência de Saddam, com o abandono das revoltas xiita e curda depois de Safwan."}, {"q": "Como foi justificada a invasão do Iraque em 2003 e por que razão a justificação ruiu?", "guia": "Expor a doutrina da guerra preventiva e os três argumentos: armas de destruição maciça, ligação ao terrorismo e libertação. Mostrar o que os inspetores encontraram, ou seja, nada, e a apresentação de Powell. Referir os dossiers britânicos e os quarenta e cinco minutos. Usar o juízo equilibrado de Kershaw sobre engano e mentira, e a ironia de Burleigh sobre a ambiguidade deliberada de Saddam."}, {"q": "Porque é que a ocupação do Iraque falhou?", "guia": "Distinguir a rapidez da vitória militar do colapso da ocupação. Pilhagem sem policiamento, com os números de Burleigh. Ordens n.º 1 e n.º 2, a analogia errada com a desnazificação e as contas de Young e Kent e de Hourani sobre o meio milhão de desempregados armados. Abu Ghraib e a perda de autoridade moral. Concluir com a guerra civil sectária, o surge e a retirada de 2011."}, {"q": "Que relação existe entre a invasão de 2003 e o aparecimento do Estado Islâmico?", "guia": "Estabelecer a cadeia causal com factos: inexistência da Al-Qaeda no Iraque antes de 2003; criação de um reservatório de homens treinados e humilhados pelas duas ordens de Bremer; guerra civil sectária que dá enquadramento social ao jihadismo; e retirada de 2011 com um governo sectário e um exército de soldados-fantasma. Distinguir causa necessária de causa suficiente, e referir também fatores anteriores, como a difusão wahabita e as redes afegãs do capítulo 7."}, {"q": "Compare a retirada do Afeganistão em 2021 com a queda de Saigão em 1975.", "guia": "Semelhanças: colapso rápido de um exército local treinado e financiado pelo interveniente, evacuação caótica com imagens de aeroportos e telhados, e derrota política sem derrota militar em campo. Diferenças: no Afeganistão não houve exército regular invasor, mas reconquista por um movimento interno, e a presença durou vinte anos em vez de dez. Concluir com a lição comum sobre a diferença entre derrubar um regime e construir um Estado legítimo."}], "biblio": ["Lawrence ZWIER e Mathew WELTIG, <em>The Persian Gulf and Iraqi Wars<\/em> (referência central).", "Michael BURLEIGH, <em>Uma História do Presente<\/em>, caps. 1 e 3.", "Albert HOURANI, <em>História dos Povos Árabes<\/em>, caps. finais.", "John W. YOUNG e John KENT, <em>International Relations since 1945<\/em>, caps. 23 e 24.", "Antony BEST <em>et al.<\/em>, caps. finais.", "Ian KERSHAW, <em>Continente Dividido<\/em>, cap. 11."], "lecionado": "Previsto para a aula de 12 de novembro de 2026.", "autores": [{"nome": "Kemal Bosnak", "apelido": "Bosnak", "tipos": ["fonte"], "n": 1}, {"nome": "George H. W. Bush", "apelido": "Bush", "tipos": ["documento"], "n": 1}, {"nome": "Ian Kershaw", "apelido": "Kershaw", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Hourani", "apelido": "Hourani", "tipos": ["ficha"], "n": 0}, {"nome": "Zwier", "apelido": "Zwier", "tipos": ["ficha"], "n": 0}, {"nome": "Weltig", "apelido": "Weltig", "tipos": ["ficha"], "n": 0}, {"nome": "Burleigh", "apelido": "Burleigh", "tipos": ["ficha"], "n": 0}, {"nome": "Reynolds", "apelido": "Reynolds", "tipos": ["ficha"], "n": 0}, {"nome": "Young", "apelido": "Young", "tipos": ["ficha"], "n": 0}, {"nome": "Kent", "apelido": "Kent", "tipos": ["ficha"], "n": 0}, {"nome": "Ash", "apelido": "Ash", "tipos": ["ficha"], "n": 0}], "anos": ["1990", "1991", "2003", "1998", "2001", "2002", "2004", "2006", "2007", "2011", "2021"]}, {"n": 13, "titulo": "A primavera que virou inverno", "subtitulo": "A ascensão e queda das revoltas árabes, o terrorismo do Estado Islâmico e o xadrez do Médio Oriente atual", "datas": "2010 — 2023", "epigrafe": {"texto": "«Uma revolução é um processo, não um acontecimento.»", "autor": "Ahdaf Soueif, escritora egípcia, sobre a praça Tahrir"}, "seccoes": ["1. Um carrinho de legumes", "2. A cena que decide não é a da praça", "3. O Ocidente com duas caras", "4. Bengasi", "5. A Síria", "6. O califado", "7. O inverno", "8. O xadrez de hoje"], "citacoes": [{"tipo": "fonte", "paras": ["«Em bairros de todo o país, durante a noite desta sexta-feira, o regime matou centenas de jovens do Egito. Polícias e agentes de segurança conduziram carros e camiões contra grupos de manifestantes. Atiradores furtivos abateram jovens e raparigas a partir dos telhados do Ramses Hilton, da Universidade Americana, do Museu Egípcio e do Ministério do Interior. [...] Soldados desfaziam-se em lágrimas e eram consolados pelos revolucionários.»"], "fonte": "Ahdaf Soueif, Cairo, janeiro de 2011", "seccao": "2. A cena que decide não é a da praça"}, {"tipo": "fonte", "paras": ["«Eles falaram de uma zona de exclusão aérea. Então porque é que os palácios de Kadhafi estão a ser bombardeados todas as noites? Dizem que não o querem matar, então porque é que o bombardeiam? O que é que estão a tentar fazer? Assustar os ratos?»"], "fonte": "Vladimir Putin, 2011, <em>in<\/em> Michael Burleigh", "seccao": "4. Bengasi"}], "prof": [], "hoje": [{"rotulo": "De 1945 a ontem à tarde", "texto": "O papel das redes sociais é objeto de uma discussão que continua. Young e Kent e o manual de Baylis sublinham que a internet e os telemóveis permitiram a organização horizontal e a fuga ao controlo estatal, e que sem eles as mobilizações não teriam tido aquela velocidade. Burleigh defende a tese contrária, e é a mais desconfortável: as redes são excelentes para juntar cem mil pessoas numa praça e inúteis para construir um partido, negociar uma constituição ou ganhar uma eleição rural. Quem estava organizado desde há décadas ganhou. Quem estava ligado ganhou a praça e perdeu o país.", "seccao": "7. O inverno"}], "cron": [{"k": "dez 2010", "v": "<strong>Mohamed Bouazizi<\/strong> ateia fogo a si próprio em Sidi Bouzid, Tunísia."}, {"k": "jan 2011", "v": "Fuga de Ben Ali. O chefe do Estado-Maior tunisino recusara disparar."}, {"k": "25 jan – 11 fev 2011", "v": "<strong>Praça Tahrir<\/strong> e queda de Mubarak. O exército recusa-se a disparar."}, {"k": "fev-mar 2011", "v": "Revolta no Barém, esmagada com o envio de mil soldados sauditas a 14 de março."}, {"k": "17 mar 2011", "v": "<strong>Resolução 1973<\/strong> sobre a Líbia: «todos os meios necessários» para proteger civis."}, {"k": "mar 2011", "v": "Início dos protestos na <strong>Síria<\/strong>. O exército alauíta mantém-se leal a Assad."}, {"k": "20 out 2011", "v": "Morte de <strong>Kadhafi<\/strong> em Sirte. O corpo exposto numa câmara frigorífica."}, {"k": "2012", "v": "Eleições livres no Egito, ganhas por Mohamed Morsi e pela Irmandade Muçulmana."}, {"k": "2013", "v": "<strong>Golpe militar de Sisi<\/strong> no Egito. Recuo de Obama na «linha vermelha» síria."}, {"k": "jun 2014", "v": "Tomada de Mossul e proclamação do <strong>califado<\/strong> pelo Estado Islâmico."}, {"k": "2015", "v": "<strong>Intervenção militar russa na Síria.<\/strong> Acordo nuclear com o Irão. Nobel da Paz ao quarteto tunisino."}, {"k": "2015-2017", "v": "Atentados na Europa: Paris, Bruxelas, Manchester."}, {"k": "2017-2019", "v": "Queda de Mossul e de Raqqa. Fim do território do Estado Islâmico."}, {"k": "2020", "v": "Normalização de relações entre Israel e vários Estados árabes."}, {"k": "7 out 2023", "v": "Ataque do Hamas e guerra em Gaza. Além do alcance da bibliografia da cadeira."}], "conceitos": [{"k": "Revoltas árabes", "v": "Vaga de levantamentos iniciada em dezembro de 2010. Fatores comuns: população maioritariamente jovem, desemprego, regimes envelhecidos em estado de emergência permanente e novas tecnologias de mobilização."}, {"k": "A regra do exército", "v": "Onde os chefes militares recusaram disparar, o regime caiu (Tunísia, Egito). Onde o aparelho militar pertencia a uma minoria com medo do que lhe sucederia (Síria) ou foi socorrido de fora (Barém), o regime aguentou-se."}, {"k": "Resolução 1973", "v": "Autorizava «todos os meios necessários» para proteger civis na Líbia, excluindo ocupação. Foi reinterpretada como mandato para mudança de regime, com consequências duradouras sobre a posição russa no Conselho de Segurança."}, {"k": "Estado Islâmico", "v": "Organização nascida da Al-Qaeda no Iraque. Distingue-se por controlar território e administração, por proclamar imediatamente o califado, por usar produção audiovisual profissional e por dirigir violência extrema contra muçulmanos considerados desviantes."}, {"k": "Guerras por interposta pessoa", "v": "Confronto indireto entre a Arábia Saudita e o Irão travado no Barém, no Iraque, no Líbano, na Síria e no Iémen. Estrutura regional que capturou as aberturas de 2011."}], "frases": [], "fontes": ["<strong>Hourani<\/strong>: Bouazizi como vendedor ambulante e não militante; a recusa do general Ammar e a frase atribuída a Tantawi, com a ressalva sobre a prova; a inversão macabra do ritual fúnebre no caso de Kadhafi.", "<strong>Ahdaf Soueif<\/strong>: o relato do Dia da Ira; «uma revolução é um processo, não um acontecimento».", "<strong>Young e Kent<\/strong>: sessenta por cento da população com menos de trinta anos; a Resolução 1973 reinterpretada como mudança de regime; o corpo de oficiais alauíta como explicação da resistência de Assad.", "<strong>Burleigh<\/strong>: a hipocrisia do Barém; a reação de Putin à Líbia; a estimativa de mortos líbios no rescaldo; o ceticismo sobre o papel das redes sociais."], "perguntas": [{"q": "Quais foram as causas das revoltas árabes de 2011?", "guia": "Estruturais: demografia jovem com sessenta por cento abaixo dos trinta anos, desemprego, regimes envelhecidos sem legitimidade eleitoral e em emergência permanente. Conjunturais: subida do preço dos alimentos e o efeito de demonstração de um país para o outro. Instrumentais: internet e telemóveis. Faísca: Bouazizi, sublinhando com Hourani que não era militante político, o que mostra que o combustível já estava todo lá."}, {"q": "Porque caíram uns regimes e outros não?", "guia": "Desenvolver a regra do exército com os quatro casos. Tunísia e Egito: recusa dos chefes militares de disparar, com Ammar e Tantawi. Síria: corpo de oficiais alauíta com medo existencial, poucas deserções de unidades inteiras. Barém: intervenção saudita externa e interesse estratégico americano. Líbia: exército fraco e fragmentado, daí a guerra civil e a intervenção externa. Concluir que a variável decisiva não foi a dimensão dos protestos, mas a estrutura do aparelho coercivo."}, {"q": "Que consequências teve a intervenção na Líbia?", "guia": "Explicar o mandato da Resolução 1973 e a sua reinterpretação, com as citações de Young e Kent e de Hourani. Consequências no terreno: colapso do Estado, governos rivais, milícias, tráfico humano e armamento disperso pelo Sael. Consequências diplomáticas: consternação de Estados africanos e árabes, e sobretudo a conclusão russa, com a reação de Putin, que ajuda a explicar o veto sistemático posterior e a intervenção na Síria em 2015."}, {"q": "O que foi o Estado Islâmico e em que se distinguiu da Al-Qaeda?", "guia": "Origem: descendente da Al-Qaeda no Iraque, com as causas do capítulo 12. Novidades: território e população, administração e receitas, comunicação profissional para recrutamento global. Diferença doutrinal: proclamação imediata do califado contra o adiamento de Bin Laden, e prioridade dada à violência contra muçulmanos considerados desviantes. Derrota territorial entre 2017 e 2019 e dispersão posterior em franquias."}, {"q": "Porque falharam as revoltas árabes?", "guia": "Articular quatro explicações: militar e institucional, que é a mais empírica; ausência de alternativas organizadas depois de décadas de repressão, deixando apenas exército e redes religiosas; rivalidade regional entre Riade e Teerão a capturar qualquer abertura; e incapacidade económica de responder ao desemprego jovem. Acrescentar o debate sobre as redes sociais, boas para encher praças e más para construir partidos. Terminar com a Tunísia como única exceção duradoura, ainda que erodida, e com a advertência de que uma revolução é um processo."}], "biblio": ["Albert HOURANI, <em>História dos Povos Árabes<\/em>, capítulos finais da edição atualizada.", "John W. YOUNG e John KENT, <em>International Relations since 1945<\/em>, cap. 26.", "Michael BURLEIGH, <em>Uma História do Presente<\/em>, caps. 2, 3, 5 e 7.", "Ian KERSHAW, <em>Continente Dividido<\/em>, cap. 12.", "John BAYLIS <em>et al.<\/em>, caps. sobre terrorismo e segurança."], "lecionado": "Previsto para a aula de 17 de novembro de 2026.", "autores": [{"nome": "Ahdaf Soueif", "apelido": "Soueif", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Vladimir Putin", "apelido": "Putin", "tipos": ["fonte"], "n": 1}, {"nome": "Hourani", "apelido": "Hourani", "tipos": ["ficha"], "n": 0}, {"nome": "Young", "apelido": "Young", "tipos": ["ficha"], "n": 0}, {"nome": "Kent", "apelido": "Kent", "tipos": ["ficha"], "n": 0}, {"nome": "Burleigh", "apelido": "Burleigh", "tipos": ["ficha"], "n": 0}], "anos": ["2010", "2011", "2012", "2013", "2014", "2015", "2017", "2019", "2020", "2023"]}, {"n": 14, "titulo": "O urso ferido", "subtitulo": "A Rússia dos rumos pós-soviéticos de Ieltsin ao neoimperialismo de Putin", "datas": "1991 — 2022", "epigrafe": {"texto": "«Olhem para estas caras à nossa volta. São exatamente iguais às das fotografias da Segunda Guerra Mundial.»", "autor": "Tanya Novgorodskaya, estação central de Kiev, 2022"}, "seccoes": ["1. O homem que acordou um historiador", "2. O ano em que tudo desapareceu", "3. A entrega", "4. A troca", "5. Munique", "6. A Crimeia", "7. 2022", "8. Perdeu-se a Rússia, ou a Rússia encontrou-se?"], "citacoes": [{"tipo": "historiador", "paras": ["«Vinte anos mais tarde, em março de 2014, este homem estava de pé diante de uma audiência em êxtase no Kremlin para celebrar a anexação da Crimeia pela Rússia.»"], "fonte": "Timothy Garton Ash, <em>Pátrias<\/em>", "seccao": "1. O homem que acordou um historiador"}, {"tipo": "historiador", "paras": ["«Velhas de pé à saída das estações do metropolitano, estendendo em silêncio uns quantos rabanetes ou um par de luvas de lã, na esperança de que algum passageiro apressado lhos comprasse.»"], "fonte": "Sheila Fitzpatrick, <em>Breve História da União Soviética<\/em>", "seccao": "2. O ano em que tudo desapareceu"}, {"tipo": "documento", "paras": ["«E, agora, decidi revelar o nome do homem que, penso eu, será capaz de consolidar a sociedade, apoiando-se nas mais amplas forças políticas, garantir a continuação das reformas na Rússia. Poderá unir à sua volta os que deverão renovar a grande Rússia. Trata-se de Vladimir Vladimirovitch Putin, secretário do Conselho de Segurança, diretor do Serviço Federal de Segurança.»"], "fonte": "Boris Ieltsin, agosto de 1999, <em>in<\/em> José Milhazes", "seccao": "3. A entrega"}, {"tipo": "documento", "paras": ["«Para atingir o PIB <em>per capita<\/em> de Portugal ou de Espanha, que não são considerados líderes da economia mundial, precisaremos de cerca de 15 anos.»"], "fonte": "Vladimir Putin, artigo programático de 30 de dezembro de 1999, <em>in<\/em> José Milhazes", "seccao": "3. A entrega"}, {"tipo": "fonte", "paras": ["«A Ucrânia é um Estado-nação independente e soberano e escolherá o seu próprio caminho para a paz e para a segurança.»"], "fonte": "Vladimir Putin, Roma, maio de 2002", "seccao": "5. Munique"}, {"tipo": "historiador", "paras": ["«Quando os turistas de verão embarcaram no voo MH17 da Malaysia Airlines para Kuala Lumpur, no aeroporto de Amesterdão, no domingo 17 de julho de 2014, a última coisa em que pensavam eram os países do leste europeu sobre os quais o seu avião iria voar.»"], "fonte": "Timothy Garton Ash, <em>Pátrias<\/em>", "seccao": "6. A Crimeia"}, {"tipo": "fonte", "paras": ["«Olhem para estas caras à nossa volta. São exatamente iguais às das fotografias da Segunda Guerra Mundial.»"], "fonte": "Tanya Novgorodskaya, Kiev, 2022", "seccao": "7. 2022"}, {"tipo": "historiador", "paras": ["«Que símbolo é aquele no porta-chaves caído ao lado dela? Restaure-se a cor e vê-se com clareza: as estrelas amarelas sobre fundo azul da bandeira europeia.»"], "fonte": "Timothy Garton Ash, <em>Pátrias<\/em>", "seccao": "8. Perdeu-se a Rússia, ou a Rússia encontrou-se?"}], "prof": [], "hoje": [], "cron": [{"k": "25 dez 1991", "v": "Dissolução da União Soviética. Quinze Estados independentes; 25 milhões de russos fora da Rússia."}, {"k": "jan 1992", "v": "<strong>Terapia de choque:<\/strong> liberalização de preços, hiperinflação e destruição das poupanças."}, {"k": "3-4 out 1993", "v": "Ieltsin manda os tanques contra o parlamento. Várias centenas de mortos."}, {"k": "dez 1993", "v": "Nova constituição, com poderes presidenciais muito superiores aos do parlamento."}, {"k": "1994-1996", "v": "<strong>Primeira guerra da Chechénia.<\/strong> Humilhação militar russa."}, {"k": "1995-1996", "v": "<strong>Empréstimos por ações<\/strong>: nascimento dos oligarcas. Reeleição de Ieltsin em 1996."}, {"k": "ago 1998", "v": "Incumprimento da dívida e desvalorização do rublo."}, {"k": "set 1999", "v": "Atentados a prédios de habitação. Início da <strong>segunda guerra da Chechénia<\/strong>."}, {"k": "31 dez 1999", "v": "<strong>Ieltsin entrega o poder a Putin<\/strong>, com garantia escrita de imunidade para a família."}, {"k": "2000-2008", "v": "Subida do preço do petróleo, crescimento económico e consolidação da «vertical do poder»."}, {"k": "2003", "v": "Detenção de Khodorkovsky e desmantelamento da Yukos."}, {"k": "10 fev 2007", "v": "<strong>Discurso de Munique:<\/strong> denúncia do «mundo unipolar»."}, {"k": "abr 2008", "v": "Cimeira da NATO em Bucareste: promessa de adesão futura à Ucrânia e à Geórgia, sem calendário."}, {"k": "ago 2008", "v": "Guerra na <strong>Geórgia<\/strong>, cinco dias."}, {"k": "2013-2014", "v": "Protestos do Maidan em Kiev. Fuga de Ianukovitch a 22 de fevereiro de 2014."}, {"k": "fev-mar 2014", "v": "<strong>Anexação da Crimeia.<\/strong> Discurso de Putin no Kremlin a 18 de março. Guerra no Donbass."}, {"k": "17 jul 2014", "v": "Abate do voo MH17: 298 mortos."}, {"k": "2015", "v": "Intervenção russa na Síria."}, {"k": "jul 2021", "v": "Texto de Putin sobre «a unidade histórica de russos e ucranianos»."}, {"k": "24 fev 2022", "v": "<strong>Invasão em larga escala da Ucrânia.<\/strong>"}], "conceitos": [{"k": "Terapia de choque", "v": "Liberalização súbita de preços e privatização acelerada a partir de 1992. Fez aparecer bens e destruiu poupanças, produzindo uma crise de mortalidade em tempo de paz."}, {"k": "Empréstimos por ações", "v": "Esquema de 1995-96 pelo qual banqueiros emprestaram ao Estado em troca de participações nas empresas de recursos naturais. Kenez chama-lhe a troca de riqueza sem prestação de contas por poder político sem prestação de contas."}, {"k": "Oligarcas", "v": "Pequeno grupo que adquiriu a preços irrisórios os principais ativos do país. Com Putin, mantêm a fortuna desde que fiquem fora da política; quem não cumpre acaba como Khodorkovsky."}, {"k": "Vertical do poder", "v": "Sistema em que as decisões descem de cima e nenhuma instituição funciona como contrapeso autónomo. Assenta na constituição de 1993, feita por Ieltsin."}, {"k": "Mundo russo", "v": "Doutrina segundo a qual existe uma civilização russa cujas fronteiras não coincidem com as do Estado russo, e que este tem o dever de proteger os russos onde estiverem."}, {"k": "Homens verdes", "v": "Militares sem insígnias que tomaram edifícios oficiais na Crimeia em fevereiro de 2014. Moscovo negou durante semanas que fossem russos e admitiu-o depois."}], "frases": [], "fontes": ["<strong>Ash<\/strong>: a cena de São Petersburgo em 1994 e o eco de março de 2014; o MH17; «aquele era um país em guerra»; o porta-chaves em Irpin.", "<strong>Fitzpatrick<\/strong>: as velhas com os rabanetes à saída do metropolitano.", "<strong>Kenez<\/strong>: os salários pagos em papel higiénico; a indisciplina do exército em Grózni; a definição dos empréstimos por ações.", "<strong>Milhazes<\/strong>: os tanques contra o parlamento em 1993; a entrega do poder diante do patriarca; a cronologia da tomada da Crimeia.", "<strong>Putin<\/strong>: «a Ucrânia é um Estado-nação independente e soberano» (2002); o discurso de Munique de 2007; o texto de 2021.", "<strong>Tanya Novgorodskaya<\/strong>: «são exatamente iguais às das fotografias da Segunda Guerra Mundial»."], "perguntas": [{"q": "Que consequências teve o colapso da União Soviética para a Rússia dos anos noventa?", "guia": "Enumerar as quatro perdas simultâneas: império, estatuto, ideologia e nível de vida. Explicar a terapia de choque e o seu efeito sobre poupanças e mortalidade, usando as imagens de Fitzpatrick e de Kenez. Descrever o nascimento dos oligarcas. Referir outubro de 1993 e a constituição que daí saiu, sublinhando que a concentração de poderes é anterior a Putin. Terminar em 1998, com o incumprimento."}, {"q": "Como se explica a ascensão e a popularidade de Putin?", "guia": "Contexto de partida: humilhação, caos e a entrega negociada de 31 de dezembro de 1999, com a imunidade concedida. Instrumento inicial: a segunda guerra da Chechénia e a retórica de ordem. Contrato tácito: rendimento e estabilidade, com o petróleo a subir, em troca da devolução da política ao Estado. Instrumentos de consolidação: televisão, governadores, caso Khodorkovsky e vertical do poder."}, {"q": "Qual foi o significado do discurso de Munique de 2007?", "guia": "Situar a viragem em relação à fase anterior de cooperação, citando a frase de Roma de 2002 sobre a Ucrânia. Expor o conteúdo: denúncia do mundo unipolar e do desrespeito pelo direito internacional. Ligar ao que se segue: Bucareste em 2008 e a promessa sem calendário, a guerra na Geórgia nesse mesmo ano e, depois, a Crimeia. Avaliar o discurso como enunciado antecipado de uma política."}, {"q": "Explique a anexação da Crimeia e a guerra na Ucrânia.", "guia": "Causa imediata: o recuo de Ianukovitch no acordo com a União Europeia e os protestos do Maidan. Método: cronologia de 26 e 27 de fevereiro de 2014, os homens sem insígnias e o referendo contestado. Justificação ideológica: o mundo russo, o texto de 2021 e a tese de que a independência ucraniana é uma anomalia. Consequências: Donbass, MH17, sanções e a invasão de 2022."}, {"q": "O Ocidente «perdeu» a Rússia?", "guia": "Expor as duas teses. A primeira: humilhação dos anos noventa, terapia de choque, alargamento da NATO e marginalização sistemática. A segunda: ausência histórica de governo limitado, poderes presidenciais construídos por Ieltsin, eleições já compradas em 1996 e a adesão à NATO puxada pelos vizinhos e não imposta por Washington. Concluir reconhecendo que os dois argumentos podem ser simultaneamente verdadeiros, e discutir se Putin é oportunista ou ideólogo, usando a cena de 1994 como prova de constância."}], "biblio": ["José MILHAZES, <em>A Mais Breve História da Rússia<\/em> (em português, cobre até Putin).", "Peter KENEZ, <em>História da União Soviética<\/em>, caps. finais.", "Sheila FITZPATRICK, <em>Breve História da União Soviética<\/em>, epílogo.", "Timothy Garton ASH, <em>Pátrias<\/em> (testemunho presencial e a melhor fonte narrativa).", "Ian KERSHAW, <em>Continente Dividido<\/em>, caps. 10 a 12.", "Edward LUCAS, <em>The New Cold War<\/em>."], "lecionado": "Previsto para as aulas de 19 e 24 de novembro de 2026.", "autores": [{"nome": "Timothy Garton Ash", "apelido": "Ash", "tipos": ["ficha", "historiador"], "n": 3}, {"nome": "Sheila Fitzpatrick", "apelido": "Fitzpatrick", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Boris Ieltsin", "apelido": "Ieltsin", "tipos": ["documento"], "n": 1}, {"nome": "Vladimir Putin", "apelido": "Putin", "tipos": ["documento", "ficha", "fonte"], "n": 2}, {"nome": "Tanya Novgorodskaya", "apelido": "Novgorodskaya", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Kenez", "apelido": "Kenez", "tipos": ["ficha"], "n": 0}, {"nome": "Milhazes", "apelido": "Milhazes", "tipos": ["ficha"], "n": 0}], "anos": ["1991", "1992", "1993", "1994", "1996", "1995", "1998", "1999", "2000", "2008", "2003", "2007", "2013", "2014", "2015", "2021", "2022"]}, {"n": 15, "titulo": "O dragão acorda", "subtitulo": "A China do pós-maoísmo de Deng Xiaoping ao globalismo de Xi Jinping", "datas": "1976 — 2022", "epigrafe": {"texto": "«Não tínhamos escolha. Ou assinávamos, ou morríamos de fome.»", "autor": "Yan Jinchang, camponês de Xiaogang, sobre o contrato clandestino de novembro de 1978"}, "seccoes": ["1. Um bocado de papel", "2. Dezoito impressões digitais", "3. O muro de Xidan", "4. O chapéu de cowboy", "5. Shenzhen", "6. A praça", "7. A viagem ao sul", "8. Xi", "9. As três perguntas"], "citacoes": [{"tipo": "fonte", "paras": ["«Era simplesmente de cortar o coração. Se não o fizéssemos, morríamos de fome. Se o fizéssemos, corríamos um risco. No fim escolhemos este caminho. Mesmo com a ameaça de prisão ou de morte, dividimos a terra. Para acabar com a fome.»"], "fonte": "Yan Jinchang, <em>in<\/em> Michael Wood, <em>A História da China<\/em>", "seccao": "2. Dezoito impressões digitais"}, {"tipo": "historiador", "paras": ["«Como tantas vezes na história, enquanto a liderança gosta de reclamar o crédito da mudança, na realidade ela é impulsionada a partir da base.»"], "fonte": "Michael Wood, <em>A História da China<\/em>", "seccao": "2. Dezoito impressões digitais"}, {"tipo": "documento", "paras": ["«O povo chinês não precisa de deuses, nem de imperadores, nem de outro tirano autocrático. Queremos ser senhores do nosso próprio destino.»"], "fonte": "Wei Jingsheng, cartaz no Muro da Democracia, 1978", "seccao": "3. O muro de Xidan"}, {"tipo": "fonte", "paras": ["«Quem trabalhar com os americanos ganhará; os que tentarem opor-se-lhes falharão.»"], "fonte": "Deng Xiaoping, 1979, <em>in<\/em> Odd Arne Westad", "seccao": "4. O chapéu de cowboy"}, {"tipo": "fonte", "paras": ["«Alguns dos presentes têm promovido a ideia de seguir o caminho chinês. Vimos hoje para onde esse caminho leva. Não quero que a Praça Vermelha se pareça com a Praça de Tiananmen.»"], "fonte": "Mikhail Gorbachev, embaixada soviética em Pequim, 15 de maio de 1989", "seccao": "6. A praça"}, {"tipo": "documento", "paras": ["«Chegámos tarde de mais. [...] Vocês ainda são novos, nós somos velhos; têm de viver com saúde e ver o dia em que a China cumprir as Quatro Modernizações. Vocês não são como nós. Nós já somos velhos, já não importamos. Todo o vigor que têm enquanto jovens, nós compreendemo-lo, porque também fomos jovens. Também protestámos e também nos deitámos nos carris sem pensar nas consequências. Peço-vos mais uma vez: pensem no futuro com calma.»"], "fonte": "Zhao Ziyang, Praça de Tiananmen, 19 de maio de 1989", "seccao": "6. A praça"}, {"tipo": "documento", "paras": ["«Para onde se dirigirá a China no século XXI? Continuar uma \"modernização\" sob este tipo de governo autoritário? Ou reconhecer os valores universais, integrar-se na civilização dominante e construir um sistema político democrático? Esta é a grande decisão que agora não pode ser evitada.»"], "fonte": "Carta 08, dezembro de 2008", "seccao": "7. A viagem ao sul"}, {"tipo": "historiador", "paras": ["«A imagem que emerge dos arquivos não é a de um partido dotado de uma visão clara de como conduzir o país à prosperidade. A China parece-se com um petroleiro que de longe se vê impecavelmente aprumado, com o capitão e os seus imediatos de pé, orgulhosos, na ponte, enquanto por baixo do convés os marinheiros bombeiam água desesperadamente e tapam buracos para manter o navio à tona.»"], "fonte": "Frank Dikötter, <em>China After Mao<\/em>, prefácio", "seccao": "9. As três perguntas"}], "prof": [], "hoje": [{"rotulo": "De 1945 a ontem à tarde", "texto": "Entre 1978 e o início deste século, a China retirou da pobreza extrema centenas de milhões de pessoas. É, em números absolutos, a maior melhoria material de condições de vida alguma vez registada na história humana, e aconteceu no mesmo país que, vinte anos antes, tinha vivido a maior fome da história humana. As duas coisas foram decididas pelo mesmo partido.", "seccao": "7. A viagem ao sul"}], "cron": [{"k": "9 set / 6 out 1976", "v": "Morte de Mao e prisão do <strong>Bando dos Quatro<\/strong>. Hua Guofeng sucede-lhe."}, {"k": "24 nov 1978", "v": "<strong>Contrato clandestino de Xiaogang:<\/strong> dezoito camponeses dividem a terra da comuna e assinam com impressões digitais."}, {"k": "dez 1978", "v": "<strong>Terceiro Plenário:<\/strong> a modernização substitui a luta de classes. Deng torna-se dirigente de facto."}, {"k": "1978-1979", "v": "<strong>Muro da Democracia<\/strong> em Xidan. Wei Jingsheng e a «Quinta Modernização». Preso em 1979."}, {"k": "fev 1979", "v": "Visita de Deng aos Estados Unidos. Guerra breve contra o Vietname."}, {"k": "1980", "v": "Criação das <strong>zonas económicas especiais<\/strong>, entre elas Shenzhen."}, {"k": "1984", "v": "Visita de Deng a Shenzhen. Declaração conjunta sino-britânica sobre Hong Kong: «um país, dois sistemas»."}, {"k": "abr-jun 1989", "v": "<strong>Tiananmen.<\/strong> Morte de Hu Yaobang; greve de fome a 13 de maio; Gorbachev a 15 de maio; Zhao Ziyang na praça a 19 de maio; Deusa da Democracia a 30 de maio; repressão a 3-4 de junho."}, {"k": "jan-fev 1992", "v": "<strong>Viagem ao sul<\/strong> de Deng. Relançamento e aceleração das reformas."}, {"k": "1997 / 1999", "v": "Morte de Deng. Retrocessão de Hong Kong e, depois, de Macau."}, {"k": "2001", "v": "<strong>Entrada na Organização Mundial do Comércio.<\/strong>"}, {"k": "2008", "v": "Jogos Olímpicos de Pequim."}, {"k": "2012", "v": "<strong>Xi Jinping<\/strong> torna-se secretário-geral. Campanha anticorrupção."}, {"k": "2013", "v": "Lançamento da <strong>Iniciativa Faixa e Rota<\/strong>."}, {"k": "2018", "v": "Abolição do limite de mandatos presidenciais."}, {"k": "2019-2020", "v": "Protestos em Hong Kong e imposição da lei de segurança nacional."}, {"k": "2020-2022", "v": "Pandemia e política de zero covid, abandonada no fim de 2022 após protestos."}], "conceitos": [{"k": "Quatro Modernizações", "v": "Agricultura, indústria, defesa e ciência e tecnologia. Programa adotado no Terceiro Plenário de 1978. Wei Jingsheng exigiu uma quinta: a democracia."}, {"k": "Sistema de responsabilidade familiar", "v": "Generalização nacional do que foi feito clandestinamente em Xiaogang: a família cultiva um lote, entrega a quota ao Estado e fica com o excedente. Acaba com as comunas populares."}, {"k": "Zonas económicas especiais", "v": "Territórios com regras próprias para atrair capital e tecnologia, criados a partir de 1980. Shenzhen é o caso exemplar, com os contrapontos que Dikötter documenta."}, {"k": "Atravessar o rio sentindo as pedras", "v": "Método de Deng: experimentar localmente e alargar o que resulta, em vez de aplicar um plano teórico."}, {"k": "Um país, dois sistemas", "v": "Fórmula concebida para a retrocessão de Hong Kong em 1997, prometendo cinquenta anos de autonomia. Esvaziada pela lei de segurança nacional de 2020."}, {"k": "Viagem ao sul", "v": "Périplo de Deng em 1992, sem cargo oficial, para forçar a retoma das reformas paradas depois de Tiananmen. Segundo arranque da economia chinesa."}, {"k": "Iniciativa Faixa e Rota", "v": "Programa de investimento em infraestruturas lançado por Xi em 2013, ligando a China à Eurásia, a África e à América Latina. Instrumento económico e de influência."}], "frases": [], "fontes": ["<strong>Yan Jinchang<\/strong>: «não tínhamos escolha; ou assinávamos, ou morríamos de fome».", "<strong>Wood<\/strong>: a mudança é impulsionada a partir da base, embora a liderança reclame o crédito.", "<strong>Wei Jingsheng<\/strong>: «queremos ser senhores do nosso próprio destino».", "<strong>Dikötter<\/strong>: «criticar Mao era uma coisa, Deng outra»; o golpe de 1976 como continuação e não rutura; os contrapontos sobre Shenzhen.", "<strong>Deng<\/strong>: «quem trabalhar com os americanos ganhará»; e o método de atravessar o rio sentindo as pedras.", "<strong>Zhao Ziyang<\/strong>, na praça: «chegámos tarde de mais».", "<strong>Gorbachev<\/strong>, em Pequim: «não quero que a Praça Vermelha se pareça com a Praça de Tiananmen».", "<strong>Zakaria<\/strong>: o que está a acontecer é a ascensão de todos os outros."], "perguntas": [{"q": "Como começou a reforma económica chinesa?", "guia": "Começar pela base e não pelo topo: a noite de 24 de novembro de 1978 em Xiaogang, o risco assumido e o resultado da colheita seguinte. Só depois o Terceiro Plenário e a substituição da luta de classes pela modernização. Explicar a generalização no sistema de responsabilidade familiar e o fim das comunas. Concluir com a observação de Wood sobre quem realmente impulsiona a mudança."}, {"q": "Que limites teve a abertura de Deng Xiaoping?", "guia": "Usar o Muro da Democracia como demonstração. Mostrar o uso instrumental que Deng lhe deu contra Hua Guofeng, a aprovação pública em entrevista a Novak, e a viragem quando Wei Jingsheng passou de criticar Mao a criticar Deng. Referir a prisão e o encerramento do muro. Enunciar o contrato que fica estabelecido em 1979: liberdade económica sim, liberdade política não. Ligar a 1989."}, {"q": "Narre e interprete os acontecimentos de Tiananmen em 1989.", "guia": "Causas: inflação, desigualdade e corrupção visível depois de dez anos de reformas. Cronologia: morte de Hu Yaobang, greve de fome de 13 de maio, presença de Gorbachev a 15 de maio e a imprensa mundial, discurso de Zhao a 19 de maio e a sua queda, Deusa da Democracia a 30 de maio, repressão a 3 e 4 de junho. Interpretação: o regime escolheu a ordem sobre a reforma política, e a frase de Gorbachev mostra que a lição foi lida em Moscovo em sentido inverso."}, {"q": "Porque é que o crescimento económico não produziu democratização na China?", "guia": "Expor a aposta ocidental de 2001 e por que falhou. Primeira explicação: o partido leu 1989 e 1991 e concluiu que o erro soviético fora liberalizar politicamente sem resultados económicos, fazendo por isso o contrário. Segunda: o contrato social de rendimento em troca de silêncio tem funcionado. Terceira: a construção de um aparelho de vigilância e controlo sem precedentes sob Xi. Terminar com a pergunta em aberto sobre o que sucede quando o crescimento abrandar."}, {"q": "A China de Xi Jinping é uma potência revisionista?", "guia": "Apresentar os dois lados com factos. A favor: abolição do limite de mandatos em 2018, Hong Kong em 2020, Xinjiang, pressão sobre Taiwan, Mar do Sul da China e instituições paralelas. Contra: nenhum país lucrou tanto com a ordem económica liberal, e a China precisa de estabilidade para exportar. Usar o quadro de Zakaria sobre a ascensão do resto e concluir que a questão decisiva não é a intenção declarada mas a compatibilidade entre a dimensão chinesa e uma ordem desenhada em 1945 para outro mundo."}], "biblio": ["Frank DIKÖTTER, <em>A China depois de Mao<\/em> (referência central e leitura crítica).", "Michael WOOD, <em>A História da China<\/em>, cap. 19.", "Linda JAIVIN, <em>A Mais Breve História da China<\/em>.", "Odd Arne WESTAD, <em>A Guerra Fria<\/em>, caps. 21 e 22.", "Fareed ZAKARIA, <em>The Post-American World<\/em>.", "Niall FERGUSON, <em>Civilização<\/em>."], "lecionado": "Previsto para as aulas de 26 de novembro e 3 de dezembro de 2026.", "autores": [{"nome": "Yan Jinchang", "apelido": "Jinchang", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Michael Wood", "apelido": "Wood", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Wei Jingsheng", "apelido": "Jingsheng", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Deng Xiaoping", "apelido": "Xiaoping", "tipos": ["fonte"], "n": 1}, {"nome": "Mikhail Gorbachev", "apelido": "Gorbachev", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Zhao Ziyang", "apelido": "Ziyang", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Frank Dikötter", "apelido": "Dikötter", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Deng", "apelido": "Deng", "tipos": ["ficha"], "n": 0}, {"nome": "Zakaria", "apelido": "Zakaria", "tipos": ["ficha"], "n": 0}], "anos": ["1976", "1978", "1979", "1980", "1984", "1989", "1992", "1997", "1999", "2001", "2008", "2012", "2013", "2018", "2019", "2020", "2022"]}, {"n": 16, "titulo": "Uma nova (des)ordem", "subtitulo": "Conclusão: uma nova (des)ordem mundial na era da incerteza?", "datas": "1945 — ontem à tarde", "epigrafe": {"texto": "«Nenhuma previsão é segura. Como todas as gerações anteriores, enfrentamos o futuro com pouco mais do que conjeturas sobre as quais construir os nossos planos.»", "autor": "John Darwin, Ascensão e Queda dos Impérios Globais"}, "seccoes": ["1. Do átomo à rede", "2. A palavra", "3. Nem fim da história nem choque de civilizações", "4. As duas correntes ideológicas", "5. O que está de facto a mudar", "6. O regresso do que se julgava impossível", "7. A resposta à pergunta do título", "8. Para que serviu isto"], "citacoes": [{"tipo": "historiador", "paras": ["«Será assim que devemos ver a transição global? Sim, mas também não. [...] Mais do que nunca, este é um só mundo; mais do que nunca, é divisível.»"], "fonte": "David Reynolds, <em>One World Divisible<\/em>, Epílogo", "seccao": "1. Do átomo à rede"}, {"tipo": "documento", "paras": ["«A globalização refere-se à expansão multidimensional e desigual das relações sociais e da consciência através do espaço-mundo e do tempo-mundo.»", "E, na versão curta: «A globalização tem que ver com interconectividades, mobilidades e imaginações planetárias.»"], "fonte": "Manfred Steger, <em>Globalization. A Very Short Introduction<\/em>", "seccao": "2. A palavra"}, {"tipo": "historiador", "paras": ["«A globalização exibe uma geografia distinta de inclusão e exclusão, com consequências distributivas significativas, criando vencedores e vencidos económicos não apenas entre países, mas também dentro deles. [...] Para os mais abastados, pode muito bem traduzir-se num \"mundo só\"; mas para grande parte da humanidade está associada a um mundo profundamente dividido, marcado pela desigualdade e pela exclusão. Fora do Ocidente, a globalização é frequentemente percebida como ocidentalização.»"], "fonte": "John Baylis <em>et al.<\/em>, <em>The Globalization of World Politics<\/em>", "seccao": "2. A palavra"}, {"tipo": "historiador", "paras": ["«O conceito de globalização não implica qualquer teleologia: não pressupõe que o processo tenha uma lógica histórica ou um propósito único que conduza inevitavelmente a uma sociedade mundial harmoniosa.»"], "fonte": "John Baylis <em>et al.<\/em>", "seccao": "2. A palavra"}, {"tipo": "historiador", "paras": ["«A memória é sobre o passado, mas para o futuro.»", "«Quem se atreve a afirmar que nunca mais pode acontecer? Já aconteceu: na Jugoslávia, na Ucrânia. \"Ah, mas aqui não podia acontecer\", dizem. Dizem sempre.»"], "fonte": "Timothy Garton Ash, <em>Pátrias<\/em>, epílogo", "seccao": "6. O regresso do que se julgava impossível"}, {"tipo": "historiador", "paras": ["«O historiador não está em posição de decidir entre as duas eventualidades contrárias — a unificação progressiva da humanidade e a constituição de uma civilização comum ou, pelo contrário, o agravamento das divisões e a exasperação dos conflitos — qual tem mais possibilidades de se cumprir. Na verdade, sente-se tentado a responder que nenhuma destas duas hipóteses se concretizará, mas que o futuro do mundo será, mais provavelmente, um compromisso precário, constantemente posto em questão, mas também permanentemente restaurado, entre aspirações unitárias e fermentos de divisão.»"], "fonte": "René Rémond, <em>Introdução à História do Nosso Tempo<\/em>", "seccao": "7. A resposta à pergunta do título"}, {"tipo": "historiador", "paras": ["«O que acontecerá nas décadas vindouras é impossível saber. A única certeza é a incerteza. A insegurança continuará a ser uma marca da vida moderna. Os mergulhos e as curvas da Europa, os altos e baixos que caracterizaram a sua história, hão de certamente continuar.»"], "fonte": "Ian Kershaw, <em>Continente Dividido<\/em>, posfácio", "seccao": "7. A resposta à pergunta do título"}, {"tipo": "historiador", "paras": ["«Se, nos anos vindouros, quisermos lembrar-nos de por que parecia tão importante construir um certo tipo de Europa a partir dos crematórios de Auschwitz, só a história nos pode ajudar. [...] Se os europeus quiserem manter esta ligação vital, então ela terá de ser ensinada de novo a cada geração que passa. A \"União Europeia\" pode ser uma resposta à história, mas nunca poderá ser um substituto dela.»"], "fonte": "Tony Judt, <em>Pós-Guerra<\/em>, epílogo", "seccao": "8. Para que serviu isto"}, {"tipo": "historiador", "paras": ["«Hoje, como então, a maior ameaça à civilização ocidental não é colocada por outras civilizações, mas pela nossa própria pusilanimidade, e pela ignorância histórica que a alimenta.»"], "fonte": "Niall Ferguson, <em>Civilização<\/em>", "seccao": "8. Para que serviu isto"}, {"tipo": "fonte", "paras": ["«A esperança não é prognóstico. É uma orientação do espírito, uma orientação do coração. É a capacidade de trabalhar por alguma coisa porque é boa, e não apenas porque tem hipóteses de resultar. Não é a convicção de que algo vai correr bem, mas a certeza de que algo faz sentido, independentemente de como venha a correr.»"], "fonte": "Václav Havel", "seccao": "8. Para que serviu isto"}, {"tipo": "historiador", "paras": ["«De qualquer forma, o historiador terá cumprido o seu papel se tiver contribuído para uma melhor compreensão do presente, se tiver fornecido algumas pistas para uma análise sem preconceitos, se tiver sabido criar o gosto pela observação e inspirado a simpatia pelo mundo em que vivemos.»"], "fonte": "René Rémond, <em>Introdução à História do Nosso Tempo<\/em>, últimas palavras", "seccao": "8. Para que serviu isto"}], "prof": [{"texto": "«Não há destinos fechados em história.»", "quem": "J. M. Sardica, aula de 17 de setembro de 2026", "seccao": "2. A palavra"}], "hoje": [], "cron": [], "conceitos": [{"k": "Globalização", "v": "Processo de alargamento, aprofundamento e aceleração da interligação mundial que transcende Estados e sociedades, dissolvendo a distinção entre assuntos internos e internacionais (Baylis). Ou, em oito palavras de Steger: interconectividades, mobilidades e imaginações planetárias."}, {"k": "Internacionalização e interdependência", "v": "Distinguir da anterior. A primeira é o aumento de ligações entre Estados soberanos; a segunda é a vulnerabilidade mútua entre eles. Só a globalização transcende os Estados."}, {"k": "Os quatro traços", "v": "Alargamento, intensificação, aceleração e entrelaçamento do local com o global."}, {"k": "Desterritorialização e compressão espaço-tempo", "v": "Os dois mecanismos: as atividades desprendem-se do lugar, e a tecnologia encolhe a distância e o tempo."}, {"k": "Globalismo de mercado", "v": "Ideologia dominante entre 1990 e 2008: a globalização é inevitável, irreversível, sem comando e benéfica para todos."}, {"k": "Globalismo de justiça", "v": "Corrente de contestação das regras, e não da interligação. Momento fundador em Seattle, em 1999."}, {"k": "Populismo nacional", "v": "Corrente posterior a 2008 que nega a inevitabilidade da globalização e propõe revertê-la em nome da soberania."}, {"k": "Multipolaridade", "v": "Ordem com vários polos de poder que não formam blocos coerentes, em que os mesmos atores cooperam num domínio e competem noutro."}, {"k": "Ascensão do resto", "v": "Fórmula de Zakaria: não se trata de declínio absoluto do Ocidente, mas do facto de ter deixado de ser o único forte."}], "frases": [], "fontes": ["<strong>Steger<\/strong>: as duas definições de globalização, a longa e a de oito palavras.", "<strong>Baylis<\/strong>: a distinção entre internacionalização, interdependência e globalização; os quatro traços; a geografia de inclusão e exclusão; e a ausência de teleologia.", "<strong>Reynolds<\/strong>: «do átomo à rede»; «mais do que nunca, este é um só mundo; mais do que nunca, é divisível».", "<strong>Zakaria<\/strong>: a ascensão do resto.", "<strong>Rémond<\/strong>: o futuro como «compromisso precário, constantemente posto em questão, mas também permanentemente restaurado»; e a definição do papel do historiador.", "<strong>Kershaw<\/strong>: «a única certeza é a incerteza».", "<strong>Darwin<\/strong>: «nenhuma previsão é segura».", "<strong>Judt<\/strong>: «só a história nos pode ajudar»; a União Europeia como resposta à história e nunca seu substituto.", "<strong>Ferguson<\/strong>: a ameaça vem da ignorância histórica e não de outras civilizações.", "<strong>Ash<\/strong>: «a memória é sobre o passado, mas para o futuro»; «dizem sempre».", "<strong>Havel<\/strong>: a esperança como orientação do espírito e não como prognóstico."], "perguntas": [{"q": "Defina globalização e distinga-a de internacionalização.", "guia": "Dar as definições literais de Steger e de Baylis. Explicar a diferença decisiva: a internacionalização intensifica relações entre Estados que continuam a ser as unidades relevantes; a globalização transcende-os e dissolve a fronteira entre interno e internacional. Enumerar os quatro traços e os dois mecanismos. Terminar com os dois avisos de Baylis: a geografia de vencedores e vencidos, e a ausência de teleologia."}, {"q": "Discuta as teses do «fim da história» e do «choque de civilizações».", "guia": "Enunciar cada uma com rigor, evitando as caricaturas correntes. Refutar a primeira com a China, a Rússia e o populismo interno às democracias. Refutar a segunda com o dado empírico de que os conflitos mais mortíferos ocorreram dentro de civilizações e não entre elas, com exemplos dos capítulos 4, 11 e 13. Apresentar a multipolaridade como alternativa dominante e a formulação de Zakaria."}, {"q": "Estamos perante uma nova ordem ou uma nova desordem mundial?", "guia": "Apresentar as três posições: nova desordem, com instituições paralisadas e regras aplicadas seletivamente; nova ordem multipolar, mais parecida com o século XIX; e a síntese de Rémond do compromisso precário permanentemente restaurado. Sustentar a resposta com a antítese de Reynolds sobre o mundo simultaneamente único e divisível, e concluir com Kershaw sobre a incerteza."}, {"q": "Que transformações estruturais marcam o mundo contemporâneo?", "guia": "Desenvolver as cinco: deslocação do centro económico para a Ásia como correção de uma anomalia de dois séculos; demografia, com o envelhecimento europeu e o crescimento africano; tecnologia, com a interligação e a desintermediação da informação; ambiente, como único problema com prazo e insolúvel isoladamente; e recuo da democracia. Ligar cada uma aos capítulos correspondentes do programa."}, {"q": "Para que serve estudar História Contemporânea?", "guia": "Partir da formulação do professor sobre bagagem cultural de cidadania e sobre a impossibilidade de viver sem memória. Usar Judt sobre a necessidade de reensinar a cada geração por que razão se construiu um certo tipo de Europa a partir de Auschwitz, e sobre a União Europeia como resposta e nunca substituto da história. Usar Ferguson sobre a ignorância histórica como ameaça interna. Usar Ash sobre a memória que é para o futuro, com o exemplo da invasão de 2022 a demonstrar que o impossível volta. Fechar com Rémond sobre o papel do historiador."}], "biblio": ["Manfred STEGER, <em>Globalization. A Very Short Introduction<\/em>.", "John BAYLIS <em>et al.<\/em>, <em>The Globalization of World Politics<\/em>, caps. 1 e conceptuais.", "Fareed ZAKARIA, <em>The Post-American World<\/em>.", "David REYNOLDS, <em>One World Divisible<\/em>, epílogo.", "John DARWIN, <em>Ascensão e Queda dos Impérios Globais<\/em>, cap. final.", "Ian KERSHAW, <em>Continente Dividido<\/em>, posfácio.", "Tony JUDT, <em>Pós-Guerra<\/em>, epílogo.", "René RÉMOND, <em>Introdução à História do Nosso Tempo<\/em>, capítulos conclusivos.", "Timothy Garton ASH, <em>Pátrias<\/em>, epílogo."], "lecionado": "Previsto para a aula de 10 de dezembro de 2026.", "autores": [{"nome": "David Reynolds", "apelido": "Reynolds", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Manfred Steger", "apelido": "Steger", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "John Baylis", "apelido": "Baylis", "tipos": ["ficha", "historiador"], "n": 2}, {"nome": "Timothy Garton Ash", "apelido": "Ash", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "René Rémond", "apelido": "Rémond", "tipos": ["ficha", "historiador"], "n": 2}, {"nome": "Ian Kershaw", "apelido": "Kershaw", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Tony Judt", "apelido": "Judt", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Niall Ferguson", "apelido": "Ferguson", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Václav Havel", "apelido": "Havel", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Zakaria", "apelido": "Zakaria", "tipos": ["ficha"], "n": 0}, {"nome": "Darwin", "apelido": "Darwin", "tipos": ["ficha"], "n": 0}], "anos": []}], "mecanismos": [{"id": "potsdam-muro", "titulo": "Do silêncio de Potsdam ao Muro de Berlim", "pontos": [1, 3], "pergunta": "Explique como uma omissão nos acordos de 1945 conduz, dezasseis anos depois, à construção do Muro de Berlim.", "elos": [{"ev": "Potsdam, 1945: Alemanha e Berlim divididas em quatro; o acesso terrestre a Berlim não é posto por escrito", "porque": "Os aliados julgavam-se aliados; o único parágrafo que viria a importar pareceu desnecessário."}, {"ev": "Bizona (1 jan 1947) e Deutsche Mark (20 jun 1948) nas zonas ocidentais", "porque": "Uma moeda forte no meio da zona soviética cria uma montra capitalista e torna inúteis as prensas de Moscovo."}, {"ev": "Bloqueio de Berlim (24 jun 1948) e ponte aérea de onze meses", "porque": "Clay usa os corredores aéreos, esses sim garantidos por escrito, e transfere para Estaline o ónus do primeiro tiro."}, {"ev": "RFA (23 mai 1949) e RDA (7 out 1949): dois Estados que ninguém procurara", "porque": "Judt: a crise de Berlim conduziu diretamente a um desfecho que nenhum aliado quisera quatro anos antes."}, {"ev": "Fronteira aberta dentro de Berlim: 2,7 a 3,5 milhões saem entre 1949 e 1961", "porque": "A comparação quotidiana entre os dois sistemas é insuportável para a RDA e economicamente fatal (Ulbricht: «não temos meios»)."}, {"ev": "Ultimato de Khrushchev (1958), Cimeira de Viena (jun 1961), Muro (13 ago 1961)", "porque": "Kennedy só se compromete com os setores ocidentais; «um muro é infinitamente melhor do que uma guerra». Best: aceitação mútua do status quo."}], "frase": "Judt: «um desfecho que nenhum dos aliados procurara quatro anos antes». Best: o muro como «acusação última e irrespondível contra o comunismo».", "chaves": ["potsdam", "deutsche mark", "bloqueio", "ponte aérea", "muro", "ulbricht", "viena"]}, {"id": "suez-budapeste", "titulo": "Suez e Budapeste: a semana em que as regras ficaram à vista", "pontos": [3, 6, 7], "pergunta": "Porque é que a crise do Suez e a invasão da Hungria, na mesma semana de novembro de 1956, revelam a estrutura do poder mundial?", "elos": [{"ev": "26 jul 1956: Nasser nacionaliza o canal do Suez", "porque": "Resposta à retirada do financiamento americano à barragem de Assuão e afirmação do nacionalismo árabe pós-Bandung."}, {"ev": "21-24 out: conluio de Sèvres entre Grã-Bretanha, França e Israel", "porque": "Eden vê em Nasser outro Hitler; as potências médias agem sem informar Washington."}, {"ev": "4 nov: tanques soviéticos em Budapeste; 5 nov: desembarque anglo-francês no Egito", "porque": "Moscovo aproveita o Ocidente «num sarilho no Egito» e sem autoridade moral para protestar."}, {"ev": "6-7 nov: Washington ameaça deixar cair a libra; cessar-fogo", "porque": "A derrota europeia é financeira, não militar: Macmillan avisa que a libra não aguenta."}, {"ev": "Consequências: fim da ambição imperial britânica, «a Europa será a vossa vingança» (Adenauer a Mollet), Nasser rais do mundo árabe", "porque": "Hourani: as potências de segunda categoria esbarram nos limites da sua força quando desafiam os interesses das superpotências."}], "frase": "Hourani: «um daqueles raros episódios em que a estrutura do poder no mundo ficou claramente revelada». Rémond: a Europa «já não pode permitir-se ir contra a vontade dos dois grandes, que não são europeus».", "chaves": ["suez", "sèvres", "budapeste", "libra", "nasser", "eden", "adenauer"]}, {"id": "berlim-cuba", "titulo": "Berlim e Cuba: duas peças a nove mil quilómetros", "pontos": [3, 4], "pergunta": "Em que medida a crise dos mísseis de Cuba só se compreende a partir de Berlim?", "elos": [{"ev": "17-20 abr 1961: Baía dos Porcos", "porque": "Kennedy chega a Viena humilhado; Castro ganha legitimidade e Moscovo um protegido."}, {"ev": "3-4 jun 1961: Cimeira de Viena. Khrushchev conclui: «demasiado inteligente e demasiado fraco»", "porque": "O diagnóstico errado sobre Kennedy autoriza o risco de outubro de 1962."}, {"ev": "13 ago 1961: Muro. Kennedy aceita-o: «melhor do que uma guerra»", "porque": "Confirma a Khrushchev que o americano recua perante factos consumados."}, {"ev": "Abril 1962: Júpiter operacionais na Turquia; «um ouriço nas calças do Tio Sam»", "porque": "Khrushchev quer proteger Cuba, equilibrar a desvantagem estratégica e devolver a sensação de mísseis à porta."}, {"ev": "19 out 1962: «O nosso problema não é apenas Cuba, é também Berlim»", "porque": "Atacar Cuba daria a Moscovo o pretexto para tomar Berlim Ocidental; por isso a quarentena e não o bombardeamento."}, {"ev": "28 out: retirada dos mísseis; não-invasão de Cuba; Júpiter retirados em segredo", "porque": "Cada lado dá ao outro uma saída que não pareça derrota. Gaddis: o medo foi maior do que as diferenças."}], "frase": "Kennedy, 19 out 1962: «O nosso problema não é apenas Cuba, é também Berlim.» Gaddis: «o vislumbre de um futuro que ninguém desejava».", "chaves": ["baía dos porcos", "viena", "muro", "júpiter", "turquia", "quarentena", "berlim"]}, {"id": "dien-bien-phu", "titulo": "Dien Bien Phu e as suas três consequências", "pontos": [4, 6], "pergunta": "Mostre como a derrota francesa de maio de 1954 abre três histórias diferentes: o Vietname americano, a guerra da Argélia e o Terceiro Mundo.", "elos": [{"ev": "7 mai 1954: rendição da guarnição francesa em Dien Bien Phu", "porque": "Um exército europeu é derrotado em campo aberto por um exército asiático, com artilharia chinesa arrastada pela selva."}, {"ev": "Genebra (jul 1954): paralelo 17, eleições previstas para 1956 que nunca se fazem", "porque": "McMahon: o Ocidente sabia que Ho Chi Minh as ganharia. Os EUA tornam-se a «bengala» do Sul: a ratoeira diplomática."}, {"ev": "1 nov 1954: começa a insurreição argelina, catorze semanas depois de Genebra", "porque": "Judt: a expulsão humilhante do Vietname cria no exército francês a recusa de perder o que restava no Norte de África."}, {"ev": "Abril 1955: Bandung, 29 Estados sem nenhuma potência europeia na sala", "porque": "Darwin: fim da «era de Vasco da Gama»; a derrota francesa dá à conferência o seu tom."}, {"ev": "1958: queda da IV República; 1962: Évian; 1965-75: a guerra americana", "porque": "Três linhas que saem do mesmo vale: a democracia francesa quase cai, a Argélia torna-se independente, os EUA herdam a guerra."}], "frase": "Wasserstein sobre Dien Bien Phu: a França conseguiu fazer o inimigo sair do esconderijo «em excesso». Judt: a potência colonial «retirou-se relativamente incólume».", "chaves": ["dien bien phu", "genebra", "paralelo 17", "argélia", "bandung", "de gaulle"]}, {"id": "rutura-sino-sovietica", "titulo": "Da aliança de 1950 ao aperto de mão de 1972", "pontos": [4, 5, 15], "pergunta": "Explique a rutura sino-soviética e mostre por que razão ela torna possível a visita de Nixon a Pequim.", "elos": [{"ev": "14 fev 1950: Tratado Sino-Soviético. Mao tratado como «curiosidade», não como discípulo", "porque": "Estaline desconfia de um partido camponês que chegou ao poder pelas próprias mãos: semente pessoal da rutura (Westad)."}, {"ev": "Fev 1956: XX Congresso. Mao: Khrushchev «entrega a espada aos outros»", "porque": "A desestalinização retira legitimidade a quem se apresenta <script>
// ---------- utilitários ----------
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, html="") => { const e=document.createElement(tag); for(const k in attrs){ if(k==="class") e.className=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if(html) e.innerHTML=html; return e; };
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

const pick = a => a[Math.floor(Math.random()*a.length)];
const store = { get:(k,d)=>{ try{ const v=localStorage.getItem("hc:"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} }, set:(k,v)=>localStorage.setItem("hc:"+k, JSON.stringify(v)) };
let SCOPE = store.get("scope", 8);
$("#scope").value = SCOPE;

const caps = () => DATA.capitulos.filter(c => c.n <= SCOPE);
const cap = n => DATA.capitulos.find(c => c.n === n);

// contagem decrescente
function countdown(){

  const dias = Math.floor(d/864e5), h = Math.floor(d%864e5/36e5), m = Math.floor(d%36e5/6e4);
  e.innerHTML = `1.º teste: 22 de outubro de 2026, 15h15<br/><b>${dias} dias</b>, ${h} h ${m} min`;
}
countdown(); setInterval(countdown, 30000);

// seletor de pontos (chips)
function pontosChips(selected, onchange){
  const wrap = el("div", {class:"pontos"});
  caps().forEach(c => {
    const lab = el("label", {class: selected.has(c.n)?"on":""}, `${c.n}`);
    lab.title = c.titulo;
    lab.onclick = () => { if(selected.has(c.n)) selected.delete(c.n); else selected.add(c.n); lab.classList.toggle("on"); onchange(); };
    wrap.appendChild(lab);
  });
  const all = el("label", {}, "todos"); all.onclick = () => { caps().forEach(c=>selected.add(c.n)); wrap.querySelectorAll("label").forEach(l=>{ if(l!==all && l!==none) l.classList.add("on");}); onchange(); };
  const none = el("label", {}, "nenhum"); none.onclick = () => { selected.clear(); wrap.querySelectorAll("label").forEach(l=>l.classList.remove("on")); onchange(); };
  wrap.appendChild(all); wrap.appendChild(none);
  return wrap;
}

function cronologia(m){
  const sel = new Set(store.get("cron_pontos",[...allSel()]).filter(n=>n<=SCOPE)); if(!sel.size) caps().forEach(c=>sel.add(c.n));
  const top = el("div",{class:"card"}); top.innerHTML=`<h2 style="margin-top:0">Cronologia</h2><p class="muted">O primeiro critério é a delimitação cronológica. Dois exercícios: escolher a data certa de um acontecimento, e pôr cinco acontecimentos por ordem.</p>`;
  const modo = el("select"); ["data|Qual é a data?","ordem|Pôr por ordem","lista|Tabela"].forEach(o=>{const [v,t]=o.split("|"); modo.appendChild(el("option",{value:v},t));});

      card.innerHTML=`<span class="rotulo">Ponto ${x.c.n}</span><p style="font-size:1.05rem">${x.e.v.replace(/\b(1[89]\d\d|20\d\d)\b/g,"____")}</p>`;

    } else {
      const five = shuffle(p).slice(0,5); const ordem = five.slice().sort((a,b)=>a.y-b.y); let picked=[];
      card.innerHTML=`<span class="rotulo">Clique pela ordem cronológica, do mais antigo ao mais recente</span>`;
      const list = el("div"); shuffle(five).forEach(o=>{ const b=el("button",{class:"opt"},`${o.e.v} <span class="muted">(Ponto ${o.c.n})</span>`); b.onclick=()=>{ if(b.disabled) return; b.disabled=true; picked.push(o); const certo = ordem[picked.length-1]===o; b.classList.add(certo?"ok":"mau"); b.innerHTML = `${picked.length}. `+b.innerHTML+` <strong>${o.e.k}</strong>`; if(picked.length===5){ score.n++; if(picked.every((q,i)=>q===ordem[i])) score.ok++; store.set("cron_score",score); card.appendChild(el("p",{class:"muted"},`Ordem certa: ${ordem.map(q=>q.e.k).join(" → ")}. Sequências certas: ${score.ok}/${score.n}`)); card.appendChild(el("button",{class:"b",onclick:draw},"Outra sequência")); } }; list.appendChild(b); }); card.appendChild(list);
    }

  modo.onchange=draw; draw();
}
