, "tipos": ["fonte"], "n": 1}, {"nome": "John F. Kennedy", "apelido": "Kennedy", "tipos": ["documento", "ficha", "fonte"], "n": 2}, {"nome": "Antony Best", "apelido": "Best", "tipos": ["ficha", "historiador"], "n": 4}, {"nome": "Imre Nagy", "apelido": "Nagy", "tipos": ["documento"], "n": 1}, {"nome": "Ian Kershaw", "apelido": "Kershaw", "tipos": ["ficha", "historiador"], "n": 2}, {"nome": "Jean Heffer e Michel Launay", "apelido": "Launay", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Len Karpinsky", "apelido": "Karpinsky", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Heffer", "apelido": "Heffer", "tipos": ["ficha"], "n": 0}], "anos": ["1944", "1949", "1945", "1947", "1948", "1953", "1955", "1956", "1958", "1961", "1962", "1963", "1964", "1968", "1969"]}, {"n": 4, "titulo": "O xadrez", "subtitulo": "Os conflitos regionais no xadrez global da Guerra Fria: o «castrismo» em Cuba e as guerras do Vietname", "datas": "1945 — 1975", "epigrafe": {"texto": "«Vocês matarão dez dos nossos homens e nós mataremos um dos vossos, e no fim serão vocês a cansar-se.»", "autor": "Ho Chi Minh"}, "seccoes": ["1. A fila de dominós", "2. Um homem que citava Jefferson", "3. Noventa milhas da Florida", "4. A praia errada", "5. Treze dias", "6. A guerra que ninguém declarou", "7. Tet", "8. Sair", "9. O que ficou"], "citacoes": [{"tipo": "fonte", "paras": ["«Por fim, temos considerações mais vastas que podem seguir aquilo a que se chamaria o princípio do \"dominó a cair\". Temos uma fila de dominós de pé, derrubamos o primeiro, e o que acontecerá ao último é a certeza de que cairá muito depressa.»"], "fonte": "Dwight D. Eisenhower, conferência de imprensa, 1954", "seccao": "1. A fila de dominós"}, {"tipo": "historiador", "paras": ["«[Depois da Segunda Guerra Mundial], a humanidade mergulhou no que se pode encarar razoavelmente como uma Terceira Guerra Mundial, embora uma guerra muito peculiar pois, como observou o grande filósofo Thomas Hobbes, “a guerra não consiste só na batalha ou no acto de lutar, mas num tempo em que a vontade de competir através da batalha é suficientemente conhecida”. A Guerra Fria, entre os dois campos dos EUA e da URSS, que dominou o cenário internacional na segunda metade do século XX, foi sem dúvida um desses períodos. Gerações inteiras viveram à sombra de batalhas nucleares globais que, acreditava-se, poderiam eclodir a qualquer momento e devastar a Humanidade. Não aconteceu, mas durante cerca de quarenta anos pareceu uma possibilidade diária.»"], "fonte": "Eric Hobsbawm, <em>A Era dos Extremos. História Breve do Século XX<\/em>", "seccao": "1. A fila de dominós"}, {"tipo": "documento", "paras": ["«\"Todos os homens são criados iguais. São dotados pelo seu Criador de certos direitos inalienáveis; entre estes, a Vida, a Liberdade e a busca da Felicidade.\" Esta declaração imortal foi feita na Declaração de Independência dos Estados Unidos da América em 1776. Num sentido mais lato, isto significa: todos os povos da terra são iguais desde o nascimento, todos os povos têm o direito de viver, de ser felizes e livres.»"], "fonte": "Ho Chi Minh, declaração de independência do Vietname, Hanói, setembro de 1945", "seccao": "2. Um homem que citava Jefferson"}, {"tipo": "fonte", "paras": ["«Condenem-me, não importa. A história absolver-me-á.»"], "fonte": "Fidel Castro, julgamento de Santiago de Cuba, 1953", "seccao": "3. Noventa milhas da Florida"}, {"tipo": "fonte", "paras": ["«Há imigrantes de toda a parte nos Estados Unidos. E no entanto Cuba é o único país que está a ser atacado por aviões de emigrados. Porquê Cuba? Se há um país que os Estados Unidos deviam tratar com cuidado, esse país é Cuba.»"], "fonte": "Fidel Castro, comício em Havana, outubro de 1959", "seccao": "3. Noventa milhas da Florida"}, {"tipo": "historiador", "paras": ["«Khrushchev e os seus conselheiros tinham ficado surpreendidos, mas depois entusiasmados e por fim radiantes, quando uma revolta marxista-leninista tomara sozinha o poder em Cuba, sem todas as insistências e empurrões que os soviéticos empregaram para instalar os regimes comunistas na Europa de Leste. Pouco importava que Fidel Castro e os seus revolucionários dificilmente encaixassem no modelo de Lenine para uma “vanguarda” revolucionária disciplinada. Bastava que Cuba tivesse adotado o comunismo espontaneamente, sem a ajuda de Moscovo, de uma maneira que parecia confirmar a profecia de Marx sobre o rumo que a história estava a tomar.»"], "fonte": "John Lewis Gaddis, <em>A Guerra Fria<\/em>", "seccao": "3. Noventa milhas da Florida"}, {"tipo": "fonte", "paras": ["«Cinco minutos depois de aquilo começar a desabar, olhámos uns para os outros e perguntámos: \"Como é que pudemos ser tão estúpidos?\" Quando vimos a extensão das falhas, perguntámo-nos por que razão ninguém as tinha visto desde o princípio. Acho que a pessoa fica murada em relação à realidade quando deseja demasiado que uma coisa resulte.»"], "fonte": "John F. Kennedy, <em>in<\/em> Odd Arne Westad, <em>A Guerra Fria<\/em>", "seccao": "4. A praia errada"}, {"tipo": "fonte", "paras": ["«Chegou o momento de um confronto decisivo, porque dentro de um ou dois anos a situação será muitíssimo pior. Se não queremos que a Rússia instale bases de mísseis em Cuba, é melhor decidirmos agora o que estamos dispostos a fazer para o impedir.»"], "fonte": "Robert F. Kennedy, abril de 1961", "seccao": "4. A praia errada"}, {"tipo": "fonte", "paras": ["«Porque é que ele os põe ali? Qual é a vantagem disso? É exatamente como se nós começássemos a pôr um número importante de mísseis de médio alcance na Turquia. Isso seria dos diabos de perigoso, parece-me.»", "«Bom, mas nós fizemos isso, senhor presidente», observou McGeorge Bundy."], "fonte": "Gravações do ExComm, 16 de outubro de 1962, <em>in<\/em> Michael Dobbs, <em>One Minute to Midnight<\/em>", "seccao": "5. Treze dias"}, {"tipo": "fonte", "paras": ["«Mísseis ofensivos em Cuba têm um efeito psicológico e político muito diferente neste hemisfério do que mísseis na União Soviética apontados a nós. O comunismo e o castrismo vão espalhar-se, à medida que governos assustados por esta nova prova de poder forem caindo. Tudo isto representa uma alteração provocatória do delicado <em>status quo<\/em> que ambos os países mantiveram.»"], "fonte": "John F. Kennedy, ExComm, outubro de 1962", "seccao": "5. Treze dias"}, {"tipo": "fonte", "paras": ["«Não creio que tenhamos alternativas satisfatórias. O nosso problema não é apenas Cuba, é também Berlim. E quando reconhecemos a importância de Berlim para a Europa, e a importância dos nossos aliados para nós, é isso que tem feito disto um dilema nestes dias. De outro modo, a nossa resposta seria bastante fácil.»"], "fonte": "John F. Kennedy, 19 de outubro de 1962", "seccao": "5. Treze dias"}, {"tipo": "documento", "paras": ["«Na última semana, provas inequívocas estabeleceram o facto de que uma série de rampas de mísseis ofensivos está a ser preparada nessa ilha aprisionada. O propósito destas bases não pode ser outro senão fornecer capacidade de ataque nuclear contra o Hemisfério Ocidental. [...] Os anos trinta ensinaram-nos uma lição clara: a conduta agressiva, se se deixa sem travão e sem contestação, acaba por conduzir à guerra.»", "«Apelo ao presidente Khrushchev para que trave e elimine esta ameaça clandestina, temerária e provocatória à paz mundial. [...] Tem agora uma oportunidade de afastar o mundo do abismo da destruição.»"], "fonte": "John F. Kennedy, discurso ao país, 22 de outubro de 1962", "seccao": "5. Treze dias"}, {"tipo": "fonte", "paras": ["«Estamos olhos nos olhos, e o outro tipo acaba de piscar.»"], "fonte": "Dean Rusk, 24 de outubro de 1962", "seccao": "5. Treze dias"}, {"tipo": "documento", "paras": ["«Senhor Presidente, nós e os senhores não devíamos agora puxar pelas pontas da corda em que atou o nó da guerra, porque quanto mais os dois puxarmos, mais apertado ficará esse nó. E pode chegar um momento em que esse nó esteja tão apertado que nem aquele que o atou tenha força para o desatar. Então será necessário cortar o nó, e o que isso significaria não me cabe a mim explicar-lhe, porque o senhor próprio compreende perfeitamente as forças terríveis que os nossos países possuem.", "Por conseguinte, se não há intenção de apertar esse nó e assim condenar o mundo à catástrofe da guerra termonuclear, então não relaxemos apenas as forças que puxam as pontas da corda: tomemos medidas para desatar o nó.»"], "fonte": "Nikita Khrushchev a John F. Kennedy, 26 de outubro de 1962", "seccao": "5. Treze dias"}, {"tipo": "documento", "paras": ["«Se a guerra rebentar, não estará no nosso poder detê-la, porque essa é a lógica da guerra. Participei em duas guerras e sei que a guerra acaba quando já rolou por cidades e aldeias, semeando por toda a parte a morte e a destruição.»"], "fonte": "Nikita Khrushchev a John F. Kennedy, 26 de outubro de 1962", "seccao": "5. Treze dias"}, {"tipo": "fonte", "paras": ["«Creio que a agressividade dos imperialistas os torna extremamente perigosos e que, se conseguirem levar a cabo uma invasão de Cuba, esse seria o momento de eliminar este perigo para sempre, num ato da mais legítima autodefesa. Por mais dura e terrível que seja a solução, não haveria outra.»"], "fonte": "Fidel Castro a Nikita Khrushchev, 27 de outubro de 1962", "seccao": "5. Treze dias"}, {"tipo": "fonte", "paras": ["«Há sempre um filho da mãe que não recebe o recado.»"], "fonte": "John F. Kennedy, 27 de outubro de 1962", "seccao": "5. Treze dias"}, {"tipo": "fonte", "paras": ["«Os americanos atingiram-nos com qualquer coisa mais forte do que uma granada, aparentemente uma espécie de carga de profundidade de treino. Pensámos: \"é o fim\". Depois deste ataque, um Savitsky totalmente exausto ficou furioso. Além de tudo o resto, não conseguira estabelecer comunicações com o Estado-Maior. Chamou o oficial encarregado do torpedo nuclear e ordenou-lhe que o preparasse para combate. \"Talvez a guerra já tenha começado lá em cima enquanto nós andamos aqui às cambalhotas\", gritou, a justificar a ordem. \"Vamos fazê-los ir pelos ares agora! Morremos nós, mas afundamo-los a todos! Não vamos desgraçar a nossa marinha!\"»"], "fonte": "Vadim Orlov, testemunho sobre o submarino B-59, <em>in<\/em> Michael Dobbs, <em>One Minute to Midnight<\/em>", "seccao": "5. Treze dias"}, {"tipo": "fonte", "paras": ["«Vamos ter de tomar certas decisões nas próximas doze, ou possivelmente vinte e quatro, horas. Resta muito pouco tempo. Se os cubanos dispararem sobre os nossos aviões, nós respondemos.»", "«Khrushchev deve saber que há muitos cabeças-quentes entre os generais — e não só entre os generais — que estão com vontade de lutar.»", "«Começará uma guerra a sério, em que morrerão milhões de americanos e de russos. Queremos evitar isso de todas as maneiras possíveis.»"], "fonte": "Robert F. Kennedy a Anatoli Dobrynin, 27 de outubro de 1962", "seccao": "5. Treze dias"}, {"tipo": "fonte", "paras": ["«Estava uma noite perfeitamente linda, como são as noites de outono em Washington. Saí do Gabinete Oval e, enquanto saía, pensei que talvez nunca mais viesse a ver outro sábado à noite.»"], "fonte": "Robert McNamara, <em>in<\/em> Odd Arne Westad, <em>A Guerra Fria<\/em>", "seccao": "5. Treze dias"}, {"tipo": "fonte", "paras": ["«Ficámos furiosos. Como soubemos? Pela rádio, na manhã do dia 28. Foi mesmo um acordo vergonhoso. Nunca me passou pela cabeça que fizessem uma coisa destas.»"], "fonte": "Fidel Castro, <em>in<\/em> Odd Arne Westad, <em>A Guerra Fria<\/em>", "seccao": "5. Treze dias"}, {"tipo": "documento", "paras": ["«De que tipo de paz falo e que tipo de paz procuramos? [...] Não a paz da sepultura nem a segurança do escravo. Falo de uma paz genuína, do tipo de paz que faz com que a vida na Terra valha a pena ser vivida, do tipo que permite aos homens e às nações crescer e construir uma vida melhor para os seus filhos. [...] Falo da paz como o fim racional de homens racionais. Sei que a busca da paz não é tão dramática como a busca da guerra. Mas não temos tarefa mais urgente. Porque, em última análise, o nosso elo comum mais básico é que todos habitamos este pequeno planeta. Todos respiramos o mesmo ar. Todos prezamos o futuro dos nossos filhos. E somos todos mortais. [...] Não estamos desamparados perante essa tarefa nem sem esperança no seu êxito. Confiantes e sem medo, temos de trabalhar não para uma estratégia de aniquilação, mas para uma estratégia de paz.»"], "fonte": "John F. Kennedy, «A Strategy of Peace», Universidade Americana, Washington, 10 de junho de 1963", "seccao": "5. Treze dias"}, {"tipo": "historiador", "paras": ["«A crise dos mísseis de Cuba convenceu toda a gente envolvida de que as armas que os dois lados tinham criado durante a Guerra Fria representavam uma ameaça muito mais grave para ambos os lados do que os Estados Unidos e a União Soviética representavam um para o outro. Esta improvável série de acontecimentos, hoje vista unanimemente como o mais próximo que o mundo esteve, durante a segunda metade do século XX, de uma terceira guerra mundial, forneceu o vislumbre de um futuro que ninguém desejava: de um conflito projetado para além da contenção, da razão e da possibilidade de sobrevivência.»"], "fonte": "John Lewis Gaddis, <em>A Guerra Fria<\/em>", "seccao": "5. Treze dias"}, {"tipo": "historiador", "paras": ["«A Guerra Fria podia ter provocado uma guerra quente que muito provavelmente teria acabado com a vida humana no planeta. Mas porque o medo dessa guerra se revelou maior do que todas as diferenças que separavam os Estados Unidos, a União Soviética e os seus respetivos aliados, passaram a existir motivos de esperança de que ela nunca se realizasse.»"], "fonte": "John Lewis Gaddis, <em>A Guerra Fria<\/em>", "seccao": "5. Treze dias"}, {"tipo": "fonte", "paras": ["«É como beber um copo. O efeito passa e é preciso beber outro.»"], "fonte": "John F. Kennedy, novembro de 1961", "seccao": "6. A guerra que ninguém declarou"}, {"tipo": "fonte", "paras": ["«Fomos demasiadas vezes desiludidos pelo otimismo dos líderes americanos, tanto no Vietname como em Washington, para continuarmos a ter fé nos raios de sol que eles encontram nas nuvens mais escuras.»"], "fonte": "Walter Cronkite, CBS Evening News, fevereiro de 1968", "seccao": "7. Tet"}], "prof": [], "hoje": [{"rotulo": "De 1945 a ontem à tarde", "texto": "Vale a pena notar quando é que Castro se declarou comunista: só em dezembro de 1961, quase três anos depois de tomar o poder, e oito meses depois de uma tentativa de invasão apoiada por Washington. A questão de saber se Cuba foi empurrada para os braços de Moscovo ou se para lá caminhava de qualquer maneira continua a dividir os historiadores. O que não está em disputa é a ordem cronológica dos acontecimentos.", "seccao": "3. Noventa milhas da Florida"}, {"rotulo": "De 1945 a ontem à tarde", "texto": "A crise deixou duas heranças práticas. A 20 de junho de 1963 foi instalada uma linha direta entre Washington e Moscovo, para que nunca mais fosse preciso esperar horas por uma tradução. E em agosto assinou-se em Moscovo o Tratado de Interdição Parcial de Ensaios Nucleares, que entrou em vigor a 10 de outubro de 1963 e proibiu os testes na atmosfera, no espaço e debaixo de água. Foi o primeiro acordo de controlo de armamento da era nuclear. Ambos nasceram do susto.", "seccao": "5. Treze dias"}, {"rotulo": "De 1945 a ontem à tarde", "texto": "A pergunta com que o professor fecha a parte cubana da aula não tem resposta na bibliografia, porque a bibliografia acaba antes: que mudança para uma Cuba pós-comunista? O que a história do capítulo permite dizer é isto. Cuba foi, em 1962, a peça que quase fez arder o tabuleiro, e é hoje a última peça do tabuleiro que ainda está no mesmo sítio. O Vietname, que vamos ver a seguir, é comunista e comercia com os Estados Unidos; a China é comunista e é a segunda economia do mundo; a União Soviética não existe. Cuba continua a noventa milhas da Florida, com o mesmo partido, o mesmo embargo e, desde 2018, um presidente que não viveu a revolução. É um bom exemplo de como as consequências de uma crise de treze dias podem durar sessenta anos.", "seccao": "5. Treze dias"}, {"rotulo": "De 1945 a ontem à tarde", "texto": "O professor tira daqui uma regra que aplica a conflitos de ontem à tarde. Numa guerra assimétrica, a potência que não vence está a perder, mesmo que não seja vencida, porque o tempo e a opinião pública correm contra ela e não contra o adversário. Foi assim no Vietname, e é a mesma aritmética, diz ele, que se aplica hoje à Rússia na Ucrânia ou aos Estados Unidos e a Israel face ao Irão. Ho Chi Minh tinha-o dito em 1946: no fim, serão vocês a cansar-se.", "seccao": "6. A guerra que ninguém declarou"}], "cron": [{"k": "2 set 1945", "v": "Ho Chi Minh proclama a independência do Vietname, citando a Declaração de Independência americana."}, {"k": "1946 – 1954", "v": "Primeira guerra da Indochina. Os EUA pagam cerca de 80% do custo francês."}, {"k": "mar – 7 mai 1954", "v": "<strong>Dien Bien Phu.<\/strong> Derrota francesa. Churchill recusa a ação conjunta."}, {"k": "jul 1954", "v": "<strong>Acordos de Genebra:<\/strong> divisão provisória no paralelo 17 e eleições previstas para 1956."}, {"k": "1955 – 1956", "v": "Diem é escolhido pelos EUA, recusa as eleições e obtém 98,2% num referendo fraudulento."}, {"k": "26 jul 1953", "v": "Assalto ao quartel de Moncada. «A história absolver-me-á.»"}, {"k": "dez 1956", "v": "Desembarque do <em>Granma<\/em>; guerrilha na Sierra Maestra."}, {"k": "1 jan 1959", "v": "Fuga de Batista. Castro toma o poder em Cuba."}, {"k": "abr 1959", "v": "Castro é recebido nos Estados Unidos como celebridade."}, {"k": "mar 1960", "v": "Eisenhower autoriza a CIA a treinar exilados cubanos."}, {"k": "16 out 1960", "v": "«Cuba Libre»: nacionalização das empresas e do comércio. Embargo americano no mesmo mês; rutura de relações em janeiro de 1961."}, {"k": "17 abr 1961", "v": "<strong>Baía dos Porcos.<\/strong> Fracasso total em menos de três dias."}, {"k": "dez 1961", "v": "Castro declara-se publicamente marxista-leninista."}, {"k": "14 out 1962", "v": "Um U-2 fotografa as rampas de mísseis em San Cristóbal."}, {"k": "16 out 1962", "v": "Kennedy vê as fotografias. Forma-se o ExComm."}, {"k": "18 out 1962", "v": "Gromyko garante a Kennedy, na Sala Oval, que a ajuda a Cuba é defensiva."}, {"k": "22 out 1962", "v": "Discurso televisivo e anúncio da <strong>quarentena<\/strong>. DEFCON 2."}, {"k": "25 out 1962", "v": "Stevenson exibe as fotografias no Conselho de Segurança: «até que o inferno congele»."}, {"k": "26 out 1962", "v": "Carta de Khrushchev sobre o «nó da guerra»."}, {"k": "27 out 1962", "v": "<strong>Sábado negro:<\/strong> carta de Castro, abate do U-2 de Anderson às 10h19, incidente do submarino B-59, encontro secreto RFK-Dobrynin."}, {"k": "28 out 1962", "v": "Khrushchev cede pela Rádio Moscovo. Fim da crise."}, {"k": "10 jun 1963", "v": "<strong>«A Strategy of Peace»<\/strong>, discurso de Kennedy na Universidade Americana."}, {"k": "jun / out 1963", "v": "Linha direta Washington-Moscovo e Tratado de Interdição Parcial de Ensaios."}, {"k": "11 jun 1963", "v": "Autoimolação de Thich Quang Duc em Saigão."}, {"k": "1-2 nov 1963", "v": "Golpe militar e assassínio de Diem. Kennedy é assassinado a 22 de novembro."}, {"k": "2 e 4 ago 1964", "v": "<strong>Golfo de Tonquim.<\/strong> Resolução aprovada a 7 de agosto por 88 votos contra 2."}, {"k": "2 e 8 mar 1965", "v": "Início da operação <em>Rolling Thunder<\/em> e desembarque dos primeiros fuzileiros em Da Nang."}, {"k": "30-31 jan 1968", "v": "<strong>Ofensiva do Tet.<\/strong> Derrota militar comunista, derrota política americana."}, {"k": "16 mar 1968", "v": "Massacre de <strong>My Lai<\/strong>, revelado em novembro de 1969."}, {"k": "31 mar 1968", "v": "Johnson limita os bombardeamentos e desiste da recandidatura."}, {"k": "1969", "v": "Doutrina de Guam e <strong>vietnamização<\/strong>. Morte de Ho Chi Minh em setembro."}, {"k": "mai 1970", "v": "Invasão do Camboja. Kent State a 4 de maio."}, {"k": "23 / 27 jan 1973", "v": "<strong>Acordos de Paris<\/strong> e cessar-fogo."}, {"k": "30 abr 1975", "v": "<strong>Queda de Saigão.<\/strong> Phnom Penh caíra a 17 de abril."}, {"k": "1975 - 1979", "v": "Pol Pot no Camboja: perto de um quarto da população morta. Êxodo dos <em>boat people<\/em>."}, {"k": "1978 - 1979", "v": "O Vietname invade o Camboja; a China invade o Vietname."}, {"k": "2015 - 2018", "v": "Reabertura da embaixada americana em Havana (2015), visita de Obama (março de 2016), Díaz-Canel sucede a Raúl Castro (abril de 2018)."}], "conceitos": [{"k": "Teoria do dominó", "v": "Formulada por Eisenhower em 1954: a queda de um país para o comunismo arrasta os vizinhos. Justifica atribuir valor estratégico a qualquer ponto do globo. Falhou o teste depois de 1975."}, {"k": "Quarentena", "v": "Designação escolhida por Kennedy para o bloqueio naval a Cuba, porque um bloqueio é juridicamente um ato de guerra. Transferia para Moscovo o ónus do primeiro tiro."}, {"k": "ExComm", "v": "Comité Executivo do Conselho de Segurança Nacional, formado a 16 de outubro de 1962. As suas reuniões foram secretamente gravadas por Kennedy, o que faz desta a crise mais documentada da história."}, {"k": "DEFCON 2", "v": "Grau de prontidão nuclear imediatamente anterior à guerra. Decretado a 22 de outubro de 1962, a única vez na história."}, {"k": "Vietcong / FLN", "v": "Frente de Libertação Nacional, fundada em dezembro de 1960 no sul, apoiada por Hanói através do trilho Ho Chi Minh."}, {"k": "Rolling Thunder", "v": "Campanha de bombardeamento sistemático do Vietname do Norte iniciada a 2 de março de 1965."}, {"k": "Ratoeira diplomática", "v": "Expressão do professor para o compromisso americano de Genebra: ser a «bengala» diplomática e militar do Vietname do Sul. A honra internacional ficou em jogo e encurralou três presidentes."}, {"k": "Boat people", "v": "Vietnamitas que fugiram por mar depois de 1975, entre eles os filhos de mulheres «que se deitaram com o inimigo», sem cidadania. Comunidades apátridas."}, {"k": "Vietnamização", "v": "Doutrina de Nixon (1969): os EUA fornecem meios, mas a nação ameaçada assume a responsabilidade principal do combate. Na prática, uma retirada faseada."}], "frases": ["A Guerra Fria é «direta nos conflitos ideológicos e indireta nos meios e nos palcos geográficos». Cuba e o Vietname são o exemplo perfeito.", "Gaddis: nesta fase, «as caudas começaram a abanar os cães» — os pequenos Estados manobravam as superpotências.", "A ligação Cuba-Berlim, na boca de Kennedy: «O nosso problema não é apenas Cuba, é também Berlim.»", "«As guerras de descolonização também foram guerras da Guerra Fria. As do Estado Novo eram de um palco secundário.»", "Genebra como «ratoeira diplomática»: «era a honra internacional que estava em jogo».", "«Os EUA nunca declararam guerra ao Vietname do Norte.»", "«Ao não vencer e não serem vencidos, os EUA já estão a perder politicamente.» Aplica-se hoje à Ucrânia e ao Irão.", "A guerra como «chaga moral»; os protestos acusavam-na de ser «uma guerra de brancos que magoava os pretos e os pobres»."], "fontes": ["<strong>Hobsbawm<\/strong>: a Guerra Fria como «uma Terceira Guerra Mundial, embora uma guerra muito peculiar», e a definição de guerra de Hobbes.", "<strong>Eisenhower<\/strong>, sobre o «princípio do dominó a cair».", "<strong>Ho Chi Minh<\/strong>, a abrir a independência com Jefferson; e «serão vocês a cansar-se».", "<strong>Khrushchev<\/strong>: o «ouriço-cacheiro nas calças do Tio Sam»; a carta do nó, de 26 de outubro.", "<strong>Kennedy<\/strong>: «Como é que pudemos ser tão estúpidos?»; «O nosso problema não é apenas Cuba, é também Berlim»; «Há sempre um filho da mãe que não recebe o recado»; e, a 10 de junho de 1963, «não a paz da sepultura nem a segurança do escravo», «somos todos mortais», «uma estratégia de paz».", "<strong>Gaddis<\/strong>: Moscovo «radiante» com uma revolução que chegou sozinha; a crise como «o vislumbre de um futuro que ninguém desejava»; «o medo dessa guerra revelou-se maior do que todas as diferenças».", "<strong>Castro<\/strong>: «A história absolver-me-á»; a carta de 27 de outubro; «Foi mesmo um acordo vergonhoso».", "<strong>Cronkite<\/strong>, fevereiro de 1968, sobre o otimismo dos líderes americanos.", "<strong>Dobbs<\/strong>, que demonstra que o «olhos nos olhos» de Rusk nunca aconteceu.", "<strong>Westad<\/strong>, sobre o que o ExComm não compreendeu quanto à soberania cubana."], "perguntas": [{"q": "Explique a teoria do dominó e avalie a sua validade.", "guia": "Citar Eisenhower de 1954 e o antecedente de 1952. Explicar a consequência lógica: nenhum ponto do globo é periférico. Avaliar pelos factos posteriores a 1975: o Laos e o Camboja caem, a fila para aí; e sobretudo as guerras entre Estados comunistas de 1978 e 1979, que demonstram que o nacionalismo pesou mais do que a ideologia."}, {"q": "Como se chegou à crise dos mísseis de Cuba?", "guia": "Encadear: revolução de 1959 e ausência inicial de alinhamento; espiral de nacionalizações e embargo; Baía dos Porcos e o seu efeito em Kennedy e em Castro; Operação Mongoose; os Júpiter na Turquia operacionais em abril de 1962; o cálculo de Khrushchev, com a citação do ouriço. Terminar com a frase de Robert Kennedy de abril de 1961, que previu tudo."}, {"q": "Quem ganhou a crise dos mísseis de outubro de 1962?", "guia": "Apresentar as posições. Kennedy ganhou a aparência pública e a retirada dos mísseis. Khrushchev ganhou a garantia de não invasão e, em segredo, os Júpiter da Turquia. Castro perdeu, por não ter sido consultado. Khrushchev perdeu politicamente, caindo dois anos depois. Referir a correção de Dobbs ao mito do «olhos nos olhos» e a consequência perversa: a lição errada aplicada depois no Vietname."}, {"q": "Porque perderam os Estados Unidos a guerra do Vietname?", "guia": "Quatro planos. Político: apoiaram um regime sem legitimidade, tendo começado por impedir as eleições de 1956 que sabiam que perderiam. Militar: poder de fogo esmagador contra uma guerra popular prolongada, com a assimetria de Ho. Interno: o Tet destrói a credibilidade oficial, Cronkite marca a viragem, Johnson desiste. Estratégico: guerra não declarada, sem objetivos explicáveis, a vinte mil quilómetros, contra um adversário para quem era a própria existência nacional."}, {"q": "Porque se diz que a crise dos mísseis abriu caminho à distensão?", "guia": "Partir das duas citações de Gaddis: as armas eram mais perigosas do que os adversários, e o medo foi maior do que as diferenças. Enumerar as heranças práticas, linha direta e tratado de 1963, e a herança retórica, o discurso da Universidade Americana de 10 de junho de 1963, com a oposição entre «estratégia de aniquilação» e «estratégia de paz». Mostrar a mudança de tom entre 22 de outubro de 1962 e 10 de junho de 1963. Concluir que a Guerra Fria continuou, mas nunca mais esteve tão perto de deixar de ser fria."}, {"q": "Em que medida Cuba e o Vietname mostram os limites do controlo das superpotências?", "guia": "Desenvolver a tese de que as peças tinham vontade própria. Cuba: Castro não é consultado nem sobre a instalação nem sobre a retirada, e reage com fúria; pede mesmo um primeiro golpe nuclear. Vietname: Hanói prossegue a sua guerra nacional independentemente das preferências de Moscovo e de Pequim, e acaba a combater a China em 1979. Usar Gaddis sobre as caudas que abanam os cães e Westad sobre a soberania cubana."}], "biblio": ["Antony BEST <em>et al.<\/em>, cap. 11 («From Cold War to Détente»).", "Michael DOBBS, <em>One Minute to Midnight: Kennedy, Khrushchev and Castro<\/em> (a reconstituição hora a hora da crise dos mísseis).", "John Lewis GADDIS, <em>A Guerra Fria<\/em>, cap. 2 («O barco da vida e da morte»).", "Jean HEFFER e Michel LAUNAY, <em>A Era das Superpotências<\/em>, cap. 22 («Os Pontos Quentes»).", "George HERRING, <em>A Guerra do Vietname. O mais longo conflito da América<\/em>.", "Odd Arne WESTAD, <em>A Guerra Fria<\/em>, caps. 11 («As contingências de Kennedy») e 12 («Ao encontro do Vietname»).", "Complementares: John W. YOUNG e John KENT, partes 2 e 3; Robert McMAHON, caps. 4 a 6."], "lecionado": "Lecionado nas aulas de 24 de setembro (Cuba) e 29 de setembro de 2026 (Vietname).", "autores": [{"nome": "Dwight D. Eisenhower", "apelido": "Eisenhower", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Eric Hobsbawm", "apelido": "Hobsbawm", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Ho Chi Minh", "apelido": "Ho Chi Minh", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Fidel Castro", "apelido": "Castro", "tipos": ["ficha", "fonte"], "n": 3}, {"nome": "John Lewis Gaddis", "apelido": "Gaddis", "tipos": ["ficha", "historiador"], "n": 3}, {"nome": "John F. Kennedy", "apelido": "Kennedy", "tipos": ["documento", "ficha", "fonte"], "n": 8}, {"nome": "Dean Rusk", "apelido": "Rusk", "tipos": ["fonte"], "n": 1}, {"nome": "Fidel Castro a Nikita Khrushchev", "apelido": "Khrushchev", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Robert McNamara", "apelido": "McNamara", "tipos": ["fonte"], "n": 1}, {"nome": "Walter Cronkite", "apelido": "Cronkite", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Dobbs", "apelido": "Dobbs", "tipos": ["ficha"], "n": 0}, {"nome": "Westad", "apelido": "Westad", "tipos": ["ficha"], "n": 0}], "anos": ["1945", "1946", "1954", "1955", "1956", "1953", "1959", "1960", "1961", "1962", "1963", "1964", "1965", "1968", "1969", "1970", "1973", "1975", "1979", "1978", "2015", "2018"]}, {"n": 5, "titulo": "O Império do Meio, de vermelho", "subtitulo": "A ascensão da China contemporânea: da revolução comunista de 1949 ao final da era maoísta", "datas": "1949 — 1976", "epigrafe": {"texto": "«O povo chinês pôs-se de pé.»", "autor": "Mao Tsé-Tung, setembro de 1949"}, "seccoes": ["1. Um dia cinzento em Pequim", "2. A peregrinação que correu mal", "3. As cem flores", "4. O Grande Salto", "5. A rutura", "6. A Revolução Cultural", "7. O aperto de mão", "8. 1976", "9. O balanço impossível"], "citacoes": [{"tipo": "historiador", "paras": ["«Quando o Partido Comunista Chinês tomou o poder em 1949, herdou um país devastado por mais de uma década de guerra. Enfrentava, por isso, uma tarefa imensa na sua intenção de transformar a China num Estado socialista moderno, que elevasse o nível de vida do povo e fosse tratado como igual por todos na comunidade internacional. Além disso, tinha de começar a construção do socialismo sabendo que os adversários internos e externos ainda existiam, porque o Guomindang não fora aniquilado, mas retirara para Taiwan, e a principal potência capitalista do mundo, os Estados Unidos, era ruidosamente hostil à ideia de uma China comunista. Nestas condições, o PCC foi naturalmente atraído para um alinhamento com a União Soviética que, enquanto centro incontestado do mundo comunista, podia obviamente ajudar na construção do socialismo e agir como garante da segurança nacional da China.»"], "fonte": "Antony Best <em>et al.<\/em>, <em>International History of the Twentieth Century and Beyond<\/em>", "seccao": "2. A peregrinação que correu mal"}, {"tipo": "fonte", "paras": ["«Esta noite eram só seis. Cansados e feridos, desciam devagar a colina. Cobertos de pó e de sangue, os rostos e os braços negros como carvão. Os uniformes esfarrapados, coçados, rasgados nos cotovelos. Pareciam fantasmas a caminhar no escuro. Os meus tenentes, sargentos e soldados tinham-me seguido desde a China até à Coreia.»"], "fonte": "Testemunho de um oficial chinês, <em>in<\/em> Odd Arne Westad, <em>A Guerra Fria<\/em>", "seccao": "2. A peregrinação que correu mal"}, {"tipo": "fonte", "paras": ["«Deixar primeiro crescer as ervas daninhas venenosas e depois destruí-las uma a uma. Que se tornem adubo.»"], "fonte": "Mao Tsé-Tung, 1957, <em>in<\/em> John Lewis Gaddis, <em>A Guerra Fria<\/em>", "seccao": "3. As cem flores"}, {"tipo": "historiador", "paras": ["«Houve êxitos consideráveis no início da RPC: em termos de esperança de vida, saúde, literacia e ensino, em especial entre as mulheres, mas, durante a primeira década, um aparelho de Estado cada vez mais totalitário tomou medidas numa ampla tentativa de mudar as ideias das pessoas sobre tudo o que tinham conhecido […] À medida que a marcha para uma ditadura totalitária acelerava no final da década de 1950, Mao também se foi tornando cada vez mais manipulador e ditatorial […] A chamada primeira fase do socialismo chegou ao fim com o «Grande Salto em Frente» […] Foi uma catástrofe artificial gigantesca.»"], "fonte": "Michael Wood, <em>A História da China<\/em>", "seccao": "4. O Grande Salto"}, {"tipo": "fonte", "paras": ["«O povo tem de conquistar a natureza.»"], "fonte": "Mao Tsé-Tung, 1958", "seccao": "4. O Grande Salto"}, {"tipo": "fonte", "paras": ["«Os que roubaram comida sobreviveram; os que não roubaram morreram.»"], "fonte": "Sobrevivente da Grande Fome, <em>in<\/em> Frank Dikötter, <em>A China depois de Mao<\/em>", "seccao": "4. O Grande Salto"}, {"tipo": "fonte", "paras": ["«Vocês nunca confiam nos chineses! Só confiam nos russos! Para vocês, os russos são gente de primeira, ao passo que os chineses estão entre os inferiores, que são estúpidos e descuidados. Pois bem, se querem propriedade e exploração conjuntas, então que sejam todas: passemos a propriedade conjunta o nosso exército, a marinha, a força aérea, a indústria, a agricultura, a cultura, a educação. Podemos fazer isto? Ou então fiquem com os mais de dez mil quilómetros de costa da China e deixem-nos apenas uma força de guerrilha. Com umas quantas bombas atómicas, vocês acham que estão em posição de nos controlar.»"], "fonte": "Mao Tsé-Tung ao embaixador soviético Pavel Iudin, 1958", "seccao": "5. A rutura"}, {"tipo": "historiador", "paras": ["«No início dos anos 1960, a imposição do comunismo de estilo russo ao povo chinês falhara claramente […] Contudo, Mao não estava disposto a retirar-se. Com pouco mais de 70 anos em 1964, recuperou o controlo do partido e, dois anos depois, lançou aquilo a que se chamou a “Grande Revolução Cultural”. Mao mobilizou milhões de jovens – os Guardas Vermelhos – para reacender o fervor revolucionário da nação, atacando todos os símbolos da autoridade, tanto o partido, como as universidades, professores e intelectuais em geral […] Centenas de milhares de pessoas morreram brutalizadas em simulacros de julgamentos e execuções pelos Guardas Vermelhos e as multidões que estes incitavam.»"], "fonte": "Michael Wood, <em>A História da China<\/em>", "seccao": "6. A Revolução Cultural"}, {"tipo": "fonte", "paras": ["«Nessa noite a avó entrou. \"Vêm aí os Guardas Vermelhos\", disse. \"Vem já comigo!\" Embrulhámos o quadro com a genealogia da família impressa em blocos de madeira, saímos e enterrámo-lo na horta. No dia seguinte tirámos uns livros e umas caligrafias e queimámo-los à frente dos Guardas Vermelhos, e eles ficaram satisfeitos com isso.»"], "fonte": "Bao Xunsheng, <em>in<\/em> Michael Wood, <em>A História da China<\/em>", "seccao": "6. A Revolução Cultural"}, {"tipo": "documento", "paras": ["«Interrogador: Disparate! Nós não percebemos nada dessas coisas burguesas sobre o que serve para o verão, o inverno ou a primavera. Damos-te dez minutos. Qual é a tua opinião sobre a queda em desgraça de Liu Shaoqi?", "Wang: É uma coisa excelente. Assim impede-se que a China se torne revisionista.", "Guardas Vermelhos, lendo em uníssono: \"Uma revolução não é um jantar de gala, nem escrever um ensaio, nem pintar um quadro, nem fazer bordados…\""], "fonte": "Transcrição de uma sessão de luta, <em>in<\/em> Odd Arne Westad, <em>A Guerra Fria<\/em>", "seccao": "6. A Revolução Cultural"}, {"tipo": "fonte", "paras": ["«A chuva tem de cair, as raparigas têm de casar; estas coisas são imutáveis. Deixa-os ir.»"], "fonte": "Mao Tsé-Tung, setembro de 1971", "seccao": "6. A Revolução Cultural"}, {"tipo": "fonte", "paras": ["«O seu aperto de mão atravessou o maior oceano do mundo: vinte e cinco anos sem comunicação.»"], "fonte": "Zhou Enlai a Richard Nixon, Pequim, fevereiro de 1972", "seccao": "7. O aperto de mão"}], "prof": [{"texto": "«Estaline tem a bomba atómica em 1949 e, no mesmo ano, nasce a China de Mao: a globalização do comunismo.»", "quem": "Ideia desenvolvida na aula de 15 de setembro de 2026", "seccao": "1. Um dia cinzento em Pequim"}], "hoje": [{"rotulo": "De 1945 a ontem à tarde", "texto": "Foi também em Xiaogang, a aldeia de Anhui onde tinham morrido sessenta e sete pessoas em cento e vinte, que em 1978 dezoito camponeses assinaram em segredo, com as impressões digitais, um pacto para dividir a terra da comuna entre as famílias e esconder a produção excedente. Era um crime capital. Deu tão certo que acabou por se tornar política nacional. A descoletivização da agricultura chinesa, que é o primeiro passo da maior saída da pobreza da história, começou num contrato ilegal assinado por camponeses que se lembravam da fome.", "seccao": "4. O Grande Salto"}, {"rotulo": "De 1945 a ontem à tarde", "texto": "O professor não resiste à comparação com ontem à tarde, e vale a pena registá-la porque é uma tese e não uma piada: a China de hoje, diz ele, é um exemplo de <em>soft power<\/em> perante o <em>hard power<\/em> errante de Putin e os Estados Unidos ziguezagueantes de Trump, e Xi Jinping sabe mais de política do que os presidentes russo e americano juntos. Pode discutir-se. O que não se discute é que o país que em 1949 era o objeto sobre o qual as potências praticavam é hoje um dos três sujeitos que decidem. Esse caminho começa no capítulo 15, e começa precisamente com o homem da fotografia acima.", "seccao": "8. 1976"}], "cron": [{"k": "1911", "v": "Queda do Império e proclamação da República. <strong>Sun Yat-sen<\/strong>, o «Pai da Nação»."}, {"k": "1921", "v": "Fundação do Partido Comunista Chinês. Mao entre os fundadores."}, {"k": "1928 - 1949", "v": "<strong>Chiang Kai-shek<\/strong> à frente do Kuomintang e da República nacionalista. Guerra civil larvar; invasão japonesa em 1937."}, {"k": "1934 - 1935", "v": "Longa Marcha. Mao consolida a liderança do Partido Comunista Chinês."}, {"k": "1946 - 1949", "v": "Guerra civil. Chiang Kai-shek retira-se para Taiwan."}, {"k": "1 out 1949", "v": "<strong>Proclamação da República Popular da China<\/strong>, em Tiananmen."}, {"k": "inverno 1949-50", "v": "Mao em Moscovo, dois meses. <strong>Tratado Sino-Soviético de Amizade e Aliança<\/strong>, 14 de fevereiro de 1950."}, {"k": "25 jun 1950", "v": "Início da Guerra da Coreia. Entrada chinesa a 26 de novembro, com 300 mil homens."}, {"k": "1953", "v": "Armistício na Coreia. Cerca de 400 mil mortos chineses, entre eles o filho de Mao."}, {"k": "1956 - 1957", "v": "<strong>Campanha das Cem Flores<\/strong> e subsequente Campanha Antidireitista, dirigida por Deng Xiaoping: um milhão de atingidos."}, {"k": "1958", "v": "Início do <strong>Grande Salto em Frente<\/strong>: comunas populares, fornalhas de quintal, campanha contra os pardais."}, {"k": "verão 1958", "v": "Mao explode contra o embaixador soviético Iudin. Início público da rutura."}, {"k": "mar 1959", "v": "<strong>Revolta de Lhasa.<\/strong> Repressão chinesa e fuga do Dalai Lama para a Índia. «Sinização» do Tibete."}, {"k": "jul 1959", "v": "<strong>Conferência de Lushan.<\/strong> Carta de Peng Dehuai; a sua purga; o Grande Salto é reafirmado."}, {"k": "1958 - 1962", "v": "<strong>A Grande Fome.<\/strong> Estimativas entre vários milhões e 45 milhões de mortos."}, {"k": "1960", "v": "Retirada dos conselheiros soviéticos. Consumação da rutura sino-soviética."}, {"k": "out - nov 1962", "v": "<strong>Guerra sino-indiana<\/strong>, em simultâneo com a crise de Cuba. Moscovo declara-se neutro; Pequim não apoia Khrushchev em Cuba."}, {"k": "1964", "v": "Primeiro ensaio nuclear chinês."}, {"k": "1966", "v": "Início da <strong>Revolução Cultural<\/strong>. Comícios de Tiananmen a partir de 18 de agosto; destruição dos «Quatro Velhos»."}, {"k": "1969", "v": "Confrontos fronteiriços com a URSS no rio Ussuri. Morte de Liu Shaoqi em Kaifeng."}, {"k": "set 1971", "v": "Fuga e morte de <strong>Lin Biao<\/strong>. Colapso da fé popular na Revolução Cultural."}, {"k": "1971", "v": "A República Popular substitui Taiwan nas Nações Unidas."}, {"k": "21 fev 1972", "v": "<strong>Visita de Nixon a Pequim.<\/strong> O aperto de mão a Zhou Enlai."}, {"k": "jan / abr 1976", "v": "Morte de Zhou Enlai e incidente de Qingming em Tiananmen. Novo afastamento de Deng."}, {"k": "9 set 1976", "v": "<strong>Morte de Mao Tsé-Tung.<\/strong> Prisão do Bando dos Quatro em outubro."}, {"k": "1981", "v": "Veredicto oficial do PCC: Mao «setenta por cento certo, trinta por cento errado»."}], "conceitos": [{"k": "Linhagem", "v": "Ideia que Mao explorou genialmente, segundo Best e o professor: apresentar-se nos cartazes em fila com Marx, Engels, Lenine e Estaline, de modo que a contiguidade fizesse de si o herdeiro legítimo do comunismo mundial."}, {"k": "Sinização", "v": "Processo de absorção cultural, demográfica e política do Tibete pela China a partir de 1950 e sobretudo de 1959, com a «região autónoma» a tornar-se cada vez menos autónoma."}, {"k": "«O povo chinês pôs-se de pé»", "v": "Fórmula de Mao em 1949. Exprime menos um programa comunista do que o fim de um século de humilhação nacional, desde as guerras do ópio. Explica o apoio de muitos chineses não marxistas."}, {"k": "Cem Flores", "v": "Convite à crítica lançado em 1956-57 e seguido da repressão dos que a aceitaram. Mao explicou-o como estratagema para «atrair a serpente para fora do buraco»."}, {"k": "Grande Salto em Frente", "v": "Tentativa de industrialização acelerada através da mobilização de massas (1958-62). Comunas populares, fornalhas de quintal, metas irreais. Causou a maior fome da história."}, {"k": "Cinco Ventos", "v": "Expressão camponesa recolhida em Fengyang para descrever o que os destruía: decretos irracionais, exagero e embuste, coação, comando cego das metas e privilégio dos quadros."}, {"k": "Rutura sino-soviética", "v": "Divórcio entre Pequim e Moscovo, consumado em 1960. Três camadas: ideológica (revisionismo), estratégica (igualdade contra tutela) e pessoal (a desconfiança de Estaline, as humilhações de Khrushchev)."}, {"k": "Revolução Cultural", "v": "Campanha lançada por Mao em 1966 contra o aparelho do seu próprio partido, usando a juventude. Destruição dos «Quatro Velhos», sessões de luta, encerramento das escolas."}, {"k": "Guardas Vermelhos", "v": "Organizações estudantis mobilizadas a partir de agosto de 1966. As estimativas do seu número divergem enormemente, entre um e doze milhões."}, {"k": "Triângulo estratégico", "v": "Configuração criada pela aproximação sino-americana de 1972: com três polos, cada um pode jogar com um contra o outro. Fim do sistema estritamente bipolar."}], "frases": ["«A China comunista de hoje é uma herança da China de Mao Tsé-Tung.»", "«O século XIX chinês contrasta com o da Europa: Revolução Industrial <em>versus<\/em> humilhação.»", "«Em menos de cem anos, a China passou de um território feudal e agrário que o Ocidente desejava retalhar a seu belo gosto para uma superpotência.»", "Mao «considerava-se um filho espiritual de Lenine» e «foi genial a explorar a ideia de linhagem».", "«Estaline apostou todas as suas fichas a apoiar o PCC na expectativa de tornar a China um satélite da União Soviética.»", "«Duas taças de arroz por dia: vinte e cinco milhões morreram à fome. Quem comia mais do que isso era preso.» «Um salto demasiado grande.»", "«Não houve anulamento, mas houve um distanciamento» (rutura sino-soviética).", "«A China não existe sem um líder forte. Os partidos são apenas meios burocráticos de ter um líder.»"], "fontes": ["<strong>Best<\/strong>: o PCC «naturalmente atraído para um alinhamento com a União Soviética», único «garante da segurança nacional da China».", "<strong>Wood<\/strong>: «êxitos consideráveis no início da RPC», mas o Grande Salto como «uma catástrofe artificial gigantesca»; os Guardas Vermelhos a atacar «todos os símbolos da autoridade».", "<strong>Mao<\/strong>: «O povo chinês pôs-se de pé»; «deixar crescer as ervas daninhas venenosas e depois destruí-las»; a explosão contra o embaixador Iudin; «a chuva tem de cair, as raparigas têm de casar».", "<strong>Peng Dehuai<\/strong>: «pôr a política no comando não substitui os princípios económicos».", "<strong>Wood<\/strong>: os «Cinco Ventos»; os «Quatro Nãos»; «só os teus dentes é que são teus»; os números de Fengyang e de Xiaogang.", "<strong>Reynolds<\/strong>: a descrição clínica da fome; «o Grande Salto foi reafirmado, não travado».", "<strong>Westad<\/strong>: Estaline e a «base de classe» camponesa; «a visão de Mao de um novo homem chinês hercúleo tinha-se revelado um monstro».", "<strong>Jaivin<\/strong>: as fornalhas e os pardais; a Campanha Antidireitista; Song Binbin e a mudança de nome.", "<strong>Dikötter<\/strong>: «os que roubaram comida sobreviveram; os que não roubaram morreram».", "<strong>Zhou Enlai<\/strong> a Nixon: «o seu aperto de mão atravessou o maior oceano do mundo»."], "perguntas": [{"q": "Explique as causas e as consequências do Grande Salto em Frente.", "guia": "Causas: vontade de ultrapassar o modelo soviético, substituir capital por mobilização de massas e afirmar a China como centro do comunismo mundial. Mecanismo: comunas, fornalhas, metas irreais, destruição de alfaias, campanha dos pardais. Ponto decisivo: Lushan, em julho de 1959, com a purga de Peng Dehuai e a reafirmação da política. Consequências: fome com estimativas entre vários milhões e 45 milhões, o afastamento temporário de Mao e a ascensão de Liu Shaoqi e Deng Xiaoping, que estão na origem da Revolução Cultural."}, {"q": "Porque se deu a rutura sino-soviética?", "guia": "Organizar em três camadas. Ideológica: a denúncia de Estaline e a coexistência pacífica lidas por Mao como revisionismo. Estratégica: Moscovo queria um satélite, Pequim queria igualdade e liderança do mundo revolucionário. Pessoal e histórica: a desconfiança de Estaline quanto à base camponesa, o episódio Iudin de 1958 e as humilhações de Khrushchev. Marcos: 1960, retirada dos conselheiros; 1964, bomba chinesa; 1969, confrontos no Ussuri. Consequência: possibilidade da aproximação americana de 1972."}, {"q": "O que foi a Revolução Cultural e qual foi o seu objetivo real?", "guia": "Distinguir o objetivo declarado, que era impedir a restauração capitalista, do objetivo efetivo, que era Mao destruir o aparelho do próprio partido que o marginalizara depois da fome. Desenvolver os instrumentos: Guardas Vermelhos, culto da personalidade, sessões de luta, destruição dos Quatro Velhos. Casos exemplares: Liu Shaoqi, Wang Guangmei, Deng Xiaoping. Terminar com o episódio de Lin Biao em 1971 como fim da adesão popular."}, {"q": "Que significado teve a visita de Nixon à China em 1972?", "guia": "Explicar a lógica dos três lados: Pequim procura contrapeso ao milhão de soldados soviéticos na fronteira; Washington procura pressão sobre Moscovo e saída do Vietname. Referir a preparação secreta por Kissinger e a admissão na ONU em 1971. Usar o gesto do aperto de mão como reparação simbólica do desaire de Genebra de 1954, com a frase de Zhou. Concluir com o fim do sistema bipolar e o nascimento do triângulo estratégico."}, {"q": "Como avaliar a era maoísta?", "guia": "Apresentar as duas colunas com honestidade. Custos: fome, Revolução Cultural, geração sem escola, destruição patrimonial, arbitrariedade total do poder. Ganhos: unificação, fim das concessões estrangeiras, duplicação da esperança de vida, alfabetização, base industrial e estatal. Referir as estimativas em disputa sobre os mortos e o veredicto oficial de 1981 dos setenta por cento. Evitar tanto a hagiografia como a redução a um catálogo de crimes."}], "biblio": ["Antony BEST <em>et al.<\/em>, cap. 15 («The People’s Republic of China and North Korea»).", "Jean HEFFER e Michel LAUNAY, <em>A Era das Superpotências<\/em>, cap. 12 («A China de Mao Tsé-Tung»).", "Linda JAIVIN, <em>A Mais Breve História da China<\/em>, cap. 13 («Os Anos de Mao: Revolução Contínua»).", "Michael WOOD, <em>A História da China<\/em>, cap. 18 («A idade das reformas: da República a Mao»).", "Complementares: Frank DIKÖTTER, <em>A China depois de Mao<\/em>, cap. 1; Odd Arne WESTAD, <em>A Guerra Fria<\/em>, caps. 5, 6 e 9; David REYNOLDS, <em>One World Divisible<\/em>, cap. 8."], "lecionado": "Lecionado a partir da aula de 1 de outubro de 2026.", "autores": [{"nome": "Antony Best", "apelido": "Best", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Mao Tsé-Tung", "apelido": "Tsé-Tung", "tipos": ["fonte"], "n": 3}, {"nome": "Michael Wood", "apelido": "Wood", "tipos": ["ficha", "historiador"], "n": 2}, {"nome": "Zhou Enlai a Richard Nixon", "apelido": "Nixon", "tipos": ["fonte"], "n": 1}, {"nome": "Mao", "apelido": "Mao", "tipos": ["ficha"], "n": 0}, {"nome": "Peng Dehuai", "apelido": "Dehuai", "tipos": ["ficha"], "n": 0}, {"nome": "Reynolds", "apelido": "Reynolds", "tipos": ["ficha"], "n": 0}, {"nome": "Westad", "apelido": "Westad", "tipos": ["ficha"], "n": 0}, {"nome": "Jaivin", "apelido": "Jaivin", "tipos": ["ficha"], "n": 0}, {"nome": "Dikötter", "apelido": "Dikötter", "tipos": ["ficha"], "n": 0}, {"nome": "Zhou Enlai", "apelido": "Enlai", "tipos": ["ficha"], "n": 0}], "anos": ["1911", "1921", "1928", "1949", "1934", "1935", "1946", "1950", "1953", "1956", "1957", "1958", "1959", "1962", "1960", "1964", "1966", "1969", "1971", "1972", "1976", "1981"]}, {"n": 6, "titulo": "O fim dos impérios", "subtitulo": "A descolonização, o fim dos impérios europeus e a emergência do Terceiro Mundo", "datas": "1947 — 1975", "epigrafe": {"texto": "«O vento da mudança sopra sobre este continente e, quer gostemos ou não, este crescimento da consciência nacional é um facto político.»", "autor": "Harold Macmillan, Cidade do Cabo, fevereiro de 1960"}, "seccoes": ["1. A meia-noite", "2. A linha de Radcliffe", "3. Bandung", "4. Suez, ou a semana em que a Europa descobriu", "5. O vento", "6. Argel", "7. Leopoldville", "8. O último império", "9. Quem fez a descolonização?"], "citacoes": [{"tipo": "documento", "paras": ["«Há muitos anos marcámos um encontro com o destino, e chegou agora o momento de cumprirmos a nossa promessa, não inteiramente nem por completo, mas em grande medida.", "Ao bater da meia-noite, quando o mundo dorme, a Índia despertará para a vida e para a liberdade.»"], "fonte": "Jawaharlal Nehru, Assembleia Constituinte, Nova Deli, 14 de agosto de 1947", "seccao": "1. A meia-noite"}, {"tipo": "documento", "paras": ["«Os membros das Nações Unidas que assumam ou tenham assumido responsabilidades pela administração de territórios cujos povos ainda não tenham atingido a plena capacidade de se governarem a si mesmos reconhecem o princípio de que os interesses dos habitantes desses territórios são da mais alta importância, e aceitam, como missão sagrada, a obrigação de promover no mais alto grau, dentro do sistema de paz e segurança internacionais estabelecido na presente Carta, o bem-estar dos habitantes desses territórios e, para tal fim: assegurar, com o devido respeito pela cultura dos povos interessados, o seu progresso político, económico, social e educacional, o seu tratamento equitativo e a sua proteção contra abusos; e desenvolver a sua capacidade de governo próprio, tomar devida nota das aspirações políticas dos povos e auxiliá-los no desenvolvimento progressivo das suas instituições políticas livres, de acordo com as circunstâncias particulares de cada território e dos seus habitantes.»"], "fonte": "Carta das Nações Unidas, São Francisco, 1945, capítulo XI, artigo 73.º", "seccao": "1. A meia-noite"}, {"tipo": "documento", "paras": ["«Dizem-nos muitas vezes: \"O colonialismo está morto.\" Não nos deixemos enganar, nem sequer embalar, por isso.»"], "fonte": "Sukarno, discurso de abertura da Conferência de Bandung, abril de 1955", "seccao": "3. Bandung"}, {"tipo": "historiador", "paras": ["«Enquanto a Guerra Fria decorria, era comum as pessoas assumirem que ela era o paradigma dominante que moldava o sistema internacional, e que nenhum Estado, grande ou pequeno, podia deixar de ser arrastado para a competição bipolar entre os Estados Unidos e a União Soviética. Contudo, durante os anos deste conflito monumental, alguns Estados tentaram distanciar-se dos seus efeitos, declarando a sua neutralidade e mantendo-se à margem de ambos os sistemas de alianças da Guerra Fria […] Para as nações recém-independentes da Ásia e de África, a rejeição da Guerra Fria global assentava não só na convicção de que o envolvimento nesse conflito representava uma ameaça desnecessária à sua segurança nacional, mas também na crença de que ele desviava a atenção das questões que consideravam mais importantes. Refletindo as suas próprias experiências, as suas prioridades eram apressar a descolonização ocidental e atacar as causas do subdesenvolvimento económico.»"], "fonte": "Antony Best <em>et al.<\/em>, <em>International History of the Twentieth Century and Beyond<\/em>", "seccao": "3. Bandung"}, {"tipo": "documento", "paras": ["«Falamos abundantemente sobre os dois mundos em presença, da sua possível guerra, da sua coexistência, etc., muitas vezes esquecendo que existe um terceiro, o mais importante e, em suma, o primeiro na antiguidade. É o conjunto de todos aqueles que chamamos, segundo as Nações Unidas, países subdesenvolvidos. […] O que importa para cada um dos dois mundos é conquistar o terceiro ou pelo menos tê-lo a seu lado. E daí vêm todos os problemas da coexistência […] Este Terceiro Mundo, ignorado, explorado, e desprezado, como o Terceiro Estado, quer também ser algo.»"], "fonte": "Alfred Sauvy, «Trois Mondes, Une Planète», <em>L'Observateur<\/em>, 14 de agosto de 1952", "seccao": "3. Bandung"}, {"tipo": "fonte", "paras": ["«Desde que o Egito declarou a sua política livre e independente, o mundo inteiro tem os olhos postos no Egito. No passado perdíamos o nosso tempo nos gabinetes dos embaixadores estrangeiros, mas hoje, depois de nos unirmos numa única frente nacional contra o imperialismo e a intervenção estrangeira, aqueles que nos desdenhavam começaram a temer-nos.»"], "fonte": "Gamal Abdel Nasser, Alexandria, 26 de julho de 1956", "seccao": "4. Suez, ou a semana em que a Europa descobriu"}, {"tipo": "fonte", "paras": ["«Claro que não há ninguém com quem preferisse lutar ao meu lado numa guerra do que os britânicos. Mas esta coisa! Meu Deus!»"], "fonte": "Dwight D. Eisenhower, novembro de 1956", "seccao": "4. Suez, ou a semana em que a Europa descobriu"}, {"tipo": "historiador", "paras": ["«Este foi um daqueles raros episódios em que a estrutura do poder no mundo ficou claramente revelada: a hostilidade de forças locais atraiu potências mundiais de segunda categoria, que perseguiam interesses próprios, apenas para esbarrarem bruscamente nos limites da sua força quando desafiaram os interesses das superpotências.»"], "fonte": "Albert Hourani, <em>História dos Povos Árabes<\/em>", "seccao": "4. Suez, ou a semana em que a Europa descobriu"}, {"tipo": "documento", "paras": ["«O vento da mudança sopra sobre este continente e, quer gostemos ou não, este crescimento da consciência nacional é um facto político. As nossas políticas nacionais têm de ter isso em conta.»"], "fonte": "Harold Macmillan, Parlamento da África do Sul, Cidade do Cabo, fevereiro de 1960", "seccao": "5. O vento"}, {"tipo": "fonte", "paras": ["«Era raro que prisioneiros interrogados à noite ainda estivessem vivos de manhã cedo. Tivessem falado ou não, eram geralmente neutralizados.»"], "fonte": "General Paul Aussaresses, <em>Services spéciaux: Algérie, 1955-1957<\/em>, <em>in<\/em> Bernard Wasserstein", "seccao": "6. Argel"}, {"tipo": "fonte", "paras": ["«Je vous ai compris.» Compreendi-vos."], "fonte": "Charles de Gaulle, Argel, 4 de junho de 1958", "seccao": "6. Argel"}, {"tipo": "fonte", "paras": ["«Conhecemos os objetivos do Ocidente. Ontem dividiam-nos ao nível da tribo, do clã e da aldeia. Hoje, com a África a libertar-se, procuram dividir-nos ao nível dos Estados. Querem criar blocos antagónicos, satélites, e, tendo começado nessa fase da guerra fria, aprofundar a divisão para perpetuar o seu domínio.»"], "fonte": "Patrice Lumumba, Conferência Pan-Africana, Leopoldville, agosto de 1960", "seccao": "7. Leopoldville"}, {"tipo": "historiador", "paras": ["«Sul Global é usado como um termo de capacitação, no sentido de um reconhecimento mútuo entre os subordinados do mundo e da sua posição partilhada nas ‘margens do mundo neoliberal da globalização’. O Sul não se limita ao hemisfério sul, mas inclui o ‘Sul no Norte’. Isto refere-se a lugares e partes da sociedade marginalizados pela exploração, pela opressão e pela pobreza. É, assim, um contramovimento transnacional de resistência a uma globalização capitalista. O conceito é entendido como um processo através do qual as formas existentes de reprodução das desigualdades e do racismo epistémico são desfeitas.»"], "fonte": "Miriam Prys-Hansen, «The Global South: A Problematic Term»", "seccao": "9. Quem fez a descolonização?"}, {"tipo": "historiador", "paras": ["«Grande parte da discussão contemporânea [sobre África] está impregnada de uma espécie de correção política que tem tido efeitos muito nocivos. Do lado africano, há uma cultura generalizada de culpa e de dependência. Todos os problemas e dificuldades são culpa do Ocidente e tudo se há de corrigir exigindo vastas reparações pelos crimes do passado. Os absurdos disto deviam ser evidentes. Terão os descendentes dos escravos africanos direito a reparações contra os seus históricos donos africanos? […] [Há] uma combinação igualmente doentia do lado do Ocidente, desta vez de culpa e de arrogância. A moda atual de pedir desculpa por acontecimentos políticos do passado não impedirá uma única criança africana de morrer de malária […] A arrogância cultural repulsiva pouco faz para disfarçar a presunção de que os nossos padrões são melhores do que os de qualquer outro e de que temos o direito de os impor aos outros.»"], "fonte": "Tom Young, <em>Africa: a Guide<\/em>", "seccao": "9. Quem fez a descolonização?"}], "prof": [{"texto": "«Demasiados portugueses para África e demasiados africanos para Portugal.»", "quem": "J. M. Sardica, aula de 6 de outubro de 2026", "seccao": "8. O último império"}], "hoje": [{"rotulo": "De 1945 a ontem à tarde", "texto": "É a mesma base dos Açores que já tinha feito de Portugal membro fundador da NATO em 1949, apesar de ser uma ditadura, como se viu no capítulo 2. Durante trinta anos, uma pista de aterragem no meio do Atlântico comprou a um regime autoritário português a tolerância da maior democracia do mundo. É um bom exemplo daquilo a que em relações internacionais se chama valor estratégico, e do preço moral que ele costuma ter.", "seccao": "8. O último império"}], "cron": [{"k": "1941", "v": "Carta do Atlântico: princípio da autodeterminação dos povos."}, {"k": "jun 1945", "v": "<strong>Carta das Nações Unidas<\/strong>, capítulo XI, artigo 73.º: a administração de territórios não autónomos como «missão sagrada» com fim previsto."}, {"k": "15 ago 1947", "v": "<strong>Independência da Índia e do Paquistão.<\/strong> Partição: até 1,5 milhões de mortos e 17 milhões de deslocados."}, {"k": "1949", "v": "Independência da Indonésia."}, {"k": "14 ago 1952", "v": "Alfred Sauvy cunha a expressão <strong>«Terceiro Mundo»<\/strong> em <em>L'Observateur<\/em>."}, {"k": "1 nov 1954", "v": "Início da <strong>guerra da Argélia<\/strong>, catorze semanas depois dos acordos de Genebra."}, {"k": "7 mai 1954", "v": "Dien Bien Phu. Fim do império francês na Ásia."}, {"k": "abr 1955", "v": "<strong>Conferência de Bandung:<\/strong> 29 Estados afro-asiáticos. Nascimento do Terceiro Mundo como conceito político."}, {"k": "26 jul 1956", "v": "Nasser nacionaliza o canal do Suez."}, {"k": "21-24 out 1956", "v": "Conluio de Sèvres entre a Grã-Bretanha, a França e Israel."}, {"k": "5-7 nov 1956", "v": "<strong>Crise do Suez:<\/strong> desembarque, pressão americana sobre a libra, cessar-fogo. Simultânea com a invasão soviética da Hungria."}, {"k": "1957", "v": "Independência do Gana, primeira colónia da África negra britânica."}, {"k": "1957", "v": "Batalha de Argel: vitória militar francesa à custa da tortura sistemática."}, {"k": "13 mai / 4 jun 1958", "v": "Golpe de Argel e queda da Quarta República. De Gaulle: «Je vous ai compris.»"}, {"k": "fev 1960", "v": "Discurso do «vento da mudança» de Macmillan na Cidade do Cabo."}, {"k": "1960", "v": "<strong>Ano de África:<\/strong> dezassete independências. Independência do Congo a 30 de junho."}, {"k": "jan 1961", "v": "Assassínio de Patrice Lumumba."}, {"k": "1961", "v": "Início da guerra colonial portuguesa em Angola. Conferência dos Não-Alinhados em Belgrado."}, {"k": "abr 1961", "v": "Putsch dos generais em Argel, derrotado pelo apelo de de Gaulle pela rádio."}, {"k": "mar / jul 1962", "v": "Acordos de Évian e independência da Argélia."}, {"k": "1963", "v": "Fundação da Organização de Unidade Africana."}, {"k": "jun 1964", "v": "Fundação do <strong>Grupo dos 77<\/strong> na primeira UNCTAD."}, {"k": "25 abr 1974", "v": "Revolução em Portugal. Independências africanas negociadas em 1974-75."}, {"k": "1975", "v": "Independência de Angola e Moçambique. Regresso de 600 a 800 mil retornados."}, {"k": "1980", "v": "Relatório da Comissão Brandt: a <strong>Linha Brandt<\/strong> entre Norte e Sul Global."}, {"k": "1994", "v": "Fim do governo da minoria branca na África do Sul. Mandela presidente."}], "conceitos": [{"k": "Terceiro Mundo", "v": "Expressão criada por Alfred Sauvy em agosto de 1952, por analogia com o terceiro estado francês: «ignorado, explorado, e desprezado», «quer também ser algo». Designa, na origem, os países que não pertencem nem ao bloco capitalista nem ao comunista, e era, nas palavras do professor, um elogio. Bandung foi o seu «parto oficial»."}, {"k": "Três vagas", "v": "Periodização da descolonização usada na aula: 1945-1956 (Ásia e Médio Oriente), 1957-1970 (África) e depois de 1970 (império português, África Austral)."}, {"k": "Grupo dos 77", "v": "Coligação de países em desenvolvimento fundada em junho de 1964 na UNCTAD. Hoje com mais de 130 membros, mantém o nome e é o maior bloco de voto das Nações Unidas."}, {"k": "Linha Brandt / Sul Global", "v": "Linha traçada no relatório da Comissão Brandt (1980) a separar o mundo desenvolvido do subdesenvolvido. Não é geográfica mas civilizacional: inclui a Austrália no Norte. «Sul Global» substituiu «Terceiro Mundo» e é, segundo Prys-Hansen, «um termo problemático», uma reivindicação mais do que uma descrição."}, {"k": "Não-alinhamento", "v": "Doutrina afirmada em Bandung (1955) e formalizada em Belgrado (1961): recusa de aderir a qualquer dos blocos. Nehru chamava à adesão ocidental «uma humilhação intolerável para um país afro-asiático»."}, {"k": "Linha de Radcliffe", "v": "Fronteira entre a Índia e o Paquistão, traçada em cinco semanas por um advogado britânico que nunca estivera na Índia."}, {"k": "Conluio de Sèvres", "v": "Acordo secreto de outubro de 1956 entre britânicos, franceses e israelitas, pelo qual um ataque israelita serviria de pretexto para a intervenção europeia. Eden tentou destruir todas as cópias."}, {"k": "Pieds-noirs", "v": "Colonos europeus da Argélia, cerca de um milhão. A Argélia era juridicamente parte de França, dividida em departamentos, o que explica a resistência à independência."}, {"k": "Províncias ultramarinas", "v": "Designação adotada por Portugal em 1951 para as colónias, de modo a sustentar a tese de que não havia império mas sim um Estado uno e pluricontinental."}, {"k": "Obesidade imperial", "v": "Conceito de John Darwin: a fase em que o custo de manter um império excede a capacidade de o sustentar."}], "frases": ["O império como «<em>white man's burden<\/em>, porque era uma obra de civilização», desmontado «num espaço de uma geração».", "«A partir de 1945 a maré mental mudou. A ONU é a favor da descolonização porque os próprios EUA são fruto de descolonização.»", "As quatro causas: enfraquecimento das metrópoles; posição moral fragilizada; desenvolvimento identitário das colónias; desenvolvimento económico e elites locais.", "«Terceiro Mundo era um elogio na sua génese.» «O Terceiro Mundo tem um parto oficial: a Conferência de Bandung.»", "«55% da população mundial tinha 8% da riqueza mundial.»", "«Gandhi não tem ninguém que se iguale a não ser Mandela.»", "Sobre África: «é a mais sangrenta; é o berço da humanidade».", "«Demasiados portugueses para África e demasiados africanos para Portugal.»", "«Nenhuma colónia é perfeita, nem a britânica.» «Hoje em dia não há Terceiro Mundo: há o Norte Global e o Sul Global. Não é uma linha geográfica, mas sim civilizacional.»"], "fontes": ["<strong>Carta das Nações Unidas<\/strong>, art. 73.º: «missão sagrada», «desenvolver a sua capacidade de governo próprio».", "<strong>Sauvy<\/strong>: «Este Terceiro Mundo, ignorado, explorado, e desprezado, como o Terceiro Estado, quer também ser algo.»", "<strong>Best<\/strong>: as prioridades dos novos Estados eram «apressar a descolonização ocidental e atacar as causas do subdesenvolvimento económico».", "<strong>Tom Young<\/strong>: «uma cultura generalizada de culpa e de dependência» de um lado, «culpa e arrogância» do outro; pedir desculpa «não impedirá uma única criança africana de morrer de malária».", "<strong>Prys-Hansen<\/strong>: o Sul Global como «termo de capacitação» e «contramovimento transnacional».", "<strong>Nehru<\/strong>: «Há muitos anos marcámos um encontro com o destino»; «Ao bater da meia-noite, quando o mundo dorme, a Índia despertará para a vida e para a liberdade».", "<strong>Sukarno<\/strong>, em Bandung: «Dizem-nos muitas vezes: \"O colonialismo está morto.\" Não nos deixemos enganar.»", "<strong>Nehru<\/strong>, em Bandung, sobre a NATO como «um dos mais poderosos protetores do colonialismo».", "<strong>Macmillan<\/strong>: «O vento da mudança sopra sobre este continente»; e, em privado, «temos as nossas Argélias a caminho».", "<strong>Eisenhower<\/strong>, sobre Suez: «Mas esta coisa! Meu Deus!»", "<strong>Hourani<\/strong>: Suez como o raro episódio em que «a estrutura do poder no mundo ficou claramente revelada».", "<strong>De Gaulle<\/strong>: «Je vous ai compris»; e a Massu, «vocês não são o Exército por si mesmo; são o Exército de França».", "<strong>Lumumba<\/strong>: «Ontem dividiam-nos ao nível da tribo; hoje procuram dividir-nos ao nível dos Estados.»", "<strong>Judt<\/strong>: a potência colonial retirou-se «relativamente incólume».", "<strong>Westad<\/strong>: o apoio americano prolongou os impérios em duas décadas, e três no caso português."], "perguntas": [{"q": "Quais foram as causas da descolonização?", "guia": "Organizar em três blocos e confrontá-los. Movimentos nacionalistas, com Dien Bien Phu e Argel como provas. Exaustão europeia, com Suez como prova exemplar, porque ali a derrota foi financeira e não militar. Guerra Fria, discutindo as duas leituras: a que a vê como aceleradora e a de Westad, que defende que o apoio americano aos aliados europeus prolongou os impérios. Fechar com Darwin sobre os ciclos imperiais."}, {"q": "Explique o significado histórico da crise do Suez.", "guia": "Narrar em três tempos: nacionalização em julho, conluio de Sèvres em outubro, colapso em novembro por pressão financeira americana. Sublinhar a simultaneidade com Budapeste e o que ela revela sobre as regras não escritas das esferas de influência. Concluir com Hourani sobre a estrutura do poder revelada, com Rémond sobre a impotência europeia e com a frase de Adenauer, «a Europa será a vossa vingança», que liga ao Ponto 9."}, {"q": "Compare a descolonização britânica na Índia com a belga no Congo.", "guia": "Índia: saída negociada e rápida, mas com uma partilha improvisada que custou centenas de milhares de vidas; a potência colonial saiu incólume, como nota Judt. Congo: nenhuma preparação, dezasseis licenciados e nenhum médico à data da independência, colapso em semanas, secessão do Catanga e assassínio de Lumumba. Usar os juízos de Darwin, Wasserstein e Rémond. Concluir que em ambos os casos o custo foi pago pelos colonizados, embora por razões opostas: pressa negociada num caso, ausência total de preparação no outro."}, {"q": "Porque foi a guerra da Argélia tão traumática para a França?", "guia": "Explicar o estatuto jurídico da Argélia como parte de França e a presença de um milhão de colonos. Descrever a batalha de Argel e a institucionalização da tortura, com o testemunho de Aussaresses e a análise clínica de Fanon. Mostrar o efeito interno: censura, prisão de jornalistas, comparação com Dreyfus e Vichy, a repressão de outubro de 1961 em Paris. Terminar com a queda da Quarta República, a ambiguidade de «Je vous ai compris» e o putsch de 1961."}, {"q": "De «Terceiro Mundo» a «Sul Global»: o que mudou e o que ficou?", "guia": "Partir de Sauvy em 1952 e da analogia com o terceiro estado, sublinhando que a expressão era um elogio. Passar por Bandung como «parto oficial», pelo Grupo dos 77 em 1964 e pelo mapa dos três mundos. Explicar a Linha Brandt de 1980 e por que razão não é geográfica. Usar Prys-Hansen para mostrar que «Sul Global» é uma reivindicação, e Tom Young para mostrar a crítica às duas más consciências. Concluir que a palavra mudou três vezes e a desigualdade que designa, não."}, {"q": "Porque foi Portugal o último império a desfazer-se?", "guia": "Três razões. Doutrinária: a ficção das províncias ultramarinas e a natureza do regime, que não tinha eleições nem opinião pública livre para lhe travar a guerra. Estratégica: o valor dos Açores para os Estados Unidos, que segundo Best permitia a Salazar amortecer as críticas americanas. Estrutural: a tese de Westad de que o apoio ocidental prolongou o império português em três décadas. Concluir que a descolonização portuguesa foi decidida em Lisboa a 25 de abril de 1974 e que gerou o regresso de 600 a 800 mil pessoas e guerras civis prolongadas em Angola e Moçambique."}], "biblio": ["Antony BEST <em>et al.<\/em>, cap. 13 («Neutralism, development and the rise of the Third World»), que o professor chama «o esqueleto da aula».", "Jean HEFFER e Michel LAUNAY, <em>A Era das Superpotências<\/em>, caps. 14 («A Descolonização») e 17 («A vida política no Terceiro Mundo»).", "Gordon KERR, <em>A Short History of Africa<\/em>, «uma boa referência para quem quiser conhecer hoje África».", "René RÉMOND, <em>Introdução à História do Nosso Tempo<\/em>, IV parte, cap. 12 («A Descolonização»).", "Tom YOUNG, <em>Africa: a Guide<\/em>.", "Complementares: John DARWIN, <em>Ascensão e Queda dos Impérios Globais<\/em>, caps. 8 e 9; Tony JUDT, <em>Pós-Guerra<\/em>, cap. 9; Bernard WASSERSTEIN, <em>Barbarism and Civilization<\/em>.", "Odd Arne WESTAD, <em>A Guerra Fria<\/em>, cap. 10.", "Gordon KERR, <em>A Short History of Africa<\/em>.", "René RÉMOND, <em>Introdução à História do Nosso Tempo<\/em>, 4.ª parte."], "lecionado": "Lecionado na aula de 6 de outubro de 2026.", "autores": [{"nome": "Jawaharlal Nehru", "apelido": "Nehru", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Sukarno", "apelido": "Sukarno", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Antony Best", "apelido": "Best", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Alfred Sauvy", "apelido": "Sauvy", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Gamal Abdel Nasser", "apelido": "Nasser", "tipos": ["fonte"], "n": 1}, {"nome": "Dwight D. Eisenhower", "apelido": "Eisenhower", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Albert Hourani", "apelido": "Hourani", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Harold Macmillan", "apelido": "Macmillan", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Charles de Gaulle", "apelido": "de Gaulle", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Patrice Lumumba", "apelido": "Lumumba", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Miriam Prys-Hansen", "apelido": "Prys-Hansen", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Tom Young", "apelido": "Young", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Judt", "apelido": "Judt", "tipos": ["ficha"], "n": 0}, {"nome": "Westad", "apelido": "Westad", "tipos": ["ficha"], "n": 0}], "anos": ["1941", "1945", "1947", "1949", "1952", "1954", "1955", "1956", "1957", "1958", "1960", "1961", "1962", "1963", "1964", "1974", "1975", "1980", "1994"]}, {"n": 7, "titulo": "A meia-lua e o petróleo", "subtitulo": "A multipolarização mundial: o Islão e a geopolítica do Médio Oriente", "datas": "632 — 1989", "epigrafe": {"texto": "«Este foi um daqueles raros episódios em que a estrutura do poder no mundo ficou claramente revelada.»", "autor": "Albert Hourani, sobre a crise do Suez"}, "seccoes": ["1. O grande outro", "2. O decreto que fechou treze séculos", "3. O petróleo", "4. Abadan", "5. O Napoleão árabe", "6. A arma que ninguém esperava", "7. 1979", "8. Oito anos, nenhuma fronteira", "9. O regresso da religião à política"], "citacoes": [{"tipo": "historiador", "paras": ["«Os muçulmanos desenvolveram os seus rituais, misticismo, filosofia, doutrinas, textos sagrados, leis e santuários como todos os outros ideais religiosos. Porém, essa busca religiosa resultou diretamente da sua contemplação dos assuntos políticos correntes da sociedade islâmica [...] Portanto, a política constitui um sacramento: é o terreno em que os muçulmanos fazem a experiência de Deus, e que não está, por isso, divorciada da busca religiosa interior.»"], "fonte": "Karen Armstrong, <em>O Islamismo<\/em>", "seccao": "1. O grande outro"}, {"tipo": "historiador", "paras": ["«O mundo islâmico foi convulsionado pelo processo da modernização. Em vez de ser um dos líderes da civilização mundial, o islão foi reduzido pelas potências europeias, rápida e permanentemente, a um bloco dependente [...] Os ocidentais costumam admirar-se com a raiva e a hostilidade dos muçulmanos em relação à sua cultura, que, por terem tido uma experiência muito diferente, consideraram libertadora e revigorante. Mas a reação muçulmana não é estranha nem excêntrica: devido a estar o mundo islâmico tão disseminado e estrategicamente colocado, foi o primeiro a ser sujeito ao processo de colonização no Médio Oriente, Índia, Arábia, Malásia e parte significativa de África.»"], "fonte": "Karen Armstrong, <em>O Islamismo<\/em>", "seccao": "1. O grande outro"}, {"tipo": "documento", "paras": ["«Devo dizer-vos que Mohammad Reza Pahlavi, esse traidor perverso, partiu. Fugiu e saqueou tudo. Destruiu o nosso país e encheu os nossos cemitérios. Arruinou a economia do nosso país. Mesmo os projetos que executou em nome do progresso empurraram o país para a decadência. Suprimiu a nossa cultura, aniquilou pessoas e destruiu todos os nossos recursos humanos.", "Dizemos que este homem, o seu governo e o seu parlamento são todos ilegais. Se continuassem no poder, tratá-los-íamos como criminosos e julgá-los-íamos como criminosos. Nomearei o meu próprio governo. Esmagarei os dentes deste governo. Determinarei o governo com o apoio desta nação, porque esta nação aceita-me.»"], "fonte": "Ruhollah Khomeini, discurso de chegada a Teerão, fevereiro de 1979", "seccao": "7. 1979"}, {"tipo": "documento", "paras": ["«Há uma questão: a causa de quem estaremos a apoiar se destacarmos forças para o Afeganistão? É completamente claro que o Afeganistão não está preparado, neste momento, para resolver os problemas que enfrenta através do socialismo. A economia é atrasada, a religião islâmica predomina e quase toda a população rural é analfabeta. Isto não é uma situação revolucionária. Só podemos sustentar aquele regime com baionetas soviéticas, e isso é absolutamente inadmissível para nós. Não podemos correr semelhante risco.»"], "fonte": "Iuri Andropov, reunião do Politburo, março de 1979", "seccao": "7. 1979"}, {"tipo": "fonte", "paras": ["«Cerca de noventa e nove por cento das batalhas que travámos no Afeganistão foram ganhas pelo lado soviético. Mas o problema é que na manhã seguinte tínhamos a mesma situação como se não tivesse havido batalha nenhuma. Os mujahidin estavam outra vez na aldeia onde tinham sido, ou onde nós julgávamos que tinham sido, destruídos um dia antes. Era inútil.»"], "fonte": "Testemunho citado por Victor Sebestyen, <em>Revolução 1989<\/em>", "seccao": "7. 1979"}, {"tipo": "fonte", "paras": ["«Vi uma nuvem de cor amarelada escura espalhar-se pela aldeia. Via de longe que os animais estavam a morrer, mas não conseguia ver ninguém de pé ou a andar. Sentia um cheiro parecido com alho e a boca ficou-me amarga, e tornou-se difícil respirar. Depois de a nuvem desaparecer, descemos e vimos que muitos animais, aves, cabras, ovelhas, gatos e mulas, estavam mortos. E vimos muita gente morta.»"], "fonte": "Testemunho curdo sobre Halabja, 1988", "seccao": "8. Oito anos, nenhuma fronteira"}, {"tipo": "historiador", "paras": ["«Oito anos de guerra não mudaram fronteiras nenhumas e não removeram governo nenhum. Foi um impasse de oito anos, muito caro e muito mortífero.»"], "fonte": "Lawrence Zwier e Mathew Weltig, <em>The Persian Gulf and Iraqi Wars<\/em>", "seccao": "8. Oito anos, nenhuma fronteira"}, {"tipo": "historiador", "paras": ["«A maioria dos movimentos islamistas do século XX partilha uma série de agravos. Entre as suas aversões estão as ideologias falidas de origem ocidental, a corrupção, o autoritarismo, a urbanização, a industrialização rápida, a ocidentalização, o apoio incondicional americano a Israel, os dois pesos e duas medidas da política ocidental, a desagregação social, o declínio da moral pública e as incertezas criadas pela globalização […] A diferença essencial entre os islamistas militantes e os islamistas políticos é que os militantes não acreditam em trabalhar dentro do sistema existente, que a seus olhos é corrupto, ímpio e irrecuperável. Não se limitam a ver o uso da força para derrubar governos como aceitável: defendem-no como justo e santo, como <em>jihad<\/em>.»"], "fonte": "Antony Best <em>et al.<\/em>, <em>International History of the Twentieth Century and Beyond<\/em>", "seccao": "9. O regresso da religião à política"}], "prof": [], "hoje": [{"rotulo": "De 1945 a ontem à tarde", "texto": "Vale a pena reter esta sequência, porque regressa no fim do capítulo. Em 1953, o Ocidente destruiu no Irão a alternativa nacionalista e laica e instalou um autocrata. Em 1979, quando esse autocrata caiu, a alternativa que restava para o substituir já não era secular. É o argumento central de quem defende que a revolução islâmica de 1979 foi, em boa medida, filha do golpe de 1953.", "seccao": "4. Abadan"}], "cron": [{"k": "622 / 632", "v": "Hégira de Maomé para Medina, início do calendário islâmico; morte do Profeta e disputa sucessória que divide sunitas e xiitas."}, {"k": "1916 - 1922", "v": "Sykes-Picot e mandatos da Sociedade das Nações: Palestina, Transjordânia e Iraque britânicos; Síria e Líbano franceses."}, {"k": "mar 1924", "v": "<strong>Abolição do califado<\/strong> por Atatürk. Fecho dos tribunais religiosos e código civil suíço."}, {"k": "1928", "v": "Fundação da Irmandade Muçulmana no Egito. Reforma do alfabeto turco."}, {"k": "22 mar 1945", "v": "Fundação da <strong>Liga Árabe<\/strong> no Cairo, com sete Estados. Hoje são vinte e dois."}, {"k": "1941", "v": "Início da exploração do petróleo saudita. Pacto «petróleo por segurança» com os Estados Unidos."}, {"k": "1951", "v": "Mossadegh nacionaliza a Anglo-Iranian Oil Company. Boicote britânico."}, {"k": "ago 1953", "v": "<strong>Golpe contra Mossadegh<\/strong>, organizado pela CIA e pelo MI6. O xá governa como autocrata durante 26 anos."}, {"k": "1952", "v": "Nasser e os Oficiais Livres tomam o poder no Egito."}, {"k": "26 jul 1956", "v": "Nacionalização do canal do Suez. Crise de novembro."}, {"k": "fev 1958", "v": "Criação da <strong>República Árabe Unida<\/strong> (Egito e Síria). Dissolvida em 1961."}, {"k": "jul 1958", "v": "Queda
