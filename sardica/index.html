<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Desde 1945 até ontem à tarde · Plataforma de estudo</title>
<link rel="stylesheet" href="/account/account.css">
<style>
:root{--vinho:#8a1c1c;--creme:#f4efe4;--tinta:#1d1a16;--linha:#e3dccf;--ok:#2f6b3a;--mau:#a33;--cinza:#6b645a;--papel:#fff;--fundo:#faf7f1;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Georgia,"Palatino Linotype","Book Antiqua",serif;color:var(--tinta);background:var(--fundo);line-height:1.6;font-size:17px}
header{background:var(--papel);border-bottom:3px solid var(--vinho);padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.3rem;font-style:italic;font-weight:normal;line-height:1.25}
header .acc-chip{margin-left:auto}
header h1 small{display:block;font-style:normal;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--vinho);margin-bottom:3px}
.countdown{font-size:.85rem;color:var(--cinza);text-align:right;line-height:1.35}
.countdown b{color:var(--vinho);font-size:1.1rem}
nav{display:flex;gap:2px;padding:8px 16px;background:var(--creme);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:5;overflow-x:auto;align-items:center}
nav button{font:inherit;font-size:.95rem;background:none;border:1px solid transparent;padding:7px 14px;cursor:pointer;border-radius:4px;color:var(--tinta);white-space:nowrap}
nav button.on{background:var(--papel);border-color:var(--linha);color:var(--vinho);font-weight:bold}
nav .scope{margin-left:auto;font-size:.82rem;color:var(--cinza);display:flex;align-items:center;gap:6px;white-space:nowrap;padding-left:12px}
.subnav{display:flex;gap:2px;padding:6px 16px;background:#faf6ec;border-bottom:1px solid var(--linha);overflow-x:auto}
.subnav button{font:inherit;font-size:.9rem;background:none;border:0;border-bottom:2px solid transparent;padding:5px 10px;cursor:pointer;color:var(--cinza);white-space:nowrap}
.subnav button.on{color:var(--vinho);border-bottom-color:var(--vinho)}
main{max-width:960px;margin:0 auto;padding:24px 20px 80px}
h2{font-weight:normal;font-size:1.02rem;letter-spacing:.06em;text-transform:uppercase;color:var(--vinho);border-bottom:1px solid var(--linha);padding-bottom:5px;margin:26px 0 12px}
h3{font-weight:normal;font-variant:small-caps;font-size:1.05rem;margin:18px 0 6px}
.card{background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:20px 24px;margin:14px 0}
.caixa{background:var(--creme);border-radius:6px;padding:10px 14px;margin:10px 0;font-size:.95rem}
.rotulo{display:block;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--vinho);margin-bottom:4px}
button.b,select,input[type=text]{font:inherit;font-size:.92rem}
button.b{background:var(--vinho);color:#fff;border:0;padding:9px 16px;border-radius:5px;cursor:pointer}
button.b.sec{background:var(--papel);color:var(--vinho);border:1px solid var(--vinho)}
button.b.pq{padding:5px 10px;font-size:.85rem}
button.b:disabled{opacity:.5;cursor:default}
select,input[type=text]{padding:6px 8px;border:1px solid var(--linha);border-radius:4px;background:var(--papel)}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.muted{color:var(--cinza);font-size:.9rem}
blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--vinho);background:#faf6ec;font-size:.96rem}
blockquote.doc{font-family:"Courier New",monospace;font-size:.86rem;border-color:#b08d57}
blockquote footer{font-size:.8rem;text-align:right;color:var(--cinza);margin-top:4px}
textarea{width:100%;min-height:420px;font:inherit;font-size:1rem;line-height:1.6;padding:14px;border:1px solid var(--linha);border-radius:6px;resize:vertical;background:#fffdf8}
.timer{font-size:2rem;font-variant-numeric:tabular-nums;color:var(--vinho)}
.timer.alerta{color:var(--mau);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.4}}
.tag{display:inline-block;border:1px solid var(--linha);border-radius:12px;padding:1px 9px;font-size:.8rem;margin:2px;background:var(--papel)}
.tag.ok{background:#e7f1e8;border-color:#9fc5a6;color:var(--ok)}
.tag.falta{background:#f8e9e9;border-color:#d9a3a3;color:var(--mau)}
.barra{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin:4px 0 10px}
.barra i{display:block;height:100%;background:var(--vinho)}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px;font-size:1.1rem;cursor:pointer}
.flash .verso{color:var(--vinho);margin-top:12px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
td,th{border-bottom:1px solid var(--linha);padding:7px 8px;vertical-align:top;text-align:left}
td.k{white-space:nowrap;font-weight:bold;font-size:.85rem;width:9em}
.elo{position:relative;padding:8px 12px 8px 30px;border-left:2px solid var(--vinho);margin-left:10px}
.elo::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--vinho)}
.elo .porque{font-size:.9rem;color:var(--cinza);margin-top:4px;font-style:italic}
.elo .porque.oculto{filter:blur(5px);cursor:pointer}
.crit{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;font-size:.92rem}
.crit input[type=range]{width:160px}
.opt{display:block;width:100%;text-align:left;background:var(--papel);border:1px solid var(--linha);border-radius:6px;padding:10px 14px;margin:6px 0;cursor:pointer;font:inherit;line-height:1.45}
.opt.ok{background:#e7f1e8;border-color:var(--ok)}
.opt.mau{background:#f8e9e9;border-color:var(--mau)}
.opt kbd{display:inline-block;min-width:1.4em;text-align:center;font:inherit;font-size:.78rem;color:var(--cinza);border:1px solid var(--linha);border-radius:3px;padding:0 4px;margin-right:8px;background:#faf6ec}
.opt.ok kbd{color:var(--ok);border-color:var(--ok)} .opt.mau kbd{color:var(--mau);border-color:var(--mau)}
.opt:disabled{cursor:default} .opt:not(:disabled):hover{border-color:var(--vinho)}
.opt blockquote,.pergunta blockquote{margin:8px 0}
.pergunta{font-size:1.1rem;margin:8px 0 14px;line-height:1.5}
.qtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--cinza)}
.exp{border-left-color:var(--ok)} .exp.mau{border-left-color:var(--mau)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.kpi div{background:var(--creme);border-radius:6px;padding:8px 12px}
.kpi b{display:block;font-size:1.5rem;color:var(--vinho);font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--cinza);letter-spacing:.06em;text-transform:uppercase}
.plano{background:#fff8e6;border:1px solid #e8d9a8;border-radius:6px;padding:10px 14px;margin:10px 0}
.tipos label{margin-right:12px;font-size:.9rem;cursor:pointer}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sel-row{cursor:pointer} tr.sel-row:hover{background:#faf6ec}
.mini{height:6px;background:#eee;border-radius:3px;overflow:hidden;min-width:80px} .mini i{display:block;height:100%;background:var(--ok)}
.pontos{display:flex;flex-wrap:wrap;gap:4px}
.pontos label{font-size:.8rem;border:1px solid var(--linha);border-radius:12px;padding:1px 8px;background:var(--papel);cursor:pointer}
.pontos input{display:none}
.pontos label.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.hidden{display:none}
.essay-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
details summary{cursor:pointer;color:var(--vinho)}
.lista li{margin:6px 0}
.ok-txt{color:var(--ok)} .mau-txt{color:var(--mau)}
/* passos do início */
.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.passo{background:var(--creme);border-radius:8px;padding:14px 16px}
.passo b{display:block;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--vinho);margin-bottom:4px}
.passo p{margin:4px 0 10px;font-size:.95rem}
/* leitura da matéria */
.pontos-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.pontos-lista button{font:inherit;text-align:left;background:var(--papel);border:1px solid var(--linha);border-radius:6px;padding:8px 10px;cursor:pointer;font-size:.9rem;line-height:1.3;color:var(--tinta)}
.pontos-lista button.on{border-color:var(--vinho);background:#faf6ec}
.pontos-lista button b{color:var(--vinho);margin-right:6px}
.pontos-lista button.fora{opacity:.55}
.leitura{background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:36px 44px 48px;max-width:780px;margin:14px auto;font-size:1.06rem;line-height:1.7}
.leitura .eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--vinho);margin:0 0 8px}
.leitura h1{font-weight:normal;font-size:2rem;line-height:1.15;margin:0 0 8px}
.leitura .sub{color:var(--cinza);font-size:1rem;margin:0 0 18px;line-height:1.5}
.leitura h2{font-size:1.3rem;letter-spacing:0;text-transform:none;border:0;border-top:1px solid var(--linha);padding-top:24px;margin:36px 0 10px;color:var(--vinho);font-weight:normal}
.leitura h3{font-variant:normal;font-size:1.05rem;font-weight:bold;margin:24px 0 6px}
.leitura h3 small{font-weight:normal;color:var(--cinza);font-size:.82rem;margin-left:6px}
.leitura p{margin:8px 0}
.leitura blockquote{margin:12px 0;padding:10px 16px;font-size:1rem;line-height:1.6}
.leitura blockquote p{margin:4px 0}
.leitura blockquote.doc{font-family:inherit;font-size:1rem}
.leitura .aula{background:#fff8e6;border-left:3px solid #d8b35a;padding:8px 14px;margin:12px 0;font-size:.98rem;border-radius:0 6px 6px 0}
.leitura .aula b{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#8a6a1c;display:block;margin-bottom:2px}
.leitura .hoje{background:var(--creme);border-radius:6px;padding:10px 14px;margin:12px 0;font-size:.98rem}
.leitura .hoje b{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--vinho);display:block;margin-bottom:2px}
.leitura dl{margin:0} .leitura dt{font-weight:bold;margin-top:14px} .leitura dd{margin:2px 0 0 0}
.leitura table{font-size:.98rem} .leitura td.k{width:11em;color:var(--vinho);font-weight:normal;font-size:.9rem}
.leitura ul,.leitura ol{padding-left:22px} .leitura li{margin:6px 0}
.leitura details{margin:10px 0;padding:8px 12px;background:#faf6ec;border-radius:6px} .leitura summary{font-weight:bold;cursor:pointer;color:var(--tinta)}
.leitura .intro{font-size:1.08rem;line-height:1.65;color:#2a2622;margin:0 0 6px;padding:12px 16px;background:var(--creme);border-radius:6px}
.leitura .epi{font-style:italic;color:#3a352e;border-left-color:#b08d57;background:none;padding-left:14px}
.indice{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--linha)}
.indice a{color:var(--vinho);text-decoration:none;border-bottom:1px dotted #c99}
.pn{display:flex;justify-content:space-between;gap:10px;margin:30px 0 0;padding-top:16px;border-top:1px solid var(--linha)}
.topo{position:fixed;right:16px;bottom:16px;z-index:4}
.rolo{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sel-ponto{display:none;width:100%;font-size:1rem;padding:8px}
@media(max-width:640px){.pontos-lista{display:none} .sel-ponto{display:block} body{font-size:16px} main{padding:16px 12px 60px} header{padding:12px 16px} .card{padding:16px} .leitura{padding:22px 18px 32px;font-size:1.02rem} .leitura h1{font-size:1.6rem} nav .scope span{display:none}}
@media print{nav,.subnav,header .countdown,button,.topo{display:none} .leitura{border:0;padding:0;max-width:none}}
</style>
</head>
<body>
<header>
  <h1><small>História Contemporânea · Prof. J. M. Sardica · UCP 2026-27</small>Desde 1945 até ontem à tarde <span class="muted">· plataforma de estudo</span></h1>
  <div class="countdown" id="countdown"></div>
</header>
<nav id="nav">
  <button data-t="inicio" class="on">Início</button>
  <button data-t="materia">Matéria</button>
  <button data-t="perguntas">Perguntas</button>
  <button data-t="treino">Treino</button>
  <button data-t="ensaio">Ensaio</button>
  <button data-t="historico">Histórico</button>
  <span class="scope"><span>Matéria:</span> <select id="scope"><option value="8">Pontos 1-8 (1.º teste)</option><option value="16">Todos os pontos</option></select></span>
</nav>
<div id="subnav" class="subnav hidden">
  <button data-t="citacoes">Citações</button>
  <button data-t="conceitos">Conceitos</button>
  <button data-t="cronologia">Cronologia</button>
  <button data-t="mecanismos">Mecanismos</button>
  <button data-t="professor">Professor</button>
</div>
<main id="main"></main>

<script src="perguntas.js?v=1"></script>
<script src="resumos.js?v=1"></script>
<script>
const DATA ={"capitulos": [{"n": 1, "titulo": "O ano em que o mundo acabou e começou", "subtitulo": "O estabelecimento da nova ordem internacional do Pós-Guerra: as conferências interaliadas de Ialta e Potsdam, a criação da ONU e a jurisprudência de Nuremberga", "datas": "1943 — 1948", "epigrafe": {"texto": "«Para milhões de europeus, a Segunda Guerra Mundial foi, mais ainda do que a Primeira, o mais perto que estiveram do inferno na terra. Só o número de mortos — mais de quarenta milhões apenas na Europa, mais de quatro vezes o da Primeira Guerra — dá uma ideia do horror. As perdas desafiam a imaginação.»", "autor": "Ian Kershaw, À Beira do Abismo"}, "seccoes": ["1. O fundo do poço", "2. Três homens num palácio de verão", "3. A morte que mudou a mesa", "4. Potsdam, ou o fim da aliança", "5. A nuvem", "6. O tribunal", "7. A casa da paz", "8. O ponto de partida"], "citacoes": [{"tipo": "historiador", "paras": ["«A Europa no rescaldo da Segunda Guerra Mundial oferecia uma perspetiva de completa miséria e desolação. Fotografias e filmes documentais da época mostram correntes lastimáveis de civis indefesos a atravessar uma paisagem devastada de cidades destruídas e campos estéreis. Crianças órfãs vagueiam desamparadas diante de grupos de mulheres exaustas que reviram montes de alvenaria. Deportados de cabeça rapada e prisioneiros de campos de concentração em pijamas às riscas olham apaticamente para a câmara, esfomeados e doentes. Tudo e todos — com a notável exceção das bem alimentadas forças de ocupação aliadas — parecem gastos, sem recursos, exaustos.»"], "fonte": "Tony Judt, <em>Pós-Guerra<\/em>, cap. 1", "seccao": "1. O fundo do poço"}, {"tipo": "historiador", "paras": ["«Ialta, na verdade, importou pouco. [...] O máximo que se pode dizer da Conferência de Ialta é que oferece um estudo notável sobre o mal-entendido, com Roosevelt em particular a ser vítima das suas próprias ilusões. Porque nessa altura Estaline dificilmente precisava da permissão ocidental para fazer o que quisesse na Europa de Leste, como pelo menos os britânicos compreendiam perfeitamente.»"], "fonte": "Tony Judt, <em>Pós-Guerra<\/em>, cap. 4", "seccao": "2. Três homens num palácio de verão"}, {"tipo": "fonte", "paras": ["«Esperámos que eles desembarcassem. Conseguíamos ver-lhes as caras. Pareciam pessoas normais. Tínhamos imaginado uma coisa diferente. Bom, eram americanos!»"], "fonte": "Liubova Kozinchenka, Exército Vermelho, 58.ª Divisão de Guardas, <em>in<\/em> Gaddis, <em>A Guerra Fria<\/em>, cap. 1", "seccao": "2. Três homens num palácio de verão"}, {"tipo": "fonte", "paras": ["«Acho que não sabíamos o que esperar dos russos, mas quando olhávamos para eles e os examinávamos, não se percebia, compreende? Se lhes puséssemos um uniforme americano, podiam ser americanos!»"], "fonte": "Al Aronson, Exército dos EUA, 69.ª Divisão de Infantaria, <em>in<\/em> Gaddis, <em>A Guerra Fria<\/em>, cap. 1", "seccao": "2. Três homens num palácio de verão"}, {"tipo": "historiador", "paras": ["«A guerra tinha sido ganha por uma coligação cujos membros principais já estavam em guerra — ideológica e geopoliticamente, se não militarmente — uns com os outros. Quaisquer que fossem os triunfos da Grande Aliança na primavera de 1945, o seu sucesso sempre dependera da prossecução de objetivos compatíveis por sistemas incompatíveis. A tragédia era esta: que a vitória exigiria dos vencedores ou que deixassem de ser quem eram, ou que abdicassem de grande parte daquilo que esperavam alcançar ao fazer a guerra.»"], "fonte": "John Lewis Gaddis, <em>A Guerra Fria<\/em>, cap. 1", "seccao": "2. Três homens num palácio de verão"}, {"tipo": "fonte", "paras": ["«Esta guerra não é como as do passado; quem ocupa um território impõe-lhe também o seu próprio sistema social. Cada um impõe o seu sistema até onde o seu exército chegar. Não pode ser de outro modo.»"], "fonte": "Josef Estaline, abril de 1945, <em>in<\/em> Odd Arne Westad, <em>A Guerra Fria<\/em>, cap. 2", "seccao": "4. Potsdam, ou o fim da aliança"}, {"tipo": "historiador", "paras": ["«O cogumelo da bomba seria o símbolo de uma nova era. Foi o ponto em que o mundo virou. [...] Daí em diante, os europeus teriam de aprender a viver à sombra da bomba, a enfrentar a ameaça da aniquilação nuclear.»"], "fonte": "Ian Kershaw, <em>À Beira do Abismo<\/em>, cap. 8", "seccao": "5. A nuvem"}, {"tipo": "historiador", "paras": ["«Foram certamente sentidos por muitos como \"justiça dos vencedores\", e era exatamente isso que eram. Mas foram também julgamentos reais de criminosos reais por comportamentos demonstravelmente criminosos, e estabeleceram um precedente vital para a jurisprudência internacional das décadas seguintes.»"], "fonte": "Tony Judt, <em>Pós-Guerra<\/em>, cap. 2", "seccao": "6. O tribunal"}, {"tipo": "documento", "paras": ["«NÓS, OS POVOS DAS NAÇÕES UNIDAS, DECIDIDOS:", "A preservar as gerações vindouras do flagelo da guerra que por duas vezes, no espaço de uma vida humana, acarretou sofrimentos indizíveis à humanidade;", "A reafirmar a nossa fé nos direitos fundamentais do homem, na dignidade e no valor da pessoa humana, na igualdade de direitos dos homens e das mulheres, assim como das nações, grandes e pequenas;", "A estabelecer as condições necessárias à manutenção da justiça e do respeito das obrigações decorrentes do direito internacional;", "A promover o progresso social e melhores condições de vida dentro de um conceito mais amplo de liberdade;", "E PARA TAIS FINS:", "A praticar a tolerância e a viver em paz, uns com os outros, como bons vizinhos;", "A unir as nossas forças para manter a paz e a segurança internacionais;", "A garantir que a força armada não será usada, a não ser no interesse comum;", "A empregar mecanismos internacionais para promover o progresso económico e social de todos os povos.»"], "fonte": "Carta das Nações Unidas, Preâmbulo, São Francisco, 26 de junho de 1945", "seccao": "7. A casa da paz"}, {"tipo": "historiador", "paras": ["«Em 1945 pode sentir-se justificadamente que o fim da Segunda Guerra Mundial marca bem o triunfo da democracia em toda a Terra. [...] Ora, menos de dois anos mais tarde, os vencedores estão desunidos [...] Dois blocos hostis confrontam-se numa forma de guerra inédita para a qual é necessário inventar um nome, mais exatamente uma imagem, a de guerra fria. A situação de 1947 é o mais diferente possível da que o mundo esperava em 1945.»"], "fonte": "René Rémond, <em>Introdução à História do Nosso Tempo<\/em>, 4.ª parte", "seccao": "8. O ponto de partida"}], "prof": [{"texto": "«Regresso da barbárie.» E, sobre o que ficava por fazer depois de assinada a paz: «É mais fácil desminar um terreno que as almas.»", "quem": "J. M. Sardica, aula de 10 de setembro de 2026", "seccao": "1. O fundo do poço"}, {"texto": "«Eu sacrifiquei vinte e cinco milhões de homens. Tenho direito a escolher o destino da ordem internacional.»", "quem": "A posição de Estaline, tal como resumida na aula de 10 de setembro de 2026", "seccao": "2. Três homens num palácio de verão"}, {"texto": "«Não há destinos fechados em história.»", "quem": "J. M. Sardica, aula de 17 de setembro de 2026", "seccao": "2. Três homens num palácio de verão"}, {"texto": "«Os Estados Unidos e a União Soviética concordam em enfraquecer a Alemanha para evitar nova guerra. Mas os dois querem os seus recursos. Logo, a divisão torna-se inevitável.»", "quem": "J. M. Sardica, aula de 17 de setembro de 2026", "seccao": "4. Potsdam, ou o fim da aliança"}, {"texto": "«Estaline só não sabia que ele já não era necessário.»", "quem": "J. M. Sardica, aula de 10 de setembro de 2026", "seccao": "4. Potsdam, ou o fim da aliança"}, {"texto": "«Se Hitler tivesse sido apanhado, estaria ali.»", "quem": "J. M. Sardica, aula de 10 de setembro de 2026", "seccao": "6. O tribunal"}], "hoje": [{"rotulo": "De 1945 a ontem à tarde", "texto": "Vale a pena reter uma coisa antes de seguir. Nenhum de nós passou por isto. A geração que está hoje numa sala de aula portuguesa nunca viu uma guerra de perto, e a paz de que desfruta é historicamente anormal, não normal. Daí uma consequência incómoda: a fadiga mediática do sofrimento dos outros. Vemos tanta guerra em ecrãs que deixámos de a ver. Ler este capítulo devagar é a única forma de recuperar alguma coisa daquilo que os números apagam.", "seccao": "1. O fundo do poço"}, {"rotulo": "De 1945 a ontem à tarde", "texto": "Antes de 1945, as grandes potências faziam guerras umas contra as outras com tanta frequência que estas pareciam ser uma característica permanente da paisagem internacional. Depois de 1945, nunca mais aconteceu. Houve guerras entre superpotências e potências pequenas, e guerras entre potências pequenas, mas nunca um conflito em grande escala entre os Estados Unidos, a União Soviética e os seus aliados. A razão, diz Gaddis, é que pela primeira vez na história ninguém podia ter a certeza de vencer, ou sequer de sobreviver, a uma grande guerra. A guerra entre grandes Estados tornou-se um perigo para a saúde pública e, por consequência, um anacronismo. Oitenta anos de paz entre grandes potências: é o legado mais improvável e mais valioso daquela nuvem.", "seccao": "5. A nuvem"}, {"rotulo": "De 1945 a ontem à tarde", "texto": "Portugal não esteve em São Francisco e ficou de fora da organização durante dez anos, bloqueado pelo veto soviético, que o considerava um regime aparentado com os vencidos. Só entrou em dezembro de 1955, num acordo global em que os dois blocos admitiram em bloco os países que cada um patrocinava. O mesmo mecanismo que manteve Portugal à porta durante uma década é o que hoje impede o Conselho de Segurança de agir sobre a Ucrânia ou sobre Gaza. Não está avariado. Está a funcionar exatamente como foi desenhado em 1945.", "seccao": "7. A casa da paz"}], "cron": [{"k": "27 nov – 1 dez 1943", "v": "Conferência de Teerão. Primeiro encontro dos Três Grandes."}, {"k": "9 out 1944", "v": "«Acordo das percentagens» entre Churchill e Estaline, em Moscovo."}, {"k": "ago – out 1944", "v": "Dumbarton Oaks: desenho da estrutura das Nações Unidas."}, {"k": "4 – 11 fev 1945", "v": "<strong>Conferência de Ialta<\/strong>, no Palácio de Livádia. Zonas de ocupação, Declaração da Europa Libertada, fronteiras da Polónia, entrada da URSS na guerra do Pacífico."}, {"k": "12 abr 1945", "v": "Morte de Roosevelt. Truman assume a presidência."}, {"k": "25 abr 1945", "v": "Encontro dos exércitos americano e soviético em Torgau, no Elba. Abertura da conferência de São Francisco."}, {"k": "30 abr 1945", "v": "Suicídio de Hitler."}, {"k": "7 – 8 mai 1945", "v": "Rendição incondicional alemã, assinada em Reims e em Berlim."}, {"k": "16 jul 1945", "v": "Teste Trinity, em Alamogordo."}, {"k": "17 jul – 2 ago 1945", "v": "<strong>Conferência de Potsdam<\/strong>. Attlee substitui Churchill a 26 de julho. Reparações por zonas."}, {"k": "6 e 9 ago 1945", "v": "Bombas atómicas sobre Hiroxima e Nagasáqui. A URSS declara guerra ao Japão a 8 de agosto."}, {"k": "15 ago / 2 set 1945", "v": "Anúncio e assinatura da rendição japonesa."}, {"k": "26 jun 1945", "v": "Assinatura da Carta das Nações Unidas por 50 Estados."}, {"k": "24 out 1945", "v": "Entrada em vigor da Carta. Data de fundação da ONU."}, {"k": "20 nov 1945 – 1 out 1946", "v": "<strong>Tribunal Militar Internacional de Nuremberga.<\/strong> 12 condenações à morte, 3 absolvições."}, {"k": "16 out 1946", "v": "Execução dos condenados. Göring suicida-se na véspera."}, {"k": "9 e 10 dez 1948", "v": "Convenção do Genocídio e Declaração Universal dos Direitos Humanos."}], "conceitos": [{"k": "Stunde Null", "v": "«Hora zero», maio de 1945: a sensação alemã de que tudo recomeçava do nada. Judt avisa que é uma ficção útil, porque a história de 1945 é inseparável da «guerra de trinta anos» iniciada em 1914."}, {"k": "Declaração da Europa Libertada", "v": "Texto assinado em Ialta que prometia governos representativos e eleições livres nos países libertados. Westad descreve-a como «longa em princípios e curta em pormenor». Foi o documento que o Ocidente usou depois para acusar Moscovo de quebrar a palavra."}, {"k": "Comité de Lublin", "v": "Governo comunista polaco trazido de Moscovo pelo Exército Vermelho e já instalado em Varsóvia à data de Ialta. Prova material do argumento de que nada se decidia na Crimeia que não estivesse já decidido no terreno."}, {"k": "Linha Curzon / Oder-Neisse", "v": "As novas fronteiras leste e oeste da Polónia, deslocando o país inteiro para ocidente à custa da Alemanha. A Oder-Neisse só foi reconhecida pela Alemanha Ocidental em 1970 e definitivamente em 1990."}, {"k": "Reparações por zonas", "v": "Solução de Potsdam: cada potência ressarce-se sobretudo dentro da sua zona de ocupação. Tecnicamente uma regra contabilística; na prática, o primeiro passo para a divisão económica e depois política da Alemanha."}, {"k": "Crimes contra a paz", "v": "Acusação nova em Nuremberga: desencadear uma guerra de agressão passa a ser crime individual, e não ato soberano."}, {"k": "Crimes contra a humanidade", "v": "Acusação nova em Nuremberga: o tratamento que um Estado dá às pessoas sob o seu poder, incluindo os seus cidadãos, deixa de ser assunto exclusivamente interno."}, {"k": "Genocídio", "v": "Palavra criada por Raphael Lemkin em 1944 (<em>génos<\/em> + <em>-cídio<\/em>). Duas componentes: definição de uma comunidade como inimiga e plano concertado para a sua eliminação. Codificada no artigo II da Convenção de 1948. O que define o crime é a intenção dirigida ao grupo enquanto grupo."}, {"k": "Direito de veto", "v": "Poder de cada um dos cinco membros permanentes do Conselho de Segurança de bloquear qualquer decisão. Foi o preço pago para que as grandes potências entrassem na ONU, e a garantia de que a organização nunca poderia agir contra nenhuma delas."}], "frases": ["«1945 foi um ponto de chegada e um ponto de partida. O mundo de hoje ainda é o deixado por 1945.»", "«É mais fácil desminar um terreno que as almas.»", "«Não há destinos fechados em história.»", "«Estaline foi o grande vencedor da Segunda Guerra Mundial», e conseguiu «suavizar a perceção de totalitarismo ao derrotar o totalitarista Hitler».", "«Estaline só não sabia que ele já não era necessário.»", "«Se Hitler tivesse sido apanhado, estaria ali.»", "Nuremberga em quatro verbos: «desnazificar, reconciliar, pacificar, codificar».", "A fórmula das três moedas: «EUA, armas; URSS, sangue; Reino Unido, tempo.»"], "fontes": ["<strong>Kershaw<\/strong>, sobre 1945 como «o mais perto que estiveram do inferno na terra»; mais de 40 milhões de mortos só na Europa.", "<strong>Judt<\/strong>, sobre a «completa miséria e desolação» da Europa; sobre Ialta, que «importou pouco» e é «um estudo notável sobre o mal-entendido»; sobre Nuremberga como justiça dos vencedores <em>e<\/em> precedente vital.", "<strong>Gaddis<\/strong>, sobre a coligação cujos membros «já estavam em guerra uns com os outros»; sobre a assimetria de 300 mil mortos americanos contra 27 milhões de soviéticos; sobre a guerra entre grandes potências como «anacronismo».", "<strong>Best<\/strong>, sobre Ialta como «ponto mais alto da cooperação interaliada» e sobre a bomba como fator «importante, embora por si só não decisivo».", "<strong>Westad<\/strong>, com a frase de Estaline: «Cada um impõe o seu sistema até onde o seu exército chegar.»", "<strong>Rémond<\/strong>, sobre a «lenda de Ialta» e sobre 1947 ser «o mais diferente possível» do que se esperava em 1945.", "<strong>Documentos<\/strong>: Preâmbulo da Carta das Nações Unidas; Declaração da Europa Libertada; artigo II da Convenção do Genocídio."], "perguntas": [{"q": "Em que medida a Conferência de Ialta determinou a divisão da Europa?", "guia": "Montar a resposta em três tempos. Primeiro, o que Ialta decidiu de facto: zonas de ocupação, Declaração da Europa Libertada, fronteiras polacas. Segundo, a tese de Judt: Ialta importou pouco, porque o Exército Vermelho já estava no terreno e o Comité de Lublin já governava em Varsóvia. Terceiro, a frase de Estaline em Westad, que mostra que a divisão foi função do avanço dos exércitos, não das assinaturas. Concluir com Best: o problema não foi má-fé, foi o choque de visões de ordem mundial. Evitar tanto a tese da traição como a da irrelevância absoluta."}, {"q": "Explique a importância da jurisprudência de Nuremberga.", "guia": "Três planos. Jurídico: as duas categorias novas, crimes contra a paz e crimes contra a humanidade, e o princípio de que cumprir ordens não é defesa. Político: a individualização da culpa ilibou moralmente o povo alemão e tornou possível a reconstrução e a futura integração da Alemanha Ocidental. Conceptual: a palavra de Lemkin e a sua codificação em 1948. Referir a objeção da «justiça dos vencedores» e responder-lhe com Judt."}, {"q": "Porque é que a ONU foi concebida com direito de veto?", "guia": "Partir do fracasso da Sociedade das Nações: pura em princípios, vazia de potências, sem os Estados Unidos. Roosevelt quis o contrário: incluir toda a gente e refletir o poder real, daí os «quatro polícias» e o Conselho de Segurança. O veto foi o preço da adesão soviética e americana. Fechar com Reynolds: a ONU só podia funcionar em segurança se a cooperação do tempo de guerra continuasse na paz, e isso não aconteceu."}, {"q": "Que papel teve a bomba atómica na transição da aliança para o confronto?", "guia": "Distinguir os três níveis. Militar: encurtou a guerra do Pacífico. Diplomático: Truman esperava usá-la como alavanca, mas Estaline sabia dela desde 1942 e endureceu em vez de ceder. Estrutural: criou em 1945 uma assimetria absoluta que a URSS anulou em 1949, e instaurou a lógica que tornaria impensável a guerra direta entre grandes potências. Usar Best para a formulação equilibrada e Gaddis para a consequência de longo prazo."}, {"q": "Justifique a afirmação de que 1945 foi simultaneamente um ponto de chegada e um ponto de partida.", "guia": "Ponto de chegada: fim da «guerra de trinta anos» iniciada em 1914, segundo a periodização de Kershaw e de Judt; balanço material e humano; fim dos impérios alemão e japonês. Ponto de partida: as quatro fundações do mundo novo, que são a divisão da Europa, a arma nuclear, o direito internacional e a ONU. Rematar com Rémond, sobre a distância entre o que se esperava em 1945 e o que existia em 1947."}], "biblio": [], "lecionado": "Lecionado na aula de 10 de setembro de 2026.", "autores": [{"nome": "Tony Judt", "apelido": "Judt", "tipos": ["ficha", "historiador"], "n": 3}, {"nome": "John Lewis Gaddis", "apelido": "Gaddis", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Josef Estaline", "apelido": "Estaline", "tipos": ["fonte"], "n": 1}, {"nome": "Ian Kershaw", "apelido": "Kershaw", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "René Rémond", "apelido": "Rémond", "tipos": ["ficha", "historiador"], "n": 1}, {"nome": "Best", "apelido": "Best", "tipos": ["ficha"], "n": 0}, {"nome": "Westad", "apelido": "Westad", "tipos": ["ficha"], "n": 0}], "anos": ["1943", "1944", "1945", "1946", "1948"]}, {"n": 2, "titulo": "A cortina desce", "subtitulo": "A «cortina de ferro», a bipolarização do mundo e o estabelecimento da Guerra Fria na segunda metade da década de 1940", "datas": "1946 — 1949", "epigrafe": {"texto": "«É mais provável que ponha fim às guerras em grande escala ao preço de prolongar indefinidamente uma paz que não é paz.»", "autor": "George Orwell, sobre a bomba atómica, 1945"}, "seccoes": ["1. Oito mil palavras de Moscovo", "2. A palavra que faltava", "3. O velho leão em Fulton", "4. Doze de março de 1947", "5. Harvard, 5 de junho de 1947", "6. A resposta de Moscovo", "7. A arquitetura", "8. 1949, o ano em que tudo duplicou", "9. A linha da frente passava pela sala de estar", "10. De quem foi a culpa?"], "citacoes": [{"tipo": "documento", "paras": ["«No fundo da visão neurótica que o Kremlin tem dos assuntos mundiais está o tradicional e instintivo sentimento russo de insegurança. [...] E aprenderam a procurar a segurança apenas na luta paciente mas mortal pela destruição total do poder rival, nunca em pactos e compromissos com ele.»"], "fonte": "George F. Kennan, «Telegrama Longo», Moscovo, 22 de fevereiro de 1946", "seccao": "1. Oito mil palavras de Moscovo"}, {"tipo": "documento", "paras": ["«Temos aqui uma força política fanaticamente comprometida com a crença de que com os Estados Unidos não pode haver <em>modus vivendi<\/em> permanente, de que é desejável e necessário que a harmonia interna da nossa sociedade seja perturbada, o nosso modo de vida tradicional destruído, a autoridade internacional do nosso Estado quebrada, para que o poder soviético esteja seguro.»"], "fonte": "George F. Kennan, «Telegrama Longo», 22 de fevereiro de 1946", "seccao": "1. Oito mil palavras de Moscovo"}, {"tipo": "documento", "paras": ["«É claro que o elemento principal de qualquer política dos Estados Unidos para com a União Soviética tem de ser o de uma <strong>contenção<\/strong> de longo prazo, paciente mas firme e vigilante, das tendências expansivas russas.»"], "fonte": "George F. Kennan, «The Sources of Soviet Conduct», julho de 1947", "seccao": "1. Oito mil palavras de Moscovo"}, {"tipo": "documento", "paras": ["«A política externa dos Estados Unidos, que reflete as tendências imperialistas do capital monopolista americano, é caracterizada na era do pós-guerra por uma ambição de supremacia mundial.»"], "fonte": "Nikolai Novikov, telegrama de Washington, setembro de 1946", "seccao": "1. Oito mil palavras de Moscovo"}, {"tipo": "historiador", "paras": ["«O termo \"Guerra Fria\" apareceu pela primeira vez em 1946, tornou-se comum em 1947 e, a partir de 1950, foi adotado de ambos os lados da Cortina de Ferro e usado em todo o mundo. Nunca foi oferecida uma definição exata.»"], "fonte": "Martin McCauley, <em>Origins of the Cold War<\/em>", "seccao": "2. A palavra que faltava"}, {"tipo": "documento", "paras": ["«Termo que designa um estado de hostilidade entre blocos rivais (em especial o ocidental e o soviético), envolvendo ação económica, política e subversiva, mas sem guerra declarada. A responsabilidade pela condição de Guerra Fria é atribuída, conforme os casos, à ambição de Estaline, às atividades do capitalismo internacional, às atividades do comunismo internacional, à política externa americana, e por aí fora. É claro, porém, que ela não poderia existir sem que houvesse dois antagonistas imensamente poderosos, cada um dos quais quer exercer um poder que o outro procura negar-lhe.»"], "fonte": "Roger Scruton, «Cold War», <em>A Dictionary of Political Thought<\/em>", "seccao": "2. A palavra que faltava"}, {"tipo": "documento", "paras": ["«De Stettin, no Báltico, a Trieste, no Adriático, uma cortina de ferro desceu sobre o continente. Atrás dessa linha ficam todas as capitais dos antigos Estados da Europa Central e de Leste. Varsóvia, Berlim, Praga, Viena, Budapeste, Belgrado, Bucareste e Sófia, todas estas cidades famosas e as populações em seu redor ficam na esfera soviética e todas estão sujeitas, de uma forma ou de outra, não só à influência soviética, mas a um grau muito elevado e crescente de controlo por parte de Moscovo. Só Atenas, com as suas glórias imortais, é livre de decidir o seu futuro numa eleição sob observação britânica, americana e francesa.»"], "fonte": "Winston Churchill, Westminster College, Fulton, Missouri, 5 de março de 1946", "seccao": "3. O velho leão em Fulton"}, {"tipo": "documento", "paras": ["«Não acredito que a Rússia soviética deseje a guerra. O que desejam são os frutos da guerra e a expansão indefinida do seu poder e das suas doutrinas. [...] Pelo que vi dos nossos amigos e aliados russos durante a guerra, estou convencido de que nada admiram tanto como a força, e nada há por que tenham menos respeito do que a fraqueza militar.»"], "fonte": "Winston Churchill, Fulton, 5 de março de 1946", "seccao": "3. O velho leão em Fulton"}, {"tipo": "fonte", "paras": ["«O Sr. Churchill toma agora a posição dos fomentadores de guerra, e nisso o Sr. Churchill não está só. [...] O Sr. Churchill e os seus amigos têm uma semelhança impressionante com Hitler e os seus amigos. Hitler começou a sua obra de desencadeamento da guerra proclamando uma teoria racial. [...] O Sr. Churchill dispõe-se a desencadear a guerra com uma teoria racial, afirmando que só as nações de língua inglesa são nações superiores.»"], "fonte": "Josef Estaline, entrevista ao <em>Pravda<\/em>, 13 de março de 1946", "seccao": "3. O velho leão em Fulton"}, {"tipo": "documento", "paras": ["«No momento presente da história mundial, quase todas as nações têm de escolher entre modos de vida alternativos. A escolha é, demasiadas vezes, não livre. Um modo de vida baseia-se na vontade da maioria [...] O segundo baseia-se na vontade de uma minoria imposta pela força à maioria. Assenta no terror e na opressão, numa imprensa e rádio controladas, em eleições viciadas e na supressão das liberdades pessoais.", "Creio que tem de ser política dos Estados Unidos apoiar os povos livres que resistem a tentativas de subjugação por minorias armadas ou por pressões externas.»"], "fonte": "Harry S. Truman, mensagem ao Congresso, 12 de março de 1947", "seccao": "4. Doze de março de 1947"}, {"tipo": "documento", "paras": ["«As sementes dos regimes totalitários são alimentadas pela miséria e pela carência. Espalham-se e crescem no solo maligno da pobreza e da discórdia. Atingem o pleno crescimento quando a esperança de um povo numa vida melhor morreu. Temos de manter essa esperança viva.»"], "fonte": "Harry S. Truman, 12 de março de 1947", "seccao": "4. Doze de março de 1947"}, {"tipo": "documento", "paras": ["«A nossa política não é dirigida contra nenhum país ou doutrina, mas contra a fome, a pobreza, o desespero e o caos. O seu propósito deve ser o renascimento de uma economia funcional no mundo, de modo a permitir a emergência de condições políticas e sociais em que instituições livres possam existir.»"], "fonte": "George C. Marshall, Universidade de Harvard, 5 de junho de 1947", "seccao": "5. Harvard, 5 de junho de 1947"}, {"tipo": "documento", "paras": ["«Isto é assunto dos europeus. A iniciativa, penso, tem de vir da Europa. [...] O programa deve ser conjunto, acordado por várias, se não todas, as nações europeias.»"], "fonte": "George C. Marshall, Harvard, 5 de junho de 1947", "seccao": "5. Harvard, 5 de junho de 1947"}, {"tipo": "historiador", "paras": ["«Vários pressupostos moldaram o Plano Marshall: que a ameaça mais grave aos interesses ocidentais na Europa não era a perspetiva de uma intervenção militar soviética, mas antes o risco de que a fome, a pobreza e o desespero levassem os europeus a eleger os seus próprios comunistas, que serviriam depois obedientemente os desejos de Moscovo; que a assistência económica americana produziria benefícios psicológicos imediatos e materiais mais tarde, invertendo essa tendência; que a União Soviética não aceitaria ela própria essa ajuda nem permitiria que os seus satélites a aceitassem, tensionando assim a sua relação com eles; e que os Estados Unidos poderiam então tomar a iniciativa geopolítica e moral na Guerra Fria emergente.»"], "fonte": "John Lewis Gaddis, <em>A Guerra Fria<\/em>", "seccao": "5. Harvard, 5 de junho de 1947"}, {"tipo": "fonte", "paras": ["«Consideramos esta questão uma questão fundamental, da qual depende a vossa amizade com a URSS. Se forem a Paris, mostrarão que querem cooperar numa ação destinada a isolar a União Soviética.»"], "fonte": "Josef Estaline aos dirigentes checoslovacos, julho de 1947, <em>in<\/em> Tony Judt, <em>Pós-Guerra<\/em>, cap. 4", "seccao": "5. Harvard, 5 de junho de 1947"}, {"tipo": "historiador", "paras": ["«Estaline caiu na armadilha que o Plano Marshall lhe armou, que era levá-lo a construir o muro que dividiria a Europa.»"], "fonte": "John Lewis Gaddis, <em>A Guerra Fria<\/em>", "seccao": "5. Harvard, 5 de junho de 1947"}, {"tipo": "fonte", "paras": ["«O imperialismo americano esforça-se por tirar partido das dificuldades do pós-guerra dos países europeus, em particular da falta de matérias-primas, combustível e alimentos nos países aliados que mais sofreram com a guerra, para lhes ditar condições extorsivas por qualquer assistência prestada.»"], "fonte": "Andrei Jdanov, relatório de fundação do Kominform, setembro de 1947", "seccao": "6. A resposta de Moscovo"}, {"tipo": "historiador", "paras": ["«O golpe de Praga teve enorme significado, precisamente porque ocorreu num país mais ou menos democrático que parecera tão amigo de Moscovo. Galvanizou os aliados ocidentais, que dele inferiram que o comunismo marchava para ocidente.»"], "fonte": "Tony Judt, <em>Pós-Guerra<\/em>, cap. 5", "seccao": "6. A resposta de Moscovo"}, {"tipo": "historiador", "paras": ["«As origens da Guerra Fria não foram, contudo, um jogo puramente, talvez nem sequer primariamente, soviético-americano. [...] a influência americana foi em larga medida resultado de iniciativas da Europa Ocidental; foram os britânicos, por exemplo, que pressionaram fortemente pela participação americana numa aliança defensiva da Europa Ocidental.»"], "fonte": "Antony Best <em>et al.<\/em>, <em>International History of the Twentieth Century and Beyond<\/em>", "seccao": "7. A arquitetura"}, {"tipo": "historiador", "paras": ["«O desmoronar da aliança de guerra e a subsequente divisão da Europa não se deveram, pois, a um erro, a puro interesse próprio ou a malevolência; estavam enraizados na história.»"], "fonte": "Tony Judt, <em>Pós-Guerra<\/em>, cap. 4", "seccao": "10. De quem foi a culpa?"}], "prof": [{"texto": "«A Guerra Fria é direta nos conflitos ideológicos e indireta nos meios e nos palcos geográficos. Tornou-se um modo de vida durante quatro décadas. Não era só um assunto diplomático: moldava modos de vida e opiniões.»", "quem": "J. M. Sardica, aula de 15 de setembro de 2026", "seccao": "2. A palavra que faltava"}, {"texto": "«A miséria é pior conselheira.» E: «Democracia não existe quando não há paz social.»", "quem": "Duas fórmulas usadas na aula de 15 de setembro de 2026, a propósito de Gaddis", "seccao": "4. Doze de março de 1947"}, {"texto": "«Estaline tem a bomba atómica em 1949. Uma nova superpotência.»", "quem": "J. M. Sardica, aula de 15 de setembro de 2026", "seccao": "8. 1949, o ano em que tudo duplicou"}], "hoje": [{"rotulo": "As duas colunas", "texto": "<strong>Do lado ocidental:<\/strong> Doutrina Kennan (1946) · Discurso de Churchill em Fulton (1946) · Doutrina Truman (março de 1947) · Plano Marshall (junho de 1947) · OECE (abril de 1948) · NATO (abril de 1949) · República Federal da Alemanha (maio de 1949) · entrada da RFA na NATO (maio de 1955). <strong>Do lado soviético:<\/strong> Doutrina Jdanov (1947) · Kominform (setembro de 1947) · golpe de Praga (fevereiro de 1948) · COMECON (janeiro de 1949) · República Democrática Alemã (outubro de 1949) · Pacto de Varsóvia (maio de 1955).", "seccao": "7. A arquitetura"}, {"rotulo": "De 1945 a ontem à tarde", "texto": "Portugal foi membro fundador da NATO em 1949, o que é notável se lembrarmos que era uma ditadura e que estivera fora das Nações Unidas precisamente por isso. A razão tem um nome geográfico: os Açores. A base aérea americana no arquipélago, instalada durante a guerra, tornou a península Ibérica uma peça de trânsito indispensável no Atlântico Norte. Best explica a consequência com crueza: Salazar pôde desarmar as críticas americanas ao seu regime e, mais tarde, às guerras coloniais, ameaçando retirar o acesso a essas instalações. Quanto ao artigo 5.º, foi invocado uma única vez em setenta e cinco anos de existência da aliança. Não foi por causa da União Soviética. Foi a 12 de setembro de 2001.", "seccao": "7. A arquitetura"}], "cron": [{"k": "out 1945", "v": "Orwell escreve sobre uma «paz que não é paz»."}, {"k": "9 fev 1946", "v": "Discurso de Estaline: o mundo capitalista divide-se em dois campos hostis."}, {"k": "22 fev 1946", "v": "<strong>Telegrama Longo<\/strong> de George Kennan, de Moscovo. Oito mil palavras."}, {"k": "5 mar 1946", "v": "<strong>Discurso de Fulton<\/strong>: Churchill anuncia a «cortina de ferro». Resposta de Estaline no <em>Pravda<\/em> a 13 de março."}, {"k": "set 1946", "v": "Telegrama de Novikov, a imagem em espelho do de Kennan."}, {"k": "12 mar 1947", "v": "<strong>Doutrina Truman<\/strong>: apoiar «os povos livres» que resistem à subjugação."}, {"k": "5 jun 1947", "v": "<strong>Plano Marshall<\/strong>, anunciado em Harvard. Molotov abandona Paris a 2 de julho; a Checoslováquia é obrigada a recusar."}, {"k": "jul 1947", "v": "Artigo «X» de Kennan: a doutrina da <em>contenção<\/em>."}, {"k": "set 1947", "v": "<strong>Doutrina Jdanov<\/strong> e fundação do <strong>Kominform<\/strong> em Szklarska Poręba."}, {"k": "fev 1948", "v": "<strong>Golpe de Praga.<\/strong> Morte de Jan Masaryk a 10 de março."}, {"k": "abr 1948", "v": "Criação da OECE, futura OCDE."}, {"k": "jan 1949", "v": "Criação do COMECON."}, {"k": "4 abr 1949", "v": "<strong>Tratado do Atlântico Norte<\/strong>, assinado em Washington por doze países, Portugal incluído."}, {"k": "29 ago 1949", "v": "Primeiro ensaio nuclear soviético. Fim do monopólio americano."}, {"k": "1 out 1949", "v": "Proclamação da República Popular da China."}, {"k": "abr 1950", "v": "NSC-68: a contenção torna-se global e militar."}, {"k": "jun 1950", "v": "Início da Guerra da Coreia."}, {"k": "mai 1955", "v": "Entrada da RFA na NATO e criação do <strong>Pacto de Varsóvia<\/strong>."}], "conceitos": [{"k": "Guerra Fria", "v": "Estado de hostilidade entre blocos rivais, com ação económica, política e subversiva, mas sem guerra declarada (Scruton). Estrutura de soma nula: o ganho de um implica a perda do outro."}, {"k": "Modus vivendi", "v": "Arranjo prático que permite a duas partes em desacordo coexistirem. Kennan sustentava que, com a União Soviética, era impossível de forma permanente."}, {"k": "Contenção (<em>containment<\/em>)", "v": "Doutrina formulada por Kennan em 1947: bloquear pacientemente a expansão soviética sem procurar o confronto direto, na expectativa de que o regime se degrade internamente."}, {"k": "Cortina de ferro", "v": "Imagem popularizada por Churchill em Fulton, a 5 de março de 1946, de Stettin no Báltico a Trieste no Adriático. Expressão anterior a ele, usada nos anos vinte e por Goebbels em 1945."}, {"k": "Doutrina Truman", "v": "Compromisso americano, sem limite geográfico ou temporal, de apoiar povos livres que resistam à subjugação por minorias armadas ou pressões externas."}, {"k": "Plano Marshall", "v": "Programa de Recuperação Europeia, 13 mil milhões de dólares entre 1948 e 1952, por 16 países. Oferecido a toda a Europa para que a recusa soviética ficasse com o ónus da divisão."}, {"k": "Doutrina Jdanov", "v": "Teoria dos «dois campos» (setembro de 1947): o imperialista, liderado pelos EUA, e o anti-imperialista, liderado pela URSS. Abolição de qualquer via nacional ou neutralidade."}, {"k": "Kominform", "v": "Bureau de Informação dos Partidos Comunistas, sucessor do Comintern. Reuniu três vezes e foi dissolvido em 1956."}, {"k": "COMECON", "v": "Conselho de Assistência Económica Mútua (1949), resposta soviética ao Plano Marshall. Ao contrário deste, organizou sobretudo a extração de recursos dos satélites."}, {"k": "Artigo 5.º", "v": "Cláusula central do Tratado do Atlântico Norte: um ataque contra um membro é um ataque contra todos. Invocado uma única vez, a 12 de setembro de 2001."}, {"k": "Superpotência", "v": "Estado capaz de destruir qualquer outro independentemente do que este faça. A partir de 1949 há duas."}], "frases": ["«Não existe uma data de nascimento da Guerra Fria. O seu início foi um processo que começou com a vitória de 1945.»", "«Direta nos conflitos ideológicos, indireta nos meios e nos palcos geográficos.»", "«Tornou-se um modo de vida durante quatro décadas. Não era só um assunto diplomático: moldava modos de vida e opiniões.»", "«Narrativa de nós contra eles. Mundo bipolar, vozes organizadas por blocos.»", "«O ganho de um implica a perda do outro.»", "«A miséria é pior conselheira.» / «Democracia não existe quando não há paz social.»", "«Estaline tem a bomba atómica em 1949: uma nova superpotência.»", "«Para os Estados Unidos, Portugal era interessante por causa dos Açores.»"], "fontes": ["<strong>Kennan<\/strong>, Telegrama Longo: «a visão neurótica que o Kremlin tem dos assuntos mundiais»; «com os EUA não pode haver <em>modus vivendi<\/em> permanente»; e, no artigo «X», a «contenção de longo prazo, paciente mas firme e vigilante».", "<strong>Churchill<\/strong>, Fulton: «De Stettin, no Báltico, a Trieste, no Adriático, uma cortina de ferro desceu sobre o continente»; «Só Atenas»; «não acredito que a Rússia soviética deseje a guerra; o que desejam são os frutos da guerra».", "<strong>Truman<\/strong>: «apoiar os povos livres»; «as sementes dos regimes totalitários são alimentadas pela miséria e pela carência».", "<strong>Marshall<\/strong>: «não é dirigida contra nenhum país ou doutrina, mas contra a fome, a pobreza, o desespero e o caos»; «a iniciativa tem de vir da Europa».", "<strong>Gaddis<\/strong>: os pressupostos do Plano Marshall; «Estaline caiu na armadilha [...] construir o muro que dividiria a Europa»; a Guerra Fria «começou com um regresso do medo e acabou num triunfo da esperança».", "<strong>Judt<\/strong>: a recusa do Plano Marshall como «um dos maiores erros estratégicos de Estaline»; o golpe de Praga que «galvanizou os aliados ocidentais»; a divisão «enraizada na história».", "<strong>Best<\/strong>: as origens da Guerra Fria não foram «um jogo puramente soviético-americano»; a influência americana como resultado de iniciativas europeias.", "<strong>Scruton<\/strong>: a definição de Guerra Fria."], "perguntas": [{"q": "Explique o processo de institucionalização da Guerra Fria entre 1946 e 1949.", "guia": "Responder pelas duas colunas, mostrando o encadeamento de ação e reação. Do lado ocidental: Kennan, Fulton, Doutrina Truman, Plano Marshall, OECE, NATO, RFA. Do lado soviético: Jdanov, Kominform, golpe de Praga, COMECON, RDA, Pacto de Varsóvia. O essencial é demonstrar que cada peça de um lado provoca a peça correspondente do outro, e terminar em 1949 com a bomba soviética e a China de Mao."}, {"q": "Qual foi o significado político do Plano Marshall?", "guia": "Três níveis. Económico: 13 mil milhões, 16 países, recuperação rápida. Político: a citação de Gaddis sobre os pressupostos, ou seja, o combate à miséria como forma de combater o voto comunista. Estratégico: a oferta a toda a Europa como armadilha, com a recusa soviética a transferir para Moscovo o ónus da divisão, o episódio checoslovaco como prova, e a conclusão de Judt sobre o erro estratégico de Estaline."}, {"q": "Comente a afirmação de Churchill de que «uma cortina de ferro desceu sobre o continente».", "guia": "Contextualizar: quem era Churchill em março de 1946, onde e diante de quem falou, e que a expressão não era original. Analisar o que o discurso faz: nomear o projeto totalitário soviético e quebrar o tabu de criticar o aliado que derrotara Hitler, sem cair na demonização. Referir a receção fria nos Estados Unidos e a resposta violenta de Estaline no <em>Pravda<\/em>. Concluir com o lugar do discurso na sequência dos três discursos identificada por Gaddis."}, {"q": "Quem foi responsável pela Guerra Fria?", "guia": "Apresentar as três escolas: ortodoxa, revisionista e pós-revisionista, com o documento-base de cada uma das duas primeiras, o Telegrama Longo e o telegrama de Novikov. Explicar o dilema de segurança. Citar Judt sobre a divisão «enraizada na história» e Best sobre o papel ativo dos europeus. Não escolher culpado sem justificar a escolha."}, {"q": "Em que sentido a Guerra Fria foi «um modo de vida»?", "guia": "Partir da distinção do professor entre confronto direto no plano ideológico e indireto nos palcos geográficos. Desenvolver com os exemplos culturais: <em>1984<\/em> de Orwell e o macartismo como reações simétricas do medo; a corrida espacial de 1957 a 1969; o desporto como guerra por outros meios, de Fischer-Spassky a Lake Placid; a estatuária de Mukhina contra a Estátua da Liberdade. Concluir que a novidade foi a linha da frente passar pela vida quotidiana de gente que nunca pegou em armas."}], "biblio": ["Antony BEST <em>et al.<\/em>, caps. 9 («The First Cold War in Europe») e 11.", "John Lewis GADDIS, Introdução e cap. 1 («The Return of Fear»).", "Jean HEFFER e Michel LAUNAY, caps. 18 e 22.", "Tony JUDT, caps. 4 («The Impossible Settlement») e 5 («The Coming of the Cold War»).", "René RÉMOND, 4.ª parte, caps. 10 e 11."], "lecionado": "Lecionado na aula de 15 de setembro de 2026.", "autores": [{"nome": "George F. Kennan", "apelido": "Kennan", "tipos": ["documento", "ficha"], "n": 3}, {"nome": "Nikolai Novikov", "apelido": "Novikov", "tipos": ["documento"], "n": 1}, {"nome": "Martin McCauley", "apelido": "McCauley", "tipos": ["historiador"], "n": 1}, {"nome": "Roger Scruton", "apelido": "Scruton", "tipos": ["documento", "ficha"], "n": 1}, {"nome": "Winston Churchill", "apelido": "Churchill", "tipos": ["documento", "ficha"], "n": 2}, {"nome": "Josef Estaline", "apelido": "Estaline", "tipos": ["fonte"], "n": 1}, {"nome": "Harry S. Truman", "apelido": "Truman", "tipos": ["documento", "ficha"], "n": 2}, {"nome": "George C. Marshall", "apelido": "Marshall", "tipos": ["documento", "ficha"], "n": 2}, {"nome": "John Lewis Gaddis", "apelido": "Gaddis", "tipos": ["ficha", "historiador"], "n": 2}, {"nome": "Andrei Jdanov", "apelido": "Jdanov", "tipos": ["fonte"], "n": 1}, {"nome": "Tony Judt", "apelido": "Judt", "tipos": ["ficha", "historiador"], "n": 2}, {"nome": "Antony Best", "apelido": "Best", "tipos": ["ficha", "historiador"], "n": 1}], "anos": ["1945", "1946", "1947", "1948", "1949", "1950", "1955"]}, {"n": 3, "titulo": "A cidade dividida", "subtitulo": "A Europa Ocidental perante o comunismo: a divisão da Alemanha, o Muro de Berlim e os levantamentos antissoviéticos da Hungria e da Checoslováquia", "datas": "1945 — 1969", "epigrafe": {"texto": "«Berlim são os testículos do Ocidente. Sempre que quero fazer o Ocidente gritar, aperto Berlim.»", "autor": "Nikita Khrushchev"}, "seccoes": ["1. O teste de algodão", "2. Duas moedas, uma cidade", "3. Onze meses de aviões", "4. Duas Alemanhas, quarenta anos", "5. A vivência esquizofrénica", "6. Viena, junho de 1961", "7. A noite de 12 para 13 de agosto", "8. «Que venham a Berlim»", "9. Sete países, uma só mão", "10. Budapeste, outono de 1956", "11. Praga, agosto de 1968", "12. O outro 1968"], "citacoes": [{"tipo": "historiador", "paras": ["«O propósito de Estaline ao fazer o bloqueio a Berlim era forçar o Ocidente a escolher entre deixar a cidade, tirando partido da ausência de qualquer garantia escrita em Potsdam quanto ao acesso terrestre por parte dos aliados, e abandonar os seus planos de criar um Estado alemão ocidental separado. Mas, se isso era o que Estaline ambicionava, acabou por não realizar nenhum desses objetivos.»"], "fonte": "Tony Judt, <em>Pós-Guerra<\/em>, cap. 5", "seccao": "3. Onze meses de aviões"}, {"tipo": "historiador", "paras": ["«A crise de Berlim teve três resultados significativos. Em primeiro lugar, conduziu diretamente à criação de dois Estados alemães, um desfecho que nenhum dos aliados procurara quatro anos antes.»"], "fonte": "Tony Judt, <em>Pós-Guerra<\/em>, cap. 5", "seccao": "4. Duas Alemanhas, quarenta anos"}, {"tipo": "documento", "paras": ["«Unir a Alemanha enquanto a Europa está dividida, se fosse praticável, seria carregado de perigo para todos. Por isso todos — o Dr. Adenauer, os russos, os americanos, os franceses e nós próprios — sentimos no coração que uma Alemanha dividida é mais segura por agora. Mas nenhum de nós se atreve a dizê-lo abertamente por causa do efeito na opinião pública alemã. Por isso todos apoiamos publicamente uma Alemanha unida, cada um nos seus próprios termos.»"], "fonte": "Selwyn Lloyd, memorando, junho de 1953", "seccao": "4. Duas Alemanhas, quarenta anos"}, {"tipo": "documento", "paras": ["«A presença em Berlim de uma fronteira aberta e, para falar claro, descontrolada entre os mundos socialista e capitalista leva involuntariamente a população a fazer uma comparação entre as duas partes da cidade, que, infelizmente, nem sempre resulta a favor de Berlim Democrática.»"], "fonte": "Embaixador soviético na RDA, despacho para Moscovo, dezembro de 1959", "seccao": "5. A vivência esquizofrénica"}, {"tipo": "fonte", "paras": ["«A situação em Berlim complicou-se, não a nosso favor. Berlim Ocidental fortaleceu-se economicamente. Vê-se no facto de cerca de cinquenta mil trabalhadores de Berlim Leste irem trabalhar para Berlim Ocidental, porque lá os salários são mais altos. Porque não aumentamos os nossos salários? Antes de mais, não temos meios.»"], "fonte": "Walter Ulbricht a Nikita Khrushchev, novembro de 1960", "seccao": "5. A vivência esquizofrénica"}, {"tipo": "fonte", "paras": ["«A URSS assinará um tratado de paz, e a soberania da RDA será respeitada. Qualquer violação dessa soberania será considerada pela URSS um ato de agressão aberta contra um país amante da paz, com todas as consequências daí decorrentes.»"], "fonte": "Nikita Khrushchev a John F. Kennedy, Viena, junho de 1961", "seccao": "6. Viena, junho de 1961"}, {"tipo": "fonte", "paras": ["«Quem abater uma pessoa que quer ir da Alemanha para a Alemanha cometeu um assassínio. Ninguém pense que poderá alegar ter agido sob ordens quando um dia for chamado a prestar contas. Assassínio é assassínio, mesmo que tenha sido ordenado.»"], "fonte": "Willy Brandt, Berlim Ocidental, 1961", "seccao": "7. A noite de 12 para 13 de agosto"}, {"tipo": "fonte", "paras": ["«Não é uma solução muito bonita. Mas um muro é infinitamente melhor do que uma guerra.»"], "fonte": "John F. Kennedy, agosto de 1961", "seccao": "7. A noite de 12 para 13 de agosto"}, {"tipo": "historiador", "paras": ["«Num certo sentido, o Muro de Berlim simbolizou a aceitação do <em>status quo<\/em> na Europa por ambos os lados. Para o Ocidente, Berlim claramente não era causa adequada para ir à guerra. Para os soviéticos, a existência de Berlim Ocidental era aceitável desde que já não drenasse os melhores e mais brilhantes da RDA.»"], "fonte": "Antony Best <em>et al.<\/em>, <em>International History of the Twentieth Century and Beyond<\/em>", "seccao": "7. A noite de 12 para 13 de agosto"}, {"tipo": "documento", "paras": ["«Há muita gente no mundo que realmente não compreende, ou diz não compreender, qual é a grande questão entre o mundo livre e o mundo comunista. <strong>Que venham a Berlim.<\/strong>", "Há quem diga que o comunismo é a onda do futuro. <strong>Que venham a Berlim.<\/strong>", "E há quem diga, na Europa e noutros lugares, que podemos trabalhar com os comunistas. <strong>Que venham a Berlim.<\/strong>", "E há até alguns poucos que dizem que é verdade que o comunismo é um sistema mau, mas que nos permite fazer progresso económico. <strong>Que venham a Berlim.<\/strong>", "A liberdade tem muitas dificuldades, e a democracia não é perfeita. Mas nunca tivemos de erguer um muro para manter o nosso povo dentro, para o impedir de nos deixar.", "Todos os homens livres, onde quer que vivam, são cidadãos de Berlim. E por isso, enquanto homem livre, tenho orgulho nas palavras <em>Ich bin ein Berliner<\/em>.»"], "fonte": "John F. Kennedy, Rathaus Schöneberg, Berlim Ocidental, 26 de junho de 1963", "seccao": "8. «Que venham a Berlim»"}, {"tipo": "historiador", "paras": ["«A longo prazo, o valor simbólico mais significativo do muro não foi a estabilidade que parecia proporcionar, mas o modo como clarificou, para todos verem, as diferenças entre os dois sistemas políticos que separava. Enquanto as guerras de propaganda da Guerra Fria continuavam, o Ocidente nunca deixou de usar em seu proveito o facto de o Leste ter tido de construir um muro para manter o seu povo dentro. Nas décadas seguintes o Muro de Berlim tornou-se o símbolo da persistência da Guerra Fria, e a acusação última e irrespondível contra o comunismo.»"], "fonte": "Antony Best <em>et al.<\/em>, <em>International History of the Twentieth Century and Beyond<\/em>", "seccao": "8. «Que venham a Berlim»"}, {"tipo": "historiador", "paras": ["«O domínio crescente da União Soviética sobre a Europa de Leste pode ser visto de várias maneiras. Pode ter sido o resultado de um grande plano, um esquema diabólico para conquistar o mundo por etapas. Era isso, certamente, o que muitos observadores ocidentais defendiam na altura. Mas a política soviética pode também ser vista como parte de uma busca crónica de segurança, provocada pela experiência recente da guerra e da destruição.»"], "fonte": "Antony Best <em>et al.<\/em>, <em>International History of the Twentieth Century and Beyond<\/em>", "seccao": "9. Sete países, uma só mão"}, {"tipo": "documento", "paras": ["«Fala Imre Nagy, presidente do Conselho de Ministros da República Popular Húngara. Nas primeiras horas desta manhã, as tropas soviéticas lançaram um ataque contra a nossa capital com a intenção óbvia de derrubar o governo húngaro legal e democrático. As nossas tropas combatem. O Governo está no seu lugar. Informo disto o povo do país e a opinião pública mundial.»"], "fonte": "Imre Nagy, emissão da Rádio Kossuth, Budapeste, 4 de novembro de 1956", "seccao": "10. Budapeste, outono de 1956"}, {"tipo": "historiador", "paras": ["«Ao protestar contra as atividades soviéticas e ao abrir as portas aos refugiados húngaros, o Ocidente indicou, na prática, que a divisão da Europa era, na sua perspetiva, um estado de coisas <em>de facto<\/em>, que não devia ser posto em causa por meios militares. Enquanto a propaganda antissoviética e as várias medidas de guerra psicológica escalavam, os custos de qualquer intervenção direta dentro da esfera soviética eram simplesmente demasiado altos.»"], "fonte": "Antony Best <em>et al.<\/em>, <em>International History of the Twentieth Century and Beyond<\/em>", "seccao": "10. Budapeste, outono de 1956"}, {"tipo": "historiador", "paras": ["«A demolição do levantamento húngaro foi o momento vital que mostrou aos potenciais dissidentes que qualquer tentativa de derrubar o poder soviético era fútil. Qualquer ação dessas seria impiedosamente esmagada.»"], "fonte": "Ian Kershaw, <em>Continente Dividido<\/em>, cap. 3", "seccao": "10. Budapeste, outono de 1956"}, {"tipo": "documento", "paras": ["«Cada partido comunista é livre de aplicar os princípios do marxismo-leninismo e do socialismo no seu próprio país, mas não é livre de se desviar desses princípios se quiser continuar a ser um partido comunista. [...] O enfraquecimento de qualquer dos elos do sistema mundial do socialismo afeta diretamente todos os países socialistas, e estes não podem olhar para isso com indiferença.»"], "fonte": "Declaração de Bratislava, 3 de agosto de 1968, base da chamada Doutrina Brejnev", "seccao": "11. Praga, agosto de 1968"}, {"tipo": "historiador", "paras": ["«A ‘Doutrina Brejnev’, enunciada no momento da invasão da Checoslováquia em 1968, não fez mais do que recordar o que estava implícito: os países socialistas (que não a URSS, entenda-se) gozavam de uma soberania limitada; uma vez instalado num país, o socialismo tornava-se um facto irreversível. A definição daquilo que devia ser este socialismo cabia, como é evidente, aos dirigentes do Kremlin, os únicos e verdadeiros depositários do dogma marxista-leninista.»"], "fonte": "Jean Heffer e Michel Launay, <em>A Era das Superpotências, 1945-1973<\/em>", "seccao": "11. Praga, agosto de 1968"}, {"tipo": "fonte", "paras": ["«Os nossos tanques em Praga ‘dispararam’ contra ideias. Com um murro no queixo da sociedade pensante, eles achavam que tinham derrubado os seus processos de pensamento. [Em vez disso], despertaram novas camadas no seio da elite intelectual, que iriam repetir a tentativa com maior sucesso.»"], "fonte": "Len Karpinsky, jornalista e editor russo, dissidente do regime soviético (1929-1995)", "seccao": "11. Praga, agosto de 1968"}, {"tipo": "historiador", "paras": ["«A Primavera de Praga pôs fim a tais ilusões de uma vez por todas. A sua lição última foi que as liberdades liberais e a democracia eram incompatíveis com a existência do Estado comunista.»"], "fonte": "Ian Kershaw, <em>Continente Dividido<\/em>, cap. 6", "seccao": "11. Praga, agosto de 1968"}], "prof": [{"texto": "«Não há Europa sem Alemanha. Nada se faz sem a Alemanha na Europa. A Alemanha é demasiado grande para a Europa e demasiado pequena para o mundo. Qual será o destino da Alemanha? Este é o grande teste de algodão da força das potências.»", "quem": "J. M. Sardica, aula de 17 de setembro de 2026", "seccao": "1. O teste de algodão"}, {"texto": "«Era um status quo de paz podre, mas era melhor que a guerra armada.»", "quem": "J. M. Sardica, aula de 17 de setembro de 2026", "seccao": "7. A noite de 12 para 13 de agosto"}, {"texto": "«Estaline estava a construir uma <em>buffer zone<\/em>.»", "quem": "J. M. Sardica, aula de 22 de setembro de 2026", "seccao": "9. Sete países, uma só mão"}], "hoje": [{"rotulo": "De 1945 a ontem à tarde", "texto": "O território que foi a República Democrática Alemã é hoje, dentro da Alemanha reunificada, a região onde a extrema-direita tem maior votação. É um resultado aparentemente absurdo: os antigos cidadãos do Estado comunista votam no partido situado no extremo oposto do espectro. Mas o padrão repete-se por toda a Europa, Portugal e Espanha incluídos, e sugere que a variável decisiva não é a memória ideológica e sim o rendimento e a sensação de ter ficado para trás. A RDA era mais pobre do que a RFA em 1949 e continuou a sê-lo depois de 1990. O voto que nasce daí não é um voto por um programa: é um voto contra o sistema que fez a promessa e não a cumpriu.", "seccao": "4. Duas Alemanhas, quarenta anos"}], "cron": [{"k": "mai 1944 – abr 1949", "v": "<strong>Satelização<\/strong> da Europa de Leste: Albânia, Jugoslávia, Polónia, Bulgária, Roménia, Checoslováquia (golpe de fevereiro de 1948) e Hungria."}, {"k": "1945", "v": "Quadripartição da Alemanha e de Berlim. O acesso terrestre a Berlim não é acordado por escrito."}, {"k": "1 jan 1947", "v": "Entra em vigor a <strong>Bizona<\/strong> (zonas britânica e americana); mais tarde, Trizona."}, {"k": "20 jun 1948", "v": "Entrada em circulação do <strong>Deutsche Mark<\/strong> nas zonas ocidentais."}, {"k": "24 jun 1948 – 12 mai 1949", "v": "<strong>Bloqueio de Berlim<\/strong> e ponte aérea: cerca de 275 500 voos em onze meses."}, {"k": "23 mai 1949", "v": "Lei Fundamental: nasce a <strong>República Federal da Alemanha<\/strong>. Adenauer chanceler em setembro."}, {"k": "7 out 1949", "v": "Fundação da <strong>República Democrática Alemã<\/strong>, dirigida por Walter Ulbricht."}, {"k": "16-17 jun 1953", "v": "<strong>Volksaufstand<\/strong> de Berlim Leste: um milhão de pessoas, esmagadas pelos tanques soviéticos e pela Volkspolizei. Feriado na RFA até 1990."}, {"k": "mai 1955", "v": "A RFA entra na NATO; a 14 de maio nasce o <strong>Pacto de Varsóvia<\/strong>."}, {"k": "fev 1956", "v": "Relatório secreto de Khrushchev contra Estaline, no XX Congresso."}, {"k": "23 out – 4 nov 1956", "v": "<strong>Revolta de Budapeste.<\/strong> Nagy primeiro-ministro a 24 de outubro; neutralidade e saída do Pacto de Varsóvia a 1 de novembro; invasão a 4 de novembro. Nagy executado em junho de 1958."}, {"k": "27 nov 1958", "v": "Ultimato de Khrushchev sobre Berlim."}, {"k": "3-4 jun 1961", "v": "<strong>Cimeira de Viena<\/strong> entre Kennedy e Khrushchev."}, {"k": "13 ago 1961", "v": "<strong>Construção do Muro de Berlim<\/strong>, iniciada na madrugada de domingo."}, {"k": "out 1961", "v": "Confronto de tanques no Checkpoint Charlie."}, {"k": "17 ago 1962", "v": "Morte de Peter Fechter junto ao muro, filmada pela televisão ocidental."}, {"k": "26 jun 1963", "v": "Discurso de <strong>Kennedy<\/strong> em Berlim: «Ich bin ein Berliner»."}, {"k": "28 ago 1963", "v": "Marcha sobre Washington. «Tenho um sonho», de Martin Luther King: início da nova «Revolução Americana»."}, {"k": "out 1964", "v": "Queda de Khrushchev. <strong>Brejnev<\/strong> dirige o PCUS até 1982."}, {"k": "jan – ago 1968", "v": "<strong>Primavera de Praga.<\/strong> Dubček em janeiro; Programa de Ação a 5 de abril; fim da censura a 26 de junho."}, {"k": "abr – jun 1968", "v": "Assassínio de Martin Luther King (4 de abril) e de Robert Kennedy (5 de junho). <strong>Maio de 68<\/strong> em Paris: barricadas e greve geral de dez milhões."}, {"k": "3 ago 1968", "v": "Declaração de Bratislava: <strong>Doutrina Brejnev<\/strong>."}, {"k": "20-21 ago 1968", "v": "Invasão da Checoslováquia por cinco países do Pacto de Varsóvia."}, {"k": "16 jan 1969", "v": "Autoimolação de Jan Palach na Praça Venceslau."}, {"k": "ago 1969", "v": "Festival de Woodstock, expressão acabada da contracultura."}, {"k": "1969", "v": "Willy Brandt chanceler; início da <strong>Ostpolitik<\/strong>."}], "conceitos": [{"k": "Satelização", "v": "Termo do professor para a instalação de regimes comunistas dependentes de Moscovo em sete países da Europa de Leste entre 1944 e 1949. Não obedece a um modelo único: deposição de monarquias, eleições viciadas, coligações dissolvidas, golpe de Estado. Estaline construía uma <em>buffer zone<\/em>."}, {"k": "Volksaufstand", "v": "«Levantamento popular» de Berlim Leste, 16-17 de junho de 1953, contra as imposições laborais da sovietização. Primeira revolta de massas no bloco, primeira repressão por tanques."}, {"k": "Bizona", "v": "Fusão económica das zonas britânica e americana a 1 de janeiro de 1947, por necessidade de abastecimento. Primeiro passo prático para a divisão do país."}, {"k": "Ponte aérea", "v": "Abastecimento de Berlim Ocidental por via aérea durante o bloqueio. Escolhida por Clay porque os corredores aéreos estavam garantidos por escrito, o que transferia para Moscovo o ónus de disparar primeiro."}, {"k": "Barreira de proteção antifascista", "v": "Designação oficial do Muro de Berlim na RDA. Invertia a função real: apresentava como defesa contra o exterior aquilo que era uma prisão para o interior."}, {"k": "Doutrina Hallstein", "v": "Princípio da política externa de Adenauer: só a RFA representa a nação alemã, e Bona corta relações com quem reconhecer a RDA, com a exceção da URSS."}, {"k": "Ostpolitik", "v": "Política de aproximação ao leste, iniciada por Willy Brandt a partir de 1969. Nasce da constatação, feita em agosto de 1961, de que os aliados ocidentais não arriscariam nada para acabar com a divisão."}, {"k": "Socialismo com rosto humano", "v": "Fórmula corrente para o Programa de Ação checoslovaco de abril de 1968: manter o socialismo acrescentando-lhe liberdades e pluralismo."}, {"k": "Doutrina Brejnev", "v": "Também dita da soberania limitada. Enunciada em Bratislava a 3 de agosto de 1968: nenhum partido comunista é livre de se desviar dos princípios do socialismo, e os restantes têm o dever de intervir. Revogada por Gorbachev em 1989."}, {"k": "Comunismo de goulash", "v": "Pacto tácito de Kádár na Hungria depois de 1956: silêncio político em troca de mais bens de consumo do que no resto do bloco."}, {"k": "Normalização", "v": "Repressão sistemática na Checoslováquia depois de 1969: cerca de meio milhão de expulsões do partido e despromoções profissionais em massa."}], "frases": ["«Não há Europa sem Alemanha. Qual será o destino da Alemanha? É o grande teste de algodão da força das potências.»", "«A Alemanha é demasiado grande para a Europa e demasiado pequena para o mundo.»", "«Os dois concordam em enfraquecer a Alemanha, mas os dois querem os seus recursos. A divisão torna-se inevitável.»", "«Berlim era um <em>brain drain<\/em> do comunismo, uma <em>loophole<\/em> por onde as pessoas podiam fugir.»", "«Havia uma vivência quase esquizofrénica.»", "«Kennedy sabia que a única arma dele era a retórica.»", "«Era um status quo de paz podre, mas era melhor que a guerra armada.»", "«O muro foi feito pela RDA, mas os autores são os soviéticos.»", "«Estaline estava a construir uma <em>buffer zone<\/em>.» A satelização «não obedece a um modelo monolítico».", "Sobre Khrushchev: reconhece os traços tóxicos do «pai» e, «freudianamente falando», precisa de «matar o pai». Faz «uma abertura de porta lenta do comunismo».", "«A fraqueza de um país soviético alenta os outros a tentar sair.»", "«Não mataram Dubček para ele não se tornar um mártir.»", "«Os direitos não se dão, conquistam-se.» «O que unia os jovens era o sonho de serem livres.»"], "fontes": ["<strong>Judt<\/strong>, sobre o propósito de Estaline no bloqueio e o seu duplo fracasso; sobre os três resultados da crise de Berlim; sobre o espelho da esquerda ocidental que se estilhaçou em novembro de 1956.", "<strong>Best<\/strong>, sobre o muro como aceitação mútua do <em>status quo<\/em> e como «acusação última e irrespondível contra o comunismo».", "<strong>Kershaw<\/strong>, sobre quem ficou realmente emparedado; sobre a lição de 1956 para os dissidentes; sobre a incompatibilidade entre liberdades e Estado comunista revelada em 1968.", "<strong>Kennedy<\/strong>: «um muro é infinitamente melhor do que uma guerra»; «Que venham a Berlim»; «nunca tivemos de erguer um muro para manter o nosso povo dentro».", "<strong>Khrushchev<\/strong>: «Berlim são os testículos do Ocidente»; o muro como «coisa odiosa» e «a única opção que restava».", "<strong>Heffer e Launay<\/strong>, sobre a Doutrina Brejnev: «os países socialistas (que não a URSS, entenda-se) gozavam de uma soberania limitada».", "<strong>Karpinsky<\/strong>: «Os nossos tanques em Praga dispararam contra ideias.»", "<strong>Best<\/strong>, sobre 1956: a divisão da Europa como «um estado de coisas <em>de facto<\/em>, que não devia ser posto em causa por meios militares».", "<strong>Documentos<\/strong>: a emissão de rádio de Imre Nagy a 4 de novembro de 1956; a Declaração de Bratislava de 3 de agosto de 1968; o memorando de Selwyn Lloyd de 1953."], "perguntas": [{"q": "Explique como se chegou à divisão da Alemanha em dois Estados.", "guia": "Seguir a cadeia: quadripartição sem tratado de paz; reparações por zonas decididas em Potsdam; Bizona em 1947 por necessidade económica; Deutsche Mark em junho de 1948; bloqueio e ponte aérea; fundação da RFA em maio e da RDA em outubro de 1949. Sublinhar a contradição de fundo apontada pelo professor: acordo em enfraquecer, desacordo sobre quem fica com os recursos. Concluir com Judt: nenhum dos aliados procurara aquele desfecho quatro anos antes."}, {"q": "Porque é que o Muro de Berlim foi construído, e porque é que o Ocidente não reagiu?", "guia": "Causa: a hemorragia demográfica, com números, e a impossibilidade de a RDA competir por salários, documentada na queixa de Ulbricht. Contexto: o ultimato de 1958 e a Cimeira de Viena. Não reação: os compromissos americanos cobriam apenas os setores ocidentais, Kennedy dissera em privado que não podia manter Berlim Leste aberta, e a frase «um muro é infinitamente melhor do que uma guerra». Concluir com Best sobre a aceitação mútua do <em>status quo<\/em>."}, {"q": "Analise o discurso de Kennedy em Berlim como peça de comunicação política.", "guia": "Contexto: aquiescência americana ao muro e necessidade de tranquilizar Bona, segundo Judt. Encenação: altifalantes virados para leste, orador de costas para o muro. Estrutura: a invocação de <em>civis romanus sum<\/em>, a anáfora das quatro objeções com a mesma resposta, e o remate identitário. Tese: sem meios materiais, Kennedy converte a impotência em argumento moral. Fechar com Best sobre o valor simbólico de longo prazo do muro."}, {"q": "Compare os levantamentos da Hungria (1956) e da Checoslováquia (1968).", "guia": "Semelhanças: ambos nascem de dentro do partido comunista, ambos são esmagados por tanques, ambos contam com a passividade ocidental. Diferenças: Nagy rompe com o Pacto de Varsóvia e declara neutralidade, Dubček não; a Hungria teve resistência armada e cerca de 2700 mortos, a Checoslováquia teve resistência civil e cerca de 70; 1956 coincide com Suez, 1968 com o Vietname; de 1968 sai uma doutrina formal de soberania limitada. Consequência: depois de 1968 morre a ideia de reformar o sistema por dentro."}, {"q": "Como se processou a «satelização» da Europa de Leste e como a interpretam os historiadores?", "guia": "Enumerar os sete casos por ordem cronológica, de maio de 1944 a abril de 1949, mostrando a diversidade dos métodos e a unidade do resultado. Opor as duas teses que Best formula: plano de conquista por etapas ou busca crónica de segurança. Usar a expressão do professor, <em>buffer zone<\/em>, e o paralelo com a Doutrina Monroe. Fechar com a sequência das revoltas, 1953, 1956 e 1968, como prova de que as populações nunca tinham escolhido aquele regime."}, {"q": "O que foi a Doutrina Brejnev e que consequências teve?", "guia": "Definir a partir do texto de Bratislava e da formulação de Rémond. Explicar a inversão que opera: transforma a intervenção num dever coletivo. Consequências imediatas: normalização na Checoslováquia e congelamento político do bloco. Consequência de longo prazo: a sua revogação por Gorbachev, em 1989, é a condição que permite que os regimes do leste caiam sem intervenção soviética."}], "biblio": ["Antony BEST <em>et al.<\/em>, caps. 9 e 11 («From Cold War to Détente»).", "John Lewis GADDIS, caps. 2 a 4.", "Tony JUDT, caps. 5, 8 («A política de estabilidade»), 9 («Lost Illusions») e 13.", "Ian KERSHAW, <em>Continente Dividido<\/em>, caps. 1, 3 e 6.", "René RÉMOND, 4.ª parte, caps. 10 e 11.", "Jean HEFFER e Michel LAUNAY, <em>A Era das Superpotências, 1945-1973<\/em> (a Europa de Leste e a Doutrina Brejnev).", "Mark KURLANSKY, <em>1968. O Ano que Abalou o Mundo<\/em>."], "lecionado": "Lecionado nas aulas de 17 e 22 de setembro de 2026.", "autores": [{"nome": "Tony Judt", "apelido": "Judt", "tipos": ["ficha", "historiador"], "n": 2}, {"nome": "Walter Ulbricht a Nikita Khrushchev", "apelido": "Khrushchev", "tipos": ["ficha", "fonte"], "n": 1}, {"nome": "Willy Brandt", "apelido": "Brandt"
