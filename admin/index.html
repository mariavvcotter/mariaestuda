<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin · mariaestuda</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5EFE0; --teal:#4A9B8E; --teal-dark:#3a7d72; --amber:#F5A623;
    --text:#2C2C2C; --text-light:#6B6B6B; --card:#FDFAF4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text);padding:24px 16px 60px}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-family:'Fredoka One',cursive;color:var(--teal);font-size:2rem;margin-bottom:2px}
  .sub{color:var(--text-light);font-weight:600;margin-bottom:24px}

  /* ----- gate ----- */
  .gate{max-width:360px;margin:60px auto;background:var(--card);border-radius:22px;padding:32px 28px;box-shadow:0 12px 40px rgba(0,0,0,.12);text-align:center}
  .gate h2{font-family:'Fredoka One',cursive;color:var(--teal);margin-bottom:6px}
  .gate p{color:var(--text-light);font-weight:600;font-size:.9rem;margin-bottom:20px}
  .gate input{width:100%;padding:13px 14px;border:1.5px solid #e3ddcd;border-radius:12px;font-size:1rem;font-family:inherit;background:#fff;margin-bottom:12px}
  .gate input:focus{outline:none;border-color:var(--teal)}
  .gate button{width:100%;border:none;cursor:pointer;background:var(--teal);color:#fff;font-weight:800;font-size:1rem;padding:13px;border-radius:12px}
  .gate button:hover{background:var(--teal-dark)}
  .gate .err{color:#d23f3f;font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}

  .hidden{display:none}

  /* ----- stat cards ----- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px}
  .stat{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.06);position:relative;overflow:hidden}
  .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--teal),var(--amber))}
  .stat .n{font-family:'Fredoka One',cursive;font-size:2.2rem;color:var(--teal);line-height:1}
  .stat .l{font-weight:700;color:var(--text-light);font-size:.85rem;margin-top:6px}

  .card{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.06);margin-bottom:24px}
  .card h3{font-family:'Fredoka One',cursive;color:var(--teal);font-size:1.25rem;margin-bottom:18px}

  /* ----- ranking bars ----- */
  .bar-row{margin-bottom:14px}
  .bar-top{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem;margin-bottom:5px}
  .bar-top .cnt{color:var(--teal-dark)}
  .bar-track{background:#ece5d4;border-radius:8px;height:14px;overflow:hidden}
  .bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--teal),var(--amber));min-width:2px;transition:width .5s}

  /* ----- daily chart ----- */
  .days{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:8px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .day .col{width:100%;background:var(--teal);border-radius:6px 6px 0 0;min-height:2px}
  .day .dl{font-size:.65rem;color:var(--text-light);font-weight:700;white-space:nowrap}
  .day .dv{font-size:.7rem;font-weight:800;color:var(--teal-dark)}

  /* ----- recent ----- */
  .feed{list-style:none}
  .feed li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #e3ddcd;font-size:.9rem;font-weight:600}
  .feed li:last-child{border-bottom:none}
  .feed .who{color:var(--text-light)}
  .feed .when{color:#aaa;font-size:.8rem;white-space:nowrap}
  .badge{display:inline-block;background:rgba(74,155,142,.14);color:var(--teal-dark);font-weight:800;font-size:.78rem;padding:2px 9px;border-radius:20px}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .lock{background:none;border:1.5px solid #d8d0bd;color:var(--text-light);border-radius:20px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:inherit}
  .lock:hover{border-color:var(--teal);color:var(--teal)}
  .note{background:#fff6e6;border:1.5px solid #f3d79a;border-radius:14px;padding:16px 18px;font-weight:600;font-size:.9rem;color:#8a6d1f;line-height:1.5}
  .note code{background:#fff;padding:1px 6px;border-radius:5px;font-size:.82rem}
  .loading{text-align:center;color:var(--text-light);font-weight:700;padding:40px}
</style>
</head>
<body>

<!-- ===== GATE ===== -->
<div class="gate" id="gate">
  <h2>🔒 Área reservada</h2>
  <p>Painel de utilização do mariaestuda</p>
  <form id="gate-form">
    <div class="err" id="gate-err"></div>
    <input type="password" id="gate-pw" placeholder="Palavra-passe" autocomplete="current-password" autofocus>
    <button type="submit">Entrar</button>
  </form>
</div>

<!-- ===== DASHBOARD ===== -->
<div class="wrap hidden" id="dash">
  <div class="topbar">
    <div>
      <h1>📊 Utilização</h1>
      <div class="sub" id="sub">A carregar…</div>
    </div>
    <button class="lock" id="lock-btn">🔒 Bloquear</button>
  </div>

  <div id="content"><div class="loading">A carregar dados…</div></div>
</div>

<script src="/account/config.js"></script>
<script>
/* ============================================================
   Admin · mariaestuda — só leitura de estatísticas de utilização
   Gate por password (hash SHA-256, client-side: obfuscação, não
   é segurança real). Para mudar a password, gera um novo hash:
     SHA-256 da nova password → coloca em ADMIN_HASH abaixo.
   Em consola:  crypto.subtle.digest('SHA-256', new TextEncoder()
     .encode('NOVA')).then(b=>console.log([...new Uint8Array(b)]
     .map(x=>x.toString(16).padStart(2,'0')).join('')))
   Password por defeito: "mariaestuda-admin" (MUDA-A).
   ============================================================ */
const ADMIN_HASH = 'a380ff3e8f2fe4bf43df05d7a8efa885df4575d63dd79525e18104d3b188fa51';

const CFG = window.MARIAESTUDA_CONFIG || {};
const URL = (CFG.SUPABASE_URL || '').replace(/\/+$/, '');
const KEY = CFG.SUPABASE_ANON_KEY || '';
const HEADERS = { apikey: KEY, Authorization: 'Bearer ' + KEY };

const SECTIONS = {
  edc:'EDC · Ética e Deontologia', ci:'Comunicação Interpessoal',
  hgp1:'HGP · 1383–1385', eco:'Economia', eng:'Inglês',
  pt1:'Português · GP Gramática', rp:'Relações Públicas',
  tc:'Teorias dos Media', uplayback:'uPlayback'
};

/* ---------- gate ---------- */
async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
const gate = document.getElementById('gate');
const dash = document.getElementById('dash');
document.getElementById('gate-form').addEventListener('submit', async e=>{
  e.preventDefault();
  const err = document.getElementById('gate-err');
  const h = await sha256(document.getElementById('gate-pw').value);
  if (h === ADMIN_HASH){
    sessionStorage.setItem('me_admin_ok','1');
    unlock();
  } else { err.textContent = 'Palavra-passe incorreta.'; }
});
document.getElementById('lock-btn').addEventListener('click', ()=>{
  sessionStorage.removeItem('me_admin_ok');
  location.reload();
});
function unlock(){ gate.classList.add('hidden'); dash.classList.remove('hidden'); load(); }
if (sessionStorage.getItem('me_admin_ok') === '1') unlock();

/* ---------- data ---------- */
const EP = URL + '/rest/v1/usage_events';

// contagem exata via Content-Range (Prefer: count=exact)
async function countExact(qs){
  const r = await fetch(EP + '?select=id' + (qs?'&'+qs:''), {
    headers: Object.assign({ Prefer:'count=exact', Range:'0-0' }, HEADERS)
  });
  if (!r.ok) throw new Error('http ' + r.status);
  const cr = r.headers.get('content-range') || '*/0';
  return parseInt(cr.split('/')[1], 10) || 0;
}
function iso(d){ return d.toISOString(); }

async function load(){
  const content = document.getElementById('content');
  try {
    const now = new Date();
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const start7 = new Date(startToday); start7.setDate(start7.getDate()-6);

    // headline + por secção (contagens exatas, em paralelo)
    const secKeys = Object.keys(SECTIONS);
    const [total, today, last7, ...secCounts] = await Promise.all([
      countExact(''),
      countExact('created_at=gte.' + iso(startToday)),
      countExact('created_at=gte.' + iso(start7)),
      ...secKeys.map(s => countExact('section=eq.' + encodeURIComponent(s)))
    ]);

    // eventos recentes (para feed + gráfico diário + utilizadores)
    const rr = await fetch(EP + '?select=section,user_name,created_at&order=created_at.desc&limit=1000', { headers: HEADERS });
    const recent = rr.ok ? await rr.json() : [];

    render({ total, today, last7, secKeys, secCounts, recent, startToday });
  } catch (e){
    content.innerHTML = '<div class="note">⚠ Não consegui ler os dados. Provavelmente a tabela <code>usage_events</code> ainda não existe no Supabase. Corre o SQL que te dei no painel Supabase → SQL Editor e recarrega.</div>';
  }
}

function timeAgo(d){
  const s = Math.floor((Date.now() - new Date(d).getTime())/1000);
  if (s < 60) return 'agora';
  if (s < 3600) return Math.floor(s/60)+' min';
  if (s < 86400) return Math.floor(s/3600)+' h';
  return Math.floor(s/86400)+' d';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(d){
  const uniqUsers = new Set(d.recent.map(r=>r.user_name).filter(Boolean)).size;

  // ranking
  const ranked = d.secKeys.map((s,i)=>({ s, n:d.secCounts[i] })).sort((a,b)=>b.n-a.n);
  const max = Math.max(1, ...ranked.map(r=>r.n));
  const rankHtml = ranked.map(r=>`
    <div class="bar-row">
      <div class="bar-top"><span>${esc(SECTIONS[r.s]||r.s)}</span><span class="cnt">${r.n}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.n/max*100)}%"></div></div>
    </div>`).join('');

  // gráfico diário (14 dias, a partir dos recentes)
  const days = [];
  for (let i=13;i>=0;i--){ const dt=new Date(d.startToday); dt.setDate(dt.getDate()-i); days.push({dt,key:dt.toDateString(),n:0}); }
  const dayMap = {}; days.forEach(x=>dayMap[x.key]=x);
  d.recent.forEach(r=>{ const k=new Date(r.created_at).toDateString(); if(dayMap[k]) dayMap[k].n++; });
  const dmax = Math.max(1, ...days.map(x=>x.n));
  const wd = ['D','S','T','Q','Q','S','S'];
  const daysHtml = days.map(x=>`
    <div class="day" title="${x.dt.toLocaleDateString('pt-PT')}: ${x.n}">
      <span class="dv">${x.n||''}</span>
      <div class="col" style="height:${Math.round(x.n/dmax*100)}%"></div>
      <span class="dl">${x.dt.getDate()}/${x.dt.getMonth()+1}</span>
    </div>`).join('');

  // feed recente
  const feedHtml = d.recent.slice(0,30).map(r=>`
    <li>
      <span><span class="badge">${esc(SECTIONS[r.section]||r.section)}</span> <span class="who">${r.user_name?('· '+esc(r.user_name)):'· convidado'}</span></span>
      <span class="when">${timeAgo(r.created_at)}</span>
    </li>`).join('') || '<li><span class="who">Ainda sem visitas registadas.</span></li>';

  document.getElementById('sub').textContent =
    'Atualizado ' + new Date().toLocaleString('pt-PT') + (d.recent.length>=1000 ? ' · feed limitado às 1000 visitas mais recentes' : '');

  document.getElementById('content').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="n">${d.total}</div><div class="l">Visitas totais</div></div>
      <div class="stat"><div class="n">${d.today}</div><div class="l">Hoje</div></div>
      <div class="stat"><div class="n">${d.last7}</div><div class="l">Últimos 7 dias</div></div>
      <div class="stat"><div class="n">${uniqUsers}</div><div class="l">Utilizadores (recentes)</div></div>
    </div>
    <div class="card"><h3>🏆 Secções mais usadas</h3>${rankHtml}</div>
    <div class="card"><h3>📅 Visitas por dia (14 dias)</h3><div class="days">${daysHtml}</div></div>
    <div class="card"><h3>🕒 Atividade recente</h3><ul class="feed">${feedHtml}</ul></div>
  `;
}
</script>
</body>
</html>
