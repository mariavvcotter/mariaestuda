<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFE · Plataforma de Estudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/account/account.css">
<style>
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eef1f7; --surface-3:#e4e9f3; --text:#1b2234; --muted:#5d6980; --line:#e1e6ef;
  --accent:#2f5fd6; --accent-soft:#e6edfd; --accent-ink:#1d3f98;
  --ok:#188a5c; --ok-soft:#dff5ea; --bad:#d13c3c; --bad-soft:#fde6e6; --warn:#c98a00; --warn-soft:#fff3d1;
  --c1:#2f5fd6; --c2:#e4603f; --c3:#1aa078; --c4:#8a5bd6; --c5:#d9a400; --c6:#1f9fc4;
  --u1:#2f5fd6; --u2:#1aa078; --u3:#e4603f; --u4:#8a5bd6; --u5:#1f9fc4; --u6:#d9a400; --u7:#d6498a; --u8:#5a6bcf; --u9:#e07a2f; --u10:#2a9d8f;
  --radius:16px; --radius-s:10px;
  --shadow:0 1px 2px rgba(20,30,60,.04),0 6px 20px rgba(20,30,60,.06);
  --shadow-lg:0 10px 36px rgba(20,30,60,.12);
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1c2230; --surface:#252d3d; --surface-2:#2d3648; --surface-3:#36405399; --text:#e9edf5; --muted:#a4aec3; --line:#3a4457;
  --accent:#7ea2ff; --accent-soft:#2b3a60; --accent-ink:#c9d7ff;
  --ok:#4fc98f; --ok-soft:#1f3b30; --bad:#f07a7a; --bad-soft:#4a2626; --warn:#f0c04a; --warn-soft:#4a3d1a;
  --c1:#7ea2ff; --c2:#ff8f6e; --c3:#4fd0a0; --c4:#b48cff; --c5:#ffd04a; --c6:#5cc8ea;
  --shadow:none; --shadow-lg:0 10px 36px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.2}
h1{font-size:34px;margin:0 0 8px}
h2{font-size:23px;margin:34px 0 12px}
h3{font-size:18px;margin:26px 0 8px}
.lead{color:var(--muted);margin:0 0 22px;font-size:16px;max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:13px}

/* layout */
.app{display:grid;grid-template-columns:292px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px 28px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
main{padding:30px clamp(18px,4vw,56px) 90px;max-width:1040px;width:100%}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c4));display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:17px;flex:none}
.brand .t{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.2}
.brand .s{color:var(--muted);font-size:12.5px}
.nav button{display:flex;width:100%;align-items:center;gap:11px;background:none;border:0;padding:9px 11px;border-radius:10px;text-align:left;font-weight:500;color:var(--text)}
.nav button svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav button:hover{background:var(--surface-2)}
.nav button.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav button.active svg{color:var(--accent)}
.nav-sep{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 11px 6px;font-weight:600}
.unit-link{font-size:13.5px;padding:7px 11px!important}
.unit-link .num{flex:0 0 26px;height:26px;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.unit-link .bar{height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.unit-link .bar i{display:block;height:100%;background:var(--ok)}
.unit-link .lbl{flex:1;min-width:0}
.unit-link .lbl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{margin-top:auto;padding:14px 8px 0;display:flex;gap:8px;align-items:center}
.theme-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.theme-btn svg{width:15px;height:15px}
.side-foot{flex-wrap:wrap}
.side-foot .acc-chip{font-size:13px}
.side-foot .acc-btn{font-size:13px;padding:6px 12px}
.side-foot .acc-user{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.menu-btn{display:none}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}

/* cards & buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:16px 18px}
.stat .v{font-size:28px;font-weight:700;font-family:var(--serif);line-height:1.1}
.stat .k{color:var(--muted);font-size:13px;margin-top:4px}
.units{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.ucard{cursor:pointer;display:flex;flex-direction:column;gap:9px;text-align:left;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.ucard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--uc)}
.ucard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.ucard .t{font-weight:600;line-height:1.35;font-size:15.5px}
.ucard .m{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.meter{height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:4px}
.meter.acc i{background:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn svg,.chip svg{width:17px;height:17px;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:13.5px;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 10px;letter-spacing:.02em}
.tag.unit{color:#fff;background:var(--uc)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;user-select:none}
.chip input{margin:0;accent-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
.kbd{font-size:12.5px;color:var(--muted)}

/* unit page */
.uhero{border-radius:var(--radius);padding:26px 28px;color:#fff;background:linear-gradient(120deg,var(--uc),color-mix(in srgb,var(--uc) 65%,#1b2234));box-shadow:var(--shadow);position:relative;overflow:hidden}
.uhero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.uhero .tag{background:rgba(255,255,255,.22);color:#fff}
.uhero h1{color:#fff;margin:10px 0 6px;font-size:30px}
.uhero .lead{color:rgba(255,255,255,.85);margin:0 0 16px}
.uhero .btn.ghost{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.uhero .btn{background:#fff;color:var(--uc)}
.uhero .meter{background:rgba(255,255,255,.25)}
.uhero .meter i{background:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--accent-ink);border-color:var(--accent)}
.tabs button .n{font-size:11.5px;background:var(--surface-2);border-radius:999px;padding:1px 7px;margin-left:6px;color:var(--muted)}

.section{margin:12px 0;padding:0!important;overflow:hidden}
.section > summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:15px 20px}
.section > summary::-webkit-details-marker{display:none}
.section > summary .sid{font-weight:700;color:var(--uc);min-width:44px;font-size:13px}
.section > summary .st{flex:1;font-weight:600}
.section > summary .done{font-size:12px;color:var(--ok);font-weight:600;background:var(--ok-soft);padding:2px 9px;border-radius:999px}
.section > summary .chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.section[open] > summary{border-bottom:1px solid var(--line)}
.section[open] > summary .chev{transform:rotate(90deg)}
.section .body{padding:8px 24px 22px}
.content h4{font-size:15.5px;margin:22px 0 6px;padding-left:12px;border-left:3px solid var(--uc,var(--accent));font-family:var(--sans)}
.content p{margin:8px 0}
.content ul,.content ol{padding-left:22px;margin:8px 0}
.content li{margin:4px 0}
.content li::marker{color:var(--uc,var(--accent))}
.content table{border-collapse:collapse;margin:12px 0;font-size:13.5px;display:block;overflow-x:auto;max-width:100%}
.content th,.content td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
.content th{background:var(--surface-2);font-weight:600}
.content tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.content strong{color:var(--accent-ink)}
.terms{margin-top:20px;border-top:1px dashed var(--line);padding-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.terms .kbd{grid-column:1/-1;font-weight:700;letter-spacing:.08em;font-size:11.5px}
.term{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.term dt{font-weight:700;font-size:14px}
.term dd{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.src{font-size:12px;color:var(--muted)}

/* overview */
.ov .intro{font-size:17px;line-height:1.65;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--uc);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow)}
.ov h2{display:flex;align-items:center;gap:10px}
.ov h2 .step{width:30px;height:30px;border-radius:9px;background:var(--uc);color:#fff;display:grid;place-items:center;font-size:14px;font-family:var(--sans);font-weight:700;flex:none}
.ov p{max-width:78ch}
.ov ul{padding-left:22px}
.ov li{margin:5px 0}
.ov li::marker{color:var(--uc)}
.ov .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin:14px 0;box-shadow:var(--shadow)}
.ov .box h3{margin-top:4px}
.ov .note{background:var(--warn-soft);border-radius:12px;padding:12px 16px;margin:12px 0;font-size:14.5px}
.ov .note b{color:var(--warn)}
.fig{margin:18px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 12px;box-shadow:var(--shadow)}
.fig figcaption{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.fig figcaption b{color:var(--text)}
.fig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:18px 0}
.fig-grid .fig{margin:0}
.chart{width:100%;height:auto;display:block;font-family:var(--sans);font-size:12px;max-width:560px;margin:0 auto}
.chart text{fill:var(--text)}
.chart .mut{fill:var(--muted)}
.chart .lbl{font-weight:600}
.chart .ax{stroke:var(--text);stroke-width:1.3;fill:none}
.chart .cv{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .thin{stroke-width:1.6}
.chart .dash{stroke-dasharray:7 5}
.chart .guide{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1;fill:none}
.chart .pt{fill:var(--surface);stroke-width:2.4}
.chart .c1{stroke:var(--c1)}.chart .c2{stroke:var(--c2)}.chart .c3{stroke:var(--c3)}.chart .c4{stroke:var(--c4)}.chart .c5{stroke:var(--c5)}.chart .c6{stroke:var(--c6)}.chart .ck{stroke:var(--text)}.chart .cm{stroke:var(--muted)}
.chart .f1{fill:var(--c1)}.chart .f2{fill:var(--c2)}.chart .f3{fill:var(--c3)}.chart .f4{fill:var(--c4)}.chart .f5{fill:var(--c5)}.chart .f6{fill:var(--c6)}.chart .fk{fill:var(--text)}.chart .fm{fill:var(--muted)}
.chart .t1{fill:var(--c1)}.chart .t2{fill:var(--c2)}.chart .t3{fill:var(--c3)}.chart .t4{fill:var(--c4)}.chart .t5{fill:var(--c5)}.chart .t6{fill:var(--c6)}
.chart .box{fill:var(--surface-2);stroke:var(--line);stroke-width:1.2}
.chart .box.b1{fill:color-mix(in srgb,var(--c1) 16%,var(--surface));stroke:var(--c1)}
.chart .box.b2{fill:color-mix(in srgb,var(--c2) 16%,var(--surface));stroke:var(--c2)}
.chart .box.b3{fill:color-mix(in srgb,var(--c3) 16%,var(--surface));stroke:var(--c3)}
.chart .box.b4{fill:color-mix(in srgb,var(--c4) 16%,var(--surface));stroke:var(--c4)}
.chart .box.b5{fill:color-mix(in srgb,var(--c5) 18%,var(--surface));stroke:var(--c5)}
.chart .box.b6{fill:color-mix(in srgb,var(--c6) 16%,var(--surface));stroke:var(--c6)}
.chart .box.bk{fill:var(--text);stroke:var(--text)}
.chart .box.bk + text{fill:var(--surface)}
.chart .arrow{fill:none;stroke-width:1.8}
.chart .bar{rx:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:4px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.formulas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:14px 0}
.formula{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.formula .fx{font-family:"Cambria Math","STIX Two Math",Cambria,Georgia,serif;font-size:16.5px;color:var(--accent-ink);margin-bottom:4px}
.formula .fd{font-size:13px;color:var(--muted);line-height:1.5}
.traps li{margin:8px 0}
.traps b{color:var(--bad)}
.map{display:grid;gap:8px;margin:12px 0}
.map .mi{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.map .mi:hover{border-color:var(--uc)}
.map .mi .sid{font-weight:700;color:var(--uc);min-width:52px;font-size:13px;padding-top:2px}
.map .mi .st{flex:1;font-weight:500}
.map .mi .st small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.cmp > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.cmp h4{margin:0 0 6px;font-size:14px;color:var(--accent-ink)}
.cmp ul{margin:0;padding-left:18px;font-size:14px}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0}
.steps li{position:relative;padding-left:40px;margin:10px 0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--uc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}

/* quiz */
.progress-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;font-size:13.5px;color:var(--muted)}
.progress-top .meter{flex:1}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:8px 0 18px;font-family:var(--serif)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:0 0 28px;height:28px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.expl{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--surface-2);border-left:4px solid var(--accent);line-height:1.55}
.expl.ok{border-color:var(--ok);background:var(--ok-soft)}
.expl.no{border-color:var(--bad);background:var(--bad-soft)}
.field{margin:14px 0}
.field label{display:block;font-weight:600;margin-bottom:8px;font-size:14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.result-big{font-size:58px;font-weight:700;font-family:var(--serif);line-height:1}
.ring{width:150px;height:150px;margin:0 auto 8px}
.review-item{padding:12px 0;border-top:1px solid var(--line)}
.review-item:first-child{border-top:0}
.search-hit{padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.search-hit:first-child{border-top:0}
.search-hit:hover .st{color:var(--accent)}
.search-hit .st{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
input[type=search],input[type=text]{font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;width:100%}
input[type=search]:focus{outline:2px solid var(--accent);border-color:transparent}
.empty{color:var(--muted);text-align:center;padding:26px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--surface-3)}
.heat i.l1{background:color-mix(in srgb,var(--ok) 35%,var(--surface-3))}
.heat i.l2{background:color-mix(in srgb,var(--ok) 65%,var(--surface-3))}
.heat i.l3{background:var(--ok)}
.continue{display:flex;align-items:center;gap:16px;cursor:pointer}
.continue .ico{width:46px;height:46px;border-radius:12px;background:var(--uc);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.continue:hover{border-color:var(--uc)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:290px;transform:translateX(-100%);transition:transform .22s;z-index:40;box-shadow:var(--shadow-lg)}
  aside.open{transform:none}
  .btn.menu-btn{display:inline-flex}
  main{padding:18px 16px 80px}
  h1{font-size:28px}
  .cmp{grid-template-columns:1fr}
}
@media print{aside,.menu-btn,.tabs{display:none}.app{display:block}}

<script>
const DATA = {"units":[{"n":1,"title":"A Economia como uma ciência e o problema económico","short":"Problema económico","sections":[{"id":"1.1","title":"A presença da Economia na evolução da Humanidade","pages":[5,10],"summary":"<p>Nota do professor: <em>as projeções não têm tudo o que é lecionado nas aulas; a presença e os apontamentos das aulas são importantes.</em></p><p>Esta secção foca aspetos muito básicos da vivência humana que, de forma explícita ou implícita, estão presentes na análise económica e são bases da sua fundamentação. Ilustração: cena agrícola do túmulo de Sennedjem (c. 1200 a.C.) — a atividade económica (produzir, colher) existe desde sempre.</p><h4>1. Viver! Continuar a viver! … eternamente!</h4><ul><li>Cada um de nós é o elo mais recente de um processo de transmissão de vida iniciado há milhares de milhões de anos, nunca interrompido (ideia de Jostein Gaarder, <em>Maya</em>).</li><li>Precisamos de comer, vestir, ter abrigo e tudo o que é necessário para viver, <strong>agora e no futuro</strong> — o nosso futuro individual e enquanto espécie.</li><li><strong>Queremos continuar a viver e, enquanto espécie, viver eternamente</strong>: ponto de partida da vivência a todos os níveis, incluindo o económico; «dele tudo decorre» (cf. António Damásio, <em>A estranha ordem das coisas</em>).</li></ul><h4>2. Viver é utilizar recursos… e de forma eficiente</h4><ul><li>Para ter comida, vestuário, abrigo, etc. são necessários <strong>recursos</strong>. Mais recursos = maiores hipóteses de sucesso e sobrevivência.</li><li><strong>Ser eficiente é conseguir mais com os mesmos recursos</strong>; os processos de otimização têm a ver com a utilização dos recursos da forma mais eficiente.</li><li>A eficiência, como referência comportamental e objetivo prosseguido de forma consciente, está presente em toda a análise económica.</li></ul><h4>3. Do indivíduo à sociedade</h4><ul><li>Os indivíduos não vivem isolados; integram famílias (ou grupos com funções semelhantes) e organizações, nomeadamente <strong>empresas</strong> (organizações que produzem bens finais e recursos), e, direta ou indiretamente, a sociedade.</li><li><strong>Unidades consideradas na análise económica:</strong> indivíduos, famílias, empresas (ou outras organizações) e a sociedade como um todo.</li></ul><h4>4. Viver é interagir, cooperando e competindo</h4><ul><li>Há ações <strong>cooperativas intra-grupo</strong> (ex.: numa empresa para se produzir mais) e <strong>competitivas inter-grupo</strong> (ex.: entre empresas para sobreviver no mercado); também há competição dentro dos grupos e cooperação entre grupos.</li><li>Darwin conhecia os trabalhos de Adam Smith sobre competição e interesse próprio como motor do crescimento.</li><li>Interações cooperativas (esforços unidos em benefício dos cooperantes) e competitivas estão sempre presentes. Há <strong>estratégias de produção</strong> e <strong>estratégias de repartição da produção</strong>.</li></ul><h4>5. Viver é também refletir sobre a vida — a perspetiva de análise</h4><ul><li>Qualquer análise tem uma perspetiva: indivíduo, família, empresa, sociedade, cada uma com objetivos diferentes.</li><li>O indivíduo é a unidade de análise mais reduzida (muitas vezes o ponto de partida); a empresa é central na gestão.</li><li><strong>Em Economia está fundamentalmente em causa a perspetiva da sociedade como um todo</strong>: o elemento integrador é alcançar o que é considerado melhor para a sociedade. É esta perspetiva que dá coerência à disciplina.</li></ul>","keyTerms":[{"term":"Eficiência","def":"Conseguir mais com os mesmos recursos (ou o mesmo com menos recursos); referência comportamental presente em toda a análise económica."},{"term":"Unidades de análise económica","def":"Indivíduos, famílias, empresas (ou outras organizações) e a sociedade como um todo."},{"term":"Perspetiva da sociedade","def":"Perspetiva fundamental da Economia: o elemento integrador é alcançar o que é melhor para a sociedade como um todo."},{"term":"Estratégias de produção e de repartição","def":"Formas de interação (cooperativa e competitiva) dos agentes, relativas a produzir e a repartir a produção."}],"questions":[{"q":"Segundo os slides, qual é a perspetiva de análise que dá coerência à disciplina de Economia?","options":["A perspetiva do indivíduo, por ser a unidade de análise mais reduzida","A perspetiva da empresa, por ser central na gestão","A perspetiva da sociedade como um todo","A perspetiva da família, por ser a base da vida em sociedade"],"answer":2,"explanation":"Em Economia está fundamentalmente em causa a perspetiva da sociedade como um todo; o indivíduo é o ponto de partida (unidade mais reduzida) e a empresa é central na gestão, mas o elemento integrador é o que é melhor para a sociedade.","id":"q1qmtw9b"}],"key":"u1-1.1"},{"id":"1.2","title":"Conceito de Economia e Ciência Económica","pages":[10,15],"summary":"<h4>Conceito preliminar de economia</h4><p><strong>Objeto:</strong> a economia é frequentemente associada às atividades de <strong>produção</strong>, <strong>distribuição</strong> e <strong>consumo</strong> de bens e às <strong>decisões</strong> associadas — implicitamente também a <strong>quem</strong> decide e aos objetivos por detrás dessas decisões.</p><p><strong>Perspetiva:</strong> a economia é principalmente uma <strong>perspetiva de análise</strong>. A economia estuda factos; os mesmos factos são estudados por outras perspetivas. O âmbito vai das coisas mais simples da vida pessoal às mais complexas da vida em sociedade (alimentação, vestuário, informação, até relações). O essencial da vida (pessoal, familiar, social) pode ser objeto de análise económica.</p><h4>Origens</h4><ul><li><strong>Desde os primórdios:</strong> a atividade económica (decisões sobre produção, distribuição e consumo) e a economia enquanto perspetiva de análise (necessidade de efetuar escolhas) sempre estiveram presentes na história.</li><li><strong>Adam Smith é o pai da moderna análise económica</strong>: «Ensaio sobre a natureza e a causa da riqueza das nações» (1776). Destaca o <strong>mecanismo de troca</strong>, que: (i) permite que indivíduos e famílias não consumam apenas o que produzem; (ii) aumenta a riqueza e o bem-estar porque cada agente se pode centrar no que sabe fazer melhor e depois trocar pelo que precisa. Smith «deixou-se maravilhar com a realidade» (exemplo do processo de fabrico de um casaco).</li></ul><h4>Postulados (vigas mestras da atividade económica)</h4><ul><li><strong>Postulado da racionalidade:</strong> em média as pessoas são racionais, o que implica <strong>otimização</strong> (satisfazer os objetivos próprios da forma mais eficiente possível) e <strong>coerência</strong> (proceder da mesma forma em iguais circunstâncias).</li><li><strong>Postulado do equilíbrio:</strong> os mercados equilibram — num prazo mais ou menos curto, o que é oferecido tende a ser igual ao procurado e o produzido igual ao comprado.</li><li>Por detrás do equilíbrio: <strong>interdependência</strong> entre as ações dos agentes; os interesses confrontam-se e desse confronto surge o equilíbrio. A racionalidade implica não haver desperdício, o que se reflete no equilíbrio.</li></ul><h4>Microeconomia e Macroeconomia</h4><ul><li><strong>Microeconomia:</strong> decisões e análise ao nível dos agentes económicos (que produzem e consomem) e dos mercados onde bens e serviços são transacionados.</li><li><strong>Macroeconomia:</strong> análise a nível mais agregado (ex.: emprego e produção de um país).</li><li>Há autores que recusam a separação, por a fundamentação ser em ambos os casos microeconómica; preferem falar em <strong>microeconomia e economia agregada</strong>.</li></ul><h4>A Economia é uma ciência</h4><ul><li>Obedece a poucos princípios aplicados de forma contextualizada (ex.: postulados da racionalidade e do equilíbrio).</li><li><strong>Ciência ≠ doutrina:</strong> a ciência analisa de forma neutra <em>o que se passa</em>; a doutrina tem a ver com <em>o que se entende que se deve passar</em>. Termos próximos: <strong>economia positiva</strong> (ciência) e <strong>economia normativa</strong> (doutrina).</li><li>Uma coisa é a ciência, outra a sua aplicação: os mesmos factos podem originar decisões diferentes.</li><li><strong>Exemplos:</strong> estudo da procura de alimentos pelas famílias em função do preço, dimensão e rendimento da família → <em>positivo</em>; estudo que determina o rendimento que uma família <em>deve</em> ter para receber apoio do Estado → <em>normativo</em>. A decisão de não comer carne (por razões éticas) é normativa, mas pode ser um dado de partida de uma análise positiva.</li></ul><h4>Abordagem científica / método científico</h4><ul><li><strong>Experimentação</strong> (difícil em Economia mas cada vez mais efetuada), <strong>observação</strong>, <strong>análise</strong> (matemática e estatística).</li><li>Aspetos particularmente importantes: <strong>hipótese coeteris paribus</strong> (tudo o resto igual) e <strong>incerteza</strong> (os resultados verificam-se em média ou por norma — o que acontece mais vezes).</li></ul><h4>Fontes comuns de erro em Economia</h4><ul><li>Esquecer a hipótese coeteris paribus;</li><li>Esquecer a característica estatística das leis (verificam-se em média);</li><li>A incerteza;</li><li>A subjetividade (presente na análise de cada um);</li><li><strong>Falácia da composição</strong>: o que se passa numa parte não é necessariamente válido para o todo;</li><li><strong>Falácia post-hoc</strong> («depois de, por causa de»): pôr um nexo de causalidade entre dois factos apenas contemporâneos ou sucessivos.</li></ul>","keyTerms":[{"term":"Postulado da racionalidade","def":"Em média as pessoas são racionais: otimizam (satisfazem objetivos da forma mais eficiente) e são coerentes (agem igual em iguais circunstâncias)."},{"term":"Postulado do equilíbrio","def":"Os mercados equilibram: num prazo mais ou menos curto o oferecido tende a igualar o procurado e o produzido o comprado."},{"term":"Mecanismo de troca (Adam Smith)","def":"Permite não consumir só o que se produz e aumenta a riqueza ao permitir que cada agente se especialize no que faz melhor."},{"term":"Microeconomia","def":"Análise ao nível dos agentes económicos e dos mercados."},{"term":"Macroeconomia","def":"Análise a nível agregado (ex.: emprego e produção de um país); também designada economia agregada."},{"term":"Economia positiva / normativa","def":"Positiva: análise neutra do que se passa (ciência). Normativa: o que se deve passar (doutrina)."},{"term":"Coeteris paribus","def":"Hipótese de que tudo o resto se mantém igual."},{"term":"Falácia da composição","def":"Assumir que o que é válido para uma parte é válido para o todo."},{"term":"Falácia post-hoc","def":"«Depois de, logo por causa de»: atribuir causalidade a factos apenas contemporâneos ou sucessivos."}],"questions":[{"q":"Um estudo que determina o rendimento máximo que uma família deve ter para receber apoio do Estado é, segundo os slides, um exemplo de:","options":["Economia normativa","Economia positiva","Análise macroeconómica pura","Aplicação da hipótese coeteris paribus"],"answer":0,"explanation":"Envolve o que deve ser (critérios de atribuição e justificação do apoio), logo é normativo. Um estudo que relaciona a procura de alimentos com preço e rendimento seria positivo.","id":"q5o0z38"},{"q":"«Desde que o novo presidente da câmara tomou posse, o desemprego no concelho desceu; logo, foi ele que reduziu o desemprego.» Este raciocínio ilustra:","options":["A falácia da composição","O esquecimento da característica estatística das leis","A falácia post-hoc","O postulado do equilíbrio"],"answer":2,"explanation":"A falácia post-hoc («depois de, por causa de») põe um nexo de causalidade entre factos apenas sucessivos. A falácia da composição refere-se a generalizar da parte para o todo.","id":"q1cu6jd8"},{"q":"O postulado da racionalidade implica:","options":["Que todos os agentes acertam sempre nas suas decisões","Otimização e coerência, em média","Que o oferecido iguala sempre o procurado","Que os agentes ignoram o interesse próprio"],"answer":1,"explanation":"Racionalidade = em média, otimização (satisfazer objetivos da forma mais eficiente) e coerência (agir igual em iguais circunstâncias). A igualdade oferta-procura é o postulado do equilíbrio.","id":"q1kr1kl2"}],"key":"u1-1.2"},{"id":"1.3","title":"A definição geral de Economia de Samuelson","pages":[16,17],"summary":"<h4>Definição de Samuelson (1948)</h4><p>«<strong>Economia é a ciência que estuda como as pessoas e a sociedade escolhem o emprego de recursos escassos que podem ter usos alternativos, de forma a produzir vários bens e a distribuí-los para consumo, agora e no futuro, entre as várias pessoas e grupos na sociedade.</strong>»</p><h4>Aspetos presentes na definição</h4><ul><li>Estudo do comportamento dos agentes e da sociedade;</li><li>Recursos, bens e produção;</li><li><strong>Escassez, usos alternativos e escolha</strong> (o núcleo);</li><li>Decisões relativas à distribuição para consumo;</li><li>Consumo;</li><li>Tempo.</li></ul><h4>As pessoas e o consumo como referência</h4><ul><li>O <strong>consumo é o ato de satisfação das necessidades</strong>. A definição está centrada nas <strong>pessoas</strong> e não nos bens.</li><li>A decisão de consumo implica saber <strong>quando</strong> se consome — está em causa o tempo: hoje ou amanhã?</li></ul><p>A definição evidencia que está em causa um <strong>problema económico</strong>, do qual decorrem perguntas a que é preciso dar resposta.</p>","keyTerms":[{"term":"Definição de Samuelson","def":"Ciência que estuda como pessoas e sociedade escolhem o emprego de recursos escassos com usos alternativos para produzir bens e distribuí-los para consumo, agora e no futuro."},{"term":"Consumo","def":"Ato de satisfação das necessidades."}],"questions":[{"q":"Qual dos seguintes elementos NÃO consta dos aspetos destacados na definição de Economia de Samuelson?","options":["Escassez, usos alternativos e escolha","Tempo (agora e no futuro)","Distribuição para consumo","Maximização do lucro das empresas"],"answer":3,"explanation":"A definição centra-se nas pessoas e na sociedade, escassez, escolha, produção, distribuição, consumo e tempo; não refere a maximização do lucro (objetivo típico das empresas, tratado mais à frente).","id":"q1btdiq2"}],"key":"u1-1.3"},{"id":"1.4","title":"1.4.1 Escassez, escolha e custo de oportunidade","pages":[17,20],"summary":"<h4>Noções fundamentais</h4><ul><li>Porque há <strong>escassez</strong> de bens é necessário fazer <strong>escolhas</strong>.</li><li>Ao escolher está sempre em causa um <strong>custo de oportunidade</strong>: o valor da melhor alternativa à decisão tomada (ou a tomar).</li><li>Escassez, escolha e custo de oportunidade estão na base do problema económico.</li><li>As escolhas pautam-se por critérios reconduzíveis ao princípio da <strong>racionalidade</strong> e tendem, pelo menos a prazo, a conduzir a situações de <strong>equilíbrio</strong>.</li></ul><h4>A escassez está na base do problema económico</h4><p>Existe problema económico quando é necessário tomar uma decisão; a decisão é necessária porque há escassez e, portanto, escolha. <strong>Para haver um problema tem de haver mais de uma resposta possível!</strong></p><h4>Da escassez à escolha</h4><ul><li><strong>Escassez:</strong> um bem é escasso se não chega para satisfazer as necessidades humanas. <em>Escassez económica é diferente de escassez física.</em></li><li><strong>Consequência:</strong> não podemos satisfazer todas as <strong>alternativas</strong> em que o bem podia ser utilizado.</li><li><strong>A escassez obriga a escolher:</strong> escolher é optar por uma alternativa (sem alternativas não há escolha) e sacrificar o que não se escolheu. O benefício do que não se escolheu é o custo da escolha.</li><li>Como em média somos racionais, em média escolhemos a melhor alternativa.</li></ul><h4>Custo de oportunidade</h4><ul><li><strong>É o benefício da decisão com benefício mais alto de entre as decisões alternativas à decisão em causa.</strong></li><li>Decisão consumada: o maior benefício que perdi por ter tomado a decisão. Decisão a tomar: o maior benefício que vou perder.</li><li><strong>O que é relevante são as decisões a tomar e não as já consumadas.</strong></li><li>«<strong>Não há almoços grátis</strong>»: Escassez → Escolha → Custo de oportunidade.</li><li><strong>Decisões condicionadas:</strong> ex.: com um financiamento obrigatoriamente destinado a comprar um automóvel, o custo de oportunidade de comprar um automóvel é o benefício do melhor automóvel que não comprei. Importa porque, no limite, poderia haver inúmeras alternativas.</li></ul><h4>Ganho líquido de uma decisão</h4><ul><li><strong>Ganho (benefício) líquido = benefício (valor) da decisão − custo de oportunidade.</strong></li><li><strong>Regra fundamental:</strong> comparar o ganho <strong>com e sem</strong> a decisão, e não <em>antes e depois</em> da decisão.</li></ul><p><em>Exemplo ilustrativo:</em> se aceitar um trabalho de fim de semana paga 100 € e a melhor alternativa (outro trabalho) pagaria 80 €, o custo de oportunidade é 80 € e o ganho líquido é 20 €.</p>","keyTerms":[{"term":"Escassez","def":"Um bem é escasso se não chega para satisfazer as necessidades humanas (escassez económica ≠ escassez física)."},{"term":"Escolha","def":"Optar por uma alternativa, sacrificando as restantes; só existe se houver alternativas."},{"term":"Custo de oportunidade","def":"Benefício da melhor alternativa (a de benefício mais alto) à decisão em causa."},{"term":"Ganho líquido","def":"Benefício da decisão menos o seu custo de oportunidade."},{"term":"Regra com/sem","def":"Avalia-se uma decisão comparando a situação com e sem a decisão, não antes e depois."},{"term":"Não há almoços grátis","def":"Expressão da escassez e do custo de oportunidade sempre presente na escolha."}],"questions":[{"q":"A Ana tem uma tarde livre. Pode trabalhar num café (recebe 40 €), dar explicações (recebe 55 €) ou ir à praia (benefício que valoriza em 30 €). Se escolher dar explicações, o custo de oportunidade é:","options":["30 €","40 €","70 €","125 €"],"answer":1,"explanation":"O custo de oportunidade é o benefício da MELHOR alternativa não escolhida (40 €), não a soma das alternativas (70 €). O ganho líquido seria 55 − 40 = 15 €.","id":"q6r0qeu"},{"q":"Segundo a regra fundamental apresentada nos slides, para avaliar o ganho de uma decisão deve comparar-se:","options":["A situação antes e depois da decisão","O benefício da decisão com o benefício médio das alternativas","A situação com e sem a decisão","O custo contabilístico com o preço de mercado"],"answer":2,"explanation":"A regra é comparar com e sem a decisão; antes/depois mistura efeitos que ocorreriam de qualquer forma. O custo de oportunidade usa a melhor alternativa, não a média.","id":"q17euudt"},{"q":"Para que exista um problema económico é necessário que:","options":["Haja escassez e mais de uma resposta possível","Os bens sejam fisicamente raros","O Estado intervenha na afetação de recursos","Os bens tenham preço de mercado"],"answer":0,"explanation":"O problema existe quando é preciso decidir porque há escassez, e só há problema se houver mais de uma resposta possível. Escassez económica não é o mesmo que escassez física.","id":"qm0kgck"}],"key":"u1-1.4"},{"id":"1.4","title":"1.4.2 Bens livres e económicos; bens finais e recursos","pages":[21,24],"summary":"<p>Desenvolvimentos ligados ao problema económico (1.4.2): bens livres e económicos; bens finais e recursos; possibilidades de produção; FPP; lei dos custos relativos crescentes; progresso tecnológico; lei dos rendimentos marginais decrescentes; lei dos custos marginais crescentes.</p><h4>Bens, bens livres e bens económicos</h4><ul><li><strong>Bem é tudo o que tem valor para a atividade humana.</strong></li><li><strong>Bens livres:</strong> dados pela natureza, pelos quais ninguém tem de suportar um custo devido a alguém ter a sua propriedade. Ex.: a luz do Sol (talvez o mais importante de todos).</li><li><strong>Bens económicos:</strong> é preciso suportar um custo por alguém ter a propriedade do bem ou incorrer num custo para o ter (inclusive produzi-lo).</li><li>A análise económica em geral omite os bens livres (não relevantes para a decisão), mas um bem livre pode passar a <strong>económico</strong> se alguém conseguir controlar a sua utilização (ex.: propriedade), o que implica custos para quem quiser usufruir dele. Ser livre ou não depende do <strong>custo decorrente do controlo/propriedade</strong>.</li></ul><h4>Bens, bens finais e recursos</h4><p>Bem abrange o que satisfaz <strong>diretamente</strong> e <strong>indiretamente</strong> necessidades de consumo (um bolo, gasolina, uma máquina, música, um serviço de canalizador, a força de trabalho…).</p><table><tr><th colspan='2'>BENS</th></tr><tr><td><strong>Bens finais</strong></td><td>Satisfazem diretamente necessidades de consumo; produzidos ou não; utilidade direta em si mesmos.</td></tr><tr><td><strong>Recursos</strong> (não satisfazem diretamente necessidades de consumo)</td><td><strong>Recursos intermédios</strong> (bens intermédios): componentes [incorporam-se materialmente], matérias-primas [incorporam-se materialmente], matérias subsidiárias [não se incorporam materialmente]. São incorporados em bens finais ou em recursos produzidos.<br><strong>Fatores de produção:</strong> «Terra» [não é produzida]; Trabalho [parte inato, parte produzido]; Capital [é produzido]; Capacidade empreendedora [parte inata, parte produzida]. As ações dos fatores são necessárias à produção mas não se incorporam diretamente nela.</td></tr></table><h4>Limitações da classificação</h4><ul><li>A classificação deve-se ao <strong>uso</strong> do bem e não à sua natureza intrínseca.</li><li>Morango comido → bem final; usado para fazer doce → recurso. Automóvel para o prazer de conduzir → bem final; usado na distribuição dos produtos de uma empresa → capital. As situações podem ocorrer conjuntamente.</li></ul><h4>Linguagem corrente</h4><p>«Bem» é muitas vezes usado no sentido de bem final vs. bens/recursos intermédios; «bens» ou «produtos» vs. «serviços» distinguem materiais de imateriais. São designações ambíguas (um serviço também é um produto), mas há que saber enquadrá-las no quadro acima.</p>","keyTerms":[{"term":"Bem","def":"Tudo o que tem valor para a atividade humana."},{"term":"Bem livre","def":"Bem pelo qual ninguém suporta custo devido à propriedade de alguém (ex.: luz do Sol)."},{"term":"Bem económico","def":"Bem para o qual é preciso incorrer num custo (propriedade ou produção)."},{"term":"Bem final","def":"Satisfaz diretamente necessidades de consumo."},{"term":"Recursos intermédios","def":"Componentes, matérias-primas e matérias subsidiárias incorporados em bens finais ou recursos produzidos."},{"term":"Fatores de produção","def":"Terra (não produzida), trabalho, capital (produzido) e capacidade empreendedora; as suas ações não se incorporam diretamente na produção."},{"term":"Matérias subsidiárias","def":"Recursos intermédios que não se incorporam materialmente no produto."}],"questions":[{"q":"Uma empresa de distribuição compra uma carrinha para entregar encomendas. Segundo a classificação dos slides, a carrinha é:","options":["Um bem final, porque é um automóvel","Uma matéria subsidiária","Um bem livre","Capital (fator de produção)"],"answer":3,"explanation":"A classificação depende do uso e não da natureza: um automóvel usado na distribuição dos produtos de uma empresa é capital; seria bem final se usado pelo prazer de conduzir.","id":"qs28ex0"},{"q":"Qual dos seguintes fatores de produção é, segundo os slides, não produzido?","options":["A «Terra»","O capital","O trabalho","A capacidade empreendedora"],"answer":0,"explanation":"A «Terra» não é produzida; o capital é produzido; trabalho e capacidade empreendedora são parte inatos e parte produzidos.","id":"q8nde0x"},{"q":"Um bem livre passa a bem económico quando:","options":["Passa a ser útil para a produção","Alguém passa a controlar a sua utilização, implicando custos para quem dele quer usufruir","Passa a ser fisicamente escasso","É utilizado como recurso intermédio"],"answer":1,"explanation":"Ser livre depende do custo decorrente de alguém ter o controlo ou propriedade do bem; um bem livre pode ser imprescindível à produção e continuar livre.","id":"qtjrdqe"}],"key":"u1-1.4-2"},{"id":"1.4","title":"1.4.2 Possibilidades de produção, FPP, custos relativos crescentes e progresso tecnológico","pages":[24,30],"summary":"<h4>Possibilidades de produção</h4><p>São as possibilidades de produção (o que é possível produzir) a partir dos recursos intermédios e fatores de produção disponíveis. <strong>É necessário escolher entre possibilidades alternativas.</strong></p><table><tr><th>Possibilidade</th><th>Carros de combate (milhares)</th><th>Trigo (10<sup>6</sup> t)</th></tr><tr><td>A</td><td>0</td><td>15</td></tr><tr><td>B</td><td>1</td><td>14</td></tr><tr><td>C</td><td>2</td><td>12</td></tr><tr><td>D</td><td>3</td><td>9</td></tr><tr><td>E</td><td>4</td><td>5</td></tr><tr><td>F</td><td>5</td><td>0</td></tr></table><p>(Fonte: a partir de Parkin, 2008, ou Samuelson, 2012.) Estes valores são <strong>máximos de produção possíveis</strong>, ou seja, pontos da FPP.</p><h4>Fronteira de Possibilidades de Produção (FPP)</h4><ul><li><strong>FPP é a linha que une as possibilidades alternativas de máximos de produção possíveis, num contexto em que os recursos estão fixos.</strong></li><li>Gráfico: eixo horizontal = carros de combate (milhares); eixo vertical = trigo (milhões de t); curva decrescente e côncava para a origem, de A (0;15) a F (5;0).</li><li><strong>Possibilidades de produção</strong> = todos os pontos entre a FPP e os eixos, incluindo os da própria FPP.</li><li><strong>Generalização:</strong> sempre que os recursos são escassos e fixos há escolha entre possibilidades alternativas (aconchego dos pés e da cabeça com um cobertor pequeno; horas de estudo vs. lazer; formar soldados vs. enfermeiros). <strong>Análise dicotomizada:</strong> um bem versus todos os outros bens da economia.</li></ul><h4>FPP e eficiência</h4><ul><li>Pontos <strong>na</strong> FPP: eficientes; <strong>dentro</strong>: ineficientes; <strong>fora</strong>: impossíveis.</li><li><strong>Eficiência no sentido de Pareto</strong> (1848-1923): não se pode aumentar a produção de um bem sem reduzir a do outro. Todos os pontos da FPP são igualmente eficientes.</li></ul><h4>FPP e ótimo social</h4><p>A escolha do ponto da FPP pressupõe um critério, que pode não ser económico (ex.: sociedade preocupada com a guerra escolhe mais carros de combate e menos trigo). Ideia: partindo de uma ponta da FPP, avança-se até o benefício social de produzir mais de um bem deixar de compensar o custo social de produzir menos do outro.</p><h4>Custo relativo</h4><ul><li><strong>Custo relativo dos carros de combate:</strong> milhões de t de trigo sacrificados para produzir mais um milhar de carros = custo de oportunidade de carros medido em trigo.</li><li><strong>Custo relativo do trigo:</strong> milhares de carros sacrificados para produzir mais um milhão de t de trigo.</li><li>Em geral, o custo relativo de X em unidades de Y (custo relativo de X face a Y) = n.º de unidades de Y sacrificadas para aumentar X em uma unidade = |ΔY/ΔX|. Surge no contexto da FPP (recursos fixos).</li></ul><table><tr><th></th><th>X</th><th>Y</th><th>ΔX</th><th>ΔY</th><th>|ΔY/ΔX|</th></tr><tr><td>A</td><td>0</td><td>15</td><td>—</td><td>—</td><td>—</td></tr><tr><td>B</td><td>1</td><td>14</td><td>1</td><td>−1</td><td>1</td></tr><tr><td>C</td><td>2</td><td>12</td><td>1</td><td>−2</td><td>2</td></tr><tr><td>D</td><td>3</td><td>9</td><td>1</td><td>−3</td><td>3</td></tr><tr><td>E</td><td>4</td><td>5</td><td>1</td><td>−4</td><td>4</td></tr><tr><td>F</td><td>5</td><td>0</td><td>1</td><td>−5</td><td>5</td></tr></table><p>O custo relativo dos carros é <strong>crescente</strong> à medida que se canalizam mais recursos para a sua produção.</p><h4>Lei dos custos relativos crescentes</h4><ul><li>Ao reafetar <strong>recursos fixos</strong> de uma produção para outra, temos de sacrificar cada vez mais unidades da produção que diminui para obter iguais acréscimos da que aumenta. <strong>Por isso a FPP é côncava para a origem (abaulada para fora)</strong> em vez de reta.</li><li>Nota 1: |ΔX/ΔY| = custo relativo do trigo em carros; percorrendo de F para A obtém-se 1/5 = 0,2; 1/4 = 0,25; 1/3 ≈ 0,33; 1/2 = 0,5; 1 — também crescente.</li><li>Nota 2: a FPP pode ser reta (custo por unidade sempre igual), mas não é o usual. (A razão da lei: os recursos não são igualmente adequados a todas as produções.)</li></ul><h4>Progresso tecnológico</h4><ul><li>Há progresso tecnológico quando, com os mesmos recursos, é possível produzir mais (ou produzir o mesmo com menos recursos).</li><li>Provoca uma <strong>expansão (alargamento) da FPP</strong>, para os mesmos recursos. Três casos gráficos: progresso nos dois bens (FPP desloca-se para fora em ambos os eixos); só no bem I (expande-se no eixo do bem I, mantendo a interseção no eixo do bem II); só no bem II (o inverso).</li></ul><h4>Acréscimo de recursos</h4><ul><li>Ter mais recursos também expande a FPP (recursos aplicáveis aos dois bens, só ao bem I ou só ao bem II — gráficos idênticos).</li><li>O impacto gráfico é o mesmo do progresso tecnológico, mas <strong>não se devem confundir os dois contextos</strong>.</li></ul>","keyTerms":[{"term":"Possibilidades de produção","def":"O que é possível produzir com os recursos disponíveis: pontos entre a FPP e os eixos, incluindo a FPP."},{"term":"FPP","def":"Linha que une as possibilidades alternativas de máximos de produção possíveis, com recursos fixos."},{"term":"Eficiência de Pareto","def":"Situação em que não se pode aumentar a produção de um bem sem reduzir a de outro; todos os pontos da FPP."},{"term":"Custo relativo de X em Y","def":"Unidades de Y sacrificadas para aumentar X em uma unidade, |ΔY/ΔX|; é um custo de oportunidade."},{"term":"Lei dos custos relativos crescentes","def":"Ao reafetar recursos fixos, cada acréscimo igual de um bem exige sacrifícios crescentes do outro; FPP côncava para a origem."},{"term":"Progresso tecnológico","def":"Produzir mais com os mesmos recursos; expande a FPP."},{"term":"Análise dicotomizada","def":"Análise de um bem versus todos os outros bens da economia, para poder visualizar a FPP."}],"questions":[{"q":"Com base na tabela da FPP (A: 0 carros/15 trigo; B: 1/14; C: 2/12; D: 3/9; E: 4/5; F: 5/0), qual é o custo relativo de passar de D para E?","options":["3 milhões de t de trigo por milhar de carros","5 milhões de t de trigo por milhar de carros","4 milhões de t de trigo por milhar de carros","0,25 milhares de carros por milhão de t de trigo"],"answer":2,"explanation":"De D (3;9) para E (4;5): ΔX = 1, ΔY = −4, logo |ΔY/ΔX| = 4. O valor 3 corresponde a C→D e 0,25 é o custo relativo do trigo (inverso) entre esses pontos.","id":"q1xrcu9z"},{"q":"Na mesma FPP, uma economia que produz 2 milhares de carros de combate e 10 milhões de t de trigo está:","options":["Num ponto impossível de alcançar","Num ponto eficiente no sentido de Pareto","Num ponto da FPP, em ótimo social","Num ponto ineficiente, dentro da FPP"],"answer":3,"explanation":"Com 2 milhares de carros o máximo de trigo é 12 (ponto C); produzir 10 está abaixo da FPP, logo é ineficiente: seria possível ter mais trigo sem sacrificar carros.","id":"q1xr4d6z"},{"q":"A FPP é côncava para a origem (abaulada para fora) porque:","options":["Se verificam custos relativos crescentes ao reafetar recursos fixos","Há progresso tecnológico","Os recursos aumentam ao longo do tempo","Os custos relativos são constantes"],"answer":0,"explanation":"A lei dos custos relativos crescentes faz com que iguais acréscimos de um bem exijam sacrifícios cada vez maiores do outro. Custos constantes dariam uma FPP reta; progresso e mais recursos deslocam a FPP.","id":"qxbu3cb"},{"q":"Uma inovação aumenta a produtividade apenas na produção do bem I (eixo horizontal). Graficamente, a FPP:","options":["Desloca-se paralelamente para fora em ambos os eixos","Expande-se no eixo do bem I, mantendo a interseção no eixo do bem II","Expande-se no eixo do bem II, mantendo a interseção no eixo do bem I","Não se altera, pois os recursos são os mesmos"],"answer":1,"explanation":"O progresso tecnológico só no bem I aumenta a quantidade máxima de I (interseção horizontal), mantendo o máximo de II quando toda a produção é de II. Os recursos são os mesmos mas produz-se mais com eles.","id":"qxkeiss"},{"q":"Sobre o progresso tecnológico e o acréscimo de recursos, é correto afirmar:","options":["Só o acréscimo de recursos expande a FPP","O progresso tecnológico desloca a economia ao longo da FPP","Ambos expandem a FPP, mas são contextos diferentes que não se devem confundir","O progresso tecnológico implica sempre mais recursos"],"answer":2,"explanation":"Os slides sublinham que o impacto gráfico é o mesmo (expansão da FPP), mas no progresso tecnológico os recursos são os mesmos e produz-se mais com eles.","id":"qoa4tta"}],"key":"u1-1.4-3"},{"id":"1.4","title":"1.4.2 Lei dos rendimentos marginais decrescentes e lei dos custos marginais crescentes","pages":[30,32],"summary":"<h4>O significado de «marginal»</h4><p>Em Economia «marginal» significa <strong>variação</strong>, que pode ser acréscimo ou decréscimo (decréscimo = acréscimo negativo). Rendimento marginal diz respeito a um acréscimo de rendimento.</p><h4>Rendimento marginal</h4><ul><li>Obtém-se quando aumentamos em uma unidade um recurso, <strong>mantendo os outros recursos fixos</strong>.</li><li><strong>Rendimento marginal = acréscimo de produção resultante da utilização de uma unidade adicional do recurso que está a ser aumentado</strong>, mantendo os outros constantes.</li><li><strong>Contexto diferente do da FPP</strong>: aqui os recursos não estão todos fixos — há um recurso que varia.</li></ul><h4>Lei dos rendimentos marginais decrescentes</h4><p>Para iguais acréscimos sucessivos de utilização de um recurso numa produção, mantendo os outros fixos, obtêm-se <strong>acréscimos de produção sucessivamente menores</strong>.</p><h4>Exemplo: oficina de reparações automóveis (outros recursos fixos)</h4><table><tr><th>Mecânicos (A)</th><th>Reparações (B)</th><th>ΔA</th><th>ΔB</th><th>ΔB/ΔA</th></tr><tr><td>0</td><td>0</td><td>—</td><td>—</td><td>—</td></tr><tr><td>5</td><td>30</td><td>5</td><td>30</td><td>6</td></tr><tr><td>10</td><td>60</td><td>5</td><td>30</td><td>6</td></tr><tr><td>15</td><td>80</td><td>5</td><td>20</td><td>4</td></tr><tr><td>20</td><td>90</td><td>5</td><td>10</td><td>2</td></tr><tr><td>25</td><td>96</td><td>5</td><td>6</td><td>1,2</td></tr><tr><td>30</td><td>100</td><td>5</td><td>4</td><td>0,8</td></tr><tr><td>35</td><td>90</td><td>5</td><td>−10</td><td>−2</td></tr></table><p>A partir de 10 mecânicos os acréscimos de produção são decrescentes; entre 30 e 35 o rendimento marginal é mesmo negativo (−2 reparações por mecânico).</p><h4>Lei dos custos marginais crescentes</h4><ul><li>Rendimentos marginais decrescentes e custos marginais crescentes são <strong>duas perspetivas da mesma realidade</strong>.</li><li><strong>Lei:</strong> para obter iguais acréscimos sucessivos de uma produção, a partir de um recurso que varia (os outros fixos), temos de utilizar <strong>acréscimos sucessivamente maiores</strong> desse recurso.</li><li>Na oficina: para passar de 60 para 80 reparações bastam 5 mecânicos (0,25 mecânicos por reparação); de 80 para 90, outros 5 mecânicos para apenas 10 reparações (0,5 por reparação).</li></ul>","keyTerms":[{"term":"Marginal","def":"Variação (acréscimo ou decréscimo)."},{"term":"Rendimento marginal","def":"Acréscimo de produção resultante de uma unidade adicional do recurso que varia, mantendo os outros fixos."},{"term":"Lei dos rendimentos marginais decrescentes","def":"Iguais acréscimos sucessivos de um recurso (outros fixos) geram acréscimos de produção sucessivamente menores."},{"term":"Lei dos custos marginais crescentes","def":"Para obter iguais acréscimos de produção são necessários acréscimos sucessivamente maiores do recurso que varia (outros fixos)."}],"questions":[{"q":"Na oficina dos slides, 20 mecânicos fazem 90 reparações e 25 mecânicos fazem 96. Qual o rendimento marginal por mecânico nesse intervalo?","options":["6 reparações","1,2 reparações","3,84 reparações","4,5 reparações"],"answer":1,"explanation":"ΔB/ΔA = (96 − 90)/(25 − 20) = 6/5 = 1,2. O valor 6 é o acréscimo total (ΔB) e 3,84 é a produção média (96/25), não marginal.","id":"q5piovg"},{"q":"Qual a principal diferença entre o contexto da lei dos rendimentos marginais decrescentes e o da FPP?","options":["Na FPP todos os recursos estão fixos; nos rendimentos marginais há um recurso que varia","Na FPP há um recurso que varia; nos rendimentos marginais todos estão fixos","A FPP aplica-se só a bens finais e os rendimentos marginais só a recursos","Não há diferença: são a mesma lei"],"answer":0,"explanation":"A FPP pressupõe recursos fixos reafetados entre produções; a lei dos rendimentos marginais decrescentes considera um recurso que aumenta mantendo os outros fixos.","id":"q18a06oa"},{"q":"A lei dos custos marginais crescentes afirma que:","options":["O custo total de produção diminui com a escala","Iguais acréscimos de um recurso dão acréscimos de produção crescentes","Para obter iguais acréscimos de produção são precisos acréscimos sucessivamente maiores do recurso que varia","O custo relativo de um bem em termos do outro é constante"],"answer":2,"explanation":"É a outra perspetiva da lei dos rendimentos marginais decrescentes: se cada unidade adicional de recurso produz menos, cada unidade adicional de produção exige mais recurso.","id":"q1jrlvt8"}],"key":"u1-1.4-4"},{"id":"1.4","title":"1.4.3–1.4.4 Perguntas do problema económico e soluções: tradição, autoridade, mercado; o grande cisma","pages":[32,36],"summary":"<h4>1.4.3 Quatro perguntas decorrentes do problema económico</h4><ul><li>Produzir <strong>o quê?</strong> — tipo de produtos, quantidades e quando são produzidos.</li><li>Produzir <strong>como?</strong> — quem produz, de que forma e com que tecnologia.</li><li>Produzir <strong>para quem?</strong> — quem beneficia e como se reparte a produção.</li><li>Produzir <strong>quando?</strong></li></ul><p>Indivíduos e sociedade têm de responder; o foco está nas respostas da sociedade, mas também são requeridas a cada indivíduo ou grupo.</p><p><strong>Exemplo — eletricidade:</strong> optar por energia elétrica (vs. carro a gasolina ou elétrico) já é escolha (o quê); produzir com sol, vento, barragens ou centrais nucleares, afetando pessoas diferentes de forma diferente (como); quem distribui e ganha, rede orientada para famílias, empresas ou exportação (para quem); planear, construir e explorar uma central nuclear ou painéis solares demora tempos diferentes (quando).</p><h4>1.4.4 Tradição, autoridade e mercado como respostas</h4><ul><li><strong>Tradição:</strong> ex.: hora das refeições, funcionamento da família e de certas instituições, sistemas de castas e tribais; muitas vezes junta-se o religioso. Ex.: cerimónia e festejos do casamento em Portugal.</li><li><strong>Autoridade:</strong> do Estado e dos governantes. Ex.: leis sobre empresas e economia, incluindo impostos.</li><li><strong>Mercado livre:</strong> a decisão é deixada à livre escolha e interação dos interessados. Ex.: compra e venda, a democracia, a escolha da pessoa com quem se casa.</li></ul><h4>O mercado livre como resposta</h4><ul><li>Qualquer bem ou recurso tem associado um <strong>mercado</strong> — encontro dos que procuram com os que oferecem; é o substrato de todos os tipos de resposta (tradição, autoridade e mercado).</li><li>«Regulação pelo mercado» = regulação pelo <strong>mercado livre</strong>.</li><li>Requisito para o mercado funcionar livremente: a um nível superior, a <strong>proteção dos direitos de propriedade</strong>.</li></ul><h4>O grande cisma: descentralização vs. centralização («Adam Smith versus Karl Marx»)</h4><ul><li>Adam Smith: <em>Ensaio sobre a natureza e a causa da riqueza das nações</em> (1776) — associado à <strong>descentralização e ao mercado</strong>.</li><li>Karl Marx: <em>Manifesto Comunista</em> (1848) e <em>O Capital</em> (1.º vol. 1867) — associado à <strong>centralização e à autoridade</strong>.</li><li><strong>As economias e sociedades atuais são mistas</strong>, mais ou menos descentralizadas, com contextos de mercado, autoridade e tradição.</li></ul><h4>Mercado livre e democracia</h4><ul><li>Nas sociedades democráticas predomina a economia de livre mercado: a liberdade política começa na liberdade dos cidadãos, que se manifesta também na liberdade de empreender e de ter propriedade.</li><li>Nas ditaduras predomina a autoridade — propriedade e controlo do Estado sobre os meios de produção (regime comunista), com forte controlo do que se pode fazer e ter.</li><li>A Guerra Fria foi também uma guerra económica; o colapso económico do bloco liderado pela Rússia foi causa importante (possivelmente a mais importante) do seu desfecho.</li><li>O político e o económico caminham a par; sistemas económicos e políticos misturam-se em maior ou menor grau.</li></ul>","keyTerms":[{"term":"Perguntas do problema económico","def":"O quê, como, para quem e quando produzir."},{"term":"Tradição","def":"Resposta ao problema económico baseada em costumes (ex.: festejos do casamento)."},{"term":"Autoridade","def":"Resposta baseada na autoridade do Estado e governantes (ex.: leis, impostos)."},{"term":"Mercado livre","def":"Decisão deixada à livre escolha e interação dos interessados; requer proteção dos direitos de propriedade."},{"term":"Mercado","def":"Encontro dos que procuram com os que oferecem um bem ou recurso."},{"term":"Grande cisma da economia","def":"Descentralização/mercado (Adam Smith) versus centralização/autoridade (Karl Marx)."},{"term":"Economia mista","def":"Economia com contextos de mercado, autoridade e tradição, mais ou menos descentralizada."}],"questions":[{"q":"A decisão sobre se a eletricidade de um país deve ser produzida com painéis solares, barragens ou centrais nucleares responde sobretudo à pergunta:","options":["O quê produzir?","Para quem produzir?","Como produzir?","Quando produzir?"],"answer":2,"explanation":"O como refere-se a quem produz, de que forma e com que tecnologia. Para quem diz respeito a quem beneficia e à repartição; o quando ao momento (tempos de construção).","id":"qdb8dnt"},{"q":"Segundo os slides, qual é um requisito para que um mercado possa funcionar livremente?","options":["A proteção, a um nível superior, dos direitos de propriedade","A ausência total de leis","A propriedade estatal dos meios de produção","A existência de tradição religiosa"],"answer":0,"explanation":"O livre funcionamento do mercado requer que a sociedade, a um nível superior, proteja os direitos de propriedade e garanta as regras; propriedade estatal dos meios de produção associa-se à centralização.","id":"q13n1fjd"},{"q":"No «grande cisma da economia», Karl Marx associa-se a:","options":["Descentralização e mercado","Centralização e autoridade","Tradição e religião","Economia mista e democracia"],"answer":1,"explanation":"Marx (Manifesto Comunista, 1848; O Capital, 1867) associa-se à centralização e à autoridade; Adam Smith à descentralização e ao mercado.","id":"qb99rmc"}],"key":"u1-1.4-5"},{"id":"1.2 Ex.","title":"Caderno de exercícios — Conceito de economia e ciência económica (exercícios 1.2-1 a 1.2-4)","pages":[282,298],"summary":"<h4>Caderno de Exercícios (início)</h4><p>Na página 282 começa o <strong>Caderno de Exercícios</strong> de Noções Fundamentais de Economia 2026/2027 (José Adelino Afonso, jaa@ucp.pt); a página 283 está em branco. Primeira parte — 1. A Economia como uma ciência e o problema económico — 1.2 Conceito de economia e ciência económica:</p><ul><li><strong>Exercício 1.2-1</strong>: comentar «A economia é tão velha quanto a humanidade» e «Adam Smith deixou-se maravilhar e, partindo dessa atitude, tornou-se o pai da Economia».</li><li><strong>Exercício 1.2-2</strong>: dar um exemplo de aplicação prática do <strong>postulado da racionalidade</strong> e outro do <strong>postulado do equilíbrio</strong>.</li><li><strong>Exercício 1.2-3</strong>: cursos do ensino superior com vagas por preencher, e o Governo a encerrar cursos sem número mínimo de candidatos. a) relacionar com os postulados da racionalidade e do equilíbrio e a sua conjugação; b) relacionar a evolução do mercado do ensino (profissões mais ou menos desejadas) com a integração do tempo na verificação dos postulados.</li><li><strong>Exercício 1.2-4</strong>: identificar afirmações <strong>positivas</strong> (descrevem o que é, verificáveis) e <strong>normativas</strong> (juízos de valor, o que deve ser): a) propinas demasiado elevadas (normativa); b) propinas mais baixas do que no Reino Unido (positiva); c) consumo de açúcar diminuiu porque se conhecem melhor os seus malefícios (positiva); d) impostos injustos embora necessários (normativa); e) quando o preço da gasolina aumenta o consumo reduz-se (positiva); f) é necessário que o preço dos bens de primeira necessidade desça (normativa); g) se o preço das refeições no restaurante subir compra-se mais para consumir em casa (positiva).</li></ul>\n<p><strong>Nota:</strong> as páginas 285–337 do dossiê correspondem ao <strong>Caderno de Exercícios</strong> (enunciados nas pp. 285–296 e 312–322; <strong>soluções sintéticas</strong> nas pp. 297–311 e 322–337). Esta secção reúne os exercícios 1.2-4 a 1.2-6 e as respetivas soluções.</p><h4>Afirmações positivas vs. normativas (Ex. 1.2-4)</h4><ul><li><strong>Positiva</strong>: descreve o que é, pode ser testada com factos (ex.: «As taxas moderadoras nos hospitais reduzem o acesso aos cuidados de saúde» → <strong>positiva</strong>).</li><li><strong>Normativa</strong>: envolve juízo de valor, o que deve ser (ex.: «Todos devem pagar taxas moderadoras nos hospitais» → <strong>normativa</strong>).</li><li>Uma afirmação pode ter uma primeira parte positiva e uma segunda normativa (alínea d da solução).</li><li>Soluções do caderno: a) normativo; b) positivo; c) positivo; d) 1.ª parte positivo, 2.ª normativo; e) positivo; f) normativo; g) positivo; h) normativo; i) positivo. A resposta deve ser sempre justificada.</li></ul><h4>Fontes comuns de erro na análise económica (Ex. 1.2-5 e 1.2-6)</h4><table><tr><th>Afirmação</th><th>Fonte de erro (solução)</th></tr><tr><td>a) «O consumo de bebidas alcoólicas aumenta e o preço também; logo quando o preço aumenta, aumenta a procura»</td><td><strong>Falácia post-hoc</strong> (confundir sucessão/correlação com causalidade)</td></tr><tr><td>b) «Quanto mais dinheiro guardar em casa hoje, mais bens poderei consumir amanhã»</td><td>Esquecimento da hipótese <strong>coeteris paribus</strong> (ignora, p. ex., a inflação)</td></tr><tr><td>c) Comprar ações porque a rádio prevê subida de todas as ações cotadas</td><td>Esquecimento do coeteris paribus + <strong>falácia da composição</strong> (se todos comprarem, o preço sobe já)</td></tr><tr><td>d) «Saiba as empresas de que deve comprar ações para ficar rico»</td><td>Coeteris paribus + falácia da composição</td></tr><tr><td>e) «Saiba a tática que o conduzirá à vitória em todas as batalhas»</td><td>Coeteris paribus + falácia da composição</td></tr><tr><td>f) «Saiba como fiquei rico e torne-se rico também!»</td><td>Falácia da composição</td></tr></table><p>Podem coexistir várias fontes de erro numa mesma afirmação, embora uma seja mais evidente.</p><p><strong>Ex. 1.2-6:</strong> campanha nacional «compre português» como forma de sair da crise, seguida também noutros países → <strong>esquecimento do coeteris paribus</strong> e <strong>falácia da composição</strong>: o que é bom para um país isolado (substituir importações) deixa de o ser quando todos os países fazem o mesmo, pois as exportações de cada um também caem.</p><h4>Racionalidade e equilíbrio (Ex. 1.2-3, solução)</h4><p>É racional quer para os estudantes quer para o Estado não procurar/promover cursos sem saída; o equilíbrio resulta da interação entre quem procura e quem oferece cursos (princípios da otimização e da coerência). O mercado do ensino demora mais a ajustar, mas num prazo alargado (vários anos) a racionalidade e o equilíbrio estão presentes.</p>","keyTerms":[{"term":"Afirmação positiva","def":"Descreve a realidade tal como é; pode ser testada/verificada pelos factos."},{"term":"Afirmação normativa","def":"Exprime um juízo de valor sobre o que deve ser."},{"term":"Falácia post-hoc","def":"Concluir que, por um acontecimento ocorrer depois (ou juntamente com) outro, é causado por ele."},{"term":"Falácia da composição","def":"Supor que o que é verdade para uma parte (um indivíduo) é verdade para o todo."},{"term":"Coeteris paribus","def":"Hipótese de «tudo o resto constante»; o seu esquecimento é uma fonte de erro comum."}],"questions":[{"q":"Qual das seguintes afirmações (Exercício 1.2-4) tem carácter normativo?","options":["As propinas universitárias em Portugal são mais baixas do que no Reino Unido.","Quando o preço da gasolina aumenta o seu consumo reduz-se.","O consumo de açúcar diminuiu porque são mais conhecidos os seus malefícios para a saúde.","É necessário que o preço dos bens de primeira necessidade desça."],"answer":3,"explanation":"«É necessário que...» exprime um juízo de valor (o que deve ser), logo é normativa. As outras descrevem factos ou relações verificáveis, mesmo que sobre temas sensíveis, pelo que são positivas.","id":"q12qu0ac"},{"q":"A afirmação «Todos devem pagar taxas moderadoras nos hospitais» é classificada no caderno de exercícios como:","options":["Positiva, porque descreve uma política em vigor","Normativa, porque contém um juízo de valor sobre o que deve ser","Positiva na primeira parte e normativa na segunda","Uma falácia post-hoc"],"answer":1,"explanation":"O verbo «devem» exprime um juízo de valor, logo é normativa. Já «As taxas moderadoras reduzem o acesso aos cuidados de saúde» seria positiva, por ser testável com factos.","id":"qw6h3w4"},{"q":"Uma campanha «compre português» para sair da crise, adotada simultaneamente em muitos países, pode falhar sobretudo devido a:","options":["Falácia post-hoc","Lei dos rendimentos marginais decrescentes","Falácia da composição (e esquecimento do coeteris paribus)","Custo de oportunidade nulo"],"answer":2,"explanation":"O que resulta para um país isolado não resulta se todos o fizerem: as exportações de cada país também diminuem. Não é post-hoc, pois não se trata de confundir sucessão temporal com causalidade.","id":"qteklm1"}],"key":"u1-1.2 Ex."},{"id":"1.3 Ex.","title":"Caderno de exercícios — A definição geral de Economia de Samuelson","pages":[285,298],"summary":"<h4>Ex. 1.3-1 e solução</h4><p>Definição transcrita: «Economia é a ciência que estuda como as pessoas e a sociedade escolhem o emprego de recursos escassos que podem ter usos alternativos, de forma a produzir vários bens e a distribuí-los para consumo, agora e no futuro, entre as várias pessoas e grupos na sociedade.»</p><p><strong>Elementos presentes na definição</strong> (segundo a solução):</p><ul><li>Economia é a <strong>ciência</strong></li><li>que estuda como as <strong>pessoas e a sociedade</strong></li><li><strong>escolhem</strong> o emprego de <strong>recursos escassos</strong> que podem ter <strong>usos alternativos</strong>,</li><li>de forma a <strong>produzir</strong> vários bens e a <strong>distribuí-los</strong></li><li>para <strong>consumo</strong>,</li><li><strong>agora e no futuro</strong> (dimensão temporal),</li><li>entre as várias <strong>pessoas e grupos</strong> na sociedade (dimensão distributiva).</li></ul><p>Esta reflexão enquadra o <strong>problema económico</strong> (escassez, escolha, custo de oportunidade) abordado no tópico seguinte.</p>","keyTerms":[{"term":"Recursos escassos com usos alternativos","def":"Elemento central da definição de Samuelson: os recursos são limitados face às necessidades e podem ser aplicados em diferentes fins, o que obriga a escolher."}],"questions":[{"q":"Qual dos seguintes elementos NÃO faz parte da definição geral de Economia de Samuelson?","options":["Recursos escassos que podem ter usos alternativos","Distribuição dos bens entre pessoas e grupos na sociedade","Consumo agora e no futuro","Maximização do lucro das empresas como objetivo da sociedade"],"answer":3,"explanation":"A definição fala de escolha, recursos escassos com usos alternativos, produção e distribuição para consumo, agora e no futuro, entre pessoas e grupos. A maximização do lucro não aparece na definição.","id":"q6vt116"}],"key":"u1-1.3 Ex."},{"id":"1.4 Ex.","title":"Caderno de exercícios — O problema económico: escassez, custo de oportunidade, FPP e rendimentos decrescentes","pages":[285,302],"summary":"<h4>Ex. 1.4-1 – Existência do problema económico</h4><p>Em <strong>todas</strong> as situações apresentadas (supermercado para restaurante/família; rendimento mínimo garantido; transportes públicos; Anabela trabalha/não trabalha porque tem filhos; equipamento das forças armadas; passes mais baratos) <strong>está presente o problema económico</strong>. Para identificar os seus elementos começa-se pela <strong>escassez, escolha e custo de oportunidade</strong> e responde-se às perguntas «produzir o quê?», «como?», «para quem?» e «quando?». Começar pelo <strong>decisor envolvido</strong> ajuda a ver a perspetiva de análise:</p><ul><li>a) restaurante (perspetiva de mercado – respostas dadas pelos clientes) e família (também mercado, mas muitas vezes <strong>tradição</strong> – peru no Natal – ou <strong>autoridade</strong> – a mãe decide as refeições, «o frango é para hoje, o pudim é para domingo»).</li><li>b), c), g) perspetiva do Governo = perspetiva social.</li><li>d) Anabela: o <strong>tempo</strong> é escasso; o benefício de estar com os filhos suplanta o benefício do que ganharia com o trabalho.</li><li>e) Anabela: o <strong>rendimento</strong> é escasso face às despesas com os filhos.</li><li>f) Governo/Forças Armadas – frequentemente há conflito de interesses/perspetivas.</li></ul><h4>Ex. 1.4-2 – Escassez</h4><ul><li>«Para ser escasso basta existir em pouca quantidade» → <strong>Falso</strong>: interessa a disponibilidade face à <strong>procura</strong>.</li><li>«Se todos tivermos muito dinheiro não há problema económico» → <strong>Falso</strong>: o dinheiro compra os bens que estão no mercado; não deixam de ser escassos por haver dinheiro.</li><li>«A utilização dada a um recurso determina se é escasso» → <strong>Verdadeiro</strong>: determina a disponibilidade face à procura.</li></ul><h4>Ex. 1.4-4 – Avião já comprado</h4><p>Para decidir manter o avião, o relevante é o que se passa <strong>no futuro</strong>, com e sem a decisão (custo de oportunidade de <em>ter</em> o avião, não o de o ter adquirido – custo afundado). O benefício de continuar a tê-lo são todos os benefícios futuros; importa o <strong>benefício líquido</strong> = benefícios − custo de oportunidade.</p><h4>Ex. 1.4-5 – Bens finais, recursos intermédios e fatores de produção</h4><ul><li><strong>Bem final</strong>: tem utilidade em si mesmo, satisfação direta.</li><li><strong>Recurso intermédio</strong> (bem intermédio): incorporado no bem final ou noutros intermédios; a sua utilidade deriva do bem em que é incorporado.</li><li><strong>Fatores de produção</strong>: permitem as ações produtivas.</li><li>Os <strong>recursos</strong> = recursos intermédios + fatores de produção.</li><li>A classificação depende da <strong>utilização</strong> e não da natureza: uma maçã comida é bem final; usada para compota é recurso. O trabalho pode ser fator de produção ou atividade que dá satisfação.</li></ul><h4>Ex. 1.4-7 – FPP e custos relativos crescentes</h4><table><tr><th>Possib.</th><th>Alimentos X (milhões kg)</th><th>Máquinas Y (milhares)</th><th>|ΔY/ΔX| (custo dos alimentos em máquinas)</th><th>|ΔX/ΔY| (custo das máquinas em alimentos)</th></tr><tr><td>A</td><td>0</td><td>150</td><td>–</td><td>1,00 (A vs B)</td></tr><tr><td>B</td><td>10</td><td>140</td><td>1</td><td>0,50 (B vs C)</td></tr><tr><td>C</td><td>20</td><td>120</td><td>2</td><td>0,33 (C vs D)</td></tr><tr><td>D</td><td>30</td><td>90</td><td>3</td><td>0,25 (D vs E)</td></tr><tr><td>E</td><td>40</td><td>50</td><td>4</td><td>0,20 (E vs F)</td></tr><tr><td>F</td><td>50</td><td>0</td><td>5</td><td>–</td></tr></table><p>O gráfico (alimentos no eixo horizontal, máquinas no vertical) é uma curva <strong>negativamente inclinada e côncava para a origem</strong>. O custo relativo é o custo de passar de uma possibilidade para outra: de B para C sacrificam-se 2 mil máquinas por cada milhão de kg adicional de alimentos (cada acréscimo de 10 milhões custa 20 mil máquinas). Os custos relativos são <strong>crescentes</strong> em ambos os sentidos (para as máquinas, lendo de F para A: 0,20 → 0,25 → 0,33 → 0,50 → 1,00). Nota: qualquer divisão dá o número de unidades do numerador por unidade do denominador.</p><h4>Ex. 1.4-8 – Custos relativos vs. custos marginais crescentes</h4><ul><li><strong>Custos relativos</strong>: aplicação de recursos fixos entre duas produções alternativas; crescentes porque, para acréscimos iguais de um bem, é preciso sacrificar cada vez mais do outro.</li><li><strong>Custos marginais</strong>: produção de um bem em que todos os recursos estão fixos exceto um; para acréscimos iguais do bem é preciso uma quantidade sucessivamente maior desse recurso.</li><li>Custos marginais crescentes e <strong>rendimentos marginais decrescentes</strong> são duas perspetivas do mesmo fenómeno.</li></ul><table><tr><th>Homens</th><th>Morangos (t)</th><th>Rendimento marginal (t por homem)</th><th>Custo marginal (homens por t)</th></tr><tr><td>0→10</td><td>0→15</td><td>1,5</td><td>0,67</td></tr><tr><td>10→20</td><td>15→30</td><td>1,5</td><td>0,67</td></tr><tr><td>20→30</td><td>30→40</td><td>1</td><td>1,00</td></tr><tr><td>30→40</td><td>40→45</td><td>0,5</td><td>2,00</td></tr><tr><td>40→50</td><td>45→48</td><td>0,3</td><td>3,33</td></tr><tr><td>50→60</td><td>48→50</td><td>0,2</td><td>5,00</td></tr><tr><td>60→70</td><td>50→45</td><td>−0,5</td><td>∞ (*)</td></tr></table><p>(*) O acréscimo de produção é zero/negativo; a divisão por zero dá infinito. O rendimento marginal = ΔProdução/ΔHomens; o custo marginal = ΔHomens/ΔProdução (inverso).</p><h4>Ex. 1.4-9 – Pontos e FPP</h4><ul><li>Ponto <strong>na</strong> fronteira: eficiente (eficiência de Pareto).</li><li>Ponto no <strong>interior</strong>: ineficiente.</li><li>Ponto no <strong>exterior</strong>: impossível (com os recursos e tecnologia atuais).</li><li>A racionalidade leva os agentes a procurar a eficiência, logo a estar na fronteira, para não haver desperdício.</li><li>Progresso tecnológico: desloca a FPP para fora (pode ser enviesado para um dos bens).</li></ul><h4>Ex. 1.4-10 e 1.4-11</h4><p>Tradição, autoridade e mercado como respostas ao problema económico – exemplos: jantar de Natal, roupas de casamento dos noivos, regras de trânsito, escolha das séries de televisão. O <strong>Grande Cisma da Economia</strong> toma como referência as interpretações de <strong>Adam Smith</strong> (Mercado) e de <strong>Karl Marx</strong> (Autoridade) como formas de responder ao problema económico.</p>","keyTerms":[{"term":"Escassez","def":"Disponibilidade de um recurso face à sua procura (não apenas pouca quantidade)."},{"term":"Custo de oportunidade","def":"Benefício da melhor alternativa sacrificada quando se toma uma decisão."},{"term":"Benefício líquido","def":"Benefícios de uma decisão menos o seu custo de oportunidade."},{"term":"Bem final","def":"Bem com utilidade em si mesmo, que dá satisfação direta."},{"term":"Recurso intermédio","def":"Bem incorporado no bem final ou noutros bens intermédios; a sua utilidade deri
