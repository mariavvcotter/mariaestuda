0% superior ao de 1974; durante décadas a subida nominal foi quase toda \"comida\" pela inflação. Para avaliar poder de compra é preciso olhar para valores reais.</p>","keyTerms":[{"term":"Número índice","def":"Fator adimensional que permite passar de um valor a outro de forma multiplicativa (ex.: 1,2 = subida de 20%)."},{"term":"IPC","def":"Índice de Preços no Consumidor: mede a evolução dos preços de um cabaz representativo do consumo dos residentes."},{"term":"IHPC","def":"Índice Harmonizado de Preços no Consumidor; inclui também a despesa dos turistas."},{"term":"Inflação subjacente","def":"Inflação calculada excluindo os produtos alimentares não transformados e os energéticos."},{"term":"Taxa de inflação mensal","def":"Variação do IPC de um mês para o mês seguinte."},{"term":"Taxa de inflação homóloga","def":"Variação do IPC face ao mesmo mês do ano anterior."},{"term":"Taxa de inflação média (12 meses)","def":"Variação da média dos últimos 12 índices face à média dos 12 meses anteriores; com janeiro-dezembro é a inflação média anual."},{"term":"Deflação","def":"Descida do nível geral de preços."},{"term":"Salário real","def":"Salário nominal convertido a preços constantes; mede o poder de compra."},{"term":"Salário nominal","def":"Salário expresso em euros correntes de cada ano, sem correção da variação dos preços."},{"term":"Ano-base","def":"Ano de referência dos preços (2016 no gráfico); nesse ano valor nominal e valor real coincidem."}],"questions":[{"q":"O IPC português foi de 104,49 em setembro de 2011 e de 107,50 em setembro de 2012. A taxa de inflação homóloga de setembro de 2012 é aproximadamente:","options":["3,01%","2,88%","2,80%","0,62%"],"answer":1,"explanation":"(107,50 − 104,49)/104,49 × 100 ≈ 2,88%. 3,01 é a variação em pontos do índice (não em percentagem); dividir por 107,50 daria ≈ 2,80%; 0,62% é a taxa mensal (agosto → setembro).","id":"q1f1zmrs"},{"q":"A taxa de inflação média dos últimos 12 meses calculada para setembro de 2012 compara:","options":["O IPC de setembro de 2012 com o IPC de agosto de 2012.","O IPC de setembro de 2012 com o de setembro de 2011.","A média dos índices de outubro de 2011 a setembro de 2012 com a média de outubro de 2010 a setembro de 2011.","A média dos índices de janeiro a dezembro de 2012 com a de 2011."],"answer":2,"explanation":"A média dos últimos 12 meses usa as somas de outubro do ano anterior a setembro do ano corrente (1 279,16 vs. 1 238,82 → 3,26%). A primeira opção é a mensal, a segunda a homóloga e a última a média anual (válida apenas para dezembro).","id":"q1qgtmfe"},{"q":"Na estrutura de ponderação de 2023, a classe «Restaurantes e hotéis» pesa 77,2‰ no IPC e 141,8‰ no IHPC. Como se explica a diferença?","options":["O IHPC inclui também a despesa dos turistas, que é muito concentrada em restaurantes e hotéis.","O IHPC exclui os produtos energéticos e alimentares não transformados.","O IPC só considera as famílias com rendimentos mais baixos.","O IHPC usa preços de produtor em vez de preços no consumidor."],"answer":0,"explanation":"Segundo os slides, o IHPC inclui a despesa dos turistas, não considerada no IPC, o que aumenta o peso de restaurantes e hotéis. Excluir alimentares não transformados e energéticos é a definição da inflação subjacente.","id":"q1qy48ct"},{"q":"O que exclui a inflação subjacente, segundo a nota do gráfico do INE?","options":["Os bens importados.","Os serviços de restauração e alojamento.","Os produtos alimentares não transformados e os produtos energéticos.","Os impostos indiretos, como o IVA."],"answer":2,"explanation":"A inflação subjacente exclui os componentes mais voláteis: produtos alimentares não transformados e energéticos. Por isso, em 2022 subiu menos do que o IPC total, muito influenciado pela energia.","id":"qe70nuc"},{"q":"O salário mínimo era de 16,5 € em 1974 (537,9 € a preços de 2016) e de 760 € em 2023 (649,6 € a preços de 2016). Qual a conclusão correta?","options":["O poder de compra do salário mínimo multiplicou-se por cerca de 46.","O salário mínimo aumentou cerca de 21% em termos reais entre 1974 e 2023, muito menos do que em termos nominais.","O salário mínimo perdeu poder de compra entre 1974 e 2023.","Os salários nominal e real coincidem em todos os anos porque estão em euros."],"answer":1,"explanation":"Em termos reais: 649,6/537,9 ≈ 1,21, ou seja, +21%. Em termos nominais multiplicou-se por cerca de 46 (760/16,5), mas grande parte deve-se à subida dos preços. Nominal e real só coincidem no ano base (2016).","id":"quw9p2o"},{"q":"No gráfico do Salário Mínimo Nacional (1974-2023) a preços de 2016, as séries nominal e real coincidem em 2016 (530 €). Porquê?","options":["Porque 2016 é o ano-base dos preços usados para deflacionar a série","Porque em 2016 a inflação foi nula","Porque em 2016 o salário mínimo foi congelado","Porque a partir de 2016 deixou de haver inflação em Portugal"],"answer":0,"explanation":"A série real está a preços de 2016; no ano-base o índice de preços vale 100, logo valor nominal = valor real. Uma inflação nula em 2016 não faria as séries coincidir — só manteria o desfasamento do ano anterior.","id":"q4roi22"}],"key":"u5-5.5"},{"id":"5.6","title":"Pleno emprego, taxa de desemprego natural e PIB potencial","pages":[173,175],"summary":"<h4>Pleno emprego</h4>\n<ul>\n<li><strong>Curto prazo:</strong> ocorre <strong>quando todo o desemprego é friccional e estrutural</strong>, ou seja, quando <strong>não há desemprego cíclico</strong>. É o conceito habitualmente usado na literatura, relacionado com a política económica de conjuntura (política de curto prazo), porque o desemprego estrutural não muda no curto prazo.</li>\n<li><strong>Longo prazo:</strong> ocorre <strong>quando todo o desemprego é friccional</strong>, ou seja, quando não há desemprego cíclico nem desemprego estrutural.</li>\n</ul>\n<p><strong>Em termos económicos, pleno emprego não significa ausência de desemprego.</strong></p>\n<h4>Taxa de desemprego natural</h4>\n<p>É a <strong>taxa de desemprego quando estamos numa situação de pleno emprego</strong>. Usualmente reporta-se ao pleno emprego de curto prazo; nesse contexto compreende o <strong>desemprego friccional e o desemprego estrutural</strong>.</p>\n<ul>\n<li>O <strong>PIB de pleno emprego chama-se PIB potencial</strong>. O PIB real tende a flutuar à volta do PIB potencial.</li>\n<li>A taxa de desemprego natural tem evoluído ao longo do tempo – andará nos <strong>4 a 6%</strong>, mas é um valor sobre o qual não há consensos nem certezas.</li>\n<li>Fatores que a determinam: <strong>competências, flexibilidade e mobilidade dos trabalhadores no mercado de trabalho e disponibilidade de informação</strong>. Ex.: as tecnologias de informação (internet, redes sociais) reduzem o desemprego friccional e, consequentemente, a taxa de desemprego natural.</li>\n<li>O <strong>desemprego de longa duração</strong> tem um efeito <strong>aumentativo</strong> sobre a taxa natural, porque os trabalhadores perdem competências (descapitalizam-se em capital humano) quando estão muito tempo desempregados.</li>\n</ul>\n<h4>Pleno emprego e nível de preços</h4>\n<p>No pleno emprego, com a correspondente taxa natural de desemprego, <em>ceteris paribus</em>, o <strong>nível de preços não se altera</strong> (não sobe nem desce), porque os <strong>salários estão estáveis</strong>.</p>\n<h4>Pleno emprego de curto ou de longo prazo?</h4>\n<p>No discurso político e económico muitas vezes não se distingue. Mas, para o mercado de trabalho estar em equilíbrio e os salários estáveis, faz mais sentido o <strong>pleno emprego de longo prazo</strong> (só desemprego friccional) – coerente com uma política de desenvolvimento que procure o máximo de eficiência (sem desemprego estrutural). Ainda assim é natural que o discurso se baseie no curto prazo, por ser mais visível e mensurável.</p>","keyTerms":[{"term":"Pleno emprego (curto prazo)","def":"Situação em que todo o desemprego é friccional e estrutural (não há desemprego cíclico)."},{"term":"Pleno emprego (longo prazo)","def":"Situação em que todo o desemprego é friccional (sem desemprego cíclico nem estrutural)."},{"term":"Taxa de desemprego natural","def":"Taxa de desemprego em pleno emprego; inclui desemprego friccional e estrutural; estimada em cerca de 4 a 6%."},{"term":"PIB potencial","def":"PIB correspondente ao pleno emprego; o PIB real flutua à sua volta."}],"questions":[{"q":"Segundo o conceito de pleno emprego de curto prazo, uma economia está em pleno emprego quando:","options":["A taxa de desemprego é zero","Só existe desemprego friccional","Não existe desemprego cíclico, existindo apenas desemprego friccional e estrutural","Não existe desemprego estrutural, existindo apenas desemprego cíclico"],"answer":2,"explanation":"No curto prazo, pleno emprego = ausência de desemprego cíclico (fica o friccional e o estrutural). 'Só desemprego friccional' é o conceito de longo prazo; pleno emprego nunca significa desemprego zero.","id":"qkdrb0c"},{"q":"Qual dos seguintes fatores tende a AUMENTAR a taxa de desemprego natural?","options":["Maior difusão de informação sobre vagas através da internet","Aumento do desemprego de longa duração","Maior mobilidade geográfica dos trabalhadores","Melhoria das competências dos trabalhadores"],"answer":1,"explanation":"O desemprego de longa duração descapitaliza os trabalhadores em capital humano, aumentando a taxa natural. Os restantes fatores reduzem o desemprego friccional e, portanto, a taxa natural.","id":"q11i6s8g"}],"key":"u5-5.6"},{"id":"5.2 Ex.","title":"Caderno de exercícios — Contabilidade nacional, óticas do produto e PIB nominal/real","pages":[312,325],"summary":"<h4>Ex. 5.1 – Três óticas de contabilização</h4><p>Há três óticas de contabilização da riqueza nacional criada em cada ano: <strong>produção, despesa e rendimento</strong>. Todas se referem à mesma realidade (o produto) num dado intervalo de tempo (em geral um ano), medida em diferentes locais do circuito económico:</p><ul><li><strong>Ótica da produção</strong>: à saída das empresas – permite saber que empresas criam riqueza.</li><li><strong>Ótica da despesa</strong>: à porta dos utilizadores finais – quem fez a despesa / como foi utilizada a riqueza.</li><li><strong>Ótica do rendimento</strong>: no mercado dos fatores (contratação de fatores às famílias pelas empresas) – como foi distribuída a riqueza pelos agentes.</li></ul><h4>Ex. 5.2 – Mercados financeiros</h4><p>Diagrama (Parkin, 2008): Famílias, Empresas, Governo e Resto do Mundo ligados pelos mercados dos fatores (Y), dos bens (C, I, G, X−M) e financeiros (poupança S, serviço da dívida pública, empréstimos externos líquidos, empréstimos às empresas). Os mercados financeiros são os <strong>mercados das poupanças</strong>: quem poupa oferece poupanças, quem precisa de recursos procura poupanças. As setas estão nos <strong>dois sentidos</strong> porque qualquer grupo de agentes pode globalmente ser <strong>financiador</strong> (credor líquido) ou <strong>financiado</strong> (devedor líquido).</p><h4>Ex. 5.3 – PIB nominal, real e deflator (Portugal, milhões €)</h4><table><tr><th>Ano</th><th>Preços correntes</th><th>Preços do ano anterior</th></tr><tr><td>1998</td><td>100 962</td><td>–</td></tr><tr><td>1999</td><td>108 030</td><td>104 800</td></tr><tr><td>2000</td><td>115 548</td><td>111 680</td></tr><tr><td>2001</td><td>122 801</td><td>117 587</td></tr></table><ul><li>Variação nominal 2000→2001 = 122 801/115 548 − 1 ≈ <strong>6,28%</strong>.</li><li>Variação real (em volume) 2000→2001 = 117 587/115 548 − 1 ≈ <strong>1,76%</strong> (PIB de 2001 a preços de 2000 vs. PIB de 2000 a preços correntes).</li><li>Deflator (variação de preços face ao ano anterior) = preços correntes / preços do ano anterior × 100: 1999 ≈ 103,08; 2000 ≈ 103,46; 2001 ≈ 104,43 (subidas de preços de ≈3,1%, 3,5% e 4,4%).</li></ul><h4>Ex. 5.4 – Destaque INE (27 fev. 2026)</h4><p>«PIB em volume cresceu 1,9% em termos homólogos e 0,9% em cadeia no 4.º trimestre de 2025; em 2025 o PIB aumentou 1,9%.» A variação homóloga foi 0,3 p.p. inferior à do trimestre anterior; o contributo negativo da procura externa líquida foi menos acentuado (as importações desaceleraram mais do que compensando a diminuição das exportações); o contributo positivo da procura interna diminuiu de 3,7 p.p. para 2,9 p.p.</p><ul><li><strong>PIB</strong>: valor de mercado de todos os bens e serviços finais produzidos num país num período; riqueza criada no espaço geográfico. Ótica da despesa: <strong>PIB = C + I + G + (X − M)</strong>.</li><li><strong>Procura interna</strong> = C + I + G; <strong>procura externa líquida</strong> = X − M.</li><li><strong>Variação em volume</strong> (a preços constantes, PIB real) mede a evolução das quantidades; a <strong>variação nominal</strong> junta a evolução das quantidades e a dos preços. Valores nominais = quantidades de um período valorizadas aos preços desse período.</li><li><strong>Rendimento</strong> = remuneração dos fatores produtivos («terra», trabalho, capital, capacidade empreendedora), ex.: salário. <strong>Transferência</strong> = não corresponde à remuneração pela criação de riqueza, ex.: subsídio de desemprego; os impostos podem ser vistos como transferências dos agentes para o Estado.</li></ul><h4>Ex. 5.5 e 5.6</h4><ul><li>PIB vs. PNB (interno = espaço geográfico; nacional = residentes/fatores nacionais); PIB vs. PIL (bruto inclui amortizações/depreciações; líquido deduz).</li><li>PIB = C + G + I + X − M é a <strong>ótica da despesa</strong>. C: consumo das famílias; G: gastos do Estado; I: investimento das empresas; X: exportações (outras economias fazem a despesa); M: importações (é a nossa economia que faz a despesa).</li><li>«PIB caiu 1,3% em volume em 2003 face a 2002, a preços constantes de 1995»: calcula-se o PIB de 2002 e de 2003 a preços de 1995 e faz-se [(PIB<sub>2003</sub> − PIB<sub>2002</sub>)/PIB<sub>2002</sub>] × 100.</li></ul><h4>Ex. 5.7 – Limitações do PIB</h4><ul><li><strong>Poluição</strong> na China: degrada o que já existe; conceptualmente o custo deveria ser retirado → o PIB oficial vem <strong>sobreavaliado</strong>.</li><li>Pessoa que deixa o emprego para cuidar da casa e filhos: o PIB <strong>baixa</strong>, pois só se contabiliza o que passa pelo mercado; trabalho para autoconsumo não é valorizado → PIB <strong>subavaliado</strong>.</li><li>Bolos para a família (autoconsumo) ou vendidos à vizinha sem declarar ao fisco (economia paralela): não entram no PIB → PIB <strong>subavaliado</strong>.</li></ul><h4>Ex. 5.8 – PIB real e taxas de crescimento</h4><ul><li>PIB real (em volume): mede o PIB em quantidades, valorizando a preços constantes.</li><li>As flutuações do PIB têm natureza e duração diferentes.</li><li>Trimestres: 1.º jan–mar; 2.º abr–jun; 3.º jul–set; 4.º out–dez.</li><li><strong>Taxa trimestral (em cadeia)</strong>: de um trimestre para o trimestre consecutivo. <strong>Taxa anual</strong>: de um ano para outro (12 meses). <strong>Taxa homóloga</strong>: de um trimestre para o mesmo trimestre do ano seguinte (ex.: 2.º trim. 2019 vs. 2.º trim. 2018).</li><li>A taxa anual «esconde» as flutuações ao longo do ano; a homóloga permite uma perceção do crescimento que não seja devido à <strong>sazonalidade</strong>.</li></ul>","keyTerms":[{"term":"Óticas do produto","def":"Produção (saída das empresas), despesa (utilizadores finais) e rendimento (mercado dos fatores): três medidas da mesma realidade."},{"term":"PIB","def":"Valor de mercado de todos os bens e serviços finais produzidos no espaço geográfico de um país num período (em geral um ano)."},{"term":"PIB real / em volume","def":"PIB valorizado a preços constantes; mede a evolução das quantidades."},{"term":"Deflator do PIB","def":"Rácio PIB nominal / PIB real × 100; mede a evolução dos preços dos bens incluídos no PIB."},{"term":"Rendimento vs. transferência","def":"Rendimento remunera fatores produtivos (ex.: salário); transferência não corresponde a criação de riqueza (ex.: subsídio de desemprego)."},{"term":"Taxa de crescimento homóloga","def":"Variação face ao mesmo trimestre do ano anterior; elimina o efeito da sazonalidade."},{"term":"Taxa em cadeia","def":"Variação face ao trimestre imediatamente anterior."},{"term":"Mercados financeiros","def":"Mercados das poupanças; quem poupa oferece, quem precisa de recursos procura. Qualquer setor pode ser financiador ou financiado líquido."}],"questions":[{"q":"Com o PIB português de 2000 a 115 548 M€ (preços correntes) e o de 2001 a 117 587 M€ (preços de 2000) e 122 801 M€ (preços correntes), a taxa de crescimento real em 2001 foi aproximadamente:","options":["6,3%","4,4%","1,8%","7,6%"],"answer":2,"explanation":"Crescimento real = 117 587/115 548 − 1 ≈ 1,76%. Os 6,3% são a variação nominal (122 801/115 548). Os 4,4% são a variação dos preços (deflator de 2001 ≈ 104,43).","id":"qcg4unx"},{"q":"Segundo o caderno, se uma família produzir bolos para autoconsumo ou os vender à vizinha sem declarar ao fisco, o PIB oficial:","options":["Fica sobreavaliado, porque inclui a produção informal","Fica subavaliado, porque essa produção não é contabilizada","Não é afetado, porque os bolos são bens intermédios","Fica corretamente medido, porque o autoconsumo é imputado"],"answer":1,"explanation":"A produção para autoconsumo e a não declarada não são apanhadas pelas estatísticas, por isso o PIB fica subavaliado. A sobreavaliação aplica-se ao exemplo da poluição.","id":"q1hztiy4"},{"q":"Que taxa de crescimento do PIB compara o 2.º trimestre de 2019 com o 2.º trimestre de 2018, permitindo eliminar o efeito da sazonalidade?","options":["Taxa em cadeia","Taxa anual média","Taxa trimestral consecutiva","Taxa homóloga"],"answer":3,"explanation":"A taxa homóloga compara um trimestre com o mesmo trimestre do ano anterior. A taxa em cadeia compara com o trimestre imediatamente anterior e é afetada pela sazonalidade.","id":"q1em0ls6"}],"key":"u5-5.2 Ex."},{"id":"5.4 Ex.","title":"Caderno de exercícios — Emprego e desemprego (tipos, taxa natural, fluxos)","pages":[315,328],"summary":"<h4>Ex. 5.9 – Tipos de desemprego e taxa natural</h4><ul><li><strong>Friccional</strong>: há emprego para os desempregados, mas desempregados e empregadores ainda não se encontraram; curta duração (ex.: jovem licenciado à procura de emprego na sua área, que existe).</li><li><strong>Estrutural</strong>: não há emprego para as qualificações dos desempregados (pode nem haver emprego nenhum); ex.: evolução tecnológica deixa pessoas sem as competências necessárias.</li><li><strong>Cíclico</strong>: causado pelas flutuações da atividade económica; inclui o desemprego sazonal.</li><li><strong>Taxa natural de desemprego</strong>: taxa de desemprego quando a economia funciona ao nível do <strong>PIB potencial</strong> (normal funcionamento, dado o condicionamento estrutural). Num contexto de eficiência, sem desemprego cíclico nem estrutural, é a taxa de desemprego friccional (curto prazo). Pode ser reduzida por tudo o que faça desempregados e empregadores encontrarem-se mais depressa (redes sociais, tecnologias de informação).</li></ul><h4>Ex. 5.10 – «Desemprego nos jovens atinge os 23%»</h4><p>Não se pode dizer que 23% dos jovens estão desempregados: estão desempregados 23% dos jovens que fazem parte da <strong>população ativa</strong>.</p><h4>Ex. 5.11 – «Desemprego real é de 14,2%» (Sol, nov. 2010)</h4><p>À taxa oficial de 10,9% acrescentam-se 184 mil «inativos disponíveis» (não fazem diligências para encontrar trabalho) e «desencorajados». As estatísticas consideram desempregado quem procura emprego; quem não procura por estar desencorajado não conta, pelo que a taxa oficial pode estar <strong>subavaliada</strong> (estas situações estão, contudo, registadas e podem ser identificadas).</p><ul><li>Frases ligadas a <strong>desemprego estrutural</strong>: «não procuram emprego por considerarem não ter idade ou instrução adequada»; «cerca de um terço dos desempregados está há mais de 25 meses sem trabalho».</li><li>Frase ligada a <strong>desemprego friccional</strong>: «desemprego nos jovens» (23,4%).</li></ul><h4>Ex. 5.12</h4><p>Quem perde o emprego e passa a dedicar-se a tempo inteiro à casa e filhos sai da população ativa: reduz a população ativa e a desempregada e aumenta a inativa → a <strong>taxa de desemprego baixa</strong>.</p><h4>Ex. 5.13 – Fluxos entre estados do mercado de trabalho (INE, 2023, milhares)</h4><p>Os fluxos mostram que, mesmo quando a taxa de desemprego não se altera, há pessoas que ficam desempregadas e outras que se empregam (não são necessariamente as mesmas).</p><table><tr><th>Estado inicial</th><th>Permanecem</th><th>Saídas</th><th>Total início</th></tr><tr><td>Emprego</td><td>EE 4579,4 (93,8%)</td><td>ED 120,8 (2,5%); EI 181,2 (3,7%)</td><td>4881,4</td></tr><tr><td>Desemprego</td><td>DD 114,8 (36,0%)</td><td>DE 130,7 (41,0%); DI 73,6 (23,1%)</td><td>319,1</td></tr><tr><td>Inatividade (16-89)</td><td>II 3155,0 (89,3%)</td><td>IE 268,4 (7,6%); ID 111,1 (3,1%)</td><td>3534,5</td></tr></table><p>Fluxos líquidos: para o emprego +97,1 (9,9 vindos do desemprego e 87,2 da inatividade); para o desemprego +37,5 vindos da inatividade e −9,9 para o emprego; inatividade −124,7. Final: emprego 4978,5; desemprego 366,5; inatividade 3409,8.</p><ul><li>Taxa de desemprego no início = 319,1/(319,1 + 4881,4) × 100 ≈ <strong>6,14%</strong>.</li><li>Taxa no final = 366,5/(366,5 + 4978,5) × 100 ≈ <strong>6,86%</strong> (sem entradas/saídas da população em idade ativa).</li></ul><p><strong>Taxa de desemprego = desempregados / população ativa (empregados + desempregados) × 100.</strong></p>","keyTerms":[{"term":"Desemprego friccional","def":"Há emprego, mas desempregados e empregadores ainda não se encontraram; curta duração."},{"term":"Desemprego estrutural","def":"Não há emprego para as qualificações dos desempregados (ex.: por evolução tecnológica)."},{"term":"Desemprego cíclico","def":"Causado pelas flutuações da atividade económica; inclui o sazonal."},{"term":"Taxa natural de desemprego","def":"Taxa de desemprego ao nível do PIB potencial; num contexto de eficiência corresponde ao desemprego friccional."},{"term":"Taxa de desemprego","def":"Desempregados / população ativa × 100."},{"term":"Desencorajados / inativos disponíveis","def":"Pessoas que querem trabalhar mas não procuram emprego; não contam como desempregadas na taxa oficial."}],"questions":[{"q":"Com os fluxos do Ex. 5.13, no final do período há 366,5 mil desempregados e 4978,5 mil empregados. A taxa de desemprego é aproximadamente:","options":["6,86%","7,36%","6,14%","10,7%"],"answer":0,"explanation":"366,5/(366,5 + 4978,5) = 366,5/5345 ≈ 6,86%. Dividir pelos empregados (366,5/4978,5 ≈ 7,36%) é um erro comum: o denominador é a população ativa. Os 6,14% são a taxa do início do período.","id":"quvscz1"},{"q":"Um desempregado deixa de procurar emprego e passa a dedicar-se a tempo inteiro à casa e aos filhos. Coeteris paribus, a taxa de desemprego oficial:","options":["Aumenta, porque a população ativa diminui","Diminui, porque saem da população ativa e da desempregada e aumenta a inativa","Não se altera, porque a pessoa continua sem emprego","Aumenta, porque passa a contar como desencorajada"],"answer":1,"explanation":"O desempregado passa a inativo: o numerador desce 1 e o denominador também desce 1. Como a taxa é inferior a 100%, ela diminui.","id":"q11uzq5w"},{"q":"«Desemprego nos jovens atinge os 23%» significa que:","options":["23% de todos os jovens do país estão desempregados","23% dos desempregados são jovens","23% dos jovens que fazem parte da população ativa estão desempregados","23% dos jovens são inativos"],"answer":2,"explanation":"A taxa de desemprego mede-se em relação à população ativa. Muitos jovens são estudantes inativos, por isso não se pode dizer que 23% de todos os jovens estão desempregados.","id":"qhoumz5"}],"key":"u5-5.4 Ex."},{"id":"5.5 Ex.","title":"Caderno de exercícios — Inflação e Índice de Preços no Consumidor","pages":[316,328],"summary":"<h4>Ex. 5.14 – IPC em Portugal (base 2008)</h4><table><tr><th>Mês</th><th>2009</th><th>2010</th><th>2011</th><th>2012</th></tr><tr><td>Dezembro</td><td>99,31</td><td>101,81</td><td>105,49</td><td>–</td></tr><tr><td>Novembro</td><td>99,25</td><td>101,51</td><td>105,51</td><td>–</td></tr><tr><td>Outubro</td><td>99,01</td><td>101,34</td><td>105,59</td><td>–</td></tr><tr><td>Setembro</td><td>98,96</td><td>100,91</td><td>104,49</td><td>107,50</td></tr><tr><td>Agosto</td><td>98,77</td><td>100,72</td><td>103,65</td><td>106,84</td></tr><tr><td>Julho</td><td>99,05</td><td>100,92</td><td>104,10</td><td>106,99</td></tr><tr><td>Junho</td><td>99,58</td><td>100,75</td><td>104,18</td><td>107,01</td></tr><tr><td>Maio</td><td>99,51</td><td>100,56</td><td>104,42</td><td>107,24</td></tr><tr><td>Abril</td><td>99,70</td><td>100,42</td><td>104,48</td><td>107,62</td></tr><tr><td>Março</td><td>99,45</td><td>100,02</td><td>104,04</td><td>107,32</td></tr><tr><td>Fevereiro</td><td>98,67</td><td>98,87</td><td>102,39</td><td>106,08</td></tr><tr><td>Janeiro</td><td>98,72</td><td>98,84</td><td>102,40</td><td>105,99</td></tr><tr><td>Soma jan–dez</td><td>2396,64</td><td>1206,67</td><td>1250,74</td><td>–</td></tr><tr><td>Soma out (ano ant.)–set</td><td>–</td><td>1199,58</td><td>1238,82</td><td>1279,16</td></tr></table><p>Pede-se: o que é o IPC, o cabaz de bens considerado, se existe um único IPC (não – há vários índices, ex.: IHPC, por agregados), e as taxas de inflação (resolução na aula teórica). Cálculos:</p><ul><li><strong>Taxa mensal</strong> = IPC<sub>mês</sub>/IPC<sub>mês anterior</sub> − 1: dez. 2011 = 105,49/105,51 − 1 ≈ <strong>−0,02%</strong>; set. 2012 = 107,50/106,84 − 1 ≈ <strong>0,62%</strong>.</li><li><strong>Taxa homóloga</strong> = IPC<sub>mês</sub>/IPC<sub>mesmo mês do ano anterior</sub> − 1: dez. 2011 = 105,49/101,81 − 1 ≈ <strong>3,61%</strong>; set. 2012 = 107,50/104,49 − 1 ≈ <strong>2,88%</strong>.</li><li><strong>Taxa média</strong> (últimos 12 meses face aos 12 anteriores) = soma dos 12 meses / soma dos 12 meses anteriores − 1: dez. 2011 = 1250,74/1206,67 − 1 ≈ <strong>3,65%</strong>; set. 2012 = 1279,16/1238,82 − 1 ≈ <strong>3,26%</strong>.</li></ul>","keyTerms":[{"term":"IPC","def":"Índice que mede a evolução dos preços de um cabaz de bens e serviços representativo do consumo das famílias."},{"term":"Taxa de inflação mensal","def":"Variação do índice face ao mês anterior."},{"term":"Taxa de inflação homóloga","def":"Variação do índice face ao mesmo mês do ano anterior."},{"term":"Taxa de inflação média","def":"Variação da média (ou soma) dos últimos 12 meses face à média dos 12 meses anteriores."}],"questions":[{"q":"Com IPC de setembro de 2012 = 107,50 e de setembro de 2011 = 104,49, a taxa de inflação homóloga em setembro de 2012 é aproximadamente:","options":["0,62%","3,26%","3,61%","2,88%"],"answer":3,"explanation":"107,50/104,49 − 1 ≈ 2,88%. Os 0,62% são a taxa mensal (face a agosto de 2012, 106,84) e os 3,26% são a taxa média dos últimos 12 meses.","id":"qrkw11s"}],"key":"u5-5.5 Ex."}]},{"n":6,"title":"A moeda","short":"Moeda","sections":[{"id":"6.1","title":"A moeda: para que serve e características","pages":[175,180],"summary":"<h4>Capítulo 6 – A Moeda</h4>\n<p>Subtemas: 6.1 Para que serve a moeda?; 6.2 Funções e definição de moeda; 6.3 Oferta de moeda; 6.4 Procura de moeda; 6.5 Mercado monetário, taxa de juro e nível de preços; 6.6 Teoria quantitativa da moeda. Os apontamentos seguem em parte o capítulo \"Crédito, bancos e política monetária\" de César das Neves (Introdução à Economia, 2011) e o capítulo \"Moeda e o Sistema Financeiro\" de Samuelson (ed. portuguesa 2012). Abertura com Mateus 6, 24-34: «Não podeis servir a Deus e ao dinheiro» e a pintura <em>No Watermark</em> (Spencelayh, 1933).</p>\n<h4>O aparecimento da moeda</h4>\n<p>Porque e como terá surgido a moeda? Uma forma de responder é <strong>pensarmos num mundo sem moeda</strong> (troca direta).</p>\n<p><strong>Nota:</strong> em economia, \"moeda\" usa-se no sentido anglo-saxónico de <em>money</em>. Não confundir com as moedas metálicas do porta-moedas, nem com \"dinheiro\" num sentido amplo; a moeda metálica é um caso particular do conceito geral de moeda.</p>\n<h4>O que é a moeda? – definida pelas suas funções</h4>\n<ul><li><strong>Meio de troca / pagamento das transações</strong></li><li><strong>Unidade de conta</strong></li><li><strong>Reserva de valor</strong></li></ul>\n<h4>Características que a moeda deve ter para cumprir estas funções</h4>\n<ul><li>Ser divisível</li><li>Ser durável</li><li>Ter aceitabilidade geral</li><li>Ter reduzida procura não monetária</li><li>Manter o valor ao longo do tempo</li><li>Ser prática de movimentar</li><li>Ser dificilmente falsificável</li></ul>\n<p>Estas características prendem-se com a evolução da moeda e com o que serviu de moeda ao longo do tempo: sal, metais preciosos, moeda cunhada, notas. Atualmente a moeda segue uma tendência de <strong>desmaterialização</strong>.</p>\n<p>A moeda, tal como a conhecemos hoje, <strong>assenta na confiança</strong>: as pessoas aceitam moeda porque confiam no seu valor e em que os outros a aceitarão.</p>","keyTerms":[{"term":"Moeda (money)","def":"Conceito económico geral definido pelas funções de meio de troca, unidade de conta e reserva de valor; não se confunde com moedas metálicas."},{"term":"Desmaterialização da moeda","def":"Tendência atual de a moeda deixar de ter suporte físico (depósitos, meios eletrónicos)."},{"term":"Confiança","def":"Fundamento da moeda atual: aceita-se porque se confia no seu valor e na aceitação pelos outros."}],"questions":[{"q":"Qual das seguintes NÃO é uma característica que a moeda deve ter para cumprir as suas funções, segundo as aulas?","options":["Ser divisível","Ser dificilmente falsificável","Ter aceitabilidade geral","Ter elevada procura não monetária"],"answer":3,"explanation":"A moeda deve ter REDUZIDA procura não monetária (para não ser desviada para outros usos). Divisibilidade, aceitabilidade geral e difícil falsificação constam da lista.","id":"q1wxdye2"}],"key":"u6-6.1"},{"id":"6.2","title":"Funções da moeda e definição de moeda (agregados monetários)","pages":[180,182],"summary":"<h4>Funções da moeda</h4>\n<table><tr><th>Função</th><th>De que depende</th></tr>\n<tr><td><strong>Intermediário geral das trocas</strong> (meio de troca para pagamento de transações)</td><td>Do nº de trocas/transações na economia, que depende do <strong>rendimento (PIB)</strong>. Quanto maior o rendimento, maior o nº de transações necessárias.</td></tr>\n<tr><td><strong>Unidade de conta</strong></td><td>Das unidades em que está expresso o valor da moeda. Requer estabilidade da unidade de referência; serve para comparar o valor de diferentes bens.</td></tr>\n<tr><td><strong>Reserva de valor</strong></td><td>Da <strong>taxa de juro nominal</strong>. Quanto maior a taxa de juro nominal, <strong>menos</strong> a moeda rende (relativamente) quando usada como forma de guardar valor.</td></tr></table>\n<p>Exemplo do Tio Patinhas: tira prazer do próprio dinheiro – uma <strong>procura não monetária</strong> da moeda, que não se enquadra em nenhuma das três funções.</p>\n<h4>O que habitualmente é entendido como moeda (agregados monetários)</h4>\n<ul>\n<li><strong>C</strong> – Circulação (notas e moedas).</li>\n<li><strong>M<sub>1</sub> = C + Depósitos à ordem</strong> (tudo o que tenha conversão imediata, ex. traveler's checks; é a moeda para transações).</li>\n<li><strong>M<sub>2</sub> = M<sub>1</sub> + Depósitos a prazo</strong> (e outros depósitos com liquidez do tipo dos depósitos a prazo).</li>\n<li><strong>M<sub>3</sub> = M<sub>2</sub> + Depósitos com menor liquidez</strong> …</li>\n</ul>\n<p>O que se define como moeda prende-se, em primeiro lugar, com a sua <strong>liquidez</strong>; em segundo, com render ou não juros. A moeda é uma forma de deter riqueza: está em causa <strong>procurar e deter moeda versus outros títulos de propriedade</strong>.</p>\n<p><strong>Importante:</strong> os <strong>depósitos constituem moeda</strong>, a par das notas e moedas metálicas; o que é entendido como moeda está na base da <strong>oferta de moeda</strong>.</p>","keyTerms":[{"term":"Meio de troca","def":"Função de intermediário geral das trocas; a sua importância depende do nº de transações, ligado ao PIB."},{"term":"Unidade de conta","def":"Função de medida comum do valor dos bens; exige estabilidade da unidade."},{"term":"Reserva de valor","def":"Função de guardar riqueza; o seu custo depende da taxa de juro nominal."},{"term":"M1","def":"Circulação (notas e moedas) + depósitos à ordem."},{"term":"M2","def":"M1 + depósitos a prazo."},{"term":"M3","def":"M2 + depósitos com menor liquidez."},{"term":"Liquidez","def":"Facilidade/rapidez de conversão num meio de pagamento; principal critério para definir moeda."}],"questions":[{"q":"O agregado monetário M1 corresponde a:","options":["Notas e moedas em circulação apenas","Circulação + depósitos à ordem + depósitos a prazo","Circulação + depósitos à ordem","Depósitos a prazo + depósitos com menor liquidez"],"answer":2,"explanation":"M1 = C + depósitos à ordem (moeda para transações). Acrescentar depósitos a prazo dá M2; só notas e moedas é C.","id":"qb65l59"},{"q":"Segundo as aulas, a função de reserva de valor da moeda depende sobretudo:","options":["Da taxa de juro nominal","Do número de transações","Do PIB real","Da estabilidade da unidade de conta apenas"],"answer":0,"explanation":"Quanto maior a taxa de juro nominal, menos compensa guardar valor em moeda (que não rende juros). O PIB e o nº de transações relacionam-se com a função meio de troca.","id":"q1bm4d90"}],"key":"u6-6.2"},{"id":"6.3","title":"A oferta de moeda: bancos, multiplicador monetário e Banco Central","pages":[183,188],"summary":"<p>A oferta de moeda designa-se <strong>M<sup>S</sup></strong> (M de <em>money</em>, S de <em>supply</em>).</p>\n<h4>Entidades que participam na oferta de moeda</h4>\n<p>Nas sociedades modernas a oferta de moeda é feita <strong>pelo Estado, através do Banco Central, em conjugação com os bancos que concedem crédito</strong>. Os bancos participam na criação de moeda <strong>através da concessão de crédito e do multiplicador monetário</strong>. Distinguir bancos em geral (intermediação financeira, crédito) dos bancos centrais (ex. BCE).</p>\n<h4>Os bancos e o multiplicador monetário</h4>\n<p>Circuito: montante inicialmente depositado → depósito → parte fica como <strong>reservas</strong> (legais e desejadas: parte dos depósitos que o banco não empresta) → o resto é <strong>crédito</strong> → parte do crédito fica em <strong>circulação</strong> (dinheiro que não fica depositado) e parte volta a ser depositada → novo crédito…</p>\n<p><strong>Exemplo:</strong> depósito inicial 1000; reservas 10%; crédito 90%; sem fugas para a circulação. Depósitos sucessivos: 1000; 900; 810; 729; …</p>\n<p>Soma: 1000 + 1000×0,9 + 1000×0,9×0,9 + … = 1000 / (1 − 0,9) = <strong>10 000</strong> (soma de uma progressão geométrica de razão 0,9 – nota técnica não exigida).</p>\n<p><strong>Multiplicador monetário</strong> = 10 000 / 1000 = 10, ou seja <strong>1 / (taxa de reservas) = 1/0,1 = 10</strong>.</p>\n<h4>Papel do Banco Central na oferta de moeda</h4>\n<ul>\n<li>Cria as notas e moedas – a <strong>base monetária</strong>, que é a base dos depósitos iniciais. A parte não depositada fica em circulação; no final todas as notas e moedas estão em circulação ou em reservas dos bancos: <strong>BM = Circulação + Reservas</strong>.</li>\n<li>Pode retirar ou lançar moeda em circulação: através de <strong>operações de mercado aberto (<em>open market</em>)</strong> – compra e venda de títulos do Estado; através da <strong>taxa de redesconto</strong> e da concessão de empréstimos aos bancos.</li>\n<li>Pode definir a <strong>taxa de reserva legal</strong> dos bancos.</li>\n<li>Pode regular diretamente a atividade dos bancos: autorizar abertura/encerramento de bancos; fixar taxas de juro (distinguir taxas ativas, passivas, de curto e de longo prazo); fixar limites de crédito; regular o mandato dos administradores; outras medidas não tipificadas.</li>\n</ul>\n<h4>Open market</h4>\n<p>Nas economias desenvolvidas (EUA – FED; UE – BCE) a oferta de moeda aumenta/diminui sobretudo por <em>open market</em>: compra/venda pelo Banco Central de títulos do Estado. Ex.: se o BC compra aos bancos dívida alemã com moeda nova, está a <strong>\"injetar liquidez\"</strong> (entra moeda, saem títulos); se vende títulos, está a <strong>retirar liquidez</strong>. Usam-se títulos do Estado por serem, em princípio, de confiança.</p>\n<h4>Taxa de redesconto e reservas</h4>\n<ul>\n<li><strong>Taxa de redesconto</strong>: taxa de juro dos empréstimos do Banco Central aos bancos. Chama-se redesconto porque os bancos descontam de novo, junto do BC, títulos (ex. dívida pública) que os clientes usaram para obter dinheiro.</li>\n<li><strong>Reservas</strong>: parte dos depósitos que o banco não usa para emprestar e guarda para responder aos levantamentos.</li>\n<li><strong>Reserva legal</strong>: percentagem dos depósitos que, por imposição legal (fixada pelo BC), não pode ser emprestada; faz parte das reservas em geral.</li>\n</ul>\n<h4>Emissão de moeda para financiar diretamente o Estado</h4>\n<p>O Estado pode financiar-se criando moeda nova (BC imprime notas e entrega-as ao Estado, ou faz depósitos eletrónicos nas contas do Estado). Mais comum em economias menos desenvolvidas e em crise. É <strong>proibido na União Europeia</strong> (aumenta a inflação; é como um imposto sobre quem tem moeda). Também aumenta a base monetária e a oferta de moeda. <strong>Diferença face ao open market:</strong> no open market um ativo (títulos) é <em>trocado</em> por outro (moeda); no financiamento do Estado a moeda aumenta <strong>sem contrapartida</strong>.</p>\n<h4>Oferta de moeda e entrada de divisas</h4>\n<p>O depósito nos bancos de divisas credíveis (dólares, libras) também permite aos bancos aumentar o crédito concedido, logo a oferta de moeda.</p>","keyTerms":[{"term":"Oferta de moeda (MS)","def":"Quantidade de moeda na economia, criada pelo Banco Central em conjugação com os bancos que concedem crédito."},{"term":"Multiplicador monetário","def":"Rácio entre a moeda total criada e o depósito inicial; sem fugas para a circulação = 1 / taxa de reservas."},{"term":"Base monetária","def":"Notas e moedas criadas pelo Banco Central: BM = Circulação + Reservas."},{"term":"Open market","def":"Compra/venda de títulos (do Estado) pelo Banco Central para injetar ou retirar liquidez."},{"term":"Taxa de redesconto","def":"Taxa de juro dos empréstimos concedidos pelo Banco Central aos bancos."},{"term":"Reserva legal","def":"Percentagem dos depósitos que, por lei (fixada pelo BC), os bancos não podem emprestar."}],"questions":[{"q":"Um depósito inicial de 2000 € é feito num sistema bancário em que a taxa de reservas é 20% e não há fugas para a circulação. Qual o montante total de depósitos gerado?","options":["2 400 €","4 000 €","20 000 €","10 000 €"],"answer":3,"explanation":"Multiplicador = 1/0,2 = 5; depósitos totais = 2000 × 5 = 10 000 €. 2400 seria aplicar apenas 1+0,2; 20 000 usaria multiplicador 10 (taxa de 10%).","id":"qiht0x"},{"q":"Se o Banco Central comprar títulos do Estado aos bancos (operação de open market), então:","options":["Retira liquidez e a oferta de moeda diminui","Injeta liquidez e a oferta de moeda aumenta","A base monetária mantém-se, porque há troca de ativos","Está a financiar diretamente o Estado, o que é proibido na UE"],"answer":1,"explanation":"Ao comprar títulos paga com moeda nova: injeta liquidez. Embora haja troca de ativos (títulos por moeda), a moeda em circulação/reservas aumenta. Não é financiamento direto do Estado, porque os títulos são comprados aos bancos, com contrapartida.","id":"q9dhxji"},{"q":"A base monetária (BM) é definida nas aulas como:","options":["Circulação mais reservas dos bancos","Circulação mais depósitos à ordem","Depósitos à ordem mais depósitos a prazo","Reservas legais menos reservas desejadas"],"answer":0,"explanation":"As notas e moedas criadas pelo BC acabam em circulação ou em reservas: BM = Circulação + Reservas. Circulação + depósitos à ordem é M1.","id":"q1kcwhh9"}],"key":"u6-6.3"},{"id":"6.4","title":"A procura de moeda","pages":[188,189],"summary":"<p>A procura de moeda designa-se <strong>M<sup>D</sup></strong> (D de <em>demand</em>).</p>\n<h4>Funções da moeda e procura de moeda</h4>\n<ul>\n<li>Por ser <strong>intermediário geral das trocas</strong>, a procura de moeda depende do <strong>PIB nominal</strong> (que depende do PIB real e do nível de preços).</li>\n<li>Por ser <strong>reserva de valor</strong>, depende da <strong>taxa de juro nominal</strong>, que é o <strong>custo de oportunidade de deter moeda</strong> (a moeda não rende juros face a outros títulos que rendem).</li>\n</ul>\n<p><strong>A procura de moeda depende então:</strong> do PIB real (<strong>Y</strong>), do nível de preços (<strong>P</strong>), da taxa de juro nominal (<strong>i</strong>) e ainda do <strong>enquadramento estrutural financeiro</strong>.</p>\n<table><tr><th>Variável</th><th>Efeito na procura de moeda</th></tr>\n<tr><td>Y ↑ (PIB/rendimento)</td><td>M<sup>D</sup> ↑ – mais moeda como meio de troca/pagamento</td></tr>\n<tr><td>P ↑ (nível de preços)</td><td>M<sup>D</sup> ↑ – é necessária mais moeda para fazer as transações</td></tr>\n<tr><td>i ↑ (juro nominal)</td><td>M<sup>D</sup> ↓ – menos moeda como reserva de valor; as alternativas que rendem juros tornam-se mais atrativas</td></tr></table>","keyTerms":[{"term":"Procura de moeda (MD)","def":"Quantidade de moeda que os agentes desejam deter; depende de Y, P, i e do enquadramento financeiro."},{"term":"Custo de oportunidade de deter moeda","def":"A taxa de juro nominal que se deixa de ganhar por ter moeda em vez de títulos que rendem juros."}],"questions":[{"q":"Ceteris paribus, qual das seguintes alterações DIMINUI a procura de moeda?","options":["Aumento do PIB real","Aumento do nível de preços","Aumento da taxa de juro nominal","Aumento do número de transações na economia"],"answer":2,"explanation":"Uma taxa de juro nominal mais alta aumenta o custo de oportunidade de deter moeda, reduzindo a procura. Y, P e o nº de transações aumentam a procura de moeda para transações.","id":"q9l8ryi"}],"key":"u6-6.4"},{"id":"6.5","title":"Mercado monetário, taxa de juro e nível de preços","pages":[190,193],"summary":"<h4>Mercado monetário e taxa de juro nominal</h4>\n<p>Gráfico: eixo vertical <strong>i</strong> (taxa de juro nominal), eixo horizontal <strong>M</strong> (quantidade nominal de moeda). <strong>M<sup>S</sup></strong> (oferta nominal) é uma <strong>reta vertical</strong>; <strong>M<sup>D</sup> = M<sup>D</sup>(i | dados P e Y)</strong> é <strong>decrescente</strong>. Enquadramento: P e Y fixos, logo a procura só depende de i. Oferta e procura conjugam-se num <strong>equilíbrio no mercado monetário</strong>.</p>\n<p>A taxa de juro nominal é o custo de oportunidade de deter moeda para transações (moeda que não vence juros), podendo ser considerada <strong>o preço de deter moeda</strong>.</p>\n<p><strong>Exemplo:</strong> tenho 100 € e a taxa de juro é 10%. Se aplicar, no fim do ano tenho 110 €; se não aplicar, tenho 100 €: perco 10 € por não fazer a aplicação. (O preço de qualquer bem tem a natureza de um custo de oportunidade.)</p>\n<h4>O ajustamento no mercado monetário</h4>\n<p>Para P e Y constantes, o ajustamento entre procura e oferta de moeda faz-se pela <strong>compra e venda de títulos</strong> que proporcionam um dado rendimento, e consequente alteração da taxa de juro nominal implícita na sua rendibilidade:</p>\n<ul>\n<li>À esquerda do equilíbrio (i acima do equilíbrio, excesso de oferta de moeda): os agentes <strong>compram títulos</strong> → i desce.</li>\n<li>À direita (i abaixo do equilíbrio, excesso de procura de moeda): os agentes <strong>vendem títulos</strong> → i sobe.</li>\n</ul>\n<p>Está em causa deter moeda (que não vence juros) versus ter outros títulos que vencem juros – ex. títulos do tesouro (empréstimo ao Estado) ou ações (rendem dividendos, situação da mesma natureza).</p>\n<h4>Mercado monetário e nível de preços</h4>\n<p>Gráfico com <strong>P</strong> no eixo vertical e <strong>M</strong> no horizontal; Y e i fixos. <strong>M<sup>S</sup></strong> vertical; <strong>M<sup>D</sup> = M<sup>D</sup>(P | dados Y e i)</strong> <strong>crescente</strong> (mais preços → mais moeda procurada).</p>\n<ul>\n<li><strong>Subida do PIB (Y)</strong>, com oferta constante: M<sup>D</sup> desloca-se para a <strong>direita</strong> → o nível de preços <strong>desce</strong>. Se Y desce, M<sup>D</sup> vai para a esquerda → preços <strong>sobem</strong>.</li>\n<li><strong>Subida da oferta de moeda</strong>, com procura fixa (<em>ceteris paribus</em>): M<sup>S</sup> desloca-se para a direita → preços <strong>aumentam</strong>. Se a oferta diminui, os preços diminuem.</li>\n</ul>","keyTerms":[{"term":"Mercado monetário","def":"Mercado onde se conjugam oferta (MS, vertical) e procura de moeda (MD), determinando a taxa de juro nominal (ou o nível de preços)."},{"term":"Taxa de juro nominal como preço da moeda","def":"Custo de oportunidade de deter moeda para transações em vez de títulos que vencem juros."},{"term":"Ajustamento via títulos","def":"Excesso de oferta de moeda leva à compra de títulos (i desce); excesso de procura leva à venda (i sobe)."}],"questions":[{"q":"No gráfico do mercado monetário com P no eixo vertical (Y e i constantes), o que acontece ao nível de preços se o PIB real aumentar e a oferta nominal de moeda se mantiver?","options":["Sobe, porque a procura de moeda se desloca para a esquerda","Desce, porque a procura de moeda se desloca para a direita","Sobe, porque a oferta de moeda se desloca para a direita","Não se altera, porque a oferta de moeda é vertical"],"answer":1,"explanation":"Com mais rendimento procura-se mais moeda: MD desloca-se para a direita e interseta a MS vertical num P mais baixo. A deslocação para a esquerda corresponde a uma descida de Y.","id":"q1o2to9p"},{"q":"Com P e Y constantes, se a taxa de juro nominal estiver acima da de equilíbrio (excesso de oferta de moeda), o ajustamento faz-se por:","options":["Venda de títulos, o que faz subir a taxa de juro","Subida do nível de preços","Aumento da oferta de moeda pelo Banco Central","Compra de títulos, o que faz descer a taxa de juro"],"answer":3,"explanation":"Quem tem moeda a mais compra títulos; a procura de títulos faz subir o seu preço e descer a rendibilidade implícita (i) até ao equilíbrio. A venda de títulos ocorre com excesso de procura de moeda.","id":"q107eo7j"},{"q":"Tem 500 € e a taxa de juro nominal anual é de 4%. Qual é o custo de oportunidade de manter esse montante em moeda durante um ano?","options":["4 €","50 €","20 €","520 €"],"answer":2,"explanation":"Perde-se o juro que a aplicação renderia: 500 × 0,04 = 20 €. 520 € é o valor final da aplicação, não o custo de oportunidade.","id":"q1n68akd"}],"key":"u6-6.5"},{"id":"6.6","title":"A teoria quantitativa da moeda","pages":[194,195],"summary":"<p>A teoria parte da <strong>equação geral das trocas</strong>. De forma simples: a <strong>taxa de inflação</strong> (taxa de crescimento geral dos preços) corresponde à <strong>taxa de crescimento da oferta de moeda menos a taxa de crescimento do PIB real</strong>.</p>\n<p><strong>Crescimento dos preços ≈ Crescimento da oferta de moeda − Crescimento do PIB real</strong></p>\n<p><strong>Exemplo:</strong> oferta de moeda cresce 20%, PIB real cresce 5% → preços crescem 20% − 5% = <strong>15%</strong>.</p>\n<p>O cálculo exato é forçado, mas a perspetiva qualitativa é válida: para os preços se manterem estáveis, a oferta de moeda (Governo/Banco Central) deve <strong>acompanhar as necessidades de moeda</strong> devidas ao aumento das transações por o PIB real ter aumentado. Se a oferta exceder essas necessidades, há subida de preços – ilustrado pelas várias hiperinflações da história.</p>\n<p><strong>Conclusão muito importante: a prazo, a inflação é sempre um fenómeno monetário.</strong></p>","keyTerms":[{"term":"Teoria quantitativa da moeda","def":"Teoria, baseada na equação geral das trocas, segundo a qual a inflação ≈ crescimento da oferta de moeda − crescimento do PIB real."},{"term":"Hiperinflação","def":"Subida muito elevada dos preços, resultante de a oferta de moeda exceder largamente as necessidades da economia."}],"questions":[{"q":"Segundo a versão simplificada da teoria quantitativa da moeda, se a oferta de moeda crescer 8% e o PIB real 3%, a inflação será aproximadamente:","options":["5%","11%","3%","8%"],"answer":0,"explanation":"Inflação ≈ 8% − 3% = 5%. Somar (11%) é o erro típico; 8% ignora o crescimento das necessidades de moeda pelo aumento do PIB real.","id":"q18cij28"},{"q":"A 'conclusão muito importante' da teoria quantitativa da moeda é que:","options":["A inflação é sempre causada por subidas de salários","A oferta de moeda não influencia os preços no longo prazo","O crescimento do PIB real provoca sempre inflação","A prazo, a inflação é sempre um fenómeno monetário"],"answer":3,"explanation":"Se a oferta de moeda crescer mais do que as necessidades de transações, os preços sobem: a prazo a inflação é um fenómeno monetário. O crescimento do PIB real, pelo contrário, reduz a inflação para uma dada oferta de moeda.","id":"qm9tj2q"}],"key":"u6-6.6"},{"id":"6.1 Ex.","title":"Caderno de exercícios — A moeda: funções, criação de moeda, juro e teoria quantitativa","pages":[317,330],"summary":"<h4>Ex. 6.1 e 6.2 – Funções e componentes da moeda</h4><ul><li>Três funções: <strong>intermediário geral das trocas</strong> (fazer transações), <strong>unidade de conta</strong> (medida comum do valor dos bens) e <strong>reserva de valor</strong> (guardar riqueza).</li><li>A função de intermediário das trocas está relacionada com o <strong>PIB</strong>: quanto maior o PIB, maior o número de transações.</li><li>A moeda guarda riqueza mas não rende juros: o <strong>juro nominal é o custo de deter riqueza sob a forma de moeda</strong> (relação com a taxa de juro nominal).</li><li>Definição mais restrita: agregado <strong>M1</strong> = Circulação (notas e moedas) + Depósitos à Ordem – maior liquidez, não rende juros. Definições menos restritas: M2, M3, etc.</li></ul><h4>Multiplicador do crédito bancário / criação de moeda pelos bancos comerciais</h4><p>A partir de um depósito, o banco concede crédito; o crédito permite fazer transações e constitui riqueza → configura-se como <strong>moeda</strong> (em geral sob a forma de depósitos à ordem). Uma parte do crédito volta a ser depositada e origina mais crédito; após várias iterações o crédito total é <strong>superior ao depósito inicial</strong>. O aumento do crédito bancário configura um <strong>aumento da oferta de moeda</strong>.</p><h4>Títulos de rendimento fixo e taxa de juro (Ex. 6.2 c)</h4><ul><li>Maior <strong>oferta</strong> de títulos → preço baixa → como o rendimento é fixo, a <strong>rendibilidade aumenta</strong> → taxas de juro mais altas.</li><li>Maior <strong>procura</strong> de títulos → preço sobe → rendibilidade diminui → taxas de juro mais baixas.</li><li>Preço dos títulos e taxa de juro variam em <strong>sentido inverso</strong>.</li></ul><h4>Ex. 6.3 – Eric Cantona e a corrida aos depósitos (2010)</h4><p>O dinheiro depositado corresponde, na maior parte, a crédito concedido com base em reservas de montante inferior. Um levantamento generalizado reduz as reservas e o crédito – o <strong>multiplicador funciona ao contrário</strong>, diminuindo a oferta de moeda; se os levantamentos excederem as reservas, o banco não os consegue assegurar e pode ir à <strong>falência (bancarrota)</strong>. Já levantar dinheiro de um banco e depositá-lo noutro (o que Cantona fez, 750 mil €) <strong>não tem impacto no sistema bancário</strong>: o crédito diminui num banco e aumenta no mesmo montante no outro.</p><h4>Ex. 6.4 e 6.5 – Inflação e teoria quantitativa</h4><ul><li>Inflação = subida geral dos preços, calculada como taxa de variação de um índice geral de preços. É um <strong>fenómeno essencialmente monetário</strong>: por detrás está normalmente um crescimento da oferta de moeda acima do crescimento da economia (PIB); relação tanto mais válida quanto mais continuada for a subida.</li><li>Aumentar a oferta de moeda sem limite <strong>não resolve o problema económico</strong>: a moeda está relacionada com a riqueza; só faz aumentar os preços (inflação).</li><li><strong>Teoria quantitativa</strong>: inflação ≈ crescimento da moeda − crescimento do PIB. Para os preços não se alterarem, a moeda deve crescer <strong>ao mesmo ritmo que o PIB</strong> (real).</li></ul>","keyTerms":[{"term":"Funções da moeda","def":"Intermediário geral das trocas, unidade de conta e reserva de valor."},{"term":"M1","def":"Circulação (notas e moedas) + depósitos à ordem; agregado de maior liquidez."},{"term":"Multiplicador do crédito","def":"Processo pelo qual depósitos geram crédito que volta a ser depositado, criando moeda em montante superior ao depósito inicial."},{"term":"Custo de deter moeda","def":"A taxa de juro nominal que se deixa de receber por manter riqueza em moeda."},{"term":"Teoria quantitativa da moeda","def":"A inflação é aproximadamente igual à diferença entre o crescimento da moeda e o crescimento do PIB."}],"questions":[{"q":"Se aumentar a procura de títulos de rendimento fixo, o que acontece ao seu preço e à taxa de juro?","options":["O preço sobe e a rendibilidade/taxa de juro desce","O preço sobe e a taxa de juro também sobe","O preço desce e a taxa de juro sobe","O preço desce e a taxa de juro desce"],"answer":0,"explanation":"Com rendimento fixo, um preço mais alto significa menor rendibilidade, logo taxas de juro mais baixas. Preço e taxa de juro movem-se em sentido inverso.","id":"q9qijwq"},{"q":"Segundo a teoria quantitativa da moeda, se o PIB real crescer 2% e a oferta de moeda crescer 5%, a inflação será aproximadamente:","options":["7%","2%","3%","5%"],"answer":2,"explanation":"Inflação ≈ crescimento da moeda − crescimento do PIB = 5% − 2% = 3%. Para os preços ficarem estáveis, a moeda teria de crescer 2%, ao ritmo do PIB.","id":"q1b6rf5a"},{"q":"Eric Cantona levantou 750 mil € de um banco e depositou-os noutro. Segundo o caderno, qual o efeito na oferta de moeda do sistema bancário?","options":["Diminui, porque o multiplicador funciona ao contrário","Praticamente nenhum: o crédito diminui num banco e aumenta no mesmo montante no outro","Aumenta, porque o novo banco cria moeda adicional","Diminui na totalidade dos 750 mil €"],"answer":1,"explanation":"A transferência entre bancos não afeta o sistema no seu conjunto. Só um levantamento sem novo depósito, como a corrida proposta, poria o multiplicador a funcionar ao contrário.","id":"q1le43c6"}],"key":"u6-6.1 Ex."}]},{"n":7,"title":"Economia mundial, taxa de câmbio e balança de pagamentos","short":"Câmbio e BP","sections":[{"id":"7.1","title":"Economia mundial: abertura ao exterior e enquadramento económico","pages":[195,197],"summary":"<h4>Capítulo 7 – Economia mundial, taxa de câmbio e balança de pagamentos</h4>\n<p>Subtemas: 7.1 Mudança no enquadramento com a abertura ao exterior; 7.2 Mercado de divisas; 7.3 Regimes cambiais e política cambial; 7.4 PPC e taxa de câmbio; 7.5 Balança de pagamentos; Anexo 1 – notícia sobre abertura ao exterior. Imagem de abertura: <em>O cambista e a sua mulher</em> (Marinus van Reymerswaele, 1539).</p>\n<h4>A abertura ao exterior muda o enquadramento económico</h4>\n<ul>\n<li>Todas as economias são, em maior ou menor grau, <strong>economias abertas</strong>.</li>\n<li>Entre economias há movimentos e trocas de bens finais e de recursos, incluindo fatores de produção; o trabalho e o capital, incluindo as ideias, circulam entre economias.</li>\n</ul>\n<p><strong>Diferenças para empresas e consumidores por se tratar de Estados soberanos diferentes:</strong> enquadramentos legais; moedas; comportamento do Estado; segurança nas transações internas.</p>\n<p>Nota: a análise da abertura ao exterior ajuda também a perceber a dinâmica das relações económicas entre regiões de uma mesma economia.</p>","keyTerms":[{"term":"Economia aberta","def":"Economia com trocas de bens, serviços e fatores (trabalho, capital, ideias) com o exterior; todas o são em maior ou menor grau."}],"questions":[],"key":"u7-7.1"},{"id":"7.2","title":"Mercado de divisas e taxa de câmbio","pages":[198,201],"summary":"<h4>Divisas</h4>\n<p>Chama-se <strong>divisas à moeda estrangeira</strong>. Ex.: para Portugal, o dólar americano, o real brasileiro e a libra esterlina são divisas.</p>\n<h4>Taxa de câmbio</h4>\n<p>É o <strong>preço de uma moeda expresso em unidades de outra moeda</strong>. Duas formas:</p>\n<ul>\n<li><strong>Forma direta</strong>: preço de uma unidade de moeda estrangeira em moeda nacional (ex.: quantos euros custa 1 USD).</li>\n<li><strong>Forma indireta</strong>: preço de uma unidade de moeda nacional em moeda estrangeira (ex.: quantos USD custa 1 euro).</li>\n</ul>\n<p><strong>Muito importante: na cruz marshalliana do mercado cambial usa-se a forma direta</strong> (e = €/US$).</p>\n<h4>Procura e oferta de moeda estrangeira</h4>\n<table><tr><th>Procura (D) de divisas – para:</th><th>Oferta (S) de divisas – proveniente de:</th></tr>\n<tr><td>Importar; viajar para o estrangeiro; enviar transferências, rendimentos e capital para fora; etc.</td><td>Exportar; turismo de visitantes estrangeiros; receber transferências, rendimentos e capital de fora; etc.</td></tr></table>\n<p>Gráfico: eixo vertical <strong>e = €/US$</strong> (nº de euros a pagar por cada dólar; \"e\" de <em>exchange</em>), eixo horizontal quantidade de US$. Procura D decrescente, oferta S crescente. <strong>e*</strong> = taxa de câmbio de equilíbrio: se o mercado cambial for livre, forma-se e conduz ao equilíbrio entre procura e oferta de moeda estrangeira.</p>\n<h4>O mercado tende para o equilíbrio</h4>\n<ul>\n<li><strong>Procura de moeda estrangeira aumenta</strong> (D → D'): ao câmbio inicial há excesso de procura → a taxa de câmbio <strong>sobe</strong> (o dólar valoriza, o euro desvaloriza). Se não subisse, o euro ficaria <strong>sobrevalorizado</strong> e o dólar subvalorizado.</li>\n<li><strong>Oferta de moeda estrangeira aumenta</strong> (S → S'): ao câmbio inicial há excesso de oferta → a taxa de câmbio <strong>desce</strong>. Se não descesse, o euro ficaria <strong>subvalorizado</strong> e o dólar sobrevalorizado.</li>\n</ul>\n<p><strong>Exemplo</strong> (ponto de partida 1 USD = 2 €): (i) mais portugueses querem ir aos EUA → querem mais USD ao mesmo preço; estão dispostos a pagar mais euros por dólar; a 2 €/USD o dólar estaria subvalorizado e o euro sobrevalorizado → e sobe. (ii) mais exportações para os EUA pagas em USD → quem recebe vende-os, a oferta aumenta; a 2 €/USD o dólar estaria sobrevalorizado e o euro subvalorizado → e desce.</p>\n<p>Se o mercado cambial for livre, a taxa de câmbio que se forma conduz ao equilíbrio entre procura e oferta de moeda estrangeira.</p>","keyTerms":[{"term":"Divisas","def":"Moeda estrangeira (ex.: para Portugal, dólar, real, libra)."},{"term":"Taxa de câmbio","def":"Preço de uma moeda expresso em unidades de outra moeda."},{"term":"Forma direta","def":"Preço de 1 unidade de moeda estrangeira em moeda nacional (ex.: €/US$); é a usada na cruz marshalliana do mercado cambial."},{"term":"Forma indireta","def":"Preço de 1 unidade de moeda nacional em moeda estrangeira (ex.: US$/€)."},{"term":"Taxa de câmbio de equilíbrio (e*)","def":"Taxa que iguala procura e oferta de moeda estrangeira num mercado cambial livre."}],"questions":[{"q":"Qual das seguintes operações origina OFERTA de dólares no mercado cambial português?","options":["Uma empresa portuguesa importa computadores dos EUA","Turistas americanos passam férias no Algarve","Um estudante português vai estudar para os EUA","Um emigrante americano em Portugal envia dinheiro para a família nos EUA"],"answer":1,"explanation":"O turismo de visitantes estrangeiros traz dólares que são trocados por euros: oferta de divisas. Importar, viajar para fora e enviar transferências para fora geram procura de divisas.","id":"q3kus4t"},{"q":"Com a taxa de câmbio na forma direta (e = €/US$), um aumento da procura de dólares por residentes, num mercado cambial livre, leva a:","options":["Subida de e e desvalorização do euro","Descida de e e valorização do euro","Subida de e e valorização do euro","Nenhuma alteração de e, porque a oferta se ajusta"],"answer":0,"explanation":"D desloca-se para a direita, há excesso de procura ao câmbio inicial e e sobe: paga-se mais euros por dólar (euro desvaloriza). Se e não subisse, o euro ficaria sobrevalorizado.","id":"qayre7a"},{"q":"Partindo de 1 USD = 2 €, as exportações portuguesas pagas em USD aumentam fortemente. Se a taxa de câmbio se mantivesse em 2 €/USD:","options":["O dólar estaria subvalorizado e o euro sobrevalorizado","Haveria excesso de procura de dólares","O dólar estaria sobrevalorizado e o euro subvalorizado","O mercado estaria em equilíbrio"],"answer":2,"explanation":"O aumento da oferta de USD cria excesso de oferta a 2 €/USD; a taxa deveria descer. Mantendo-se, recebe-se mais euros por dólar do que o equilíbrio justificaria: dólar sobrevalorizado, euro subvalorizado.","id":"q1kjpqd9"}],"key":"u7-7.2"},{"id":"7.3","title":"Regimes cambiais e política cambial","pages":[202,204],"summary":"<h4>Razões da política cambial (i)</h4>\n<p>As taxas de câmbio são um preço (ex.: preço de 1 dólar em moeda nacional) e estão associadas aos preços das exportações e importações:</p>\n<ul>\n<li><strong>Se a taxa de câmbio sobe</strong> (desvalorização da moeda nacional): o preço das importações sobe e o das exportações desce (para o estrangeiro). Em princípio a quantidade importada desce e a exportada sobe; quanto ao valor, para grande parte dos bens tende a ter a mesma evolução da quantidade. Se as quantidades não se alterassem, a desvalorização seria <strong>prejudicial</strong> (pagava-se mais pelas mesmas importações, recebia-se menos pelas mesmas exportações). A desvalorização pressupõe que a alteração das quantidades (ex. mais exportações) compense a descida das receitas de um preço mais baixo.</li>\n<li><strong>Se a taxa de câmbio desce</strong> (valorização): o preço das importações desce e o das exportações sobe. Em princípio a quantidade importada sobe e a exportada desce. Se as quantidades não se alterassem seria <strong>benéfico</strong> (pagava-se menos pelas importações, recebia-se mais pelas exportações); pressupõe-se que a variação das quantidades (diminuição das exportações) não é compensada pela subida das receitas de um preço mais alto.</li>\n</ul>\n<h4>Razões da política cambial (ii) – Regimes cambiais</h4>\n<p>Os governos podem ter interesse em controlar ou manipular as taxas de câmbio.</p>\n<table><tr><th>Regime</th><th>Características</th></tr>\n<tr><td><strong>Câmbios flexíveis</strong></td><td>A taxa de câmbio é a que resulta do mercado; teremos uma taxa de equilíbrio; se os câmbios flutuam, as <strong>reservas de divisas estão fixas</strong>.</td></tr>\n<tr><td><strong>Câmbios fixos</strong></td><td>Podem ser totalmente fixos ou deslizantes (\"<em>crawling peg</em>\"); se os câmbios estão fixos, as <strong>reservas de divisas flutuam</strong>; não é possível manter indefinidamente câmbios fixados a níveis irrealistas (nem os saldos a que dão origem).</td></tr>\n<tr><td><strong>Câmbios em flutuação controlada</strong></td><td>Deixa-se a taxa ser fixada pelo mercado, mas o banco central influencia-a comprando e vendendo divisas (pode ser com moeda nova, mas não necessariamente); comprar e vender divisas <strong>altera a oferta de moeda</strong>.</td></tr></table>\n<p><strong>A longo prazo a tendência será a de se caminhar para a taxa de câmbio de equilíbrio.</strong></p>","keyTerms":[{"term":"Câmbios flexíveis","def":"Regime em que a taxa de câmbio resulta do mercado; reservas de divisas fixas."},{"term":"Câmbios fixos","def":"Regime em que a taxa é fixada (total ou deslizante – crawling peg); as reservas de divisas flutuam."},{"term":"Crawling peg","def":"Câmbio fixo deslizante, ajustado gradualmente."},{"term":"Flutuação controlada","def":"Taxa fixada pelo mercado mas influenciada pelo banco central através da compra/venda de divisas, o que altera a oferta de moeda."}],"questions":[{"q":"Num regime de câmbios fixos, segundo as aulas:","options":["As reservas de divisas estão fixas e a taxa de câmbio flutua","As reservas de divisas flutuam para manter a taxa de câmbio","O banco central nunca compra nem vende divisas","É possível manter indefinidamente qualquer nível de câmbio fixado"],"answer":1,"explanation":"Para manter a taxa fixa o banco central compra/vende divisas, pelo que as reservas flutuam. Reservas fixas caracterizam os câmbios flexíveis; e câmbios a níveis irrealistas não se mantêm indefinidamente.","id":"qzihf66"},{"q":"Uma subida da taxa de câmbio €/US$ (desvalorização do euro) só melhora as contas externas se:","options":["As quantidades exportadas e importadas não se alterarem","As reservas de divisas se mantiverem fixas","O preço das importações descer","O aumento das quantidades exportadas (e a descida das importadas) compensar o efeito dos preços menos favoráveis"],"answer":3,"explanation":"Com quantidades inalteradas a desvalorização é prejudicial (paga-se mais pelas importações e recebe-se menos pelas exportações); pressupõe que a variação das quantidades compense. O preço das importações sobe, não desce.","id":"qaykqte"}],"key":"u7-7.3"},{"id":"7.4","title":"As paridades de poder de compra (PPC) e a taxa de câmbio","pages":[205,207],"summary":"<p>As PPC (paridades de poder de compra; em inglês PPP – <em>purchasing power parities</em>) permitem comparar o PIB de diferentes países com base no poder de compra associado a esse PIB, bem como comparar salários entre países com base no seu poder de compra. Podem ser entendidas segundo duas perspetivas:</p>\n<h4>[i] PPC como cabazes de referência</h4>\n<ul>\n<li>Considera-se um <strong>cabaz representativo</strong> de todos os bens e serviços, tomado como referência.</li>\n<li>Vê-se quanto custa esse cabaz numa economia, na moeda dessa economia (ex. Portugal, em euros).</li>\n<li>O valor da moeda, em cada país, define-se pelo nº de cabazes de referência que se podem comprar com o que se ganha nesse país.</li>\n<li>É uma <strong>medição do poder de compra em termos reais</strong> (em cabazes); a valorização monetária faz-se exprimindo-a na moeda de um país, em geral USD.</li>\n</ul>\n<h4>[ii] PPC como índice conversor</h4>\n<ul>\n<li>Definição do INE: as PPC são <strong>índices que convertem os valores nacionais em valores que eliminam os efeitos das diferenças nos níveis de preços entre países</strong> (INE, Paridades de Poder de Compra, 2017).</li>\n<li>O valor em moeda nacional é convertido num valor diretamente comparável, multiplicando-o por um índice que reflete a paridade dos poderes de compra.</li>\n</ul>\n<h4>[iii] Dificuldade</h4>\n<p>Definir um cabaz representativo da despesa de cada país (nomeadamente de uma família). Pretende-se para cada país um cabaz comparável com os dos outros, pois não pode haver um cabaz único: ex. o cabaz português pode incluir azeite, mas no Brasil faz mais sentido outro óleo alimentar.</p>\n<h4>Taxa de câmbio medida pelas PPC</h4>\n<p>Vejo quanto custa o cabaz em Portugal (em euros) e quanto custa o mesmo cabaz nos EUA (em dólares). O <strong>rácio entre os dois valores</strong> é uma hipotética taxa de câmbio medida pelas PPC, que serve de <strong>referência para a taxa de câmbio sustentável de longo prazo</strong>.</p>\n<p>(Slide \"PPC e evolução previsível das taxas de câmbio – Exemplo\" sem conteúdo adicional visível.)</p>","keyTerms":[{"term":"PPC / PPP","def":"Paridades de poder de compra: permitem comparar PIB e salários entre países eliminando diferenças de níveis de preços."},{"term":"Cabaz de referência","def":"Conjunto representativo de bens e serviços cujo custo em cada país serve de base às PPC."},{"term":"Taxa de câmbio PPC","def":"Rácio entre o custo do mesmo cabaz em duas moedas; referência para a taxa de câmbio sustentável de longo prazo."}],"questions":[{"q":"Um cabaz representativo custa 1 200 € em Portugal e 1 500 US$ nos EUA. A taxa de câmbio medida pelas PPC, na forma direta para Portugal (€/US$), é:","options":["1,25 €/US$","300 €/US$","0,80 €/US$","1,00 €/US$"],"answer":2,"explanation":"Forma direta: euros por dólar = 1200/1500 = 0,80 €/US$. 1,25 é a forma indireta (US$ por euro).","id":"q10iibph"},{"q":"Segundo as aulas, a taxa de câmbio medida pelas PPC é:","options":["Uma referência do que deverá ser a taxa de câmbio sustentável de longo prazo","A taxa fixada pelo banco central em regime de câmbios fixos","A taxa de câmbio de equilíbrio diária no mercado de divisas","Sempre igual à taxa de câmbio de mercado"],"answer":0,"explanation":"A taxa PPC é hipotética e serve de referência para a taxa sustentável de longo prazo; a taxa de mercado pode afastar-se dela no curto prazo.","id":"qcp8kmq"}],"key":"u7-7.4"},{"id":"7.5","title":"A balança de pagamentos","pages":[208,210],"summary":"<h4>O que é a balança de pagamentos</h4>\n<ul>\n<li>Regista a <strong>totalidade das relações económicas de uma economia com o exterior</strong>.</li>\n<li>Segue o método das <strong>partidas dobradas</strong>: cada movimento é registado duas vezes, com o mesmo valor, sinal contrário e em contas diferentes.</li>\n<li>É composta por balanças parciais que culminam na balança de pagamentos. Uma balança é sempre um <strong>saldo</strong> (ex.: Balança de Bens e Serviços = Exportações − Importações).</li>\n</ul>\n<h4>Estrutura (versão simplificada)</h4>\n<table>\n<tr><td>+ Exportações de bens e serviços − Importações de bens e serviços</td><td>= <strong>Balança de bens e serviços</strong></td></tr>\n<tr><td>+ Entradas − Saídas de rendimentos e transferências</td><td>= <strong>Balança Corrente</strong></td></tr>\n<tr><td>+ Entrada − Saída de capitais (médio e longo prazo)</td><td>= <strong>Balança Básica</strong></td></tr>\n<tr><td>+ Entrada − Saída de capitais (curto prazo) ± Erros e omissões</td><td>= <strong>BONM</strong> (Balança de operações não monetárias)</td></tr>\n<tr><td>+ Aumento − Diminuição de reservas dos bancos + Aumento − Diminuição de reservas do Banco Central</td><td>= <strong>BOM</strong> (Balança de operações monetárias)</td></tr>\n</table>\n<p><strong>Saldo da Balança de Pagamentos = BONM − BOM; é sempre 0.</strong></p>\n<ul>\n<li>Exemplo: uma exportação paga em moeda estrangeira = aumento das exportações de bens e serviços e aumento das reservas dos bancos.</li>\n<li>Não é usual usar a sigla BOM; pela BONM sabemos a BOM, que tem sempre valor igual. (Nota técnica: na abordagem operacional, o saldo da BOM aparece como simétrico do saldo da BONM.)</li>\n<li>A <strong>Balança Básica</strong> traduz os movimentos <strong>estruturais</strong> da economia nas relações com o exterior.</li>\n<li>Se a <strong>BONM é positiva</strong>, entraram mais divisas do que saíram; se negativa, saíram mais do que entraram.</li>\n<li>Numa economia estruturalmente equilibrada com o exterior, <strong>BONM = 0</strong>: a entrada de divisas é tendencialmente igual à saída.</li>\n</ul>\n<h4>Dados de Portugal</h4>\n<ul>\n<li><strong>Contas externas 1953-2020 (% do PIB)</strong>, INE/Banco de Portugal: a balança de bens e serviços e a balança corrente e de capital foram <strong>deficitárias durante a maior parte do período</strong>, com défices profundos no início dos anos 80 (balança de bens e serviços perto de −15% do PIB) e em meados dos anos 2000 (≈ −10%); só por volta de 2012-2013 passaram a <strong>excedentárias</strong>, até 2019, voltando a ficar ligeiramente negativas em 2020.</li>\n<li><strong>Balanças corrente e de capital 2006-2012 (% do PIB)</strong>, Banco de Portugal: Portugal com défices de cerca de −8% a −12% do PIB entre 2006 e 2010, enquanto a Área Euro esteve perto de 0; forte correção a partir de 2011, aproximando-se de −1/−2% em 2012.</li>\n</ul>","keyTerms":[{"term":"Balança de pagamentos","def":"Registo, por partidas dobradas, de todas as relações económicas de uma economia com o exterior; saldo total sempre 0."},{"term":"Balança corrente","def":"Balança de bens e serviços + saldo de rendimentos e transferências."},{"term":"Balança básica","def":"Balança corrente + saldo dos capitais de médio e longo prazo; traduz os movimentos estruturais."},{"term":"BONM","def":"Balança de operações não monetárias: balança básica + capitais de curto prazo ± erros e omissões; positiva = entraram mais divisas do que saíram."},{"term":"BOM","def":"Balança de operações monetárias: variação das reservas dos bancos e do Banco Central; igual à BONM."}],"questions":[{"q":"Na versão simplificada da balança de pagamentos apresentada nas aulas, a Balança Básica obtém-se:","options":["Somando à balança corrente o saldo dos capitais de curto prazo","Subtraindo a BOM à BONM","Somando à balança de bens e serviços a variação das reservas do Banco Central","Somando à balança corrente o saldo dos capitais de médio e longo prazo"],"answer":3,"explanation":"Balança Básica = Balança Corrente + entradas − saídas de capitais de médio e longo prazo. Acrescentando os capitais de curto prazo e erros e omissões obtém-se a BONM; BONM − BOM é o saldo total (sempre 0).","id":"qm6gemn"},{"q":"Se a BONM de um país for positiva, isso significa que:","options":["Saíram mais divisas do que entraram","Entraram mais divisas do que saíram, aumentando as reservas","O saldo total da balança de pagamentos é positivo","A balança de bens e serviços é necessariamente excedentária"],"answer":1,"explanation":"BONM positiva = entraram mais divisas, o que tem contrapartida na BOM (aumento de reservas). O saldo total é sempre 0, e a BONM positiva pode resultar de entradas de capitais mesmo com défice de bens e serviços.","id":"q1sbcjxl"}],"key":"u7-7.5"},{"id":"7 (Anexo 1)","title":"Anexo 1: notícia sobre a abertura ao exterior (euro vs. franco suíço)","pages":[211,212],"summary":"<p><strong>Notícia (Diário de Notícias, 16/01/2015):</strong> \"Funcionários públicos portugueses na Suíça em pânico com descida do euro\". O Banco Nacional Suíço decidiu <strong>suprimir a taxa de câmbio fixa entre o euro e o franco suíço</strong>; o euro caiu face ao franco, afetando os salários dos funcionários públicos portugueses na Suíça, que recebem em euros. A diferença cambial provocaria uma quebra de cerca de 20% nos ordenados; alguns passariam a receber menos do equivalente a 2000 francos, quando se admite que 4000 francos correspondem a um ordenado mínimo para viver na Suíça.</p>\n<h4>Questões para pensar</h4>\n<ol>\n<li>Ilustrar graficamente o mercado cambial euro/franco suíço (definindo a taxa de câmbio usada), a situação de partida e a evolução esperada.</li>\n<li>Consequências da alteração da taxa de câmbio para a <strong>Balança Comercial da Suíça</strong> (exportações − importações de bens e serviços).</li>\n<li>Explicar o que são as PPC e para que servem, usando a informação da notícia (ex.: os 4000 francos como custo de vida mínimo na Suíça).</li>\n</ol>\n<p><strong>Pistas de resposta:</strong> com o fim do câmbio fixo (regime de câmbios fixos → flexíveis), o franco valorizou-se face ao euro – na perspetiva suíça (forma direta, CHF/€) a taxa de câmbio desceu. Para a Suíça, as importações ficam mais baratas e as exportações mais caras, tendendo a <strong>piorar a balança comercial suíça</strong>. Quem recebe em euros e gasta em francos perde poder de compra: a comparação de rendimentos entre países deve ser feita com base no poder de compra (PPC).</p>","keyTerms":[{"term":"Fim de câmbio fixo","def":"Supressão de uma paridade fixa (ex. euro/franco suíço em 2015), deixando a taxa de câmbio ser determinada pelo mercado."}],"questions":[{"q":"Em 2015, após o fim da taxa fixa, o franco suíço valorizou-se face ao euro. Ceteris paribus, o efeito esperado na balança comercial da Suíça é:","options":["Deterioração, porque as exportações suíças ficam mais caras e as importações mais baratas","Melhoria, porque as exportações suíças ficam mais baratas","Nenhum, porque a balança de pagamentos tem sempre saldo zero","Melhoria, porque os funcionários estrangeiros recebem menos"],"answer":0,"explanation":"A valorização do franco encarece os bens suíços para o exterior e embaratece as importações, tendendo a reduzir X − M. O saldo zero refere-se à balança de pagamentos total, não à balança comercial.","id":"q15jthwz"}],"key":"u7-7 (Anexo 1)"},{"id":"7.2 Ex.","title":"Caderno de exercícios — Taxa de câmbio, regimes cambiais, PPC (Big Mac) e balança de pagamentos","pages":[318,333],"summary":"<h4>Ex. 7.1 e 7.3</h4><p>Razões da procura e da oferta de moeda estrangeira; definição de taxa de câmbio; câmbios <strong>flexíveis</strong>, <strong>fixos</strong> e em <strong>flutuação controlada</strong> e a sua relação com a variação das reservas de divisas (ver aulas).</p><h4>Ex. 7.2 – Tabela X-Rates (17 jul. 2024)</h4><table><tr><th>Moeda</th><th>por 1,00 USD</th><th>inv. (USD por unidade)</th></tr><tr><td>Euro</td><td>0,914161</td><td>1,093900</td></tr><tr><td>Libra</td><td>0,768579</td><td>1,301103</td></tr><tr><td>Rupia indiana</td><td>83,591576</td><td>0,011963</td></tr><tr><td>Iene japonês</td><td>156,172146</td><td>0,006403</td></tr><tr><td>Yuan renminbi</td><td>7,260606</td><td>0,137730</td></tr></table><p>A 1.ª coluna é a taxa de câmbio <strong>direta</strong> face ao dólar (quantas unidades de moeda estrangeira custa 1 USD); a 2.ª é a <strong>indireta</strong>. Ser direta ou indireta depende da perspetiva; uma é o inverso da outra: 1/0,914161 = 1,093900.</p><h4>Ex. 7.4 – Índice Big Mac (julho 2015) e PPC</h4><table><tr><th>País</th><th>Preço Big Mac (moeda local)</th><th>Câmbio (moeda local por 1 USD)</th></tr><tr><td>Argentina</td><td>28,00</td><td>9,14</td></tr><tr><td>Austrália</td><td>5,30</td><td>1,35</td></tr><tr><td>Brasil</td><td>13,50</td><td>3,15</td></tr><tr><td>Suécia</td><td>43,70</td><td>8,52</td></tr><tr><td>Turquia</td><td>10,25</td><td>2,65</td></tr><tr><td>EUA</td><td>4,79</td><td>1,00</td></tr><tr><td>Portugal</td><td>3,00</td><td>0,91</td></tr><tr><td>Irlanda</td><td>3,70</td><td>0,91</td></tr><tr><td>Itália</td><td>4,00</td><td>0,91</td></tr><tr><td>Holanda</td><td>3,45</td><td>0,91</td></tr><tr><td>Espanha</td><td>3,65</td><td>0,91</td></tr></table><ul><li><strong>PPP (paridades de poder de compra)</strong>: forma de medir o poder de compra em termos reais, em unidades de um cabaz representativo do que as famílias compram, valorizado numa dada moeda (ex.: USD). O Big Mac é usado como esse cabaz (o índice não pretende ser exato).</li><li>Sentido: com dois cabazes <strong>iguais</strong> em espaços diferentes e moedas diferentes, <strong>tudo o resto igual</strong>, a taxa de câmbio de referência deve ser o rácio entre os dois valores do mesmo cabaz; caso contrário haveria movimentos de bens e fatores para tirar proveito das diferenças de preços, até deixarem de existir.</li><li><strong>USD vs. peso argentino</strong>: câmbio oficial = 1/9,14 = 0,1094 USD por peso; câmbio implícito nas PPP = 4,79/28 = 0,1711 USD por peso; (0,1094 − 0,1711)/0,1711 × 100 = <strong>−36,06%</strong>. Equivalentemente, 28/9,14 = 3,06 USD: ao câmbio oficial os Big Macs são mais baratos na Argentina do que nos EUA. Conclusão: o <strong>USD está sobrevalorizado</strong> face ao peso (e o peso subvalorizado); deveriam ser menos pesos por USD; tendência para o USD desvalorizar face ao peso.</li><li><strong>Salários mínimos 2016</strong> (Portugal 530 €; Espanha 655 €): em Big Macs – Portugal 530/3 = 176,67; Espanha 655/3,65 ≈ 179,45. A preços de Portugal: Espanha = 655/3,65 × 3 = 538,36 €; a preços de Espanha: Portugal = 530/3 × 3,65 = 644,83 €. Em termos nominais o salário e
