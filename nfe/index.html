spanhol é ≈23,6% mais alto; em termos reais (Big Macs) apenas ≈1,6% mais alto.</li></ul><h4>Ex. 7.5 – Paridades</h4><ul><li><strong>PPC</strong>: a taxa de câmbio entre duas moedas tende para o rácio do valor de um mesmo cabaz nas duas moedas. Se dois países tiverem inflações diferentes, a taxa de câmbio tende a alterar-se num montante igual à <strong>diferença entre as taxas de inflação</strong>; senão, os bens ficariam mais caros no país com maior inflação e a procura deslocar-se-ia para o de menor inflação. A PPC é também usada para comparar o poder aquisitivo (ex.: PIB em PPC entre países).</li><li><strong>Paridade das taxas de juro</strong>: as taxas de juro <strong>reais</strong> tendem a ser iguais em diferentes mercados se não houver outros fatores (ex.: risco) – coeteris paribus. A taxa de juro nominal tende a ser igual à real acrescida da inflação; a diferença entre taxas de juro nominais tende a igualar a diferença entre as taxas de inflação.</li></ul><h4>Ex. 7.6 (solução numerada 8.7) – Balança de pagamentos</h4><ul><li>Regista a totalidade das relações económicas de uma economia com o exterior, em substância e valor; composta por balanças parciais, cada uma com o saldo das operações que a integram.</li><li><strong>Balança de Operações Não Monetárias (BONM)</strong>: saldo de todas as operações relativas a bens tangíveis, serviços, rendimentos, transferências e capitais. Positivo → entraram mais divisas do que saíram; negativo → saíram mais do que entraram.</li><li><strong>Balança Básica</strong>: traduz os movimentos <strong>estruturais</strong> das transações com o exterior – tende para zero se as relações forem equilibradas; positiva se a economia for tendencialmente mais exportadora do que importadora ou receber mais capitais do que fornece; negativa no caso contrário.</li></ul>","keyTerms":[{"term":"Taxa de câmbio direta/indireta","def":"Unidades de moeda estrangeira por unidade de moeda de referência, ou o inverso; uma é o inverso da outra e a designação depende da perspetiva."},{"term":"Paridade do poder de compra (PPC/PPP)","def":"A taxa de câmbio tende para o rácio dos preços de um mesmo cabaz nas duas moedas; as variações cambiais tendem a refletir diferenças de inflação."},{"term":"Paridade das taxas de juro","def":"As taxas de juro reais tendem a igualar-se entre mercados; as diferenças de juro nominal refletem diferenças de inflação."},{"term":"Balança de pagamentos","def":"Registo de todas as relações económicas de uma economia com o exterior, composto por balanças parciais."},{"term":"Balança Básica","def":"Traduz os movimentos estruturais das transações com o exterior."},{"term":"BONM","def":"Balança de Operações Não Monetárias: saldo das operações sobre bens, serviços, rendimentos, transferências e capitais."}],"questions":[{"q":"Na tabela X-Rates, 1 USD = 0,914161 EUR. A taxa de câmbio indireta (USD por 1 EUR) é aproximadamente:","options":["0,9142","1,0939","0,0857","1,9142"],"answer":1,"explanation":"A taxa indireta é o inverso da direta: 1/0,914161 ≈ 1,0939 USD por euro.","id":"q5lhymq"},{"q":"Um Big Mac custa 4,79 USD nos EUA e 28 pesos na Argentina, e o câmbio oficial é 9,14 pesos por USD. Segundo as PPC, o dólar está:","options":["Subvalorizado face ao peso, porque a taxa PPC implícita (≈5,85 pesos/USD) é superior à oficial","Em paridade, porque o Big Mac é um bem homogéneo","Sobrevalorizado face ao peso, porque ao câmbio oficial o Big Mac na Argentina custa só cerca de 3,06 USD","Sobrevalorizado face ao euro, mas não face ao peso"],"answer":2,"explanation":"A taxa PPC implícita é 28/4,79 ≈ 5,85 pesos por USD, abaixo dos 9,14 oficiais. Cada dólar compra mais do que deveria (28/9,14 ≈ 3,06 USD por Big Mac), logo o USD está sobrevalorizado, em cerca de −36% na comparação do caderno.","id":"q30yft4"},{"q":"Segundo a paridade dos poderes de compra, se a inflação em Portugal for persistentemente superior à de outro país, a moeda portuguesa tende a:","options":["Valorizar-se, porque os bens nacionais ficam mais caros","Manter-se estável, porque a taxa de câmbio depende só das taxas de juro","Valorizar-se na exata medida da taxa de juro real","Desvalorizar-se num montante aproximadamente igual à diferença entre as taxas de inflação"],"answer":3,"explanation":"Pela PPC, a taxa de câmbio ajusta-se à diferença de inflações. Caso contrário, os bens do país com mais inflação ficariam mais caros e a procura deslocar-se-ia para o país com menos inflação.","id":"q1we90cr"}],"key":"u7-7.2 Ex."}]},{"n":8,"title":"O financiamento do Estado e o Orçamento do Estado","short":"Orçamento do Estado","sections":[{"id":"8.1","title":"A política económica e o financiamento do Estado","pages":[212,215],"summary":"<h4>Capítulo 8 – O financiamento do Estado e o Orçamento do Estado</h4>\n<p>Estrutura: 8.1 Política económica e financiamento do Estado; 8.2 Formas do Estado se financiar (8.2.1 restrição orçamental; 8.2.2 impostos; 8.2.3 dívida pública; 8.2.4 emissão de moeda; 8.2.5 toda a despesa do Estado é paga com impostos); 8.3 Relação do saldo orçamental com o PIB real (8.3.1 saldo estrutural, cíclico e total; 8.3.2 sustentabilidade das finanças públicas). Imagem: <em>O Cobrador de Impostos</em>, Pieter Brueghel II, 1616.</p>\n<h4>8.1</h4>\n<p>O Estado precisa de recursos para promover a política económica, relacionada com a promoção da <strong>eficiência, equidade e estabilidade</strong>. Ao fazê-lo enfrenta o <strong>\"conflito eficiência-equidade\"</strong> e o <strong>\"conflito desenvolvimento-estabilidade\"</strong>.</p>\n<h4>Três funções fundamentais do Estado</h4>\n<p>Promoção da eficiência, equidade e estabilidade – referência para a intervenção do Estado; podem coexistir.</p>\n<table><tr><th>Função</th><th>Exemplos de atuação</th></tr>\n<tr><td><strong>Eficiência</strong></td><td>Construção de estradas e hospitais; criação de empresas públicas; ter em conta externalidades positivas e negativas; estruturar o sistema de educação; legislação e regulação da atividade das empresas.</td></tr>\n<tr><td><strong>Equidade</strong></td><td>Segurança social; aparelho fiscal.</td></tr>\n<tr><td><strong>Estabilidade</strong></td><td>Subsídios aos desempregados; fornecer certos bens mais baratos subsidiando-os.</td></tr></table>\n<h4>Política económica orçamental e não orçamental</h4>\n<ul>\n<li><strong>Orçamental</strong>: diretamente ligada às receitas e despesas do Estado (aquilo em que se consubstancia o seu orçamento).</li>\n<li><strong>Não orçamental</strong>: não diretamente ligada a receitas e despesas. A <strong>política monetária e a cambial</strong> são não orçamentais; também a <strong>regulação da atividade económica</strong> (legislação da concorrência, legislação laboral) – menos falada mas muito importante.</li>\n</ul>\n<p>Os recursos da política não orçamental são menores, embora o seu impacto possa ser muito maior do que o percecionado. A análise centra-se na política orçamental.</p>\n<p>O Estado <strong>tem de gastar</strong> recursos, <strong>não produz</strong> recursos, <strong>vai buscar</strong> recursos. Quais são as formas de o Estado se financiar?</p>","keyTerms":[{"term":"Funções do Estado","def":"Promoção da eficiência, da equidade e da estabilidade."},{"term":"Política económica orçamental","def":"Política diretamente ligada às receitas e despesas do Estado (orçamento)."},{"term":"Política económica não orçamental","def":"Política não ligada diretamente a receitas e despesas: monetária, cambial e regulação (concorrência, laboral)."},{"term":"Conflito eficiência-equidade","def":"Tensão entre promover a eficiência e promover a equidade na política económica."}],"questions":[{"q":"Qual das seguintes é um exemplo de política económica NÃO orçamental?","options":["Aumento das pensões da segurança social","Construção de um hospital público","Alteração da taxa de juro pelo banco central","Redução do IRS"],"answer":2,"explanation":"A política monetária (e a cambial) não está diretamente ligada a receitas e despesas do Estado. Pensões, hospitais e IRS são despesas/receitas orçamentais.","id":"q14jqe3l"},{"q":"Nos exemplos das aulas, os subsídios aos desempregados enquadram-se sobretudo na função do Estado de promoção da:","options":["Eficiência","Estabilidade","Equidade","Concorrência"],"answer":1,"explanation":"Os slides colocam os subsídios aos desempregados na função de estabilidade. A equidade surge com segurança social e aparelho fiscal; a eficiência com estradas, hospitais, educação e regulação.","id":"q1kokn1q"}],"key":"u8-8.1"},{"id":"8.2.1","title":"A restrição orçamental do Estado","pages":[216,220],"summary":"<h4>Restrição orçamental do Estado</h4>\n<p style='font-size:1.1em'><strong>G + Tr + i×B = T + ΔB + ΔBM</strong></p>\n<table>\n<tr><td>G</td><td>Gastos do Estado</td></tr>\n<tr><td>Tr</td><td>Transferências do Estado</td></tr>\n<tr><td>i × B</td><td>Juros da dívida pública (i = taxa de juro da dívida; B = montante da dívida)</td></tr>\n<tr><td>T</td><td>Impostos</td></tr>\n<tr><td>ΔB</td><td>Variação da dívida pública</td></tr>\n<tr><td>ΔBM</td><td>Variação da base monetária</td></tr></table>\n<p>Aumento de impostos, aumento da dívida e aumento da base monetária são as <strong>três formas básicas</strong> de o Estado se financiar (impostos, emissão de dívida, emissão de moeda) – mas há outras.</p>\n<p><strong>Impõe-se:</strong> mesmo que não o queira, qualquer Estado/Governo enfrenta sempre uma restrição desta natureza, que indica globalmente a origem dos recursos aplicados pelo Estado.</p>\n<h4>Outras origens de fundos</h4>\n<p>No lado direito poderia acrescentar-se a <strong>venda de património</strong> (ex. privatização de uma empresa estatal – frequente em crises financeiras do Estado), e o \"roubo\", \"saque\", \"confisco\" ou \"calote\" (não esperados num Estado de direito, mas presentes em muitos acontecimentos históricos). Nota: a restrição orçamental do consumidor (microeconomia) é uma matéria diferente e não deve ser confundida.</p>\n<h4>Conjugação de todas as formas de financiamento</h4>\n<ul>\n<li><strong>Financiar gastos:</strong> G = T + ΔB + ΔBM − Tr − i×B → impostos, aumento da dívida, emissão de moeda, diminuição das transferências, diminuição da taxa de juro dos empréstimos já contraídos, ou combinação.</li>\n<li><strong>Financiar transferências:</strong> Tr = T + ΔB + ΔBM − G − i×B → impostos, dívida, moeda, diminuição dos gastos, diminuição da taxa de juro, ou combinação.</li>\n<li><strong>Financiar juros da dívida:</strong> i×B = T + ΔB + ΔBM − G − Tr → impostos, dívida, moeda, menos gastos, menos transferências, ou combinação.</li>\n<li><strong>Financiar amortização (redução) da dívida:</strong> −ΔB = T + ΔBM − G − Tr − i×B → impostos, moeda, menos gastos, menos transferências, menor taxa de juro, ou combinação.</li>\n</ul>\n<h4>Condição de objetividade do discurso sobre o Orçamento</h4>\n<p><strong>O discurso nunca pode referir apenas uma variável da restrição orçamental; tem de referir pelo menos duas.</strong> Ex.: «É preciso diminuir os impostos» → deve indicar-se o que diminui na despesa ou qual o financiamento alternativo. «O Estado deve aumentar os gastos no ensino» → deve indicar-se como será financiado.</p>","keyTerms":[{"term":"Restrição orçamental do Estado","def":"G + Tr + i×B = T + ΔB + ΔBM: as despesas (gastos, transferências, juros) são financiadas por impostos, variação da dívida e variação da base monetária."},{"term":"Formas básicas de financiamento","def":"Impostos, emissão de dívida e emissão de moeda."},{"term":"Condição de objetividade do discurso","def":"Qualquer proposta orçamental deve referir pelo menos duas variáveis da restrição orçamental."}],"questions":[{"q":"Um Estado tem G = 80, Tr = 30, juros da dívida i×B = 10 e impostos T = 100, sem emissão de moeda (ΔBM = 0). Pela restrição orçamental, a variação da dívida pública é:","options":["ΔB = −20","ΔB = 10","ΔB = 120","ΔB = 20"],"answer":3,"explanation":"G + Tr + i×B = 120 = T + ΔB + ΔBM = 100 + ΔB, logo ΔB = 20 (a dívida aumenta 20). −20 resultaria de trocar os lados da equação.","id":"q186kl1p"},{"q":"Pela 'condição de objetividade do discurso' sobre o Orçamento, a afirmação «O Estado deve aumentar os gastos no ensino» só é completa se:","options":["Indicar o montante exato do aumento","For aprovada pelo banco central","Indicar também como será financiado esse aumento (outra variável da restrição)","Não implicar emissão de moeda"],"answer":2,"explanation":"O discurso nunca pode referir apenas uma variável da restrição orçamental; tem de referir pelo menos duas (ex.: aumento de G financiado por mais T, mais dívida ou menos Tr).","id":"q15rr9fk"}],"key":"u8-8.2.1"},{"id":"8.2.2","title":"O financiamento do Estado através de impostos","pages":[220,222],"summary":"<h4>Impostos</h4>\n<ul>\n<li>São necessários: uma sociedade precisa de impostos para funcionar.</li>\n<li>Têm sempre um <strong>custo de oportunidade</strong>, que deve ser inferior à sua utilidade social.</li>\n<li>São a forma de financiamento em que <strong>mais se sentem os custos</strong> associados aos benefícios da ação do Estado.</li>\n</ul>\n<p><strong>Dois grandes objetivos:</strong> financiar o Estado; influenciar/condicionar os comportamentos.</p>\n<h4>Impacto dos impostos na economia (i)</h4>\n<ul>\n<li><strong>Alisam a economia → promovem a estabilidade</strong>: diminuem quando a atividade está em recessão (o PIB não diminui tanto) e aumentam em expansão (o PIB não aumenta tanto).</li>\n<li><strong>Alisam os rendimentos → promovem a equidade</strong>: os mais ricos são mais tributados, em termos relativos e absolutos.</li>\n<li>Em Portugal os impostos são aprovados com o Orçamento do Estado; pretende-se que não sejam indiscriminados. Os impostos estiveram presentes em muitas agitações sociais (Revolução Francesa, 1789; Revolução Americana).</li>\n<li>Num prazo mais longo <strong>todos os impostos têm impacto económico</strong>; num prazo curto só não afetam a atividade os impostos <strong><em>lump-sum</em></strong> (sem relação com as decisões).</li>\n</ul>\n<h4>Impacto dos impostos na economia (ii) – Fuga aos impostos</h4>\n<ul>\n<li>A <strong>\"fuga legal\"</strong> altera o funcionamento da economia; a <strong>\"fuga ilegal\"</strong> mantém os recursos na economia.</li>\n<li>Exemplos de impacto da fuga legal: <strong>impostos sobre a despesa</strong> → alteram os mercados dos bens; <strong>impostos sobre o rendimento</strong> → alteram os mercados do trabalho e dos outros fatores; <strong>impostos sobre o património e riqueza acumulada</strong> → alteram a poupança. Há relações entre todos estes impactos.</li>\n<li>Exemplo de fuga ilegal: <strong>economia subterrânea ou paralela</strong>.</li>\n</ul>","keyTerms":[{"term":"Imposto lump-sum","def":"Imposto de montante fixo, sem relação com as decisões dos agentes; no curto prazo não afeta a atividade económica."},{"term":"Fuga legal aos impostos","def":"Alteração legal de comportamentos para pagar menos impostos; altera o funcionamento dos mercados."},{"term":"Fuga ilegal aos impostos","def":"Evasão fiscal (ex.: economia subterrânea ou paralela); mantém os recursos na economia."},{"term":"Estabilizador (alisamento)","def":"Os impostos diminuem em recessão e aumentam em expansão, atenuando as flutuações do PIB."}],"questions":[{"q":"Segundo as aulas, os impostos 'alisam a economia' e promovem a estabilidade porque:","options":["Diminuem em recessão e aumentam em expansão, atenuando as variações do PIB","Aumentam em recessão e diminuem em expansão","Os mais ricos pagam mais impostos","São sempre do tipo lump-sum"],"answer":0,"explanation":"A receita fiscal acompanha a atividade: cai na recessão (o PIB não cai tanto) e sobe na expansão (o PIB não sobe tanto). Tributar mais os ricos é o alisamento dos rendimentos (equidade).","id":"q18dh77s"},{"q":"Os impostos sobre o património e a riqueza acumulada, através da 'fuga legal', alteram sobretudo:","options":["Os mercados dos bens","Os mercados do trabalho","A economia subterrânea","A poupança"],"answer":3,"explanation":"Nos slides: impostos sobre a despesa → mercados dos bens; sobre o rendimento → mercados do trabalho e outros fatores; sobre património/riqueza → poupança. A economia subterrânea é fuga ilegal.","id":"q1bebe2n"}],"key":"u8-8.2.2"},{"id":"8.2.3","title":"O financiamento do Estado através da emissão de dívida pública","pages":[223,226],"summary":"<h4>Dívida pública</h4>\n<ul>\n<li><strong>Interna</strong>: o Estado pede emprestado dentro do país. <strong>Externa</strong>: pede emprestado fora do país.</li>\n<li>O <strong>capital e os juros da dívida são pagos com impostos futuros</strong>; esses impostos têm impacto, já hoje, sobre quem os pagará no futuro.</li>\n<li><strong>Impacto entre gerações</strong> (perspetiva consolidada): dívida interna → <strong>não tem impacto</strong>; dívida externa → <strong>tem impacto</strong>.</li>\n<li>A principal razão da emissão de dívida parece ser <strong>política</strong> (porquê? quem ganha?). A dívida externa pode ter associados grandes problemas e custos sociais e políticos.</li>\n<li>Pode haver situações que justifiquem a dívida, nomeadamente quando quem paga futuramente o imposto é beneficiado e a considera justificada: ex. <strong>financiamento do investimento</strong> e <strong>situações de calamidade</strong>.</li>\n</ul>\n<h4>Emissão de dívida pública em Portugal</h4>\n<p>A dívida bruta e a dívida per capita têm aumentado. Sempre que há défice a dívida aumenta, a não ser que o Estado se desfaça de ativos para o pagar. A dívida em % do PIB diminuiu de 2016 a 2019; com a pandemia de Covid subiu significativamente em 2020 e desde então tem vindo a descer.</p>\n<h4>Dados (Pordata; INE, BdP, DGO)</h4>\n<ul>\n<li><strong>Dívida bruta das Administrações Públicas</strong> (milhões €): 74,6 em 1960 → cerca de 136 mil milhões em 2008 → cerca de 270 mil milhões em 2020 → <strong>263 649,0 milhões em 2024</strong> (previsão do Ministério das Finanças). Crescimento contínuo, muito acelerado a partir de meados dos anos 2000.</li>\n<li><strong>Dívida bruta per capita</strong> (€, base 2016): 8,4 € em 1960 → <strong>24 726,7 € em 2023</strong>.</li>\n<li><strong>Dívida bruta em % do PIB</strong>: 15,1% em 1960; ≈ 72% em 2007; subida forte com a crise financeira para valores em torno de 130% (2013-2016); pico de cerca de 135% em 2020 (pandemia); descida para cerca de 99% em 2023 e <strong>95,1% em 2024</strong> (previsão).</li>\n</ul>","keyTerms":[{"term":"Dívida pública interna","def":"Empréstimos obtidos pelo Estado dentro do país; numa perspetiva consolidada não tem impacto entre gerações."},{"term":"Dívida pública externa","def":"Empréstimos obtidos fora do país; tem impacto entre gerações e pode ter grandes custos sociais e políticos."},{"term":"Impostos futuros","def":"Forma de pagamento do capital e dos juros da dívida emitida hoje."}],"questions":[{"q":"Segundo as aulas, numa perspetiva consolidada, o impacto da dívida pública ao nível das gerações é:","options":["Existente para a dívida interna e nulo para a externa","Nulo para a dívida interna e existente para a dívida externa","Nulo para ambas, porque o capital é sempre reembolsado","Existente para ambas na mesma medida"],"answer":1,"explanation":"Na dívida interna os credores e os contribuintes futuros são residentes, pelo que, consolidando, não há impacto entre gerações; na dívida externa os pagamentos futuros saem do país.","id":"qzmo1zq"},{"q":"De acordo com os dados apresentados, a dívida bruta das Administrações Públicas portuguesas em % do PIB:","options":["Subiu significativamente em 2020 com a pandemia e desde então tem vindo a descer","Diminuiu continuamente desde 2010","Manteve-se abaixo de 60% em todo o período 2007-2024","Atingiu o máximo em 2024"],"answer":0,"explanation":"Os slides indicam descida 2016-2019, subida forte em 2020 (Covid) e descida desde então, para cerca de 95% previstos em 2024 — que não é o máximo.","id":"q69wwhl"}],"key":"u8-8.2.3"},{"id":"8.2.4","title":"O financiamento do Estado através da emissão de moeda","pages":[226,228],"summary":"<h4>Emissão de moeda</h4>\n<ul>\n<li>O Estado é o responsável pela emissão de moeda.</li>\n<li>No financiamento do orçamento está em causa a emissão de <strong>nova moeda sem ser por <em>open market</em></strong> (ex.: o Estado imprime notas novas e usa-as em proveito próprio).</li>\n</ul>\n<h4>Quatro ideias importantes</h4>\n<ul>\n<li>O valor da moeda é o que ela pode comprar.</li>\n<li>A emissão de nova moeda para financiar o Estado <strong>aumenta os preços (inflação)</strong> face à situação que se teria sem essa nova moeda, desvalorizando a moeda que já existe.</li>\n<li>Assim, a emissão de moeda para financiar o Estado é <strong>como um imposto sobre quem tem riqueza ou rendimentos sob a forma de moeda</strong>.</li>\n<li>Uma forma desse \"imposto\" manifesta-se através da inflação, que é tanto maior quanto <strong>menos</strong> a economia estiver a crescer.</li>\n</ul>\n<h4>Problemas e possibilidade do financiamento do défice com moeda</h4>\n<ul>\n<li><strong>Problemas associados à inflação:</strong> injustiças; instabilidade; desperdício.</li>\n<li><strong>Porque é tentadora a emissão de moeda?</strong> É dissimulada; pode passar sem ser aprovada; pode ter menos custos políticos.</li>\n<li>O <strong>Tratado de Maastricht (1992)</strong> proibiu o financiamento monetário do défice público dos países da União Europeia. (Consequências?)</li>\n</ul>","keyTerms":[{"term":"Financiamento monetário do défice","def":"Cobertura do défice com emissão de nova moeda sem contrapartida (sem ser por open market); proibido na UE pelo Tratado de Maastricht (1992)."},{"term":"Imposto inflacionário","def":"Perda de valor da moeda existente provocada pela emissão de moeda para financiar o Estado; recai sobre quem detém moeda."}],"questions":[{"q":"Porque é que a emissão de moeda para financiar o Estado é descrita como 'um imposto'?","options":["Porque tem de ser aprovada no Orçamento do Estado como os outros impostos","Porque aumenta as receitas do IVA","Porque, ao gerar inflação, desvaloriza a moeda existente, penalizando quem detém riqueza ou rendimentos em moeda","Porque reduz a dívida pública externa"],"answer":2,"explanation":"A nova moeda faz subir os preços e reduz o poder de compra da moeda existente: é um 'imposto' sobre quem tem moeda. Pelo contrário, uma das razões por que é tentadora é poder passar SEM ser aprovada.","id":"q1upb84z"},{"q":"Qual das seguintes NÃO é apontada nas aulas como razão para a emissão de moeda ser 'tentadora' para financiar o Estado?","options":["É dissimulada","Não provoca inflação se a economia estiver em recessão","Pode ter menos custos políticos","Pode passar sem ser aprovada"],"answer":1,"explanation":"As três razões dos slides são: dissimulada, pode passar sem aprovação, menos custos políticos. Aliás, a inflação daí resultante é tanto MAIOR quanto menos a economia estiver a crescer.","id":"q18bm0kx"}],"key":"u8-8.2.4"},{"id":"8.2","title":"Toda a despesa do Estado é paga com impostos (8.2.5) e cinco pontos importantes","pages":[229,230],"summary":"<h4>8.2.5 Toda a despesa do Estado é paga com impostos!</h4><p>A ideia central do professor: <strong>no fim, TODA a despesa do Estado é paga com impostos</strong>, ainda que sob formas diferentes:</p><ul><li><strong>Impostos são impostos</strong> (pagamento direto e imediato).</li><li><strong>A emissão de dívida hoje significa impostos futuros</strong> para pagar os juros e amortizar essa dívida.</li><li><strong>A emissão de moeda para financiar o Estado é também um imposto</strong> sobre quem tem riqueza ou rendimentos sob a forma de moeda, pois aumenta os preços face à situação que haveria sem essa emissão de moeda (imposto inflacionário).</li></ul><h4>Cinco pontos importantes</h4><ol><li>O <strong>défice</strong> das contas do Estado ocorre quando os impostos não chegam para cobrir as despesas do Estado.</li><li>Sempre que há défice das contas do Estado, a <strong>dívida do Estado aumenta</strong>.</li><li>O <strong>peso das receitas públicas no PIB tem aumentado em Portugal</strong>; essa tendência também se tem verificado noutros países.</li><li>«Existe aparentemente um enorme desvio entre o que os portugueses acham que devem ter como funções do Estado e os impostos que estão dispostos a pagar» [Vítor Gaspar, Out. 2012].</li><li>Quando os impostos não chegam para pagar as despesas do Estado, este tem de recorrer à <strong>dívida pública e/ou à emissão de moeda</strong>.</li></ol>","keyTerms":[{"term":"Défice das contas do Estado","def":"Situação em que as receitas (impostos) não chegam para cobrir as despesas do Estado; implica aumento da dívida pública."},{"term":"Dívida pública como imposto futuro","def":"A emissão de dívida hoje obriga a cobrar impostos no futuro para pagar juros e amortizar essa dívida."},{"term":"Emissão de moeda como imposto","def":"Financiar o Estado com emissão de moeda faz subir os preços face à situação sem emissão, tributando quem detém riqueza ou rendimentos em moeda."}],"questions":[{"q":"Segundo a perspetiva apresentada nas aulas, financiar a despesa do Estado através da emissão de moeda:","options":["Não tem custos para ninguém, porque o Estado não precisa de cobrar impostos.","Equivale a um empréstimo dos bancos comerciais que nunca terá de ser pago.","Reduz a necessidade de impostos futuros e por isso é a forma mais barata de financiamento.","Funciona como um imposto sobre quem detém riqueza ou rendimentos em moeda, porque faz subir os preços face à situação sem essa emissão."],"answer":3,"explanation":"O professor sublinha que toda a despesa é paga com impostos: a emissão de moeda aumenta os preços face ao que aconteceria sem ela, retirando poder de compra a quem detém moeda. A ideia de que 'não tem custos' é a armadilha: o custo existe, apenas é menos visível.","id":"qm1c4aq"}],"key":"u8-8.2"},{"id":"8.3","title":"Saldo orçamental e PIB real: saldo estrutural, saldo cíclico e saldo total (8.3.1)","pages":[230,238],"summary":"<h4>8.3 Relação do saldo orçamental do Estado com o PIB real verificado</h4><p><strong>Saldo orçamental = receitas − despesas do Estado.</strong> Analisa-se o comportamento das receitas, das despesas e do saldo face ao PIB real verificado.</p><h4>Receitas de impostos</h4><p>Gráfico: eixo vertical = receita do Estado com impostos; eixo horizontal = PIB real. A <strong>receita de impostos é crescente com o PIB real</strong> (reta positivamente inclinada): mais atividade e rendimento geram mais impostos.</p><h4>Despesa primária do Estado</h4><p>A <strong>despesa primária</strong> é a despesa do Estado <strong>sem o pagamento de juros da dívida</strong> (sem o peso do passado) e <strong>sem despesas de capital</strong> (sem investimentos). No Orçamento de Estado designa-se como <strong>despesa corrente primária</strong>. No gráfico é <strong>decrescente com o PIB real</strong> (quando a economia está pior, aumentam p. ex. subsídios de desemprego e outras transferências).</p><h4>Conjugação receitas/despesas</h4><p>O <strong>saldo orçamental primário</strong> (sem juros da dívida e sem despesas de capital) é a <strong>diferença na vertical entre a receita e a despesa</strong>:</p><ul><li>À esquerda da interseção (PIB baixo): saldo primário <strong>negativo</strong>.</li><li>Na interseção: saldo primário <strong>zero</strong>.</li><li>À direita da interseção (PIB alto): saldo primário <strong>positivo</strong>.</li></ul><h4>Equilíbrio estrutural</h4><p>Há <strong>equilíbrio estrutural</strong> quando o saldo é <strong>zero com o PIB potencial (Y<sub>p</sub>)</strong>, ou seja, com o PIB de quando a economia funciona com normalidade (a interseção das retas ocorre exatamente em Y<sub>p</sub>).</p><h4>Défices e superávites cíclicos</h4><ul><li>Mesmo havendo equilíbrio estrutural, se o <strong>PIB real verificado &lt; PIB potencial</strong>, verifica-se um <strong>défice cíclico</strong> (a despesa está acima da receita nesse ponto).</li><li>Se houver equilíbrio estrutural e o <strong>PIB real verificado &gt; PIB potencial</strong>, verifica-se um <strong>superávite cíclico</strong>.</li><li>Com equilíbrio estrutural, <strong>em média o saldo é zero</strong>: como a economia flutua em torno do PIB potencial, os superávites cíclicos compensam os défices cíclicos.</li></ul><h4>Défice e superávite estruturais</h4><ul><li><strong>Défice estrutural</strong>: em Y<sub>p</sub> a despesa primária está acima da receita (Y<sub>p</sub> fica à esquerda da interseção). Se o PIB potencial não está a crescer, para eliminar o défice estrutural tem de se <strong>subir a receita de impostos e/ou descer a despesa primária</strong>. <strong>Portugal tem diminuído o défice estrutural.</strong></li><li><strong>Superávite estrutural</strong>: em Y<sub>p</sub> a receita está acima da despesa (Y<sub>p</sub> à direita da interseção). O Estado vai acumulando excedentes; pode ser necessário se houver dívida do passado para pagar.</li></ul><h4>Controlo do Governo</h4><p>O <strong>saldo estrutural</strong> depende da estrutura das receitas e despesas do Estado; por isso, conceptualmente, é o saldo <strong>que mais pode ser controlado pelo Governo</strong>. O <strong>défice cíclico</strong> resulta do afastamento do PIB verificado face ao potencial; embora condicionado pela estrutura orçamental, é <strong>mais aleatório e dependente da situação económica</strong>.</p><h4>Cálculo do saldo cíclico</h4><ul><li><strong>Défice verificado (total) = défice estrutural + défice cíclico</strong>.</li><li>Logo: <strong>défice cíclico = défice total − défice estrutural</strong>. Calcula-se assim porque é mais fácil determinar o défice estrutural, que é mais estável.</li><li>Generalizando (défice, superávite ou equilíbrio): <strong>Saldo verificado ou total = saldo estrutural + saldo cíclico</strong>.</li><li>Saldo estrutural = o que ocorreria se o PIB fosse igual ao PIB potencial, para uma dada estrutura de receitas e despesas. A designação vem da associação ao PIB potencial.</li><li>Saldo cíclico = parte do saldo devida ao PIB não ser igual ao potencial (flutuação da economia). O défice é o caso particular de saldo negativo.</li></ul><p><em>Exemplo:</em> saldo total = −4% do PIB e saldo estrutural = −1,5% ⇒ saldo cíclico = −4 − (−1,5) = −2,5% (défice cíclico).</p>","keyTerms":[{"term":"Saldo orçamental","def":"Receitas menos despesas do Estado."},{"term":"Despesa primária","def":"Despesa do Estado sem juros da dívida e sem despesas de capital (investimento); no OE: despesa corrente primária. Decresce com o PIB real."},{"term":"Saldo primário","def":"Saldo sem juros da dívida e sem despesas de capital; diferença vertical entre receita de impostos e despesa primária."},{"term":"Equilíbrio estrutural","def":"Saldo nulo quando o PIB é igual ao PIB potencial."},{"term":"Saldo estrutural","def":"Saldo que ocorreria se o PIB fosse igual ao PIB potencial, dada a estrutura de receitas e despesas; o mais controlável pelo Governo."},{"term":"Saldo cíclico","def":"Parte do saldo devida ao afastamento do PIB verificado face ao potencial; défice cíclico se PIB < Yp, superávite cíclico se PIB > Yp."},{"term":"Saldo total ou verificado","def":"Saldo estrutural + saldo cíclico."}],"questions":[{"q":"A despesa primária do Estado corresponde:","options":["À despesa do Estado sem juros da dívida e sem despesas de capital.","À totalidade da despesa do Estado, incluindo juros e investimentos.","Apenas às despesas de investimento público.","À despesa do Estado excluindo as transferências para as famílias."],"answer":0,"explanation":"A despesa primária exclui os juros (o peso do passado) e as despesas de capital; no OE designa-se despesa corrente primária. Excluir as transferências é errado: estas fazem parte dela e explicam que diminua quando o PIB sobe.","id":"qkpxhwi"},{"q":"Num país com o orçamento em equilíbrio estrutural, o PIB real verificado está abaixo do PIB potencial. Então:","options":["Existe um superávite cíclico.","Existe um défice cíclico.","Existe um défice estrutural.","O saldo verificado é obrigatoriamente zero."],"answer":1,"explanation":"Com PIB abaixo de Yp, a receita de impostos é menor e a despesa primária maior do que em Yp, gerando um défice cíclico, mesmo havendo equilíbrio estrutural. Não é défice estrutural, porque em Yp o saldo é zero.","id":"qh5f9ct"},{"q":"O saldo orçamental total de um país é de −4% do PIB e o saldo estrutural é de −1,5% do PIB. O saldo cíclico é:","options":["−5,5% do PIB","+2,5% do PIB","−2,5% do PIB","−1,5% do PIB"],"answer":2,"explanation":"Saldo total = estrutural + cíclico ⇒ cíclico = −4 − (−1,5) = −2,5%. Somar os dois défices (−5,5%) é o erro tentador.","id":"q1lilpeq"},{"q":"Qual dos saldos orçamentais é, conceptualmente, o que mais pode ser controlado pelo Governo?","options":["O saldo cíclico, porque depende das flutuações do PIB.","O saldo verificado, porque é o que aparece nas contas.","O saldo primário cíclico.","O saldo estrutural, porque depende da estrutura das receitas e despesas do Estado."],"answer":3,"explanation":"O saldo estrutural depende da estrutura de receitas e despesas definida pelo Governo. O saldo cíclico é mais aleatório, pois depende do afastamento do PIB face ao potencial.","id":"q18a694y"}],"key":"u8-8.3"},{"id":"8.3","title":"Sustentabilidade das finanças públicas no longo prazo (8.3.2)","pages":[239,239],"summary":"<h4>8.3.2 Sustentabilidade das finanças públicas no longo prazo</h4><p><strong>A manutenção de um défice estrutural não é sustentável a longo prazo.</strong></p><ul><li>Se há défice estrutural, a <strong>dívida está sempre a aumentar</strong>. Se há dívida, tem de haver quem a financie; não é possível aumentá-la indefinidamente, pois não se encontra quem empreste se não houver possibilidade de pagar.</li><li>Quanto mais o défice estiver abaixo do saldo orçamental estruturalmente equilibrado, <strong>menos sustentável</strong> é o défice.</li><li>Há um saldo orçamental <strong>estruturalmente equilibrado</strong> se, quando ocorre o PIB potencial, o saldo é zero.</li><li>Há que atender às <strong>condicionantes sociais e demográficas</strong>: populações pobres ou populações a envelhecer tornam o défice menos sustentável.</li></ul>","keyTerms":[{"term":"Sustentabilidade das finanças públicas","def":"Capacidade de manter as contas do Estado sem aumento indefinido da dívida; incompatível com défice estrutural persistente."}],"questions":[{"q":"Qual das afirmações sobre a sustentabilidade das finanças públicas está de acordo com a matéria?","options":["Um défice estrutural pode manter-se indefinidamente desde que a economia cresça.","O envelhecimento da população torna um défice mais sustentável, porque reduz o consumo.","A manutenção de um défice estrutural não é sustentável a longo prazo, pois a dívida está sempre a aumentar e deixa de haver quem a financie.","Um défice cíclico persistente é a principal fonte de insustentabilidade, mesmo com equilíbrio estrutural."],"answer":2,"explanation":"Com défice estrutural a dívida cresce sempre e ninguém empresta sem perspetiva de pagamento. Populações pobres ou envelhecidas tornam o défice MENOS sustentável; com equilíbrio estrutural os défices cíclicos compensam-se com superávites.","id":"qacklhi"}],"key":"u8-8.3-2"},{"id":"8.1 Ex.","title":"Caderno de exercícios — Funções do Estado, financiamento, saldos orçamentais e Orçamento 2026","pages":[320,334],"summary":"<h4>Ex. 8.1 – Funções económicas do Estado</h4><ul><li>Promoção da <strong>eficiência</strong>, da <strong>equidade</strong> e da <strong>estabilidade</strong> económica.</li><li><strong>Política orçamental</strong> (ex.: gastos públicos, aumento dos impostos ou dos subsídios, como o subsídio de desemprego).</li><li><strong>Política não orçamental</strong> (ex.: regulação da concorrência nos mercados – comportamento das empresas e promoção da concorrência para que preço e quantidade sejam os mais favoráveis à sociedade/consumidores).</li></ul><h4>Ex. 8.2 – Financiamento do Estado</h4><p>Formas de financiamento e a <strong>Restrição Orçamental do Estado</strong> (despesas financiadas por impostos, endividamento e emissão de moeda) – abordadas na aula teórica; comentar «Todas as formas que o Governo tem de se financiar são impostos» (o endividamento é imposto futuro; a emissão de moeda gera inflação, o «imposto inflacionário»).</p><h4>Ex. 8.3 – Saldos orçamentais</h4><ul><li><strong>Saldo estrutural</strong>: o que ocorre quando o PIB está ao nível do <strong>PIB potencial</strong> (apenas desemprego natural) – saldo quando a economia funciona dentro da normalidade.</li><li><strong>Saldo cíclico</strong>: parte do saldo que ocorre por a economia não estar ao nível do PIB potencial – decorre das flutuações em torno do potencial.</li><li><strong>Saldo total (verificado)</strong> = saldo estrutural + saldo cíclico. Em geral o cíclico calcula-se como total − estrutural, sendo o estrutural <strong>estimado</strong>.</li></ul><h4>Ex. 8.4 – Quadro 2.4: Previsões para 2025-2026 (OE 2026)</h4><p>Previsões de MF, BdP, CFP, OCDE, FMI e CE. Destaques (MF): PIB real 2,0% em 2025 e 2,3% em 2026; consumo privado 3,4% e 2,7%; investimento (FBCF) 3,6% e 5,5%; exportações 1,5% e 1,8%; importações 4,0% e 3,6%; contributo da procura interna 3,2 p.p. e 3,1 p.p.; procura externa líquida −1,2 p.p. e −0,9 p.p.; deflator do PIB 3,6% e 2,5%; inflação (IHPC) 2,4% e 2,1%; taxa de desemprego 6,1% e 6,0%; emprego 1,7% e 0,9%; capacidade de financiamento face ao exterior 3,1% e 3,0% do PIB.</p><ul><li>Importância: as previsões do Governo evidenciam que o resultado final do orçamento verificado é em parte <strong>aleatório</strong>; mesmo um orçamento bem feito não permite prever nem controlar totalmente a sua execução.</li></ul><h4>Ex. 8.5 – Défice e dívida</h4><p>Há <strong>défice</strong> quando os impostos (receitas) não chegam para pagar as despesas do Estado. Sempre que há défice financiado com dívida, a <strong>dívida aumenta</strong>.</p>","keyTerms":[{"term":"Funções económicas do Estado","def":"Promoção da eficiência, da equidade e da estabilidade."},{"term":"Saldo estrutural","def":"Saldo orçamental com o PIB ao nível potencial (só desemprego natural); é estimado."},{"term":"Saldo cíclico","def":"Parte do saldo devida aos desvios do PIB face ao potencial; = saldo total − saldo estrutural."},{"term":"Saldo total (verificado)","def":"Soma do saldo estrutural com o saldo cíclico."},{"term":"Défice orçamental","def":"Situação em que as receitas não cobrem as despesas; financiado com dívida, faz aumentar a dívida."}],"questions":[{"q":"O saldo orçamental verificado é de −3% do PIB e estima-se que o saldo estrutural seja −2% do PIB. O saldo cíclico é:","options":["−5% do PIB","+1% do PIB","−1% do PIB","−2% do PIB"],"answer":2,"explanation":"Saldo cíclico = total − estrutural = −3% − (−2%) = −1%: a economia está abaixo do PIB potencial e isso agrava o saldo. Somar os dois saldos (−5%) é um erro.","id":"qjn48dt"},{"q":"Qual dos seguintes é um exemplo de política NÃO orçamental do Estado, segundo o caderno?","options":["Aumento do subsídio de desemprego","Aumento dos gastos públicos em estradas","Aumento dos impostos sobre o rendimento","Regulação da concorrência nos mercados"],"answer":3,"explanation":"A regulação da concorrência condiciona o comportamento das empresas sem passar pelas receitas e despesas do orçamento. As outras três opções atuam através do orçamento.","id":"q1vfm81n"}],"key":"u8-8.1 Ex."}]},{"n":9,"title":"Política económica","short":"Política económica","sections":[{"id":"9.1","title":"Os diferentes tipos de política económica: impacto (com vs sem) e políticas conjunturais vs estruturais","pages":[239,242],"summary":"<h4>Estrutura do capítulo 9</h4><p>9.1 Tipos de política económica (9.1.1 como se vê o impacto; 9.1.2 conjunturais e estruturais); 9.2 Oferta agregada, procura agregada e flutuações (9.2.1–9.2.5); 9.3 Política orçamental (9.3.1–9.3.5: como atua, zona de depressão, para além da zona de depressão, crowding out, Curva de Laffer); 9.4 Política monetária; 9.5 Política cambial. (A abertura do capítulo mostra pinturas de motins — Laycock, «The Moss Side Riots», 1981; Banksy, «Riot Painting» — ilustrando as consequências sociais das crises.)</p><h4>9.1 Política conjuntural e política estrutural</h4><ul><li><strong>Política económica conjuntural</strong>: objetivo de <strong>estabilizar o ciclo económico</strong> (estabilizar a economia) ou promover outros objetivos que passem pela estabilização.</li><li><strong>Política económica estrutural</strong>: objetivo de <strong>aumentar o PIB potencial</strong>.</li><li>As políticas estruturais que passam pela despesa do Estado têm sempre um impacto conjuntural; as conjunturais têm sempre um impacto estrutural. Esses impactos percecionam-se comparando as situações <strong>com e sem</strong> as políticas.</li><li>A política conjuntural é sempre contextualizada (condicionada) pela estrutura da economia.</li></ul><h4>9.1.1 Como se vê o impacto da política económica</h4><p>Analisar o impacto de uma política é um caso particular de analisar o impacto de uma decisão: compara-se a situação <strong>COM</strong> a política com a situação <strong>SEM</strong> a política [muito, muito importante]. <strong>É errado comparar antes e depois</strong>, a não ser que antes e depois correspondam ao com e sem.</p><p><strong>Exemplo:</strong> desempregados passam de 100 000 (antes) para 120 000 (depois): +20 000. Caso (i): sem a política teriam passado para 150 000 ⇒ a política <strong>reduziu</strong> o desemprego em 30 000 (120 000 − 150 000 = −30 000). Caso (ii): sem a política teriam passado para 80 000 ⇒ a política <strong>aumentou</strong> o desemprego em 40 000 (120 000 − 80 000 = 40 000).</p><h4>9.1.2 Políticas conjunturais e estruturais</h4><table><tr><th>Conjunturais</th><th>Estruturais</th></tr><tr><td>Promovem a <strong>estabilidade</strong> da economia</td><td>Promovem o <strong>desenvolvimento</strong> da economia</td></tr><tr><td>Condicionadas pelo enquadramento estrutural</td><td>Pretendem alterar o enquadramento estrutural</td></tr><tr><td>Horizonte temporal <strong>mais curto</strong></td><td>Horizonte temporal <strong>mais longo</strong></td></tr><tr><td>Têm também implicações estruturais</td><td>Têm também implicações conjunturais</td></tr></table><p><strong>Devem ser articuladas</strong> — potenciam-se. Mas atenção: o ótimo de curto prazo não é necessariamente o ótimo de longo prazo.</p>","keyTerms":[{"term":"Política conjuntural","def":"Política que visa estabilizar o ciclo económico; horizonte mais curto; condicionada pela estrutura da economia."},{"term":"Política estrutural","def":"Política que visa aumentar o PIB potencial / promover o desenvolvimento; horizonte mais longo; altera o enquadramento estrutural."},{"term":"Princípio com vs sem","def":"O impacto de uma política mede-se comparando a situação com a política com a situação que existiria sem ela, e não o antes com o depois."}],"questions":[{"q":"Antes de uma política de emprego havia 200 000 desempregados e depois passou a haver 230 000. Estima-se que, sem a política, haveria 260 000 desempregados. O impacto da política no desemprego foi:","options":["Um aumento de 30 000 desempregados.","Uma redução de 30 000 desempregados.","Uma redução de 60 000 desempregados.","Nulo, porque o desemprego aumentou de qualquer forma."],"answer":1,"explanation":"Compara-se com vs sem: 230 000 − 260 000 = −30 000. Comparar antes e depois (+30 000) é exatamente o erro que o professor aponta.","id":"qiwfp9"},{"q":"Qual das características pertence às políticas estruturais e não às conjunturais?","options":["Promovem a estabilidade da economia.","Têm como referência um horizonte temporal mais curto.","Estão condicionadas pelo enquadramento estrutural da economia.","Pretendem alterar o enquadramento estrutural da economia e aumentar o PIB potencial."],"answer":3,"explanation":"As estruturais promovem o desenvolvimento, visam aumentar o PIB potencial e alterar o enquadramento estrutural, num horizonte mais longo. As outras três opções descrevem políticas conjunturais.","id":"qerqyqx"}],"key":"u9-9.1"},{"id":"9.2","title":"Oferta agregada, procura agregada e flutuações macroeconómicas","pages":[243,256],"summary":"<h4>Porque se estuda a OA e a PA</h4><p>A sua conjunção determina a <strong>flutuação das quantidades e dos preços</strong>. As políticas conjunturais (de curto prazo) abordadas <strong>incidem sobre a procura agregada</strong> (políticas sobre a oferta são menos comuns e com implicações estruturais difíceis de modelizar). Considera-se que, <strong>no curto prazo, tudo está fixo e as alterações devem-se a alterações na quantidade de trabalho empregue</strong>.</p><h4>O modelo</h4><p>Gráfico com P (nível de preços) no eixo vertical e PIB real no horizontal: <strong>S<sub>CP</sub></strong> (oferta agregada de curto prazo, crescente) e <strong>D</strong> (procura agregada, decrescente), com <strong>D = C + I + G + X − M</strong>. O cruzamento dá P* e y*.</p><h4>9.2.1 Oferta agregada</h4><p><strong>Longo prazo</strong> (análise conjuntural): tempo necessário para que as variáveis se ajustem e o PIB real fique no nível de pleno emprego/PIB potencial — não significa necessariamente muito ou pouco tempo. <strong>Curto prazo</strong>: não há tempo para esse ajustamento (que diz respeito ao nível de emprego). Noutros contextos, longo prazo pode envolver ajustamento de estruturas de produção.</p><ul><li><strong>Oferta de longo prazo — vertical em Y<sub>p</sub></strong>: Y<sub>p</sub> é o PIB potencial ou de pleno emprego (pleno emprego dos recursos, nomeadamente trabalho, dadas as condicionantes estruturais). O nível de preços não altera o potencial da economia, por isso a curva é vertical. P é o nível de preços (índice de preços).</li><li><strong>Oferta de curto prazo S<sub>CP</sub> — positivamente inclinada</strong>: no curto prazo os preços sobem mas os <strong>salários nominais mantêm-se</strong>; para uma dada quantidade de trabalho oferecida as empresas ganham mais, a <strong>produtividade marginal do trabalho em valor aumenta</strong>, as empresas procuram mais trabalho e produzem mais.</li></ul><h4>9.2.2 Procura agregada</h4><p>Total de bens e serviços que as pessoas de uma economia <strong>planeiam comprar</strong>. Fatores: nível de preços, expectativas, política orçamental e monetária, economia mundial. É <strong>negativamente inclinada</strong> por:</p><ul><li><strong>Efeito rendimento</strong>: se o nível de preços sobe, as pessoas ficam mais pobres.</li><li><strong>Efeito substituição</strong>: se o nível de preços sobe, a taxa de juro sobe e as pessoas substituem consumo presente por consumo futuro e produção interna por externa.</li></ul><table><tr><th>D desloca-se para a ESQUERDA (D<sub>0</sub>→D<sub>1</sub>)</th><th>D desloca-se para a DIREITA</th></tr><tr><td>Redução do rendimento futuro ou dos lucros esperados</td><td>Aumento do rendimento futuro ou dos lucros esperados</td></tr><tr><td>Aumento dos impostos; redução dos gastos ou transferências do Governo</td><td>Redução dos impostos; aumento dos gastos ou transferências</td></tr><tr><td>Descida da quantidade de moeda ou subida das taxas de juro</td><td>Subida da quantidade de moeda ou descida das taxas de juro</td></tr><tr><td>Valorização da moeda nacional ou descida do rendimento do exterior</td><td>Desvalorização da moeda nacional ou subida do rendimento do exterior</td></tr></table><h4>9.2.3 Flutuações e OA/PA</h4><p>Equilíbrio de curto prazo: cruzamento S<sub>CP</sub>–D. No curto prazo, tudo o resto igual, <strong>os preços estão estáveis se a oferta de curto prazo for igual à de longo prazo</strong> (cruzamento em y<sub>p</sub>). O <strong>ciclo económico</strong> tem a ver com o equilíbrio de curto prazo face ao pleno emprego: gráfico do PIB real ao longo do tempo em torno do produto potencial:</p><ul><li>t=1: y* &lt; y<sub>p</sub> — <strong>gap recessivo</strong>.</li><li>t=2: y* = y<sub>p</sub> — <strong>pleno emprego</strong>.</li><li>t=3: y* &gt; y<sub>p</sub> — <strong>gap expansivo</strong> (frequentemente chamado <strong>gap inflacionário</strong>).</li></ul><p>Conjugado com a evolução do PIB potencial (normalmente crescente): é possível uma economia <strong>crescer mas estar «arrefecida»</strong>, por estar abaixo do produto potencial que poderia alcançar.</p><h4>9.2.4 Estabilização do ciclo económico</h4><p>Estabilizar = fazer com que o PIB verificado se aproxime o mais possível do potencial (atenuando flutuações): subir o PIB se estiver abaixo, baixá-lo se estiver acima. Faz-se <strong>manipulando a curva da procura agregada</strong>, de modo a cruzar a oferta num ponto mais acima ou abaixo. Admite-se PIB potencial (e oferta) fixo; as alterações de PIB de equilíbrio decorrem do mercado de trabalho (mais/menos horas, mais/menos pessoas empregadas). O impacto depende da posição da economia no ciclo; a análise é <strong>qualitativa</strong>. A economia tende sempre para o produto potencial, mas pode demorar muito e levantar problemas sociais; por simplicidade supõe-se que a economia não se ajusta sem o «empurrão» inicial da política.</p><h4>9.2.5 Formato da curva da oferta e impacto nos preços</h4><p>O formato da S<sub>CP</sub> depende da posição face a Y<sub>p</sub>:</p><ul><li><strong>Zona de depressão</strong>: muito abaixo de Y<sub>p</sub>, a oferta é <strong>horizontal</strong>.</li><li><strong>Zona de recessão</strong>: pouco abaixo de Y<sub>p</sub>, oferta crescente.</li><li><strong>Zona de expansão (sobreaquecimento)</strong>: acima de Y<sub>p</sub>, oferta crescente.</li><li><strong>Limite das possibilidades de produção</strong>: oferta <strong>vertical</strong>.</li></ul><h4>Recessão e depressão</h4><ul><li>Definem-se a partir da evolução do PIB real, mas deve-se considerar também desemprego, investimento, comércio internacional, duração, profundidade e difusão pelos setores.</li><li><strong>Recessão técnica</strong>: queda do PIB real em <strong>dois trimestres consecutivos</strong>.</li><li><strong>Depressão</strong>: quebra do PIB real <strong>superior a 10%</strong>.</li><li>Conceitos discutíveis. Recessões e depressões podem ser leves ou profundas. Quanto mais acentuada a depressão, mais a oferta tende para a horizontal (estilização: com uma quebra de 10% a S<sub>CP</sub> ainda pode ser crescente).</li></ul>","keyTerms":[{"term":"Procura agregada (D)","def":"Total de bens e serviços que os agentes planeiam comprar: D = C + I + G + X − M; negativamente inclinada (efeitos rendimento e substituição)."},{"term":"Oferta agregada de longo prazo","def":"Vertical no PIB potencial Yp, porque o nível de preços não altera o potencial da economia."},{"term":"Oferta agregada de curto prazo (SCP)","def":"Positivamente inclinada: os preços sobem com salários nominais fixos, aumentando a produtividade marginal do trabalho em valor."},{"term":"Longo prazo (análise conjuntural)","def":"Tempo necessário para o PIB real se ajustar ao PIB potencial/pleno emprego."},{"term":"Gap recessivo","def":"PIB real de equilíbrio abaixo do PIB potencial."},{"term":"Gap expansivo (inflacionário)","def":"PIB real de equilíbrio acima do PIB potencial."},{"term":"Recessão técnica","def":"Queda do PIB real em dois trimestres consecutivos."},{"term":"Depressão","def":"Quebra do PIB real superior a 10% (em geral)."},{"term":"Estabilizar o ciclo económico","def":"Aproximar o PIB verificado do potencial, manipulando a procura agregada."}],"questions":[{"q":"Porque é que a curva de oferta agregada de curto prazo é positivamente inclinada?","options":["Porque no curto prazo os preços sobem mas os salários nominais mantêm-se, aumentando a produtividade marginal do trabalho em valor e levando as empresas a contratar e produzir mais.","Porque os salários nominais sobem mais do que os preços.","Porque o PIB potencial aumenta quando o nível de preços sobe.","Porque, perante preços mais altos, as famílias substituem consumo presente por consumo futuro."],"answer":0,"explanation":"A justificação dada é a rigidez dos salários nominais face à subida dos preços. A última opção descreve o efeito substituição, que explica a inclinação da PROCURA agregada, não da oferta.","id":"q14ypew6"},{"q":"Qual das seguintes situações desloca a curva de procura agregada para a direita?","options":["Valorização da moeda nacional.","Aumento dos impostos.","Desvalorização da moeda nacional.","Redução dos lucros esperados pelas empresas."],"answer":2,"explanation":"A desvalorização torna as exportações mais competitivas e as importações mais caras, aumentando X − M. As restantes deslocam D para a esquerda.","id":"qvbegtm"},{"q":"No gráfico do ciclo económico, num ano em que o PIB real de equilíbrio está acima do produto potencial, diz-se que existe:","options":["Um gap recessivo.","Um gap expansivo, também chamado gap inflacionário.","Uma situação de pleno emprego.","Uma recessão técnica."],"answer":1,"explanation":"PIB acima de Yp corresponde a gap expansivo/inflacionário; abaixo de Yp é gap recessivo. Recessão técnica refere-se a dois trimestres consecutivos de queda do PIB real.","id":"q15wh80n"},{"q":"De acordo com as definições usuais apresentadas nas aulas:","options":["Há depressão sempre que o PIB real cai durante dois trimestres consecutivos.","Há recessão técnica quando o PIB real cai mais de 10%.","Uma economia que cresce nunca pode estar «arrefecida».","Há recessão técnica quando o PIB real cai em dois trimestres consecutivos e depressão quando a quebra do PIB real é superior a 10%."],"answer":3,"explanation":"Recessão técnica: queda em dois trimestres consecutivos; depressão: quebra superior a 10%. A terceira opção é falsa: uma economia pode crescer e estar abaixo do potencial (arrefecida).","id":"q1h8eipk"},{"q":"Na zona de depressão da economia, em que a oferta agregada de curto prazo é horizontal, um aumento da procura agregada:","options":["Aumenta o PIB real e o emprego sem fazer subir o nível de preços.","Faz apenas subir os preços, sem alterar o PIB real.","Aumenta o PIB real mas sempre com subida do nível de preços.","Não tem qualquer efeito, porque a economia está no limite das possibilidades de produção."],"answer":0,"explanation":"Com oferta horizontal o nível de preços está fixo; a expansão da procura aumenta produção e emprego. Só preços a subir sem alteração do PIB é o caso do limite das possibilidades de produção (oferta vertical).","id":"q1pd8ynx"}],"key":"u9-9.2"},{"id":"9.3","title":"Política económica orçamental: instrumentos, multiplicador, zonas do ciclo, crowding out e Curva de Laffer","pages":[256,265],"summary":"<h4>9.3 Política orçamental</h4><p>Tem como base as receitas e despesas do Orçamento do Estado (gastos, impostos, transferências). Tem <strong>sempre impacto conjuntural</strong> na procura agregada; pode ter impacto estrutural se afetar o PIB potencial (não necessariamente no mesmo período).</p><h4>9.3.1 Como atua</h4><p>D = C + I + G + X − M. O Estado atua <strong>diretamente</strong> aumentando/diminuindo os gastos (G) e <strong>indiretamente</strong> aumentando/diminuindo impostos e subsídios/transferências às famílias, influenciando o consumo (C).</p><p><strong>Restrição orçamental</strong>: todos os gastos têm de ser financiados. Pressupõe-se que o aumento de gastos é financiado com impostos e que o impacto dos gastos na procura supera o efeito contrário dos impostos (na análise keynesiana prova-se que gastos financiados com igual montante de impostos ainda deslocam D para a direita). Limitação: os gastos só podem ocorrer se o Estado tiver possibilidade de os financiar (aqui supõe-se satisfeito).</p><table><tr><th>Medidas que aumentam a procura</th><th>Medidas que diminuem a procura</th></tr><tr><td>Aumento de gastos</td><td>Descida de gastos</td></tr><tr><td>Aumento de subsídios</td><td>Descida de subsídios</td></tr><tr><td>Diminuição de impostos</td><td>Aumento de impostos</td></tr><tr><td>Aumento de gastos financiado por igual montante de impostos</td><td>Diminuição de gastos com igual redução de impostos</td></tr></table><h4>Efeito multiplicador da despesa</h4><ul><li><strong>Despesa autónoma</strong>: componentes que não dependem do rendimento — consumo autónomo, investimento, gastos do Estado, exportações.</li><li>Se uma aumenta, o rendimento aumenta; esse rendimento, recebido pelas famílias, gera mais consumo nos períodos seguintes ⇒ o impacto final no PIB é <strong>maior</strong> que a despesa inicial. Atenção: <strong>se o PIB não puder crescer, não há efeito multiplicador</strong>.</li><li><strong>Multiplicador = variação total do PIB / aumento inicial da despesa autónoma</strong> (ex.: quanto aumenta o PIB se G aumentar uma unidade).</li><li>Impostos e importações têm uma parte que depende do rendimento; aumentos do rendimento aumentam-nos, o que <strong>reduz o efeito multiplicador</strong>.</li></ul><p>Gráficos: <strong>política expansionista</strong> — A: primeiro impacto (D<sub>0</sub> → D<sub>0</sub>+ΔG) do aumento dos gastos/transferências ou diminuição de impostos; B: efeito multiplicador a partir do consumo agregado (→ D<sub>1</sub>, mais à direita). <strong>Contracionista</strong> — simétrico: A (D<sub>0</sub> → D<sub>0</sub>−ΔG) e B (multiplicador para a esquerda). Qualquer acréscimo de despesa autónoma tem o mesmo impacto qualitativo.</p><h4>9.3.2 Na zona de depressão</h4><p>O nível de preços está fixo (oferta horizontal): expansões da procura aumentam emprego e PIB <strong>sem subida de preços</strong>. Os salários já desceram a um nível muito baixo e não descem mais. É o contexto <strong>mais consensual</strong> para a política orçamental: a economia deprimida tem dificuldade em atingir sozinha o PIB potencial (ou demora muito, com graves problemas sociais). É o pressuposto da <strong>política keynesiana</strong>. Exemplos: <strong>New Deal</strong> (EUA, 1933–1936, F. D. Roosevelt) e rearmamento da Alemanha nos anos 30. A política keynesiana fez escola durante décadas, por vezes aplicada em contextos inadequados (também em Portugal).</p><h4>9.3.3 Para além da zona de depressão</h4><p>A oferta é positivamente inclinada: o nível de preços não está fixo. A economia poderia por si caminhar para Y<sub>p</sub>, mas o ajustamento pode ser longo e incerto. A política orçamental acelera o ajustamento, mas provoca <strong>crowding out</strong> e conduz a um nível de preços mais alto do que sem ela.</p><ul><li><strong>Zona de recessão</strong>: o aumento da procura faz subir os preços; apressa o caminho para o PIB potencial, mas com preços mais altos.</li><li><strong>Zona de expansão</strong>: faz subir os preços; a economia acaba por recuar para Y<sub>p</sub> (funcionamento normal) com preços mais altos.</li><li><strong>Limite das possibilidades de produção</strong>: <strong>apenas sobem os preços</strong>; as quantidades não se alteram.</li></ul><h4>9.3.4 Crowding out</h4><p>A atividade tende para o PIB potencial (recursos usados com eficiência e normalidade). Quando o Estado aumenta os gastos vai buscar recursos, direta ou indiretamente, ao setor não estatal: <strong>menos consumo (sobretudo bens duradouros) e menos investimento</strong>. O menor investimento, devido à subida das taxas de juro pelo maior endividamento do Estado, pode reduzir o crescimento. Mesmo indo para Y<sub>p</sub>, a composição do PIB muda. Os gastos do Estado têm sempre um <strong>custo de oportunidade</strong>.</p><ul><li><strong>Forma direta</strong>: aumentam os impostos, o setor privado fica com menos recursos.</li><li><strong>Forma indireta</strong>: o Estado endivida-se, oferece taxas de juro mais altas, as poupanças são desviadas para empréstimos ao Estado (futuros impostos); a taxa de juro sobe ⇒ desce o investimento e o consumo de bens duradouros (carros, frigoríficos), comprados a crédito.</li><li>Processo inverso: <strong>crowding in</strong>.</li></ul><h4>9.3.5 Curva de Laffer</h4><p>Outra limitação da política orçamental. Relação entre a <strong>taxa de impostos</strong> (taxa global implícita, de 0% a 100%) e a <strong>receita fiscal</strong>: curva em forma de U invertido, receita nula a 0% e a 100%, máxima em <strong>T*</strong>. <strong>A partir de T* a receita fiscal cai</strong> quando a taxa sobe. No gráfico, EUA e Reino Unido estão no ramo ascendente; França perto do máximo. «Que se passará com Portugal?»</p>","keyTerms":[{"term":"Política orçamental","def":"Política baseada nas receitas e despesas do OE (gastos, impostos, transferências), atuando sobre a procura agregada."},{"term":"Despesa autónoma","def":"Componentes da despesa que não dependem do rendimento: consumo autónomo, investimento, gastos do Estado, exportações."},{"term":"Efeito multiplicador","def":"Rácio entre a variação total do PIB e o aumento inicial da despesa autónoma; reduzido por impostos e importações dependentes do rendimento; nulo se o PIB não puder crescer."},{"term":"Política keynesiana","def":"Intervenção do Estado, via política orçamental, para expandir a atividade, sobretudo em depressão (ex.: New Deal)."},{"term":"Crowding out","def":"Redução do consumo (bens duradouros) e do investimento privados devido aos maiores gastos do Estado, direta (impostos) ou indiretamente (subida das taxas de juro)."},{"term":"Crowding in","def":"Processo inverso ao crowding out."},{"term":"Curva de Laffer","def":"Relação entre taxa de impostos e receita fiscal: a receita sobe até T* e cai a partir daí."}],"questions":[{"q":"Qual das seguintes medidas orçamentais DIMINUI a procura agregada, segundo a matéria?","options":["Aumento de gastos financiado por igual montante de impostos.","Diminuição de gastos com igual redução de impostos.","Aumento dos subsídios às famílias.","Diminuição de impostos."],"answer":1,"explanation":"Pelos pressupostos keynesianos, o efeito dos gastos supera o dos impostos, pelo que reduzir gastos e impostos no mesmo montante diminui a procura. O aumento de gastos financiado por impostos, pelo contrário, aumenta-a.","id":"q1362553"},{"q":"Sobre o efeito multiplicador da despesa, é correto afirmar que:","options":["Aumenta quando impostos e importações dependem mais do rendimento.","Existe mesmo que o PIB não possa crescer.","Resulta de o aumento inicial do rendimento gerar mais consumo nos períodos seguintes, sendo o impacto final no PIB maior do que a despesa inicial.","Só se aplica aos gastos do Estado e não às exportações nem ao investimento."],"answer":2,"explanation":"O multiplicador vem do consumo induzido. Impostos e importações dependentes do rendimento REDUZEM-no, não há multiplicador se o PIB não puder crescer, e aplica-se a qualquer despesa autónoma.","id":"qr9246b"},{"q":"Quando o Estado aumenta o seu endividamento para financiar mais gastos, o efeito de crowding out indireto ocorre porque:","options":["A taxa de juro desce, o que estimula o consumo das famílias.","As exportações aumentam devido à valorização da moeda.","O Estado passa a cobrar menos impostos ao setor privado.","O Estado tem de oferecer taxas de juro mais altas; as poupanças são desviadas do setor privado e o investimento e o consumo de bens duradouros diminuem."],"answer":3,"explanation":"O mecanismo indireto passa pela subida das taxas de juro, que reduz investimento e consumo de bens duradouros comprados a crédito. A via direta é a subida de impostos, não a descida.","id":"q1oi5psc"},{"q":"De acordo com a Curva de Laffer, se um país tiver uma taxa global de impostos acima de T*, um aumento dessa taxa leva a:","options":["Uma diminuição da receita fiscal.","Um aumento proporcional da receita fiscal.","Uma receita fiscal máxima.","Uma receita fiscal inalterada."],"answer":0,"explanation":"A partir de T* a receita fiscal cai com a subida da taxa. A receita só é máxima exatamente em T*; antes de T* subir a taxa aumenta a receita.","id":"q1nx7o59"},{"q":"Segundo a matéria, em que contexto é mais consensual a utilização de uma política orçamental expansionista?","options":["No limite das possibilidades de produção.","Na zona de expansão (sobreaquecimento).","Na zona de depressão, onde o nível de preços está fixo e a economia tem dificuldade em atingir sozinha o PIB potencial.","Na zona de recessão ligeira, onde não há qualquer efeito sobre os preços."],"answer":2,"explanation":"Na depressão a procura aumenta o PIB e o emprego sem subir preços e os benefícios sociais são maiores (contexto keynesiano, ex. New Deal). Na zona de recessão os preços sobem; no limite das possibilidades só sobem os preços.","id":"q43uf22"}],"key":"u9-9.3"},{"id":"9.4","title":"Política económica monetária","pages":[266,268],"summary":"<h4>9.4 Política monetária</h4><p>Efetuada através da <strong>oferta de moeda</strong>; atua <strong>via taxa de juro e via investimento</strong>.</p><ul><li><strong>Aumento da oferta de moeda</strong> ⇒ taxa de juro desce ⇒ investimento aumenta ⇒ D desloca-se para a <strong>direita</strong>.</li><li><strong>Diminuição da oferta de moeda</strong> ⇒ taxa de juro sobe ⇒ investimento desce ⇒ D desloca-se para a <strong>esquerda</strong>.</li><li>Na política monetária está implícito <strong>substituir consumo por investimento</strong>, pretendendo-se impacto final positivo no PIB e maior crescimento.</li></ul><h4>Mercado monetário e taxa de juro nominal</h4><p>Gráficos com i (taxa de juro) no eixo vertical e M (moeda) no horizontal: oferta de moeda M<sup>S</sup> vertical, procura M<sup>D</sup> decrescente. M<sup>S</sup><sub>0</sub> → M<sup>S</sup><sub>1</sub> para a direita reduz i; para a esquerda aumenta i. Pela procura de títulos negociáveis, a evolução transmite-se à <strong>taxa de juro real</strong>. Taxa de juro real ↓ ⇒ D aumenta (investimento); taxa real ↑ ⇒ D diminui.</p><p><strong>Atenção:</strong> se o índice de preços subir tanto como a taxa de juro nominal, a taxa de juro real mantém-se e <strong>não há efeito no investimento</strong>.</p><h4>Deslocações da procura</h4><p>Aumento do investimento (ΔI): A = primeiro impacto (D<sub>0</sub> → D<sub>0</sub>+ΔI); B = efeito multiplicador a partir do consumo agregado (→ D<sub>1</sub>). Diminuição: simétrico (D<sub>0</sub> − ΔI e depois D<sub>1</sub>). O impacto no PIB e nos preços depende do ponto de cruzamento com a curva de oferta agregada (como na política orçamental).</p>","keyTerms":[{"term":"Política monetária","def":"Política efetuada através da oferta de moeda, atuando via taxa de juro e investimento."},{"term":"Mercado monetário","def":"Cruzamento da oferta de moeda (vertical) com a procura de moeda (decrescente), determinando a taxa de juro nominal."},{"term":"Taxa de juro real","def":"Taxa relevante para o investimento; se os preços sobem tanto quanto a taxa nominal, mantém-se."}],"questions":[{"q":"Um banco central aumenta a oferta de moeda. Segundo o mecanismo estudado:","options":["A taxa de juro sobe, o investimento diminui e a procura agregada desloca-se para a esquerda.","A taxa de juro desce, o investimento aumenta e a procura agregada desloca-se para a direita, com efeito multiplicador via consumo.","A oferta agregada de longo prazo desloca-se para a direita.","A procura agregada não se altera, porque a moeda não entra em D = C + I + G + X − M."],"answer":1,"explanation":"Mais moeda reduz a taxa de juro, estimula o investimento e desloca D para a direita (primeiro impacto ΔI e depois multiplicador). A política monetária atua sobre a procura, não sobre o PIB potencial.","id":"qdo8v5g"},{"q":"Em que caso um aumento da oferta de moeda NÃO tem efeito no investimento?","options":["Quando o índice de preços sobe tanto como a variação da taxa de juro nominal, deixando a taxa de juro real inalterada.","Quando a taxa de juro nominal desce.","Quando a procura de moeda é negativamente inclinada.","Quando a economia está na zona de recessão."],"answer":0,"explanation":"O investimento depende da taxa de juro real: se os preços acompanham a taxa nominal, a real não muda e não há efeito. A descida da taxa nominal, por si, é o efeito normal da política.","id":"qy49wq4"}],"key":"u9-9.4"},{"id":"9.5","title":"Política económica cambial","pages":[269,270],"summary":"<h4>9.5 Política cambial</h4><p>Baseia-se na <strong>manipulação da taxa de câmbio</strong>, através de câmbios fixos (e suas variantes) ou de operações que influenciam a taxa de câmbio de mercado.</p><p><strong>Taxa de câmbio (e)</strong>: preço de uma moeda em termos de outra. Na análise considera-se o <strong>preço da moeda estrangeira em termos da moeda nacional</strong> (ex.: no espaço euro, número de euros a pagar por cada dólar).</p><h4>Subida da taxa de câmbio = desvalorização da moeda nacional</h4><ul><li>Aumenta as exportações e diminui as importações.</li><li>Aumenta a procura agregada D = C + I + G + X − M (A: primeiro impacto D<sub>0</sub> → D<sub>0</sub>+Δ(X−M); B: efeito multiplicador a partir do consumo agregado → D<sub>1</sub>).</li><li>Nota: tem de haver <strong>capacidade na economia para produzir mais para exportação</strong>, e o aumento da quantidade exportada tem de <strong>compensar a desvalorização</strong> da moeda.</li></ul><h4>Descida da taxa de câmbio = valorização da moeda nacional</h4><ul><li>Diminui as exportações e aumenta as importações.</li><li>Diminui a procura agregada (D<sub>0</sub> → D<sub>0</sub>−Δ(X−M) e depois D<sub>1</sub> pelo multiplicador).</li></ul><p>O impacto depende do ponto de cruzamento com a curva de oferta agregada.</p>","keyTerms":[{"term":"Política cambial","def":"Manipulação da taxa de câmbio (câmbios fixos e variantes, ou operações no mercado cambial)."},{"term":"Taxa de câmbio (e)","def":"Preço da moeda estrangeira em moeda nacional (ex.: euros por dólar)."},{"term":"Desvalorização","def":"Subida de e: aumenta X, reduz M, aumenta a procura agregada."},{"term":"Valorização","def":"Descida de e: reduz X, aumenta M, reduz a procura agregada."}],"questions":[{"q":"Considerando a taxa de câmbio como o número de euros por dólar, uma subida da taxa de câmbio significa:","options":["Uma valorização do euro, que reduz as exportações e a procura agregada.","Uma valorização do euro, que aumenta as importações e a procura agregada.","Uma desvalorização do euro, que reduz as exportações e aumenta as importações.","Uma desvalorização do euro, que aumenta as exportações, reduz as importações e desloca a procura agregada para a direita."],"answer":3,"explanation":"Mais euros por dólar significa que o euro vale menos (desvalorização): as exportações ficam mais baratas no exterior, as importações mais caras e X − M aumenta. Confundir a subida de e com valorização é o erro mais comum.","id":"q13w3nuf"}],"key":"u9-9.5"},{"id":"9.1 Ex.","title":"Caderno de exercícios — Política económica: avaliação, conjuntural, multiplicador, crowding out e Laffer","pages":[321,336],"summary":"<h4>Ex. 9.1 – Avaliar o impacto de uma política</h4><p>O Governo aumentou os impostos em 2012. É <strong>incorreto</strong> comparar as receitas de 2012 com as de 2011 (antes vs. depois). O correto é comparar a situação <strong>COM e SEM</strong> a decisão: receitas de 2012 com as receitas que haveria em 2012 sem aumento de impostos. A diferença é o impacto da decisão.</p><h4>Ex. 9.2 – Política económica conjuntural</h4><p>Política de <strong>curto prazo</strong> que visa estabilizar o PIB em torno do <strong>PIB potencial</strong>; atua sobretudo através da curva da <strong>procura agregada</strong> de curto prazo, manipulando-a para determinar onde cruza a oferta agregada de curto prazo.</p><ul><li><strong>Orçamental</strong>: através das receitas e despesas do Estado; impacto direto na procura agregada e indireto através do rendimento das famílias (mais rendimento → mais consumo).</li><li><strong>Monetária</strong>: influenciar o investimento através da taxa de juro (juro ↑ → investimento ↓ → procura agregada ↓; juro ↓ → investimento ↑).</li><li><strong>Cambial</strong>: através da taxa de câmbio; <strong>desvalorização</strong> → exportações ↑, importações ↓ → procura agregada ↑; <strong>valorização</strong> → efeito oposto.</li><li>Em todas está em causa a procura agregada de bens produzidos no espaço geográfico do país.</li></ul><h4>Ex. 9.3 – Efeito multiplicador vs. crowding out</h4><ul><li><strong>Efeito multiplicador</strong>: o impacto total de um aumento da despesa do Estado no PIB é <strong>superior</strong> ao aumento dessa despesa. Ex.: o Estado paga uma estrada (1.º impacto no PIB); a despesa é recebida pelas famílias como rendimento, que consomem mais, aumentando o PIB; e assim sucessivamente em ciclos contínuos mas <strong>decrescentes</strong>, porque parte do rendimento é <strong>poupada</strong>.</li><li><strong>Efeito crowding out</strong> (deslocamento/expulsão): deslocamento de recursos do setor privado para o Estado em virtude do aumento da despesa pública – através dos impostos e da <strong>subida das taxas de juro</strong> devida ao maior endividamento do Estado, que leva recursos privados a deixar de financiar investimento para financiar o Estado.</li><li>O crowding out <strong>reduz ou pode anular</strong> o efeito multiplicador.</li></ul><h4>Ex. 9.4 – Curva de Laffer</h4><p>Relação entre a <strong>taxa de imposto</strong> (percentagem do PIB que vai para impostos) e a <strong>receita fiscal</strong>. Extremos: taxa 0% → receita nula; taxa 100% → ninguém quer produzir ou a produção não é declarada → receita nula. À medida que a taxa aumenta, a receita primeiro aumenta, atinge um <strong>máximo</strong> e depois diminui. Mensagem: aumentar a taxa de imposto não aumenta necessariamente a receita e pode até fazê-la diminuir.</p>","keyTerms":[{"term":"Avaliação com/sem","def":"O impacto de uma decisão mede-se comparando a situação com a decisão e a situação sem ela, não o antes com o depois."},{"term":"Política conjuntural","def":"Política de curto prazo para estabilizar o PIB em torno do potencial, atuando sobre a procura agregada (orçamental, monetária, cambial)."},{"term":"Efeito multiplicador","def":"O impacto total de um aumento da despesa pública no PIB é superior a esse aumento, em ciclos decrescentes devido à poupança."},{"term":"Crowding out","def":"Deslocamento de recursos do setor privado para o Estado (impostos, subida das taxas de juro), que reduz ou anula o efeito multiplicador."},{"term":"Curva de Laffer","def":"Relação entre taxa de imposto e receita fiscal: a receita cresce, atinge um máximo e depois diminui."}],"questions":[{"q":"Para avaliar o impacto do aumento de impostos de 2012 nas receitas fiscais, o procedimento correto é comparar:","options":["As receitas de 2012 com as receitas que haveria em 2012 sem o aumento de impostos","As receitas de 2012 com as de 2011","As receitas de 2012 com a média dos cinco anos anteriores","A taxa de imposto de 2012 com a de 2011"],"answer":0,"explanation":"O impacto de uma decisão mede-se comparando a situação com e sem a decisão. Comparar o antes com o depois mistura o efeito da medida com tudo o resto que mudou.","id":"q1fblj4l"},{"q":"O efeito multiplicador da despesa do Estado é finito (os ciclos são decrescentes) porque:","options":["O Estado só gasta uma vez","Uma parte do rendimento recebido pelas famílias é poupada e não consumida","As taxas de juro descem a cada ciclo","As importações são nulas"],"answer":1,"explanation":"Em cada ciclo só a parte consumida do rendimento gera nova despesa; a poupança é uma fuga ao circuito. A subida dos juros está ligada ao crowding out, não à finitude do multiplicador.","id":"qtv242z"},{"q":"Uma desvalorização da moeda nacional (política cambial), coeteris paribus, tende a:","options":["Reduzir as exportações e aumentar as importações, diminuindo a procura agregada","Não afetar a procura agregada, apenas os preços externos","Aumentar as exportações e reduzir as importações, aumentando a procura agregada","Aumentar a taxa de juro e reduzir o investimento"],"answer":2,"explanation":"Com a desvalorização, os bens nacionais ficam mais baratos para o exterior e os importados mais caros: X − M aumenta e a procura agregada também. A valorização teria o efeito oposto.","id":"q5gkya"}],"key":"u9-9.1 Ex."}]},{"n":10,"title":"Crescimento e desenvolvimento económico","short":"Crescimento","sections":[{"id":"10.1","title":"Crescimento económico: fontes, pré-condições e regra de 70","pages":[270,275],"summary":"<h4>Capítulo 10</h4><p>10.1 Crescimento económico; 10.2 Desenvolvimento económico; 10.3 Poder económico. (Parte gráfica baseada em Parkin, <em>Economics</em>, 2008, cap. «Economic Growth». A abertura mostra «Economic Meltdown» de Judith Rhue, 2008, sobre a Grande Recessão: o crescimento é o oposto do que o gráfico traduz.)</p><h4>10.1 Crescimento económico</h4><p>Há crescimento quando o <strong>PIB a preços constantes (PIB real) aumenta</strong>, ou seja, cresce a quantidade de bens e serviços produzidos. O termo em geral diz respeito ao <strong>crescimento do PIB potencial</strong>: um PIB real mais alto quando a economia funciona normalmente.</p><h4>Fontes do crescimento</h4><ul><li><strong>Dimensão da população ativa e total de horas disponíveis</strong>: mais população ativa ou horas ⇒ PIB real pode ser maior.</li><li><strong>Produtividade do trabalho</strong>: com as mesmas horas produz-se mais.</li><li><strong>Crescimento do capital físico</strong>: infraestruturas, máquinas, fábricas.</li><li><strong>Crescimento do capital humano</strong>: educação, treino, experiência laboral.</li><li><strong>Avanços tecnológicos</strong>.</li></ul><h4>Pré-condições das fontes do crescimento</h4><ul><li><strong>Promoção do funcionamento dos mercados</strong> e de condições de funcionamento eficiente da economia: com os recursos disponíveis consegue-se o máximo de produção; ser mais eficiente é poder ter mais; devem permanecer no mercado as empresas mais eficientes.</li><li><strong>Proteção dos direitos de propriedade</strong>: os empreendedores esforçam-se por inovar se beneficiarem desse esforço; especialmente importante em atividades com grande investimento e retorno demorado (ex.: biotecnologia). As <strong>patentes</strong> (temporárias) são uma forma de proteção.</li></ul><h4>Políticas estruturais e crescimento</h4><p>As políticas estruturais fomentam, direta ou indiretamente, as pré-condições e fontes de crescimento, visando o <strong>crescimento do PIB potencial de longo prazo</strong> sem desemprego cíclico nem estrutural (qualquer política conjuntural também tem impacto estrutural).</p><h4>Regra de 70</h4><p>Número de anos para uma variável duplicar ≈ <strong>70 / taxa anual de crescimento (em %)</strong>. Exemplo: Banco de Portugal estimou crescimento de 4,8% em 2021 ⇒ 70/4,8 ≈ <strong>14,58 anos</strong> para duplicar o PIB. Tabela: 1% → 70 anos; 2% → 35; 3% → 23,3; 4% → 17,5; 5% → 14; 6% → 11,7; 7% → 10; 8% → 8,8; 9% → 7,8; 10% → 7; 11% → 6,4; 12% → 5,8. Gráfico (hipérbole decrescente): com 2% duplica em 35 anos; com 7% em 10 anos.</p>","keyTerms":[{"term":"Crescimento económico","def":"Aumento do PIB a preços constantes; em geral, crescimento do PIB potencial."},{"term":"Fontes do crescimento","def":"População ativa/horas, produtividade do trabalho, capital físico, capital humano, avanços tecnológicos."},{"term":"Pré-condições do crescimento","def":"Funcionamento eficiente dos mercados e proteção dos direitos de propriedade (ex.: patentes)."},{"term":"Regra de 70","def":"Anos para duplicar ≈ 70 / taxa de crescimento anual em %."}],"questions":[{"q":"Pela «regra de 70», se o PIB real de um país crescer a 3,5% ao ano, aproximadamente quantos anos demora a duplicar?","options":["35 anos","24,5 anos","20 anos","10 anos"],"answer":2,"explanation":"70 / 3,5 = 20 anos. 24,5 resulta de multiplicar 70 × 0,35, um erro de cálculo; 35 anos corresponde a uma taxa de 2%.","id":"q12ugfa7"},{"q":"Na classificação apresentada nas aulas, a proteção dos direitos de propriedade (por exemplo, através de patentes) é:","options":["Uma fonte direta do crescimento, tal como o capital físico.","Uma pré-condição das fontes do crescimento económico.","Uma polít
