va da do bem em que é incorporado."},{"term":"Custo relativo","def":"Quantidade de um bem sacrificada por unidade adicional do outro ao longo da FPP, |ΔY/ΔX|."},{"term":"Rendimento marginal","def":"Acréscimo de produção por acréscimo de uma unidade do recurso variável (ΔQ/ΔL)."},{"term":"Custo marginal (em recurso)","def":"Acréscimo do recurso variável necessário por unidade adicional de produção (ΔL/ΔQ); inverso do rendimento marginal."},{"term":"Grande Cisma da Economia","def":"Oposição entre as interpretações de Adam Smith (mercado) e Karl Marx (autoridade) como formas de resolver o problema económico."}],"questions":[{"q":"Na FPP do Ex. 1.4-7 (A: 0 alimentos/150 máquinas; B: 10/140; C: 20/120; D: 30/90; E: 40/50; F: 50/0), qual o custo relativo de passar de D para E, em milhares de máquinas por milhão de kg de alimentos?","options":["3","0,25","4","40"],"answer":2,"explanation":"De D para E, ΔX = 10 e ΔY = −40, logo |ΔY/ΔX| = 4. O valor 0,25 é o custo inverso (máquinas em termos de alimentos) e 40 é a variação absoluta, não o custo por unidade.","id":"qnx1paw"},{"q":"Na quinta do Ex. 1.4-8, a produção passa de 40 para 45 toneladas quando os homens passam de 30 para 40. O custo marginal (homens por tonelada adicional) é:","options":["0,5","2","5","1"],"answer":1,"explanation":"Custo marginal = ΔHomens/ΔProdução = 10/5 = 2. O valor 0,5 é o rendimento marginal (5/10), que é o inverso.","id":"qg7vdsh"},{"q":"Uma companhia aérea já comprou e pagou um avião. Para decidir se o mantém, o que é relevante segundo o caderno?","options":["O custo de oportunidade de ter o avião, isto é, o que se passa no futuro com e sem a decisão","O preço pago pelo avião no momento da compra","O custo de oportunidade de ter adquirido o avião","Apenas os benefícios passados que o avião já gerou"],"answer":0,"explanation":"Para decidir importa o futuro: o custo de oportunidade de ter o avião (por exemplo, o valor de o vender). O preço pago é um custo afundado e não é relevante para a decisão.","id":"qt7h669"},{"q":"Segundo o caderno, a afirmação «Se todos tivermos muito dinheiro para gastar não existe problema económico» é:","options":["Verdadeira, porque o dinheiro elimina a escassez","Verdadeira apenas no curto prazo","Falsa só quando há inflação","Falsa, porque o dinheiro só compra os bens disponíveis no mercado, que continuam escassos"],"answer":3,"explanation":"A escassez refere-se aos bens e recursos face às necessidades. Ter mais dinheiro não aumenta os bens disponíveis, por isso o problema económico mantém-se.","id":"qs0emdk"}],"key":"u1-1.4 Ex."}]},{"n":2,"title":"Os mercados na sociedade moderna e a intervenção do Estado","short":"Mercados e Estado","sections":[{"id":"2.1","title":"O circuito económico e os mercados na sociedade moderna","pages":[37,38],"summary":"<p>Estrutura da unidade 2: 2.1 circuito económico e mercados; 2.2 intervenção do Estado (2.2.1 objetivos individuais, de grupo e sociais; 2.2.2 funções económicas do Estado; 2.2.3 mercado e concorrência perfeita como referência; 2.2.4 falhas de mercado ao nível da eficiência e o papel do Estado; 2.2.5 equidade, estabilidade e conflitos eficiência-equidade e desenvolvimento-estabilidade); Anexo 1: igualdade, rendimento mínimo garantido e rendimento básico incondicional; Anexo 2: Curva de Lorenz e Índice de Gini.</p><h4>Circuito económico simplificado</h4><ul><li>Dois agentes: <strong>Empresas</strong> e <strong>Famílias</strong>.</li><li>Dois tipos de mercados: <strong>mercados de bens finais</strong> (no topo) e <strong>mercados de fatores</strong> (em baixo).</li><li>Empresas e famílias relacionam-se através destes dois mercados: as empresas oferecem bens finais que as famílias procuram; as famílias oferecem fatores (trabalho, etc.) que as empresas procuram.</li><li><strong>Nota:</strong> se os mercados de recursos intermédios envolverem apenas empresas, são mercados intraempresariais e não aparecem no circuito simplificado.</li></ul>","keyTerms":[{"term":"Circuito económico simplificado","def":"Representação das relações entre empresas e famílias através dos mercados de bens finais e de fatores."},{"term":"Mercados de fatores","def":"Mercados onde as famílias oferecem e as empresas procuram fatores de produção."},{"term":"Mercados intraempresariais","def":"Mercados de recursos intermédios que envolvem apenas empresas; não evidenciados no circuito simplificado."}],"questions":[{"q":"No circuito económico simplificado, por que razão os mercados de recursos intermédios não aparecem representados?","options":["Porque não têm preço","Porque são controlados pelo Estado","Porque não existem numa economia de mercado","Porque, envolvendo apenas empresas, são mercados intraempresariais"],"answer":3,"explanation":"A nota do slide explica que, se envolverem só empresas, são mercados intraempresariais e não aparecem no circuito simplificado entre empresas e famílias.","id":"q94evsx"}],"key":"u2-2.1"},{"id":"2.2","title":"2.2.1–2.2.3 Intervenção do Estado: objetivos, funções e a concorrência perfeita como referência","pages":[39,45],"summary":"<h4>A intervenção do Estado na economia</h4><ul><li>A intervenção do Estado (ou de qualquer entidade com autoridade) percebe-se em contraponto à situação sem intervenção. O extremo oposto é deixar o <strong>mercado funcionar de forma totalmente livre</strong>.</li><li><strong>Atenção:</strong> para haver livre funcionamento dos mercados tem de haver controlo a um nível superior (leis e tribunais) que garanta as regras, incluindo impedir que os agentes com mais poder destruam fora do mercado os que têm menos poder. O mesmo acontece com a democracia.</li></ul><h4>2.2.1 Objetivos individuais, de grupo e sociais</h4><ul><li><strong>Individuais e de grupos próximos:</strong> bem-estar e interesse próprio, podendo incorporar o bem-estar de pessoas próximas (família).</li><li><strong>De grupo e organizações:</strong> sobretudo empresas, responsáveis pelas atividades produtivas; considera-se que têm como objetivo <strong>maximizar o lucro</strong>.</li><li><strong>Sociais:</strong> a intervenção do Estado tem como paradigma prosseguir objetivos que tomam como referência a <strong>sociedade como um todo</strong>. Maximizar o bem-estar social pode ir contra interesses particulares e pressupõe promover a eficiência. (Por vezes o Estado fica <em>capturado</em> por interesses particulares, mas não é esse o seu paradigma.)</li></ul><h4>2.2.2 Três funções económicas do Estado</h4><ul><li><strong>Promoção da eficiência:</strong> há falhas de mercado que tornam o mercado ineficiente; o Estado atua para alcançar (ou aproximar) a eficiência.</li><li><strong>Promoção da equidade:</strong> igualdade, implicando por ex. redistribuição do rendimento. Um mercado, mesmo eficiente, não promove necessariamente a igualdade.</li><li><strong>Promoção da estabilidade (económica):</strong> o funcionamento normal dos mercados tem associada instabilidade (ex.: desemprego por fecho de empresas menos eficientes).</li></ul><h4>2.2.3 O mercado e a concorrência perfeita como referência</h4><ul><li>O mercado de concorrência perfeita é um caso particular de mercado a funcionar livremente.</li><li>Conceito de mercado: deriva do mercado em sentido literal — espaço de encontro entre vendedores e compradores onde se negociam preços e quantidades.</li><li><strong>Em concorrência perfeita o equilíbrio é um ponto de eficiência económica:</strong> pratica-se o preço mais baixo que permite a uma empresa ser sustentável (cobrir custos totais); ficam no mercado as empresas necessárias para fornecer a quantidade procurada a esse preço mínimo, que é igual ao <strong>mínimo do custo médio</strong> de produção.</li><li><strong>Condições:</strong> muitos agentes do lado da procura e da oferta, sem poder (individual ou em grupo) para influenciar o mercado; <strong>produto homogéneo</strong>; <strong>informação perfeita</strong>.</li><li>É uma referência hipotética ideal; serve de padrão. Quando um mercado se afasta da eficiência ideal há <strong>falhas de mercado ao nível da eficiência</strong>.</li><li><strong>Nota técnica — mercado relevante:</strong> o mercado envolve a interação entre quem procura e oferece um bem/recurso e o contexto (geográfico, ciberespacial, temporal). Ex.: eletricidade doméstica em Portugal vs. telemóveis (contexto internacional, muitas compras no ciberespaço).</li><li><strong>Promoção da eficiência pelo Estado:</strong> perante falhas de mercado, o Estado condiciona a atuação dos agentes ou providencia ele próprio o bem.</li><li><strong>Equidade e estabilidade:</strong> o livre funcionamento dos mercados, incluindo a concorrência perfeita, não garante equidade nem estabilidade; a concorrência perfeita não é referência para elas. Afastamentos são <strong>falhas de mercado ao nível da equidade e da estabilidade</strong> (como em Samuelson, 2012); a referência é o que a sociedade entende dever ser a equidade e a estabilidade.</li></ul>","keyTerms":[{"term":"Funções económicas do Estado","def":"Promoção da eficiência, da equidade e da estabilidade económica."},{"term":"Concorrência perfeita","def":"Muitos agentes sem poder sobre o mercado, produto homogéneo e informação perfeita; o equilíbrio é eficiente."},{"term":"Preço em concorrência perfeita","def":"Igual ao mínimo do custo médio de produção: o preço mais baixo que permite à empresa ser sustentável."},{"term":"Falhas de mercado","def":"Afastamento da situação ideal de eficiência (ou de equidade/estabilidade)."},{"term":"Mercado relevante","def":"Mercado de cada bem ou conjunto de bens relacionados, no seu contexto geográfico, ciberespacial e temporal."},{"term":"Estado capturado","def":"Estado prisioneiro de interesses particulares — não é o paradigma da sua atuação."}],"questions":[{"q":"Qual das seguintes NÃO é uma condição do mercado de concorrência perfeita segundo os slides?","options":["Muitos agentes do lado da oferta e da procura, sem poder para influenciar o mercado","Produto homogéneo","Informação perfeita","Preços fixados pelo Estado ao nível do custo médio"],"answer":3,"explanation":"Em concorrência perfeita o preço resulta do livre funcionamento do mercado e tende a igualar o mínimo do custo médio; não é fixado pelo Estado.","id":"q1nc9bts"},{"q":"Porque é que o mercado de concorrência perfeita NÃO serve como referência ideal para a equidade?","options":["Porque é ineficiente","Porque um mercado, mesmo eficiente, não garante a igualdade na distribuição","Porque em concorrência perfeita há poucos agentes","Porque a concorrência perfeita gera sempre desemprego"],"answer":1,"explanation":"O livre funcionamento dos mercados, incluindo a concorrência perfeita, não garante equidade nem estabilidade; para estas a referência é o que a sociedade entende dever ser.","id":"qs29kwg"},{"q":"Em concorrência perfeita, o preço de equilíbrio tende a ser igual:","options":["Ao mínimo do custo médio de produção","Ao máximo que os consumidores estão dispostos a pagar","Ao custo médio da empresa menos eficiente do setor","Ao preço que maximiza o lucro de um monopolista"],"answer":0,"explanation":"É o preço mais baixo que ainda permite cobrir os custos totais (mínimo do custo médio), o que torna o equilíbrio um ponto de eficiência.","id":"q1sx3ulr"}],"key":"u2-2.2"},{"id":"2.2","title":"2.2.4 Falhas de mercado ao nível da eficiência e o papel do Estado","pages":[45,55],"summary":"<p>Todas as falhas são vistas do ponto de vista global da sociedade: alguns agentes até ganham com elas, mas a sociedade perde.</p><p><strong>Quatro falhas de mercado ao nível da eficiência:</strong> imperfeições na concorrência; externalidades; bens públicos; recursos comuns.</p><h4>1. Imperfeições na concorrência</h4><ul><li>Fogem à concorrência perfeita e têm a ver com o número de agentes e o seu poder sobre o mercado (poder de determinar o preço).</li><li><strong>Falha fundamental:</strong> é produzida e vendida <strong>uma menor quantidade, a um preço mais alto</strong> do que em concorrência perfeita. O lucro é maior para quem tem poder, mas socialmente é ineficiente.</li></ul><table><tr><th>Estrutura</th><th>Características</th></tr><tr><td>Monopólio</td><td><strong>Um</strong> a oferecer, com poder; muitos a procurar, sem poder</td></tr><tr><td>Oligopólio</td><td><strong>Poucos</strong> a oferecer, com poder; muitos a procurar</td></tr><tr><td>Monopsónio</td><td><strong>Um</strong> a procurar, com poder; muitos a oferecer, sem poder</td></tr><tr><td>Oligopsónio</td><td><strong>Poucos</strong> a procurar, com poder; muitos a oferecer</td></tr><tr><td>Concorrência monopolística</td><td>Muitos a oferecer e a procurar, mas cada vendedor tem algum poder (produto não homogéneo, localização). Ex.: pastelaria de bairro, cantina da universidade. Poder limitado, em geral não justifica intervenção.</td></tr></table><p><strong>Como atua o Estado:</strong> promovendo (se necessário coercivamente) <strong>situações estruturais</strong> (n.º de agentes) o mais próximas possível da concorrência perfeita; ou promovendo <strong>comportamentos</strong> que conduzam à performance (preço e quantidade) que haveria com mais concorrência, quando é mais eficiente ter poucos agentes ou um só (<strong>monopólio natural</strong>).</p><ul><li><strong>Monopólio natural:</strong> é mais eficiente um único agente a oferecer (custo para a sociedade mais baixo). Ex.: uma só rede de metro em Lisboa. Mas confere muito poder, daí a regulação do Estado. Não confundir com outros monopólios.</li><li><strong>Oligopólio natural:</strong> mais eficiente ter poucos agentes (ex.: portos, aeroportos). Monopólios/oligopólios naturais devem-se em grande parte à <strong>dimensão do mercado e à tecnologia</strong>.</li><li><strong>Associação de agentes</strong> altera o poder negocial (de atomização para maior poder): sindicatos (trabalhadores, sobretudo menos especializados, têm menos poder que as empresas); associação dos taxistas protegida pela legislação, com poder semelhante ao monopólio. O confronto taxistas vs. UBER mostrou a perda de poder com novos concorrentes e a impreparação de quem esteve protegido — evidencia os conflitos eficiência-equidade e desenvolvimento-estabilidade.</li></ul><h4>2. Externalidades</h4><ul><li>Em concorrência perfeita supõe-se que todos os custos e benefícios são suportados pelos agentes do mercado.</li><li><strong>Externalidades:</strong> benefícios ou custos de um mercado com impacto sobre agentes que estão <strong>fora desse mercado</strong>. Podem ser <strong>na produção</strong> (ex.: fumo poluente) ou <strong>no consumo</strong> (ex.: pastilha elástica deitada para o chão). (Foto ilustrativa: entrada de metro junto a um restaurante de fast-food.)</li><li><strong>Falha fundamental:</strong> incapacidade do mercado de valorizar as externalidades e de esse valor ser considerado no preço.</li><li>Decorrem das características físicas do bem e do enquadramento jurídico. Podem ser «corrigidas» (<strong>internalizadas</strong>) através da oferta ou da procura. Prevenir externalidades negativas (contágio, via pública suja, custos de saúde com excesso de açúcar ou sal) pode poupar dinheiro futuro ao Estado. A perceção ética pode levar à internalização pela procura.</li><li><strong>Como atua o Estado:</strong> promove <strong>maior</strong> produção/transação se a externalidade for <strong>positiva</strong>; <strong>menor</strong> se for <strong>negativa</strong>.</li><li>Externalidade e internalização ligam-se ao <strong>preço</strong>: deixa de ser externalidade quando o efeito passa a ser considerado na formação do preço (incorporado na procura ou na oferta). Ex.: alteração do clima causada por uma barragem é externalidade dos mercados agrícola/elétrico se não estiver no preço da eletricidade. A poluição só é externalidade se incidir sobre agentes de fora do mercado.</li></ul><h4>3. Bens públicos</h4><ul><li>Em concorrência perfeita supõe-se que não se acede ao bem sem pagar.</li><li><strong>Bens públicos:</strong> podem ser usufruídos por qualquer indivíduo, <strong>ninguém pode ser excluído</strong> e <strong>não se esgotam</strong> (pelo menos até ao congestionamento).</li><li><strong>Falha fundamental:</strong> incapacidade do mercado de os providenciar adequadamente — ninguém os providencia se depois ninguém estiver disposto a pagar.</li><li>Ser bem público decorre das características físicas e do enquadramento jurídico; com congestionamento aproxima-se de um recurso comum; a questão fundamental é o <strong>provisionamento</strong>; pode deixar de ser público por intervenção do Estado.</li><li><strong>Como atua o Estado:</strong> providenciando ele próprio o bem; ou criando condições que assegurem a eficaz propriedade do bem por agentes privados.</li></ul><h4>4. Recursos comuns</h4><ul><li>Em concorrência perfeita supõe-se continuidade do mercado no presente e no futuro.</li><li><strong>Recursos comuns:</strong> qualquer um pode usufruir, ninguém pode ser excluído, mas <strong>esgotam-se</strong>. Ex.: banco de pesca — a sobrepesca esgota os recursos para gerações futuras; benefício privado pode ser custo social importante.</li><li><strong>Falha fundamental:</strong> incapacidade do mercado de valorizar o custo social do esgotamento e incluí-lo no preço.</li><li>Há sempre esgotamento a partir de certo nível de exploração; são geralmente recursos naturais (pesca, caça). O valor social pode tornar inadmissível o esgotamento (extinção de espécie, destruição de floresta).</li><li><strong>Como atua o Estado:</strong> limitando a exploração de forma sustentável; ou colocando uma <strong>taxa</strong> sobre quem explora para que o preço traduza o custo para a sociedade.</li></ul><h4>O Estado deve atuar sempre face às falhas de mercado?</h4><ul><li>Não necessariamente: a intervenção também tem custos e pode não compensar (ex.: um perfume tem sempre externalidades, mas o Estado não o promove nem proíbe).</li><li>Alguns impactos envolvem vários países e requerem acordos internacionais (poluição transfronteiriça; pesca em águas internacionais).</li></ul>","keyTerms":[{"term":"Imperfeições na concorrência","def":"Situações em que agentes têm poder sobre o preço; produz-se menos a preço mais alto do que em concorrência perfeita."},{"term":"Monopólio / Oligopólio","def":"Um / poucos agentes a oferecer, com poder, perante muitos a procurar."},{"term":"Monopsónio / Oligopsónio","def":"Um / poucos agentes a procurar, com poder, perante muitos a oferecer."},{"term":"Concorrência monopolística","def":"Muitos agentes de ambos os lados, mas cada vendedor tem algum poder (produto não homogéneo)."},{"term":"Monopólio natural","def":"Situação em que é mais eficiente um único agente a oferecer (ex.: metro de Lisboa); requer regulação."},{"term":"Externalidade","def":"Custo ou benefício de um mercado que afeta agentes fora desse mercado e não se reflete no preço."},{"term":"Internalização","def":"Incorporação do efeito externo na formação do preço (via oferta ou procura)."},{"term":"Bem público","def":"Não exclusivo (ninguém pode ser excluído) e não se esgota (até ao congestionamento)."},{"term":"Recurso comum","def":"Não exclusivo mas esgota-se (ex.: banco de pesca)."}],"questions":[{"q":"Face a um monopólio (não natural), a falha fundamental em relação à concorrência perfeita é:","options":["Produzir-se mais a um preço mais baixo","Produzir-se uma menor quantidade a um preço mais alto","Produzir-se a mesma quantidade com lucro nulo","Os custos serem suportados por agentes fora do mercado"],"answer":1,"explanation":"Nas imperfeições na concorrência é produzida e vendida menor quantidade a preço mais alto, com mais lucro para quem tem poder mas ineficiência social. Custos sobre terceiros correspondem a externalidades.","id":"qn8itxy"},{"q":"Uma grande empresa é a única compradora de trabalho numa pequena vila onde há muitos trabalhadores. Esta estrutura de mercado é:","options":["Monopólio","Oligopólio","Concorrência monopolística","Monopsónio"],"answer":3,"explanation":"Monopsónio: um agente a procurar, com poder, e muitos a oferecer sem poder. No monopólio o agente único está do lado da oferta.","id":"q1tuobvj"},{"q":"A existência de uma única rede de metro em Lisboa é apresentada como exemplo de:","options":["Monopólio natural, que requer regulação do Estado","Bem público puro","Recurso comum","Concorrência monopolística que dispensa intervenção"],"answer":0,"explanation":"É mais eficiente (custo social mais baixo) haver um único operador, mas isso confere muito poder de mercado; daí o Estado regular para promover o comportamento adequado.","id":"qxcqe2j"},{"q":"Um banco de pesca em águas abertas, onde qualquer pessoa pode pescar e os peixes se esgotam com a sobrepesca, é um exemplo de:","options":["Bem público","Externalidade positiva no consumo","Recurso comum","Bem livre"],"answer":2,"explanation":"Recurso comum: ninguém pode ser excluído mas esgota-se. O bem público também é não exclusivo mas não se esgota (até ao congestionamento).","id":"q1j60hij"},{"q":"Perante uma externalidade negativa na produção (ex.: fumo poluente que afeta vizinhos), o Estado deve, segundo os slides:","options":["Promover uma maior produção do bem","Providenciar ele próprio o bem","Promover uma menor produção e transação do bem","Não intervir, pois externalidades nunca justificam intervenção"],"answer":2,"explanation":"Externalidade negativa → promover menor produção/transação; positiva → maior. Providenciar o bem é a resposta típica aos bens públicos.","id":"q1f3gwdq"},{"q":"Segundo os slides, a poluição causada por uma fábrica deixa de ser uma externalidade quando:","options":["O efeito passa a estar incorporado na formação do preço desse mercado","A fábrica passa a ser pública","A poluição afeta apenas agentes de outros países","A produção da fábrica aumenta"],"answer":0,"explanation":"Externalidade e internalização ligam-se ao preço: o efeito deixa de ser externalidade quando passa a refletir-se no preço, por incorporação na procura ou na oferta.","id":"q1y7rxh3"}],"key":"u2-2.2-2"},{"id":"2.2","title":"2.2.5 Equidade, estabilidade e os conflitos eficiência-equidade e desenvolvimento-estabilidade","pages":[56,58],"summary":"<h4>Promoção da equidade</h4><ul><li>A promoção da justiça é em geral um objetivo social, que passa por não haver grande disparidade na distribuição do rendimento e da riqueza.</li><li>Um mercado, mesmo eficiente, <strong>não é necessariamente justo</strong>; por isso o Estado promove a equidade. Mas existe um <strong>conflito eficiência-equidade</strong>.</li></ul><h4>O conflito eficiência-equidade</h4><ul><li>Impostos (em especial <strong>progressivos</strong>) são cobrados a quem tem mais; parte beneficia todos e parte é transferida para quem mais precisa.</li><li>Promover a equidade <strong>desincentiva os mais eficientes</strong> (parte do resultado da sua eficiência é redistribuída) e <strong>desincentiva os menos eficientes</strong> (não precisam de se esforçar tanto).</li><li><strong>Quando se promove a eficiência reduz-se a equidade e quando se promove a equidade reduz-se a eficiência.</strong></li></ul><h4>Promoção da estabilidade</h4><ul><li>A estabilidade (empregos, rendimentos) é importante para a paz social.</li><li>O mercado, ao funcionar bem e promover a eficiência, cria instabilidade; o Estado promove a estabilidade — mas existe um <strong>conflito desenvolvimento-estabilidade</strong>.</li></ul><h4>O conflito desenvolvimento-estabilidade</h4><ul><li>O desenvolvimento pressupõe eficiência ao longo do tempo: as empresas mais eficientes expulsam as menos eficientes — <strong>«criação destrutiva» de Schumpeter</strong>, com analogias com a seleção natural de Darwin.</li><li>As empresas mais eficientes em geral não empregam os que ficam desempregados com o fecho das outras.</li><li>Estabilidade também pode ser estabilidade de rendimentos (<em>status quo</em>).</li><li><strong>Quando se promove o desenvolvimento reduz-se a estabilidade e quando se promove a estabilidade reduz-se o desenvolvimento.</strong></li></ul><h4>Relação entre os dois conflitos e política económica</h4><ul><li>De forma simples, o conflito desenvolvimento-estabilidade é uma <strong>perspetiva dinâmica</strong> (ao longo do tempo) do conflito eficiência-equidade.</li><li>Podem colocar-se a vários níveis (incluindo pessoal), mas aqui são conflitos da sociedade, que se tornam conflitos para o Estado/Governo.</li><li><strong>Promoção da eficiência, da equidade e da estabilidade são três razões muito importantes da política económica do Governo</strong>; a «gestão» dos dois conflitos está presente na forma como essa política é prosseguida.</li></ul>","keyTerms":[{"term":"Conflito eficiência-equidade","def":"Promover a eficiência reduz a equidade e promover a equidade reduz a eficiência (desincentivos da redistribuição)."},{"term":"Conflito desenvolvimento-estabilidade","def":"Promover o desenvolvimento reduz a estabilidade e vice-versa; perspetiva dinâmica do conflito eficiência-equidade."},{"term":"Criação destrutiva (Schumpeter)","def":"Processo em que empresas mais eficientes expulsam do mercado as menos eficientes."},{"term":"Impostos progressivos","def":"Impostos que incidem proporcionalmente mais sobre quem tem mais; instrumento de equidade."}],"questions":[{"q":"Segundo os slides, o conflito desenvolvimento-estabilidade pode ser visto, de forma simples, como:","options":["Uma perspetiva dinâmica, ao longo do tempo, do conflito eficiência-equidade","Um caso particular de externalidade","O mesmo que o conflito entre micro e macroeconomia","Uma falha de mercado ao nível dos bens públicos"],"answer":0,"explanation":"Os slides afirmam que o conflito desenvolvimento-estabilidade é uma perspetiva dinâmica do conflito eficiência-equidade.","id":"q1fvw42e"},{"q":"Porque é que a promoção da equidade através de impostos progressivos pode reduzir a eficiência?","options":["Porque aumenta o número de empresas no mercado","Porque desincentiva os mais eficientes (parte do seu resultado é redistribuída) e os menos eficientes (precisam de se esforçar menos)","Porque os impostos progressivos são cobrados sobretudo a quem tem menos","Porque elimina as externalidades negativas"],"answer":1,"explanation":"É o argumento dos slides para o conflito eficiência-equidade: há desincentivos em ambos os grupos. Os impostos progressivos incidem sobre quem tem mais, não sobre quem tem menos.","id":"q11b0s1j"}],"key":"u2-2.2-3"},{"id":"2.2","title":"Anexo 1: Igualdade, rendimento mínimo garantido e rendimento básico incondicional","pages":[59,62],"summary":"<h4>Que igualdade?</h4><ul><li>A promoção da igualdade é em geral objetivo da sociedade e do Estado. Mas qual igualdade: <strong>de oportunidades</strong> ou <strong>de resultados</strong>? Ou outras (ex.: perante a justiça)?</li><li>A análise económica centra-se frequentemente na igualdade do rendimento que cada um recebe, ou seja, na <strong>igualdade de resultados</strong>.</li><li>Uma igualdade de resultados num momento pode ser o ponto de partida para uma igualdade de oportunidades no momento seguinte e vice-versa.</li></ul><h4>Rendimento mínimo garantido</h4><p>Atribuído pelo Estado <strong>a quem precisa</strong>, frequentemente numa base familiar (agregados que precisam), para garantir as necessidades básicas e uma vida condigna.</p><h4>Rendimento básico incondicional</h4><ul><li>Sobretudo proposta académica, com crescente visibilidade. Na Suíça, referendo em junho de 2016: <strong>76,9% contra e 23,1% a favor</strong>. Há discussões e experiências pontuais noutros países.</li><li>Ideia: qualquer pessoa, pelo facto de ter nascido, tem direito a um rendimento básico que permita subsistência com dignidade, <strong>independentemente de precisar ou não</strong>.</li><li><strong>Defensores:</strong> além da igualdade e dignidade, a sociedade funcionaria melhor política e economicamente — mais liberdade para decidir (votar, escolher emprego), mais tempo para procurar e escolher.</li><li><strong>Opositores:</strong> promove a ineficiência — desincentiva a procura de trabalho por quem não tem e desincentiva quem trabalha.</li><li>Próximo do esquema de <strong>«taxa de imposto negativa»</strong> (Milton Friedman): o imposto a pagar ou a receber (imposto negativo) incide sobre a diferença entre o rendimento e um valor de referência.</li></ul><h4>Abono de família (Portugal)</h4><p>Durante muitos anos atribuído a todos os que nasciam, até certa idade — natureza incondicional. Atualmente a sua atribuição tem em conta o rendimento do agregado familiar.</p>\n<h4>Curva de Lorenz e Índice de Gini</h4><p>A <strong>Curva de Lorenz</strong> e o <strong>Índice de Gini (IG)</strong> são, respetivamente, uma <strong>forma gráfica</strong> e um <strong>indicador numérico</strong> usados para visualizar e medir a forma como uma grandeza (rendimento, riqueza) está mais ou menos igualmente distribuída. O IG deriva da curva de Lorenz.</p><h4>Interpretação do IG (exemplo: 100 euros e 4 pessoas)</h4><table><tr><th>Valor</th><th>Significado</th></tr><tr><td>IG = 0</td><td>Igualdade perfeita: os 100 € estão igualmente distribuídos – cada pessoa tem 25 €.</td></tr><tr><td>IG = 1</td><td>Desigualdade máxima: uma das quatro pessoas tem os 100 € e as outras três não têm nada.</td></tr><tr><td>0 ≤ IG ≤ 1</td><td>Situação intermédia: quanto mais o IG se aproxima de 0, maior a igualdade; quanto mais se aproxima de 1, maior a desigualdade.</td></tr></table><p>Nota: o IG também é frequentemente apresentado em percentagem (0% a 100%).</p><h4>Dados</h4><ul><li><strong>Portugal 2021 (INE, ICOR 2022)</strong>: IG da distribuição do rendimento = <strong>32,0%</strong>. Por regiões (NUTS II), os valores situam-se entre cerca de 30% e mais de 33%; a A.M. de Lisboa surge entre as regiões com maior desigualdade (acima de 33%), enquanto regiões como o Centro e o Alentejo apresentam valores mais baixos.</li><li><strong>União Europeia 2020 (Eurostat, EU-SILC 2021)</strong>: IG entre cerca de 20% e 40% consoante o país; Portugal com <strong>33,0%</strong>, numa posição de desigualdade acima da média de vários países do centro e norte da Europa (os valores mais altos surgem em países como a Bulgária e a Lituânia).</li></ul><p>Fonte dos mapas: Carlos Farinha Rodrigues, FFMS – estudos sobre rendimentos e desigualdade.</p>","keyTerms":[{"term":"Igualdade de oportunidades vs. de resultados","def":"Igualdade nas condições de partida vs. igualdade no rendimento recebido; a análise económica centra-se frequentemente na de resultados."},{"term":"Rendimento mínimo garantido","def":"Rendimento atribuído pelo Estado a quem precisa, normalmente em base familiar."},{"term":"Rendimento básico incondicional","def":"Rendimento atribuído a qualquer pessoa, independentemente de precisar ou não."},{"term":"Taxa de imposto negativa (Friedman)","def":"Imposto a pagar ou a receber calculado sobre a diferença entre o rendimento e um valor de referência."},{"term":"Curva de Lorenz","def":"Representação gráfica da forma como uma grandeza (rendimento ou riqueza) está distribuída pela população."},{"term":"Índice de Gini (IG)","def":"Indicador numérico, derivado da curva de Lorenz, que varia entre 0 (igualdade perfeita) e 1 (desigualdade máxima)."}],"questions":[{"q":"A diferença essencial entre o rendimento mínimo garantido e o rendimento básico incondicional é que:","options":["O primeiro é atribuído a todos e o segundo só a quem precisa","O primeiro é atribuído a quem precisa e o segundo independentemente de precisar ou não","Ambos são atribuídos apenas a famílias com crianças","O segundo foi aprovado em referendo na Suíça em 2016"],"answer":1,"explanation":"O rendimento mínimo garantido destina-se a quem precisa; o básico incondicional é para todos. No referendo suíço de 2016 o rendimento básico incondicional foi rejeitado (76,9% contra).","id":"q1f3cbnd"},{"q":"Numa economia com 4 pessoas e 100 euros, o Índice de Gini é igual a 1 quando:","options":["Cada pessoa tem 25 euros","Uma pessoa tem os 100 euros e as restantes três não têm nada","Duas pessoas têm 50 euros cada e as outras duas nada","O rendimento total é igual a zero"],"answer":1,"explanation":"IG = 1 corresponde à desigualdade máxima: uma só pessoa detém tudo. Cada pessoa com 25 € corresponde a IG = 0 (igualdade perfeita); a repartição 50/50 entre duas pessoas é uma situação intermédia (0 < IG < 1).","id":"q1lwkyhp"}],"key":"u2-2.2-4"},{"id":"2.1 Ex.","title":"Caderno de exercícios — O circuito económico e os mercados na sociedade moderna","pages":[289,302],"summary":"<h4>Ex. 2.1-1</h4><p>Pergunta-se qual o papel dos mercados na sociedade moderna, como se integram no circuito económico e como se define um mercado (bem delimitado).</p><p><strong>Solução:</strong> um <strong>mercado relevante</strong> refere-se ao encontro de <strong>todos os agentes que oferecem e todos os que procuram</strong>, que entram em interação para determinarem, através dessa interação, o <strong>preço e a quantidade de equilíbrio</strong>. Um mercado relevante <strong>não tem necessariamente uma delimitação geográfica</strong>. Estar bem delimitado é importante para a análise económica (definir quem são os concorrentes, substitutos, etc.).</p>","keyTerms":[{"term":"Mercado relevante","def":"Encontro de todos os agentes que oferecem e procuram um bem, cuja interação determina o preço e a quantidade de equilíbrio; não tem necessariamente delimitação geográfica."}],"questions":[{"q":"Segundo o caderno de exercícios, um mercado relevante:","options":["Corresponde sempre a um espaço geográfico, como um país","Inclui todos os agentes que oferecem e que procuram, cuja interação determina o preço e a quantidade de equilíbrio","Inclui apenas os vendedores de um bem","Existe apenas quando há concorrência perfeita"],"answer":1,"explanation":"A solução define o mercado relevante como o encontro de todos os que oferecem e procuram, e sublinha que não tem necessariamente delimitação geográfica.","id":"q1xmq62f"}],"key":"u2-2.1 Ex."},{"id":"2.2 Ex.","title":"Caderno de exercícios — A intervenção do Estado: falhas de mercado e funções do Estado","pages":[289,303],"summary":"<h4>Ex. 2.2-1 – Falhas de mercado ao nível da eficiência</h4><ul><li>Mercados de <strong>monopólio, oligopólio, monopsónio ou oligopsónio</strong> (poder de mercado);</li><li><strong>Externalidades</strong>;</li><li><strong>Bens públicos</strong>;</li><li><strong>Recursos comuns</strong>.</li></ul><p>Devem ser caracterizadas, exemplificadas e relacionadas com a intervenção do Estado.</p><h4>Ex. 2.2-2 – Via do Infante (Algarve)</h4><p>Auto-estrada com maior taxa de incumprimento do pagamento de portagens (19% de receita por cobrar no 1.º semestre de 2013), em grande parte por utilizadores estrangeiros. <strong>Solução:</strong> desenvolver à volta dos <strong>bens públicos</strong> e do seu provisionamento; referir como, devido à intervenção do Estado (portagens), um bem público pode passar a ter a natureza de <strong>bem privado</strong> – e a dificuldade de exclusão (free-riding) quando não se consegue cobrar.</p><h4>Ex. 2.2-3 – Central termoelétrica de Sines</h4><p>Queima carvão, chaminés de 225 m espalham efluentes gasosos para longe (<strong>externalidade negativa</strong>); a água de refrigeração aquece o mar na praia de S. Torpes, tornando-a apreciada (<strong>externalidade positiva</strong>). Deve abordar-se como as externalidades alteram os comportamentos dos agentes e como pode ser a intervenção do Estado.</p><h4>Ex. 2.2-4 – Exemplos de externalidades</h4><ul><li>Na <strong>produção</strong>: efluentes líquidos de uma empresa de pasta de papel.</li><li>No <strong>consumo</strong>: acréscimo de lixo causado pelas embalagens velhas não reutilizáveis.</li><li>Diferentes tipos de externalidades levam a diferentes formas de intervenção do Estado; o comportamento ético de <em>um, alguns ou todos</em> os consumidores/produtores pode ou não resolver o problema.</li></ul><h4>Ex. 2.2-5</h4><p>Conceitos de <strong>eficiência</strong>, <strong>equidade</strong>, <strong>desenvolvimento</strong> (relação com a eficiência) e <strong>estabilidade</strong> (relação com a equidade); conflitos <strong>eficiência-equidade</strong> e <strong>desenvolvimento-estabilidade</strong> e a sua relação com o papel do Estado (ver aulas).</p>","keyTerms":[{"term":"Falhas de mercado (eficiência)","def":"Poder de mercado (monopólio, oligopólio, monopsónio, oligopsónio), externalidades, bens públicos e recursos comuns."},{"term":"Externalidade","def":"Efeito (positivo ou negativo) da atividade de um agente sobre terceiros, não refletido no preço."},{"term":"Bem público","def":"Bem não rival e não exclusivo; com intervenção do Estado (ex.: portagens) pode passar a ter natureza de bem privado."}],"questions":[{"q":"O caso da Via do Infante, onde muitos utilizadores passam sem pagar portagem, deve ser enquadrado sobretudo na problemática de:","options":["Bens públicos e do seu provisionamento, e de como a intervenção do Estado pode dar-lhes natureza de bem privado","Externalidades positivas no consumo","Monopsónio no mercado de trabalho","Lei dos rendimentos marginais decrescentes"],"answer":0,"explanation":"A solução manda desenvolver o tema dos bens públicos e do seu provisionamento. A estrada com portagem passa a ter natureza de bem privado, mas a dificuldade em excluir quem não paga recria o problema.","id":"qyr0qr1"},{"q":"Qual dos seguintes é dado no caderno como exemplo de externalidade no CONSUMO?","options":["Efluentes líquidos de uma fábrica de pasta de papel","Aquecimento da água do mar pela central de Sines","Fumos das chaminés de uma central termoelétrica","Acréscimo de lixo causado por embalagens velhas não reutilizáveis"],"answer":3,"explanation":"O lixo das embalagens resulta do consumo. Os outros três exemplos resultam de atividades de produção, ou seja, são externalidades na produção.","id":"qpibyma"}],"key":"u2-2.2 Ex."}]},{"n":3,"title":"A cruz marshalliana como ferramenta de análise","short":"Cruz marshalliana","sections":[{"id":"3.1","title":"Procura e oferta: curvas, equilíbrio e desequilíbrio (3.1.1 a 3.1.4)","pages":[62,76],"summary":"<h4>A cruz marshalliana</h4><p>A cruz marshalliana toma o <strong>mercado de concorrência perfeita</strong> como referência. Mesmo quando o mercado não é de concorrência perfeita continua a ser usada porque, embora a aplicação não seja exata, permite um enquadramento e uma análise <strong>qualitativamente adequados</strong>. É apresentada com exemplos quantificados, mas na maior parte dos casos o que interessa e é possível é uma análise qualitativa (existem técnicas específicas para estimar as curvas, fora do âmbito da disciplina).</p><p><strong>Nota técnica:</strong> em Economia diz-se habitualmente «curva» mesmo quando se trata de uma reta (curva da procura, curva da oferta); a abordagem será feita habitualmente com retas.</p><h4>3.1.1 A curva da procura (D, de <em>demand</em>)</h4><ul><li>Eixos: P (preço) no eixo vertical, Q (quantidade) no horizontal; inclinação negativa.</li><li>Dá a quantidade <strong>desejada</strong> por quem procura para cada nível de preços; dá também o preço que se está disposto a suportar (pagar) para cada quantidade desejada.</li><li><strong>Procura de mercado = soma horizontal das procuras individuais</strong>: para cada preço P̄, Q = q<sub>1</sub><sup>d</sup> + q<sub>2</sub><sup>d</sup> + …</li></ul><p><strong>Exemplo (mercado de alfaces, milhares de caixas):</strong></p><table><tr><th>Preço (€/caixa)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr><tr><td>Procura</td><td>15</td><td>14</td><td>13</td><td>12</td><td>11</td><td>10</td><td>9</td><td>8</td></tr><tr><td>Oferta</td><td>1</td><td>3</td><td>5</td><td>7</td><td>9</td><td>10</td><td>11</td><td>12</td></tr></table><p><strong>Fatores que determinam a procura:</strong> preço do bem em causa; gostos ou preferências; rendimento e impostos; dimensão do mercado; preço e disponibilidade de outros bens relacionados; [outros]. Ao desenhar a curva considera-se que todos estão fixos exceto o preço do próprio bem (<em>coeteris paribus</em>).</p><ul><li>A <strong>inclinação</strong> negativa deve-se a dois efeitos: <strong>efeito de substituição</strong> (se o preço sobe, o consumidor procura bens substitutos) e <strong>efeito de rendimento</strong> (se o preço sobe, o consumidor fica mais pobre e compra menos). O efeito substituição é sempre no sentido indicado; quanto ao efeito rendimento há bens cuja procura aumenta quando o rendimento diminui (<strong>bens de Giffen</strong>), situação pouco usual.</li><li>A <strong>posição</strong> da curva depende dos outros fatores:<ul><li>Gostos: passar a gostar mais → nova curva com maior quantidade para o mesmo preço (ou disposto a pagar mais pela mesma quantidade).</li><li>Rendimento: mais rendimento → curva desloca-se no mesmo sentido. Um imposto sobre o rendimento reduz o rendimento; um imposto sobre o preço do bem reduz o preço que se está disposto a pagar (ao vendedor) pela mesma quantidade.</li><li>Dimensão do mercado: mais agentes a procurar → maior quantidade para cada preço.</li><li>Bens relacionados: subida do preço de um <strong>substituto</strong> → maior quantidade procurada para o mesmo preço; subida do preço de um <strong>complementar</strong> → menor quantidade procurada.</li></ul></li></ul><h4>3.1.2 A curva da oferta (S, de <em>supply</em>)</h4><ul><li>Inclinação positiva; dá a quantidade <strong>desejada</strong> por quem oferece para cada nível de preços, e o preço que se pretende receber para cada quantidade.</li><li><strong>Oferta de mercado = soma horizontal das ofertas individuais</strong> das empresas.</li><li>A <strong>inclinação positiva</strong> deve-se à <strong>lei dos custos marginais crescentes</strong> (ou, noutra perspetiva, lei dos rendimentos marginais decrescentes): pelo menos a partir de certo ponto, as unidades adicionais produzidas têm um custo maior que as anteriores.</li><li>A <strong>posição</strong> depende de: <strong>custo de produção</strong> (tecnologia, custo dos fatores, impostos) – ex.: nova tecnologia com custos mais baixos → maior quantidade para o mesmo preço ou disposto a receber menos; <strong>preço e disponibilidade de produtos relacionados</strong> (produzidos com os mesmos fatores) – ex.: se outro setor paga mais pelas matérias-primas, os custos sobem → menor quantidade para o mesmo preço.</li></ul><h4>3.1.3 O equilíbrio de mercado</h4><p>No ponto de equilíbrio (P*, Q*) a quantidade desejada procurada é igual à quantidade desejada oferecida; aí o <strong>benefício marginal</strong> de quem procura iguala o <strong>custo marginal</strong> de quem oferece. A curva da procura incorpora <strong>gostos e benefícios</strong>; a da oferta incorpora <strong>tecnologia e custos</strong>.</p><p>No exemplo: <strong>P* = 6 €, Q* = 10 mil caixas</strong>; receita = 6 × 10 mil = <strong>60 milhares de euros</strong>.</p><h4>3.1.4 Situações de desequilíbrio</h4><p>A quantidade transacionada é sempre o <strong>valor mais pequeno</strong> entre a quantidade procurada e a oferecida para o preço em causa.</p><ul><li><strong>Preço acima do equilíbrio (P = 7)</strong>: Q<sup>D</sup> = 9, Q<sup>S</sup> = 11 → excesso de oferta; transaciona-se 9; receita = 7 × 9 = 63. Para quem oferece, a quantidade transacionada é inferior à desejada. Se não for uma imposição, o mercado ajusta e tende para o equilíbrio. Se for um <strong>preço mínimo</strong> imposto externamente, há um desequilíbrio que favorece as empresas que conseguem vender àquele preço.</li><li><strong>Preço abaixo do equilíbrio (P = 4)</strong>: Q<sup>S</sup> = 7, Q<sup>D</sup> = 12 → excesso de procura; transaciona-se 7; receita = 4 × 7 = 28. Para quem procura, a quantidade transacionada é inferior à desejada. Se for um <strong>preço máximo</strong> imposto, o desequilíbrio pode levar ao surgimento de um <strong>mercado negro</strong>.</li><li><strong>Quantidade máxima imposta (Q = 9)</strong>: transacionam-se 9; os compradores pagam o preço que estão dispostos a pagar por 9 (P = 7); receita = 7 × 9 = 63. Quem oferece tem um excedente nos ganhos, pois estaria disposto a vender essa quantidade a 5, mas o preço vai ser 7.</li></ul>","keyTerms":[{"term":"Curva da procura","def":"Relação entre o preço e a quantidade desejada por quem procura, tudo o resto igual; inclinação negativa."},{"term":"Curva da oferta","def":"Relação entre o preço e a quantidade desejada por quem oferece, tudo o resto igual; inclinação positiva."},{"term":"Procura/oferta de mercado","def":"Soma horizontal das quantidades procuradas/oferecidas individualmente para cada nível de preços."},{"term":"Efeito de substituição","def":"Quando o preço de um bem sobe, o consumidor substitui-o por outros bens substitutos."},{"term":"Efeito de rendimento","def":"Quando o preço de um bem sobe, o consumidor fica mais pobre e compra menos desse bem."},{"term":"Bens de Giffen","def":"Bens cuja procura aumenta quando o rendimento diminui; situação não usual."},{"term":"Lei dos custos marginais crescentes","def":"A partir de certo ponto, cada unidade adicional produzida tem um custo maior do que as anteriores; explica a inclinação positiva da oferta."},{"term":"Equilíbrio de mercado","def":"Preço para o qual a quantidade desejada procurada iguala a quantidade desejada oferecida; benefício marginal = custo marginal."},{"term":"Preço mínimo / preço máximo","def":"Preços impostos acima/abaixo do equilíbrio que geram excesso de oferta/excesso de procura (este último pode originar mercado negro)."}],"questions":[{"q":"No mercado de alfaces do exemplo (procura: P=4→12, P=6→10, P=7→9; oferta: P=4→7, P=6→10, P=7→11, milhares de caixas), se for imposto um preço máximo de 4 €, qual a quantidade transacionada e a receita?","options":["12 mil caixas e 48 mil euros","10 mil caixas e 60 mil euros","7 mil caixas e 28 mil euros","9 mil caixas e 36 mil euros"],"answer":2,"explanation":"A quantidade transacionada é sempre a menor entre a procurada (12) e a oferecida (7): 7 mil caixas; receita = 4 × 7 = 28 mil €. A opção 12/48 esquece que as empresas só querem vender 7 a esse preço.","id":"q1cy6qkl"},{"q":"A inclinação negativa da curva da procura explica-se:","options":["Pelos efeitos de substituição e de rendimento","Pela lei dos custos marginais crescentes","Pela dimensão do mercado e pelos gostos","Pelo preço dos bens complementares"],"answer":0,"explanation":"Segundo os slides, a inclinação deve-se aos efeitos substituição e rendimento. Gostos, dimensão do mercado e bens relacionados determinam a posição da curva, não a inclinação; os custos marginais crescentes explicam a inclinação da oferta.","id":"q5xnlxt"},{"q":"Se o preço de um bem complementar do bem X aumentar, tudo o resto igual, a curva da procura do bem X:","options":["Desloca-se para a direita","Não se altera; há um movimento ao longo da curva","Torna-se vertical","Desloca-se para a esquerda"],"answer":3,"explanation":"Com um complementar mais caro, para o mesmo preço de X a quantidade procurada é menor: a curva desloca-se para a esquerda. Seria para a direita se fosse um substituto a ficar mais caro.","id":"q1qnjogg"},{"q":"Um preço mínimo imposto acima do preço de equilíbrio gera:","options":["Excesso de procura e mercado negro","Excesso de oferta, transacionando-se a quantidade procurada a esse preço","Equilíbrio, porque o mercado ajusta sempre","Aumento da quantidade transacionada acima de Q*"],"answer":1,"explanation":"Acima do equilíbrio Q<sup>S</sup> > Q<sup>D</sup>: há excesso de oferta e transaciona-se o menor valor (a quantidade procurada). Sendo uma imposição, o mercado não pode ajustar. O mercado negro está associado ao preço máximo.","id":"qebf2o1"},{"q":"Qual dos seguintes fatores altera a posição da curva da oferta (e não da procura) de um bem?","options":["Aumento do rendimento dos consumidores","Aumento do número de compradores","Uma nova tecnologia que reduz os custos de produção","Mudança nos gostos dos consumidores"],"answer":2,"explanation":"Custos de produção (tecnologia, custo dos fatores, impostos) e preços de produtos relacionados na produção determinam a posição da oferta. As restantes opções são fatores da procura.","id":"q7zw79s"}],"key":"u3-3.1"},{"id":"3.1","title":"Deslocamentos das curvas e situações extremas de inclinação (3.1.5 a 3.1.7)","pages":[76,83],"summary":"<h4>3.1.5 Deslocamentos da curva da procura</h4><p>Exemplo: a procura passa de D<sub>0</sub> para D<sub>1</sub> (D<sub>1</sub>: P=1→13, …, P=5→9, P=6→8). O equilíbrio passa do ponto 0 (P=6, Q=10) para o ponto 1 (<strong>P=5, Q=9</strong>). Houve um <strong>deslocamento da curva da procura</strong> (para a esquerda/baixo) e um <strong>deslocamento ao longo da curva da oferta</strong>. Causa possível: uma <strong>descida do rendimento</strong>.</p><p>Duas leituras do deslocamento: (i) para o mesmo preço a quantidade procurada é menor (raciocínio na horizontal); (ii) para a mesma quantidade está-se disposto a pagar um preço mais baixo (raciocínio na vertical).</p><h4>3.1.6 Deslocamentos da curva da oferta</h4><p>Exemplo: a oferta passa de S<sub>0</sub> para S<sub>1</sub> (S<sub>1</sub>: P=1→3, …, P=5→11, P=6→12, P=8→14). Novo equilíbrio: <strong>P=5, Q=11</strong>. Houve um deslocamento da curva da oferta (para a direita/baixo) e um deslocamento ao longo da curva da procura. Causa possível: <strong>melhoria tecnológica</strong>. Leituras: para o mesmo preço a quantidade oferecida é maior (horizontal) ou, para a mesma quantidade, está-se disposto a receber um preço mais baixo (vertical).</p><h4>Percecionar os deslocamentos</h4><ul><li><strong>Procura</strong>: aumentos/diminuições do nº de agentes que procuram deslocam a curva na <strong>horizontal</strong> (direita/esquerda); alterações na <strong>valorização</strong> atribuída ao bem deslocam-na na <strong>vertical</strong> (mais valorizado → para cima; menos → para baixo).</li><li><strong>Oferta</strong>: aumentos/diminuições do nº de agentes que oferecem deslocam a curva na horizontal; alterações no <strong>custo marginal</strong> deslocam-na na vertical (custo marginal sobe → para cima; desce → para baixo).</li><li>Uma subida/descida na vertical da oferta tem impacto qualitativamente semelhante a um recuo/avanço; uma subida/descida na vertical da procura tem impacto semelhante a um avanço/recuo – mas o que está subjacente é diferente.</li><li><strong>Nota técnica (coeteris paribus):</strong> deslocação horizontal = «para o mesmo preço, qual é agora a quantidade desejada»; deslocação vertical = «para a mesma quantidade, qual é agora o preço desejado».</li></ul><h4>3.1.7 Situações extremas de inclinação</h4><table><tr><th>Caso</th><th>Características</th><th>Exemplos / consequências</th></tr><tr><td><strong>Procura vertical</strong> – perfeitamente rígida (inelástica)</td><td>A quantidade é determinada pela procura; o preço depende da oferta.</td><td>Bens de primeira necessidade, medicamentos essenciais (insulina). Aumentos da oferta conduzem a <strong>menor receita</strong> para quem oferece.</td></tr><tr><td><strong>Procura horizontal</strong> – perfeitamente elástica</td><td>O preço é determinado pela procura; a quantidade depende da oferta.</td><td>Difícil de ilustrar: àquele preço qualquer quantidade seria procurada; tende a verificar-se só no segmento inicial de certas curvas.</td></tr><tr><td><strong>Oferta vertical</strong> – perfeitamente rígida</td><td>A quantidade é determinada pela oferta; o preço depende da procura.</td><td>Oferta diária/semanal de bens agrícolas perecíveis; recursos fixos. Receita e preço dependem do nível da procura.</td></tr><tr><td><strong>Oferta horizontal</strong> – perfeitamente elástica</td><td>O preço é determinado pela oferta; a quantidade depende da procura.</td><td>Quando a oferta adicional não implica acréscimo de custos; tende a verificar-se no segmento inicial de certas curvas.</td></tr></table><p>Em termos genéricos: quanto mais uma curva se aproxima da vertical, mais <strong>rígida</strong>; quanto mais se aproxima da horizontal, mais <strong>elástica</strong>.</p>","keyTerms":[{"term":"Deslocamento da curva vs. ao longo da curva","def":"Alteração de um fator que não o preço desloca a curva; a alteração do preço de equilíbrio provoca movimento ao longo da outra curva."},{"term":"Procura perfeitamente rígida (inelástica)","def":"Curva da procura vertical: a quantidade procurada não reage ao preço."},{"term":"Procura perfeitamente elástica","def":"Curva da procura horizontal: o preço é fixado pela procura, qualquer quantidade é procurada a esse preço."},{"term":"Oferta perfeitamente rígida","def":"Curva da oferta vertical, típica de bens perecíveis no curto prazo ou recursos fixos."},{"term":"Coeteris paribus","def":"Tudo o resto igual; hipótese usada para isolar o efeito de uma variável."}],"questions":[{"q":"No exemplo das alfaces (equilíbrio inicial P=6, Q=10), uma melhoria tecnológica desloca a oferta para S<sub>1</sub> (a P=5 oferecem-se 11 mil caixas; a procura a P=5 é 11 mil). O novo equilíbrio é:","options":["P=6 e Q=12","P=5 e Q=9","P=7 e Q=9","P=5 e Q=11"],"answer":3,"explanation":"A P=5 a quantidade oferecida (11) iguala a procurada (11): novo equilíbrio P=5, Q=11 – o preço desce e a quantidade sobe. P=5, Q=9 seria o resultado da descida da procura (deslocamento de D).","id":"qf9jdis"},{"q":"Uma descida do rendimento dos consumidores de um bem normal provoca:","options":["Um deslocamento da curva da procura para a esquerda e um movimento ao longo da curva da oferta","Um deslocamento da curva da oferta para a esquerda","Um movimento ao longo da curva da procura, sem deslocamento","Um deslocamento das duas curvas para a direita"],"answer":0,"explanation":"O rendimento é fator de posição da procura: a curva desloca-se (para a esquerda/baixo) e o equilíbrio desliza ao longo da oferta. O movimento ao longo da procura só ocorre quando é a oferta que se desloca.","id":"q8imxrm"},{"q":"No caso de uma procura perfeitamente rígida (vertical), como a de insulina, um aumento da oferta:","options":["Aumenta a quantidade transacionada e a receita","Mantém a quantidade e reduz o preço e a receita de quem oferece","Mantém o preço e aumenta a quantidade","Não tem qualquer efeito no mercado"],"answer":1,"explanation":"Com procura vertical a quantidade é fixada pela procura; mais oferta só faz descer o preço, logo a receita (P × Q) diminui. A quantidade não pode aumentar.","id":"q1v0gy6b"},{"q":"Segundo os slides, uma alteração no custo marginal de produção desloca a curva da oferta de mercado:","options":["Na horizontal, para a direita se o custo aumenta","Na vertical, para baixo se o custo aumenta","Na vertical, para cima se o custo aumenta","Não a desloca; provoca apenas movimento ao longo da curva"],"answer":2,"explanation":"Alterações do custo marginal deslocam a oferta na vertical: custo marginal mais alto → curva para cima. Deslocamentos horizontais estão associados à variação do número de agentes que oferecem.","id":"q1n6xowr"}],"key":"u3-3.1-2"},{"id":"3.2","title":"A importância da análise marginal na determinação do valor e do custo","pages":[84,94],"summary":"<h4>Análise marginal</h4><p>«Marginal» está associado à ideia de <strong>acréscimo</strong>, de algo que se acrescenta e que está na margem (ex.: acréscimo de satisfação por comer mais uma maçã; acréscimo no custo total de uma empresa por produzir mais uma unidade). Grande parte do raciocínio económico – em especial a tomada de decisões ótimas (maximizar a satisfação de uma pessoa ou o lucro de uma empresa) – assenta na análise marginal.</p><ul><li>A curva da procura dá o <strong>preço máximo</strong> que se está disposto a pagar pela <strong>última unidade</strong> (ex.: P=10 para a 4ª unidade).</li><li>A curva da oferta dá o <strong>preço mínimo</strong> para ser compensador produzir a última unidade, i.e., o acréscimo de custo = <strong>custo marginal</strong> (ex.: P=17 para a 7ª unidade).</li></ul><h4>Utilidade total, utilidade marginal e excedente do consumidor</h4><p><strong>Utilidade</strong> = satisfação retirada do consumo de um bem; <strong>utilidade marginal</strong> = utilidade da unidade adicional. O valor da utilidade pode ser expresso em termos monetários. (Nota: a utilidade é um benefício para o consumidor.)</p><p>Exemplo da <em>sobremesa real</em> (procura individual):</p><table><tr><th>Unidades</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr><tr><td>Utilidade marginal (€)</td><td>17</td><td>14</td><td>12</td><td>10</td><td>9</td><td>8</td><td>7</td><td>6</td></tr><tr><td>Utilidade total (€)</td><td>17</td><td>31</td><td>43</td><td>53</td><td>62</td><td>70</td><td>77</td><td>83</td></tr></table><p>A utilidade marginal é decrescente porque as primeiras unidades dão mais satisfação; pode chegar a zero ou ser negativa (enjoo). Utilidade total de 3 unidades = 17+14+12 = 43.</p><p><strong>Excedente do consumidor</strong>: com preço 12 o consumidor compra 3 unidades (consome enquanto a utilidade marginal ≥ preço). Excedente = (17−12)+(14−12)+(12−12) = <strong>7</strong>: todas as unidades são pagas a 12 mas o benefício das duas primeiras foi superior. Num bem divisível, pára onde benefício marginal = preço.</p><p><strong>Visualização gráfica</strong>: A+B = área sob a procura até Q* = utilidade total bruta; B = P* × Q* = custo de consumir Q*; <strong>A = (A+B) − B = excedente do consumidor</strong> (utilidade total líquida). Há excedente quando o preço pago é o valor marginal da última unidade (caso da cruz marshalliana); pode não ser assim, ex.: descontos de quantidade (preços mais altos para menores quantidades).</p><p><strong>Síntese</strong>: o consumidor maximiza a utilidade total consumindo unidades adicionais enquanto o acréscimo de satisfação está acima do preço e parando quando é igual ao preço.</p><p><strong>Paradoxo da água e do diamante</strong>: o diamante, dispensável, tem preço alto e a água, imprescindível, preço baixo – explica-se pela análise marginal: o preço reflete a utilidade marginal (da última unidade), não a utilidade total; a água é abundante (utilidade marginal baixa) e o diamante escasso (utilidade marginal alta).</p><h4>Custo variável total, custo marginal e excedente do produtor</h4><ul><li><strong>Custo fixo</strong>: independente da quantidade produzida (ex.: aluguer do edifício).</li><li><strong>Custo variável</strong>: depende da quantidade (ex.: ingredientes).</li><li><strong>Custo marginal</strong> = acréscimo de custo variável devido à produção de uma unidade adicional.</li></ul><table><tr><th>Unidades</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr><tr><td>Custo marginal (€)</td><td>6</td><td>7</td><td>8</td><td>10</td><td>12</td><td>14</td><td>17</td><td>20</td></tr><tr><td>Custo variável total (€)</td><td>6</td><td>13</td><td>21</td><td>31</td><td>43</td><td>57</td><td>74</td><td>94</td></tr></table><p>O custo marginal cresce porque se começa a produzir com os recursos mais adequados e mais baratos. CVT de 3 unidades = 6+7+8 = 21.</p><p><strong>Excedente do produtor</strong>: com preço 10 produz 4 unidades; excedente = (10−6)+(10−7)+(10−8)+(10−10) = <strong>9</strong>. Graficamente: B = P* × Q* = ganho bruto (receita) = F + G; G = custo variável total (soma dos custos marginais, área sob a oferta); <strong>F = B − G = excedente do produtor</strong>. Pode não existir se, p. ex., fornecedores fixarem custos de modo a «sacar» esse excedente.</p><h4>Equilíbrio de mercado e excedente global</h4><p>Com 1000 consumidores e 1000 produtores idênticos (quantidades em milhares), obtêm-se as curvas de mercado. O <strong>preço de equilíbrio forma-se no mercado</strong> (P = 10, Q = 4 mil) e é depois o preço que cada empresa e cada consumidor enfrenta individualmente.</p><table><tr><th>Milhares de unidades</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr><tr><td>UMg − CMg</td><td>11</td><td>7</td><td>4</td><td>0</td><td>−3</td><td>−6</td><td>−10</td><td>−14</td></tr></table><p>Produz-se e transaciona-se enquanto a utilidade marginal ≥ custo marginal; pára-se quando são iguais. Graficamente: A+F+G = utilidade total bruta; A = excedente do consumidor; F = excedente do produtor; <strong>A+F = excedente global</strong>; G = custo consolidado. O valor de mercado determina-se pela conjugação da utilidade marginal com o custo marginal; com valorização na margem os agentes podem ter excedentes.</p><h4>Sobrevivência da empresa</h4><p>Ter excedente não chega. No <strong>curto prazo</strong> a empresa pode funcionar olhando só para receita − custo variável; no <strong>longo prazo</strong> só sobrevive se o excedente cobrir os custos totais (fixos + variáveis). Exemplo: loja de colchões com renda fixa de 4000 €/mês por 12 meses – se o ganho líquido por colchão for positivo vale a pena estar aberta mesmo sem cobrir os 4000 € (o prejuízo é menor do que fechada); ao fim dos 12 meses, se não cobrir o custo fixo, fecha.</p><ul><li>Longo e curto prazo: produzir enquanto <strong>receita marginal > custo marginal</strong>, até RMg = CMg (lucro máximo).</li><li>Longo prazo: o ganho no ponto de lucro máximo tem de cobrir <strong>todos</strong> os custos. Curto prazo: basta cobrir os custos variáveis e parte dos fixos.</li></ul>","keyTerms":[{"term":"Utilidade marginal","def":"Utilidade (satisfação) retirada do consumo de uma unidade adicional de um bem; tende a ser decrescente."},{"term":"Excedente do consumidor","def":"Utilidade total bruta menos o custo de consumir (P* × Q*); área entre a procura e o preço."},{"term":"Custo marginal","def":"Acréscimo de custo variável devido à produção de uma unidade adicional."},{"term":"Custo fixo / custo variável","def":"Custo independente da quantidade produzida / custo que depende da quantidade produzida."},{"term":"Excedente do produtor","def":"Receita (P* × Q*) menos custo variável total (soma dos custos marginais); área entre o preço e a oferta."},{"term":"Excedente global","def":"Soma dos excedentes do consumidor e do produtor (A+F)."},{"term":"Paradoxo da água e do diamante","def":"O preço reflete a utilidade marginal e não a total; a água abundante tem utilidade marginal baixa, o diamante escasso alta."}],"questions":[{"q":"Um consumidor valoriza sucessivas unidades de um bem em 17, 14, 12 e 10 €. Se o preço de mercado for 12 €, qual o seu excedente?","options":["7 €","43 €","36 €","5 €"],"answer":0,"explanation":"Compra 3 unidades (UMg ≥ 12). Excedente = (17−12)+(14−12)+(12−12) = 7. 43 é a utilidade total bruta; 36 é o custo (12×3); 5 é só o excedente da 1ª unidade.","id":"q4n1y5v"},{"q":"Um produtor tem custos marginais de 6, 7, 8, 10 e 12 € para as unidades sucessivas. Com preço de 10 €, quanto produz e qual o excedente do produtor?","options":["5 unidades e excedente de 7 €","4 unidades e excedente de 9 €","4 unidades e excedente de 40 €","3 unidades e excedente de 9 €"],"answer":1,"explanation":"Produz enquanto CMg ≤ preço: 4 unidades. Excedente = (10−6)+(10−7)+(10−8)+(10−10) = 9. 40 € é a receita bruta (B), não o excedente (F = B − G = 40 − 31).","id":"quv06sf"},{"q":"No gráfico do excedente global, sendo A a área acima do preço e abaixo da procura, F a área acima da oferta e abaixo do preço e G a área abaixo da oferta até Q*, a área G representa:","options":["O excedente do produtor","A receita total das empresas","O custo consolidado (custo variável total)","A utilidade total bruta"],"answer":2,"explanation":"G é a soma dos custos marginais até Q*, ou seja, o custo consolidado. O excedente do produtor é F; a receita é F+G; a utilidade total bruta é A+F+G.","id":"q1u0vl89"},{"q":"Uma loja paga uma renda fixa de 4000 €/mês com contrato de 12 meses. As vendas geram um excedente (receita − custos variáveis) de 2500 €/mês. No curto prazo, a loja deve:","options":["Fechar imediatamente, porque tem prejuízo","Aumentar o preço até cobrir os 4000 €","Manter-se aberta só se o excedente for superior a 4000 €","Manter-se aberta, porque o prejuízo é menor do que se fechasse"],"answer":3,"explanation":"A renda paga-se de qualquer forma durante 12 meses; aberta perde 1500 €/mês, fechada perderia 4000 €. No curto prazo basta cobrir os custos variáveis e parte dos fixos; no longo prazo terá de cobrir todos os custos.","id":"q1avh5w7"},{"q":"O paradoxo da água e do diamante explica-se porque:","options":["O preço é determinado pela utilidade marginal e não pela utilidade total","A água é um bem livre e o diamante um bem de Giffen","O custo fixo de produzir diamantes é elevado","A procura de água é perfeitamente elástica"],"answer":0,"explanation":"Pela análise marginal, o preço reflete a valorização da última unidade: a água, abundante, tem utilidade marginal baixa apesar da utilidade total enorme; o diamante, escasso, tem utilidade marginal elevada.","id":"q124q99y"}],"key":"u3-3.2"},{"id":"3.2","title":"Anexo 1 e Apêndice 1: notícias enquadráveis e processos de otimização (banquete)","pages":[95,101],"summary":"<h4>Anexo 1 – Notícias para análise com a cruz marshalliana</h4><p>Os alunos devem ser capazes de analisar corretamente uma notícia/texto para fazer uma melhor análise económica.</p><ul><li><strong>«Maduro manda Exército ocupar cadeia de eletrodomésticos» (Público, 2013)</strong>: o Governo venezuelano impôs a venda de todo o stock a «preços justos» fixados pelo Governo, com desconto significativo face ao preço de mercado; formaram-se filas; gerentes foram detidos. Tópicos: ilustrar com cruz marshalliana; identificar o condicionamento imposto (<strong>preço máximo</strong> abaixo do equilíbrio → excesso de procura, filas, possível mercado negro); consequências para preço e quantidade de equilíbrio; o que acontecerá a prazo nesse mercado (menor oferta futura).</li><li><strong>«Abundância do carapau faz cair o preço» (Correio da Manhã, 2013)</strong>: grande abundância de carapau no Algarve (choque de oferta positivo) fez cair o preço em lota para 50–60 cêntimos/kg; o mesmo com a cavala (15–20 cêntimos); alguns pescadores nem trazem o peixe para terra; na sardinha as quantidades foram menores e o preço compensou. Tópicos: cruz marshalliana; tipo de choque e consequências no preço e quantidade; impacto cruzado entre mercados de bens <strong>substitutos</strong> e <strong>complementares</strong>.</li><li><strong>«Nutella a 1,40 euros gera caos em supermercados» (SOL, 2018)</strong>: desconto de 70% (frascos de ~5 € a 1,40 €) nos Intermarché em França gerou confusão; vendeu-se num dia o equivalente a três meses. Tópicos: custo de oportunidade na decisão; utilidade; utilidade marginal por quantidade do bem; <strong>utilidade marginal por unidade monetária</strong> aplicada (5/1,4 ≈ 3,57 vezes mais satisfação por euro gasto); horizonte temporal na decisão (armazenamento).</li></ul><h4>Apêndice 1 – Decisões num banquete</h4><ul><li><strong>Consumidor sem pagar</strong>: vai tirando porções da iguaria que lhe dá mais satisfação adicional; muda para outra quando a satisfação adicional desta for superior. Processo iterativo que conduz à máxima satisfação total; no fim, a satisfação com a última porção (marginal) de cada iguaria tende a ser igual, embora a utilidade total de cada iguaria seja diferente.</li><li><strong>Consumidor com 1000 € para gastar</strong>: compara a satisfação <strong>por euro gasto</strong> (se o preço sobe, a satisfação por euro diminui). Gasta cada euro onde obtém mais satisfação; no fim, a satisfação do último euro gasto em cada iguaria tende a ser igual.</li><li><strong>Produtor</strong>: produz primeiro o produto de custo marginal mais baixo (ex.: doce de ovos), passando a outro (rissóis, tâmaras com bacon) quando o custo adicional deste for menor; minimiza o custo total, igualando tendencialmente o custo marginal da última unidade de cada iguaria. Querendo lucro, produz enquanto o lucro por unidade adicional (preço − custo marginal) for positivo; maximiza o lucro total.</li><li><strong>Conjugação</strong>: consumidores e produtores maximizam o benefício líquido total; essa ideia mantém-se no «banquete» geral da economia, apesar de muitas interações e condicionantes (ex.: produtos não divisíveis).</li></ul>","keyTerms":[{"term":"Utilidade marginal por unidade monetária","def":"Satisfação adicional obtida por cada euro gasto num bem; o consumidor tende a igualá-la entre bens."},{"term":"Choque de oferta","def":"Alteração exógena da oferta (ex.: abundância de pesca) que desloca a curva e altera preço e quantidade de equilíbrio."},{"term":"Impacto cruzado","def":"Efeito que a alteração num mercado tem nos mercados de bens substitutos ou complementares."}],"questions":[{"q":"Na notícia sobre a Venezuela, o Governo obrigou a vender eletrodomésticos a «preços justos» abaixo do preço de mercado. Na cruz marshalliana isto corresponde a:","options":["Um preço mínimo, gerando excesso de oferta","Uma deslocação da procura para a esquerda","Um preço máximo abaixo do equilíbrio, gerando excesso de procura (filas)","Uma quantidade máxima imposta"],"answer":2,"explanation":"Fixar um preço abaixo do equilíbrio é um preço máximo: a quantidade procurada excede a oferecida, daí as filas, e pode surgir mercado negro e redução da oferta futura.","id":"qd4kbue"},{"q":"No banquete, um consumidor com orçamento fixo atinge a satisfação máxima quando:","options":["A utilidade total de cada iguaria é igual","Gasta todo o dinheiro na iguaria de que mais gosta","A utilidade marginal de cada iguaria é zero","A satisfação do último euro gasto em cada iguaria tende a ser igual"],"answer":3,"explanation":"O consumidor aplica cada euro onde obtém mais satisfação adicional; no fim, a utilidade marginal por euro tende a igualar-se entre iguarias, embora a utilidade total de cada uma seja diferente.","id":"qe63h3r"}],"key":"u3-3.2-2"},{"id":"3.1 Ex.","title":"Caderno de exercícios — Procura e oferta: a cruz marshalliana (exercícios resolvidos)","pages":[291,310],"summary":"<h4>Ex. 3.1-1 – Inclinações e equilíbrio</h4><ul><li>A <strong>curva da procura</strong> resulta de um processo de otimização de quem procura/consome; a <strong>curva da oferta</strong> de um processo de otimização de quem oferece/produz → <strong>racionalidade</strong>.</li><li>O ponto de equilíbrio consubstancia o princípio do <strong>equilíbrio</strong>, resultante da interação entre agentes.</li><li><strong>Excesso de oferta</strong>: a empresa acumula stocks que não vende ao preço vigente → produz menos e baixa o preço até ao equilíbrio (deixa de ter stocks indesejados).</li><li><strong>Excesso de procura</strong>: a empresa desacumula stocks → produz mais e pratica preço mais alto até ao equilíbrio.</li><li>O horizonte temporal de ajustamento difere consoante os bens e mercados.</li></ul><h4>Ex. 3.1-2 – Mercado dos perus (dados não reais)</h4><table><tr><th>Preço</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr><tr><td>Oferta (Quadro 1)</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>10</td><td>–</td><td>–</td></tr><tr><td>Procura (Quadro 2)</td><td>–</td><td>–</td><td>10</td><td>9</td><td>8</td><td>7</td><td>5</td><td>3</td><td>2</td><td>1</td></tr></table><ul><li>Quadro 1 = <strong>oferta</strong> (positivamente inclinada); Quadro 2 = <strong>procura</strong> (negativamente inclinada).</li><li><strong>Concorrência perfeita</strong>: produto homogéneo, muitos agentes a oferecer e a procurar, sem poder individual para influenciar preço/quantidade → empresas produzem onde os custos médios totais são mínimos (preço mais baixo sustentável) – eficiência económica do ponto de vista social.</li><li>Equilíbrio: <strong>P = 6; Q = 7</strong> (milhares de perus).</li><li>A P = 8: oferecida 10, procurada 3, comprada 3, vendida 3 → <strong>excesso de oferta</strong> (7); não pode perdurar – stocks acumulam, produz-se menos e o preço baixa.</li><li>Natal: procura desloca-se para a <strong>direita</strong> → P e Q de equilíbrio maiores.</li><li>Baixa do rendimento das famílias: procura desloca-se para a <strong>esquerda</strong> → P e Q menores.</li></ul><h4>Ex. 3.1-3 – Mercado das alfaces</h4><ul><li>Oferta (Q1): P 1→8: 1, 3, 5, 7, 9, 10, 11, 12; Procura (Q2): P 2→8: 14, 13, 12, 11, 10, 9, 8 (milhares de caixas).</li><li>Para o mercado como um todo, preço e quantidade influenciam-se mutuamente; para uma empresa <em>individualmente</em> em concorrência perfeita, é o preço de mercado que determina a quantidade que produz.</li><li>Equilíbrio: <strong>P = 6 €; Q = 10</strong> mil caixas.</li><li>Notícias de bactérias nas alfaces: procura desloca-se para a esquerda → P e Q menores.</li><li>A P = 2 €: oferecida 3, procurada 14, comprada e vendida 3 → <strong>excesso de procura</strong> (11); empresas desacumulam stocks, produzem mais e sobem o preço.</li><li>Nenhum mercado é totalmente de concorrência perfeita; as alfaces, sendo relativamente homogéneas e com muitos agentes, aproximam-se.</li></ul><h4>Ex. 3.1-4 – Geladaria ambulante</h4><p>A deslocação de cidade para cidade é análoga ao <strong>movimento da curva</strong> (cada cidade tem a sua procura); a reação da quantidade procurada ao preço dos gelados <em>dentro</em> de cada cidade é análoga ao <strong>movimento ao longo da curva</strong>.</p><h4>Ex. 3.1-5 – Laranjas</h4><ul><li>Consumidores gostam menos: procura para a esquerda (ou: para a mesma quantidade aceitam pagar menos) → P e Q menores.</li><li><strong>Imposto</strong> sobre a produção: oferta desloca-se <strong>para cima</strong> (S<sub>0</sub> → S<sub>1</sub>) no montante do imposto → preço maior, quantidade menor. A receita do Estado é o retângulo T = imposto unitário × nova quantidade (entre o preço pago pelo consumidor, ponto 2, e o preço recebido pelo produtor, ponto 1). O deslocamento S<sub>0</sub>→S<sub>1</sub> é um <strong>movimento da curva</strong>; a passagem do ponto 0 ao ponto 2 sobre a curva da procura é um <strong>movimento ao longo da curva</strong>.</li><li><strong>Preço máximo</strong>: tem de ser inferior ao de equilíbrio → <strong>excesso de procura</strong>; quantidade transacionada é a da oferta a esse preço; pode surgir <strong>mercado negro</strong>. Se revogado, o mercado vai para o equilíbrio (preço mais alto, quantidade maior).</li><li>Produção socialmente responsável (escolas financiadas, doação de 10% das vendas): externalidade positiva. Se os consumidores a valorizarem, a procura sobe (P e Q maiores); os produtores podem cobrar mais (como um «imposto voluntário») → oferta para cima. Resultado: preço mais alto; quantidade indeterminada (efeitos opostos).</li></ul><h4>Ex. 3.1-6 e 3.1-7 – Pão e leite</h4><ul><li>Gostar menos de pão: procura desce → P e Q menores. Preço máximo no pão: ver laranjas.</li><li>Doença mata vacas leiteiras: oferta recua para a esquerda → P maior, Q menor.</li><li><strong>Subsídio</strong> à produção de leite: é como um imposto negativo – oferta desloca-se <strong>para baixo</strong> (S<sub>0</sub>→S<sub>1</sub>) → P menor, Q maior. A despesa do Estado é o retângulo sombreado = subsídio unitário × nova quantidade.</li></ul><h4>Ex. 3.1-8 – Automóveis de sete lugares</h4><ul><li>Famílias mais numerosas: procura para a direita → P e Q maiores.</li><li>Subsídio por automóvel produzido: oferta para baixo/direita → P menor, Q maior.</li><li>Carros de cinco lugares mais baratos (substitutos): procura dos de sete lugares para a esquerda → P e Q menores.</li><li>Descoberta tecnológica que embaratece o fabrico: oferta para baixo/direita → P menor, Q maior.</li></ul><h4>Ex. 3.1-9 – Alimentos pré-cozinhados</h4><ul><li>Aumento do IVA sobre eles: oferta para cima → P maior, Q menor.</li><li>Corte no subsídio de Natal: menor rendimento → procura recua → P e Q menores.</li><li>Aumento do IVA na restauração: pessoas trocam restaurantes por pré-cozinhados → procura para a direita → P e Q maiores.</li><li>Preço máximo: excesso de procura, possível mercado negro.</li><li>Evolução tecnológica que reduz custos: oferta para baixo → P menor, Q maior.</li></ul><h4>Ex. 3.1-10 e 3.1-11</h4><ul><li>Se quem procura integra uma externalidade positiva como benefício próprio, a procura sobe; se integra uma negativa, a procura desce. Do lado da oferta é mais complexo.</li><li>Mercado das poupanças: se as famílias pouparem mais (oferta de poupança ↑) a taxa de juro de equilíbrio <strong>diminui</strong>; se o Estado precisar de mais financiamento (procura de poupanças ↑) a taxa de juro <strong>aumenta</strong>.</li></ul><h4>Ex. 3.1-12 – Salário mínimo de 300 €</h4><p>Gráfico: salário (eixo vertical) vs. número de trabalhadores em milhões (eixo horizontal); equilíbrio sem salário mínimo em 200 € e 3,5 milhões.</p><ul><li>Com salário mínimo de 300 €: empregados (procura de trabalho) = <strong>3 milhões</strong>; oferta de trabalho = <strong>4 milhões</strong> → <strong>excesso de oferta de trabalho</strong> (desemprego) de 1 milhão.</li><li>Para não haver desequilíbrio, a procura teria de se deslocar para a direita até cruzar a oferta em 300 € e 4 milhões (ex.: aumento da produtividade ou da procura dos bens produzidos).</li><li>Revogado o salário mínimo: 200 € e 3,5 milhões empregados. Mais eficiência (mais empregados, custo menor), mas quem ganhava mais fica prejudicado em termos de equidade → <strong>conflito eficiência-equidade</strong>.</li><li>Subida do salário mínimo: boa para quem está empregado; má para desempregados que se empregariam com salário inferior.</li></ul>","keyTerms":[{"term":"Excesso de oferta","def":"A um preço acima do de equilíbrio, a quantidade oferecida excede a procurada; acumulam-se stocks e o preço tende a baixar."},{"term":"Excesso de procura","def":"A um preço abaixo do de equilíbrio, a quantidade procurada excede a oferecida; desacumulam-se stocks e o preço tende a subir."},{"term":"Concorrência perfeita","def":"Produto homogéneo, muitos compradores e vendedores sem poder individual sobre o preço; produção ao custo médio total mínimo."},{"term":"Movimento da curva","def":"Deslocação da curva provocada por alteração de um fator que não o preço do próprio bem (gostos, rendimento, impostos, tecnologia...)."},{"term":"Movimento ao longo da curva","def":"Variação da quantidade em resposta a uma alteração do preço do próprio bem."},{"term":"Preço máximo","def":"Preço fixado abaixo do equilíbrio; gera excesso de procura e pode originar mercado negro."},{"term":"Subsídio à produção","def":"Funciona como imposto negativo: a oferta desloca-se para baixo, o preço desce e a quantidade sobe; a despesa do Estado é subsídio unitário × quantidade."}],"questions":[{"q":"No mercado dos perus do Ex. 3.1-2, a um preço de 8 euros, a quantidade vendida e a situação de mercado são:","options":["10, com excesso de procura","3, com excesso de oferta","7, em equilíbrio","3, com excesso de procura"],"answer":1,"explanation":"A P = 8 oferecem-se 10 e procuram-se 3. Só se transaciona o mínimo (3), e há excesso de oferta de 7. O equilíbrio é P = 6 e Q = 7.","id":"q1gb2vl2"},{"q":"No mercado das alfaces (Ex. 3.1-3), se o preço fosse fixado em 2 € por caixa, a quantidade procurada e a oferecida seriam, respetivamente (milhares de caixas):","options":["3 e 14","10 e 10","14 e 3","12 e 5"],"answer":2,"explanation":"A 2 € procuram-se 14 mil caixas e oferecem-se 3 mil, o que dá excesso de procura de 11. A opção «3 e 14» troca a procura com a oferta.","id":"qke596"},{"q":"O Estado lança um imposto sobre a produção de laranjas. Na cruz marshalliana:","options":["A curva da procura desloca-se para a esquerda; preço e quantidade descem","A curva da oferta desloca-se para baixo; o preço desce e a quantidade sobe","Não há deslocação de curvas, apenas movimento ao longo da oferta","A curva da oferta desloca-se para cima; o preço sobe e a quantidade desce, e a receita do Estado é o imposto unitário vezes a nova quantidade"],"answer":3,"explanation":"O imposto aumenta o preço exigido para cada quantidade, por isso a ofert
