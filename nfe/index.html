ica conjuntural de estabilização do ciclo.","Um indicador de desenvolvimento económico."],"answer":1,"explanation":"As fontes são população ativa/horas, produtividade, capital físico e humano e tecnologia; o funcionamento eficiente dos mercados e a proteção dos direitos de propriedade são pré-condições dessas fontes.","id":"q5gr4iz"}],"key":"u10-10.1"},{"id":"10.2","title":"Desenvolvimento económico: indicadores, IDH e Índice de Gini","pages":[275,277],"summary":"<h4>10.2 Desenvolvimento económico</h4><p>Há desenvolvimento quando <strong>o bem-estar da população aumenta</strong>. O crescimento mede-se de forma exata; a medição do desenvolvimento é <strong>mais difícil</strong> e depende dos critérios usados.</p><h4>Indicadores</h4><p>Não há medida única; combinam-se várias:</p><ul><li><strong>PIB per capita</strong>: maior PIB não significa necessariamente desenvolvimento. O crescimento do PIB per capita é indicador de crescimento mas pode ser também de desenvolvimento, dependendo de o acréscimo ser distribuído de forma mais ou menos igualitária (distribuição mais igualitária associa-se a maior desenvolvimento).</li><li><strong>IDH – Índice de Desenvolvimento Humano</strong> (PNUD/UNDP). Dimensões: <strong>esperança média de vida à nascença</strong>; <strong>escolaridade média</strong> e outros indicadores de escolaridade; <strong>nível de vida</strong> (poder de compra medido pelo PIB per capita).</li><li><strong>Índices de felicidade</strong> (ex.: World Happiness Report, Helliwell, Layard e Sachs).</li></ul><h4>Proposta para ver se um país se está a desenvolver</h4><p>Olhar para o <strong>PIB, o PIB per capita, o Índice de Gini do rendimento e a convergência</strong>:</p><ul><li>PIB a crescer: há mais riqueza que pode ser distribuída por todos.</li><li>PIB per capita a crescer: em média todos podem receber mais.</li><li>Índice de Gini a baixar: rendimento distribuído de forma mais igualitária.</li><li><strong>Índice de Gini</strong>: 0 ≤ IG ≤ 1. IG = 0: todos recebem o mesmo rendimento (o rendimento médio); IG = 1: um recebe tudo e os outros nada.</li><li><strong>Convergência</strong>: até que ponto o nosso PIB per capita se aproxima do dos países com que nos comparamos, nomeadamente da UE.</li></ul><p>A conjugação destes critérios é uma base de apreciação social da política económica, com dados disponíveis e fáceis de aplicar. <strong>Importante:</strong> o Gini só diz se a distribuição é mais ou menos igualitária — pode haver igualdade com todos igualmente pobres ou igualmente ricos; daí conjugá-lo com os outros critérios.</p>","keyTerms":[{"term":"Desenvolvimento económico","def":"Aumento do bem-estar da população; mais difícil de medir do que o crescimento."},{"term":"IDH","def":"Índice de Desenvolvimento Humano (PNUD): esperança de vida à nascença, escolaridade e nível de vida (PIB per capita)."},{"term":"Índice de Gini","def":"Mede a desigualdade do rendimento entre 0 (igualdade total) e 1 (uma pessoa recebe tudo)."},{"term":"Convergência","def":"Aproximação do PIB per capita de um país ao dos países com que se compara (ex.: UE)."}],"questions":[{"q":"Sobre o Índice de Gini do rendimento, qual a afirmação correta?","options":["Um Gini igual a 1 significa que todos recebem o rendimento médio.","Uma descida do Gini prova, só por si, que o país está mais desenvolvido.","Um Gini igual a 0 significa que todos recebem o mesmo rendimento, mas esse valor não indica se a população é rica ou pobre.","O Gini é uma das três dimensões do IDH."],"answer":2,"explanation":"IG = 0 é igualdade total; o Gini só mede igualdade, podendo todos ser igualmente pobres, daí ter de ser conjugado com PIB, PIB per capita e convergência. As dimensões do IDH são esperança de vida, escolaridade e nível de vida.","id":"q1jqykg2"}],"key":"u10-10.2"},{"id":"10.3","title":"Poder económico e mensagem final","pages":[278,280],"summary":"<h4>10.3 Poder económico</h4><p>O crescimento e a dimensão de uma economia ajudam a compreender a política internacional e as relações internacionais. Uma economia com <strong>PIB global grande</strong>, mesmo com <strong>PIB per capita baixo</strong>, pode ter capacidade de mobilização de recursos para finalidades específicas que lhe dá um papel importante na política internacional; essa capacidade aumenta se o PIB per capita também for alto. <strong>Exemplo:</strong> Portugal tem PIB per capita muito superior ao da China ou da Índia, mas estes países têm poder económico muito superior ao de Portugal.</p><h4>Mensagem final: respeito e precaução na passagem à ação</h4><ul><li>A explicação dos ciclos económicos continua um problema importante; ao nível da política económica: como conjugar a <strong>estabilidade de curto prazo com o desenvolvimento de longo prazo</strong>?</li><li>A nível micro e macro, estão em causa o <strong>papel do Estado na economia</strong> e os conflitos permanentes <strong>eficiência–equidade</strong> e <strong>desenvolvimento–estabilidade</strong>.</li><li>A realidade é a realidade; outra coisa são as políticas para a abordar, por vezes com razões mais <strong>normativas ou ideológicas</strong>. Importa ter sensibilidade aos pressupostos <strong>positivos e normativos</strong> das políticas económicas.</li><li>A passagem da análise à ação deve ser feita com <strong>respeito e precaução</strong>, pois o nosso conhecimento é limitado e está sempre a evoluir.</li></ul><p>(Página 280: «FIM – Felicidades!»; página 281 em branco.)</p>","keyTerms":[{"term":"Poder económico","def":"Capacidade de um país mobilizar recursos e influenciar a política internacional; depende sobretudo do PIB global e é reforçada por um PIB per capita alto."},{"term":"Conflito eficiência–equidade","def":"Tensão permanente entre eficiência na afetação de recursos e justiça na distribuição."}],"questions":[{"q":"Portugal tem um PIB per capita muito superior ao da Índia, mas a Índia tem muito mais poder económico. Isto explica-se porque:","options":["O poder económico depende sobretudo da dimensão do PIB global, que permite mobilizar recursos para fins específicos, mesmo com PIB per capita baixo.","O poder económico depende apenas do PIB per capita.","O poder económico é medido pelo Índice de Gini.","A Índia tem um IDH mais elevado do que Portugal."],"answer":0,"explanation":"Uma economia com PIB global grande pode ter grande capacidade de mobilização de recursos, mesmo com PIB per capita baixo; um PIB per capita alto apenas reforça essa capacidade.","id":"qcig5o"}],"key":"u10-10.3"},{"id":"10.1 Ex.","title":"Caderno de exercícios — Crescimento e desenvolvimento económico","pages":[322,337],"summary":"<h4>Ex. 10.1 – Política económica estrutural</h4><p>Tem como objetivo alterar a <strong>estrutura</strong> da economia e, consequentemente, aumentar o <strong>PIB potencial</strong>. Não é de curto prazo: o seu efeito não se vê de imediato, pois exige tempo para alterar a estrutura de produção. Traduz-se sempre num aumento do investimento em novo capital (qualquer que seja a forma). Qualquer política estrutural de natureza orçamental tem também sempre um efeito conjuntural (curto prazo).</p><ul><li>Exemplos: <strong>investimento público</strong> em estruturas de suporte à economia; novas escolas ou hospitais; alteração do <strong>salário mínimo</strong>; políticas de <strong>regulação da concorrência</strong> (estruturais sem necessariamente impacto orçamental, condicionando o comportamento dos agentes).</li></ul><h4>Ex. 12.2 (numeração do caderno) – Crescimento</h4><ul><li><strong>Taxa de crescimento económico</strong> = [(valor final − valor inicial) / valor inicial] × 100.</li><li><strong>Regra de 70</strong>: o número de anos necessário para uma variável duplicar ≈ 70 / taxa de crescimento anual (%) – ver aula teórica.</li><li><strong>Fontes de crescimento</strong> segundo Parkin (2008) – ver aula, com exemplo de como cada uma atua.</li><li><strong>Índice de Desenvolvimento Humano (IDH)</strong> e a sua razão de ser – ver aula teórica (medir o desenvolvimento para além do PIB).</li></ul><p>O caderno termina com o aviso: os exercícios não cobrem necessariamente tudo o que foi dado nas aulas.</p>","keyTerms":[{"term":"Política económica estrutural","def":"Política de médio/longo prazo que altera a estrutura da economia e aumenta o PIB potencial (ex.: investimento público, regulação da concorrência)."},{"term":"Taxa de crescimento","def":"(Valor final − valor inicial) / valor inicial × 100."},{"term":"Regra de 70","def":"Anos para duplicar ≈ 70 / taxa de crescimento anual em %."}],"questions":[{"q":"Pela regra de 70, uma economia cujo PIB real cresça 3,5% ao ano duplica o PIB em aproximadamente:","options":["35 anos","10 anos","70 anos","20 anos"],"answer":3,"explanation":"70/3,5 = 20 anos. Os 35 anos resultariam de dividir 70 por 2, uma confusão com a taxa de crescimento.","id":"qcwz3jk"},{"q":"Qual das seguintes características distingue a política económica estrutural da conjuntural?","options":["Visa aumentar o PIB potencial alterando a estrutura da economia, com efeitos que não se veem no curto prazo","Atua apenas através da taxa de juro","Visa estabilizar o PIB em torno do potencial no curto prazo","Nunca tem qualquer efeito de curto prazo"],"answer":0,"explanation":"A política estrutural aumenta o PIB potencial a prazo. A estabilização no curto prazo é o objetivo da política conjuntural. As políticas estruturais de natureza orçamental também têm sempre um efeito conjuntural.","id":"qquddn9"}],"key":"u10-10.1 Ex."}]}]};
</script>

function unitStats(u){
  const secs = u.sections.length, read = u.sections.filter(s=>S.read[s.key]).length;
  const qs = unitQ(u.n); let seen=0, mastered=0, corr=0, att=0;
  qs.forEach(q=>{ const r=S.q[q.id]; if(r){ seen++; att+=r.a; corr+=r.c; if(r.last) mastered++; } });
  return { secs, read, total:qs.length, seen, mastered, acc: att? Math.round(corr/att*100):null };
}
function streak(){
  let n=0; const d=new Date();
  if(!S.days[today()]) d.setDate(d.getDate()-1);
  while(true){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(S.days[k]){n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}

const MARKERS = `<defs>${["c1","c2","c3","c4","c5","c6","ck","cm"].map(c=>`<marker id="m-${c}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="${c.replace('c','f').replace('fk','fk').replace('fm','fm')}"/></marker>`).join("")}</defs>`;
function tspan(t,x,y,lh=14){ return String(t).split("\n").map((l,i)=>`<tspan x="${x}" dy="${i?lh:0}">${esc(l)}</tspan>`).join(""); }
function chart(o){
  const W=o.w||480, H=o.h||300, m={l:o.ml??48,r:o.mr??30,t:o.mt??30,b:o.mb??46};
  const xmin=o.xmin??0,xmax=o.xmax??10,ymin=o.ymin??0,ymax=o.ymax??10;
  const X=x=>m.l+(x-xmin)/(xmax-xmin)*(W-m.l-m.r), Y=y=>H-m.b-(y-ymin)/(ymax-ymin)*(H-m.t-m.b);
  const P=pts=>pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
  const dir=(d,x,y,off=9)=>({n:[x,y-off,"middle"],s:[x,y+off+9,"middle"],e:[x+off,y+4,"start"],w:[x-off,y+4,"end"],ne:[x+off-2,y-off+3,"start"],nw:[x-off+2,y-off+3,"end"],se:[x+off-2,y+off+6,"start"],sw:[x-off+2,y+off+6,"end"]}[d||"ne"]);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.title||"gráfico")}">${MARKERS}`;
  (o.areas||[]).forEach(a=> s+=`<polygon points="${P(a.pts)}" class="${a.cls||'f1'}" opacity="${a.op??.22}"/>`);
  // eixos
  const x0=X(xmin), y0=Y(ymin);
  s+=`<line x1="${x0}" y1="${y0}" x2="${X(xmax)+8}" y2="${y0}" class="ax" marker-end="url(#m-ck)"/>`;
  s+=`<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${Y(ymax)-8}" class="ax" marker-end="url(#m-ck)"/>`;
  if(o.xlab) s+=`<text x="${X(xmax)+8}" y="${y0+18}" text-anchor="end" class="lbl">${esc(o.xlab)}</text>`;
  if(o.ylab) s+=`<text x="${x0-4}" y="${Y(ymax)-14}" text-anchor="start" class="lbl">${esc(o.ylab)}</text>`;
  (o.xticks||[]).forEach(t=>{ const v=typeof t==="number"?t:t.v, l=typeof t==="number"?t:(t.l??t.v); s+=`<line x1="${X(v)}" y1="${y0}" x2="${X(v)}" y2="${y0+4}" class="ax"/><text x="${X(v)}" y="${y0+16}" text-anchor="middle" class="mut">${esc(l)}</text>`; });
  (o.yticks||[]).forEach(t=>{ const v=typeof t==="number"?t:t.v, l=typeof t==="number"?t:(t.l??t.v); s+=`<line x1="${x0-4}" y1="${Y(v)}" x2="${x0}" y2="${Y(v)}" class="ax"/><text x="${x0-7}" y="${Y(v)+4}" text-anchor="end" class="mut">${esc(l)}</text>`; });
  (o.guides||[]).forEach(g=>{
    s+=`<polyline points="${X(g.x)},${y0} ${X(g.x)},${Y(g.y)} ${x0},${Y(g.y)}" class="guide"/>`;
    if(g.lx!==undefined) s+=`<text x="${X(g.x)}" y="${y0+16}" text-anchor="middle" class="${g.cls||''}">${esc(g.lx)}</text>`;
    if(g.ly!==undefined) s+=`<text x="${x0-7}" y="${Y(g.y)+4}" text-anchor="end" class="${g.cls||''}">${esc(g.ly)}</text>`;
  });
  (o.hlines||[]).forEach(g=>{ s+=`<line x1="${x0}" y1="${Y(g.y)}" x2="${X(g.x2??xmax)}" y2="${Y(g.y)}" class="cv thin ${g.cls||'cm'} ${g.dash===false?'':'dash'}"/>`; if(g.l) s+=`<text x="${x0-7}" y="${Y(g.y)+4}" text-anchor="end" class="lbl ${g.tcls||''}">${esc(g.l)}</text>`; });
  (o.vlines||[]).forEach(g=>{ s+=`<line x1="${X(g.x)}" y1="${y0}" x2="${X(g.x)}" y2="${Y(g.y2??ymax)}" class="cv thin ${g.cls||'cm'} ${g.dash===false?'':'dash'}"/>`; if(g.l) s+=`<text x="${X(g.x)}" y="${y0+16}" text-anchor="middle" class="lbl ${g.tcls||''}">${esc(g.l)}</text>`; });
  (o.curves||[]).forEach(c=>{
    s+=`<polyline points="${P(c.pts)}" class="cv ${c.cls||'c1'} ${c.dash?'dash':''} ${c.thin?'thin':''}"/>`;
    if(c.label){ const pts=c.pts, last=pts[pts.length-1]; const p = c.at==="start"? pts[0] : c.at==="mid"? [(pts[0][0]+last[0])/2,(pts[0][1]+last[1])/2] : (typeof c.at==="number"? pts[Math.min(c.at,pts.length-1)] : last); s+=`<text x="${X(p[0])+(c.lx??8)}" y="${Y(p[1])+(c.ly??4)}" class="lbl t${(c.cls||'c1').slice(1)}" text-anchor="${c.anchor||'start'}">${tspan(c.label,X(p[0])+(c.lx??8),0)}</text>`; }
  });
  (o.arrows||[]).forEach(a=> s+=`<line x1="${X(a.x1)}" y1="${Y(a.y1)}" x2="${X(a.x2)}" y2="${Y(a.y2)}" class="arrow ${a.cls||'cm'}" marker-end="url(#m-${a.cls||'cm'})"/>`);
  (o.points||[]).forEach(p=>{ s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r||4.5}" class="pt ${p.cls||'ck'}"/>`; if(p.label){ const [tx,ty,an]=dir(p.dir,X(p.x),Y(p.y)); s+=`<text x="${tx}" y="${ty}" text-anchor="${an}" class="lbl">${esc(p.label)}</text>`; } });
  (o.texts||[]).forEach(t=> s+=`<text x="${X(t.x)}" y="${Y(t.y)}" text-anchor="${t.anchor||'middle'}" class="${t.cls||''}" font-size="${t.size||12}">${tspan(t.t,X(t.x),0)}</text>`);
  return s+"</svg>";
}
function bars(o){
  const W=o.w||480, H=o.h||280, m={l:o.ml??50,r:20,t:26,b:o.mb??40};
  const groups=o.groups; const n=groups.length, k=Math.max(...groups.map(g=>g.vals.length));
  const ymin=o.ymin??0, ymax=o.ymax??Math.max(...groups.flatMap(g=>g.vals.map(v=>v.v)))*1.15;
  const Y=y=>H-m.b-(y-ymin)/(ymax-ymin)*(H-m.t-m.b);
  const gw=(W-m.l-m.r)/n, bw=Math.min(44,(gw*0.78)/k), gap=4;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.title||"gráfico de barras")}">${MARKERS}`;
  (o.yticks||[]).forEach(t=>{ s+=`<line x1="${m.l}" y1="${Y(t)}" x2="${W-m.r}" y2="${Y(t)}" class="guide"/><text x="${m.l-7}" y="${Y(t)+4}" text-anchor="end" class="mut">${t}</text>`; });
  s+=`<line x1="${m.l}" y1="${Y(0)}" x2="${W-m.r}" y2="${Y(0)}" class="ax"/>`;
  if(o.ylab) s+=`<text x="${m.l-4}" y="${m.t-10}" class="lbl">${esc(o.ylab)}</text>`;
  groups.forEach((g,i)=>{
    const cx=m.l+gw*i+gw/2, tot=g.vals.length*bw+(g.vals.length-1)*gap; let x=cx-tot/2;
    g.vals.forEach(v=>{ const y1=Y(Math.max(0,v.v)), y2=Y(Math.min(0,v.v)); s+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(1,y2-y1)}" class="bar ${v.cls||'f1'}" opacity="${v.op??.9}"/>`; if(v.label!==undefined) s+=`<text x="${x+bw/2}" y="${v.v>=0?y1-5:y2+13}" text-anchor="middle" class="lbl" font-size="11.5">${esc(v.label)}</text>`; x+=bw+gap; });
    s+=`<text x="${cx}" y="${H-m.b+16}" text-anchor="middle">${tspan(g.label,cx,0,13)}</text>`;
  });
  if(o.hline){ s+=`<line x1="${m.l}" y1="${Y(o.hline.y)}" x2="${W-m.r}" y2="${Y(o.hline.y)}" class="cv thin dash ${o.hline.cls||'c2'}"/>`; if(o.hline.l) s+=`<text x="${W-m.r}" y="${Y(o.hline.y)-5}" text-anchor="end" class="lbl t${(o.hline.cls||'c2').slice(1)}">${esc(o.hline.l)}</text>`; }
  return s+"</svg>";
}
function diagram(o){
  const W=o.w||520, H=o.h||300;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.title||"diagrama")}" style="max-width:${o.max||620}px">${MARKERS}`;
  (o.boxes||[]).forEach(b=>{
    s+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="${b.r??10}" class="box ${b.cls||''}"/>`;
    const lines=String(b.t).split("\n"), lh=b.size?b.size*1.25:15, y0=b.y+b.h/2-(lines.length-1)*lh/2+4.5;
    s+=`<text x="${b.x+b.w/2}" y="${y0}" text-anchor="middle" class="${b.bold===false?'':'lbl'} ${b.tcls||''}" font-size="${b.size||12.5}">${lines.map((l,i)=>`<tspan x="${b.x+b.w/2}" dy="${i?lh:0}" ${i&&b.sub?'class="mut" font-weight="400" font-size="11.5"':''}>${esc(l)}</tspan>`).join("")}</text>`;
  });
  (o.arrows||[]).forEach(a=>{
    const c=a.cls||'cm';
    if(a.bend){ const mx=(a.x1+a.x2)/2+(a.bend[0]||0), my=(a.y1+a.y2)/2+(a.bend[1]||0); s+=`<path d="M${a.x1} ${a.y1} Q${mx} ${my} ${a.x2} ${a.y2}" class="arrow ${c} ${a.dash?'dash':''}" marker-end="url(#m-${c})"/>`; }
    else s+=`<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" class="arrow ${c} ${a.dash?'dash':''}" marker-end="url(#m-${c})" ${a.both?`marker-start="url(#m-${c})"`:''}/>`;
    if(a.t){ const tx=a.tx??((a.x1+a.x2)/2+(a.bend?a.bend[0]/2:0)), ty=a.ty??((a.y1+a.y2)/2-6+(a.bend?a.bend[1]/2:0)); s+=`<text x="${tx}" y="${ty}" text-anchor="${a.anchor||'middle'}" class="lbl t${c.slice(1)}" font-size="${a.size||12}">${tspan(a.t,tx,0,13)}</text>`; }
  });
  (o.texts||[]).forEach(t=> s+=`<text x="${t.x}" y="${t.y}" text-anchor="${t.anchor||'middle'}" class="${t.cls||''}" font-size="${t.size||12}" ${t.bold?'font-weight="600"':''}>${tspan(t.t,t.x,0,t.lh||14)}</text>`);
  return s+"</svg>";
}

function qfigHtml(id){
  const f = QFIGS[id]; if(!f) return "";
  if(f.grid) return `<div class="qfig">${f.grid}<p class="qcap">${f.cap}</p></div>`;
  return `<div class="qfig"><figure class="fig">${f.svg}${f.tbl||""}${f.cap?`<figcaption>${f.cap}</figcaption>`:""}</figure></div>`;
}


// ---------- Navegação ----------
let route = { v:"home" };
function go(r){ route=r; render(); window.scrollTo(0,0); $("#side").classList.remove("open"); }

function renderNav(){
  const item = (v,label,ico) => `<button data-v="${v}" class="${route.v===v&&!route.unit?'active':''}">${ICO[ico]} ${label}</button>`;
  let h = item("home","Início","home") + item("quiz","Praticar","quiz") + item("review","Rever erros","review") + item("search","Pesquisar","search") + item("progress","Progresso","chart");
  h += `<div class="nav-sep">Unidades</div>`;
  DATA.units.forEach(u=>{
    const st=unitStats(u), p=pct(st.read+st.mastered, st.secs+st.total);
    h += `<button class="unit-link ${route.v==='unit'&&route.unit===u.n?'active':''}" data-unit="${u.n}"><span class="num" style="background:${ucolor(u.n)}">${u.n}</span><span class="lbl"><span>${esc(u.short)}</span><span class="bar"><i style="width:${p}%"></i></span></span></button>`;
  });
  $("#nav").innerHTML = h;
  $("#nav").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>go({v:b.dataset.v}));
  $("#nav").querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>go({v:"unit",unit:+b.dataset.unit}));
  const tb=$("#themeBtn"); tb.innerHTML = (S.theme==="dark"? ICO.sun+" Modo claro" : ICO.moon+" Modo escuro suave");
  tb.onclick=()=>{ S.theme = S.theme==="dark"? null : "dark"; applyTheme(); save(); renderNav(); };
}
const menuBtn = () => `<div class="topbar"><button class="btn ghost small menu-btn" onclick="document.getElementById('side').classList.add('open')">☰ Menu</button></div>`;

function render(){
  renderNav();
  const m = $("#main");
  const views = { home:viewHome, unit:viewUnit, quiz:viewQuizSetup, play:viewPlay, result:viewResult, review:viewReview, search:viewSearch, progress:viewProgress };
  m.innerHTML = menuBtn();
  const div = document.createElement("div"); m.appendChild(div);
  (views[route.v]||viewHome)(div);
}

// ---------- Início ----------
function ring(p, size=150, color="var(--accent)"){
  const r=56, c=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 140 140" style="width:${size}px;height:${size}px"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="12"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 70 70)"/><text x="70" y="78" text-anchor="middle" font-size="26" font-weight="700" fill="var(--text)" font-family="var(--serif)">${p}%</text></svg>`;
}

  const totalSecs = DATA.units.reduce((a,u)=>a+u.sections.length,0);

  const wrongN = allQ.filter(q=>S.q[q.id] && !S.q[q.id].last).length;
  const sel = S.selected;
  const overall = pct(readN+mast, totalSecs+allQ.length);
  const h = new Date().getHours(), greet = h<12?"Bom dia":h<20?"Boa tarde":"Boa noite";
  const last = S.last && unitById(S.last.unit);
  el.innerHTML = `
    <h1>${greet}! Bom estudo.</h1>

    <div class="grid" style="grid-template-columns:minmax(200px,auto) 1fr;align-items:stretch">
      <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">${ring(overall)}<div class="muted small">progresso global</div></div>
      <div class="grid stats">
        <div class="card stat"><div class="v">${readN}<span class="muted" style="font-size:16px">/${totalSecs}</span></div><div class="k">secções lidas</div></div>

        <div class="card stat"><div class="v">${att?pct(corr,att)+"%":"—"}</div><div class="k">taxa de acerto</div></div>
        <div class="card stat"><div class="v">${streak()}</div><div class="k">dias seguidos</div></div>
      </div>
    </div>
    ${last?`<div class="card continue" id="cont" style="margin-top:14px;--uc:${ucolor(last.n)}"><div class="ico">${last.n}</div><div><div class="small muted">Continuar onde ficaste</div><div style="font-weight:600">${esc(last.title)}</div></div><span class="spacer"></span><span class="muted">→</span></div>`:""}

    </div>
    <div class="grid units" id="ucards"></div>`;
  const chips = $("#selchips");
  chips.innerHTML = `<span class="chip" id="all">Todas</span><span class="chip" id="none">Nenhuma</span>` +
    DATA.units.map(u=>`<label class="chip ${sel.includes(u.n)?"on":""}"><input type="checkbox" data-n="${u.n}" ${sel.includes(u.n)?"checked":""}> ${u.n}</label>`).join("");
  chips.querySelectorAll("input").forEach(i=>i.onchange=()=>{ const n=+i.dataset.n; S.selected = i.checked? [...new Set([...S.selected,n])].sort((a,b)=>a-b) : S.selected.filter(x=>x!==n); save(); render(); });

  $("#none").onclick=()=>{S.selected=[];save();render();};

  el.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ route.tab=b.dataset.t; route.open=null; render(); });

function renderOverview(u, body){

}
function renderGlossary(u, body){

}

// ---------- Prática: configuração ----------
let QS = null;
const setup = { mode:"mix", count:15 };
function viewQuizSetup(el){
  const pool = () => {
    let qs = allQ.filter(q=>S.selected.includes(q.unit));
    if(setup.mode==="new") qs = qs.filter(q=>!S.q[q.id]);
    if(setup.mode==="wrong") qs = qs.filter(q=>S.q[q.id] && !S.q[q.id].last);
    if(setup.mode==="mix"){
      const w = q => { const r=S.q[q.id]; if(!r) return 3; if(!r.last) return 4; return 1/(1+r.c); };
      qs = qs.map(q=>({q, k:Math.random()*w(q)})).sort((a,b)=>b.k-a.k).map(x=>x.q);
    } else qs = shuffle(qs);
    return qs;
  };
  const draw = () => {
    const p = pool(), n = setup.count==="all"? p.length : Math.min(+setup.count, p.length);
    el.innerHTML = `
      <h1>Praticar</h1>
      <p class="lead">Perguntas de escolha múltipla com correção imediata e explicação. Usa as teclas A–D para responder e Enter para avançar.</p>
      <div class="card">
        <div class="field"><label>Unidades</label><div class="row" id="uc"></div></div>
        <div class="field"><label>Que perguntas?</label>
          <div class="seg" id="mode">
            <button data-m="mix">Inteligente</button><button data-m="all">Todas (aleatório)</button><button data-m="new">Só novas</button><button data-m="wrong">Só as que errei</button>
          </div>
          <div class="kbd" style="margin-top:6px">${{mix:"Dá prioridade às perguntas que erraste e às que nunca viste.",all:"Ordem aleatória, sem prioridades.",new:"Apenas perguntas que ainda não respondeste.",wrong:"Apenas perguntas cuja última resposta foi errada."}[setup.mode]}</div>
        </div>
        <div class="field"><label>Quantas?</label>
          <div class="seg" id="cnt">${[10,15,25,40,"all"].map(c=>`<button data-c="${c}">${c==="all"?"Todas":c}</button>`).join("")}</div>
        </div>
        <div class="row" style="margin-top:18px"><button class="btn" id="go" ${n?"":"disabled"}>Começar · ${n} pergunta${n===1?"":"s"}</button>
        <span class="muted">${p.length} disponíveis nas unidades escolhidas</span></div>
      </div>`;
    $("#uc").innerHTML = DATA.units.map(u=>`<label class="chip ${S.selected.includes(u.n)?"on":""}" title="${esc(u.title)}"><input type="checkbox" data-n="${u.n}" ${S.selected.includes(u.n)?"checked":""}> ${u.n}. ${esc(u.short)}</label>`).join("");
    $("#uc").querySelectorAll("input").forEach(i=>i.onchange=()=>{ const k=+i.dataset.n; S.selected = i.checked? [...new Set([...S.selected,k])].sort((a,b)=>a-b) : S.selected.filter(x=>x!==k); save(); renderNav(); draw(); });
    el.querySelectorAll("#mode button").forEach(b=>{ b.classList.toggle("on", b.dataset.m===setup.mode); b.onclick=()=>{setup.mode=b.dataset.m; draw();}; });
    el.querySelectorAll("#cnt button").forEach(b=>{ b.classList.toggle("on", String(setup.count)===b.dataset.c); b.onclick=()=>{setup.count=b.dataset.c==="all"?"all":+b.dataset.c; draw();}; });
    $("#go").onclick=()=>startQuiz(p.slice(0,n), "Prática");
  };
  draw();
}

function startQuiz(qs, label){
  if(!qs.length){ toast("Não há perguntas para mostrar."); return; }
  QS = { label, items: qs.map(q=>({ q, order: shuffle([0,1,2,3].slice(0,q.options.length)), pick:null })), i:0 };
  go({v:"play"});
}

// ---------- Prática: jogar ----------
function viewPlay(el){
  if(!QS){ go({v:"quiz"}); return; }
  const it = QS.items[QS.i], q = it.q, done = it.pick!==null;
  const Lt = "ABCD";
  el.innerHTML = `
    <div class="progress-top"><span>${esc(QS.label)}</span><span class="meter acc"><i style="width:${pct(QS.i+(done?1:0),QS.items.length)}%"></i></span><span>${QS.i+1}/${QS.items.length}</span></div>
    <div class="card">
      <div class="row"><span class="tag unit" style="--uc:${ucolor(q.unit)}">Unidade ${q.unit}</span><span class="tag">${esc(q.sec)} ${esc(q.secTitle)}</span>${S.q[q.id]?(S.q[q.id].last?'<span class="tag ok">acertaste da última vez</span>':'<span class="tag bad">erraste da última vez</span>'):'<span class="tag">nova</span>'}</div>
      <div class="q">${esc(q.q)}</div>
      ${qfigHtml(q.id)}
      <div class="opts">${it.order.map((oi,k)=>{
        let cls=""; if(done){ if(oi===q.answer) cls="right"; else if(oi===it.pick) cls="wrong"; }
        return `<button class="opt ${cls}" data-o="${oi}" ${done?"disabled":""}><span class="l">${Lt[k]}</span><span>${esc(q.options[oi])}</span></button>`;}).join("")}</div>
      ${done?`<div class="expl ${it.pick===q.answer?"ok":"no"}"><strong>${it.pick===q.answer?"Certo!":"Errado."}</strong> ${esc(q.explanation)}</div>`:""}
      <div class="row" style="margin-top:18px">
        <button class="btn ghost small" id="quit">Terminar</button><span class="spacer"></span>
        ${done?`<button class="btn" id="next">${QS.i+1<QS.items.length?"Seguinte →":"Ver resultado"}</button>`:`<span class="kbd">Teclas: A–D para responder</span>`}
      </div>
    </div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
  $("#quit").onclick=finishQuiz;
  if(done) $("#next").onclick=next;
}
function answer(oi){
  const it = QS.items[QS.i]; if(it.pick!==null) return;
  it.pick = oi; const ok = oi===it.q.answer;
  const r = S.q[it.q.id] || {a:0,c:0}; r.a++; if(ok) r.c++; r.last = ok; r.t = Date.now(); S.q[it.q.id]=r;
  markDay(); save(); render();
}
function next(){ if(QS.i+1<QS.items.length){ QS.i++; render(); } else finishQuiz(); }
function finishQuiz(){
  const answered = QS.items.filter(x=>x.pick!==null);
  if(answered.length){ S.sessions.push({ t:Date.now(), label:QS.label, n:answered.length, c:answered.filter(x=>x.pick===x.q.answer).length }); S.sessions=S.sessions.slice(-100); save(); }
  go({v:"result"});
}
document.addEventListener("keydown", e=>{
  if(route.v!=="play"||!QS||e.target.tagName==="INPUT") return;
  const it=QS.items[QS.i], k=e.key.toUpperCase();
  if(it.pick===null && "ABCD".includes(k) && k.length===1){ const idx="ABCD".indexOf(k); if(idx<it.order.length) answer(it.order[idx]); }
  else if(it.pick!==null && (e.key==="Enter"||e.key===" "||e.key==="ArrowRight")){ e.preventDefault(); next(); }
});

// ---------- Resultado ----------
function viewResult(el){
  if(!QS){ go({v:"home"}); return; }
  const ans = QS.items.filter(x=>x.pick!==null), ok = ans.filter(x=>x.pick===x.q.answer);
  const wrong = ans.filter(x=>x.pick!==x.q.answer);
  const p = ans.length? pct(ok.length,ans.length):0;
  el.innerHTML = `
    <h1>Resultado</h1>
    <div class="card" style="text-align:center">
      ${ring(p,170,p>=70?"var(--ok)":p>=40?"var(--warn)":"var(--bad)")}
      <div style="font-weight:600;font-size:18px">${ok.length} certas em ${ans.length}</div>
      <div class="muted">${esc(QS.label)}</div>
      <div class="row" style="justify-content:center;margin-top:16px">
        ${wrong.length?`<button class="btn" id="redo">Repetir as ${wrong.length} erradas</button>`:""}
        <button class="btn ghost" id="again">Nova sessão</button>
        <button class="btn ghost" id="home">Início</button>
      </div>
    </div>
    ${wrong.length?`<h2>A rever</h2><div class="card">${wrong.map(x=>`
      <div class="review-item"><div class="row"><span class="tag unit" style="--uc:${ucolor(x.q.unit)}">Unidade ${x.q.unit}</span><span class="tag">${esc(x.q.sec)}</span></div>
      <p style="font-weight:600;margin:6px 0">${esc(x.q.q)}</p>
      <p style="margin:4px 0;color:var(--bad)">✗ ${esc(x.q.options[x.pick])}</p>
      <p style="margin:4px 0;color:var(--ok)">✓ ${esc(x.q.options[x.q.answer])}</p>
      <p class="muted" style="margin:4px 0">${esc(x.q.explanation)}</p></div>`).join("")}</div>`:""}`;
  if($("#redo")) $("#redo").onclick=()=>startQuiz(shuffle(wrong.map(x=>x.q)), "Repetir erradas");
  $("#again").onclick=()=>go({v:"quiz"});
  $("#home").onclick=()=>go({v:"home"});
}

// ---------- Pesquisa ----------
let lastSearch = "";
function viewSearch(el){
  el.innerHTML = `<h1>Pesquisar</h1><p class="lead">Procura um conceito em todos os resumos e conceitos-chave.</p>
    <input type="search" id="s" placeholder="ex.: custo de oportunidade, PIB, deflator, crowding out…" value="${esc(lastSearch)}"><div id="res" class="card" style="margin-top:14px"></div>`;
  const strip = h => { const d=document.createElement("div"); d.innerHTML=h; return d.textContent; };
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const idx = []; DATA.units.forEach(u=>u.sections.forEach(s=>{ const txt=strip(s.summary)+" "+s.keyTerms.map(t=>t.term+" "+t.def).join(" "); idx.push({u,s,txt,n:norm(s.title+" "+txt)}); }));
  const run = () => {
    lastSearch = $("#s").value; const term = norm(lastSearch.trim());
    if(term.length<2){ $("#res").innerHTML=`<div class="empty">Escreve pelo menos 2 letras.</div>`; return; }
    const hits = idx.filter(x=>x.n.includes(term)).slice(0,40);
    $("#res").innerHTML = hits.length? hits.map(x=>{
      const p = norm(x.txt).indexOf(term); const a=Math.max(0,p-80);
      const snip = p>=0? (a?"…":"")+esc(x.txt.slice(a,p))+"<mark>"+esc(x.txt.slice(p,p+term.length))+"</mark>"+esc(x.txt.slice(p+term.length,p+term.length+120))+"…" : "";
      return `<div class="search-hit" data-u="${x.u.n}" data-k="${x.s.key}"><div class="st"><span class="tag unit" style="--uc:${ucolor(x.u.n)}">U${x.u.n}</span><strong>${esc(x.s.id)} ${esc(x.s.title)}</strong></div><div class="muted" style="font-size:14px">${snip}</div></div>`;}).join("")
      : `<div class="empty">Sem resultados.</div>`;
    $("#res").querySelectorAll(".search-hit").forEach(h=>h.onclick=()=>go({v:"unit",unit:+h.dataset.u,tab:"sec",open:h.dataset.k}));
  };
  $("#s").oninput = run; $("#s").focus(); run();
}

${intro(`A Economia existe porque os <b>recursos são escassos e têm usos alternativos</b>. Como não chegam para tudo, é preciso <b>escolher</b>, e escolher implica sacrificar a melhor alternativa — o <b>custo de oportunidade</b>. A unidade constrói esta ideia passo a passo: de onde vem a necessidade de economizar (1.1), o que é a ciência económica e como se raciocina nela (1.2), a definição de Samuelson (1.3) e, finalmente, o problema económico com as suas ferramentas: FPP, custos relativos crescentes, rendimentos marginais decrescentes e as três formas de a sociedade responder — tradição, autoridade e mercado (1.4).`)}

${h2(1,"De onde parte tudo: viver exige recursos, e usá-los bem")}
<p>A secção 1.1 parece filosófica, mas dá o alicerce da disciplina. Queremos continuar a viver (e, enquanto espécie, para sempre); para isso precisamos de <b>recursos</b>; como os recursos são limitados, interessa <b>ser eficiente</b> — conseguir mais com os mesmos recursos. Vivemos em grupos (famílias, empresas, sociedade), onde <b>cooperamos e competimos</b>. Por fim, toda a análise tem uma <b>perspetiva</b>: a Economia adota sobretudo a perspetiva da <b>sociedade como um todo</b> — é isso que dá coerência à disciplina.</p>
${fig(diagram({w:560,h:120,boxes:[
  {x:10,y:30,w:120,h:60,t:"Viver\n(agora e no futuro)",cls:"b1"},
  {x:160,y:30,w:110,h:60,t:"Recursos",cls:"b2"},
  {x:300,y:30,w:120,h:60,t:"Eficiência\nmais com o mesmo",cls:"b3"},
  {x:450,y:30,w:100,h:60,t:"Perspetiva\nda sociedade",cls:"b4"}],
  arrows:[{x1:130,y1:60,x2:158,y2:60,cls:"cm"},{x1:270,y1:60,x2:298,y2:60,cls:"cm"},{x1:420,y1:60,x2:448,y2:60,cls:"cm"}]}),
  "A cadeia de ideias de 1.1: a vontade de viver obriga a usar recursos; como são limitados, a eficiência torna-se referência; e a Economia olha para o conjunto da sociedade.")}

${h2(2,"O que é a ciência económica e como se pensa nela")}
<p>A Economia estuda <b>decisões sobre produção, distribuição e consumo</b>, mas é sobretudo uma <b>perspetiva de análise</b>: os mesmos factos podem ser vistos por outras ciências. Adam Smith (1776) é o pai da análise moderna, com o <b>mecanismo de troca</b>: ninguém precisa de consumir só o que produz; cada um especializa-se no que faz melhor e troca — e assim a riqueza aumenta.</p>
<p>Duas <b>vigas mestras</b> sustentam o raciocínio económico:</p>
<ul>
<li><b>Postulado da racionalidade</b> — em média as pessoas otimizam (satisfazem os seus objetivos da forma mais eficiente) e são coerentes (agem da mesma forma em iguais circunstâncias).</li>
<li><b>Postulado do equilíbrio</b> — os mercados equilibram: o que é oferecido tende a igualar o que é procurado. O equilíbrio nasce do confronto de interesses interdependentes.</li>
</ul>
${cmp(["Economia positiva (ciência)","Analisa de forma neutra <i>o que se passa</i>.","Ex.: como varia a procura de alimentos com o preço e o rendimento.","Pode ser testada com dados."],
      ["Economia normativa (doutrina)","Diz <i>o que se deve passar</i>; envolve juízos de valor.","Ex.: que rendimento deve ter uma família para receber apoio do Estado.","Uma escolha normativa pode ser ponto de partida de uma análise positiva."])}
<p>O método usa observação, análise matemática/estatística e (cada vez mais) experimentação. Dois cuidados são essenciais: a hipótese <b>coeteris paribus</b> («tudo o resto constante») e o facto de as leis económicas se verificarem <b>em média</b>, não caso a caso. Daí as <b>fontes de erro</b> clássicas: esquecer o coeteris paribus, esquecer o carácter estatístico das leis, a incerteza, a subjetividade, a <b>falácia da composição</b> (o que vale para a parte não vale necessariamente para o todo) e a <b>falácia post-hoc</b> («depois de, logo por causa de»).</p>

${h2(3,"A definição de Samuelson, palavra a palavra")}
<div class="box"><p style="font-family:var(--serif);font-size:17px;margin:0">«Economia é a ciência que estuda como as pessoas e a sociedade <b>escolhem</b> o emprego de <b>recursos escassos</b> que podem ter <b>usos alternativos</b>, de forma a <b>produzir</b> vários bens e a <b>distribuí-los para consumo</b>, <b>agora e no futuro</b>, entre as várias pessoas e grupos na sociedade.»</p></div>
<p>Cada expressão a negrito é um dos aspetos que o professor destaca: comportamento dos agentes e da sociedade; recursos, bens e produção; <b>escassez, usos alternativos e escolha</b> (o núcleo); distribuição; consumo (o ato de satisfazer necessidades — a definição está centrada nas pessoas, não nos bens); e o <b>tempo</b> (consumir hoje ou amanhã?). Repara que se um recurso fosse escasso mas tivesse um único uso possível, não haveria problema económico: não haveria nada a escolher.</p>

${h2(4,"Escassez → escolha → custo de oportunidade")}
${fig(diagram({w:560,h:110,boxes:[
  {x:10,y:25,w:150,h:60,t:"Escassez\nnão chega para tudo",cls:"b2"},
  {x:205,y:25,w:150,h:60,t:"Escolha\noptar e sacrificar",cls:"b1"},
  {x:400,y:25,w:150,h:60,t:"Custo de oportunidade\nvalor da melhor alternativa",cls:"b4",size:11.5}],
  arrows:[{x1:160,y1:55,x2:203,y2:55,cls:"cm"},{x1:355,y1:55,x2:398,y2:55,cls:"cm"}]}),
  "«Não há almoços grátis»: há problema económico sempre que é preciso decidir entre mais de uma resposta possível.")}
<p>A <b>escassez económica</b> não é escassez física: um bem é escasso quando não chega para satisfazer as necessidades humanas. Como obriga a escolher, o benefício do que <i>não</i> se escolheu é o custo da escolha. O <b>custo de oportunidade</b> é o benefício da <b>melhor</b> alternativa (não a soma de todas), e o que interessa são as decisões <b>a tomar</b>, não as já consumadas.</p>
${formulas([
  {fx:"Ganho líquido = Benefício da decisão − Custo de oportunidade", fd:"Ex.: um trabalho ao fim de semana paga 100 €; a melhor alternativa pagaria 80 €. Custo de oportunidade = 80 €; ganho líquido = 20 €."},
  {fx:"Regra <b>com / sem</b>, não <b>antes / depois</b>", fd:"O impacto de uma decisão mede-se comparando a situação com a decisão e a situação sem ela. Esta regra volta na Unidade 9 para avaliar políticas."}])}

${h2(5,"Bens: livres ou económicos, finais ou recursos")}
${fig(diagram({w:600,h:295,boxes:[
  {x:230,y:10,w:140,h:40,t:"BEM\ntudo o que tem valor",cls:"bk",tcls:"",size:11.5},
  {x:40,y:85,w:150,h:46,t:"Bem livre\nsem custo de propriedade",cls:"b3",size:11.5},
  {x:220,y:85,w:160,h:46,t:"Bem económico\nhá que suportar um custo",cls:"b2",size:11.5},
  {x:410,y:85,w:170,h:46,t:"Pelo uso:\nfinal ou recurso?",cls:"",size:11.5},
  {x:300,y:165,w:130,h:44,t:"Bem final\nsatisfaz diretamente",cls:"b1",size:11.5},
  {x:450,y:165,w:140,h:44,t:"Recurso\nnão satisfaz diretamente",cls:"b4",size:11.5},
  {x:300,y:240,w:145,h:46,t:"Recursos intermédios\ncomponentes, matérias-\nprimas, subsidiárias",cls:"",size:9.5},
  {x:455,y:240,w:140,h:46,t:"Fatores de produção\nterra, trabalho, capital,\ncap. empreendedora",cls:"",size:9.5}],
  arrows:[{x1:280,y1:50,x2:120,y2:83,cls:"cm"},{x1:300,y1:50,x2:300,y2:83,cls:"cm"},{x1:320,y1:50,x2:480,y2:83,cls:"cm"},
          {x1:470,y1:131,x2:370,y2:163,cls:"cm"},{x1:510,y1:131,x2:520,y2:163,cls:"cm"},
          {x1:500,y1:209,x2:380,y2:238,cls:"cm"},{x1:540,y1:209,x2:530,y2:238,cls:"cm"}],
  texts:[{x:120,y:150,t:"ex.: luz do Sol — em geral omitido\nda análise, mas pode passar a\neconómico se alguém o controlar",cls:"mut",size:10.5,lh:12}]}),
  "Duas classificações independentes. <b>Livre vs. económico</b> depende de haver ou não um custo por alguém ter a propriedade do bem. <b>Final vs. recurso</b> depende do <b>uso</b>, não da natureza do bem: o morango comido é bem final; usado para fazer doce é recurso.")}
<p>Os <b>recursos intermédios</b> incorporam-se (componentes, matérias-primas) ou não (matérias subsidiárias) no produto; os <b>fatores de produção</b> são necessários à produção mas não se incorporam nela. A «terra» não é produzida; o capital é produzido; trabalho e capacidade empreendedora são parte inatos, parte produzidos.</p>

${h2(6,"A FPP: o menu de escolhas de uma sociedade")}
<p>Com <b>todos os recursos fixos</b>, que combinações de dois bens é possível produzir? A <b>Fronteira de Possibilidades de Produção</b> une os máximos. O exemplo da sebenta usa carros de combate e trigo:</p>
${fig(chart({w:520,h:330,xmax:6,ymax:17,xlab:"Carros de combate (milhares)",ylab:"Trigo (milhões de t)",xticks:[0,1,2,3,4,5],yticks:[0,5,9,12,14,15],
  areas:[{pts:[[0,0],...fpp,[0,0]],cls:"f1",op:.08}],
  curves:[{pts:fpp,cls:"c1",label:"FPP",at:4,lx:12,ly:2}],
  points:[...fpp.map((p,i)=>({x:p[0],y:p[1],cls:"c1",label:"ABCDEF"[i],dir:"ne"})),{x:2,y:6,cls:"cm",label:"G — ineficiente",dir:"e"},{x:4,y:12,cls:"c2",label:"H — impossível",dir:"e"}]}),
  "<b>Como ler:</b> os pontos A a F são eficientes no sentido de Pareto (não se pode produzir mais de um bem sem produzir menos do outro). G, dentro da fronteira, é ineficiente; H, fora, é impossível com os recursos atuais. A curva é <b>côncava para a origem</b> por causa da lei dos custos relativos crescentes.")}
${figgrid(
  fig(bars({w:420,h:240,groups:[["A→B",1],["B→C",2],["C→D",3],["D→E",4],["E→F",5]].map(g=>({label:g[0],vals:[{v:g[1],cls:"f2",label:g[1]}]})),ymax:6,ylab:"trigo sacrificado por +1 milhar de carros"}),

  fig(chart({w:420,h:240,xmax:7,ymax:21,xlab:"bem I",ylab:"bem II",
    curves:[{pts:fpp,cls:"c1",label:"FPP₀",at:2,lx:-34,ly:-6},{pts:fpp.map(p=>[p[0]*1.3,p[1]*1.3]),cls:"c3",dash:true,label:"FPP₁",at:2,lx:8,ly:-6}],

)}
<p>A escolha de um ponto <i>da</i> fronteira exige um critério que pode não ser económico (uma sociedade em guerra escolhe mais carros). A ideia é avançar ao longo da FPP até o benefício social de mais um bem deixar de compensar o custo social de menos do outro.</p>

${h2(7,"Rendimentos marginais decrescentes: quando só um recurso varia")}
<p>Aqui o contexto muda: em vez de todos os recursos fixos, <b>um recurso aumenta e os outros ficam constantes</b>. «Marginal» significa variação. O <b>rendimento marginal</b> é o acréscimo de produção da unidade adicional do recurso. A lei diz que, para iguais acréscimos do recurso, a produção aumenta cada vez menos — e pode até diminuir.</p>

)}

${h2(8,"As quatro perguntas e as três respostas")}
<p>O problema económico obriga a sociedade a responder: <b>produzir o quê?</b> (que produtos, quantidades), <b>como?</b> (quem, com que tecnologia), <b>para quem?</b> (como se reparte) e <b>quando?</b>. Há três mecanismos de resposta, que coexistem em todas as sociedades:</p>
${fig(diagram({w:600,h:100,boxes:[
  {x:10,y:20,w:170,h:60,t:"Tradição\nhoras das refeições, castas,\ncerimónias, religião",cls:"b5",size:11.5},

${fig(diagram({w:600,h:100,boxes:[

2: () => `
${intro(`Nas sociedades modernas, famílias e empresas relacionam-se através de <b>mercados</b> — é o <b>circuito económico</b>. A referência para avaliar um mercado é a <b>concorrência perfeita</b>, onde o equilíbrio é eficiente. Quando o mercado se afasta dela há <b>falhas de mercado</b> (concorrência imperfeita, externalidades, bens públicos, recursos comuns) e o Estado intervém para <b>promover a eficiência</b>. O Estado tem ainda duas funções que o mercado não garante — <b>equidade</b> e <b>estabilidade</b> — mas persegui-las cria dois conflitos permanentes: <b>eficiência-equidade</b> e <b>desenvolvimento-estabilidade</b>.`)}

${h2(1,"O circuito económico simplificado")}

${h2(2,"Porque intervém o Estado? Três objetivos, três funções")}
<p>A intervenção percebe-se em contraponto ao mercado totalmente livre — mas atenção: até o livre funcionamento dos mercados exige controlo a um nível superior (leis, tribunais), tal como a democracia. Os <b>indivíduos</b> procuram o seu bem-estar, as <b>empresas</b> maximizam o lucro, e o <b>Estado</b> tem como paradigma o bem-estar da <b>sociedade como um todo</b> (embora por vezes fique «capturado» por interesses particulares).</p>
${fig(diagram({w:600,h:150,boxes:[
  {x:10,y:20,w:180,h:70,t:"Eficiência\ncorrigir falhas de mercado\n(referência: concorrência perfeita)",cls:"b1",size:11.5},
  {x:210,y:20,w:180,h:70,t:"Equidade\nredistribuir rendimento\n(o mercado não garante justiça)",cls:"b3",size:11.5},
  {x:410,y:20,w:180,h:70,t:"Estabilidade\nempregos e rendimentos\n(o mercado cria instabilidade)",cls:"b5",size:11.5}],
  arrows:[{x1:190,y1:110,x2:210,y2:110,cls:"c2",both:true},{x1:390,y1:110,x2:410,y2:110,cls:"c2",both:true}],
  texts:[{x:200,y:135,t:"conflito eficiência-equidade",cls:"t2",size:11,bold:true},{x:400,y:135,t:"conflito desenvolvimento-estabilidade",cls:"t2",size:11,bold:true}]}),
  "As três funções económicas do Estado. A concorrência perfeita é referência <b>apenas</b> para a eficiência; para equidade e estabilidade a referência é o que a sociedade entende que devem ser.")}

${h2(3,"A concorrência perfeita como padrão")}
<p>É um caso particular de mercado livre e uma <b>referência hipotética ideal</b>: muitos agentes de ambos os lados sem poder individual, produto homogéneo, informação perfeita. O equilíbrio é um ponto de <b>eficiência</b>: pratica-se o preço mais baixo que permite a uma empresa cobrir os custos totais (= mínimo do custo médio), e ficam no mercado as empresas necessárias para fornecer a quantidade procurada a esse preço. Conceito técnico útil: <b>mercado relevante</b> — o contexto geográfico, ciberespacial e temporal onde a interação acontece (eletricidade doméstica em Portugal vs. telemóveis num mercado internacional).</p>

${h2(4,"As quatro falhas de mercado ao nível da eficiência")}
<p>Cada falha corresponde a uma hipótese da concorrência perfeita que não se verifica. Todas se avaliam do ponto de vista <b>global da sociedade</b>: alguns agentes até ganham, mas a sociedade perde.</p>

<tr><td><b>Bens públicos</b><br><span class="muted">ninguém excluído, não se esgotam</span></td><td>Não se acede ao bem sem pagar</td><td>Ninguém os providencia se ninguém paga</td><td>Providencia o bem ou garante propriedade privada eficaz</td></tr>
<tr><td><b>Recursos comuns</b><br><span class="muted">ninguém excluído, mas esgotam-se (pesca)</span></td><td>Continuidade do mercado no futuro</td><td>O preço não inclui o custo social do esgotamento</td><td>Limita a exploração ou taxa quem explora</td></tr>
</table></div>
${fig(chart({w:520,h:320,xmax:10,ymax:11,xlab:"Quantidade",ylab:"Preço / custo",

  "<b>Externalidade negativa na produção.</b> A empresa só paga o seu custo privado, por isso o mercado produz Q mercado. Mas cada unidade impõe um custo adicional a terceiros (ex.: poluição). Para a sociedade, o ótimo é a quantidade menor Q ótimo, onde o benefício iguala o custo social. O Estado pode <b>internalizar</b> a externalidade (um imposto que suba o custo privado até ao social) para que o preço passe a refletir o efeito.")}

<p>Um <b>monopólio natural</b> (uma só rede de metro) existe porque é mais eficiente haver um único agente; confere poder, daí a regulação — mas não é um monopólio «comum». A associação de agentes (sindicatos, taxistas protegidos por lei) altera o poder negocial; o caso taxistas vs. UBER ilustra ao mesmo tempo os dois conflitos.</p>

${h2(5,"Equidade e estabilidade: dois conflitos permanentes")}
${cmp(["Conflito eficiência-equidade","Impostos progressivos retiram a quem tem mais e transferem para quem precisa.","Desincentivam os mais eficientes (parte do resultado é redistribuída) e os menos eficientes (não precisam de se esforçar tanto).","Promover um reduz o outro."],

<p>A gestão destes dois conflitos está presente em toda a política económica do Governo — voltam nas Unidades 8, 9 e 10.</p>

${fig(chart({w:480,h:360,xmax:100,ymax:100,xlab:"% acumulada da população (dos mais pobres aos mais ricos)",ylab:"% acumulada do rendimento",xticks:[20,40,60,80,100],yticks:[20,40,60,80,100],

<p>O Anexo 1 pergunta <b>que igualdade</b>: de <b>oportunidades</b> ou de <b>resultados</b>? A análise económica foca-se muitas vezes na igualdade de resultados (rendimento). Instrumentos: o <b>rendimento mínimo garantido</b> (a quem precisa, numa base familiar) e a proposta de <b>rendimento básico incondicional</b> (a todos, por nascerem — rejeitado em referendo na Suíça em 2016 com 76,9 % contra), próxima da <b>taxa de imposto negativa</b> de Friedman. Defensores invocam dignidade e liberdade; opositores, o desincentivo ao trabalho (ineficiência).</p>

${intro(`A <b>cruz marshalliana</b> — a curva da procura (D) a descer e a da oferta (S) a subir — é a ferramenta central da análise económica. Toma a concorrência perfeita como referência, mas usa-se qualitativamente em quase todos os mercados. Esta unidade ensina a ler as curvas (que quantidade a cada preço, ou que preço para cada quantidade), a encontrar o <b>equilíbrio</b>, a perceber o que acontece em <b>desequilíbrio</b> (preços máximos e mínimos impostos), a distinguir <b>deslocamentos da curva</b> de <b>movimentos ao longo da curva</b>, e termina com a <b>análise marginal</b>: o preço reflete a utilidade da <i>última</i> unidade, e por isso consumidores e produtores ficam com <b>excedentes</b>.`)}

${h2(1,"As duas curvas e o equilíbrio")}
<p>A <b>curva da procura</b> dá a quantidade desejada por quem compra para cada preço (leitura horizontal) <i>e</i> o preço máximo que se está disposto a pagar por cada quantidade (leitura vertical). Desce por dois efeitos: <b>substituição</b> (preço sobe → procuro substitutos) e <b>rendimento</b> (preço sobe → fico mais pobre). A <b>curva da oferta</b> sobe por causa da <b>lei dos custos marginais crescentes</b> (Unidade 1): as unidades adicionais custam mais a produzir. Ambas as curvas de mercado são a <b>soma horizontal</b> das curvas individuais, e desenham-se <b>coeteris paribus</b> — só o preço do próprio bem varia.</p>
${fig(chart({w:520,h:340,xmin:0,xmax:16,ymax:9,xlab:"Quantidade (milhares de caixas de alface)",ylab:"Preço (€/caixa)",xticks:[2,4,6,8,10,12,14],yticks:[1,2,3,4,5,6,7,8],

  points:[{x:10,y:6,cls:"ck",label:"equilíbrio",dir:"ne"}]}),
  "<b>Exemplo da sebenta.</b> Em P* = 6 € a quantidade procurada iguala a oferecida (10 mil caixas). Nesse ponto o <b>benefício marginal</b> de quem compra iguala o <b>custo marginal</b> de quem vende. Receita = 6 × 10 = 60 mil €.")}

${h2(2,"Desequilíbrios: excesso de oferta, excesso de procura")}
${fig(chart({w:520,h:340,xmin:0,xmax:16,ymax:9,xlab:"Quantidade",ylab:"Preço",xticks:[7,9,10,11,12],yticks:[4,6,7],

${h2(3,"Deslocar a curva ou mover-se ao longo dela?")}
<p>É a distinção mais importante da unidade. Quando varia o <b>preço do próprio bem</b>, movemo-nos <i>ao longo</i> da curva. Quando varia <b>outro fator</b> (gostos, rendimento, n.º de agentes, preços de bens relacionados, custos, tecnologia), a <b>curva inteira desloca-se</b> — e isso provoca um movimento ao longo da <i>outra</i> curva.</p>

  fig(chart({w:430,h:290,xmin:0,xmax:16,ymax:9,xlab:"Q",ylab:"P",xticks:[10,11],yticks:[5,6],

)}

<tr><th>O que muda</th><th>Procura</th><th>Oferta</th></tr>

<p>Regra geral: quanto mais próxima da <b>vertical</b>, mais <b>rígida</b> (inelástica); quanto mais próxima da <b>horizontal</b>, mais <b>elástica</b>.</p>

${h2(5,"Análise marginal: o preço reflete a última unidade")}
<p>A procura é, na verdade, a curva da <b>utilidade marginal</b> (satisfação da unidade adicional, em euros), que é decrescente: as primeiras unidades dão mais prazer. A oferta é a curva do <b>custo marginal</b>, crescente. O consumidor compra enquanto UMg ≥ P; o produtor produz enquanto P ≥ CMg. Como todas as unidades se pagam ao mesmo preço, nascem excedentes.</p>
${figgrid(
  fig(bars({w:430,h:270,groups:UM.map(p=>({label:String(p[0]),vals:[{v:p[1],cls:p[1]>=12?"f1":"f6",label:p[1]}]})),ymax:20,ylab:"utilidade marginal (€)",hline:{y:12,l:"preço = 12",cls:"c2"}}),

    areas:[{pts:[[1,17],[2,14],[3,12],[4,10],[1,10]],cls:"f1",op:.3},{pts:[[1,6],[2,7],[3,8],[4,10],[1,10]],cls:"f2",op:.3}],

${formulas([
  {fx:"Excedente do consumidor = Σ (UMg − P)", fd:"Utilidade total bruta (área sob a procura) menos o que se paga (P × Q)."},

<p>O <b>paradoxo da água e do diamante</b> resolve-se aqui: o preço reflete a utilidade <b>marginal</b>, não a total. A água é abundante (UMg baixa), o diamante escasso (UMg alta). E sobre a <b>sobrevivência da empresa</b>: no curto prazo basta cobrir os custos variáveis (vale a pena manter a loja aberta mesmo sem cobrir a renda já contratada); no longo prazo tem de cobrir <b>todos</b> os custos, fixos e variáveis.</p>

${h2(7,"Inflação: índices de preços e IPC")}
<p>Um <b>número índice</b> passa de um valor para outro de forma <b>multiplicativa</b> (200 → 240 é ×1,2) e é adimensional. O <b>IPC</b> mede a evolução dos preços de um <b>cabaz</b> representativo do consumo dos residentes (estrutura do Inquérito aos Orçamentos Familiares); o <b>IHPC</b> inclui também a despesa dos turistas (daí o peso muito maior de restaurantes e hotéis). A <b>inflação subjacente</b> exclui energia e alimentares não transformados.</p>

${h2(8,"Pleno emprego, taxa natural e PIB potencial")}
<p><b>Pleno emprego não é desemprego zero.</b> No <b>curto prazo</b>, há pleno emprego quando todo o desemprego é friccional e estrutural (não há desemprego cíclico) — é o conceito habitual, ligado à política conjuntural. No <b>longo prazo</b>, só resta o friccional. A <b>taxa de desemprego natural</b> é a taxa de desemprego em pleno emprego (andará nos 4–6 %, sem consenso) e o <b>PIB potencial</b> é o PIB de pleno emprego: o PIB real flutua à sua volta. Em pleno emprego, coeteris paribus, os salários estão estáveis e o nível de preços não se altera. A taxa natural depende de competências, mobilidade e informação (a internet reduz o friccional); o desemprego de longa duração aumenta-a, porque os trabalhadores perdem capital humano.</p>

${intro(`A moeda (<i>money</i>, não as moedas metálicas) define-se pelas suas <b>funções</b>: meio de troca, unidade de conta e reserva de valor. Hoje é sobretudo depósitos e assenta na <b>confiança</b>. A <b>oferta de moeda</b> é criada pelo Banco Central (base monetária) e multiplicada pelos bancos através do crédito. A <b>procura de moeda</b> depende do PIB, dos preços e da taxa de juro, que é o <b>custo de oportunidade de deter moeda</b>. Oferta e procura encontram-se no <b>mercado monetário</b>, determinando a taxa de juro — e, a prazo, o nível de preços: <b>a inflação é sempre um fenómeno monetário</b>.`)}

${h2(1,"O que é a moeda e para que serve")}
<p>Pensar num mundo sem moeda (troca direta) mostra para que serve. A moeda é o que cumpre três funções, e precisa de certas características para as cumprir: ser divisível, durável, geralmente aceite, ter reduzida procura não monetária, manter valor, ser prática e difícil de falsificar. Do sal aos metais, da moeda cunhada às notas e aos depósitos: a tendência é a <b>desmaterialização</b>.</p>
<div class="content"><table>
<tr><th>Função</th><th>De que depende</th></tr>
<tr><td><b>Meio de troca</b> (pagamento das transações)</td><td>Do número de transações → do <b>rendimento (PIB)</b>: mais PIB, mais moeda necessária.</td></tr>
<tr><td><b>Unidade de conta</b></td><td>Da estabilidade da unidade de referência; serve para comparar valores.</td></tr>
<tr><td><b>Reserva de valor</b></td><td>Da <b>taxa de juro nominal</b>: quanto maior, menos compensa guardar valor em moeda (que não rende juros).</td></tr>
</table></div>

${intro(`Todas as economias são <b>abertas</b>: trocam bens, serviços e fatores com o exterior. Como cada Estado tem a sua moeda, surge o <b>mercado de divisas</b>, onde se forma a <b>taxa de câmbio</b> — o preço de uma moeda em unidades de outra. Os governos podem deixá-la flutuar ou fixá-la (<b>regimes cambiais</b>); as <b>paridades de poder de compra</b> dão uma referência de longo prazo; e a <b>balança de pagamentos</b> regista todas as relações com o exterior.`)}

${h2(1,"O mercado de divisas e a taxa de câmbio")}
<p><b>Divisas</b> = moeda estrangeira. A taxa de câmbio pode escrever-se de duas formas: <b>direta</b> (quantos euros custa 1 USD, e = €/USD) ou <b>indireta</b> (quantos USD custa 1 €). <b>Na cruz marshalliana do mercado cambial usa-se sempre a forma direta.</b> Quem <b>procura</b> dólares: importadores, quem viaja para os EUA, quem envia rendimentos e capitais para fora. Quem <b>oferece</b> dólares: exportadores, turistas estrangeiros, quem recebe rendimentos e capitais de fora.</p>
${fig(chart({w:520,h:330,xmax:20,ymax:5.5,xlab:"quantidade de USD",ylab:"e = €/USD",yticks:[{v:2,l:"2,0"},{v:2.5,l:"2,5"}],xticks:[10,12.5],

${h2(2,"Regimes cambiais e política cambial")}
<p>A taxa de câmbio é um preço ligado aos preços das exportações e importações. Se <b>e sobe</b> (desvalorização): as importações encarecem e as exportações ficam mais baratas para o estrangeiro — em princípio importa-se menos e exporta-se mais. Mas, se as <b>quantidades</b> não reagissem, a desvalorização seria prejudicial (pagava-se mais pelo mesmo e recebia-se menos). A desvalorização só compensa se o aumento das quantidades exportadas superar a descida do preço recebido. A valorização é o espelho.</p>
${fig(diagram({w:600,h:150,boxes:[

${h2(3,"Paridades de poder de compra (PPC)")}
<p>As PPC servem para <b>comparar PIB e salários entre países pelo poder de compra</b>, não pela taxa de câmbio de mercado. Duas leituras: (i) <b>cabaz de referência</b> — quanto custa o mesmo cabaz em cada país, na moeda local; o valor da moeda mede-se em n.º de cabazes; (ii) <b>índice conversor</b> (INE) — multiplica-se o valor nacional por um índice que elimina as diferenças de níveis de preços. A dificuldade: definir cabazes comparáveis (azeite em Portugal, outro óleo no Brasil).</p>

${h2(3,"Desenvolvimento: como saber se um país se está a desenvolver?")}
<p>Não há medida única. Um PIB maior não significa necessariamente desenvolvimento — depende de como o acréscimo se distribui. O <b>IDH</b> (PNUD) combina três dimensões; há também índices de felicidade. A proposta prática da sebenta combina quatro critérios:</p>
<ol class="steps">
<li><b>PIB a crescer</b> — há mais riqueza para distribuir.</li>
<li><b>PIB per capita a crescer</b> — em média, cada pessoa pode receber mais.</li>
<li><b>Índice de Gini a baixar</b> — o rendimento distribui-se de forma mais igual (0 = todos iguais; 1 = um recebe tudo). Mas o Gini só mede distribuição: pode haver igualdade com todos pobres — daí conjugá-lo com os outros.</li>
<li><b>Convergência</b> — o nosso PIB per capita aproxima-se do dos países com que nos comparamos (UE).</li>
</ol>

<p><b>Mensagem final do professor:</b> a explicação dos ciclos continua um problema aberto — como conjugar estabilidade de curto prazo com desenvolvimento de longo prazo? Em tudo estão em causa o papel do Estado e os conflitos <b>eficiência-equidade</b> e <b>desenvolvimento-estabilidade</b>. A realidade é uma coisa; as políticas para a abordar, com pressupostos positivos e normativos (por vezes ideológicos), são outra. A passagem da análise à ação exige <b>respeito e precaução</b>, porque o nosso conhecimento é limitado e está sempre a evoluir.</p>
