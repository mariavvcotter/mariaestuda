a sobe (movimento da curva). O novo equilíbrio desloca-se ao longo da procura. A oferta para baixo corresponderia a um subsídio.","id":"q4sbfyi"},{"q":"O Estado aumenta o IVA na restauração. O que acontece no mercado dos alimentos pré-cozinhados?","options":["A procura desloca-se para a direita; preço e quantidade de equilíbrio aumentam","A oferta desloca-se para cima; o preço sobe e a quantidade desce","A procura desloca-se para a esquerda; preço e quantidade descem","Nada muda, porque o imposto não incide sobre este mercado"],"answer":0,"explanation":"As pessoas trocam os restaurantes pelos pré-cozinhados, que são substitutos, e a sua procura aumenta. Já um aumento do IVA sobre os próprios pré-cozinhados deslocaria a oferta para cima.","id":"q12jwnmb"},{"q":"No Ex. 3.1-12 (salário mínimo de 300 €; equilíbrio livre em 200 € e 3,5 milhões; procura de 3 milhões e oferta de 4 milhões a 300 €), o desemprego gerado pelo salário mínimo é de:","options":["0,5 milhões","3,5 milhões","1 milhão","Não há desemprego, há excesso de procura de trabalho"],"answer":2,"explanation":"A 300 € oferecem trabalho 4 milhões e as empresas empregam 3 milhões: há excesso de oferta de trabalho de 1 milhão. O valor de 0,5 compara apenas com o equilíbrio de 3,5 milhões.","id":"q19rq4n7"},{"q":"Se as famílias passarem a poupar mais, coeteris paribus, a taxa de juro de equilíbrio no mercado das poupanças:","options":["Aumenta, porque há mais procura de crédito","Diminui, porque a oferta de poupanças aumenta","Mantém-se, porque a poupança não afeta a taxa de juro","Aumenta, porque o Estado precisa de mais financiamento"],"answer":1,"explanation":"Mais poupança desloca a oferta de fundos para a direita e a taxa de juro baixa. Se o Estado procurar mais financiamento, a procura de poupanças sobe e a taxa de juro aumenta.","id":"q4ra514"}],"key":"u3-3.1 Ex."},{"id":"3.2 Ex.","title":"Caderno de exercícios — Análise marginal na determinação do valor e do custo","pages":[294,311],"summary":"<h4>Ex. 3.2-1</h4><p>O que se entende por análise marginal e a sua importância na tomada de decisões (otimização): comparar o acréscimo de benefício com o acréscimo de custo de cada unidade adicional.</p><h4>Ex. 3.2-2 – Oficina de reparações</h4><table><tr><th>Homens (A)</th><th>Reparações (B)</th><th>ΔA</th><th>ΔB</th><th>ΔB/ΔA</th></tr><tr><td>0</td><td>0</td><td>…</td><td>…</td><td>…</td></tr><tr><td>5</td><td>30</td><td>5</td><td>30</td><td>6</td></tr><tr><td>10</td><td>60</td><td>5</td><td>30</td><td>6</td></tr><tr><td>15</td><td>80</td><td>5</td><td>20</td><td>4</td></tr><tr><td>20</td><td>90</td><td>5</td><td>10</td><td>2</td></tr><tr><td>25</td><td>96</td><td>5</td><td>6</td><td>1,2</td></tr><tr><td>30</td><td>100</td><td>5</td><td>4</td><td>0,8</td></tr><tr><td>35</td><td>90</td><td>5</td><td>−10</td><td>−2</td></tr></table><p><strong>Informação adicional necessária:</strong> o <strong>custo (salário)</strong> de cada homem e o <strong>valor</strong> de cada reparação. Enquanto o valor das reparações devidas a mais um homem for superior ao acréscimo de custo, vale a pena contratar. Para-se quando o <strong>custo marginal de mais um empregado = produtividade marginal em valor</strong> desse empregado. Exemplo: se o salário de um homem corresponder ao valor de <strong>4 reparações</strong>, a oficina emprega <strong>15 homens</strong> (o último grupo, de 10 para 15, gera 4 reparações por homem).</p><p><strong>Aviso do caderno:</strong> os exercícios não cobrem necessariamente tudo o que foi dado nas aulas; é preciso ler atentamente as aulas e os apontamentos.</p>","keyTerms":[{"term":"Análise marginal","def":"Avaliação das decisões com base nos acréscimos (benefício marginal vs. custo marginal) de uma unidade adicional."},{"term":"Produtividade marginal em valor","def":"Valor do acréscimo de produção gerado por mais um trabalhador; contrata-se até igualar o custo marginal (salário)."}],"questions":[{"q":"Na oficina do Ex. 3.2-2, se o salário de um mecânico corresponder ao valor de 2 reparações, quantos mecânicos deve empregar (considerando os escalões da tabela)?","options":["15","25","30","20"],"answer":3,"explanation":"Contrata-se enquanto ΔB/ΔA ≥ salário em reparações. De 15 para 20 o acréscimo é 2 por homem, igual ao salário, e de 20 para 25 é só 1,2. Logo emprega 20. O valor 15 corresponde ao exemplo do caderno, em que o salário equivale a 4 reparações.","id":"q1bdxoml"}],"key":"u3-3.2 Ex."}]},{"n":4,"title":"Microeconomia e Macroeconomia","short":"Micro e Macro","sections":[{"id":"4.1","title":"Microeconomia, macroeconomia e economia agregada","pages":[101,103],"summary":"<h4>Enquadramento</h4><p>Uma forma de estudar a economia consiste em dividi-la em três partes: <strong>princípios fundamentais</strong>, <strong>microeconomia</strong> e <strong>macroeconomia</strong>. Por falta de tempo, o programa inclui os princípios fundamentais e a macroeconomia; para quem tem mais disciplinas de economia, a microeconomia será desenvolvida depois; para quem esta é a única disciplina, as questões macroeconómicas são fundamentais para compreender o enquadramento global da sociedade, nomeadamente a nível político. Inicia-se aqui a segunda parte do programa.</p><table><tr><th>Microeconomia</th><th>Macroeconomia</th></tr><tr><td>Analisa o comportamento dos agentes e dos mercados: consumidores; produtores; mercados (interação entre consumidores e produtores); papel do Governo na eventual regulação desses mercados.</td><td>Análise feita ao nível global da economia; analisa a <strong>agregação</strong> do comportamento dos agentes.</td></tr></table><p><strong>Nota</strong>: há autores que recusam a distinção, considerando que a macroeconomia deve ter como fundamento os princípios microeconómicos do comportamento dos agentes; nesse sentido parte de uma base microeconómica e chama-se <strong>Análise da Economia Agregada</strong>. Na disciplina usa-se a designação mais usual de macroeconomia.</p>","keyTerms":[{"term":"Microeconomia","def":"Estudo do comportamento de consumidores, produtores, mercados e do papel do Governo na regulação desses mercados."},{"term":"Macroeconomia","def":"Análise ao nível global da economia, da agregação do comportamento dos agentes."},{"term":"Análise da Economia Agregada","def":"Designação dada à macroeconomia por autores que a fundamentam no comportamento microeconómico dos agentes."}],"questions":[{"q":"Qual das seguintes questões é tipicamente objeto da microeconomia?","options":["A evolução da taxa de inflação nacional","O papel do Governo na regulação do mercado de um bem","O défice e a dívida do Estado","O crescimento do produto do país"],"answer":1,"explanation":"A microeconomia estuda consumidores, produtores, mercados e o papel do Governo na sua eventual regulação. Inflação, défice/dívida e crescimento são exemplos de problemas macroeconómicos.","id":"qpqnyph"}],"key":"u4-4.1"},{"id":"4.2","title":"Exemplos de problemas macroeconómicos","pages":[104,104],"summary":"<h4>Exemplos de problemas macroeconómicos</h4><ul><li>A produção está sempre a crescer?</li><li>Qual o efeito dos impostos na economia?</li><li>O que está na base da inflação?</li><li>O que são o défice e a dívida do Estado?</li></ul><p>As questões macroeconómicas estão em geral ligadas às <strong>funções económicas do Estado</strong> e, consequentemente, aos conflitos <strong>«eficiência-equidade»</strong> e <strong>«desenvolvimento-estabilidade»</strong>.</p>","keyTerms":[{"term":"Conflitos eficiência-equidade e desenvolvimento-estabilidade","def":"Tensões associadas às funções económicas do Estado, às quais as questões macroeconómicas estão em geral ligadas."}],"questions":[{"q":"Segundo os slides, as questões macroeconómicas estão em geral ligadas às funções económicas do Estado e aos conflitos:","options":["«eficiência-equidade» e «desenvolvimento-estabilidade»","«procura-oferta» e «preço-quantidade»","«curto prazo-longo prazo» e «fixo-variável»","«consumidor-produtor» e «utilidade-custo»"],"answer":0,"explanation":"O slide 207 refere expressamente os conflitos eficiência-equidade e desenvolvimento-estabilidade. As outras opções são pares de conceitos microeconómicos.","id":"qk9s4po"}],"key":"u4-4.2"},{"id":"4.1 Ex.","title":"Caderno de exercícios — Microeconomia e Macroeconomia","pages":[312,322],"summary":"<p>Início da <strong>Segunda Parte</strong> do caderno.</p><ul><li><strong>Ex. 4-1</strong>: distinguir microeconomia (comportamento de agentes e mercados individuais) de macroeconomia (agregados da economia como um todo).</li><li><strong>Ex. 4-2</strong>: indicar cinco problemas macroeconómicos (ex.: crescimento do PIB, desemprego, inflação, desequilíbrios externos/balança de pagamentos, défice e dívida pública, flutuações da atividade).</li><li>Soluções: «ver aula teórica».</li></ul>","keyTerms":[{"term":"Macroeconomia","def":"Estudo dos agregados económicos (PIB, emprego, preços, contas externas) da economia como um todo."}],"questions":[],"key":"u4-4.1 Ex."}]},{"n":5,"title":"Medir e monitorizar a criação de riqueza e a evolução da Economia","short":"Medir a riqueza","sections":[{"id":"5.1","title":"O circuito económico e a remuneração dos fatores de produção","pages":[104,106],"summary":"<h4>Estrutura do capítulo 5</h4><p>5.1 Circuito económico e remuneração dos fatores; 5.2 Circuito económico e contabilidade nacional; 5.3 Monitorização do produto; 5.4 Emprego e desemprego; 5.5 Inflação; 5.6 Pleno emprego, taxa de desemprego natural e PIB potencial. Anexos: gastos do Estado de natureza diferente; ventilação das importações pelas componentes da despesa. Apêndice: medição a preços de mercado e a preços de fatores.</p><h4>Circuito económico simplificado</h4><p>Dois agentes – <strong>Empresas</strong> e <strong>Famílias</strong> – e dois mercados:</p><ul><li><strong>Mercados de bens finais</strong>: as empresas fornecem <strong>bens</strong>; as famílias realizam <strong>despesa</strong>.</li><li><strong>Mercados de fatores</strong>: as famílias fornecem <strong>fatores</strong>; as empresas pagam <strong>rendimento</strong>.</li></ul><table><tr><th>Fator de produção</th><th>Remuneração</th></tr><tr><td>Trabalho</td><td>Salários</td></tr><tr><td>«Terra»</td><td>Rendas</td></tr><tr><td>Capital</td><td>Juros</td></tr><tr><td>Capacidade empreendedora</td><td>Lucros económicos</td></tr></table><p>Nota: o mercado de recursos intermédios pode considerar-se intra-empresarial (de empresas para empresas), não sendo representado no diagrama.</p>","keyTerms":[{"term":"Circuito económico simplificado","def":"Representação dos fluxos entre empresas e famílias através dos mercados de bens finais e de fatores (sem Estado, resto do mundo e mercados financeiros)."},{"term":"Remuneração dos fatores","def":"Salários (trabalho), rendas («terra»), juros (capital) e lucros económicos (capacidade empreendedora)."}],"questions":[{"q":"No circuito económico simplificado, a remuneração do fator «capacidade empreendedora» é:","options":["As rendas","Os juros","Os salários","Os lucros económicos"],"answer":3,"explanation":"Trabalho → salários; «terra» → rendas; capital → juros; capacidade empreendedora → lucros económicos.","id":"q7a548g"}],"key":"u5-5.1"},{"id":"5.2","title":"O circuito económico e a contabilidade nacional: o PIB","pages":[107,111],"summary":"<h4>Contabilidade nacional</h4><p>(Ilustração: estátua do escriba egípcio, Saqqara, 2600–2350 a.C. – o registo/contabilidade é antigo.)</p><p>Objetivo: medir a <strong>riqueza criada</strong> no contexto do circuito económico. O circuito tem associado um <strong>fluxo</strong>: o fluxo do produto, ou seja, a <strong>riqueza criada num país num determinado período de tempo</strong> (a essa riqueza criada chama-se também <strong>produto</strong>). Um fluxo é medido num período – em geral um ano. É importante distinguir <strong>fluxo</strong> de <strong>stock</strong> (rendimento vs. riqueza acumulada).</p><h4>Três pontos/óticas de medição do produto</h4><ul><li>À saída das empresas – fluxo de <strong>bens</strong> → <strong>ótica da produção</strong>.</li><li>À porta dos utilizadores finais – fluxo da <strong>despesa</strong> (forma de utilização do produto) → <strong>ótica da despesa</strong>*.</li><li>No lado do mercado dos fatores – <strong>rendimento</strong> recebido pelas famílias → <strong>ótica do rendimento</strong>*.</li></ul><p>* As duas óticas mais abordadas. O circuito diz-se simplificado porque não tem Governo, Resto do Mundo nem Mercados Financeiros; mais à frente será necessário um circuito completo.</p><h4>PIB – Produto Interno Bruto (GDP)</h4><p>«É o <strong>valor de mercado</strong> de todos os <strong>bens e serviços finais</strong> produzidos <strong>num país</strong> num <strong>determinado período</strong>.»</p><p>PIB = p<sub>1</sub>×q<sub>1</sub> + p<sub>2</sub>×q<sub>2</sub> + … + p<sub>n</sub>×q<sub>n</sub> (n bens finais; p<sub>i</sub> preço e q<sub>i</sub> quantidade do bem final i).</p><table><tr><th>Parte da definição</th><th>Problema associado</th></tr><tr><td>Valor de mercado</td><td>Problema da agregação e da valorização</td></tr><tr><td>Bens e serviços finais</td><td>Problema da dupla contagem</td></tr><tr><td>Produzidos num determinado país</td><td>Problema da localização geográfica</td></tr><tr><td>Num determinado período</td><td>Problema do período de referência</td></tr></table><p>O PIB é a riqueza criada no espaço geográfico de um país; se o cálculo for feito pela soma das vendas de produtos finais, tem de se <strong>subtrair a importação de consumos intermédios</strong>, pois esta não tem origem no espaço geográfico do país.</p>","keyTerms":[{"term":"Produto","def":"Riqueza criada num país num determinado período de tempo (um fluxo)."},{"term":"PIB","def":"Valor de mercado de todos os bens e serviços finais produzidos num país num determinado período."},{"term":"Óticas de medição","def":"Produção (saída das empresas), despesa (utilizadores finais) e rendimento (mercado de fatores)."},{"term":"Dupla contagem","def":"Erro de contar bens intermédios e finais; evita-se considerando só bens e serviços finais."},{"term":"Fluxo vs. stock","def":"Fluxo mede-se num período (ex.: produto anual); stock mede-se num momento (ex.: riqueza acumulada)."}],"questions":[{"q":"Na definição de PIB, a referência a «bens e serviços finais» destina-se a resolver o problema:","options":["Da localização geográfica","Da dupla contagem","Da agregação e valorização","Do período de referência"],"answer":1,"explanation":"Contar apenas bens finais evita contar duas vezes o valor dos bens intermédios. A localização associa-se a «num país»; a valorização a «valor de mercado»; o período a «num determinado período».","id":"q17vac7g"},{"q":"No circuito económico simplificado, medir o produto no lado do mercado dos fatores corresponde à:","options":["Ótica do rendimento","Ótica da despesa","Ótica da produção","Ótica do stock"],"answer":0,"explanation":"No mercado de fatores mede-se o rendimento recebido pelas famílias (ótica do rendimento). À saída das empresas é a ótica da produção e junto dos utilizadores finais a ótica da despesa.","id":"q1chnxsc"}],"key":"u5-5.2"},{"id":"5.2","title":"Produto nominal e produto real; deflator do PIB","pages":[111,117],"summary":"<h4>Definições</h4><ul><li><strong>Produto nominal (a preços correntes)</strong>: valorização da riqueza criada com os preços de cada ano (ex.: PIB de 2011 a preços de 2011 e PIB de 2012 a preços de 2012). Se os preços sobem, o valor sobe mesmo com as mesmas quantidades.</li><li><strong>Produto real (a preços constantes, ou em volume)</strong>: valorização sempre com os mesmos preços (ex.: PIB de 2011 e de 2012 ambos a preços de 2011). As alterações devem-se às quantidades – daí «real» (o fundamental são os bens) ou «em volume» (estão em causa quantidades). Os preços usados não têm de ser os do ano anterior; têm é de ser do mesmo ano para quantidades de anos diferentes.</li></ul><h4>Exemplo com dois bens (PIB = p<sub>1</sub>q<sub>1</sub> + p<sub>2</sub>q<sub>2</sub>)</h4><table><tr><th>Ano</th><th>p<sub>1</sub></th><th>q<sub>1</sub></th><th>p<sub>1</sub>q<sub>1</sub></th><th>p<sub>2</sub></th><th>q<sub>2</sub></th><th>p<sub>2</sub>q<sub>2</sub></th><th>PIB</th></tr><tr><td colspan='8'>A preços correntes</td></tr><tr><td>2011</td><td>2</td><td>4</td><td>8</td><td>10</td><td>16</td><td>160</td><td>168</td></tr><tr><td>2012</td><td>3</td><td>5</td><td>15</td><td>12</td><td>20</td><td>240</td><td>255</td></tr><tr><td colspan='8'>A preços constantes de 2011</td></tr><tr><td>2011</td><td>2</td><td>4</td><td>8</td><td>10</td><td>16</td><td>160</td><td>168</td></tr><tr><td>2012</td><td>2</td><td>5</td><td>10</td><td>10</td><td>20</td><td>200</td><td>210</td></tr></table><h4>Taxa de variação</h4><p>Taxa de variação = (acréscimo / valor de partida) × 100. Ex.: de 200 para 230 → (30/200)×100 = <strong>15%</strong>.</p><ul><li>Variação do <strong>PIB nominal</strong>: PIB de anos diferentes a preços correntes. 2011→2012: (255−168)/168 × 100 = <strong>51,88%</strong>.</li><li>Variação do <strong>PIB real</strong>: PIB de anos diferentes a preços de um mesmo ano. (210−168)/168 × 100 = <strong>25,0%</strong>.</li><li>Variação dos <strong>preços</strong>: PIB de um mesmo ano a preços de anos diferentes. (255−210)/210 × 100 = <strong>21,4%</strong>.</li></ul><p>O valor da produção pode aumentar devido ao volume, aos preços, ou a ambos.</p><h4>Deflator do PIB</h4><p>Índice de crescimento dos preços dos bens do PIB = PIB nominal / PIB real = 255/210 = <strong>1,214</strong> (sem ser em %). É o <strong>deflator do PIB</strong>: crescimento/diminuição do produto que se deveu à variação dos preços. Note-se 255 = 1,214 × 210.</p><p><strong>Notas</strong>: a inflação tem a ver com o crescimento dos preços, mas nem todo o crescimento dos preços é inflação. A inflação, no sentido perfeito, dá-se quando os preços variam todos proporcionalmente; nesse caso o produto real não se altera. A economia agregada não consegue abordar variações do valor do produto devidas a alterações dos <strong>preços relativos</strong>.</p><h4>Exemplo da economia portuguesa (milhões de euros)</h4><table><tr><th>Ano</th><th>Preços correntes</th><th>Preços do ano anterior</th></tr><tr><td>1998</td><td>100 962</td><td>–</td></tr><tr><td>1999</td><td>108 030</td><td>104 800</td></tr><tr><td>2000</td><td>115 548</td><td>111 680</td></tr><tr><td>2001</td><td>122 801</td><td>117 587</td></tr></table><p>Notação: PIB<sub>2001</sub><sup>P2001</sup> = PIB do ano 2001 a preços de 2001.</p><ul><li>Variação nominal 2000→2001: (122 801 − 115 548)/115 548 × 100 = <strong>6,28%</strong>.</li><li>Variação real 2000→2001 (ambos a preços de 2000): (117 587 − 115 548)/115 548 × 100 = <strong>1,76%</strong>.</li><li>Deflator do PIB de 2001 (base ano anterior): 122 801 / 117 587 ≈ <strong>1,044</strong> (preços subiram cerca de 4,4%).</li></ul>\n<h4>Dados de partida (PIB de Portugal, milhões de euros)</h4><table><tr><th>Ano</th><th>Preços correntes</th><th>Preços do ano anterior</th></tr><tr><td>1998</td><td>100 962</td><td>–</td></tr><tr><td>1999</td><td>108 030</td><td>104 800</td></tr><tr><td>2000</td><td>115 548</td><td>111 680</td></tr><tr><td>2001</td><td>122 801</td><td>117 587</td></tr></table><p>O PIB de 2001 a <strong>preços correntes</strong> (preços de 2001) é 122 801; o mesmo PIB de 2001 avaliado a <strong>preços do ano anterior</strong> (preços de 2000) é 117 587. Como as quantidades são as mesmas (as de 2001), a diferença entre os dois valores deve-se <strong>apenas aos preços</strong>.</p><h4>Taxa de variação dos preços entre 2000 e 2001</h4><p>(PIB<sub>2001</sub><sup>P2001</sup> − PIB<sub>2001</sub><sup>P2000</sup>) / PIB<sub>2001</sub><sup>P2000</sup> × 100 = (122 801 − 117 587) / 117 587 × 100 = <strong>4,434%</strong></p><p>Indica quanto subiram, em percentagem, os preços de todos os bens que integram o PIB, de 2000 para 2001.</p><h4>Deflator do PIB para 2001</h4><p>Deflator = PIB<sub>2001</sub><sup>P2001</sup> / PIB<sub>2001</sub><sup>P2000</sup> = 122 801 / 117 587 = <strong>1,04434</strong></p><p>Também mostra como subiram os preços de todos os bens do PIB de 2000 para 2001, mas numa <strong>lógica multiplicativa</strong>: PIB<sub>2001</sub><sup>P2001</sup> = 1,04434 × PIB<sub>2001</sub><sup>P2000</sup>.</p><p><strong>Nota:</strong> o deflator pode ser indicado em percentagem (subida de preços de 4,434%), mas é mais usual trabalhá-lo como <strong>fator multiplicativo</strong> (1,04434).</p>","keyTerms":[{"term":"Produto nominal (preços correntes)","def":"Valor da produção de cada ano avaliado aos preços desse mesmo ano."},{"term":"Produto real (preços constantes / em volume)","def":"Valor da produção de anos diferentes avaliado aos preços de um mesmo ano; reflete variações de quantidades."},{"term":"Taxa de variação","def":"(Valor final − valor de partida) / valor de partida × 100."},{"term":"Deflator do PIB","def":"PIB nominal / PIB real; índice da parte da variação do produto devida à variação dos preços."},{"term":"Inflação (sentido perfeito)","def":"Variação proporcional de todos os preços, que deixa o produto real inalterado."},{"term":"PIB a preços do ano anterior","def":"Valor das quantidades produzidas num ano avaliadas aos preços do ano precedente; permite isolar o efeito das quantidades (variação real)."}],"questions":[{"q":"Uma grandeza passa de 200 para 230. A sua taxa de variação é:","options":["13,0%","30%","15%","1,15%"],"answer":2,"explanation":"(230−200)/200 × 100 = 15%. 13% resultaria de dividir por 230 (valor final), erro comum; 30 é o acréscimo absoluto; 1,15 é o índice, não a taxa.","id":"q19fvv2r"},{"q":"Com PIB 2011 = 168 (preços correntes), PIB 2012 = 255 (preços correntes) e PIB 2012 = 210 (preços de 2011), o deflator do PIB de 2012 e o crescimento real são, respetivamente:","options":["1,518 e 51,88%","1,214 e 25,0%","1,25 e 21,4%","1,214 e 51,88%"],"answer":1,"explanation":"Deflator = 255/210 = 1,214; crescimento real = (210−168)/168 = 25,0%. 51,88% é o crescimento nominal e 21,4% o crescimento dos preços.","id":"q18ekyfj"},{"q":"PIB português: 2000 = 115 548 (preços correntes); 2001 = 122 801 (preços correntes) e 117 587 (preços de 2000). A taxa de crescimento real de 2000 para 2001 foi:","options":["6,28%","4,43%","1,76%","6,17%"],"answer":2,"explanation":"Real: (117 587 − 115 548)/115 548 × 100 = 1,76%. 6,28% é o crescimento nominal; 4,43% é a variação dos preços (deflator 1,044).","id":"q6uc9z4"},{"q":"Para medir a variação dos preços a partir do PIB, usa-se:","options":["O PIB de anos diferentes, cada um a preços do seu ano","O PIB de anos diferentes a preços de um mesmo ano","O PIB de um mesmo ano medido a preços de anos diferentes","Apenas o PIB nominal do ano mais recente"],"answer":2,"explanation":"Fixando as quantidades (o mesmo ano) e variando os preços isola-se o efeito-preço. A primeira opção mede a variação nominal; a segunda mede a variação real.","id":"qvi91ja"},{"q":"Em 2001 o PIB português foi de 122 801 M€ a preços correntes e de 117 587 M€ a preços de 2000. Qual o deflator do PIB de 2001 (base: ano anterior)?","options":["1,04434","4,434","0,95754","0,04434"],"answer":0,"explanation":"Deflator = PIB a preços correntes / PIB a preços do ano anterior = 122 801 / 117 587 = 1,04434. O valor 4,434 é a taxa de variação dos preços em percentagem (lógica aditiva), não o fator multiplicativo; 0,95754 é o rácio invertido.","id":"q1i330a7"}],"key":"u5-5.2-2"},{"id":"5.2","title":"5.2.3 O circuito económico completo e óticas de medir o produto","pages":[118,124],"summary":"<h4>O circuito económico completo</h4><p>O circuito diz-se <strong>completo</strong> (por oposição ao simplificado) quando considera também o <strong>Governo</strong>, o <strong>Resto do Mundo</strong> e os <strong>Mercados Financeiros</strong>. Permite visualizar e analisar todos os fluxos de uma economia verdadeira (ex.: a portuguesa).</p><p>Das três óticas de medição do produto (produção, despesa e rendimento), este circuito ilustra só duas: a da <strong>despesa</strong> e a do <strong>rendimento</strong>. Acrescenta ainda um outro mercado — o das <strong>poupanças ou mercados financeiros</strong> — que dá outra perspetiva de análise.</p><h4>Notação</h4><ul><li><strong>C</strong> – consumo das famílias</li><li><strong>I</strong> – investimento das empresas</li><li><strong>G</strong> – despesas do Governo em bens e serviços</li><li><strong>X − M</strong> – exportações − importações (exportações líquidas)</li><li><strong>Y</strong> – rendimento das famílias (recebido das empresas; salários, rendas, juros e lucros)</li><li><strong>S</strong> – poupança das famílias</li><li><strong>T</strong> – impostos líquidos (impostos − subsídios)</li></ul><h4>As duas identidades</h4><ul><li><strong>Y = C + I + G + (X − M)</strong> — o produto é o mesmo sob a forma de rendimento e sob a forma de despesa (ótica da despesa).</li><li><strong>Y = C + S + T</strong> — o produto recebido como rendimento é usado em consumo, poupança e impostos (ótica da utilização do rendimento).</li></ul><h4>Os fluxos (só monetários) — leitura do diagrama (Parkin, 2008)</h4><p>Agentes: Famílias, Empresas, Governo, Resto do Mundo; mercados: dos fatores, dos bens e financeiros.</p><ul><li><strong>Rendimento:</strong> as empresas pagam Y no mercado dos fatores, que chega às famílias (salários, rendas, juros, lucros).</li><li><strong>Utilização do rendimento (Y = C + S + T):</strong> as famílias gastam C no mercado dos bens, pagam T ao Governo e canalizam S para os mercados financeiros.</li><li><strong>Despesa (Y = C + I + G + X − M):</strong> a despesa é feita junto das empresas pelos agentes que procuram os bens — famílias (C), empresas (I), Governo (G) e Resto do Mundo (X − M) — fluindo do mercado dos bens para as empresas.</li><li><strong>Mercados financeiros:</strong> recebem S das famílias; relacionam-se com o Governo (serviço da dívida pública), com o Resto do Mundo (empréstimos externos líquidos) e concedem empréstimos às empresas (que financiam I). <strong>Em termos líquidos, usualmente as famílias emprestam e as empresas pedem emprestado.</strong></li><li>Os fluxos com os mercados financeiros podem ter <strong>os dois sentidos</strong>.</li></ul><h4>Exemplo numérico (EUA, 2006, milhares de milhões de dólares)</h4><table><tr><th>Ótica da despesa</th><th></th><th>Utilização do rendimento</th><th></th></tr><tr><td>C</td><td>9 079</td><td>C</td><td>9 079</td></tr><tr><td>I</td><td>2 215</td><td>S</td><td>1 799</td></tr><tr><td>G</td><td>2 479</td><td>T</td><td>2 130</td></tr><tr><td>X − M</td><td>−765</td><td></td><td></td></tr><tr><td><strong>Y</strong></td><td><strong>13 008</strong></td><td><strong>Y</strong></td><td><strong>13 008</strong></td></tr></table><h4>O caso português</h4><p>No sentido dos fluxos financeiros que têm caracterizado Portugal: as famílias poupam (S) para os mercados financeiros; o Governo recorre aos mercados financeiros (serviço da dívida pública, ou seja, é devedor); o <strong>Resto do Mundo</strong> fornece fundos aos mercados financeiros (empréstimos externos líquidos — Portugal tem sido financiado pelo exterior); os mercados financeiros emprestam às empresas.</p>","keyTerms":[{"term":"Circuito económico completo","def":"Representação dos fluxos de uma economia que inclui famílias, empresas, Governo, Resto do Mundo e mercados (fatores, bens e financeiros)."},{"term":"Exportações líquidas (X − M)","def":"Diferença entre exportações e importações; componente da despesa."},{"term":"Impostos líquidos (T)","def":"Impostos menos subsídios."},{"term":"Y = C + S + T","def":"Identidade que mostra o rendimento repartido por consumo, poupança e impostos líquidos."},{"term":"Mercados financeiros","def":"Mercado das poupanças, onde as famílias (em termos líquidos) emprestam e as empresas, o Governo e/ou o exterior se financiam ou aplicam fundos."}],"questions":[{"q":"Numa economia, C = 9 079, I = 2 215, G = 2 479, S = 1 799 e T = 2 130. Qual o valor das exportações líquidas (X − M)?","options":["+765","−1 799","13 008","−765"],"answer":3,"explanation":"Pela utilização do rendimento, Y = C + S + T = 9 079 + 1 799 + 2 130 = 13 008. Pela despesa, X − M = Y − C − I − G = 13 008 − 9 079 − 2 215 − 2 479 = −765 (défice externo). O sinal positivo seria o erro de inverter a subtração.","id":"q11b651o"},{"q":"Segundo o circuito económico completo apresentado, qual a afirmação correta sobre os fluxos com os mercados financeiros?","options":["Em termos líquidos, as empresas emprestam e as famílias pedem emprestado.","Em termos líquidos, usualmente as famílias emprestam e as empresas pedem emprestado.","Os fluxos com os mercados financeiros têm um único sentido, das famílias para o Governo.","O Resto do Mundo não se relaciona com os mercados financeiros, só com o mercado dos bens."],"answer":1,"explanation":"A poupança (S) das famílias vai para os mercados financeiros, que concedem empréstimos às empresas para investir. Os fluxos podem ter os dois sentidos, e o Resto do Mundo participa através dos empréstimos externos líquidos.","id":"qtunwhl"}],"key":"u5-5.2-3"},{"id":"5.2","title":"5.2.4 PIB e PNB; PIL e PNL","pages":[125,127],"summary":"<h4>Critérios de cálculo</h4><ul><li><strong>PIB</strong> – critério <strong>geográfico</strong>: o PIB português é o produto criado no espaço geográfico do território de Portugal.</li><li><strong>PNB</strong> – critério de <strong>propriedade</strong> (na prática, de <strong>residência</strong>): o PNB português é o produto cuja propriedade é de portugueses, independentemente do local onde foi criado; na prática mede-se como o produto propriedade das pessoas que moram em Portugal.</li></ul><h4>Definições</h4><p><strong>PIB (Produto Interno Bruto; GDP – Gross Domestic Product):</strong> «É o valor de mercado de todos os bens e serviços finais produzidos num país num determinado período».</p><p><strong>PNB (Produto Nacional Bruto):</strong> «É o valor da riqueza criada que é propriedade dos residentes de um país». É o <strong>PIB mais os rendimentos líquidos do exterior</strong> (pelo que pode ser maior ou menor do que o PIB).</p><p><strong>PNB = PIB + REX</strong>, em que <strong>Rendimentos líquidos do exterior (REX)</strong> = rendimentos recebidos do exterior por serem propriedade de nacionais − rendimentos enviados para o exterior por serem propriedade de não nacionais (o critério acaba por assentar na residência). Com a <strong>globalização</strong> o PNB assume maior importância.</p><h4>Valores brutos e valores líquidos</h4><p>Passa-se do bruto ao líquido subtraindo as <strong>amortizações (A)</strong>, frequentemente chamadas <strong>depreciações</strong>:</p><ul><li><strong>PIB − A = PIL</strong> (Produto Interno Líquido)</li><li><strong>PNB − A = PNL</strong> (Produto Nacional Líquido)</li></ul><p>O PIL e o PNL são menos referidos nas contas nacionais.</p><p><strong>Exemplo:</strong> o PIB (produto novo criado) foi 1000 €, mas 200 € foram usados para reparar equipamento que já existia (mantendo o seu valor). Se nada se gastasse, 800 = 1000 − 200 era o que, em termos líquidos, efetivamente acrescia à riqueza acumulada nessa economia.</p>","keyTerms":[{"term":"PIB","def":"Valor de mercado de todos os bens e serviços finais produzidos num país num determinado período (critério geográfico)."},{"term":"PNB","def":"Valor da riqueza criada que é propriedade dos residentes de um país; PNB = PIB + rendimentos líquidos do exterior."},{"term":"Rendimentos líquidos do exterior (REX)","def":"Rendimentos recebidos do exterior por residentes menos rendimentos enviados ao exterior por pertencerem a não residentes."},{"term":"Amortizações (depreciações)","def":"Perda de valor do capital; diferença entre valores brutos e líquidos (PIB − A = PIL)."},{"term":"PIL / PNL","def":"Produto Interno Líquido (PIB − A) e Produto Nacional Líquido (PNB − A)."}],"questions":[{"q":"Uma empresa propriedade de residentes em Portugal obtém lucros numa fábrica situada em Espanha. Esses lucros:","options":["Entram no PIB português e no PNB espanhol.","Entram no PIB português e no PNB português.","Entram no PNB português, mas não no PIB português.","Não entram em nenhum agregado português por serem obtidos no exterior."],"answer":2,"explanation":"O PIB segue o critério geográfico (a produção é em Espanha, logo entra no PIB espanhol). O PNB segue a propriedade/residência: os lucros pertencem a residentes em Portugal, são rendimentos recebidos do exterior e entram no PNB português.","id":"q1oy6gcm"},{"q":"Num país, PIB = 4 800, rendimentos líquidos do exterior = 200 e amortizações = 600. Qual o Produto Nacional Líquido (PNL)?","options":["4 200","4 600","5 000","4 400"],"answer":3,"explanation":"PNB = PIB + REX = 4 800 + 200 = 5 000; PNL = PNB − A = 5 000 − 600 = 4 400. 4 200 é o PIL (PIB − A) e 5 000 é o PNB, não o valor líquido.","id":"q1a5jpja"}],"key":"u5-5.2-4"},{"id":"5.2","title":"5.2.5 Medição do produto: ótica da produção, ótica da despesa e ótica do rendimento","pages":[127,129],"summary":"<h4>Ótica da produção</h4><p><strong>(I) Método dos produtos finais:</strong> PIB = Vendas de produtos finais − Importação de consumos intermédios.</p><p><strong>(II) Método do valor acrescentado:</strong> PIB = VAB empresas + VAB Estado (VAB = valor acrescentado bruto).</p><ul><li>VAB empresas = Vendas totais − Consumos intermédios (para a agricultura, para a indústria e para os serviços).</li><li>VAB Estado = valor dos salários pagos aos funcionários públicos.</li></ul><p><em>Nota técnica:</em> com a ótica da produção obtém-se o <strong>PIB a custo de fatores</strong>.</p><h4>Ótica da despesa</h4><p><strong>DI = Despesa Interna: DI = PIB = C + I + G + X − M</strong></p><ul><li>C = consumo das famílias</li><li>I = investimento = <strong>FBCF + variação de stocks</strong></li><li>FBCF = formação bruta de capital fixo</li><li>G = gastos públicos; X = exportações; M = importações</li><li>X − M = balança de bens e serviços</li></ul><p><strong>DN = Despesa Nacional = PNB:</strong> DN = PNB = DI + REX (rendimentos líquidos do exterior).</p><p><em>Nota técnica:</em> com a ótica da despesa obtém-se o <strong>PIB a preços de mercado</strong>.</p><h4>Ótica do rendimento</h4><p><strong>RI = Rendimento Interno: RI = W + R + J + L</strong>; <strong>PIB = RI + A</strong></p><ul><li>W = salários (rendimento do trabalho); R = rendas; J = juros; L = lucros</li><li>A = amortizações (depreciação, perda de valor do capital)</li></ul><p><strong>RN = Rendimento Nacional:</strong> RN = RI + REX; <strong>RN + A = PNB</strong>.</p><p><em>Nota técnica:</em> com a ótica do rendimento obtém-se o <strong>PIL a custo de fatores</strong>; somando as amortizações fica-se com o PIB a custo de fatores.</p><table><tr><th>Ótica</th><th>Fórmula base</th><th>Resultado</th></tr><tr><td>Produção</td><td>Σ VAB (empresas + Estado)</td><td>PIB a custo de fatores</td></tr><tr><td>Despesa</td><td>C + I + G + X − M</td><td>PIB a preços de mercado</td></tr><tr><td>Rendimento</td><td>W + R + J + L (+ A)</td><td>PIL cf (PIB cf com A)</td></tr></table>","keyTerms":[{"term":"Valor acrescentado bruto (VAB)","def":"Vendas totais menos consumos intermédios; no Estado corresponde aos salários pagos aos funcionários públicos."},{"term":"Consumos intermédios","def":"Bens e serviços usados e incorporados na produção de outros bens; não se contam no PIB para evitar dupla contagem."},{"term":"FBCF","def":"Formação bruta de capital fixo; juntamente com a variação de stocks forma o investimento (I)."},{"term":"Despesa Interna (DI)","def":"DI = PIB = C + I + G + X − M."},{"term":"Despesa Nacional (DN)","def":"DN = PNB = DI + REX."},{"term":"Rendimento Interno (RI)","def":"RI = W + R + J + L; PIB = RI + A."},{"term":"Rendimento Nacional (RN)","def":"RN = RI + REX; RN + A = PNB."}],"questions":[{"q":"Segundo as notas técnicas das aulas, com a ótica do rendimento (W + R + J + L) obtém-se diretamente:","options":["O PIB a preços de mercado.","O PIL a custo de fatores.","O PNB a preços de mercado.","O PIB a custo de fatores, sem necessidade de qualquer ajustamento."],"answer":1,"explanation":"A soma de salários, rendas, juros e lucros dá o Rendimento Interno, que corresponde ao PIL a custo de fatores; somando as amortizações obtém-se o PIB a custo de fatores. O PIB a preços de mercado é o que se obtém pela ótica da despesa.","id":"q1nv4vqu"},{"q":"As empresas de um país têm vendas totais de 800 e consumos intermédios de 350; o Estado paga 120 de salários aos funcionários públicos. Pelo método do valor acrescentado, o PIB é:","options":["920","450","570","1 270"],"answer":2,"explanation":"VAB empresas = 800 − 350 = 450; VAB Estado = 120; PIB = 450 + 120 = 570. Somar as vendas totais (920) contaria em duplicado os consumos intermédios.","id":"q1lubwfy"}],"key":"u5-5.2-5"},{"id":"5.2","title":"5.2.6 Rendimento pessoal e rendimento disponível","pages":[130,131],"summary":"<h4>Rendimentos e transferências</h4><ul><li><strong>Rendimentos</strong> – remuneram os fatores produtivos (salários, rendas, juros, lucros).</li><li><strong>Transferências</strong> – movimentos de dinheiro que <strong>não</strong> têm a ver com o pagamento de fatores, como impostos, subsídios e ofertas.</li></ul><h4>Rendimento pessoal</h4><p>É composto pelos <strong>Rendimentos + Transferências</strong> (exceto impostos). As transferências incluem as <strong>remessas dos emigrantes</strong>.</p><h4>Rendimento disponível (das famílias)</h4><p><strong>Rendimento disponível = Rendimento pessoal − Impostos diretos e segurança social pagos pelas famílias.</strong></p><p>É o montante que as famílias têm disponível para as decisões de <strong>consumir e poupar</strong>.</p>","keyTerms":[{"term":"Transferências","def":"Movimentos de dinheiro que não remuneram fatores produtivos (impostos, subsídios, ofertas, remessas de emigrantes)."},{"term":"Rendimento pessoal","def":"Rendimentos + transferências recebidas (exceto impostos)."},{"term":"Rendimento disponível","def":"Rendimento pessoal menos impostos diretos e contribuições para a segurança social pagos pelas famílias; é repartido entre consumo e poupança."}],"questions":[{"q":"Qual das seguintes opções corresponde ao rendimento disponível das famílias?","options":["Salários + rendas + juros + lucros, sem quaisquer transferências.","PIB menos amortizações.","Rendimento pessoal mais impostos diretos.","Rendimento pessoal menos impostos diretos e contribuições para a segurança social pagos pelas famílias."],"answer":3,"explanation":"O rendimento disponível é o que sobra às famílias, depois de impostos diretos e segurança social, para consumir e poupar. A primeira opção ignora as transferências (por ex., remessas de emigrantes) e os impostos; PIB − A é o PIL.","id":"q12ycs7n"},{"q":"Qual dos seguintes fluxos é uma transferência e não um rendimento?","options":["Juros recebidos de um depósito bancário.","Remessa enviada por um emigrante à família em Portugal.","Renda recebida pelo aluguer de um terreno.","Salário pago a um trabalhador."],"answer":1,"explanation":"Rendimentos remuneram fatores produtivos (salários, rendas, juros, lucros). A remessa de um emigrante não paga nenhum fator ao destinatário; é uma transferência e entra no rendimento pessoal.","id":"qofg92v"}],"key":"u5-5.2-6"},{"id":"5.2","title":"5.2.7 Limitações do cálculo contabilístico do PIB","pages":[131,135],"summary":"<h4>O que são as limitações</h4><p>Conceptualmente, toda a riqueza criada deveria fazer parte do PIB. Mas isso não acontece, quer por <strong>erros na medição</strong>, quer porque há formas de riqueza criada que <strong>não são registadas</strong> pela contabilidade nacional. O PIB oficial pode estar <strong>sobrevalorizado ou subvalorizado</strong> face ao valor conceptual. Estas limitações podem também fazer com que o crescimento (ou diminuição) do PIB seja na realidade maior ou menor do que o calculado.</p><h4>Erros conceptuais no cálculo do PIB (segundo Parkin, 2008)</h4><ul><li><strong>Sobrestimação da inflação</strong> – conduz à <strong>subestimação do PIB real</strong>. Há evidência de sobreavaliação da inflação. Se a inflação for subavaliada, o PIB vem sobreavaliado.</li><li><strong>Produção das famílias para autoconsumo</strong> – não passa pelo mercado, logo não é registada; o PIB oficial é subavaliado.</li><li><strong>Economia subterrânea</strong> – bens produzidos não declarados (por questões de legalidade ou fuga ao fisco); o PIB oficial é subavaliado.</li><li><strong>Saúde e expectativa de vida</strong> – entre dois países com igual PIB, o que tem maior expectativa de vida tem conceptualmente um PIB mais alto.</li><li><strong>Tempo de lazer</strong> – idem: mais lazer, PIB conceptualmente mais alto.</li><li><strong>Qualidade do ambiente</strong> – idem.</li><li><strong>Liberdade política e justiça social</strong> – idem.</li></ul><h4>Exemplo: qualidade do ambiente (Diário Económico, 19/11/2007)</h4><p>O Banco Mundial estimou que a poluição atmosférica e hídrica custava à China <strong>5,8% do PIB</strong> (a atmosférica 3,8%), quando a economia crescia cerca de 11,4% (2007). Os custos sanitários e não sanitários atingiam cerca de 100 mil milhões de dólares/ano; 70% das reservas de água doce estavam poluídas. O primeiro-ministro Wen Jiabao considerou o crescimento «insustentável». Ilustra que o PIB contabilizado não desconta a degradação ambiental.</p>","keyTerms":[{"term":"Economia subterrânea","def":"Produção não declarada oficialmente (ilegalidade ou fuga ao fisco); leva à subavaliação do PIB oficial."},{"term":"Autoconsumo","def":"Produção das famílias para consumo próprio; não passa pelo mercado e não é registada no PIB."},{"term":"Sobrestimação da inflação","def":"Medir uma inflação superior à real faz subestimar o PIB real."}],"questions":[{"q":"Se o instituto de estatística sobrestimar a taxa de inflação, o que acontece ao PIB real calculado?","options":["Fica sobreavaliado.","Não é afetado, porque o PIB real não depende dos preços.","Fica subavaliado.","Fica subavaliado o PIB nominal, mas não o real."],"answer":2,"explanation":"O PIB real obtém-se retirando ao PIB nominal o efeito dos preços. Se a subida de preços for exagerada, retira-se demasiado e o PIB real fica subestimado. Seria sobreavaliado se a inflação fosse subavaliada.","id":"qbw6spi"},{"q":"Dois países têm o mesmo PIB, mas o país A tem maior expectativa de vida, mais tempo de lazer e melhor qualidade do ambiente. De acordo com as limitações do PIB estudadas:","options":["O país A tem conceptualmente um PIB mais alto do que o registado, face ao país B.","Os dois países têm exatamente o mesmo nível de riqueza criada.","O país B tem conceptualmente maior riqueza, por trabalhar mais horas.","Estes fatores já estão incluídos no PIB através da despesa em saúde."],"answer":0,"explanation":"Saúde e expectativa de vida, lazer, ambiente e liberdade são valorizados pelas pessoas mas não são registados pela contabilidade nacional. Entre dois países com igual PIB, o que os tem em maior grau tem conceptualmente um PIB mais alto.","id":"q1u8bdcs"}],"key":"u5-5.2-7"},{"id":"5.2","title":"5.2 Anexos: composição de G, ventilação das importações e PIB a preços de mercado vs. a custo de fatores","pages":[135,137],"summary":"<h4>Anexo 1 – Os gastos do Estado incluem despesas de natureza diferente</h4><p>Em DI = PIB = C + I + G + X − M, <strong>G</strong> engloba gastos de natureza diferente:</p><p><strong>G = G<sub>W</sub> + G<sub>C</sub> + G<sub>I</sub> + G<sub>O</sub></strong> — salários pagos aos funcionários (G<sub>W</sub>), consumo do Estado (G<sub>C</sub>), investimento do Estado (G<sub>I</sub>) e outras despesas (G<sub>O</sub>).</p><p>Importa perceber que o <strong>mesmo montante</strong> gasto pelo Estado pode ter <strong>impactos diferentes</strong> na economia consoante o tipo de gasto.</p><h4>Anexo 2 – A ventilação das importações pelas componentes da despesa</h4><p>C, I, G e X incluem quer produção interna quer importações; por isso, no fim da expressão subtrai-se M (está em causa um espaço geográfico). M inclui importações usadas em consumo, investimento, gastos públicos e até exportações:</p><p><strong>M = C<sub>M</sub> + I<sub>M</sub> + G<sub>M</sub> + X<sub>M</sub></strong>, logo <strong>DI = PIB = (C − C<sub>M</sub>) + (I − I<sub>M</sub>) + (G − G<sub>M</sub>) + (X − X<sub>M</sub>)</strong>.</p><p>Conclusão: quando o Governo promove o aumento de uma componente da despesa, isso só aumenta a riqueza nacional <strong>na parte que não corresponde a importações</strong>. Se as famílias aumentam o consumo e esse aumento for todo de consumo importado, a riqueza nacional criada não aumenta. O mesmo com exportações feitas inteiramente a partir de importações.</p><h4>Apêndice 1 – Preços de mercado e custo de fatores</h4><p>O produto medido pelas três óticas é sempre o mesmo, mas há uma diferença de valorização: o valor na ótica da despesa (o valor pago por quem faz a despesa) tem <strong>a mais os impostos indiretos</strong> (ex.: IVA) e <strong>a menos os subsídios</strong> (ex.: o Governo financia o leite de vaca para ficar mais barato).</p><p><strong>PIB<sub>pm</sub> = PIB<sub>cf</sub> − Subsídios às empresas + Impostos indiretos</strong></p><p><strong>Exemplo do leite:</strong> o valor acrescentado de um litro de leite pela empresa é 20 cêntimos — é o produto na ótica da produção (remunera os fatores: PIB<sub>cf</sub>) e na ótica do rendimento (distribuído em salários, rendas, juros e lucros). Com subsídio de 4 cêntimos/litro e IVA de 6% sobre o valor final, o preço de venda é deduzido do subsídio e aumentado do IVA: (20 − 4) × 1,06 = 16,96 cêntimos — valor a preços de mercado.</p>","keyTerms":[{"term":"PIB a preços de mercado (PIBpm)","def":"Valor pago pelos compradores; PIBpm = PIBcf − subsídios + impostos indiretos."},{"term":"PIB a custo de fatores (PIBcf)","def":"Valor que remunera os fatores produtivos (VAB); obtido pelas óticas da produção e do rendimento."},{"term":"Impostos indiretos","def":"Impostos sobre a despesa, como o IVA."},{"term":"Ventilação das importações","def":"Repartição de M pelas componentes da despesa: M = CM + IM + GM + XM."}],"questions":[{"q":"Numa economia, o PIB a custo de fatores é 1 000, os subsídios às empresas são 30 e os impostos indiretos são 150. O PIB a preços de mercado é:","options":["880","1 180","1 150","1 120"],"answer":3,"explanation":"PIBpm = PIBcf − subsídios + impostos indiretos = 1 000 − 30 + 150 = 1 120. 1 180 resulta de somar os subsídios em vez de os subtrair; 880 inverte os dois sinais.","id":"q1p062mo"},{"q":"O Governo estimula o consumo das famílias e este aumenta 500 M€, mas todo o aumento corresponde a bens importados. Segundo o Anexo 2, o efeito sobre o PIB é:","options":["Aumento de 500 M€, porque C faz parte do PIB.","Nulo, porque o aumento de C é compensado por igual aumento de M (C − CM não varia).","Aumento de 1 000 M€, porque o consumo e as importações se somam.","Diminuição de 500 M€, porque as importações entram com sinal negativo."],"answer":1,"explanation":"PIB = (C − CM) + (I − IM) + (G − GM) + (X − XM). Se todo o aumento de C é importado, CM sobe o mesmo e (C − CM) não muda: a riqueza nacional criada não aumenta. O erro tentador é considerar apenas a subida de C.","id":"q1m2rmg1"}],"key":"u5-5.2-8"},{"id":"5.3","title":"5.3.1 Evolução do PIB e do PIB per capita em Portugal","pages":[137,143],"summary":"<h4>Tendência de crescimento com flutuações</h4><p>Na generalidade das economias verifica-se uma <strong>tendência de crescimento económico</strong>, mas esse crescimento verifica-se <strong>com flutuações</strong>, que podem abranger períodos mais longos ou mais curtos e ser mais ou menos acentuadas. As flutuações abrangem diversos agregados: o PIB e as suas componentes, o emprego, as transações com o exterior e a inflação.</p><p>As flutuações do PIB estão associadas a desequilíbrios e criam desequilíbrios. As funções económicas do Estado relacionam-se com estes desequilíbrios e com o seu impacto nos conflitos <strong>«eficiência-equidade»</strong> e <strong>«desenvolvimento-estabilidade»</strong>.</p><h4>O «santo graal» da macroeconomia</h4><p>Como manter as economias a crescer, criando cada vez mais riqueza e melhores condições de vida, <strong>sem os problemas dos ciclos económicos</strong>, incluindo recessões e depressões.</p><h4>Dados de Portugal (preços constantes, PORDATA/INE, base 2016)</h4><table><tr><th></th><th>1960</th><th>2023 (Pre)</th></tr><tr><td>PIB (milhões de euros)</td><td>41 348,6</td><td>215 929,0</td></tr><tr><td>PIB per capita (euros)</td><td>4 664,2</td><td>20 412,7</td></tr></table><p>O PIB real multiplicou-se por cerca de 5,2 e o PIB per capita por cerca de 4,4 (a população também cresceu).</p><h4>Gráfico do PIB e PIB per capita (1960-2023)</h4><p>Duas séries a preços constantes (eixo esquerdo: PIB per capita em euros; eixo direito: PIB em milhões). Ambas mostram uma <strong>tendência de crescimento</strong> de longo prazo, com quebras visíveis: meados dos anos 70 (1974-75), 1983-84, 1993, 2009, 2011-2013 (crise das dívidas soberanas/assistência financeira) e 2020 (pandemia), seguida de recuperação em 2021-2023. Conclusão: «Na economia portuguesa há uma tendência de crescimento do PIB e do PIB per capita».</p><h4>Taxas de crescimento do PIB e do PIB per capita (1961-2023)</h4><p>As taxas anuais oscilam muito: valores próximos de 9-10% no início dos anos 60 e 1972-73; queda forte em 1975 (PIB ≈ −3%, per capita ≈ −7%, com o regresso de população das ex-colónias); negativas em 1984, 1993, 2003, 2009, 2011-2012 (≈ −4%) e o mínimo em 2020 (≈ −8%); recuperação em 2021-2022 (≈ 6-7%). Conclusão: <strong>o crescimento do PIB e do PIB per capita tem ocorrido com flutuações</strong>. As duas séries são muito paralelas; pretende-se pôr em destaque esse paralelismo entre o gráfico dos níveis e o das taxas, e as flutuações da economia.</p>","keyTerms":[{"term":"Tendência de crescimento","def":"Evolução de longo prazo do PIB no sentido do aumento, em torno da qual ocorrem flutuações."},{"term":"Flutuações económicas","def":"Oscilações do PIB e de outros agregados em torno da tendência, mais longas ou mais curtas, mais ou menos acentuadas."},{"term":"PIB per capita","def":"PIB dividido pela população; aproximação ao nível de vida médio."}],"questions":[{"q":"Segundo os dados apresentados, o PIB per capita português a preços constantes passou de cerca de 4 664 € (1960) para cerca de 20 413 € (2023). O que ilustram os gráficos de níveis e de taxas de crescimento?","options":["Crescimento constante, sem anos de variação negativa.","Estagnação de longo prazo com flutuações em torno de um nível fixo.","Tendência de crescimento de longo prazo acompanhada de flutuações, incluindo anos de recessão.","Crescimento do PIB mas diminuição do PIB per capita, devido ao aumento da população."],"answer":2,"explanation":"O PIB e o PIB per capita mais do que quadruplicaram, mostrando a tendência de crescimento, mas as taxas anuais oscilam e foram negativas em vários anos (1975, 1993, 2009, 2011-12, 2020). Os dois indicadores evoluem em paralelo.","id":"q950ymb"}],"key":"u5-5.3"},{"id":"5.3","title":"5.3.2 Flutuações no PIB e nas suas componentes: taxas de variação e o caso português","pages":[144,152],"summary":"<p>Verificam-se <strong>flutuações mais alargadas</strong> (vários anos) e <strong>flutuações com ciclos mais curtos</strong>, nomeadamente trimestrais. As causas e interpretações podem diferir, mas o primeiro passo é constatar que se verificam. Usa-se informação das contas nacionais, publicada periodicamente.</p><h4>1) Taxa de variação (ou de crescimento) de uma grandeza</h4><p><strong>Taxa de variação = acréscimo (variação) / valor de partida × 100</strong></p><p>Ex.: de 200 para 230 → (230 − 200)/200 × 100 = 30/200 × 100 = <strong>15%</strong>. A taxa de juro e a taxa de inflação também são taxas de variação de uma grandeza.</p><h4>2) Taxa de variação anual</h4><p>De um ano para o ano consecutivo; o valor de partida é o do ano anterior. Ex.: PIB de Portugal (preços constantes de 2016): 211 154,3 M€ (2022) e 215 969,7 M€ (2023): (215 969,7 − 211 154,3)/211 154,3 × 100 = 4 815,4/211 154,3 × 100 ≈ <strong>2,28%</strong>.</p><h4>3) Taxa de variação trimestral</h4><p>De um trimestre para o trimestre consecutivo. PIB 2023 (M€, preços de 2016): T1 53 902,6; T2 53 949,9; T3 53 844,1; T4 54 273,0; total 215 969,7. Do 3.º para o 4.º trimestre: (54 273,0 − 53 844,1)/53 844,1 × 100 = 428,9/53 844,1 × 100 ≈ <strong>0,80%</strong>.</p><h4>4) Taxa de variação homóloga</h4><p>Entre dois momentos com nomes iguais, separados de um ano (no PIB, interessa a homóloga trimestral). PIB 2022: T1 52 569,7; T2 52 599,7; T3 52 858,1; T4 53 126,8 (total 211 154,3). Do T3 2022 para o T3 2023: (53 844,1 − 52 858,1)/52 858,1 × 100 = 986/52 858,1 × 100 ≈ <strong>1,87%</strong>. O valor de partida é o PIB do T3 do ano anterior.</p><h4>5) Taxa de variação em cadeia</h4><p>Mais do que dois períodos sucessivos; a taxa de cada período usa como base o período anterior. Ex.: 500, 600, 660, 759 → 1→2: 100/500 = <strong>20%</strong>; 2→3: 60/600 = <strong>10%</strong>; 3→4: 99/660 = <strong>15%</strong>. Exemplo real: PIB anual de Portugal 2001-2023 em cadeia (ex.: 2009 −3,1%; 2011 −1,7%; 2012 −4,1%; 2013 −0,9%; 2020 −8,3%; 2021 5,7%; 2022 6,8%; 2023 2,3%).</p><h4>Flutuações nos dados anuais: PIB e procura interna (1973-2023)</h4><ul><li><strong>C + I + G + X − M</strong> = procura total (PIB na ótica da despesa)</li><li><strong>C + I + G</strong> = procura interna</li><li><strong>X − M</strong> = procura externa líquida</li></ul><p>O gráfico (taxa de variação anual, dados encadeados em volume) mostra a procura interna a flutuar ainda mais do que o PIB (ex.: quedas fortes em 1975, 1983-84, 2011-2012, 2020; subidas de ~11% em 1986-87), mas no mesmo sentido.</p><h4>Flutuações nos dados trimestrais (2013-2023, taxa homóloga)</h4><ul><li><strong>PIB e procura interna:</strong> crescimento moderado (~2-3%) de 2014 a 2019; queda abrupta em 2020 (pandemia, ≈ −14 a −17% no T2) e salto em 2021 (≈ +16%), seguido de normalização.</li><li><strong>Consumo final das famílias:</strong> o total e sobretudo a despesa em <strong>bens duradouros</strong> (escala própria, oscilando entre ≈ −30% e +40%) flutuam muito mais.</li><li><strong>Investimento:</strong> construção e outras máquinas e equipamentos com flutuações acentuadas (investimento muito volátil).</li><li><strong>VAB:</strong> indústria, construção e comércio/alojamento/restauração — a restauração e alojamento caíram fortemente em 2020 e subiram muito em 2021-2022.</li></ul><p>Alinhando os gráficos do PIB, do consumo e do investimento, verifica-se um <strong>padrão de flutuação semelhante</strong> em todos os agregados macroeconómicos.</p>","keyTerms":[{"term":"Taxa de variação","def":"(valor final − valor inicial)/valor inicial × 100."},{"term":"Taxa de variação anual","def":"Variação de um ano para o ano consecutivo."},{"term":"Taxa de variação trimestral","def":"Variação de um trimestre para o trimestre consecutivo."},{"term":"Taxa de variação homóloga","def":"Variação entre dois períodos com o mesmo nome separados de um ano (ex.: T3 2022 → T3 2023)."},{"term":"Taxa de variação em cadeia","def":"Sequência de taxas para mais de dois períodos sucessivos, cada uma com base no período anterior."},{"term":"Procura interna","def":"C + I + G."},{"term":"Procura externa líquida","def":"X − M."}],"questions":[{"q":"O PIB português foi de 52 858,1 M€ no 3.º trimestre de 2022 e de 53 844,1 M€ no 3.º trimestre de 2023. A taxa calculada entre estes dois valores (≈ 1,87%) é uma taxa de variação:","options":["Trimestral.","Anual.","Homóloga.","Média dos últimos 12 meses."],"answer":2,"explanation":"Compara dois períodos com o mesmo nome (3.º trimestre) separados de um ano: é a taxa homóloga. A taxa trimestral compararia trimestres consecutivos (ex.: T3 → T4 de 2023, ≈ 0,80%).","id":"q1gro6gn"},{"q":"Uma grandeza assume, em quatro períodos consecutivos, os valores 500, 600, 660 e 759. Qual a taxa de variação entre o período 1 e o período 4?","options":["51,8%","45%","15%","25,9%"],"answer":0,"explanation":"(759 − 500)/500 × 100 = 51,8%. As taxas em cadeia são 20%, 10% e 15%, mas não se somam (45%) porque cada uma tem um valor de partida diferente; compõem-se: 1,20 × 1,10 × 1,15 = 1,518.","id":"q1w7s73g"},{"q":"Na decomposição apresentada da procura, a expressão C + I + G designa:","options":["A procura total (PIB na ótica da despesa).","A procura externa líquida.","O rendimento disponível.","A procura interna."],"answer":3,"explanation":"C + I + G é a procura interna; acrescentando X − M (procura externa líquida) obtém-se a procura total, que é o PIB na ótica da despesa.","id":"qygdnyo"},{"q":"O PIB português foi de 53 844,1 M€ no 3.º trimestre e de 54 273,0 M€ no 4.º trimestre de 2023. A taxa de variação trimestral é aproximadamente:","options":["0,79%","0,80%","1,87%","2,28%"],"answer":1,"explanation":"(54 273,0 − 53 844,1)/53 844,1 × 100 = 428,9/53 844,1 × 100 ≈ 0,80%. Dividir pelo valor final (54 273,0) daria ≈ 0,79%, o que é errado porque a base é o valor de partida; 1,87% é a homóloga e 2,28% a anual.","id":"q1hstboe"}],"key":"u5-5.3-2"},{"id":"5.3","title":"5.3.3 e 5.3.4 Flutuações do PIB, desequilíbrios macroeconómicos e causas das flutuações","pages":[152,157],"summary":"<h4>5.3.3 Flutuações e desequilíbrios macroeconómicos</h4><p>O desequilíbrio macroeconómico é <strong>tanto mais acentuado quanto mais a flutuação se afasta da linha de tendência</strong> da evolução da economia. Esse desequilíbrio manifesta-se: no <strong>PIB</strong>, nos <strong>preços</strong>, no <strong>emprego</strong>, nas <strong>contas externas</strong> do país, nas <strong>contas do Sector Público</strong>, … As funções económicas do Estado estão relacionadas com estes desequilíbrios e o seu impacto nos conflitos «eficiência-equidade» e «desenvolvimento-estabilidade».</p><h4>5.3.4 O que causa as flutuações da economia</h4><p>Há flutuações com ciclos de muitos anos e flutuações mais curtas (trimestrais). As causas e interpretações podem diferir, mas o primeiro passo é constatar que se verificam e que <strong>estiveram sempre presentes ao longo da história</strong>. As flutuações são uma das principais razões para a <strong>intervenção do Governo</strong> (prevenir as flutuações ou fazer face às suas consequências negativas). Conhecer as causas ajuda a prevenir e enfrentar os efeitos; é um tópico longe de estar fechado.</p><h4>Flutuações endógenas e exógenas</h4><ul><li><strong>Endógenas</strong> – é o próprio funcionamento da economia (nomeadamente dos mercados) que leva às flutuações. Ex.: flutuações associadas à <strong>inovação tecnológica</strong>.</li><li><strong>Exógenas</strong> – a causa é externa à economia (às decisões dos agentes com finalidade económica). Ex.: <strong>catástrofes naturais</strong>, incluindo epidemias.</li><li>As <strong>guerras</strong> podem ser causa exógena, mas frequentemente têm motivação económica e, nessa perspetiva, podem ser causa económica.</li><li>Grandes catástrofes são fáceis de detetar; por isso, mais problemáticas e pertinentes para compreender são as flutuações que ocorrem <strong>com mais regularidade</strong>.</li><li>As flutuações <strong>sazonais</strong> são de fácil compreensão e previsão, não sendo problemáticas.</li></ul><h4>Flutuações com origem nos mercados de bens</h4><p>Desencontro entre oferta e procura de bens: com <strong>excesso de oferta</strong> há empresas que vão à falência e a atividade baixa. O excesso pode ser de produtos com tecnologia atual ou de produtos obsoletos/que satisfazem necessidades que deixaram de se fazer sentir. Na expansão, as empresas aumentam a produção esperando vender, até se alcançar <strong>sobreprodução e subconsumo</strong>: os preços caem, as empresas não cobrem custos e a atividade decresce. Têm consequências nos mercados financeiros e vice-versa.</p><h4>Flutuações com origem nos mercados financeiros</h4><p>Ex.: na expansão, muitas empresas endividam-se para aumentar a produção; depois, com a descida dos preços (pelo aumento da produção), não conseguem pagar as dívidas e vão à falência. Têm consequências nos mercados de bens e vice-versa.</p><h4>Relações entre as economias</h4><p>Através de exportações e importações, as flutuações de umas economias afetam as outras. Os <strong>países pequenos e com muitas relações com o exterior</strong> estão mais sujeitos a essas flutuações.</p><h4>Investir em função do «stock» como causa de flutuações — exemplos</h4><ul><li><strong>Construção:</strong> as crises são muitas vezes precedidas de aumento do investimento em construção pública e civil; o setor da construção é mais causa do que efeito das crises, porque se dimensiona para as necessidades em termos de <strong>stock</strong> e não de <strong>fluxo</strong>. Ex.: para suprir rapidamente a falta de habitações, instala-se grande capacidade; satisfeitas as necessidades, a nova necessidade (fluxo) = casas necessárias − casas já construídas, muito menor → capacidade sobredimensionada.</li><li><strong>Investimentos que seguem o ciclo político:</strong> os políticos querem mostrar obra antes das eleições; obras que poderiam ser feitas num período alargado concentram-se num período curto, exigindo maior capacidade; concluídas, há excesso de capacidade e instala-se uma crise.</li><li><strong>Falta de profissionais num setor:</strong> faltavam enfermeiros em Portugal; o Governo aumentou a capacidade das escolas de enfermagem; satisfeito o stock, passou a haver excesso de formação e aumentou o número de enfermeiros desempregados.</li><li><strong>Recuperar de catástrofes naturais e da guerra:</strong> os meios dimensionam-se para a recuperação; feita esta (satisfeito o stock), só é preciso satisfazer o fluxo, menor → excesso de meios materiais e humanos → fase decrescente do ciclo.</li></ul><h4>Anexo – José interpreta o sonho do faraó (Génesis 41, 25-36)</h4><p>Sete vacas gordas/espigas cheias = sete anos de abundância; sete vacas magras/espigas ressequidas = sete anos de fome. José aconselha a nomear comissários, cobrar <strong>um quinto</strong> das colheitas nos anos de abundância e armazenar víveres como reserva para os anos de fome. Ilustra que as flutuações sempre existiram e uma <strong>política de estabilização</strong> (poupar na fase alta para a fase baixa).</p>","keyTerms":[{"term":"Desequilíbrio macroeconómico","def":"Afastamento da economia face à sua linha de tendência; manifesta-se no PIB, preços, emprego, contas externas e contas públicas."},{"term":"Flutuações endógenas","def":"Causadas pelo próprio funcionamento da economia/mercados (ex.: inovação tecnológica)."},{"term":"Flutuações exógenas","def":"Causadas por fatores externos às decisões económicas (ex.: catástrofes naturais, epidemias)."},{"term":"Flutuações sazonais","def":"Oscilações regulares e previsíveis ao longo do ano; pouco problemáticas."},{"term":"Stock vs. fluxo","def":"Dimensionar a capacidade para satisfazer necessidades acumuladas (stock) cria excesso de capacidade quando só resta satisfazer as necessidades correntes (fluxo)."}],"questions":[{"q":"De acordo com a classificação estudada, as flutuações associadas à inovação tecnológica e as associadas a uma epidemia são, respetivamente:","options":["Exógenas e endógenas.","Endógenas e exógenas.","Ambas endógenas.","Sazonais e exógenas."],"answer":1,"explanation":"A inovação tecnológica resulta do próprio funcionamento da economia (endógena). As catástrofes naturais, incluindo epidemias, são externas às decisões económicas (exógenas).","id":"q20jnyc"},{"q":"Porque é que, segundo as aulas, o setor da construção tende a ser mais causa do que efeito das crises?","options":["Porque a construção é sempre financiada pelo Estado.","Porque a construção depende apenas da taxa de juro externa.","Porque o setor se dimensiona para as necessidades em termos de stock e não de fluxo, ficando sobredimensionado quando o stock está satisfeito.","Porque a construção não é contabilizada no investimento (FBCF)."],"answer":2,"explanation":"Quando se pretende suprir rapidamente uma falta acumulada (stock), instala-se muita capacidade; satisfeita essa falta, a necessidade passa a ser só o fluxo, menor, gerando excesso de capacidade e uma fase decrescente do ciclo.","id":"q131ort9"},{"q":"Qual das seguintes afirmações sobre os desequilíbrios macroeconómicos está de acordo com os slides?","options":["O desequilíbrio é tanto mais acentuado quanto mais a flutuação se afasta da linha de tendência.","Os desequilíbrios manifestam-se apenas no PIB.","As flutuações sazonais são a principal fonte de desequilíbrios difíceis de prever.","Os países pequenos e muito abertos estão menos sujeitos às flutuações externas."],"answer":0,"explanation":"O desequilíbrio mede-se pelo afastamento face à tendência e manifesta-se no PIB, preços, emprego, contas externas e contas públicas. As sazonais são fáceis de prever, e os países pequenos e abertos estão mais expostos.","id":"q147b967"}],"key":"u5-5.3-3"},{"id":"5.4","title":"5.4 Monitorização do emprego e do desemprego","pages":[157,163],"summary":"<h4>5.4.1 Flutuações no emprego e no desemprego (Portugal, 2013-2023)</h4><ul><li>A <strong>taxa de variação anual da população empregada</strong> foi positiva (≈ 2-3,5%) entre 2014 e 2019 e em 2021-2023, e negativa em 2020 (≈ −2%).</li><li>A <strong>taxa de variação anual da população desempregada</strong> foi fortemente negativa entre 2014 e 2018 (até ≈ −20%), positiva em 2020 e 2023.</li><li>Deve observar-se a evolução em <strong>sentido contrário</strong> do emprego e do desemprego.</li><li>Comparando com o PIB: a evolução do <strong>PIB e do emprego dá-se no mesmo sentido</strong> (ambos caem em 2020 e recuperam depois).</li></ul><h4>5.4.2 Tipos de desemprego</h4><p><strong>O emprego e o desemprego não são todos iguais:</strong></p><ul><li>Pessoas empregadas ≠ horas de trabalho — na análise usam-se frequentemente horas (trabalhar 20 h não é o mesmo que 40 h).</li><li>O impacto do desemprego é diferente consoante a <strong>idade</strong> e a <strong>duração</strong>.</li><li>Paradoxalmente, as pessoas desempregadas há mais tempo são as que têm mais dificuldade em voltar a arranjar emprego.</li></ul><p><strong>Quanto à origem:</strong></p><ul><li><strong>Friccional</strong> (tempo de procura/mudança entre empregos)</li><li><strong>Cíclico</strong> (associado às flutuações da atividade económica)</li><li><strong>Estrutural</strong> — principais razões: demográficas, legislativas, tecnológicas, preferências dos consumidores</li></ul><p><strong>Quanto à decisão do desempregado:</strong> voluntário e involuntário.</p><h4>5.4.3 Da população total à população empregada e à taxa de desemprego (INE, 4.º trim. 2023, milhares)</h4><table><tr><td>População total</td><td>10 639,7</td></tr><tr><td>População em idade ativa (16-89 anos)</td><td>8 872,6 (fora: &lt;16 e &gt;89 anos)</td></tr><tr><td>População ativa</td><td>5 335,1 (homens 2 671,7; mulheres 2 663,4)</td></tr><tr><td>População inativa</td><td>3 537,5</td></tr><tr><td>População empregada</td><td>4 980,5</td></tr><tr><td>População desempregada</td><td>354,6 (homens 170,4; mulheres 184,3)</td></tr></table><p>Taxas apresentadas no slide: taxa de atividade 61,0%; taxa de emprego 56,9%; <strong>taxa de desemprego 6,6%</strong> (homens 6,4%; mulheres 6,9%). (Nota: o quadro tem o título «Portugal – Dezembro de 2018», mas a fonte indicada é o 4.º trimestre de 2023.)</p><h4>Fórmulas</h4><ul><li><strong>Taxa de atividade</strong> (16-89) = População ativa / População em idade ativa (16-89) × 100</li><li><strong>Taxa de emprego</strong> (16-89) = População empregada / População em idade ativa (16-89) × 100</li><li><strong>Taxa de desemprego</strong> = População desempregada / <strong>População ativa</strong> × 100 → 354,6/5 335,1 ≈ 6,6%</li></ul><p>Notas metodológicas do INE: a população empregada considera indivíduos entre 16 e 89 anos (conceito usado no Inquérito ao Emprego desde o 1.º trimestre de 2021); a população desempregada considera indivíduos entre 16 e 74 anos (acima desta idade são inativos); até ao 4.º trimestre de 2020 considerava-se população ativa a de 15 ou mais anos. Ativos = empregados + desempregados.</p><h4>5.4.4 Fluxos trimestrais entre estados do mercado de trabalho (INE, 1.º trim. 2025)</h4><p>O diagrama mostra os fluxos brutos (e líquidos) entre <strong>Emprego</strong>, <strong>Desemprego</strong> e <strong>Inatividade (16-89)</strong> de um trimestre para o seguinte, em milhares e em % do estado inicial. Ex.: 96,8% dos empregados mantêm-se empregados; 59,4% dos desempregados continuam desempregados, enquanto ≈ 24,2% passam ao emprego e ≈ 16,4% à inatividade; 95,0% dos inativos mantêm-se inativos. Ilustra que o mercado de trabalho é dinâmico: os stocks (empregados, desempregados) resultam de fluxos de entrada e saída.</p>","keyTerms":[{"term":"População ativa","def":"Empregados + desempregados (pessoas disponíveis para trabalhar)."},{"term":"População em idade ativa","def":"População com 16-89 anos (critério atual do INE)."},{"term":"Taxa de desemprego","def":"População desempregada / população ativa × 100."},{"term":"Taxa de atividade","def":"População ativa / população em idade ativa × 100."},{"term":"Taxa de emprego","def":"População empregada / população em idade ativa × 100."},{"term":"Desemprego friccional","def":"Resulta do tempo de procura e de transição entre empregos."},{"term":"Desemprego cíclico","def":"Associado às fases de contração do ciclo económico."},{"term":"Desemprego estrutural","def":"Resulta de alterações demográficas, legislativas, tecnológicas ou nas preferências dos consumidores."}],"questions":[{"q":"Com população em idade ativa de 8 872,6, população ativa de 5 335,1, população empregada de 4 980,5 e população desempregada de 354,6 (milhares), a taxa de desemprego é aproximadamente:","options":["6,6%","4,0%","7,1%","3,3%"],"answer":0,"explanation":"Taxa de desemprego = desempregados/população ativa × 100 = 354,6/5 335,1 × 100 ≈ 6,6%. Dividir pela população em idade ativa (4,0%) ou pelos empregados (7,1%) usa o denominador errado.","id":"q1vcwoa2"},{"q":"Muitos trabalhadores de um setor perdem o emprego porque as suas funções foram automatizadas e as suas competências deixaram de ser procuradas. Segundo a classificação quanto à origem, trata-se de desemprego:","options":["Friccional.","Cíclico.","Voluntário.","Estrutural."],"answer":3,"explanation":"As razões tecnológicas (tal como as demográficas, legislativas e de preferências dos consumidores) estão na origem do desemprego estrutural. O cíclico resultaria de uma recessão; voluntário/involuntário é uma classificação quanto à decisão, não à origem.","id":"q4gqtuj"},{"q":"Os gráficos de Portugal (2013-2023) sobre emprego, desemprego e PIB mostram que:","options":["Emprego e desemprego evoluem no mesmo sentido, e o PIB em sentido contrário ao emprego.","Emprego e desemprego evoluem em sentido contrário, e o PIB e o emprego no mesmo sentido.","O emprego não reagiu à queda do PIB em 2020.","O desemprego diminuiu em 2020, acompanhando a queda do PIB."],"answer":1,"explanation":"Os slides destacam a evolução em sentido contrário de emprego e desemprego e a evolução no mesmo sentido do PIB e do emprego (em 2020 ambos caíram, e o desemprego subiu).","id":"qhl0cvp"}],"key":"u5-5.4"},{"id":"5.5","title":"5.5 Monitorização da inflação: índices de preços, IPC e taxas de inflação","pages":[163,173],"summary":"<h4>5.5.1 Flutuações nos preços — o que é um índice</h4><p>Quando uma grandeza evolui no tempo ou no espaço, o <strong>índice</strong> permite passar de um valor para outro <strong>de forma multiplicativa</strong>. Ex.: partindo de 200: 160 = 200 − 40 ou 160 = 200 × 0,8; 200 = 200 + 0 ou 200 × 1,0; 240 = 200 + 40 ou 200 × 1,2. 0,8, 1,0 e 1,2 são números índices. Vantagem: são <strong>adimensionais</strong> (não dependem das unidades) e podem associar-se à variação em percentagem a partir de um valor de partida. Um <strong>índice de preços</strong> é formado por números índices que dizem como variaram os preços num intervalo de tempo, numa perspetiva multiplicativa.</p><h4>Portugal – preços no consumidor 2019-2023</h4><p>O gráfico mostra o IPC (taxa de variação homóloga), o IPC (taxa de variação média dos últimos 12 meses) e a inflação subjacente. Inflação próxima de 0% em 2019-2020, subida forte a partir de 2021, pico homólogo ≈ 10% no outono de 2022, e descida em 2023 (≈ 1,4% homóloga em dez-2023). A média dos 12 meses reage com atraso (pico ≈ 8,6% no início de 2023, ainda ≈ 4,3% em dez-2023). A <strong>inflação subjacente</strong> exclui os preços dos <strong>produtos alimentares não transformados e dos produtos energéticos</strong>.</p><h4>5.5.2 O índice de preços e as diferentes taxas de inflação</h4><p>O fundamental: o índice de preços dá o crescimento dos preços a partir de um dado momento (a <strong>base</strong>), que pode variar.</p><ul><li><strong>Taxa de inflação mensal</strong> – crescimento dos preços de um mês para o mês consecutivo.</li><li><strong>Taxa de inflação homóloga</strong> – de um mês para o mês com o mesmo nome do ano seguinte (ex.: setembro 2015 → setembro 2016).</li><li><strong>Taxa de inflação média anual</strong> (muitas vezes só «taxa de inflação anual») – crescimento médio dos preços de um ano para outro.</li></ul><h4>Índice de Preços no Consumidor (IPC)</h4><p>Indicador que mede a evolução conjunta no tempo dos preços de um <strong>conjunto de bens e serviços («cabaz»)</strong> representativo da <strong>estrutura de consumo</strong> da população residente em Portugal. A estrutura do consumo baseia-se no Inquérito aos Orçamentos Familiares (INE). O <strong>IHPC</strong> (Índice Harmonizado) inclui também a <strong>despesa dos turistas</strong> (não considerada no IPC).</p><p><strong>Estrutura de ponderação 2023 (‰, classes COICOP):</strong></p><table><tr><th>Classe</th><th>IPC</th><th>IHPC</th></tr><tr><td>01 Produtos alimentares e bebidas não alcoólicas</td><td>219,3</td><td>206,4</td></tr><tr><td>02 Bebidas alcoólicas e tabaco</td><td>35,9</td><td>34,0</td></tr><tr><td>03 Vestuário e calçado</td><td>58,6</td><td>58,4</td></tr><tr><td>04 Habitação, água, eletricidade, gás e outros combustíveis</td><td>103,3</td><td>93,8</td></tr><tr><td>05 Acessórios para o lar, equipamento doméstico…</td><td>74,7</td><td>70,3</td></tr><tr><td>06 Saúde</td><td>67,7</td><td>62,3</td></tr><tr><td>07 Transportes</td><td>144,4</td><td>143,3</td></tr><tr><td>08 Comunicações</td><td>30,8</td><td>27,9</td></tr><tr><td>09 Lazer, recreação e cultura</td><td>63,2</td><td>47,5</td></tr><tr><td>10 Educação</td><td>18,5</td><td>16,8</td></tr><tr><td>11 Restaurantes e hotéis</td><td>77,2</td><td>141,8</td></tr><tr><td>12 Bens e serviços diversos</td><td>106,2</td><td>97,4</td></tr><tr><td>Total</td><td>1 000</td><td>1 000</td></tr></table><p>É publicado um índice para cada uma das doze classes e um índice global; também para cada uma das sete regiões de Portugal. Note-se o peso muito maior de restaurantes e hotéis no IHPC (despesa dos turistas).</p><h4>A taxa de inflação é uma taxa de variação</h4><p>Taxa de inflação = taxa de variação do nível de preços (dado pelo IPC) = (valor final − valor inicial)/valor inicial × 100.</p><ul><li>Inflação<sub>mensal</sub> = (IPC do mês − IPC do mês anterior)/IPC do mês anterior × 100</li><li>Inflação homóloga<sub>mês i</sub> = (IPC mês i do ano − IPC mês i do ano anterior)/IPC mês i do ano anterior × 100</li><li>Inflação<sub>anual</sub> = (IPC do ano − IPC do ano anterior)/IPC do ano anterior × 100, usando geralmente como IPC do ano a <strong>média dos 12 índices mensais</strong>.</li></ul><h4>Aplicação com índices reais de Portugal (IPC base 2008)</h4><table><tr><th>Mês</th><th>2010</th><th>2011</th><th>2012</th></tr><tr><td>Janeiro</td><td>98,84</td><td>102,40</td><td>105,99</td></tr><tr><td>Agosto</td><td>100,72</td><td>103,65</td><td>106,84</td></tr><tr><td>Setembro</td><td>100,91</td><td>104,49</td><td>107,50</td></tr><tr><td>Novembro</td><td>101,51</td><td>105,51</td><td>107,50</td></tr><tr><td>Dezembro</td><td>101,81</td><td>105,49</td><td>107,51</td></tr></table><ul><li><strong>a) Mensal:</strong> setembro 2012: (107,50 − 106,84)/106,84 × 100 = <strong>0,62%</strong>; dezembro 2012: (107,51 − 107,50)/107,50 × 100 = <strong>0,01%</strong>.</li><li><strong>b) Homóloga:</strong> setembro 2012: (107,50 − 104,49)/104,49 × 100 = <strong>2,88%</strong>; dezembro 2012: (107,51 − 105,49)/105,49 × 100 = <strong>1,92%</strong>.</li><li><strong>c) Média dos últimos 12 meses</strong> (taxa de variação da média dos preços): somas de outubro do ano anterior a setembro: 1 238,82 (2011) e 1 279,16 (2012) → (1 279,16/12 − 1 238,82/12)/(1 238,82/12) × 100 = <strong>3,26%</strong>; somas de janeiro a dezembro: 1 250,74 (2011) e 1 285,43 (2012) → <strong>2,77%</strong> (= inflação média anual de 2012).</li></ul><h4>Inflação, deflação e estagflação</h4><p>A <strong>deflação</strong> é o contrário da inflação: descida do nível geral de preços (aplicam-se as mesmas regras de cálculo). Sobre a <strong>estagflação</strong>, o slide indica que «ocorre quando os preços permanecem os mesmos». (Atenção: na literatura habitual, estagflação designa a combinação de estagnação/recessão da atividade com inflação elevada — confirmar com o docente.)</p><h4>Anexo 1 – Evolução, em termos reais, do salário mínimo em Portugal</h4><p>Criado após a Revolução de 1974, fixado em 3 300 escudos (≈ 16,5 €; ≈ 200 escudos por euro). Em termos <strong>nominais</strong> nunca desceu, mas em termos <strong>reais</strong> (poder de compra) teve subidas e descidas — importante para compreender as reivindicações sindicais. A conversão do salário nominal em salário a preços constantes faz-se através de números índices.</p><table><tr><th>Ano</th><th>Nominal (€)</th><th>Real (preços de 2016)</th></tr><tr><td>1974</td><td>16,5</td><td>537,9</td></tr><tr><td>1975</td><td>20,0</td><td>555,9</td></tr><tr><td>1984</td><td>77,8</td><td>362,3</td></tr><tr><td>2000</td><td>318,2</td><td>436,4</td></tr><tr><td>2011-2014</td><td>485,0</td><td>503,9 → 496,3</td></tr><tr><td>2016</td><td>530,0</td><td>530,0</td></tr><tr><td>2023</td><td>760,0</td><td>649,6</td></tr><tr><td>2024</td><td>820,0</td><td>–</td></tr></table><p>O salário real caiu fortemente de 1975 até meados dos anos 80 (inflação elevada), recuperou lentamente e só nos anos 2010-2020 superou claramente o nível de 1974-75. Em 2016 (ano base) nominal = real.</p>\n<h4>Gráfico: Portugal – Salário Mínimo Nacional de 1974 a 2023, a preços de 2016</h4>\n<p>Fonte: Pordata. O gráfico mostra duas séries: o <strong>salário nominal</strong> (em euros correntes) e o <strong>salário real</strong> (a preços de 2016). Passou-se da série dos salários nominais para a série dos salários reais <strong>através de números índices</strong> (deflacionando pelos preços). \"Estas duas séries falam…\"</p>\n<ul>\n<li><strong>Salário nominal</strong>: sobe continuamente, de <strong>16,5 €</strong> em 1974 para <strong>760,0 €</strong> em 2023.</li>\n<li><strong>Salário real (preços de 2016)</strong>: 537,8 € em 1974; máximo de <strong>555,9 € em 1975</strong>; cai para 411,6 € em 1977; recupera para 482,2 € em 1980; mínimo de <strong>362,3 € em 1984</strong> (anos de inflação muito elevada); depois fica praticamente estagnado (≈ 380-440 €) entre meados dos anos 80 e 2007; sobe para 511,5 € em 2010; 530,0 € em 2016; <strong>649,6 € em 2023</strong>.</li>\n<li>As duas séries <strong>cruzam-se em 2016</strong> (530,0 €), porque 2016 é o <strong>ano-base</strong>: nesse ano o valor nominal coincide com o valor real.</li>\n<li>Antes de 2016 o salário real está acima do nominal (os preços eram mais baixos que os de 2016); depois de 2016 fica abaixo.</li>\n</ul>\n<p><strong>Conclusão:</strong> o enorme crescimento nominal (≈ 46 vezes) esconde um crescimento real muito modesto – o poder de compra do salário mínimo em 2023 é apenas cerca de 2
